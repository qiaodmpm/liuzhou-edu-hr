* { margin: 0; padding: 0; box-sizing: border-box; }
:root {

body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.topnav-title { font-size:17px; font-weight:600; color:#fff; letter-spacing:1px; }
.topnav-right { display:flex; align-items:center; gap:18px; }
.topnav-bell { position:relative; cursor:pointer; color:rgba(255,255,255,0.85); padding:6px; border-radius:6px; transition:var(--transition); }
.topnav-bell:hover { background:rgba(255,255,255,0.1); color:#fff; }
.topnav-bell .badge { position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.topnav-user { display:flex; align-items:center; gap:8px; cursor:pointer; color:rgba(255,255,255,0.9); padding:6px 12px; border-radius:6px; transition:var(--transition); font-size:13px; position:relative; }

.user-dropdown.show { display:block; }
.user-dropdown a { display:block; padding:12px 18px; font-size:13px; color:var(--text); text-decoration:none; transition:var(--transition); }
.user-dropdown a:hover { background:var(--primary-light); color:var(--primary); }
.sidebar { position:fixed; top:56px; left:0; bottom:0; width:var(--sidebar-w); background:#1E3A8A; z-index:90; overflow-y:auto; display:flex; flex-direction:column; transition:width var(--transition); }
.sidebar.collapsed { width:64px; }
.sidebar.collapsed .menu-label,.sidebar.collapsed .menu-group,.sidebar.collapsed .menu-badge,.sidebar.collapsed .role-switcher-label,.sidebar.collapsed .role-switcher-name { display:none; }

.sidebar-bottom { border-top:1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display:flex; align-items:center; gap:8px; padding:10px 20px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.5); transition:var(--transition); }
.sidebar-toggle:hover { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.8); }

.role-switch-btn:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.8); }
.role-switch-btn.active { background:rgba(59,130,246,0.2); color:#fff; border-color:rgba(59,130,246,0.4); font-weight:500; }

.role-switch-dot.city { background:#3B82F6; } .role-switch-dot.district { background:#F59E0B; } .role-switch-dot.school { background:#10B981; } .role-switch-dot.teacher { background:#A78BFA; }
.main { margin-left:var(--sidebar-w); margin-top:56px; padding:24px; min-height:calc(100vh - 56px); transition:margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left:64px; }
.breadcrumb { font-size:12px; color:var(--text-light); margin-bottom:16px; }
.breadcrumb a { color:var(--text-light); text-decoration:none; }
.breadcrumb a:hover { color:var(--primary); }

.page-header { margin-bottom:20px; display:flex; align-items:flex-start; justify-content:space-between; }

.exit-table td { padding:6px; border:1px solid var(--border); text-align:center; vertical-align:middle; }
.exit-table input, .exit-table select { width:100%; padding:6px 8px; font-size:12px; border:1px solid var(--border); border-radius:4px; font-family:inherit; outline:none; }
.exit-table input:focus, .exit-table select:focus { border-color:var(--accent); }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; font-size:13px; font-weight:500; border-radius:6px; cursor:pointer; font-family:inherit; transition:var(--transition); border:1px solid transparent; text-decoration:none; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { background:var(--primary-dark); }
.btn-outline { background:#fff; color:var(--text-secondary); border:1px solid var(--border); }
.btn-outline:hover { background:var(--gray-bg); }
.btn-lg { padding:10px 28px; font-size:14px; }
.btn-delete-row { background:#FEF2F2; color:var(--danger); font-size:12px; padding:4px 10px; border-radius:4px; border:none; cursor:pointer; font-family:inherit; }
.btn-delete-row:hover { background:#FEE2E2; }
.btn-add-row { margin-top:12px; padding:8px 20px; font-size:13px; background:#fff; color:var(--primary); border:1px dashed var(--accent); border-radius:6px; cursor:pointer; font-family:inherit; transition:var(--transition); }
.btn-add-row:hover { background:var(--primary-light); }
.form-footer { display:flex; justify-content:space-between; align-items:center; padding-top:8px; }
.checklist-container { display:flex; flex-direction:column; gap:4px; }
.checklist-item { display:flex; align-items:center; gap:4px; font-size:11px; padding:3px 0; }
.checklist-icon { font-size:12px; flex-shrink:0; }
.checklist-name { flex-shrink:0; color:var(--text-secondary); min-width:110px; font-size:10px; }
.checklist-upload-btn { font-size:10px; padding:2px 8px; background:#F8FAFC; border:1px solid var(--border); border-radius:3px; cursor:pointer; color:var(--primary); font-family:inherit; flex-shrink:0; }
.checklist-upload-btn:hover { background:var(--primary-light); }
.checklist-file-name { font-size:10px; color:#10B981; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60px; cursor:default; }
.file-remove { color:var(--danger); cursor:pointer; font-size:12px; flex-shrink:0; }
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#1E293B; color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:9999; animation:toastIn .3s ease; box-shadow:var(--shadow-lg); }
.toast.warning { background:var(--warning); color:#1E293B; }
.toast.success { background:var(--success); }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
</style>
</head>

    DEMO_CONTRACT_STAFF.forEach(function(s){h+='<option value="'+s.name+'"'+(t.name===s.name?' selected':'')+'>'+s.name+'</option>';});
    h+='</select></td>';
    h+='<td><select onchange="modalTeachers['+i+'].gender=this.value;renderEntryRows();"><option value="">请选择</option><option value="男"'+(t.gender==='男'?' selected':'')+'>男</option><option value="女"'+(t.gender==='女'?' selected':'')+'>女</option></select></td>';
    h+='<td><input value="'+escapeHtml(t.idCard)+'" placeholder="18位身份证号" maxlength="18" oninput="modalTeachers['+i+'].idCard=this.value;"></td>';
    h+='<td><select onchange="modalTeachers['+i+'].exitType=this.value;renderEntryRows();"><option value="">请选择</option>';
    EXIT_TYPES.forEach(function(opt){h+='<option value="'+opt+'"'+(t.exitType===opt?' selected':'')+'>'+opt+'</option>';});
    h+='</select></td>';
    h+='<td><input type="date" value="'+escapeHtml(t.exitDate)+'" oninput="modalTeachers['+i+'].exitDate=this.value;"></td>';
    h+='<td><div class="checklist-container">';
    var mats=t.materials||{};
    EXIT_MATERIALS.forEach(function(item){
      var uploaded=mats[item];
      var isMulti=item===MULTI_FILE_MATERIAL;
      var hasFiles=isMulti?(Array.isArray(uploaded)&&uploaded.length>0):!!uploaded;
      var hint=isMulti?'(可上传多个)':'(单文件)';
      h+='<div class="checklist-item">';
      h+='<span class="checklist-icon">'+(hasFiles?'☑':'☐')+'</span>';
      h+='<span class="checklist-name">'+escapeHtml(item)+' <span style="font-size:9px;color:var(--text-light);">'+hint+'</span></span>';
      h+='<button class="checklist-upload-btn" onclick="triggerMaterialUpload(event,'+i+',\''+escapeHtml(item)+'\')">上传</button>';
      if(hasFiles){
        if(isMulti){
          uploaded.forEach(function(f,fi){
            h+='<span style="display:inline-flex;align-items:center;gap:1px;">';
            h+='<span class="checklist-file-name" title="'+escapeHtml(f.name)+'" style="max-width:60px;">'+escapeHtml(f.name.substring(0,6))+'...</span>';
            h+='<span class="file-remove" onclick="event.stopPropagation();removeMaterialFile('+i+',\''+escapeHtml(item)+'\','+fi+')">×</span>';
            h+='</span>';
          });
        }else{
          h+='<span style="display:inline-flex;align-items:center;gap:1px;">';
          h+='<span class="checklist-file-name" title="'+escapeHtml(uploaded.name)+'" style="max-width:60px;">'+escapeHtml(uploaded.name.substring(0,8))+'...</span>';
          h+='<span class="file-remove" onclick="event.stopPropagation();removeMaterialFile('+i+',\''+escapeHtml(item)+'\')">×</span>';
          h+='</span>';
        }
      }
      h+='</div>';
    });
    h+='</div></td>';
    h+='<td style="text-align:center;"><button class="btn-delete-row" onclick="deleteTeacherRow('+i+')">×</button></td>';
    h+='</tr>';
  });
  tb.innerHTML=h;
  var fiContainer=document.getElementById('rowFileInputs');
  var fiHtml='';
  modalTeachers.forEach(function(t,i){fiHtml+='<input type="file" id="rowFileInput_'+i+'" accept=".pdf,.jpg,.jpeg,.png,.bmp,.gif,.doc,.docx,.xls,.xlsx" style="display:none;" onchange="handleMaterialFile('+i+',event)">';});
  fiContainer.innerHTML=fiHtml;
}

function onContractNameChange(idx,val){
  modalTeachers[idx].name=val;
  var found=null;
  for(var i=0;i<DEMO_CONTRACT_STAFF.length;i++){if(DEMO_CONTRACT_STAFF[i].name===val){found=DEMO_CONTRACT_STAFF[i];break;}}
  if(found){modalTeachers[idx].gender=found.gender;modalTeachers[idx].idCard=found.idCard;}
  else{modalTeachers[idx].gender='';modalTeachers[idx].idCard='';}
  renderEntryRows();
}
function addTeacherRow(){modalTeachers.push({name:'',gender:'',idCard:'',exitType:'',exitDate:'',materials:{}});renderEntryRows();}
function deleteTeacherRow(i){if(modalTeachers.length<=1){showToast('至少保留 1 名教师','warning');return;}modalTeachers.splice(i,1);renderEntryRows();}

function triggerMaterialUpload(e,idx,itemName){e.stopPropagation();pendingMaterialUpload={rowIdx:idx,materialItem:itemName};var fi=document.getElementById('rowFileInput_'+idx);if(fi){fi.value='';fi.click();}}
function handleMaterialFile(idx,event){
  if(!event.target.files||!event.target.files[0]){pendingMaterialUpload=null;return;}
  var file=event.target.files[0];
  var err=validateFile(file);if(err){showToast(err,'warning');pendingMaterialUpload=null;return;}
  if(!pendingMaterialUpload||pendingMaterialUpload.rowIdx!==idx){pendingMaterialUpload=null;return;}
  var itemName=pendingMaterialUpload.materialItem;pendingMaterialUpload=null;
  if(!modalTeachers[idx].materials) modalTeachers[idx].materials={};
  if(itemName===MULTI_FILE_MATERIAL){
    if(!Array.isArray(modalTeachers[idx].materials[itemName])) modalTeachers[idx].materials[itemName]=[];
    modalTeachers[idx].materials[itemName].push(file);
  }else{modalTeachers[idx].materials[itemName]=file;}
  renderEntryRows();event.target.value='';
}
function removeMaterialFile(rowIdx,itemName,fileIndex){
  if(modalTeachers[rowIdx]&&modalTeachers[rowIdx].materials){
    if(itemName===MULTI_FILE_MATERIAL&&fileIndex!==undefined){var arr=modalTeachers[rowIdx].materials[itemName];if(Array.isArray(arr)){arr.splice(fileIndex,1);if(arr.length===0)delete modalTeachers[rowIdx].materials[itemName];}}
    else{delete modalTeachers[rowIdx].materials[itemName];}
  }
  renderEntryRows();
}

/* ---------- submit ---------- */
function collectTeachers(){
  return modalTeachers.map(function(t){
    var mats={};var src=t.materials||{};
    EXIT_MATERIALS.forEach(function(item){
      if(item===MULTI_FILE_MATERIAL){if(Array.isArray(src[item])&&src[item].length>0){mats[item]=src[item].map(function(f){return{name:f.name,size:f.size};});}}
      else{if(src[item]) mats[item]={name:src[item].name,size:src[item].size};}
    });
    return{name:t.name,gender:t.gender,idCard:t.idCard,exitType:t.exitType,exitDate:t.exitDate,materials:mats};
  });
}

function submitForm(){
  if(modalTeachers.length<1){showToast('请至少录入 1 名教师','warning');return;}
  for(var i=0;i<modalTeachers.length;i++){
    var t=modalTeachers[i];var n=i+1;
    if(!t.name||!t.name.trim()){showToast('第'+n+'行：请选择姓名','warning');return;}
    if(!t.gender){showToast('第'+n+'行：请选择性别','warning');return;}
    if(!t.idCard||!/^\d{17}[\dXx]$/.test(t.idCard.trim())){showToast('第'+n+'行：身份证号格式不正确','warning');return;}
    if(!t.exitType){showToast('第'+n+'行：请选择离职类型','warning');return;}
    if(!t.exitDate){showToast('第'+n+'行：请选择离职日期','warning');return;}
  }

  var all=loadRecords();
  var now=new Date();
  var datePart=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate());
  var ts=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());

  var mappedTeachers=collectTeachers();

  if(editRecordId){
    for(var i=0;i<all.length;i++){if(all[i].id===editRecordId){all[i].teachers=mappedTeachers;all[i].status='pending';all[i].submitTime=ts;all[i].rejectReason='';break;}}
    saveRecords(all);
    showToast('修改重提成功，已重新提交审核','success');
    setTimeout(function(){window.location.href='contract-exit-list-school.html';},1200);
    return;
  }

  var stored=JSON.parse(localStorage.getItem('exit_seq')||'{"date":"","seq":0}');
  if(stored.date!==datePart){stored.date=datePart;stored.seq=0;}
  stored.seq++;localStorage.setItem('exit_seq',JSON.stringify(stored));
  var newId='CX'+datePart+pad3(stored.seq);
  var rec={id:newId,schoolName:currentSchool,district:currentDistrict,status:'pending',submitTime:ts,teachers:mappedTeachers,reviewer:null,reviewTime:null,rejectReason:'',timeline:[{time:ts,action:'学校提交申报',operator:'王玉兰'}]};
  all.unshift(rec);saveRecords(all);
  showToast('离职申报已提交，等待审核','success');
  setTimeout(function(){window.location.href='contract-exit-list-school.html';},1200);
}

/* ---------- edit mode ---------- */
function loadForEdit(id){
  var all=loadRecords();var rec=null;
  for(var i=0;i<all.length;i++){if(all[i].id===id){rec=all[i];break;}}
  if(!rec)return;editRecordId=id;
  modalTeachers=(rec.teachers||[]).map(function(t){
    var mats=t.materials||{};
    // normalize to file-like objects for checklist rendering
    var cf={};
    EXIT_MATERIALS.forEach(function(item){
      var v=mats[item];
      if(item===MULTI_FILE_MATERIAL&&Array.isArray(v)){cf[item]=v.map(function(f){return{name:f.name,size:f.size};});}
      else if(v&&!Array.isArray(v)){cf[item]={name:v.name,size:v.size};}
    });
    return{name:t.name||'',gender:t.gender||'男',idCard:t.idCard||'',exitType:t.exitType||'',exitDate:t.exitDate||'',materials:cf};
  });
  if(modalTeachers.length===0) modalTeachers.push({name:'',gender:'',idCard:'',exitType:'',exitDate:'',materials:{}});
  document.getElementById('pageTitle').textContent='修改离职申报 — '+escapeHtml(id);
  document.getElementById('bcPage').textContent='修改申报';
  document.getElementById('submitBtn').textContent='重新提交';
}

/* ---------- init ---------- */
(function init(){
  var params=new URLSearchParams(window.location.search);
  var id=params.get('id');
  renderSidebar();
  modalTeachers.push({name:'',gender:'',idCard:'',exitType:'',exitDate:'',materials:{}});
  renderEntryRows();
  if(id) loadForEdit(id);
})();
</script>
