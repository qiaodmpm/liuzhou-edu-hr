<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>个人中心 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

.card { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow); width: 480px; max-width: 100%; overflow: hidden; }
.card-header { padding: 24px 28px 0; }
.card-header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.card-header p { font-size: 13px; color: var(--text-secondary); }
.card-body { padding: 24px 28px 28px; }

.section { margin-bottom: 24px; }
.section-title { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px dashed var(--border); }

.info-row { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #F1F5F9; }
.info-row:last-child { border-bottom: none; }
.info-label { width: 100px; font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
.info-value { font-size: 13px; font-weight: 500; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.form-group input { width: 100%; padding: 10px 14px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; outline: none; }
.form-group input:focus { border-color: var(--accent); }
.form-group .hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }

.btn { padding: 10px 24px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }

.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: var(--radius); font-size: 13px; z-index: 1000; box-shadow: var(--shadow); }
.toast.success { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
.toast.error { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }

.text-link { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 12px; }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>👤 个人中心</h1>
    <p>管理您的账号信息和安全设置</p>
  </div>
  <div class="card-body">

    <!-- Basic info -->
    <div class="section">
      <div class="section-title">基本信息</div>
      <div class="info-row"><span class="info-label">姓名</span><span class="info-value" id="dispName">—</span></div>
      <div class="info-row"><span class="info-label">身份证号</span><span class="info-value" id="dispIdCard" style="font-family:monospace;">—</span></div>
      <div class="info-row"><span class="info-label">所属学校</span><span class="info-value" id="dispSchool">—</span></div>
    </div>

    <!-- Phone binding -->
    <div class="section">
      <div class="section-title">账号安全</div>
      <div class="info-row">
        <span class="info-label">手机号</span>
        <span class="info-value" id="dispPhone">—</span>
        <span style="margin-left:auto;"><span class="text-link" onclick="showPhoneForm()">绑定手机号</span></span>
      </div>
      <div id="phoneFormArea" style="display:none;margin-top:10px;padding:14px;background:#F8FAFC;border-radius:var(--radius);">
        <div class="form-group">
          <label>手机号</label>
          <input id="phoneInput" placeholder="输入11位手机号" maxlength="11">
          <div class="hint">绑定后可使用手机号登录和找回密码</div>
        </div>
        <button class="btn btn-primary" onclick="bindPhone()">确认绑定</button>
        <button class="btn btn-outline" onclick="hidePhoneForm()" style="margin-left:8px;">取消</button>
      </div>
    </div>

    <!-- Change password -->
    <div class="section">
      <div class="section-title">修改密码</div>
      <div class="form-group">
        <label>当前密码</label>
        <input id="oldPwd" type="password" placeholder="输入当前密码">
      </div>
      <div class="form-group">
        <label>新密码</label>
        <input id="newPwd" type="password" placeholder="8-20位，包含大小写字母和数字">
      </div>
      <div class="form-group">
        <label>确认新密码</label>
        <input id="confirmPwd" type="password" placeholder="再次输入新密码">
      </div>
      <button class="btn btn-primary" onclick="changePassword()">修改密码</button>
    </div>

    <div style="text-align:center;margin-top:8px;">
      <span class="text-link" onclick="window.location.href='workbench.html'">← 返回工作台</span>
    </div>

  </div>
</div>

<script>
// ===== LOAD USER DATA =====
var currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
var accounts = JSON.parse(localStorage.getItem('teacher_accounts') || '[]');
var myAccount = accounts.filter(function(a) { return a.idCard === currentUser.id; })[0];

document.getElementById('dispName').textContent = currentUser.name || '—';
document.getElementById('dispIdCard').textContent = currentUser.id || '—';
document.getElementById('dispSchool').textContent = currentUser.school || '—';
if (myAccount) {
  document.getElementById('dispPhone').textContent = myAccount.phone || '未绑定';
}

// ===== PHONE BINDING =====
function showPhoneForm() {
  document.getElementById('phoneFormArea').style.display = '';
  if (myAccount && myAccount.phone) {
    document.getElementById('phoneInput').value = myAccount.phone;
  }
}
function hidePhoneForm() {
  document.getElementById('phoneFormArea').style.display = 'none';
}

function bindPhone() {
  var phone = document.getElementById('phoneInput').value.trim();
  if (!phone) { showToast('请输入手机号', 'error'); return; }
  if (!/^\d{11}$/.test(phone)) { showToast('请输入正确的11位手机号', 'error'); return; }

  // Check uniqueness
  for (var i = 0; i < accounts.length; i++) {
    if (accounts[i].phone === phone && accounts[i].accountId !== myAccount.accountId) {
      showToast('该手机号已被其他账号绑定', 'error');
      return;
    }
  }

  if (myAccount) {
    myAccount.phone = phone;
    for (var j = 0; j < accounts.length; j++) {
      if (accounts[j].accountId === myAccount.accountId) {
        accounts[j].phone = phone;
        break;
      }
    }
    localStorage.setItem('teacher_accounts', JSON.stringify(accounts));
    document.getElementById('dispPhone').textContent = phone;
    hidePhoneForm();
    showToast('手机号绑定成功', 'success');
  }
}

// ===== CHANGE PASSWORD =====
function changePassword() {
  var oldPwd = document.getElementById('oldPwd').value;
  var newPwd = document.getElementById('newPwd').value;
  var confirmPwd = document.getElementById('confirmPwd').value;

  if (!oldPwd || !newPwd || !confirmPwd) { showToast('请填写所有密码字段', 'error'); return; }
  if (newPwd.length < 8 || newPwd.length > 20) { showToast('密码长度需为8-20位', 'error'); return; }
  if (newPwd !== confirmPwd) { showToast('两次输入的新密码不一致', 'error'); return; }

  if (myAccount) {
    if (oldPwd !== myAccount.password) { showToast('当前密码错误', 'error'); return; }
    myAccount.password = newPwd;
    for (var j = 0; j < accounts.length; j++) {
      if (accounts[j].accountId === myAccount.accountId) {
        accounts[j].password = newPwd;
        break;
      }
    }
    localStorage.setItem('teacher_accounts', JSON.stringify(accounts));
    document.getElementById('oldPwd').value = '';
    document.getElementById('newPwd').value = '';
    document.getElementById('confirmPwd').value = '';
    showToast('密码修改成功', 'success');
  } else {
    showToast('账号数据异常', 'error');
  }
}

// ===== TOAST =====
function showToast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2500);
}
</script>
</body>
</html>
