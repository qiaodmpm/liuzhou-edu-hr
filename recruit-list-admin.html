<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招聘岗位审核管理 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; transition: var(--transition); font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }
.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; display: flex; flex-direction: column; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label, .sidebar.collapsed .menu-group, .sidebar.collapsed .menu-badge, .sidebar.collapsed .role-switcher-label, .sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7); transition: var(--transition); position: relative; text-decoration: none; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }
.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px; min-height: calc(100vh - 56px); transition: margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.page-header-left h1 { font-size: 20px; font-weight: 700; }
.page-header-left .subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--transition); border: 1px solid transparent; font-family: inherit; text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-outline { background: #fff; color: var(--text-secondary); border-color: var(--border); }
.btn-outline:hover { border-color: var(--primary); }
.btn-outline-sm { padding: 4px 12px; font-size: 12px; background: #fff; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: inherit; }
.btn-outline-sm:hover { background: var(--gray-bg); }

/* Two-column */
.two-col-row { display: flex; gap: 20px; align-items: flex-start; }
.col-left { flex: 0 0 360px; min-width: 0; }
.col-right { flex: 1; min-width: 0; }
@media (max-width: 1400px) { .two-col-row { flex-direction: column; } .col-left { flex: none; width: 100%; } }

/* Batch cards */
.col-left-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.col-left-header .section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
.batch-list { display: flex; flex-direction: column; gap: 10px; }
.batch-card { background: #fff; border-radius: var(--radius-lg); padding: 14px 16px; border: 1.5px solid var(--border); cursor: pointer; transition: var(--transition); }
.batch-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
.batch-card.selected { border-color: var(--primary); background: var(--primary-light); }
.batch-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.batch-card-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }
.batch-card-status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; flex-shrink: 0; }
.batch-card-status.open { background: #EFF6FF; color: var(--primary); }
.batch-card-status.closed { background: #F1F5F9; color: #64748B; }
.batch-card-status.pending { background: #FEF3C7; color: #92400E; }
.batch-card-meta { font-size: 11px; color: var(--text-light); margin-bottom: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
.batch-card-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 4px; }
.batch-card-actions .btn { font-size: 11px; padding: 4px 12px; }

/* Status filters */
.status-filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.status-fbtn { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition); border: 1px solid var(--border); background: #fff; color: var(--text-secondary); font-family: inherit; }
.status-fbtn:hover { border-color: var(--accent); color: var(--primary); }
.status-fbtn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Table */
.table-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; }
.table-scroll { overflow-x: auto; }
.list-table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
.list-table th { padding: 10px 12px; text-align: center; font-weight: 600; font-size: 11px; color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border); }
.list-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: center; }
.list-table tr:last-child td { border-bottom: none; }
.list-table tr:hover { background: #FAFBFC; }
.list-table .col-id { color: var(--primary); font-weight: 500; }
.list-table .col-name { text-align: left; font-weight: 500; }
.list-table .col-action { white-space: nowrap; }
.status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.status-badge.review { background: #FEF3C7; color: #92400E; }
.status-badge.approved { background: #D1FAE5; color: #065F46; }
.status-badge.completed { background: #E0E7FF; color: #3730A3; }
.status-badge.rejected { background: #FEE2E2; color: #991B1B; }
.status-badge.pending { background: #F1F5F9; color: #64748B; }
.type-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; }
.type-tag.independent { background: #EFF6FF; color: var(--primary); }
.type-tag.public { background: #FEF3C7; color: #92400E; }
.type-tag.senior { background: #F3E8FF; color: #6B21A8; }
.action-links { display: flex; gap: 8px; justify-content: center; }
.action-link { font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: none; white-space: nowrap; }
.action-link:hover { text-decoration: underline; }
.action-link.warn { color: var(--danger); }
.action-link.readonly { color: var(--text-light); cursor: default; }
.action-link.readonly:hover { text-decoration: none; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 32px; margin-bottom: 8px; }
.empty-state .empty-text { font-size: 13px; }

/* Pagination */
.pagination { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 16px 0; }
.pagination button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text-secondary); transition: var(--transition); }
.pagination button:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
.pagination button:disabled { opacity: 0.35; cursor: not-allowed; }
.pagination .page-info { font-size: 12px; color: var(--text-light); margin: 0 8px; }

/* Unsubmitted remind button */
.btn-remind-sm { padding: 4px 12px; font-size: 12px; background: #fff; color: var(--primary); border: 1px solid var(--primary); border-radius: 4px; cursor: pointer; font-family: inherit; transition: var(--transition); }
.btn-remind-sm:hover { background: var(--primary-light); }
.btn-remind-sm.reminded { color: var(--text-light); border-color: var(--border); background: #F1F5F9; cursor: default; }
.badge-readonly { font-size: 10px; color: var(--text-light); margin-left: 6px; }

.card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 28px 32px; margin-bottom: 20px; }
.card-title { font-size: 15px; font-weight: 600; color: var(--text); padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }

.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease; box-shadow: var(--shadow-lg); }
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 480px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
.modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { cursor: pointer; color: var(--text-light); font-size: 20px; padding: 4px; border: none; background: none; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-body .form-group { margin-bottom: 16px; }
.modal-body .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
.modal-body .form-group input, .modal-body .form-group select, .modal-body .form-group textarea { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; outline: none; }
.modal-body .form-group input:focus, .modal-body .form-group select:focus, .modal-body .form-group textarea:focus { border-color: var(--accent); }
.modal-body .form-group textarea { resize: vertical; min-height: 80px; }
.modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.batch-detail-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px solid #F1F5F9; }
.batch-detail-row .bdl { color: var(--text-secondary); }
.batch-detail-row .bdv { color: var(--text); font-weight: 500; }

/* Multi-select dropdown (shared pattern) */
.multi-select-wrap { position: relative; display: inline-block; vertical-align: middle; }
.multi-select-trigger { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; min-width: 130px; font-family: inherit; color: var(--text); transition: var(--transition); white-space: nowrap; }
.multi-select-trigger:hover { border-color: var(--accent); }
.multi-select-trigger .arrow { font-size: 10px; color: var(--text-light); margin-left: auto; }
.multi-select-dropdown { display: none; position: absolute; top: 100%; left: 0; min-width: 160px; background: #fff; border: 1px solid var(--border); border-radius: 8px; z-index: 25; box-shadow: var(--shadow-lg); padding: 6px 0; }
.multi-select-dropdown.show { display: block; }
.multi-select-dropdown label { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: var(--transition); white-space: nowrap; }
.multi-select-dropdown label:hover { background: var(--primary-light); }
.multi-select-dropdown input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
/* Batch scope cascade */
.scope-cascade { margin-top: 4px; }
.scope-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; max-height: 80px; overflow: hidden; }
.scope-tags.expanded { max-height: none; overflow: visible; }
.scope-tag { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; font-size: 11px; background: var(--primary-light); color: var(--primary); border-radius: 4px; white-space: nowrap; }
.scope-tag .scope-tag-x { cursor: pointer; font-weight: 700; opacity: 0.5; line-height: 1; }
.scope-tag .scope-tag-x:hover { opacity: 1; }
.scope-tag-more { font-size: 11px; color: var(--accent); cursor: pointer; padding: 2px 4px; white-space: nowrap; }
.scope-tag-more:hover { text-decoration: underline; }
.scope-cascade-row { display: flex; gap: 8px; align-items: flex-start; }
.modal-body .scope-cascade-row select { width: auto; min-width: 130px; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; cursor: pointer; }
.scope-cascade .multi-select-wrap { flex: 1; }
.scope-cascade .multi-select-dropdown { max-height: 200px; overflow-y: auto; width: 100%; min-width: 0; }
.scope-cascade .multi-select-trigger { width: 100%; }
.modal-body .scope-cascade .multi-select-dropdown label { display: flex; font-weight: 400; margin-bottom: 0; }
.scope-multi-search { width: 100%; padding: 7px 12px; font-size: 12px; border: none; border-bottom: 1px solid var(--border); outline: none; font-family: inherit; background: #fff; }
.scope-multi-search:focus { border-bottom-color: var(--accent); }
</style>
</head>

</aside>

<main class="main" id="mainContent">
  <div class="breadcrumb">
    <a href="workbench.html">首页</a> &nbsp;/&nbsp; <span>招聘岗位审核管理</span>
  </div>

  <div class="page-header">
    <div class="page-header-left">
      <h1>招聘岗位审核管理</h1>
      <div class="subtitle" id="roleSubtitle">查看和管理全市学校的招聘岗位申报</div>
    </div>

// ===== AUDIT FLOW LOGIC =====
function getAuditFlow(schoolCategory, recruitmentType) {
  // 市直属 → 所有类型 市终审 (Flow A)
  if (schoolCategory === '市直属') {
    return { flow: 'A', steps: [{ level: 'first', reviewer: 'city', isFinal: true }] };
  }
  // 区属 + 自主招聘 → 区初审 + 市终审 (Flow B)
  if (recruitmentType === 'independent') {
    return { flow: 'B', steps: [
      { level: 'first', reviewer: 'district', isFinal: false },
      { level: 'second', reviewer: 'city', isFinal: true }
    ]};
  }
  // 区属 + 统一公招/中高级 → 区终审 市只读 (Flow C)
  return { flow: 'C', steps: [{ level: 'first', reviewer: 'district', isFinal: true }] };
}

function canAudit(record) {
  var flow = getAuditFlow(record.district, record.recruitmentType);

  // Determine current step based on status
  var currentStepLevel = null;
  if (record.status === 'pending_first') currentStepLevel = 'first';
  else if (record.status === 'pending_second') currentStepLevel = 'second';

  if (!currentStepLevel) return { can: false, level: null, isFinal: false, readonly: false };

  // Find the step
  var step = null;
  for (var i = 0; i < flow.steps.length; i++) {
    if (flow.steps[i].level === currentStepLevel) { step = flow.steps[i]; break; }
  }
  if (!step) return { can: false, level: null, isFinal: false, readonly: false };

  if (step.reviewer === currentRole) {
    return { can: true, level: step.level, isFinal: step.isFinal, readonly: false };
  }

  // City admin is read-only for Flow C
  if (currentRole === 'city' && flow.flow === 'C') {
    return { can: false, level: null, isFinal: true, readonly: true };
  }

  return { can: false, level: null, isFinal: false, readonly: false };
}

function getPermittedRecords() {
  var all = loadRecords();
  return all.filter(function(r) {
    if (currentRole === 'city') {
      // City sees: city-direct (all types) + district schools
      return true;
    }
    if (currentRole === 'district') {
      // District sees: only district schools
      return r.district === '鱼峰区';
    }
    return false;
  });
}

function seedDemoData() {
  // Always overwrite records and batches with latest demo data
  localStorage.setItem('recruit_records', JSON.stringify(DEMO_RECORDS));
  localStorage.setItem('recruit_batches', JSON.stringify(DEMO_BATCHES));
  // 统计表：仅当演示记录无已填统计表时填充（不覆盖用户录入）
  var st = localStorage.getItem('recruit_stats');
  var stAll = {};
  if (st) { try { stAll = JSON.parse(st); } catch(e) {} }
  var stChanged = false;
  Object.keys(DEMO_STATS).forEach(function(rid) {
    if (!stAll[rid]) { stAll[rid] = DEMO_STATS[rid]; stChanged = true; }
  });
  if (stChanged) localStorage.setItem('recruit_stats', JSON.stringify(stAll));
}

function loadRecords() {
  seedDemoData();

}

function loadBatches() {

}

}

function getRecruitStatsById(id) {

  return null;
}

function getTotalCount(formData) {
  if (!formData || !formData.positions) return 0;
  var total = 0;
  formData.positions.forEach(function(p) { total += (parseInt(p.count) || 0); });
  return total;
}

function getBatchStats(batchId) {
  var records = getPermittedRecords().filter(function(r) { return r.batchId === batchId; });
  var stats = { total: records.length, pending_first: 0, pending_second: 0, approved: 0, rejected: 0, completed: 0, passed: 0 };
  records.forEach(function(r) {
    if (r.status === 'pending_first') stats.pending_first++;
    else if (r.status === 'pending_second') stats.pending_second++;
    else if (r.status === 'first_approved') stats.approved++;
    else if (r.status === 'first_rejected' || r.status === 'second_rejected') stats.rejected++;
    else if (r.status === 'completed') stats.completed++;
    if (r.status === 'first_approved' || r.status === 'completed') stats.passed++;
  });
  return stats;
}

function getUnsubmittedSchools(batchId) {
  var batch = loadBatches().find(function(b) { return b.id === batchId; });
  if (!batch) return [];

  var records = loadRecords();
  var submittedSchools = {};
  records.filter(function(r) { return r.batchId === batchId; }).forEach(function(r) {
    submittedSchools[r.schoolName] = true;
  });

  var allSchools = [];
  var ALL = CITY_SCHOOLS.concat(DISTRICT_SCHOOLS);
  for (var i = 0; i < ALL.length; i++) {
    if (batchCoversSchool(batch, ALL[i])) allSchools.push(ALL[i]);
  }

  return allSchools.filter(function(s) { return !submittedSchools[s]; });
}

// 判断批次适用范围是否覆盖某所学校（兼容旧字符串 scope 与新的结构化 scope）
function batchCoversSchool(b, schoolName) {
  var scope = b.scope;
  if (scope && typeof scope === 'object') {
    if (scope.scopeType === 'all') return true;
    if (scope.scopeType === 'districts') {
      var dist = SCHOOL_DISTRICT_MAP[schoolName] || '';
      return (scope.scopeDistricts || []).indexOf(dist) >= 0;
    }
    if (scope.scopeType === 'schools') {
      return (scope.scopeSchools || []).indexOf(schoolName) >= 0;
    }
    return false;
  }
  if (scope === '全市') return true;
  if (scope === '区属' || scope === '指定区') {
    var dist2 = SCHOOL_DISTRICT_MAP[schoolName] || '';
    return (b.scopeAreas || []).indexOf(dist2) >= 0;
  }
  return false;
}

// 适用范围文案（兼容旧字符串 scope 与新的结构化 scope）
function formatScopeText(b) {
  var scope = b && b.scope;
  var scopeAreas = b && b.scopeAreas;
  if (scope && typeof scope === 'object') {
    if (scope.scopeType === 'all') return '全市';
    if (scope.scopeType === 'districts') {
      var ds = scope.scopeDistricts || [];
      if (!ds.length) return '部分区县';
      if (ds.length === 1) return ds[0];
      return '部分区县（' + ds.join('、') + '）';
    }
    if (scope.scopeType === 'schools') {
      var ss = scope.scopeSchools || [];
      return ss.length ? '部分学校（' + ss.length + '所）' : '部分学校';
    }
    return '—';
  }
  if (scope === '全市') return '全市';
  if (scope === '区属' || scope === '指定区') {
    var areas = scopeAreas || [];
    return areas.length ? areas.join('、') : '指定区';
  }
  return scope || '—';
}

function getAdminDistrict() {
  var u = (typeof currentUser !== 'undefined' && currentUser) ? currentUser : null;
  return (u && u.district) || '鱼峰区';
}

// ===== 适用范围级联数据（与编制使用申请保持一致）=====
function getScopeDistricts() {
  var orgDir = [];
  try { orgDir = JSON.parse(localStorage.getItem('org_directory') || '[]'); } catch(e) {}
  var districts = [];
  var seen = {};
  for (var i = 0; i < orgDir.length; i++) {
    var d = orgDir[i].district;
    if (d && !seen[d]) { seen[d] = true; districts.push(d); }
  }
  if (!districts.length) districts = ['市直属','鱼峰区','城中区','柳北区','柳南区'];
  var ORDER = ['市直属','柳城县','鹿寨县','融安县','融水苗族自治县','三江侗族自治县','柳北区','城中区','鱼峰区','柳南区','柳江区'];
  districts.sort(function(a, b) {
    var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    if (ia === -1) ia = 999; if (ib === -1) ib = 999;
    return ia - ib;
  });
  return districts;
}

function getScopeSchools(district) {
  var orgDir = [];
  try { orgDir = JSON.parse(localStorage.getItem('org_directory') || '[]'); } catch(e) {}
  var schools = [];
  for (var i = 0; i < orgDir.length; i++) {
    var o = orgDir[i];
    if (o.orgType === '学校' && (!district || o.district === district)) {
      schools.push(o.orgName);
    }
  }
  if (!orgDir.length) {
    var FB = { '市直属':['柳州高级中学','柳州市第一中学'], '鱼峰区':['柳州市第八中学','鱼峰区实验小学'] };
    schools = district ? (FB[district] || []) : (FB['市直属'] || []).concat(FB['鱼峰区'] || []);
  }
  schools.sort(function(a, b) { return a.localeCompare(b, 'zh'); });
  return schools;
}

// ===== UI HELPERS =====
function escapeHtml(str) { if (!str) return ''; return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg, type) { var el = document.createElement('div'); el.className = 'toast ' + (type||''); el.textContent = msg; document.getElementById('toastContainer').appendChild(el); setTimeout(function(){el.remove();}, 2000); }
function updateRemarkCount(el) { var suffix = el.id.replace('BatchRemark','RemarkCount'); var c = document.getElementById(suffix); if(c) c.textContent = el.value.length; }
function toggleUserMenu() { document.getElementById('userDropdown').classList.toggle('show'); }
document.addEventListener('click', function(e) { if (!e.target.closest('.topnav-user')) document.getElementById('userDropdown').classList.remove('show'); });

function switchRole(role) {

    currentStatusFilter = 'all';

function getStatusBadgeClass(status) {
  if (status === 'pending_first' || status === 'pending_second') return 'review';
  if (status === 'first_approved') return 'approved';
  if (status === 'first_rejected' || status === 'second_rejected') return 'rejected';
  if (status === 'completed') return 'completed';
  return '';
}

function getTypeTagClass(type) {
  if (type === 'independent') return 'independent';
  if (type === 'public') return 'public';

}

// ===== REMIND =====
function remindSchool(schoolName, batchId, e) {
  e.stopPropagation();
  var key = 'recruit_reminders';
  var reminders = {};
  try { reminders = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}

  var today = new Date().toISOString().substring(0, 10);
  var entry = reminders[schoolName + '_' + batchId];
  if (entry && entry.date === today) {
    showToast('今日已提醒过该学校', 'warning');
    return;
  }

  reminders[schoolName + '_' + batchId] = { date: today, time: new Date().toISOString(), batchId: batchId };
  localStorage.setItem(key, JSON.stringify(reminders));
  showToast('已向 ' + schoolName + ' 发送提醒', 'success');
  renderRightColumn();
}

function getLastRemind(schoolName, batchId) {
  var key = 'recruit_reminders';
  var reminders = {};
  try { reminders = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
  var entry = reminders[schoolName + '_' + batchId];
  if (entry) return entry;
  return null;
}

function getEmployUrl() {
  if (currentRole === 'city' || currentRole === 'district') return 'employ-list-admin.html?role=' + currentRole;
  if (currentRole === 'school') return 'employ-list-school.html';
  return null;
}

// ===== RENDER BATCH CARDS =====
function renderBatchCards() {
  var batches = loadBatches();
  if (yearFilter !== 'all') {
    batches = batches.filter(function(b) { return b.year === yearFilter; });
  }
  if (batches.length === 0) {
    document.getElementById('batchCardsArea').innerHTML = '<div class="col-left-header"><span class="section-title">招聘批次</span><button class="btn btn-primary btn-sm" onclick="showCreateBatchModal()">+ 新建批次</button></div><div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无招聘批次</div></div>';
    return;
  }

  var years = [];
  batches.forEach(function(b) { if (years.indexOf(b.year) < 0) years.push(b.year); });
  years.sort().reverse();

  var h = '<div class="col-left-header">';
  h += '<span class="section-title">招聘批次</span>';
  h += '<div style="display:flex;align-items:center;gap:8px;">';
  h += '<select onchange="setYearFilter(this.value)" style="padding:4px 8px;font-size:12px;border:1px solid var(--border);border-radius:4px;">';
  h += '<option value="all"' + (yearFilter==='all'?' selected':'') + '>全部年份</option>';
  years.forEach(function(y) { h += '<option value="' + y + '"' + (yearFilter===y?' selected':'') + '>' + y + '年</option>'; });
  h += '</select>';
  h += '<button class="btn btn-primary btn-sm" onclick="showCreateBatchModal()">+ 新建批次</button>';
  h += '</div></div><div class="batch-list">';

  batches.forEach(function(b) {
    var isSelected = b.id === selectedBatchId;
    var typeLabel = RECRUITMENT_TYPE_MAP[b.recruitmentType] || b.recruitmentType;
    h += '<div class="batch-card' + (isSelected ? ' selected' : '') + '" onclick="selectBatch(\'' + b.id + '\')">';
    h += '<div class="batch-card-header">';
    h += '<span class="batch-card-name" onclick="event.stopPropagation();showBatchDetail(\'' + b.id + '\')">' + b.name + '</span>';
    h += '<span class="batch-card-status ' + b.status + '">' + ({ pending:'待开始', open:'进行中', closed:'已关闭' }[b.status]||b.status) + '</span>';
    h += '</div>';
    h += '<div class="batch-card-meta">';
    h += '<span>' + typeLabel + '</span><span>' + (b.year||'') + '</span>';
    h += '<span>' + formatScopeText(b) + '</span>';
    h += '</div>';
    // Action buttons by status
    if (b.status === 'pending') {
      h += '<div class="batch-card-actions">';
      h += '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();showEditBatchModal(\'' + b.id + '\')">编辑</button>';
      h += '<button class="btn btn-outline btn-sm" style="color:var(--danger);" onclick="event.stopPropagation();deleteBatch(\'' + b.id + '\')">删除</button>';
      h += '</div>';
    } else if (b.status === 'open') {
      h += '<div class="batch-card-actions">';
      h += '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();showEditBatchModal(\'' + b.id + '\')">编辑</button>';
      h += '<button class="btn btn-outline btn-sm" style="color:var(--warning);" onclick="event.stopPropagation();closeBatch(\'' + b.id + '\')">关闭</button>';
      h += '</div>';
    } else if (b.status === 'closed') {
      h += '<div class="batch-card-actions">';
      h += '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();showEditBatchModal(\'' + b.id + '\')">编辑</button>';
      h += '</div>';
    }
    h += '</div>';
  });

  h += '</div>';
  document.getElementById('batchCardsArea').innerHTML = h;
}

function selectBatch(id) {
  selectedBatchId = (selectedBatchId === id) ? null : id;
  currentStatusFilter = 'all';
  currentPage = 1;
  renderBatchCards();
  renderRightColumn();
}

function setYearFilter(y) { yearFilter = y; selectedBatchId = null; currentPage = 1; renderBatchCards(); renderRightColumn(); }

// ===== 适用范围级联组件 =====
var _scopeSelectedDistricts = [];
var _scopeSelectedSchools = [];
var _scopeExpanded = false;

function renderScopeCascade(isDistrict) {
  var scopeType = (document.getElementById('scopeTypeHid') && document.getElementById('scopeTypeHid').value)
    || (document.getElementById('scopeTypeSelect') && document.getElementById('scopeTypeSelect').value)
    || 'all';
  var h = '';
  var tagsHtml = '';
  if (scopeType === 'districts') tagsHtml = renderScopeTags(_scopeSelectedDistricts, 'district');
  else if (scopeType === 'schools') tagsHtml = renderScopeTags(_scopeSelectedSchools, 'school');
  var typeOpts;
  if (isDistrict) {
    typeOpts = '<option value="all"' + (scopeType === 'all' ? ' selected' : '') + '>全区</option><option value="schools"' + (scopeType === 'schools' ? ' selected' : '') + '>部分学校</option>';
  } else {
    typeOpts = '<option value="all"' + (scopeType === 'all' ? ' selected' : '') + '>全市</option><option value="districts"' + (scopeType === 'districts' ? ' selected' : '') + '>部分区（县）</option><option value="schools"' + (scopeType === 'schools' ? ' selected' : '') + '>部分学校</option>';
  }
  h += '<input type="hidden" id="scopeTypeHid" value="' + scopeType + '">';
  h += '<input type="hidden" id="scopeDataHid" value="' + encodeURIComponent(JSON.stringify({ districts: _scopeSelectedDistricts, schools: _scopeSelectedSchools })) + '">';
  h += '<div class="scope-cascade-row">';
  h += '<select id="scopeTypeSelect" onchange="onScopeTypeChange()">' + typeOpts + '</select>';
  if (scopeType === 'districts') {
    var selDistricts = _scopeSelectedDistricts.slice();
    var trigText = selDistricts.length ? '已选 ' + selDistricts.length + ' 个区县' : '选择区县...';
    h += '<div class="multi-select-wrap" id="scopeDistrictDD">';
    h += '<div class="multi-select-trigger" onclick="toggleScopePanel(\'district\')"><span>' + trigText + '</span><span class="arrow">▼</span></div>';
    h += '<div class="multi-select-dropdown" id="scopeDistrictPanel">';
    var districts = getScopeDistricts();
    for (var di = 0; di < districts.length; di++) {
      var d = districts[di];
      var checked = selDistricts.indexOf(d) !== -1 ? ' checked' : '';
      h += '<label><input type="checkbox" value="' + d.replace(/"/g, '&quot;') + '"' + checked + ' onchange="onScopeDistrictToggle()"> ' + d + '</label>';
    }
    h += '</div></div>';
  } else if (scopeType === 'schools') {
    var selSchools = _scopeSelectedSchools.slice();
    var isDistrictAdmin = currentRole === 'district';
    var userDistrict = getAdminDistrict();
    var distFilter = isDistrictAdmin ? userDistrict : (document.getElementById('scopeSchoolDist') ? document.getElementById('scopeSchoolDist').value : 'all');
    var distOpts = '<option value="all"' + (isDistrictAdmin ? ' disabled' : '') + '>全部区县</option>';
    var districtsAll = getScopeDistricts();
    for (var dk = 0; dk < districtsAll.length; dk++) {
      distOpts += '<option value="' + districtsAll[dk].replace(/"/g, '&quot;') + '"' + (distFilter === districtsAll[dk] ? ' selected' : '') + '>' + districtsAll[dk] + '</option>';
    }
    h += '<select id="scopeSchoolDist" onchange="onScopeSchoolDistChange()"' + (isDistrictAdmin ? ' disabled' : '') + '>' + distOpts + '</select>';
    var trigText2 = selSchools.length ? '已选 ' + selSchools.length + ' 所学校' : '选择学校...';
    h += '<div class="multi-select-wrap" id="scopeSchoolDD">';
    h += '<div class="multi-select-trigger" onclick="toggleScopePanel(\'school\')"><span>' + trigText2 + '</span><span class="arrow">▼</span></div>';
    h += '<div class="multi-select-dropdown" id="scopeSchoolPanel">';
    h += '<input class="scope-multi-search" id="scopeSchoolSearch" placeholder="🔍 搜索学校..." oninput="filterScopeSchools()" onclick="event.stopPropagation()">';
    h += '<div id="scopeSchoolList">';
    h += renderScopeSchoolCheckboxes(distFilter, selSchools);
    h += '</div></div></div>';
  }
  h += '</div>';
  if (tagsHtml) {
    h += '<div style="margin-top:6px;"><div class="scope-tags' + (_scopeExpanded ? ' expanded' : '') + '" id="scopeTags">' + tagsHtml + '</div></div>';
  }
  return h;
}

function renderScopeTags(items, type) {
  var maxShow = 5;
  var h = '';
  var showItems = items;
  var remaining = 0;
  if (items.length > maxShow && !_scopeExpanded) {
    showItems = items.slice(0, maxShow);
    remaining = items.length - maxShow;
  }
  for (var i = 0; i < showItems.length; i++) {
    h += '<span class="scope-tag">' + showItems[i] + ' <span class="scope-tag-x" onclick="removeScopeItem(\'' + type + '\',\'' + showItems[i].replace(/'/g, "\\'") + '\')">×</span></span>';
  }
  if (remaining > 0) {
    h += '<span class="scope-tag-more" onclick="toggleScopeExpand()">等 ' + remaining + ' ' + (type === 'district' ? '个区' : '所') + ' 🔽展开</span>';
  }
  if (_scopeExpanded && items.length > maxShow) {
    h += '<span class="scope-tag-more" onclick="toggleScopeExpand()">🔼收起</span>';
  }
  return h;
}

function renderScopeSchoolCheckboxes(district, selected) {
  var schools = getScopeSchools(district === 'all' ? '' : district);
  var h = '';
  for (var i = 0; i < schools.length; i++) {
    var checked = selected.indexOf(schools[i]) !== -1 ? ' checked' : '';
    h += '<label><input type="checkbox" value="' + schools[i].replace(/"/g, '&quot;') + '"' + checked + ' onchange="onScopeSchoolToggle()"> ' + schools[i] + '</label>';
  }
  if (!schools.length) h += '<div style="padding:10px;font-size:12px;color:var(--text-light);text-align:center;">该区县暂无学校</div>';
  return h;
}

function onScopeTypeChange() {
  var typeEl = document.getElementById('scopeTypeSelect');
  var newType = typeEl ? typeEl.value : 'all';
  document.getElementById('scopeTypeHid').value = newType;
  _scopeSelectedSchools = [];
  _scopeExpanded = false;
  if (currentRole === 'district' && newType === 'all') {
    _scopeSelectedDistricts = [getAdminDistrict()];
  } else {
    _scopeSelectedDistricts = [];
  }
  refreshScopeCascade();
}

function onScopeDistrictToggle() {
  var cbs = document.querySelectorAll('#scopeDistrictPanel input[type="checkbox"]');
  _scopeSelectedDistricts = [];
  for (var i = 0; i < cbs.length; i++) {
    if (cbs[i].checked) _scopeSelectedDistricts.push(cbs[i].value);
  }
  updateScopeHiddenData();
  refreshScopeCascadeKeepPanel('district');
}

function onScopeSchoolToggle() {
  var cbs = document.querySelectorAll('#scopeSchoolPanel input[type="checkbox"]');
  _scopeSelectedSchools = [];
  for (var i = 0; i < cbs.length; i++) {
    if (cbs[i].checked) _scopeSelectedSchools.push(cbs[i].value);
  }
  updateScopeHiddenData();
  refreshScopeCascadeKeepPanel('school');
}

function onScopeSchoolDistChange() {
  _scopeSelectedSchools = [];
  updateScopeHiddenData();
  refreshScopeCascadeKeepPanel('school');
}

function toggleScopePanel(type) {
  var panelId = type === 'district' ? 'scopeDistrictPanel' : 'scopeSchoolPanel';
  var panel = document.getElementById(panelId);
  if (!panel) return;
  var isOpen = panel.classList.contains('show');
  var allPanels = document.querySelectorAll('.scope-cascade .multi-select-dropdown');
  for (var i = 0; i < allPanels.length; i++) allPanels[i].classList.remove('show');
  if (!isOpen) panel.classList.add('show');
}

function filterScopeSchools() {
  var searchEl = document.getElementById('scopeSchoolSearch');
  var q = (searchEl ? searchEl.value : '').toLowerCase();
  var listEl = document.getElementById('scopeSchoolList');
  if (!listEl) return;
  var labels = listEl.querySelectorAll('label');
  for (var i = 0; i < labels.length; i++) {
    var text = (labels[i].textContent || '').toLowerCase();
    labels[i].style.display = q ? (text.indexOf(q) !== -1 ? '' : 'none') : '';
  }
}

function removeScopeItem(type, value) {
  if (type === 'district') {
    _scopeSelectedDistricts = _scopeSelectedDistricts.filter(function(d) { return d !== value; });
    var cbs = document.querySelectorAll('#scopeDistrictPanel input[type="checkbox"]');
    for (var i = 0; i < cbs.length; i++) {
      if (cbs[i].value === value) { cbs[i].checked = false; break; }
    }
  } else {
    _scopeSelectedSchools = _scopeSelectedSchools.filter(function(s) { return s !== value; });
    var cbs2 = document.querySelectorAll('#scopeSchoolPanel input[type="checkbox"]');
    for (var j = 0; j < cbs2.length; j++) {
      if (cbs2[j].value === value) { cbs2[j].checked = false; break; }
    }
  }
  updateScopeHiddenData();
  refreshScopeCascadeKeepPanel(type);
}

function toggleScopeExpand() {
  _scopeExpanded = !_scopeExpanded;
  refreshScopeCascadeKeepPanel(_scopeSelectedDistricts.length ? 'district' : 'school');
}

function updateScopeHiddenData() {
  var hid = document.getElementById('scopeDataHid');
  if (hid) hid.value = encodeURIComponent(JSON.stringify({ districts: _scopeSelectedDistricts, schools: _scopeSelectedSchools }));
}

function refreshScopeCascade() {
  var isDistrict = currentRole === 'district';
  var cascadeEl = document.getElementById('scopeCascade');
  if (cascadeEl) cascadeEl.innerHTML = renderScopeCascade(isDistrict);
}

function refreshScopeCascadeKeepPanel(type) {
  var isDistrict = currentRole === 'district';
  var cascadeEl = document.getElementById('scopeCascade');
  if (!cascadeEl) return;
  cascadeEl.innerHTML = renderScopeCascade(isDistrict);
  if (type === 'school') {
    var filterVal = document.getElementById('scopeSchoolSearch') ? document.getElementById('scopeSchoolSearch').value : '';
    if (filterVal) {
      var newSearch = document.getElementById('scopeSchoolSearch');
      if (newSearch) { newSearch.value = filterVal; filterScopeSchools(); }
    }
  }
  if (type) {
    var panel = document.getElementById(type === 'district' ? 'scopeDistrictPanel' : 'scopeSchoolPanel');
    if (panel) panel.classList.add('show');
  }
}

// 点击面板外部关闭
document.addEventListener('click', function(e) {
  if (!e.target.closest('.scope-cascade .multi-select-wrap')) {
    var panels = document.querySelectorAll('.scope-cascade .multi-select-dropdown');
    for (var i = 0; i < panels.length; i++) panels[i].classList.remove('show');
  }
});

function showCreateBatchModal() {
  var isDistrict = currentRole === 'district';
  _scopeSelectedDistricts = isDistrict ? [getAdminDistrict()] : [];
  _scopeSelectedSchools = [];
  _scopeExpanded = false;

  var html = '<div class="modal-overlay show" id="modalOverlay" onclick="if(event.target===this)closeModal()">';
  html += '<div class="modal" style="width:680px;">';
  html += '<div class="modal-header"><h3>新建招聘批次</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>';
  html += '<div class="modal-body">';
  html += '<div class="form-group"><label>批次名称 <span style="color:var(--danger);">*</span></label><input id="newBatchName" placeholder="如：2026年柳州市教师自主招聘（第二批）"></div>';
  html += '<div class="form-group"><label>年度 <span style="color:var(--danger);">*</span></label><select id="newBatchYear">';
  var currentYear = new Date().getFullYear();
  for (var y = currentYear; y >= currentYear - 3; y--) { html += '<option value="' + y + '">' + y + '年</option>'; }
  html += '</select></div>';
  html += '<div class="form-group"><label>招聘类型 <span style="color:var(--danger);">*</span></label><select id="newBatchType"><option value="independent">自主招聘</option><option value="public">统一公招</option><option value="senior">中高级招聘</option></select></div>';
  // 适用范围 — 级联选择（与编制使用申请保持一致）
  html += '<div class="form-group"><label>适用范围 <span style="color:var(--danger);">*</span></label>';
  html += '<div class="scope-cascade" id="scopeCascade">' + renderScopeCascade(isDistrict) + '</div>';
  html += '</div>';
  html += '<div class="form-row" style="display:flex;gap:12px;">';
  html += '<div class="form-group" style="flex:1;"><label>申报开始日期 <span style="color:var(--danger);">*</span></label><input type="date" id="newBatchStartDate" required><div style="font-size:11px;color:var(--text-light);margin-top:2px;">申报从当天 00:00:00 开始</div></div>';
  html += '<div class="form-group" style="flex:1;"><label>申报截止日期 <span style="color:var(--danger);">*</span></label><input type="date" id="newBatchDeadline" required><div style="font-size:11px;color:var(--text-light);margin-top:2px;">截止到当天 23:59:59</div></div>';
  html += '</div>';
  html += '<div class="form-group"><label>备注 <span style="color:var(--text-light);font-weight:400;">(选填，最多200字)</span></label>';
  html += '<textarea id="newBatchRemark" placeholder="请输入备注说明" maxlength="200" oninput="updateRemarkCount(this)"></textarea>';
  html += '<div style="text-align:right;font-size:11px;color:var(--text-light);margin-top:4px;"><span id="newRemarkCount">0</span>/200</div></div>';

  html += '</div>';
  html += '<div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="createBatch()">创建批次</button></div>';
  html += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

function createBatch() {
  var name = document.getElementById('newBatchName').value.trim();
  var year = document.getElementById('newBatchYear').value;
  var type = document.getElementById('newBatchType').value;
  if (!name) { showToast('请输入批次名称', 'warning'); return; }
  var startDate = document.getElementById('newBatchStartDate').value;
  var deadline = document.getElementById('newBatchDeadline').value;
  if (!startDate) { showToast('请选择申报开始日期', 'warning'); return; }
  if (!deadline) { showToast('请选择申报截止日期', 'warning'); return; }
  if (startDate > deadline) { showToast('截止日期不能早于开始日期', 'warning'); return; }
  var remark = document.getElementById('newBatchRemark').value.trim();
  // 读取结构化适用范围
  var scopeType = document.getElementById('scopeTypeHid') ? document.getElementById('scopeTypeHid').value : 'all';
  var scopeData = { districts: [], schools: [] };
  var scopeDataEl = document.getElementById('scopeDataHid');
  if (scopeDataEl) { try { scopeData = JSON.parse(decodeURIComponent(scopeDataEl.value)); } catch(e) {} }
  if (scopeType === 'schools' && !scopeData.schools.length) { showToast('请至少选择一所学校', 'warning'); return; }
  if (scopeType === 'districts' && !scopeData.districts.length) { showToast('请至少选择一个区县', 'warning'); return; }
  var finalScopeType = scopeType;
  var finalDistricts = scopeData.districts;
  if (currentRole === 'district' && scopeType === 'all') {
    finalScopeType = 'districts';
    finalDistricts = [getAdminDistrict()];
  }
  var scope = { scopeType: finalScopeType, scopeDistricts: finalDistricts, scopeSchools: scopeData.schools };
  var batches = loadBatches();
  var id = 'RCB' + year + ('0'+(new Date().getMonth()+1)).slice(-2) + ('0'+new Date().getDate()).slice(-2) + ('00'+(batches.length+1)).slice(-2);
  var now = new Date();
  var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  batches.push({
    id: id, name: name, year: year, recruitmentType: type,
    startTime: startDate, endTime: deadline, remark: remark,
    scope: scope, status: startDate > today ? 'pending' : 'open',
    createTime: now.toISOString().replace('T',' ').substring(0,19)
  });
  saveBatches(batches);
  closeModal();
  showToast('批次创建成功', 'success');
  renderBatchCards();
  renderRightColumn();
}

function showEditBatchModal(id) {
  var batches = loadBatches();
  var b = batches.find(function(x) { return x.id === id; });
  if (!b) return;
  var typeLabel = RECRUITMENT_TYPE_MAP[b.recruitmentType] || b.recruitmentType;
  var isStarted = b.status === 'open' || b.status === 'closed';
  var isClosed = b.status === 'closed';

  var html = '<div class="modal-overlay show" id="modalOverlay" onclick="if(event.target===this)closeModal()">';
  html += '<div class="modal" style="width:520px;">';
  html += '<div class="modal-header"><h3>编辑批次</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>';
  html += '<div class="modal-body">';
  html += '<div class="form-group"><label>批次编号</label><input value="' + b.id + '" disabled style="background:#F8FAFC;color:var(--text-secondary);"></div>';
  html += '<div class="form-group"><label>批次名称</label><input id="editBatchName" value="' + escapeHtml(b.name) + '"></div>';
  html += '<div class="form-group"><label>招聘类型</label><select id="editBatchType"' + (isStarted ? ' disabled' : '') + '>';
  ['independent','public','senior'].forEach(function(t) {
    html += '<option value="' + t + '"' + (b.recruitmentType===t?' selected':'') + '>' + (RECRUITMENT_TYPE_MAP[t]||t) + '</option>';
  });
  html += '</select>' + (isStarted ? '<div style="font-size:11px;color:var(--text-light);margin-top:2px;">已开始或已关闭，不允许修改</div>' : '') + '</div>';
  html += '<div class="form-group"><label>状态</label><input value="' + ({pending:'待开始',open:'进行中',closed:'已关闭'}[b.status]||b.status) + '" disabled style="background:#F8FAFC;color:var(--text-secondary);"><div style="font-size:11px;color:var(--text-light);margin-top:2px;">根据申报起止日期自动判断，不可修改</div></div>';
  html += '<div class="form-row" style="display:flex;gap:12px;">';
  html += '<div class="form-group" style="flex:1;"><label>申报开始日期 <span style="color:var(--danger);">*</span></label><input type="date" id="editBatchStartDate" value="' + (b.startTime?b.startTime.slice(0,10):'') + '"' + (isStarted ? ' disabled' : '') + '>';
  if (isStarted) html += '<div style="font-size:11px;color:var(--text-light);margin-top:2px;">申报已开始，不允许修改</div>';
  html += '<div style="font-size:11px;color:var(--text-light);margin-top:2px;">申报从当天 00:00:00 开始</div>';
  html += '</div>';
  html += '<div class="form-group" style="flex:1;"><label>申报截止日期 <span style="color:var(--danger);">*</span></label><input type="date" id="editBatchDeadline" value="' + (b.endTime?b.endTime.slice(0,10):'') + '"' + (isClosed ? ' min="' + (b.endTime?b.endTime.slice(0,10):'') + '"' : '') + '>';
  if (isClosed) html += '<div style="font-size:11px;color:var(--text-light);margin-top:2px;">批次已结束，截止日期仅可往后延长，不可提前</div>';
  html += '<div style="font-size:11px;color:var(--text-light);margin-top:2px;">截止到当天 23:59:59</div>';
  html += '</div>';
  html += '</div>';
  var remarkVal = b.remark || '';
  html += '<div class="form-group"><label>备注 <span style="color:var(--text-light);font-weight:400;">(选填，最多200字)</span></label>';
  html += '<textarea id="editBatchRemark" placeholder="请输入备注说明" maxlength="200" oninput="updateRemarkCount(this)">' + remarkVal + '</textarea>';
  html += '<div style="text-align:right;font-size:11px;color:var(--text-light);margin-top:4px;"><span id="editRemarkCount">' + remarkVal.length + '</span>/200</div></div>';
  html += '</div>';
  html += '<div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="updateBatch(\'' + id + '\')">保存修改</button></div>';
  html += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  // Initialize remark character count
  var editRemarkEl = document.getElementById('editBatchRemark');
  if (editRemarkEl) updateRemarkCount(editRemarkEl);
}

function updateBatch(id) {
  var batches = loadBatches();
  var idx = batches.findIndex(function(x) { return x.id === id; });
  if (idx === -1) return;
  var b = batches[idx];
  var nameEl = document.getElementById('editBatchName');
  var startEl = document.getElementById('editBatchStartDate');
  var deadlineEl = document.getElementById('editBatchDeadline');
  var es = startEl ? startEl.value : '';
  var ed = deadlineEl ? deadlineEl.value : '';
  if (!nameEl || !nameEl.value.trim()) { showToast('请输入批次名称', 'warning'); return; }
  if (!deadlineEl || !ed) { showToast('请选择申报截止日期', 'warning'); return; }
  if (startEl && es && ed && es > ed) { showToast('开始日期不能晚于截止日期', 'warning'); return; }
  if (b.status === 'closed' && b.endTime && ed < b.endTime.slice(0,10)) { showToast('已结束批次截止日期仅可往后延长，不可提前', 'warning'); return; }
  b.name = nameEl.value.trim();
  b.recruitmentType = document.getElementById('editBatchType').value;
  if (startEl && !startEl.disabled) { b.startTime = es; }
  b.endTime = ed;
  b.remark = document.getElementById('editBatchRemark').value.trim();
  saveBatches(batches);
  closeModal();
  showToast('批次信息已更新', 'success');
  renderBatchCards();
  renderRightColumn();
}

function showConfirmModal(title, message, confirmText, confirmColor, onConfirm) {
  var html = '<div class="modal-overlay show" id="modalOverlay" onclick="if(event.target===this)closeModal()">';
  html += '<div class="modal" style="width:480px;">';
  html += '<div class="modal-header"><h3>' + title + '</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>';
  html += '<div class="modal-body"><div style="padding:8px 0;font-size:14px;color:var(--text);line-height:1.7;">' + message + '</div></div>';
  html += '<div class="modal-footer">';
  html += '<button class="btn btn-outline" onclick="closeModal()">取消</button>';
  html += '<button class="btn btn-primary" id="confirmModalBtn" style="background:' + confirmColor + ';border-color:' + confirmColor + ';">' + confirmText + '</button>';
  html += '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('confirmModalBtn').onclick = function() { closeModal(); onConfirm(); };
}

function closeBatch(id) {
  showConfirmModal('关闭批次', '确认关闭该批次？<br>关闭后学校将无法对该批次进行申报。', '确认关闭', 'var(--warning)', function() {
    var batches = loadBatches();
    var batch = batches.find(function(b){ return b.id === id; });
    if (!batch) return;
    if (batch.status !== 'open') { showToast('只能关闭进行中的批次', 'warning'); return; }
    batch.status = 'closed';
    saveBatches(batches);
    renderBatchCards(); renderRightColumn();
    showToast('批次已关闭', 'success');
  });
}

function deleteBatch(id) {
  showConfirmModal('删除批次', '确认删除该批次？<br>此操作不可恢复，删除后将无法找回。', '确认删除', 'var(--danger)', function() {
    var batches = loadBatches();
    var batch = batches.find(function(b){ return b.id === id; });
    if (!batch) return;
    if (batch.status !== 'pending') { showToast('只能删除待开始的批次', 'warning'); return; }
    var filtered = batches.filter(function(b){ return b.id !== id; });
    saveBatches(filtered);
    renderBatchCards(); renderRightColumn();
    showToast('批次已删除', 'success');
  });
}

function closeModal() {
  var el = document.getElementById('modalOverlay');
  if (el) el.remove();
}

// ===== RENDER RIGHT COLUMN =====
function renderRightColumn() {
  var h = '';

  // Status filter buttons
  h += '<div class="status-filters">';
  var filters = [
    { key: 'all', label: '全部' },
    { key: 'pending', label: '待审核' },
    { key: 'passed', label: '已通过' },
    { key: 'rejected', label: '已驳回' },
    { key: 'unsubmitted', label: '待提交' }
  ];
  filters.forEach(function(f) {
    h += '<button class="status-fbtn' + (currentStatusFilter===f.key?' active':'') + '" onclick="setStatusFilter(\'' + f.key + '\')">' + f.label + '</button>';
  });
  h += '</div>';

  if (currentStatusFilter === 'unsubmitted') {
    h += renderUnsubmittedView();
  } else {
    h += renderRecordsTable();
  }

  document.getElementById('rightColumn').innerHTML = h;
}

function setStatusFilter(f) { currentStatusFilter = f; currentPage = 1; renderRightColumn(); }

function renderPaginationControls(totalItems, pageNum, goFnName) {
  var totalPages = Math.ceil(totalItems / pageSize) || 1;
  if (pageNum > totalPages) pageNum = totalPages;
  if (pageNum < 1) pageNum = 1;
  var h = '<div class="pagination">';
  h += '<button ' + (pageNum <= 1 ? 'disabled' : '') + ' onclick="' + goFnName + '(' + (pageNum - 1) + ')">◀</button>';
  for (var p = 1; p <= totalPages; p++) {
    if (totalPages <= 7 || p <= 2 || p > totalPages - 2 || Math.abs(p - pageNum) <= 1) {
      h += '<button class="' + (p === pageNum ? 'active' : '') + '" onclick="' + goFnName + '(' + p + ')">' + p + '</button>';
    } else if (p === 3 || p === totalPages - 2) {
      h += '<button disabled>…</button>';
    }
  }
  h += '<button ' + (pageNum >= totalPages ? 'disabled' : '') + ' onclick="' + goFnName + '(' + (pageNum + 1) + ')">▶</button>';
  h += '<span class="page-info">共 ' + totalPages + ' 页 / ' + totalItems + ' 条</span>';
  h += '</div>';
  return h;
}

function goPage(p) { currentPage = p; renderRightColumn(); }

function renderRecordsTable() {
  var records = getPermittedRecords();
  if (selectedBatchId) {
    records = records.filter(function(r) { return r.batchId === selectedBatchId; });
  }

  // Apply status filter
  if (currentStatusFilter !== 'all') {
    if (currentStatusFilter === 'passed') {
      records = records.filter(function(r) { return r.status === 'first_approved' || r.status === 'completed'; });
    } else if (currentStatusFilter === 'rejected') {
      records = records.filter(function(r) { return r.status === 'first_rejected' || r.status === 'second_rejected'; });
    } else if (currentStatusFilter === 'pending') {
      records = records.filter(function(r) { return r.status === 'pending_first' || r.status === 'pending_second'; });
    } else {
      records = records.filter(function(r) { return r.status === currentStatusFilter; });
    }
  }

  if (records.length === 0) {
    return '<div class="table-card"><div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">' + (selectedBatchId ? '该批次暂无申报记录' : '暂无申报记录') + '</div></div></div>';
  }

  var totalItems = records.length;
  var totalPages = Math.ceil(totalItems / pageSize);
  if (currentPage > totalPages) currentPage = totalPages || 1;
  if (currentPage < 1) currentPage = 1;
  var startIdx = (currentPage - 1) * pageSize;
  var pageData = records.slice(startIdx, startIdx + pageSize);

  var h = '<div class="table-card"><div class="table-scroll"><table class="list-table"><thead><tr>';
  h += '<th>申请编号</th><th>单位名称</th><th>所属区域</th><th>招聘类型</th><th>岗位数</th><th>招聘人数</th><th>提交时间</th><th>状态</th><th>操作</th>';
  h += '</tr></thead><tbody>';

  pageData.forEach(function(r) {
    var statusCls = getStatusBadgeClass(r.status);
    var typeCls = getTypeTagClass(r.recruitmentType);
    var typeLabel = RECRUITMENT_TYPE_MAP[r.recruitmentType] || r.recruitmentType;
    var posCount = (r.formData && r.formData.positions) ? r.formData.positions.length : 0;
    var totalCount = getTotalCount(r.formData);
    var audit = canAudit(r);

    h += '<tr>';
    h += '<td class="col-id">' + r.id + '</td>';
    h += '<td class="col-name">' + (r.schoolName||'—') + '</td>';
    h += '<td>' + (r.district||'—') + '</td>';
    h += '<td><span class="type-tag ' + typeCls + '">' + typeLabel + '</span></td>';
    h += '<td>' + posCount + '</td>';
    h += '<td>' + totalCount + '</td>';
    h += '<td style="font-size:12px;">' + (r.submitTime||'—') + '</td>';
    h += '<td><span class="status-badge ' + statusCls + '">' + (STATUS_MAP[r.status]||r.status) + '</span></td>';
    h += '<td class="col-action"><div class="action-links">';

    if (audit.can) {
      h += '<a class="action-link" onclick="goAudit(\'' + r.id + '\')">审核</a>';
    } else if (audit.readonly) {
      h += '<a class="action-link readonly">只读<span class="badge-readonly">市管理员仅可查看</span></a>';
    } else {
      // no action
    }

    h += '<a class="action-link" onclick="viewDetail(\'' + r.id + '\')">查看</a>';
    if (r.status === 'completed' && r.secondModifiableUntil && new Date(r.secondModifiableUntil) > new Date()) {
      h += '<a class="action-link" onclick="editRecord(\'' + r.id + '\')">编辑</a>';
      h += '<a class="action-link" style="color:var(--warning);" onclick="goAudit(\'' + r.id + '\')">修改结果</a>';
    }
    if (r.status === 'completed') {
      var hasStats = getRecruitStatsById(r.id);
      if (hasStats && hasStats.updateTime) {
        h += '<a class="action-link" onclick="openStats(\'' + r.id + '\')">统计表</a>';
      } else {
        h += '<a class="action-link" style="color:var(--warning);" onclick="openStats(\'' + r.id + '\')">统计表（未录入）</a>';
      }
    }
    h += '</div></td></tr>';
  });

  h += '</tbody></table></div>';
  h += renderPaginationControls(totalItems, currentPage, 'goPage');
  h += '</div>';
  return h;
}

function renderUnsubmittedView() {
  if (!selectedBatchId) {
    return '<div class="table-card"><div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">请先在左侧选择一个批次</div></div></div>';
  }

  var schools = getUnsubmittedSchools(selectedBatchId);
  if (schools.length === 0) {
    return '<div class="table-card"><div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">该批次所有学校均已提交申报</div></div></div>';
  }

  var h = '<div class="table-card"><div class="table-scroll"><table class="list-table"><thead><tr>';
  h += '<th style="width:60px;">序号</th><th>单位名称</th><th>所属区域</th><th>最近提醒</th><th>状态</th><th>操作</th>';
  h += '</tr></thead><tbody>';

  schools.forEach(function(s, idx) {
    var district = SCHOOL_DISTRICT_MAP[s] || '—';
    var lastRemind = getLastRemind(s, selectedBatchId);
    var remindedToday = lastRemind && lastRemind.date === new Date().toISOString().substring(0, 10);
    var remindText = '—';
    if (lastRemind) {
      remindText = (lastRemind.time||'').substring(0, 16).replace('T', ' ');
    }

    h += '<tr>';
    h += '<td>' + (idx + 1) + '</td>';
    h += '<td class="col-name">' + s + '</td>';
    h += '<td>' + district + '</td>';
    h += '<td style="font-size:12px;">' + remindText + '</td>';
    h += '<td><span class="status-badge pending">未提交</span></td>';
    h += '<td class="col-action"><div class="action-links">';
    h += '<button class="btn-remind-sm' + (remindedToday ? ' reminded' : '') + '" onclick="remindSchool(\'' + s + '\',\'' + selectedBatchId + '\',event)"' + (remindedToday ? ' disabled' : '') + '>';
    h += remindedToday ? '今日已提醒' : '提醒申报';
    h += '</button>';
    h += '</div></td></tr>';
  });

  h += '</tbody></table></div></div>';
  return h;
}

// ===== NAVIGATION =====


function editRecord(id) {
  window.location.href = 'recruit-form.html?id=' + id + '&role=' + currentRole + '&mode=modify';
}
function goAudit(id) {
  var record = loadRecords().find(function(r) { return r.id === id; });
  if (!record) return;
  var audit = canAudit(record);

  if (audit.level === 'first') {
    window.location.href = 'recruit-audit-first.html?id=' + id + '&role=' + currentRole;
  } else if (audit.level === 'second') {
    window.location.href = 'recruit-audit-second.html?id=' + id + '&role=' + currentRole;
  } else if (record.status === 'completed' && record.secondModifiableUntil && new Date(record.secondModifiableUntil) > new Date()) {
    window.location.href = 'recruit-audit-second.html?id=' + id + '&role=' + currentRole;
  }
}

function viewDetail(id) {
  window.location.href = 'recruit-detail.html?id=' + id + '&role=' + currentRole;
}

function openStats(id) {
  window.location.href = 'recruit-stats-form.html?id=' + id + '&role=' + currentRole;
}

// ===== MAIN RENDER =====
function renderPage() {
  renderBatchCards();
  renderRightColumn();
}

// ===== INIT =====
function init() {
  var roleParam = (window.location.search.match(/[?&]role=([^&]*)/) || [])[1];
  if (roleParam === 'city' || roleParam === 'district') {
    currentRole = roleParam;
  }
  renderSidebar();
  renderPage();
}
init();
</script>
