function seedTeacherFills() {
  var raw = localStorage.getItem('employ_teacher_fills');
  if (raw === null) { // 首次打开：写入演示数据
    var map = {};
    ALL_TEACHER_FILL_SEED.forEach(function(f) { map[f.token] = f; });
    localStorage.setItem('employ_teacher_fills', JSON.stringify(map));
    return;
  }
  // 兼容旧版本遗留数据：确保演示记录存在；演示教师信息整体以最新种子为准——
  // 旧版本（seedRev<3）存过的任意字段缺失/待填/旧格式数据，下一次打开一次性刷新为
  // 最新完整演示数据（照片/在职教育/职称附件/原单位/学习工作经历/配偶/社会关系全部填写），
  // 刷新后（seedRev=3）用户自行修改的内容保留不动。
  var all; try { all = JSON.parse(raw) || {}; } catch(e) { return; }
  var changed = false;
  ALL_TEACHER_FILL_SEED.forEach(function(f) {
    var cur = all[f.token];
    if (!cur) { all[f.token] = f; changed = true; return; }
    if (cur.teacher && (cur.seedRev || 0) < 3) {
      cur.teacher = JSON.parse(JSON.stringify(f.teacher));
      cur.seedRev = 3;
      changed = true;
    }
  });
  if (changed) localStorage.setItem('employ_teacher_fills', JSON.stringify(all));
}

function findProvince(n) { for (var i=0;i<REGIONS.length;i++) if (REGIONS[i].n===n) return REGIONS[i]; return null; }
function findCity(prov, n) { if (!prov) return null; for (var i=0;i<prov.c.length;i++) if (prov.c[i].n===n) return prov.c[i]; return null; }

// 省市区三个级联下拉的渲染与联动
function regionHtml(prefix, value, detail, locked) {
  var parts = String(value||'').split('/');
  var p = parts[0]||'', c = parts[1]||'', d = parts[2]||'';
  var dis = locked ? 'disabled' : '';
  var prov = findProvince(p);
  var city = findCity(prov, c);
  var h = '<div class="region-cell">';
  h += '<select class="region-sel" id="'+prefix+'_prov"' + dis + ' onchange="onRegionChange(\''+prefix+'\',\'prov\')"><option value="">省份</option>';
  REGIONS.forEach(function(r){ h += '<option value="'+r.n+'"'+(p===r.n?' selected':'')+'>'+r.n+'</option>'; });
  h += '</select>';
  h += '<select class="region-sel" id="'+prefix+'_city"' + dis + ' onchange="onRegionChange(\''+prefix+'\',\'city\')"><option value="">城市</option>';
  if (prov) prov.c.forEach(function(ci){ h += '<option value="'+ci.n+'"'+(c===ci.n?' selected':'')+'>'+ci.n+'</option>'; });
  h += '</select>';
  h += '<select class="region-sel" id="'+prefix+'_dist"' + dis + ' onchange="onRegionChange(\''+prefix+'\',\'dist\')"><option value="">区县</option>';
  if (city && city.d) city.d.forEach(function(di){ h += '<option value="'+di+'"'+(d===di?' selected':'')+'>'+di+'</option>'; });
  h += '</select>';
  h += '<input type="text" class="region-sel region-detail" id="'+prefix+'_detail" value="'+escapeHtml(detail||'')+'"' + dis + ' maxlength="60" placeholder="详细地址">';
  h += '</div>';
  return h;
}

function onRegionChange(prefix, level) {
  var provSel = g(prefix+'_prov'), citySel = g(prefix+'_city'), distSel = g(prefix+'_dist');
  if (!provSel || !citySel || !distSel) return;
  var prov = findProvince(provSel.value);
  var keepCity = (level === 'city' || level === 'dist') ? citySel.value : '';
  var ch = '<option value="">城市</option>';
  if (prov) prov.c.forEach(function(ci){ ch += '<option value="'+ci.n+'"'+(ci.n===keepCity?' selected':'')+'>'+ci.n+'</option>'; });
  citySel.innerHTML = ch;
  var keepDist = (level === 'dist') ? distSel.value : '';
  var city = findCity(prov, keepCity);
  var dh = '<option value="">区县</option>';
  if (city && city.d) city.d.forEach(function(di){ dh += '<option value="'+di+'"'+(di===keepDist?' selected':'')+'>'+di+'</option>'; });
  distSel.innerHTML = dh;
}

function regionValue(prefix) {
  var p = g(prefix+'_prov'), c = g(prefix+'_city'), d = g(prefix+'_dist');
  if (!p || !c || !d) return '';
  return [p.value, c.value, d.value].filter(function(x){ return x; }).join('/');
}

// 学习/工作经历：兼容旧字符串 → 数组
function normEdu(v) {
  if (Array.isArray(v)) return v.map(function(r){ return {start:r.start||'',end:r.end||'',edu:r.edu||'',school:r.school||'',major:r.major||''}; });
  if (v) return [{start:'',end:'',edu:'',school:String(v),major:''}];
  return [];
}
function normWork(v) {
  if (Array.isArray(v)) return v.map(function(r){ return {start:r.start||'',end:r.end||'',unit:r.unit||'',position:r.position||'',category:r.category||'',level:r.level||''}; });
  if (v) return [{start:'',end:'',unit:String(v),position:'',category:'',level:''}];
  return [];
}

// ===== 身份校验 =====
function sendSmsCode() {
  var phone = g('f_phone') ? g('f_phone').value.trim() : '';
  if (!/^\d{11}$/.test(phone)) { showToast('请输入正确的11位手机号', 'warning'); return; }
  if (fill && fill.phone && phone !== fill.phone) { showToast('手机号与学校登记不一致，请使用登记的本人手机号', 'warning'); return; }
  if (window._smsCountdown > 0) return;
  window._smsCountdown = 60;
  var btn = g('btnSendSms');
  btn.disabled = true; btn.textContent = window._smsCountdown + 's后重发';
  var timer = setInterval(function() {
    window._smsCountdown--;
    if (window._smsCountdown <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; }
    else { btn.textContent = window._smsCountdown + 's后重发'; }
  }, 1000);
  window._demoSmsCode = '123456';
  showToast('验证码已发送至 ' + phone.slice(0,3) + '****' + phone.slice(7), 'success');
}

function verifySms() {
  var phone = g('f_phone') ? g('f_phone').value.trim() : '';
  if (!/^\d{11}$/.test(phone)) { showToast('请输入正确的11位手机号', 'warning'); return; }
  if (fill && fill.phone && phone !== fill.phone) { showToast('手机号与学校登记不一致', 'warning'); return; }
  var code = g('f_sms') ? g('f_sms').value.trim() : '';
  if (!code || code.length !== 6) { showToast('请输入完整的6位短信验证码', 'warning'); return; }
  if (code !== '123456' && code !== (window._demoSmsCode || '123456')) { showToast('验证码错误，请重新输入', 'warning'); return; }
  stage = 'form';
  renderContent();
  showToast('身份校验通过', 'success');
}

// ===== 表单渲染 =====
function renderContent() {
  if (!fill) { renderInvalid(); return; }
  if (schoolEdit) { renderForm(false); return; }   // 学校编辑模式：直接显示可编辑表单
  if (fill.status === 'submitted') { renderForm(true); return; }
  if (fill.status === 'editing') { stage = 'form'; }
  if (stage === 'verify') { renderVerify(); return; }
  renderForm(false);
}

function renderInvalid() {

// ===== 二次确认 =====
var confirmCb = null;
function showConfirm(msg, onOk, title, okText) {
  confirmCb = onOk;
  var m = g('confirmMsg'); if (m) m.textContent = msg;
  var t = g('confirmTitle'); if (t) t.textContent = title || '确认';
  var b = g('confirmOkBtn'); if (b) b.textContent = okText || '确认';
  var o = g('confirmOverlay'); if (o) o.style.display = 'flex';
}
function closeConfirm() {
  confirmCb = null;
  var o = g('confirmOverlay'); if (o) o.style.display = 'none';
}
function confirmOk() {
  var cb = confirmCb; confirmCb = null;
  var o = g('confirmOverlay'); if (o) o.style.display = 'none';
  if (cb) cb();
}

// ===== 保存并发送 =====
function saveAndSend() {
  if (schoolEdit) {
    // 学校「保存修改」：二次确认后才保存
    showConfirm('确认保存修改？保存后信息将重新锁定，教师端显示为已提交。', function(){ doSave(); }, '保存修改', '确认保存');
    return;
  }
  doSave();
}
function doSave() {
  var name = g('f_name') ? g('f_name').value.trim() : '';
  var gender = g('f_gender') ? g('f_gender').value : '';
  var birth = g('f_birth') ? g('f_birth').value : '';
  var idNumber = g('f_idNumber') ? g('f_idNumber').value.trim() : '';
  var ethnicity = g('f_ethnicity') ? g('f_ethnicity').value : '';
  var nativePlace = regionValue('f_nativePlace');

  if (!name) { showToast('请填写姓名', 'warning'); return; }
  if (!gender) { showToast('请选择性别', 'warning'); return; }
  if (!birth) { showToast('请填写出生年月', 'warning'); return; }
  if (!ethnicity) { showToast('请选择民族', 'warning'); return; }
  if (!nativePlace) { showToast('请选择籍贯', 'warning'); return; }
  if (!regionValue('f_birthPlace')) { showToast('请选择出生地', 'warning'); return; }
  if (!regionValue('f_household')) { showToast('请选择户籍地', 'warning'); return; }
  if (!idNumber) { showToast('请填写身份证号', 'warning'); return; }
  if (!/^\d{17}[\dXx]$/.test(idNumber)) { showToast('请输入正确的18位身份证号', 'warning'); return; }
  if (!val('f_edu_education')) { showToast('请选择全日制教育学历', 'warning'); return; }
  if (!val('f_edu_gradSchool') || !val('f_edu_gradMajor')) { showToast('请填写全日制教育毕业院校系及专业', 'warning'); return; }
  if (!eduRows.some(function(r){ return r.school || r.major; })) { showToast('请至少填写一段学习经历（学校名称）', 'warning'); return; }
  // 工作经历可选：不添加即为「无工作经历」

  // 姓名与学校登记比对提示（学校编辑模式可更正姓名，不拦截）
  if (!schoolEdit && fill.name && name !== fill.name) {
    showToast('姓名与学校登记不一致（登记：' + fill.name + '），请核实', 'warning'); return;
  }

  var teacher = {
    name: name,
    photo: photo || (fill.teacher && fill.teacher.photo) || '',
    titleFile: titleFile || (fill.teacher && fill.teacher.titleFile) || '',
    titleFileName: titleFileName || (fill.teacher && fill.teacher.titleFileName) || '',
    gender: gender,
    birthDate: birth,
    age: calcAge(birth),
    ethnicity: ethnicity,
    nativePlace: nativePlace,
    nativePlaceDetail: val('f_nativePlace_detail'),
    birthPlace: regionValue('f_birthPlace'),
    birthPlaceDetail: val('f_birthPlace_detail'),
    household: regionValue('f_household'),
    householdDetail: val('f_household_detail'),
    idNumber: idNumber,
    edu: { education: val('f_edu_education'), degree: val('f_edu_degree'), gradSchool: val('f_edu_gradSchool'), gradMajor: val('f_edu_gradMajor') },
    partEdu: { education: val('f_partEdu_education'), degree: val('f_partEdu_degree'), gradSchool: val('f_partEdu_gradSchool'), gradMajor: val('f_partEdu_gradMajor') },
    title: val('f_title'),
    originalUnit: val('f_originalUnit'),
    originalCategory: val('f_originalCategory'),
    originalLevel: val('f_originalLevel'),
    appointmentTime: val('f_appointmentTime'),
    otherQual: val('f_otherQual') || '无',
    eduHistory: eduRows.filter(function(r){ return r.start || r.end || r.edu || r.school || r.major; }),
    workHistory: workRows.filter(function(r){ return r.start || r.end || r.unit || r.position || r.category || r.level; }),
    spouse: (function(){ spouseData = { name: val('f_spouse_name'), gender: val('f_spouse_gender'), birthDate: val('f_spouse_birth'), unit: val('f_spouse_unit') }; return spouseData; })(),
    relations: relRows.filter(function(r){ return r.name || r.relation || r.unit; })
  };

  var all = loadFills();
  var rec = all[token];
  if (!rec) { showToast('链接已失效，请联系学校管理员', 'warning'); return; }
  rec.teacher = teacher;
  rec.status = 'submitted';
  rec.submitTime = now();
  all[token] = rec;
  saveFills(all);
  fill = rec;
  var wasEdit = schoolEdit;
  if (wasEdit) schoolEdit = false;   // 学校编辑保存后退出编辑模式，回到只读锁定视图
  showToast(wasEdit ? '已保存修改，信息已重新锁定' : '已提交，信息已锁定', 'success');
  renderContent();
}

function val(id) { var el = g(id); return el ? el.value.trim() : ''; }

// ===== INIT =====
(function init() {
  token = getUrlParam('invite');
  schoolEdit = (getUrlParam('mode') === 'edit');
  var all = loadFills();
  if (!token) {
    // 直接打开（未带 ?invite= 参数）：自动载入演示数据，便于演示查看
    var demoKeys = Object.keys(all).filter(function(k){ return all[k] && all[k].teacher; });
    if (demoKeys.length) { token = demoKeys[0]; demoMode = true; }
    else { renderInvalid(); return; }
  }
  fill = all[token] || null;
  if (fill && fill.teacher) {
    relRows = (fill.teacher.relations||[]).map(function(r){ return {name:r.name||'',relation:r.relation||'',unit:r.unit||''}; });
    photo = fill.teacher.photo || '';
    titleFile = fill.teacher.titleFile || '';
    titleFileName = fill.teacher.titleFileName || '';
    spouseData = { name: (fill.teacher.spouse&&fill.teacher.spouse.name)||'', gender: (fill.teacher.spouse&&fill.teacher.spouse.gender)||'', birthDate: (fill.teacher.spouse&&fill.teacher.spouse.birthDate)||'', unit: (fill.teacher.spouse&&fill.teacher.spouse.unit)||'' };
    spouseShown = !spouseEmpty(spouseData);
    unitShown = !!((fill.teacher.originalUnit||'').trim());
    eduRows = normEdu(fill.teacher.eduHistory);
    workRows = normWork(fill.teacher.workHistory);
  }
  if (schoolEdit) {
    if (!fill) { renderInvalid(); return; }   // 学校编辑需已有填报数据
    stage = 'form';
  }
  renderContent();
})();
</script>
