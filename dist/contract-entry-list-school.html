<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师入职管理 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top:0; left:0; right:0; height:56px; background:linear-gradient(135deg,#1E3A8A,#1E40AF); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display:flex; align-items:center; gap:14px; }
.topnav-logo { width:38px; height:38px; background:rgba(255,255,255,0.18); border-radius:10px; display:flex; align-items:center; justify-content:center; }
.topnav-logo svg { width:24px; height:24px; }
.topnav-title { font-size:17px; font-weight:600; color:#fff; letter-spacing:1px; }
.topnav-right { display:flex; align-items:center; gap:18px; }
.topnav-bell { position:relative; cursor:pointer; color:rgba(255,255,255,0.85); padding:6px; border-radius:6px; transition:var(--transition); }
.topnav-bell:hover { background:rgba(255,255,255,0.1); color:#fff; }
.topnav-bell .badge { position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.topnav-user { display:flex; align-items:center; gap:8px; cursor:pointer; color:rgba(255,255,255,0.9); padding:6px 12px; border-radius:6px; transition:var(--transition); font-size:13px; position:relative; }
.topnav-user:hover { background:rgba(255,255,255,0.1); }
.topnav-user .avatar { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
.user-dropdown { display:none; position:absolute; top:46px; right:0; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-lg); min-width:160px; z-index:200; overflow:hidden; }
.user-dropdown.show { display:block; }
.user-dropdown a { display:block; padding:12px 18px; font-size:13px; color:var(--text); text-decoration:none; transition:var(--transition); }
.user-dropdown a:hover { background:var(--primary-light); color:var(--primary); }
.sidebar { position:fixed; top:56px; left:0; bottom:0; width:var(--sidebar-w); background:#1E3A8A; z-index:90; overflow-y:auto; display:flex; flex-direction:column; transition:width var(--transition); }
.sidebar.collapsed { width:64px; }
.sidebar.collapsed .menu-label,.sidebar.collapsed .menu-group,.sidebar.collapsed .menu-badge,.sidebar.collapsed .role-switcher-label,.sidebar.collapsed .role-switcher-name { display:none; }
.sidebar.collapsed .menu-item { justify-content:center; padding:12px 0; }
.sidebar.collapsed .menu-icon { margin-right:0; }
.sidebar-menu { flex:1; padding:8px 0; }
.menu-group { padding:14px 20px 4px; font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; }
.menu-item { display:flex; align-items:center; padding:10px 20px; cursor:pointer; font-size:13px; font-weight:400; color:rgba(255,255,255,0.7); transition:var(--transition); position:relative; text-decoration:none; border-left:3px solid transparent; }
.menu-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
.menu-item.active { background:rgba(255,255,255,0.08); color:#fff; font-weight:500; border-left-color:var(--accent); }
.menu-item .menu-icon { width:18px; height:18px; margin-right:10px; flex-shrink:0; opacity:0.7; }
.menu-item.active .menu-icon { opacity:1; }
.menu-item .menu-badge { margin-left:auto; background:var(--danger); color:#fff; font-size:10px; padding:2px 7px; border-radius:10px; font-weight:600; }
.sidebar-bottom { border-top:1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display:flex; align-items:center; gap:8px; padding:10px 20px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.5); transition:var(--transition); }
.sidebar-toggle:hover { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.8); }
.sidebar-toggle svg { width:16px; height:16px; transition:transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform:rotate(180deg); }
.role-switcher { padding:10px 16px 12px; border-top:1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:1px; margin-bottom:8px; padding:0 4px; }
.role-switcher-options { display:flex; flex-direction:column; gap:4px; }
.role-switch-btn { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.55); transition:var(--transition); border:1px solid transparent; background:transparent; font-family:inherit; width:100%; text-align:left; }
.role-switch-btn:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.8); }
.role-switch-btn.active { background:rgba(59,130,246,0.2); color:#fff; border-color:rgba(59,130,246,0.4); font-weight:500; }
.role-switch-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.role-switch-dot.city { background:#3B82F6; }
.role-switch-dot.district { background:#F59E0B; }
.role-switch-dot.school { background:#10B981; }
.role-switch-dot.teacher { background:#A78BFA; }
.main { margin-left:var(--sidebar-w); margin-top:56px; padding:24px; min-height:calc(100vh - 56px); transition:margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left:64px; }
.breadcrumb { font-size:12px; color:var(--text-light); margin-bottom:16px; }
.breadcrumb a { color:var(--text-light); text-decoration:none; }
.breadcrumb a:hover { color:var(--primary); }
.breadcrumb span { color:var(--text-secondary); }
.page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.page-header h1 { font-size:20px; font-weight:700; }
.page-header .subtitle { font-size:12px; color:var(--text-light); margin-top:2px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; font-size:13px; font-weight:500; border-radius:6px; cursor:pointer; font-family:inherit; transition:var(--transition); border:1px solid transparent; text-decoration:none; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-danger { background:var(--danger); color:#fff; border-color:var(--danger); }
.btn-danger:hover { filter:brightness(0.93); }
.btn-primary:hover { background:var(--primary-dark); }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-outline { background:#fff; color:var(--text-secondary); border:1px solid var(--border); }
.btn-outline:hover { background:var(--gray-bg); }
.toolbar { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
.filter-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.filter-pill { padding:6px 16px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--border); background:#fff; color:var(--text-secondary); transition:var(--transition); font-family:inherit; }
.filter-pill:hover { border-color:var(--accent); color:var(--primary); }
.filter-pill.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.search-box { display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--border); border-radius:6px; padding:6px 12px; }
.search-box svg { width:15px; height:15px; color:var(--text-light); }
.search-box input { border:none; outline:none; font-size:13px; font-family:inherit; width:200px; color:var(--text); background:transparent; }
/* Table list */
.list-card { background:#fff; border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow-sm); overflow:hidden; }
.table-scroll { overflow-x:auto; }
.list-table { width:100%; border-collapse:collapse; font-size:13px; }
.list-table th { padding:11px 14px; text-align:center; font-weight:600; font-size:11px; color:var(--text-secondary); background:#F8FAFC; border-bottom:1px solid var(--border); }
.list-table td { padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; text-align:center; }
.list-table .main-row { cursor:pointer; transition:var(--transition); }
.list-table .main-row:hover { background:#FAFBFC; }
.list-table .main-row.open { background:var(--primary-light); }
.list-table .col-id { color:var(--primary); font-weight:600; }
.expand-toggle { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:5px; color:var(--text-secondary); transition:var(--transition); }
.expand-toggle svg { width:13px; height:13px; transition:transform var(--transition); }
.main-row.open .expand-toggle svg { transform:rotate(90deg); }
.main-row.open .expand-toggle { color:var(--primary); }
.status-badge { display:inline-block; padding:3px 12px; border-radius:12px; font-size:11px; font-weight:500; }
.status-badge.pending { background:#FEF3C7; color:#92400E; }
.status-badge.approved { background:#D1FAE5; color:#065F46; }
.status-badge.rejected { background:#FEE2E2; color:#991B1B; }
.status-badge.draft { background:#E2E8F0; color:#475569; }
/* expanded sub area */
.sub-row > td { padding:0 !important; background:#FBFCFE; }
.sub-wrap { padding:18px 22px; border-bottom:1px solid var(--border); }
.sub-title { font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.sub-title .pill-note { background:#FEF3C7; color:#92400E; font-size:10px; padding:2px 8px; border-radius:10px; font-weight:500; }
.sub-table { width:100%; border-collapse:collapse; font-size:12.5px; background:#fff; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.sub-table th { padding:8px 12px; background:#F1F5F9; font-weight:600; font-size:11px; color:var(--text-secondary); text-align:left; border-bottom:1px solid var(--border); }
.sub-table td { padding:8px 12px; border-bottom:1px solid var(--border); text-align:left; color:var(--text); }
.sub-table tr:last-child td { border-bottom:none; }
.att-row { margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.checklist-file-chip { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; background:#fff; border:1px solid var(--border); border-radius:4px; font-size:11px; cursor:pointer; color:var(--primary); transition:var(--transition); }
.checklist-file-chip:hover { border-color:var(--accent); }
.reject-note { margin-top:12px; background:#FEF2F2; border:1px solid #FECACA; border-radius:6px; padding:10px 14px; font-size:12px; color:#991B1B; }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-light); }
.empty-state .empty-icon { font-size:42px; margin-bottom:12px; }
.empty-state .empty-text { font-size:14px; }
/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,0.5); z-index:500; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:var(--radius-lg); width:100%; max-width:1080px; box-shadow:var(--shadow-lg); animation:modalIn .25s ease; }
@keyframes modalIn { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--border); }
.modal-header h2 { font-size:16px; font-weight:700; }
.modal-header .modal-sub { font-size:12px; color:var(--text-light); margin-top:2px; }
.modal-close { cursor:pointer; color:var(--text-light); font-size:22px; line-height:1; border:none; background:none; }
.modal-close:hover { color:var(--text); }
.modal-body { padding:22px 24px; max-height:calc(100vh - 220px); overflow-y:auto; }
.modal-footer { display:flex; justify-content:flex-end; gap:10px; padding:16px 24px; border-top:1px solid var(--border); background:#FBFCFE; border-radius:0 0 var(--radius-lg) var(--radius-lg); }
.section-label { font-size:13px; font-weight:600; color:var(--text); margin:18px 0 10px; display:flex; align-items:center; gap:6px; }
.section-label:first-child { margin-top:0; }
.section-label .req { color:var(--danger); }
.edit-table { width:100%; border-collapse:collapse; font-size:12.5px; }
.edit-table th { padding:8px 8px; background:#F1F5F9; font-weight:600; font-size:11px; color:var(--text-secondary); text-align:left; border:1px solid var(--border); white-space:nowrap; }
.edit-table td { padding:6px 8px; border:1px solid var(--border); vertical-align:middle; }
.edit-table input, .edit-table select { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:5px; font-size:12.5px; font-family:inherit; color:var(--text); outline:none; }
.edit-table input:focus, .edit-table select:focus { border-color:var(--accent); }
.edit-table .date-pair { display:flex; align-items:center; gap:4px; }
.edit-table .date-pair span { color:var(--text-light); font-size:11px; }
.row-upload { display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--primary); cursor:pointer; white-space:nowrap; padding:2px 6px; border:1px solid var(--border); border-radius:3px; background:#F8FAFC; font-family:inherit; }
.row-upload:hover { background:var(--primary-light); }
.row-upload.has-file { color:var(--success); }
.row-file-name { display:inline-flex; align-items:center; gap:2px; font-size:10px; color:#10B981; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:80px; cursor:default; }
.row-file-remove { color:var(--danger); cursor:pointer; font-size:12px; flex-shrink:0; }
.row-remove { cursor:pointer; color:var(--danger); font-size:16px; line-height:1; background:none; border:none; padding:2px 6px; }
.row-remove:hover { color:#B91C1C; }
.add-row-btn { margin-top:10px; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--primary); cursor:pointer; padding:6px 14px; border:1px dashed var(--accent); border-radius:6px; background:var(--primary-light); transition:var(--transition); }
.add-row-btn:hover { background:#DBEAFE; }
.upload-area { border:2px dashed var(--border); border-radius:8px; padding:22px; text-align:center; cursor:pointer; transition:var(--transition); background:#FBFCFE; }
.upload-area:hover { border-color:var(--accent); background:var(--primary-light); }
.upload-area svg { width:30px; height:30px; color:var(--text-light); margin-bottom:8px; }
.upload-area .up-main { font-size:13px; color:var(--text); font-weight:500; }
.upload-area .up-hint { font-size:11px; color:var(--text-light); margin-top:4px; }
.upload-area.has-file { border-color:var(--success); background:#F0FDF4; }
.upload-area.has-file svg { color:var(--success); }
.up-tip { font-size:11.5px; color:var(--text-light); margin-top:6px; }
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#1E293B; color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:9999; animation:toastIn .3s ease; box-shadow:var(--shadow-lg); }
.toast.warning { background:var(--warning); color:#1E293B; }
.toast.success { background:var(--success); }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-left"><div class="topnav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="1" width="18" height="22" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="12" y2="14"/><line x1="12" y1="18" x2="16" y2="18"/><circle cx="8" cy="18" r="1.5" fill="#fff"/></svg></div><span class="topnav-title">柳州教育人事管理平台</span></div>
  <div class="topnav-right">
    <div class="topnav-bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="badge">3</span></div>
    <div class="topnav-user" onclick="toggleUserMenu()"><div class="avatar" id="userAvatar">校</div><span id="userName">王玉兰</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="user-dropdown" id="userDropdown"><a href="personal-center.html">个人中心</a></div></div>
  </div>
</nav>

<aside class="sidebar" id="sidebar"><div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="role-switcher"><div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options">
      <button class="role-switch-btn" data-role="city" onclick="switchRole('city')"><span class="role-switch-dot city"></span><span class="role-switcher-name">市管理员</span></button>
      <button class="role-switch-btn" data-role="district" onclick="switchRole('district')"><span class="role-switch-dot district"></span><span class="role-switcher-name">区管理员</span></button>
      <button class="role-switch-btn active" data-role="school" onclick="switchRole('school')"><span class="role-switch-dot school"></span><span class="role-switcher-name">校管理员</span></button>
      <button class="role-switch-btn" data-role="teacher" onclick="switchRole('teacher')"><span class="role-switch-dot teacher"></span><span class="role-switcher-name">教&emsp;师</span></button>
    </div>
  </div>
  <div class="sidebar-bottom"><div class="sidebar-toggle" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg><span class="menu-label">收起菜单</span></div></div>
</aside>

<main class="main">
  <div class="breadcrumb"><a href="workbench.html">首页</a> &nbsp;/&nbsp; <span>编外教师管理</span> &nbsp;/&nbsp; <span>教师入职管理</span></div>
  <div class="page-header"><div><h1>教师入职管理</h1><div class="subtitle">合同制教师入职申报</div></div><button class="btn btn-primary" onclick="openModal()">+ 新建申报</button></div>
  <div class="toolbar">
    <div class="filter-bar" id="filterBar"></div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="搜索申请编号..." oninput="renderList()">
    </div>
  </div>
  <div id="recordList"></div>
</main>

<!-- New Application Modal -->
<div class="modal-overlay" id="appModal">
  <div class="modal">
    <div class="modal-header">
      <div><h2>新增入职申报</h2><div class="modal-sub">柳州市第八中学 · 合同制教师入职</div></div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="section-label">入职教师名单 <span class="req">*</span></div>
      <div class="table-scroll">
        <table class="edit-table">
          <thead><tr>
            <th style="width:40px;">序号</th>
            <th style="width:90px;">姓名</th>
            <th style="width:64px;">性别</th>
            <th style="width:165px;">身份证号</th>
            <th style="width:120px;">手机号</th>
            <th style="width:210px;">合同起止</th>
            <th style="width:130px;">入职时间</th>
            <th style="width:110px;">身份证正反面</th>
            <th style="width:100px;">劳动合同</th>
            <th style="width:36px;"></th>
          </tr></thead>
          <tbody id="teacherTableBody"></tbody>
        </table>
      </div>
      <div class="add-row-btn" onclick="addTeacherRow()">+ 添加行</div>

      <div class="up-tip">提示：身份证正反面（JPG/PNG）和劳动合同（PDF）均需每位教师单独上传，单个文件 ≤ 10MB。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecord('pending')">提交审核</button>
    </div>
  </div>
</div>

<!-- hidden per-row idcard file inputs container -->
<div id="rowFileInputs" style="display:none"></div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="delConfirmModal" style="z-index:600;">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <div><h2>确认删除</h2></div>
      <button class="modal-close" onclick="closeDelConfirm()">&times;</button>
    </div>
    <div class="modal-body">
      <p id="delConfirmMsg" style="font-size:14px;color:var(--text);line-height:1.7;margin:0;"></p>
    </div>
    <div class="modal-footer">

function renderList(){
  var records=loadRecords().filter(function(r){return r.schoolName===CURRENT_SCHOOL;});
  var counts={ all:records.length, pending:0, approved:0, rejected:0 };
  records.forEach(function(r){ if(counts[r.status]!==undefined) counts[r.status]++; });

  var filters=[
    {key:'all',label:'全部('+counts.all+')'},
    {key:'pending',label:'待审核('+counts.pending+')'},
    {key:'approved',label:'已通过('+counts.approved+')'},
    {key:'rejected',label:'已驳回('+counts.rejected+')'}
  ];
  var fb=document.getElementById('filterBar');
  fb.innerHTML='';
  filters.forEach(function(f){
    var b=document.createElement('button');
    b.className='filter-pill'+(currentFilter===f.key?' active':'');
    b.textContent=f.label;
    b.onclick=function(){ currentFilter=f.key; renderList(); };
    fb.appendChild(b);
  });

  var kw=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  var filtered=records.filter(function(r){
    if(currentFilter!=='all' && r.status!==currentFilter) return false;
    if(kw && r.id.toLowerCase().indexOf(kw)<0) return false;
    return true;
  });

  var list=document.getElementById('recordList');
  if(filtered.length===0){
    list.innerHTML='<div class="list-card"><div class="empty-state"><div class="empty-icon">&#128203;</div><div class="empty-text">暂无入职申报记录</div></div></div>';
    return;
  }

  var h='<div class="list-card"><div class="table-scroll"><table class="list-table"><thead><tr>';
  h+='<th>申请编号</th><th>申报人数</th><th>提交时间</th><th>状态</th><th style="width:110px;">操作</th>';
  h+='</tr></thead><tbody>';

  filtered.forEach(function(r){
    var cnt=(r.teachers||[]).length;
    h+='<tr>';
    h+='<td class="col-id">'+escapeHtml(r.id)+'</td>';
    h+='<td>'+cnt+' 人</td>';
    h+='<td style="font-size:12px;color:var(--text-secondary);">'+escapeHtml(r.submitTime||'—')+'</td>';
    h+='<td><span class="status-badge '+r.status+'">'+(STATUS_TEXT[r.status]||r.status)+'</span></td>';
    h+='<td><button class="btn btn-outline btn-sm" onclick="viewDetail(\''+r.id+'\')">查看</button></td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  list.innerHTML=h;
}

function renderSubArea(r){
  var h='<div class="sub-wrap">';
  h+='<div class="sub-title">入职教师明细';
  if(r.status==='pending'){ h+='<span class="pill-note">已提交，等待主管部门审核</span>'; }
  h+='</div>';
  h+='<table class="sub-table"><thead><tr><th style="width:40px;">序号</th><th>姓名</th><th>性别</th><th>身份证号</th><th>合同起止</th></tr></thead><tbody>';
  (r.teachers||[]).forEach(function(t,i){
    h+='<tr><td>'+(i+1)+'</td><td>'+escapeHtml(t.name)+'</td><td>'+escapeHtml(t.gender)+'</td><td>'+escapeHtml(maskId(t.idCard))+'</td><td>'+escapeHtml(t.contractStart||'')+' 至 '+escapeHtml(t.contractEnd||'')+'</td></tr>';
  });
  h+='</tbody></table>';

  h+='<div class="att-row">';
  (r.teachers||[]).forEach(function(t){
    if(t.idCardAttachment){
      h+=fileChip(t.name+' 身份证', t.idCardAttachment);
    }
    if(t.laborContractAttachment){
      h+=fileChip(t.name+' 劳动合同', t.laborContractAttachment);
    }
  });
  h+='</div>';

  if(r.status==='rejected' && r.rejectOpinion){
    h+='<div class="reject-note"><strong>驳回意见：</strong>'+escapeHtml(r.rejectOpinion)+'</div>';
  }
  h+='</div>';
  return h;
}
function fileChip(label,att){
  var fn=escapeHtml(att.name||label);

    '<span style="color:var(--text-secondary);">'+escapeHtml(label)+'</span>'+
    '<span class="checklist-file-chip" onclick="event.stopPropagation();mockPreview(\''+fn+'\')" title="点击预览">📄 '+fn+'</span>'+
    '<span class="checklist-file-chip" onclick="event.stopPropagation();mockDownload(\''+fn+'\')" title="点击下载" style="color:var(--text-secondary);">⬇</span>'+
    (sz?'<span style="font-size:10px;color:var(--text-light);">('+sz+')</span>':'')+
    '</span>';
}

function addTeacherRow(){

    '<td class="row-index" style="text-align:center;color:var(--text-secondary);"></td>'+

    '<td><input type="text" class="f-id" placeholder="身份证号" maxlength="18"></td>'+

    '<td><span class="row-upload" id="rul-'+uid+'" onclick="triggerRowLabor(\''+uid+'\')">+ 上传</span></td>'+
    '<td style="text-align:center;"><button class="row-remove" onclick="removeRow(\''+uid+'\')" title="删除">&times;</button></td>';
  tb.appendChild(tr);

  var fi=document.createElement('input');
  fi.type='file'; fi.accept='image/jpeg,image/png,.jpg,.jpeg,.png';
  fi.id='file-'+uid; fi.style.display='none';

  document.getElementById('rowFileInputs').appendChild(fi);

  var fl=document.createElement('input');
  fl.type='file'; fl.accept='application/pdf,.pdf';
  fl.id='file-labor-'+uid; fl.style.display='none';
  fl.onchange=function(){ onRowLabor(uid,this); };
  document.getElementById('rowFileInputs').appendChild(fl);

  refreshRowIndexes();
}
var pendingDeleteUid=null;
function rowHasData(uid){
  var tr=document.querySelector('#teacherTableBody tr[data-uid="'+uid+'"]');
  if(!tr) return false;
  var v=function(sel){ var el=tr.querySelector(sel); return el?(el.value||'').trim():''; };
  return !!(v('.f-name')||v('.f-id')||v('.f-gender')||v('.f-phone')||v('.f-start')||v('.f-end')||v('.f-entry')||rowFiles[uid]||rowLabor[uid]);
}
function removeRow(uid){
  if(!rowHasData(uid)){ doRemoveRow(uid); return; }
  pendingDeleteUid=uid;
  var tr=document.querySelector('#teacherTableBody tr[data-uid="'+uid+'"]');
  var rows=Array.prototype.slice.call(document.querySelectorAll('#teacherTableBody tr'));
  var idx=rows.indexOf(tr)+1;
  var nm=(tr.querySelector('.f-name').value||'').trim();
  document.getElementById('delConfirmMsg').innerHTML='确定删除第 '+idx+' 行教师'+(nm?'「'+escapeHtml(nm)+'」':'')+'？<br>删除后该行信息及已上传的身份证、劳动合同附件将一并移除。';
  document.getElementById('delConfirmModal').classList.add('show');
}
function doRemoveRow(uid){
  var tr=document.querySelector('#teacherTableBody tr[data-uid="'+uid+'"]');
  if(tr) tr.remove();
  var fi=document.getElementById('file-'+uid); if(fi) fi.remove();
  var fl=document.getElementById('file-labor-'+uid); if(fl) fl.remove();
  delete rowFiles[uid];
  delete rowLabor[uid];
  refreshRowIndexes();
}
function confirmDeleteRow(){ if(pendingDeleteUid){ doRemoveRow(pendingDeleteUid); } pendingDeleteUid=null; closeDelConfirm(); }
function closeDelConfirm(){ document.getElementById('delConfirmModal').classList.remove('show'); pendingDeleteUid=null; }
function refreshRowIndexes(){
  var rows=document.querySelectorAll('#teacherTableBody tr');
  rows.forEach(function(tr,i){ var c=tr.querySelector('.row-index'); if(c) c.textContent=(i+1); });
}
function triggerRowFile(uid){ document.getElementById('file-'+uid).click(); }
function fileExt(name,def){ var m=/\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():def; }
function onRowFile(uid,input){
  var f=input.files&&input.files[0]; if(!f) return;
  if(!/\.(jpe?g|png)$/i.test(f.name) && f.type.indexOf('image/')!==0){ showToast('身份证仅支持 JPG/PNG 格式','warning'); input.value=''; return; }
  if(f.size>10*1048576){ showToast('身份证文件不能超过 10MB','warning'); input.value=''; return; }
  rowFiles[uid]={name:f.name,size:f.size,type:f.type||'image/jpeg',ext:fileExt(f.name,'jpg')};
  renderRowFileLabel(uid,'idcard');
}
function clearRowFile(uid){
  delete rowFiles[uid];
  renderRowFileLabel(uid,'idcard');
}
function triggerRowLabor(uid){ document.getElementById('file-labor-'+uid).click(); }
function onRowLabor(uid,input){
  var f=input.files&&input.files[0]; if(!f) return;
  if(!/\.pdf$/i.test(f.name) && f.type!=='application/pdf'){ showToast('劳动合同仅支持 PDF 格式','warning'); input.value=''; return; }
  if(f.size>10*1048576){ showToast('劳动合同文件不能超过 10MB','warning'); input.value=''; return; }
  rowLabor[uid]={name:f.name,size:f.size,type:'application/pdf',ext:'pdf'};
  renderRowFileLabel(uid,'labor');
}
function clearRowLabor(uid){
  delete rowLabor[uid];
  renderRowFileLabel(uid,'labor');
}

function renderRowFileLabel(uid,type){
  var id=type==='labor'?'rul-'+uid:'ru-'+uid;
  var lbl=document.getElementById(id);
  if(!lbl) return;
  var file=type==='labor'?rowLabor[uid]:rowFiles[uid];
  if(file){
    var short=file.name.length>8?file.name.substring(0,8)+'...':file.name;
    var fn='<span class=\"row-file-name\" title=\"'+escapeHtml(file.name)+'\">'+escapeHtml(short)+'</span>';
    var rm='<span class=\"row-file-remove\" onclick=\"event.stopPropagation();';
    rm+=type==='labor'?'clearRowLabor(\\''+uid+'\\')':'clearRowFile(\\''+uid+'\\')';
    rm+='\">×</span>';
    lbl.innerHTML=fn+rm;
    lbl.classList.add('has-file');
    lbl.title='点击重新上传';
  }else{
    lbl.textContent='+ 上传';
    lbl.classList.remove('has-file');
    lbl.title='';
  }
}

function collectTeachers(){
  var rows=document.querySelectorAll('#teacherTableBody tr');
  var list=[];
  rows.forEach(function(tr){
    var uid=tr.getAttribute('data-uid');
    list.push({
      uid:uid,
      name:tr.querySelector('.f-name').value.trim(),
      gender:tr.querySelector('.f-gender').value,
      idCard:tr.querySelector('.f-id').value.trim(),
      phone:tr.querySelector('.f-phone').value.trim(),
      contractStart:tr.querySelector('.f-start').value,
      contractEnd:tr.querySelector('.f-end').value,
      entryDate:tr.querySelector('.f-entry').value,
      idCardAttachment:rowFiles[uid]||null,
      laborContractAttachment:rowLabor[uid]||null
    });
  });
  return list;
}

function genId(all){
  var now=new Date();
  var pad=function(x){return x<10?'0'+x:''+x;};
  var ds=now.getFullYear()+''+pad(now.getMonth()+1)+pad(now.getDate());
  var sameDay=all.filter(function(r){return r.id.indexOf('CE'+ds)===0;}).length;
  return 'CE'+ds+('00'+(sameDay+1)).slice(-3);
}

function saveRecord(mode){
  var teachers=collectTeachers();
  if(teachers.length===0){ showToast('请至少添加一位入职教师','warning'); return; }

  if(mode==='pending'){
    for(var i=0;i<teachers.length;i++){
      var t=teachers[i]; var n=i+1;
      if(!t.name){ showToast('第'+n+'行：请填写姓名','warning'); return; }
      if(!t.gender){ showToast('第'+n+'行：请选择性别','warning'); return; }
      if(!t.idCard){ showToast('第'+n+'行：请填写身份证号','warning'); return; }
      if(!/^\d{17}[\dXx]$/.test(t.idCard)){ showToast('第'+n+'行：身份证号格式不正确','warning'); return; }
      if(!t.phone){ showToast('第'+n+'行：请填写手机号','warning'); return; }
      if(!/^1[3-9]\d{9}$/.test(t.phone)){ showToast('第'+n+'行：手机号格式不正确','warning'); return; }
      if(!t.contractStart||!t.contractEnd){ showToast('第'+n+'行：请填写合同起止日期','warning'); return; }
      if(t.contractEnd<t.contractStart){ showToast('第'+n+'行：合同截止日期不能早于起始日期','warning'); return; }
      if(!t.entryDate){ showToast('第'+n+'行：请选择入职时间','warning'); return; }
      if(t.entryDate<t.contractStart){ showToast('第'+n+'行：入职时间不能早于合同起始日期','warning'); return; }
      if(!t.idCardAttachment){ showToast('第'+n+'行：请上传身份证正反面','warning'); return; }
      if(!t.laborContractAttachment){ showToast('第'+n+'行：请上传劳动合同（PDF）','warning'); return; }
    }
  }

  var all=loadRecords();
  var newId=genId(all);
  var now=new Date();
  var pad=function(x){return x<10?'0'+x:''+x;};
  var ts=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());

  // 附件自动命名：按"姓名_类型.扩展名"生成，重名追加序号，不使用原始文件名
  var usedNames={};
  function uniqueName(base){
    if(!(base in usedNames)){ usedNames[base]=true; return base; }
    var m=/^(.*?)(\.[^.]+)$/.exec(base), stem=m?m[1]:base, ext=m?m[2]:'';
    var i=2, cand;
    do { cand=stem+'_'+i+ext; i++; } while(cand in usedNames);
    usedNames[cand]=true; return cand;
  }
  var mappedTeachers=teachers.map(function(t){
    var ic=null, lc=null;
    if(t.idCardAttachment){ ic={ name:uniqueName((t.name||'教师')+'_身份证正反面.'+(t.idCardAttachment.ext||'jpg')), size:t.idCardAttachment.size, type:t.idCardAttachment.type }; }
    if(t.laborContractAttachment){ lc={ name:uniqueName((t.name||'教师')+'_劳动合同.pdf'), size:t.laborContractAttachment.size, type:t.laborContractAttachment.type||'application/pdf' }; }
    return { name:t.name, gender:t.gender, idCard:t.idCard, phone:t.phone, contractStart:t.contractStart, contractEnd:t.contractEnd, entryDate:t.entryDate, idCardAttachment:ic, laborContractAttachment:lc };
  });
  var rec={
    id:newId,
    schoolName:CURRENT_SCHOOL,
    district:CURRENT_DISTRICT,
    status:mode,
    submitTime:ts,
    rejectOpinion:'',
    teachers:mappedTeachers
  };

  all.push(rec);
  saveRecords(all);
  closeModal();
  currentFilter='all';
  document.getElementById('searchInput').value='';
  openRows[newId]=true;
  renderList();
  showToast(mode==='draft'?'已保存为草稿':'入职申报已提交，等待审核','success');
}

/* ---------- init ---------- */
(function init(){
  renderSidebar();
  renderList();
})();
</script>
