<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菜单管理 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
/* Top Nav */
.topnav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; transition: var(--transition); font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }
/* Sidebar */
.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; display: flex; flex-direction: column; transition: width var(--transition); }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7); transition: var(--transition); position: relative; text-decoration: none; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); margin-top: auto; }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label, .sidebar.collapsed .menu-group { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.sidebar.collapsed .role-switcher { display: none; }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.system { background: #EF4444; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }
/* Main */
.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px; min-height: calc(100vh - 56px); transition: margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }
.page-header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }
/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--gray-bg); }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-xs { padding: 3px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.btn-xs-primary { background: var(--primary); color: #fff; }
.btn-xs-primary:hover { background: var(--primary-dark); }
.btn-xs-outline { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-xs-outline:hover { background: var(--gray-bg); }
.btn-xs-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
.btn-xs-danger:hover { background: #FEF2F2; }
.btn-icon { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; border-radius: 4px; border: 1px solid var(--border); background: #fff; color: var(--text-secondary); font-family: inherit; transition: var(--transition); }
.btn-icon:hover { background: var(--gray-bg); }
.btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }
/* Group card */
.group-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); margin-bottom: 16px; overflow: hidden; }
.group-card-header { display: flex; align-items: center; padding: 12px 16px; background: #F8FAFC; border-bottom: 1px solid var(--border); gap: 8px; }
.group-card-header .group-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
.group-card-header .group-name.top-level { color: var(--text-secondary); font-style: italic; }
.group-card-body { padding: 0; }
.menu-row { display: flex; align-items: center; padding: 8px 16px; border-bottom: 1px solid #F1F5F9; gap: 10px; transition: var(--transition); }
.menu-row:last-child { border-bottom: none; }
.menu-row:hover { background: #FAFBFC; }
.menu-row.disabled { background: #F8FAFC; }
.menu-row.disabled .menu-row-label { color: var(--text-light); text-decoration: line-through; opacity: 0.5; }
.menu-seq { width: 24px; text-align: center; font-size: 12px; color: var(--text-light); flex-shrink: 0; font-weight: 500; }
.menu-row-label { flex: 1; font-size: 13px; font-weight: 500; }
.menu-row-icon { font-size: 11px; color: var(--text-light); width: 60px; flex-shrink: 0; }
.menu-row-icon-svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--text-secondary); }
.menu-row.disabled .menu-row-icon-svg { opacity: 0.4; }
.menu-row-actions { display: flex; gap: 4px; flex-shrink: 0; }
/* Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 90%; animation: modalIn 0.2s ease; }
@keyframes modalIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 0; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { width: 32px; height: 32px; border-radius: 6px; border: none; background: transparent; font-size: 18px; cursor: pointer; color: var(--text-light); transition: var(--transition); display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(--gray-bg); color: var(--text); }
.modal-body { padding: 16px 24px; max-height: 60vh; overflow-y: auto; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; padding: 0 24px 20px; }
/* Form */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
.form-group label .required { color: var(--danger); margin-left: 2px; }
.form-group input, .form-group select { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
.form-row { display: flex; gap: 16px; }
.form-row .form-group { flex: 1; }
/* Icon picker */
.icon-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.icon-option { width: 56px; padding: 6px 4px; border: 1.5px solid var(--border); border-radius: 6px; cursor: pointer; text-align: center; font-size: 11px; transition: var(--transition); background: #fff; }
.icon-option:hover { border-color: var(--accent); background: var(--primary-light); }
.icon-option.selected { border-color: var(--primary); background: var(--primary-light); font-weight: 500; }
.icon-option .icon-svg { display: block; margin: 0 auto 2px; width: 20px; height: 20px; color: var(--text-secondary); }
.icon-option.selected .icon-svg { color: var(--primary); }
/* Confirm modal */
.confirm-msg { font-size: 14px; color: var(--text-secondary); }
.confirm-sub { font-size: 12px; color: var(--text-light); margin-top: 6px; }
/* Toast */
.toast { position: fixed; top: 20px; right: 20px; z-index: 9999; padding: 12px 20px; border-radius: 8px; font-size: 13px; color: #fff; font-weight: 500; opacity: 0; transform: translateY(-10px); transition: var(--transition); pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--success); }
.toast.warning { background: var(--warning); }
.toast.error { background: var(--danger); }
/* Footer bar */
.footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<!-- Top Nav -->
<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
    </div>
    <span class="topnav-title">柳州教育人事管理平台</span>
  </div>
  <div class="topnav-right">
    <div class="topnav-bell" onclick="showToast('暂无新消息','warning')">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge">0</span>
    </div>
    <div class="topnav-user" onclick="toggleUserMenu()">
      <div class="avatar" id="userAvatar">赵</div>
      <span id="userName">赵建国</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="user-dropdown" id="userDropdown">
        <a href="personal-center.html">个人中心</a>
        <div class="divider"></div>
        <a class="logout" href="index.html" onclick="localStorage.removeItem('currentUser')">退出登录</a>
      </div>
    </div>
  </div>
</nav>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="sidebar-bottom">
    <div class="sidebar-toggle" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      <span>收起菜单</span>
    </div>
  </div>
  <div class="role-switcher">
    <div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options" id="roleBtns"></div>
  </div>
</aside>

<!-- Main -->
<div class="main" id="mainContent">
  <div class="breadcrumb"><a href="workbench.html">首页</a> &nbsp;/&nbsp; 系统设置 &nbsp;/&nbsp; <span>菜单管理</span></div>
  <div class="page-header">
    <div>
      <h1>菜单管理</h1>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-outline btn-sm" onclick="openAddMenuModal()">+ 新增菜单</button>
    </div>
  </div>
  <div id="menuGroups"></div>
  <div class="footer-bar">
    <button class="btn btn-outline btn-sm" onclick="openAddGroupModal()">+ 新增分组</button>
    <span style="font-size:12px;color:var(--text-light);" id="menuCount"></span>
  </div>
</div>

<!-- Add/Edit Menu Modal -->
<div class="modal-overlay" id="menuModal">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header">
      <h3 id="menuModalTitle">新增菜单</h3>
      <button class="modal-close" onclick="closeMenuModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>菜单名称 <span class="required">*</span></label>
          <input type="text" id="fLabel" placeholder="如：荣誉申请">
        </div>
        <div class="form-group">
          <label>菜单标识 <span class="required">*</span></label>
          <input type="text" id="fId" placeholder="如：honor" readonly disabled style="background:#F8FAFC;">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>所属分组</label>
          <select id="fGroup"></select>
        </div>
        <div class="form-group">
          <label>排序号</label>
          <input type="number" id="fOrder" placeholder="自动分配" min="1" max="999">
        </div>
      </div>
      <div class="form-group">
        <label>路由地址</label>
        <input type="text" id="fRoute" placeholder="如：honor-form.html（留空使用默认映射）">
      </div>
      <div class="form-group">
        <label>图标</label>
        <div class="icon-picker" id="iconPicker"></div>
        <input type="hidden" id="fIcon" value="file">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeMenuModal()">取消</button>
      <button class="btn btn-primary" id="menuSaveBtn" onclick="saveMenuItem()">确认</button>
    </div>
  </div>
</div>

<!-- Add Group Modal -->
<div class="modal-overlay" id="groupModal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <h3>新增分组</h3>
      <button class="modal-close" onclick="closeGroupModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>分组名称 <span class="required">*</span></label>
        <input type="text" id="fGroupName" placeholder="如：荣誉管理">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeGroupModal()">取消</button>
      <button class="btn btn-primary" onclick="addGroup()">确认新增</button>
    </div>
  </div>
</div>

<!-- Status Toggle Confirm Modal -->
<div class="modal-overlay" id="statusModal">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header">
      <h3 id="statusModalTitle">确认停用</h3>
      <button class="modal-close" onclick="closeStatusModal()">✕</button>
    </div>
    <div class="modal-body">
      <p class="confirm-msg" id="statusModalMsg"></p>
      <p class="confirm-sub">停用后菜单将在所有角色侧边栏中隐藏。</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeStatusModal()">取消</button>
      <button class="btn btn-primary" id="statusConfirmBtn" onclick="confirmToggleStatus()">确认</button>
    </div>
  </div>
</div>

<!-- Delete Group Confirm Modal -->
<div class="modal-overlay" id="deleteGroupModal">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header">
      <h3>确认删除分组</h3>
      <button class="modal-close" onclick="closeDeleteGroupModal()">✕</button>
    </div>
    <div class="modal-body">
      <p class="confirm-msg">确定删除分组「<strong id="deleteGroupTargetLabel"></strong>」？</p>
      <p class="confirm-sub" id="deleteGroupSubMsg">组内所有菜单将一并删除，此操作不可恢复。</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeDeleteGroupModal()">取消</button>
      <button class="btn btn-xs-danger" style="padding:8px 18px;font-size:13px;" onclick="confirmDeleteGroup()">确认删除</button>
    </div>
  </div>
</div>

<!-- Edit Group Modal -->
<div class="modal-overlay" id="editGroupModal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <h3>编辑分组名称</h3>
      <button class="modal-close" onclick="closeEditGroupModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>分组名称 <span class="required">*</span></label>
        <input type="text" id="fEditGroupName" placeholder="分组名称">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeEditGroupModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEditGroup()">确认保存</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header">
      <h3>确认删除</h3>
      <button class="modal-close" onclick="closeDeleteModal()">✕</button>
    </div>
    <div class="modal-body">
      <p class="confirm-msg">确定删除菜单「<strong id="deleteTargetLabel"></strong>」？</p>
      <p class="confirm-sub">删除后不可恢复。</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeDeleteModal()">取消</button>
      <button class="btn btn-xs-danger" style="padding:8px 18px;font-size:13px;" id="deleteConfirmBtn" onclick="confirmDeleteMenu()">确认删除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="src/menu-config.js"></script>
<script src="src/logger.js"></script>
<script>
// ========== ICONS ==========
var ICON_DEFS = {
  home: 'home', chart: 'chart', users: 'users', 'user-plus': 'userp',
  'user-minus': 'userx', settings: 'settings', 'trending-up': 'arrowup',
  briefcase: 'search', 'check-circle': 'file', 'log-out': 'clock',
  'alert-circle': 'warn', user: 'user', building: 'building',
  file: 'file', key: 'key', list: 'list', shield: 'shield', clock: 'clock'

// ========== DATA ==========
function loadConfig() {
  var raw = localStorage.getItem('menu_config');
  if (raw) {
    try { savedConfig = JSON.parse(raw); } catch(e) { savedConfig = null; }
  }
  if (!savedConfig || !savedConfig.menus || !savedConfig.groupOrder) {
    savedConfig = JSON.parse(JSON.stringify(getDefaultConfig()));
  }
  // 迁移：补全"编外教师管理"分组及菜单项（兼容旧版持久化配置）
  if (savedConfig.groupOrder.indexOf('编外教师管理') === -1) {
    var gi = savedConfig.groupOrder.indexOf('聘用管理');
    if (gi >= 0) savedConfig.groupOrder.splice(gi + 1, 0, '编外教师管理');
    else savedConfig.groupOrder.push('编外教师管理');
  }
  var hasCE = false, hasCX = false;
  for (var i = 0; i < savedConfig.menus.length; i++) {
    if (savedConfig.menus[i].id === 'contract-entry') hasCE = true;
    if (savedConfig.menus[i].id === 'contract-exit') hasCX = true;
  }
  if (!hasCE) savedConfig.menus.push({ id: 'contract-entry', label: '教师入职管理', icon: 'userp', group: '编外教师管理', order: 1, route: '', status: 'active' });
  if (!hasCX) savedConfig.menus.push({ id: 'contract-exit', label: '教师离职管理', icon: 'userx', group: '编外教师管理', order: 2, route: '', status: 'active' });
  // 迁移：补全公告管理菜单项
  var hasAnn = false;
  for (var j = 0; j < savedConfig.menus.length; j++) {
    if (savedConfig.menus[j].id === 'announcement') { hasAnn = true; break; }
  }
  if (!hasAnn) savedConfig.menus.push({ id: 'announcement', label: '公告管理', icon: 'file', group: '系统设置', order: 6, route: 'announcement-management.html', status: 'active' });
  // 迁移：补全字典管理菜单项
  var hasDict = false;
  for (var k = 0; k < savedConfig.menus.length; k++) {
    if (savedConfig.menus[k].id === 'dict') { hasDict = true; break; }
  }
  if (!hasDict) savedConfig.menus.push({ id: 'dict', label: '字典管理', icon: 'list', group: '系统设置', order: 7, route: 'dict-management.html', status: 'active' });
  draftConfig = JSON.parse(JSON.stringify(savedConfig));
}

// 所有操作确认后立即持久化到 localStorage
function persistConfig() {
  savedConfig = JSON.parse(JSON.stringify(draftConfig));
  localStorage.setItem('menu_config', JSON.stringify(savedConfig));
}

// ========== RENDER ==========
function renderAll() {
  var groups = {};
  // Build group map
  for (var i = 0; i < draftConfig.menus.length; i++) {
    var m = draftConfig.menus[i];
    var g = m.group || '';
    if (!groups[g]) groups[g] = [];
    groups[g].push(m);
  }
  // Sort menus within each group by order
  for (var key in groups) {
    groups[key].sort(function(a, b) { return a.order - b.order; });
  }

  var html = '';
  var totalCount = 0;

  // Render groups in groupOrder
  for (var gi = 0; gi < draftConfig.groupOrder.length; gi++) {
    var gname = draftConfig.groupOrder[gi];
    var groupMenus = groups[gname] || [];

    var isTop = gname === '';
    var groupIdx = gi;
    var hasMenus = groupMenus.length > 0;
    var isFirst = (groupIdx === 0);
    var isLast = (groupIdx === draftConfig.groupOrder.length - 1);

    html += '<div class="group-card' + (hasMenus ? '' : ' empty-group') + '">';
    html += '<div class="group-card-header">';
    html += '<span class="group-name' + (isTop ? ' top-level' : '') + '">' + (isTop ? '▎顶部独立项' : escapeHtml(gname)) + '</span>';
    // Group sort buttons
    if (!isTop) {
      html += '<button class="btn-icon" ' + (isFirst ? 'disabled' : '') + ' onclick="moveGroupUp(' + groupIdx + ')" title="上移分组">↥</button>';
      html += '<button class="btn-icon" ' + (isLast ? 'disabled' : '') + ' onclick="moveGroupDown(' + groupIdx + ')" title="下移分组">↧</button>';
      html += '<button class="btn-icon" onclick="openEditGroupModal(\'' + escapeAttr(gname) + '\')" title="编辑组名">✎</button>';
    }
    html += '<button class="btn-xs btn-xs-outline" onclick="openAddMenuModal(\'' + escapeAttr(gname) + '\')">+ 添加到此组</button>';
    if (!isTop) {
      html += '<button class="btn-xs btn-xs-danger" onclick="openDeleteGroupModal(\'' + escapeAttr(gname) + '\')">删除分组</button>';
    }
    html += '</div>';
    html += '<div class="group-card-body">';

    if (!hasMenus) {
      html += '<div style="text-align:center;padding:16px;font-size:12px;color:var(--text-light);">此分组暂无菜单</div>';
    }

    for (var mi = 0; mi < groupMenus.length; mi++) {
      var menu = groupMenus[mi];
      var disabled = menu.status === 'inactive';
      var isFirstItem = (mi === 0);
      var isLastItem = (mi === groupMenus.length - 1);

      html += '<div class="menu-row' + (disabled ? ' disabled' : '') + '">';
      html += '<span class="menu-seq">' + (mi + 1) + '</span>';
      html += '<span class="menu-row-icon-svg">' + (ICON_SVGS[menu.icon] || '') + '</span>';
      html += '<span class="menu-row-label">' + escapeHtml(menu.label) + '</span>';
      html += '<div class="menu-row-actions">';
      // Status toggle
      if (menu.status === 'active') {
        html += '<button class="btn-xs btn-xs-primary" onclick="openStatusModal(\'' + menu.id + '\',\'disable\')">启用</button>';
      } else {
        html += '<button class="btn-xs btn-xs-outline" onclick="openStatusModal(\'' + menu.id + '\',\'enable\')">停用</button>';
      }
      // Sort buttons
      html += '<button class="btn-icon" ' + (isFirstItem ? 'disabled' : '') + ' onclick="moveItemUp(\'' + menu.id + '\')" title="上移">↑</button>';
      html += '<button class="btn-icon" ' + (isLastItem ? 'disabled' : '') + ' onclick="moveItemDown(\'' + menu.id + '\')" title="下移">↓</button>';
      // Edit / Delete
      html += '<button class="btn-xs btn-xs-outline" onclick="openEditMenuModal(\'' + menu.id + '\')">编辑</button>';
      html += '<button class="btn-xs btn-xs-danger" onclick="openDeleteMenuModal(\'' + menu.id + '\')">删除</button>';
      html += '</div>';
      html += '</div>';
      totalCount++;
    }

    html += '</div></div>';
  }

  // Show any groups not in groupOrder
  for (var gk in groups) {
    if (draftConfig.groupOrder.indexOf(gk) !== -1) continue;
    var orphanMenus = groups[gk];
    if (!orphanMenus.length) continue;
    html += '<div class="group-card" style="opacity:0.7;">';
    html += '<div class="group-card-header">';
    html += '<span class="group-name' + (gk === '' ? ' top-level' : '') + '">' + (gk === '' ? '▎顶部独立项' : escapeHtml(gk)) + ' (未排序)</span>';
    html += '</div><div class="group-card-body">';
    for (var oi = 0; oi < orphanMenus.length; oi++) {
      var om = orphanMenus[oi];
      html += '<div class="menu-row"><span class="menu-seq">' + (oi + 1) + '</span><span class="menu-row-icon-svg">' + (ICON_SVGS[om.icon] || '') + '</span><span class="menu-row-label">' + escapeHtml(om.label) + '</span><span style="font-size:11px;color:var(--text-light);">等待保存排序</span></div>';
      totalCount++;
    }
    html += '</div></div>';
  }

  document.getElementById('menuGroups').innerHTML = html || '<div style="text-align:center;padding:60px;color:var(--text-light);background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border);">暂无菜单，请点击"新增菜单"</div>';
  document.getElementById('menuCount').textContent = '共 ' + totalCount + ' 个菜单项 · ' + draftConfig.groupOrder.length + ' 个分组';
}

// ========== GROUP OPERATIONS ==========
function moveGroupUp(idx) {
  if (idx <= 0) return;
  var tmp = draftConfig.groupOrder[idx];
  draftConfig.groupOrder[idx] = draftConfig.groupOrder[idx - 1];
  draftConfig.groupOrder[idx - 1] = tmp;
  persistConfig();
  renderAll();
}

function moveGroupDown(idx) {
  if (idx >= draftConfig.groupOrder.length - 1) return;
  var tmp = draftConfig.groupOrder[idx];
  draftConfig.groupOrder[idx] = draftConfig.groupOrder[idx + 1];
  draftConfig.groupOrder[idx + 1] = tmp;
  persistConfig();
  renderAll();
}

function openAddGroupModal() {
  document.getElementById('fGroupName').value = '';
  document.getElementById('groupModal').classList.add('show');
}

function closeGroupModal() {
  document.getElementById('groupModal').classList.remove('show');
}

function addGroup() {
  var name = document.getElementById('fGroupName').value.trim();
  if (!name) { showToast('请输入分组名称', 'warning'); return; }
  if (draftConfig.groupOrder.indexOf(name) !== -1) { showToast('分组已存在', 'warning'); return; }
  // Also check existing menus for group name with different case
  for (var i = 0; i < draftConfig.groupOrder.length; i++) {
    if (draftConfig.groupOrder[i].toLowerCase() === name.toLowerCase()) { showToast('分组已存在（不区分大小写）', 'warning'); return; }
  }
  draftConfig.groupOrder.push(name);

  closeGroupModal();
  persistConfig();
  showToast('分组「' + name + '」已添加', 'success');
  if (typeof writeLog === 'function') writeLog({ module: 'menu', actionType: 'create', targetType: 'group', targetName: name, detail: '新增菜单分组', result: 'success' });
  renderAll();
}

function openEditGroupModal(gname) {
  editingGroupName = gname;
  document.getElementById('fEditGroupName').value = gname;
  document.getElementById('editGroupModal').classList.add('show');
}

function closeEditGroupModal() {
  document.getElementById('editGroupModal').classList.remove('show');
  editingGroupName = null;
}

function saveEditGroup() {
  var newName = document.getElementById('fEditGroupName').value.trim();
  if (!newName) { showToast('请输入分组名称', 'warning'); return; }
  if (newName === editingGroupName) { closeEditGroupModal(); return; }
  // Check uniqueness
  for (var i = 0; i < draftConfig.groupOrder.length; i++) {
    if (draftConfig.groupOrder[i].toLowerCase() === newName.toLowerCase() && draftConfig.groupOrder[i] !== editingGroupName) {
      showToast('分组名称已存在', 'warning'); return;
    }
  }
  // Update groupOrder
  for (var j = 0; j < draftConfig.groupOrder.length; j++) {
    if (draftConfig.groupOrder[j] === editingGroupName) {
      draftConfig.groupOrder[j] = newName;
      break;
    }
  }
  // Update all menus in this group
  for (var k = 0; k < draftConfig.menus.length; k++) {
    if (draftConfig.menus[k].group === editingGroupName) {
      draftConfig.menus[k].group = newName;
    }
  }

  closeEditGroupModal();
  persistConfig();
  showToast('分组已更名为「' + newName + '」', 'success');
  if (typeof writeLog === 'function') writeLog({ module: 'menu', actionType: 'update', targetType: 'group', targetName: newName, detail: '重命名菜单分组：' + editingGroupName + ' → ' + newName, result: 'success' });
  renderAll();
}

function openDeleteGroupModal(gname) {
  deletingGroupName = gname;
  document.getElementById('deleteGroupTargetLabel').textContent = gname;
  // Count menus in this group
  var count = 0;
  for (var i = 0; i < draftConfig.menus.length; i++) {
    if ((draftConfig.menus[i].group || '') === gname) count++;
  }
  document.getElementById('deleteGroupSubMsg').textContent = '组内 ' + count + ' 个菜单将一并删除，此操作不可恢复。';
  document.getElementById('deleteGroupModal').classList.add('show');
}

function closeDeleteGroupModal() {
  document.getElementById('deleteGroupModal').classList.remove('show');
  deletingGroupName = null;
}

function confirmDeleteGroup() {
  if (deletingGroupName === null || deletingGroupName === undefined) return;
  var gname = deletingGroupName;
  // Remove group from groupOrder
  draftConfig.groupOrder = draftConfig.groupOrder.filter(function(g) { return g !== gname; });
  // Remove all menus in this group
  draftConfig.menus = draftConfig.menus.filter(function(m) { return (m.group || '') !== gname; });

  closeDeleteGroupModal();
  persistConfig();
  showToast('分组「' + gname + '」及组内菜单已删除', 'success');
  if (typeof writeLog === 'function') writeLog({ module: 'menu', actionType: 'delete', targetType: 'group', targetName: gname, detail: '删除菜单分组及组内所有菜单', result: 'success' });
  renderAll();
}

// ========== MENU ITEM OPERATIONS ==========
function openStatusModal(id, action) {
  pendingStatusMenuId = id;
  var menu = null;
  for (var i = 0; i < draftConfig.menus.length; i++) {
    if (draftConfig.menus[i].id === id) { menu = draftConfig.menus[i]; break; }
  }
  if (!menu) return;
  var label = menu.label;
  if (action === 'disable') {
    document.getElementById('statusModalTitle').textContent = '确认停用';
    document.getElementById('statusModalMsg').innerHTML = '确定停用菜单「<strong>' + escapeHtml(label) + '</strong>」？';
    document.getElementById('statusConfirmBtn').className = 'btn btn-primary';
    document.getElementById('statusConfirmBtn').textContent = '确认停用';
  } else {
    document.getElementById('statusModalTitle').textContent = '确认启用';
    document.getElementById('statusModalMsg').innerHTML = '确定启用菜单「<strong>' + escapeHtml(label) + '</strong>」？';
    document.getElementById('statusConfirmBtn').className = 'btn btn-primary';
    document.getElementById('statusConfirmBtn').textContent = '确认启用';
  }
  document.getElementById('statusModal').classList.add('show');
}

function closeStatusModal() {
  document.getElementById('statusModal').classList.remove('show');
  pendingStatusMenuId = null;
}

function confirmToggleStatus() {
  if (!pendingStatusMenuId) return;
  for (var i = 0; i < draftConfig.menus.length; i++) {
    if (draftConfig.menus[i].id === pendingStatusMenuId) {
      var newStatus = draftConfig.menus[i].status === 'active' ? 'inactive' : 'active';
      draftConfig.menus[i].status = newStatus;
      break;
    }
  }

  closeStatusModal();
  persistConfig();
  showToast('菜单状态已更新', 'success');
  if (typeof writeLog === 'function') writeLog({ module: 'menu', actionType: 'update', targetType: 'menu', targetId: pendingStatusMenuId, detail: '切换菜单启停状态', result: 'success' });
  renderAll();
}

function moveItemUp(id) {
  var menu = null;
  for (var i = 0; i < draftConfig.menus.length; i++) {
    if (draftConfig.menus[i].id === id) { menu = draftConfig.menus[i]; break; }
  }
  if (!menu) return;
  // Find previous item in same group
  var sameGroup = [];
  for (var j = 0; j < draftConfig.menus.length; j++) {
    if ((draftConfig.menus[j].group || '') === (menu.group || '')) {
      sameGroup.push(draftConfig.menus[j]);
    }
  }
  sameGroup.sort(function(a, b) { return a.order - b.order; });
  var idx = -1;
  for (var k = 0; k < sameGroup.length; k++) {
    if (sameGroup[k].id === id) { idx = k; break; }
  }
  if (idx <= 0) return;
  // Swap order values
  var prev = sameGroup[idx - 1];
  var tmpOrder = menu.order;
  menu.order = prev.order;
  prev.order = tmpOrder;
  persistConfig();
  renderAll();
}

function moveItemDown(id) {
  var menu = null;
  for (var i = 0; i < draftConfig.menus.length; i++) {
    if (draftConfig.menus[i].id === id) { menu = draftConfig.menus[i]; break; }
  }
  if (!menu) return;
  var sameGroup = [];
  for (var j = 0; j < draftConfig.menus.length; j++) {
    if ((draftConfig.menus[j].group || '') === (menu.group || '')) {
      sameGroup.push(draftConfig.menus[j]);
    }
  }
  sameGroup.sort(function(a, b) { return a.order - b.order; });
  var idx = -1;
  for (var k = 0; k < sameGroup.length; k++) {
    if (sameGroup[k].id === id) { idx = k; break; }
  }
  if (idx < 0 || idx >= sameGroup.length - 1) return;
  var next = sameGroup[idx + 1];
  var tmpOrder = menu.order;
  menu.order = next.order;
  next.order = tmpOrder;
  persistConfig();
  renderAll();
}

// ========== ADD/EDIT MODAL ==========
function openAddMenuModal(prefillGroup) {
  editingMenuId = null;
  document.getElementById('menuModalTitle').textContent = '新增菜单';
  document.getElementById('fLabel').value = '';
  document.getElementById('fId').value = '';
  document.getElementById('fId').disabled = false;
  document.getElementById('fId').style.background = '#fff';
  document.getElementById('fRoute').value = '';
  document.getElementById('fOrder').value = '';
  document.getElementById('menuSaveBtn').textContent = '确认新增';

  // Populate group dropdown
  populateGroupSelect(prefillGroup || '');

  selectedIcon = 'file';
  document.getElementById('fIcon').value = 'file';
  renderIconPicker();

  document.getElementById('menuModal').classList.add('show');
}

function openEditMenuModal(id) {
  var menu = null;
  for (var i = 0; i < draftConfig.menus.length; i++) {
    if (draftConfig.menus[i].id === id) { menu = draftConfig.menus[i]; break; }
  }
  if (!menu) return;

  editingMenuId = id;
  document.getElementById('menuModalTitle').textContent = '编辑菜单';
  document.getElementById('fLabel').value = menu.label;
  document.getElementById('fId').value = menu.id;
  document.getElementById('fId').disabled = true;
  document.getElementById('fId').style.background = '#F8FAFC';
  document.getElementById('fRoute').value = menu.route || '';
  document.getElementById('fOrder').value = menu.order;
  document.getElementById('menuSaveBtn').textContent = '确认保存';

  populateGroupSelect(menu.group || '');
  selectedIcon = menu.icon || 'file';
  document.getElementById('fIcon').value = selectedIcon;
  renderIconPicker();

  document.getElementById('menuModal').classList.add('show');
}

function closeMenuModal() {
  document.getElementById('menuModal').classList.remove('show');
  editingMenuId = null;
}

function populateGroupSelect(selected) {
  var sel = document.getElementById('fGroup');
  var html = '<option value="">(顶部独立项)</option>';
  for (var i = 0; i < draftConfig.groupOrder.length; i++) {
    var g = draftConfig.groupOrder[i];
    if (g === '') continue;
    html += '<option value="' + escapeAttr(g) + '"' + (g === selected ? ' selected' : '') + '>' + escapeHtml(g) + '</option>';
  }
  sel.innerHTML = html;
}

function saveMenuItem() {
  var label = document.getElementById('fLabel').value.trim();
  if (!label) { showToast('请输入菜单名称', 'warning'); return; }
  var id = document.getElementById('fId').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!id) { showToast('请输入菜单标识', 'warning'); return; }
  var group = document.getElementById('fGroup').value;
  var route = document.getElementById('fRoute').value.trim();
  var icon = selectedIcon;
  var orderStr = document.getElementById('fOrder').value.trim();

  if (editingMenuId) {
    // Edit existing
    for (var i = 0; i < draftConfig.menus.length; i++) {
      if (draftConfig.menus[i].id === editingMenuId) {
        var oldGroup = draftConfig.menus[i].group;
        draftConfig.menus[i].label = label;
        draftConfig.menus[i].group = group;
        draftConfig.menus[i].route = route;
        draftConfig.menus[i].icon = icon;
        // If group changed, auto-assign order to end of new group
        if (group !== (oldGroup || '')) {
          var maxOrder = 0;
          for (var j = 0; j < draftConfig.menus.length; j++) {
            if ((draftConfig.menus[j].group || '') === group && draftConfig.menus[j].id !== editingMenuId) {
              if (draftConfig.menus[j].order > maxOrder) maxOrder = draftConfig.menus[j].order;
            }
          }
          draftConfig.menus[i].order = orderStr ? parseInt(orderStr) : maxOrder + 1;
        } else if (orderStr) {
          draftConfig.menus[i].order = parseInt(orderStr);
        }
        break;
      }
    }
    showToast('菜单「' + label + '」已更新', 'success');
  } else {
    // New - check id uniqueness
    for (var k = 0; k < draftConfig.menus.length; k++) {
      if (draftConfig.menus[k].id === id) { showToast('菜单标识已存在', 'warning'); return; }
    }
    var maxOrder = 0;
    for (var m = 0; m < draftConfig.menus.length; m++) {
      if ((draftConfig.menus[m].group || '') === group) {
        if (draftConfig.menus[m].order > maxOrder) maxOrder = draftConfig.menus[m].order;
      }
    }
    var newOrder = orderStr ? parseInt(orderStr) : maxOrder + 1;
    draftConfig.menus.push({
      id: id, label: label, icon: icon, group: group,
      order: newOrder, route: route, status: 'active'
    });
    showToast('菜单「' + label + '」已添加', 'success');
  }

  persistConfig();
  closeMenuModal();
  renderAll();

  if (typeof writeLog === 'function') {
    writeLog({ module: 'menu', actionType: editingMenuId ? 'update' : 'create', targetType: 'menu', targetId: editingMenuId || id, targetName: label, detail: editingMenuId ? '编辑菜单' : '新增菜单', result: 'success' });
  }
}

// ========== DELETE ==========
function openDeleteMenuModal(id) {
  deletingMenuId = id;
  for (var i = 0; i < draftConfig.menus.length; i++) {
    if (draftConfig.menus[i].id === id) {
      document.getElementById('deleteTargetLabel').textContent = draftConfig.menus[i].label;
      break;
    }
  }
  document.getElementById('deleteModal').classList.add('show');
}

function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('show');
  deletingMenuId = null;
}

function confirmDeleteMenu() {
  if (!deletingMenuId) return;
  var label = '';
  draftConfig.menus = draftConfig.menus.filter(function(m) {
    if (m.id === deletingMenuId) { label = m.label; return false; }
    return true;
  });

  closeDeleteModal();
  persistConfig();
  showToast('菜单「' + label + '」已删除', 'success');
  if (typeof writeLog === 'function') writeLog({ module: 'menu', actionType: 'delete', targetType: 'menu', targetId: deletingMenuId, targetName: label, detail: '删除菜单', result: 'success' });
  renderAll();
}

// ========== SIDEBAR ==========
function renderSidebar() {
  renderSidebarMenu('sidebarMenu', 'system', 'menuMgr');
}

function sidebarClick(id) {
  var ROUTES = {
    account: 'account-management.html', org: 'org-management.html',

// ========== UTILS ==========
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
function toggleUserMenu() { document.getElementById('userDropdown').classList.toggle('show'); }

function renderRoleSwitcher() {
  var ROLES = {
    system:   { label:'系统管理员', name:'赵建国' },
    city:     { label:'市管理员', name:'张建国' },
    district: { label:'区管理员', name:'李振华' },
    school:   { label:'校管理员', name:'王玉兰' },
    teacher:  { label:'教 师',   name:'陈明辉' }
  };
  var dots = { system: 'system', city: 'city', district: 'district', school: 'school', teacher: 'teacher' };
  var html = '';
  for (var key in ROLES) {
    var cfg = ROLES[key];
    var activeClass = (currentUser.role === key) ? ' active' : '';
    html += '<button class="role-switch-btn' + activeClass + '" onclick="switchRole(\'' + key + '\')">';
    html += '<span class="role-switch-dot ' + dots[key] + '"></span>';
    html += '<span class="role-switcher-name">' + cfg.label + '</span>';
    html += '<span style="font-size:10px;color:rgba(255,255,255,0.3);margin-left:auto;">' + escapeHtml(cfg.name) + '</span>';
    html += '</button>';
  }
  document.getElementById('roleBtns').innerHTML = html;
}

function switchRole(role) {
  if (role === currentUser.role) return;
  if (role === 'system') {
    localStorage.setItem('currentUser', JSON.stringify({ role: 'system', name: '赵建国', id: '13807720000' }));
    window.location.href = 'account-management.html';
    return;
  }
  var district = role === 'district' ? '鱼峰区' : '';
  localStorage.setItem('currentUser', JSON.stringify({
    role: role,
    name: role === 'city' ? '张建国' : role === 'district' ? '李振华' : role === 'school' ? '王玉兰' : '陈明辉',
    id: role === 'city' ? 'C001' : role === 'district' ? 'D001' : role === 'school' ? 'S001' : 'T001',
    district: district,
    schoolName: role === 'school' ? '柳州市第八中学' : ''
  }));
  window.location.href = 'workbench.html';
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (type || 'success') + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s) { if (!s) return ''; return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

// ========== INIT ==========
function init() {
  var raw = localStorage.getItem('currentUser');
  if (raw) { try { currentUser = JSON.parse(raw); } catch(e) {} }
  if (!currentUser || !currentUser.role) { currentUser = { role: 'system', name: '赵建国', id: '13807720000' }; }

  document.getElementById('userName').textContent = currentUser.name || '赵建国';
  document.getElementById('userAvatar').textContent = (currentUser.name || '赵')[0];
  renderSidebar();
  renderRoleSwitcher();

  if (currentUser.role !== 'system') {
    document.getElementById('mainContent').innerHTML =
      '<div class="breadcrumb"><a href="workbench.html">首页</a> &nbsp;/&nbsp; <span>菜单管理</span></div>' +
      '<div style="text-align:center;padding:60px;color:var(--text-light);background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border);">' +
      '<p style="font-size:16px;">您无权访问菜单管理</p><p style="font-size:13px;margin-top:8px;">仅系统管理员可管理菜单</p></div>';
    return;
  }

  document.getElementById('userName').textContent = currentUser.name || '赵建国';
  document.getElementById('userAvatar').textContent = (currentUser.name || '赵')[0];
  renderSidebar();
  renderRoleSwitcher();
  loadConfig();
  renderIconPicker(); // Prepare icon picker
  renderAll();
}

// Close modals on overlay click
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('show');
  if (!e.target.closest('#userDropdown') && !e.target.closest('.topnav-user')) {
    document.getElementById('userDropdown').classList.remove('show');
  }
});

init();
</script>
