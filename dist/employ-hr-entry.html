<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>录入人社核准结果 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--primary:#1E40AF;--primary-dark:#1E3A8A;--primary-light:#EFF6FF;--accent:#3B82F6;--text:#1E293B;--text-secondary:#64748B;--text-light:#94A3B8;--border:#E2E8F0;--bg:#F8FAFC;--white:#FFFFFF;--gray-bg:#F1F5F9;--danger:#EF4444;--success:#10B981;--warning:#F59E0B;--radius:8px;--radius-lg:12px;--shadow:0 4px 24px rgba(0,0,0,0.08);--shadow-lg:0 12px 48px rgba(0,0,0,0.12);--transition:0.2s cubic-bezier(0.4,0,0.2,1);--sidebar-w:240px;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.topnav{position:fixed;top:0;left:0;right:0;height:56px;background:linear-gradient(135deg,#1E3A8A,#1E40AF);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100;}
.topnav-left{display:flex;align-items:center;gap:14px;}
.topnav-logo{width:38px;height:38px;background:rgba(255,255,255,0.18);border-radius:10px;display:flex;align-items:center;justify-content:center;}
.topnav-title{font-size:17px;font-weight:600;color:#fff;}
.topnav-right{display:flex;align-items:center;gap:18px;}
.topnav-user{display:flex;align-items:center;gap:8px;cursor:pointer;color:rgba(255,255,255,0.9);padding:6px 12px;font-size:13px;position:relative;}
.topnav-user .avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;}
.user-dropdown{display:none;position:absolute;top:46px;right:0;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:160px;z-index:200;overflow:hidden;}
.user-dropdown.show{display:block;}
.user-dropdown a{display:block;padding:12px 18px;font-size:13px;color:var(--text);text-decoration:none;}
.user-dropdown a:hover{background:var(--primary-light);color:var(--primary);}
.user-dropdown .divider{height:1px;background:var(--border);}
.user-dropdown .logout{color:var(--danger);}
.sidebar{position:fixed;top:56px;left:0;bottom:0;width:var(--sidebar-w);background:#1E3A8A;z-index:90;overflow-y:auto;display:flex;flex-direction:column;}
.sidebar.collapsed{width:64px;}
.sidebar.collapsed .menu-label,.sidebar.collapsed .menu-group,.sidebar.collapsed .menu-badge{display:none;}
.sidebar.collapsed .menu-item{justify-content:center;padding:12px 0;}
.sidebar.collapsed .menu-icon{margin-right:0;}
.sidebar-menu{flex:1;padding:8px 0;}
.menu-group{padding:14px 20px 4px;font-size:11px;color:rgba(255,255,255,0.4);}
.menu-item{display:flex;align-items:center;padding:10px 20px;cursor:pointer;font-size:13px;color:rgba(255,255,255,0.7);text-decoration:none;border-left:3px solid transparent;}
.menu-item:hover{background:rgba(255,255,255,0.05);color:#fff;}
.menu-item.active{background:rgba(255,255,255,0.08);color:#fff;border-left-color:var(--accent);}
.menu-item .menu-icon{width:18px;height:18px;margin-right:10px;flex-shrink:0;opacity:0.7;}
.sidebar-bottom{border-top:1px solid rgba(255,255,255,0.08);}
.sidebar-toggle{display:flex;align-items:center;gap:8px;padding:10px 20px;cursor:pointer;font-size:12px;color:rgba(255,255,255,0.5);}
.sidebar-toggle svg{width:16px;height:16px;}
.role-switcher{padding:10px 16px 12px;border-top:1px solid rgba(255,255,255,0.08);}
.role-switcher-label{font-size:10px;color:rgba(255,255,255,0.35);}
.role-switcher-options{display:flex;flex-direction:column;gap:4px;}
.role-switch-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:rgba(255,255,255,0.55);border:1px solid transparent;background:transparent;font-family:inherit;text-align:left;}
.role-switch-btn:hover{background:rgba(255,255,255,0.06);}
.role-switch-btn.active{background:rgba(59,130,246,0.2);color:#fff;}
.role-switch-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.role-switch-dot.city{background:#3B82F6;}.role-switch-dot.district{background:#F59E0B;}.role-switch-dot.school{background:#10B981;}
.main{margin-left:var(--sidebar-w);margin-top:56px;padding:24px;min-height:calc(100vh-56px);}
.sidebar.collapsed~.main{margin-left:64px;}
.breadcrumb{font-size:12px;color:var(--text-light);margin-bottom:16px;}
.breadcrumb a{color:var(--text-light);text-decoration:none;}
.breadcrumb a:hover{color:var(--primary);}
.page-header{margin-bottom:20px;}
.page-header h1{font-size:20px;font-weight:700;}
.page-header .subtitle{font-size:12px;color:var(--text-light);margin-top:2px;}
.two-columns{display:flex;gap:24px;align-items:flex-start;}
.main-col{flex:1;min-width:0;}
.side-col{width:320px;flex-shrink:0;}
.form-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;}
.form-card h3{font-size:14px;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.sidebar-section{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;}
.sidebar-section h4{font-size:13px;font-weight:600;margin-bottom:14px;}
.timeline{position:relative;padding-left:20px;}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border);}
.timeline-item{position:relative;padding-bottom:16px;}
.timeline-item::before{content:'';position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--border);}
.timeline-item .tl-time{font-size:11px;color:var(--text-light);}
.timeline-item .tl-action{font-size:12px;font-weight:500;margin-top:2px;}
.timeline-item .tl-operator{font-size:11px;color:var(--text-secondary);}
.progress-bar{display:flex;align-items:center;padding:16px 24px;background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border);margin-bottom:20px;}
.step-wrapper{display:flex;align-items:center;flex:1;}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;min-width:70px;}
.step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:2px solid var(--border);color:var(--text-light);background:#fff;}
.step.done .step-dot{background:var(--success);color:#fff;border-color:var(--success);}
.step.current .step-dot{background:var(--primary);color:#fff;border-color:var(--primary);}
.step-text{font-size:11px;color:var(--text-light);white-space:nowrap;}
.step.current .step-text{color:var(--primary);font-weight:500;}
.step.done .step-text{color:var(--success);}
.step-line{flex:1;height:2px;background:var(--border);margin:0 4px 20px;min-width:20px;}
.step-line.done{background:var(--success);}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:4px;}
.form-group label .req{color:var(--danger);}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;font-family:inherit;background:#fff;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent);}
.form-row{display:flex;gap:16px;}
.form-row .form-group{flex:1;}
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;margin-bottom:12px;transition:var(--transition);}
.upload-area:hover{border-color:var(--accent);background:var(--primary-light);}
.upload-area .upload-icon{font-size:28px;margin-bottom:8px;}
.upload-area .upload-text{font-size:13px;color:var(--text-secondary);}
.submit-bar{display:flex;justify-content:flex-end;gap:12px;padding-top:16px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;font-size:13px;font-weight:500;border-radius:6px;cursor:pointer;font-family:inherit;border:1px solid transparent;text-decoration:none;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:#fff;color:var(--text-secondary);border:1px solid var(--border);}
.btn-outline:hover{background:var(--gray-bg);}
.btn-success{background:var(--success);color:#fff;}
.btn-success:hover{background:#059669;}
.file-list{margin-bottom:12px;}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid var(--border);border-radius:4px;margin-bottom:6px;font-size:12px;background:#fff;}
.file-item .file-name{flex:1;}
.file-item .file-remove{color:var(--danger);cursor:pointer;font-size:11px;}
.back-link{font-size:12px;color:var(--text-secondary);cursor:pointer;margin-bottom:16px;display:inline-block;}
.back-link:hover{color:var(--primary);}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;animation:toastIn .3s ease;box-shadow:var(--shadow-lg);}
.toast.success{background:var(--success);}.toast.warning{background:var(--warning);color:#1E293B;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%)translateY(-10px)}to{opacity:1;transform:translateX(-50%)translateY(0)}}
</style>
</head>
<body>
<nav class="topnav"><div class="topnav-left"><div class="topnav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="1" width="18" height="22" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="12" y2="14"/><line x1="12" y1="18" x2="16" y2="18"/><circle cx="8" cy="18" r="1.5" fill="#fff"/></svg></div><span class="topnav-title">柳州教育人事管理平台</span></div>
  <div class="topnav-right"><div class="topnav-user" onclick="toggleUserMenu()"><div class="avatar" id="userAvatar">王</div><span id="userName">王玉兰</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    <div class="user-dropdown" id="userDropdown"><a href="index.html" class="logout">退出登录</a></div></div></div>
</nav>
<aside class="sidebar" id="sidebar"><div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="role-switcher"><div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options">
      <button class="role-switch-btn active" data-role="school" onclick="switchRole('school')"><span class="role-switch-dot school"></span>校管理员</button>
    </div></div>
  <div class="sidebar-bottom"><div class="sidebar-toggle" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg><span class="menu-label">收起菜单</span></div></div>
</aside>
<main class="main" id="mainContent"></main>
<div id="toastContainer"></div>

<script>
window.onerror=function(msg,url,line){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#FEE2E2;color:#991B1B;padding:16px 20px;font-family:monospace;font-size:13px;';d.innerHTML='ERROR: '+msg+' (line '+line+')<br><button onclick="location.reload()" style="margin-top:8px;padding:6px 16px;cursor:pointer;">重新加载</button>';document.body.prepend(d);};

var ICONS={home:'<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',chart:'<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',file:'<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'};
var MENU_ICONS={workbench:'home',employ:'file'};
var ROLES={school:{name:'王玉兰',short:'校',sidebar:{top:[{id:'workbench',icon:'home',label:'工作台'}],groups:[{name:'聘用管理',items:[{id:'employ',label:'聘用手续办理'}]}]}}};
var currentRecord=null;var hrUploadedFiles=[];

function escapeHtml(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(m,t){var e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;document.getElementById('toastContainer').appendChild(e);setTimeout(function(){e.remove();},2000);}
function toggleUserMenu(){document.getElementById('userDropdown').classList.toggle('show');}
document.addEventListener('click',function(e){if(!e.target.closest('.topnav-user'))document.getElementById('userDropdown').classList.remove('show');});
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed');}
function now(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}
function formatSize(b){if(!b)return'';if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB';}

function loadEmployRecords(){var s=localStorage.getItem('employ_records');if(s){try{return JSON.parse(s);}catch(e){}}return [];}
function saveEmployRecords(r){localStorage.setItem('employ_records',JSON.stringify(r));}


function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') { window.location.href = '教师入编管理（学校管理员视角）.html'; return; }
  if (id === 'exit') { window.location.href = '教师出编管理（学校管理员视角）.html'; return; }
  if (id === 'postset') { window.location.href = 'post-list-school.html'; return; }
  if (id === 'promote') { window.location.href = 'promote-list-school.html'; return; }
  if (id === 'recruit') { window.location.href = 'recruit-list-school.html'; return; }
  if (id === 'employ') { window.location.href = 'employ-list-school.html'; return; }
  if (id === 'retire') { showToast('退休呈报页面开发中'); return; }
  if (id === 'salary') { showToast('工资核定申请页面开发中'); return; }
  if (id === 'ethics') { showToast('师德师风举报页面开发中'); return; }
  if (id === 'honor') { showToast('荣誉申请页面开发中'); return; }
  if (id === 'account') { window.location.href = 'account-management.html'; return; }
  else if (id === 'ledger') { var _r3 = (typeof currentUser!=='undefined'?currentUser.role:currentRole); window.location.href = (_r3 === 'city' || _r3 === 'district') ? 'org-ledger-admin.html' : _r3 === 'school' ? 'org-ledger-school.html' : 'workbench.html'; }

  if (id === 'dashboard' { showToast('编制岗位台账页面开发中'); return; }
  showToast('跳转至：' + (el.textContent || id));
}
function renderSidebar(){
  var rd=ROLES.school;if(!rd)return;
  var h='';(rd.sidebar.top||[]).forEach(function(i){h+='<a class="menu-item" onclick="window.location.href=\'workbench.html\'">'+(ICONS[i.icon]||'')+'<span class="menu-label">'+i.label+'</span></a>';});
  (rd.sidebar.groups||[]).forEach(function(g){h+='<div class="menu-group">'+g.name+'</div>';g.items.forEach(function(i){h+='<a class="menu-item'+(i.id==='employ'?' active':'')+'" onclick="window.location.href=\'employ-list-school.html\'">'+(ICONS[MENU_ICONS[i.id]||'file'])+'<span class="menu-label">'+i.label+'</span></a>';});});
  document.getElementById('sidebarMenu').innerHTML=h;
}

function renderTimeline(r){
  var items=(r.timeline||[]).slice();var h='<div class="sidebar-section"><h4>申报履历</h4><div class="timeline">';
  if(items.length===0){h+='<div style="font-size:12px;color:var(--text-light);">暂无记录</div>';return h+'</div></div>';}
  items.sort(function(a,b){return(a.time||'').localeCompare(b.time||'');});
  for(var i=0;i<items.length;i++){var item=items[i];
    h+='<div class="timeline-item"><div class="tl-time">'+(item.time?item.time.substring(0,16):'')+'</div>';
    h+='<div class="tl-action">'+escapeHtml(item.action)+'</div><div class="tl-operator">操作人：'+escapeHtml(item.operator||'')+'</div></div>';}
  h+='</div></div>';return h;
}

function renderProgress(step){
  var labels=['学校提交','主管一审','学校录入','主管二审'];var steps=4;var idx=step==='submitted'?0:step==='first'?1:step==='second'?2:3;
  var h='<div class="progress-bar"><div class="step-wrapper">';
  for(var i=0;i<steps;i++){var st='pending',d=i+1;if(i<idx){st='done';d='&#10003;'}else if(i===idx){st='current';}
    h+='<span class="step '+st+'"><span class="step-dot">'+d+'</span><span class="step-text">'+labels[i]+'</span></span>';
    if(i<steps-1)h+='<span class="step-line'+(i<idx?' done':'')+'"></span>';}
  h+='</div></div>';return h;
}

function renderPage(){
  if(!currentRecord){document.getElementById('mainContent').innerHTML='<div class="back-link" onclick="location.href=\'employ-list-school.html\'">&#8592; 返回列表</div><div class="form-card" style="text-align:center;padding:60px;"><div style="font-size:48px;">&#x1F4CB;</div><div style="font-size:16px;font-weight:600;margin-top:8px;">未找到记录</div></div>';return;}
  var r=currentRecord;
  if(r.status!=='first_approved'&&r.status!=='second_rejected'){document.getElementById('mainContent').innerHTML='<div class="back-link" onclick="location.href=\'employ-list-school.html\'">&#8592; 返回列表</div><div class="form-card" style="text-align:center;padding:60px;color:var(--text-light);">当前状态不可录入人社结果。</div>';return;}

  var hr=r.hrResult||{};
  var html='<div class="back-link" onclick="location.href=\'employ-list-school.html\'">&#8592; 返回列表</div>';
  html+='<div class="page-header"><h1>录入人社核准结果</h1><div class="subtitle">'+escapeHtml(r.schoolName)+' — '+escapeHtml(r.id)+' — '+(r.businessType==='recruitment'?'招聘':'调动')+'</div></div>';
  html+=renderProgress('second');
  html+='<div class="two-columns"><div class="main-col">';
  html+='<div class="form-card"><h3>人社核准结果</h3>';
  html+='<div class="form-row"><div class="form-group"><label>人社核准文号 <span class="req">*</span></label><input id="hrApprovalNo" value="'+escapeHtml(hr.approvalNo||'')+'"></div>';
  html+='<div class="form-group"><label>核准日期 <span class="req">*</span></label><input type="date" id="hrApprovalDate" value="'+escapeHtml(hr.approvalDate||'')+'"></div></div>';
  html+='<div class="form-group"><label>核准结果 <span class="req">*</span></label>';
  html+='<select id="hrResult"><option value="approved"'+(hr.result==='approved'?' selected':'')+'>审核通过</option><option value="rejected"'+(hr.result==='rejected'?' selected':'')+'>不通过</option></select></div>';
  html+='<div class="form-group"><label>批复文件（PDF）<span class="req">*</span></label>';
  html+='<div class="upload-area" onclick="document.getElementById(\'hrFileInput\').click()"><div class="upload-icon">&#128194;</div><div class="upload-text">点击上传批复文件</div></div>';
  html+='<input type="file" id="hrFileInput" accept=".pdf" onchange="handleHRFileUpload(this)" style="display:none">';
  html+='<div class="file-list" id="hrFileList">';
  hrUploadedFiles.forEach(function(f,i){html+='<div class="file-item"><span class="file-name">'+escapeHtml(f.name)+'</span><span class="file-size">'+formatSize(f.size)+'</span><span class="file-remove" onclick="hrUploadedFiles.splice('+i+',1);renderPage();">删除</span></div>';});
  if(!hrUploadedFiles.length&&hr.attachment)hrUploadedFiles.push(hr.attachment);
  html+='</div></div></div>';
  html+='<div class="submit-bar"><button class="btn btn-outline" onclick="location.href=\'employ-list-school.html\'">取消</button><button class="btn btn-success" onclick="submitHRResult()">提交二审</button></div>';
  html+='</div><div class="side-col">';
  html+=renderTimeline(r);
  html+='</div></div>';
  document.getElementById('mainContent').innerHTML=html;
}

function handleHRFileUpload(input){
  var files=input.files;
  for(var i=0;i<files.length;i++){var f=files[i];
    if(f.name.split('.').pop().toLowerCase()!=='pdf'){showToast('仅支持PDF格式','warning');continue;}
    if(f.size>10*1024*1024){showToast('文件超过10MB','warning');continue;}
    hrUploadedFiles=[{name:f.name,size:f.size}];}
  input.value='';renderPage();
}

function submitHRResult(){
  var approvalNo=document.getElementById('hrApprovalNo').value.trim();
  var approvalDate=document.getElementById('hrApprovalDate').value;
  var result=document.getElementById('hrResult').value;
  if(!approvalNo){showToast('请填写人社核准文号','warning');return;}
  if(!approvalDate){showToast('请选择核准日期','warning');return;}
  if(hrUploadedFiles.length===0){showToast('请上传批复文件','warning');return;}

  var records=loadEmployRecords();var idx=records.findIndex(function(r){return r.id===currentRecord.id;});
  if(idx===-1){showToast('记录不存在','warning');return;}
  records[idx].hrResult={approvalNo:approvalNo,approvalDate:approvalDate,result:result,attachment:hrUploadedFiles[0]};
  records[idx].status='pending_second';
  records[idx].timeline=records[idx].timeline||[];
  records[idx].timeline.push({time:now(),action:'学校录入人社结果',operator:ROLES.school.name});
  saveEmployRecords(records);showToast('已提交二审','success');
  setTimeout(function(){window.location.href='employ-list-school.html';},1000);
}

(function init(){
  var params=new URLSearchParams(window.location.search);var id=params.get('id');
  var records=loadEmployRecords();currentRecord=records.find(function(r){return r.id===id;})||null;
  if(currentRecord&&currentRecord.hrResult&&currentRecord.hrResult.attachment){
    hrUploadedFiles=[currentRecord.hrResult.attachment];}
  renderSidebar();renderPage();
})();
</script>
</body>
</html>
