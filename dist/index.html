<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柳州教育人事管理平台 — 登录</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #1E40AF;
    --primary-dark: #1E3A8A;
    --primary-light: #EFF6FF;
    --primary-active: #1E3A8A;
    --accent: #3B82F6;
    --text: #1E293B;
    --text-secondary: #64748B;
    --text-light: #94A3B8;
    --border: #E2E8F0;
    --bg: #F8FAFC;
    --white: #ffffff;
    --danger: #EF4444;
    --success: #10B981;
    --warning: #F59E0B;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
    --radius: 8px;
    --radius-lg: 12px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #EFF6FF 0%, #F1F5F9 30%, #F8FAFC 60%, #E2E8F0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Background decorations */
  body::before {
    content: '';
    position: absolute;
    top: -320px;
    right: -280px;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(30,64,175,0.06) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute;
    bottom: -200px;
    left: -180px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(30,64,175,0.05) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .login-container {
    display: flex;
    width: 1000px;
    min-height: 560px;
    background: var(--white);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* Left Branding Panel */
  .brand-panel {
    width: 380px;
    flex-shrink: 0;
    background: linear-gradient(155deg, #1E3A8A 0%, #1E40AF 40%, #2563EB 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    position: relative;
    overflow: hidden;
  }
  .brand-panel::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 300px;
    height: 300px;
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    pointer-events: none;
  }
  .brand-panel::after {
    content: '';
    position: absolute;
    bottom: -60px;
    left: -60px;
    width: 200px;
    height: 200px;
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 50%;
    pointer-events: none;
  }
  .brand-logo {
    width: 72px;
    height: 72px;
    background: rgba(255,255,255,0.18);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
    backdrop-filter: blur(10px);
  }
  .brand-logo svg {
    width: 42px;
    height: 42px;
  }
  .brand-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .brand-subtitle {
    font-size: 14px;
    font-weight: 300;
    opacity: 0.85;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
    text-align: center;
    line-height: 1.6;
  }
  .brand-divider {
    width: 48px;
    height: 2px;
    background: rgba(255,255,255,0.3);
    margin: 20px 0;
    position: relative;
    z-index: 1;
  }
  .brand-features {
    position: relative;
    z-index: 1;
    font-size: 13px;
    opacity: 0.7;
    line-height: 2;
    text-align: center;
  }

  /* Right Form Panel */
  .form-panel {
    flex: 1;
    padding: 48px 56px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .form-header {
    margin-bottom: 32px;
  }
  .form-header h2 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .form-header p {
    font-size: 13px;
    color: var(--text-light);
  }

  /* Role Tabs */
  .role-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
    background: #F1F5F9;
    border-radius: var(--radius);
    padding: 4px;
  }
  .role-tab {
    flex: 1;
    padding: 9px 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 6px;
    transition: var(--transition);
    user-select: none;
    border: none;
    background: transparent;
    font-family: inherit;
    white-space: nowrap;
  }
  .role-tab:hover { color: var(--primary); }
  .role-tab.active {
    background: var(--white);
    color: var(--primary);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }

  /* Form inputs */
  .form-group {
    margin-bottom: 20px;
    position: relative;
  }
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrapper .input-icon {
    position: absolute;
    left: 14px;
    width: 18px;
    height: 18px;
    color: var(--text-light);
    pointer-events: none;
  }
  .form-input {
    width: 100%;
    height: 44px;
    padding: 0 14px 0 42px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #F8FAFC;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    transition: var(--transition);
  }
  .form-input:focus {
    border-color: var(--primary);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(30,64,175,0.08);
  }
  .form-input::placeholder { color: #c0c4cc; }

  .password-toggle {
    position: absolute;
    right: 10px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-light);
    padding: 6px;
    border-radius: 4px;
    transition: var(--transition);
  }
  .password-toggle:hover { color: var(--text-secondary); background: #F1F5F9; }

  /* Login button */
  .btn-login {
    width: 100%;
    height: 46px;
    background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: var(--transition);
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .btn-login:hover {
    background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
    box-shadow: 0 4px 16px rgba(30,64,175,0.3);
    transform: translateY(-1px);
  }
  .btn-login:active { transform: translateY(0); }

  .form-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    font-size: 12px;
  }
  .form-footer a {
    color: var(--primary);
    text-decoration: none;
    cursor: pointer;
    transition: var(--transition);
  }
  .form-footer a:hover { color: var(--primary-dark); text-decoration: underline; }

  /* Demo Account Panel */
  .demo-section {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .demo-section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 12px;
    color: var(--text-light);
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .demo-section-header::before,
  .demo-section-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #E2E8F0;
  }
  .demo-accounts {
    display: grid;
    gap: 8px;
  }
  .demo-account-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 6px;
    cursor: pointer;
    transition: var(--transition);
    font-size: 13px;
  }
  .demo-account-row:hover {
    background: #F0F7FF;
    border-color: #BFDBFE;
  }
  .demo-account-row.selected {
    background: #EFF6FF;
    border-color: #93C5FD;
    box-shadow: 0 0 0 2px rgba(30,64,175,0.1);
  }
  .demo-account-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .demo-role-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .badge-city { background: #EFF6FF; color: #1E40AF; }
  .badge-district { background: #FFFBEB; color: #D97706; }
  .badge-school { background: #ECFDF5; color: #10B981; }
  .badge-teacher { background: #f3e8f8; color: #7c3aed; }
  .demo-account-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .demo-account-name { font-weight: 500; color: var(--text); }
  .demo-account-id { font-size: 11px; color: var(--text-light); }
  .demo-account-pwd {
    font-size: 11px;
    color: var(--text-light);
    background: #F1F5F9;
    padding: 3px 10px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
    letter-spacing: 0.5px;
  }
  .demo-hint {
    font-size: 11px;
    color: var(--text-light);
    margin-top: 10px;
    text-align: center;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 28px;
    border-radius: var(--radius);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    z-index: 9999;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
    box-shadow: var(--shadow-lg);
  }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.warning { background: var(--warning); }

  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

  /* Responsive */
  @media (max-width: 900px) {
    .login-container { flex-direction: column; width: 420px; min-height: auto; }
    .brand-panel { width: 100%; padding: 36px 30px; }
    .brand-logo { width: 56px; height: 56px; margin-bottom: 16px; }
    .brand-title { font-size: 20px; }
    .brand-features { display: none; }
    .brand-divider { margin: 12px 0; }
    .form-panel { padding: 32px 28px; }
  }
  @media (max-width: 480px) {
    .login-container { width: 100%; border-radius: 12px; }
    .form-panel { padding: 24px 20px; }
    .role-tabs { flex-wrap: wrap; }
    .role-tab { font-size: 12px; padding: 7px 6px; }
  }
</style>
</head>
<body>

<div class="login-container">

  <!-- ===== Left: Brand Panel ===== -->
  <div class="brand-panel">
    <div class="brand-logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="20" width="8" height="22" rx="2" fill="rgba(255,255,255,0.95)"/>
        <rect x="14" y="14" width="8" height="28" rx="2" fill="rgba(255,255,255,0.85)"/>
        <rect x="24" y="6" width="8" height="36" rx="2" fill="rgba(255,255,255,0.95)"/>
        <rect x="34" y="10" width="8" height="32" rx="2" fill="rgba(255,255,255,0.75)"/>
        <circle cx="38" cy="10" r="6" fill="#fff" opacity="0.5"/>
        <path d="M36.5 8.5L39.5 11.5L42 8" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-title">柳州教育人事管理平台</div>
    <div class="brand-subtitle">柳州市教育局 · 统一人事管理系统</div>
    <div class="brand-divider"></div>
    <div class="brand-features">
      编制管理 · 岗位晋升 · 招聘审批<br>
      聘用管理 · 工资核定 · 荣誉申报<br>
      覆盖全市 11 项核心人事业务
    </div>
  </div>

  <!-- ===== Right: Form Panel ===== -->
  <div class="form-panel">
    <div class="form-header">
      <h2>用户登录</h2>
      <p>请选择您的角色并使用演示账号登录</p>
    </div>

    <!-- Role Tabs -->
    <div class="role-tabs" id="roleTabs">
      <button class="role-tab active" data-role="city">市管理员</button>
      <button class="role-tab" data-role="district">区管理员</button>
      <button class="role-tab" data-role="school">校管理员</button>
      <button class="role-tab" data-role="teacher">教 师</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" autocomplete="off">
      <!-- Dynamic label: 手机号 for admin, 身份证号/教职工编号 for teacher -->
      <div class="form-group">
        <label class="form-label" id="accountLabel">手机号</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" class="form-input" id="accountInput"
                 placeholder="请输入手机号" autocomplete="off">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">密码</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" class="form-input" id="passwordInput"
                 placeholder="请输入密码" autocomplete="off">
          <button type="button" class="password-toggle" id="pwdToggle" title="显示/隐藏密码">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeOffIcon">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="m14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeOnIcon" style="display:none">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);margin-bottom:0;">
        <input type="checkbox" id="agreeCheck" checked style="accent-color:var(--primary);">
        <label for="agreeCheck">已阅读并同意</label>
        <a href="#" onclick="event.preventDefault()" style="color:var(--primary);text-decoration:none;">《用户服务协议》</a>
        <span>和</span>
        <a href="#" onclick="event.preventDefault()" style="color:var(--primary);text-decoration:none;">《隐私政策》</a>
      </div>

      <button type="submit" class="btn-login">登 录</button>
    </form>

    <div class="form-footer">
      <a href="forgot-password.html">忘记密码？</a>
      <span></span>
    </div>

    <!-- Demo Accounts -->
    <div class="demo-section">
      <div class="demo-section-header">演示账号（点击快速填充）</div>
      <div class="demo-accounts" id="demoAccountList">
        <!-- Filled by JS -->
      </div>
      <div class="demo-hint">
        所有演示账号统一密码：<strong>Edu@2025</strong>
      </div>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toastContainer"></div>

<script>
(function() {
  // ======= Demo Account Data =======
  const demoAccounts = {
    city: [
      { role: 'city', roleLabel: '市管理员', name: '张建国', id: '13807720001', badgeClass: 'badge-city' },
    ],
    district: [
      { role: 'district', roleLabel: '区管理员', name: '李振华', id: '13807720002', badgeClass: 'badge-district' },
    ],
    school: [
      { role: 'school', roleLabel: '校管理员', name: '王玉兰', id: '13807720003', badgeClass: 'badge-school' },
    ],
    teacher: [
      { role: 'teacher', roleLabel: '教师', name: '陈明辉', id: '450200199001011234', badgeClass: 'badge-teacher' },
    ]
  };

  const DEFAULT_PASSWORD = 'Edu@2025';

  // ======= DOM refs =======
  const roleTabs      = document.getElementById('roleTabs');
  const accountLabel  = document.getElementById('accountLabel');
  const accountInput  = document.getElementById('accountInput');
  const passwordInput = document.getElementById('passwordInput');
  const pwdToggle     = document.getElementById('pwdToggle');
  const demoList      = document.getElementById('demoAccountList');
  const loginForm     = document.getElementById('loginForm');
  const eyeOffIcon    = document.getElementById('eyeOffIcon');
  const eyeOnIcon     = document.getElementById('eyeOnIcon');

  let currentRole = 'city';

  // ======= Role tab switching =======
  roleTabs.addEventListener('click', function(e) {
    const tab = e.target.closest('.role-tab');
    if (!tab) return;
    currentRole = tab.dataset.role;

    // Update tab active state
    roleTabs.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    // Update placeholder & label
    if (currentRole === 'teacher') {
      accountLabel.textContent = '身份证号 / 教职工编号';
      accountInput.placeholder = '请输入身份证号或教职工编号';
    } else {
      accountLabel.textContent = '手机号';
      accountInput.placeholder = '请输入手机号';
    }

    // Clear form
    accountInput.value = '';
    passwordInput.value = '';

    // Re-render demo accounts
    renderDemoAccounts();
  });

  // ======= Render demo account cards =======
  function renderDemoAccounts() {
    const accounts = demoAccounts[currentRole] || [];
    demoList.innerHTML = accounts.map((a, idx) => `
      <div class="demo-account-row" data-index="${idx}">
        <div class="demo-account-left">
          <span class="demo-role-badge ${a.badgeClass}">${a.roleLabel.slice(0,1)}</span>
          <div class="demo-account-info">
            <span class="demo-account-name">${a.name}（${a.roleLabel}）</span>
            <span class="demo-account-id">${currentRole==='teacher'?'身份证号':'手机号'}：${a.id}</span>
          </div>
        </div>
        <span class="demo-account-pwd">${DEFAULT_PASSWORD}</span>
      </div>
    `).join('');

    // Bind click
    demoList.querySelectorAll('.demo-account-row').forEach(row => {
      row.addEventListener('click', function() {
        const idx = parseInt(this.dataset.index);
        const acc = accounts[idx];
        accountInput.value = acc.id;
        passwordInput.value = DEFAULT_PASSWORD;

        // Visual selected
        demoList.querySelectorAll('.demo-account-row').forEach(r => r.classList.remove('selected'));
        this.classList.add('selected');
      });
    });
  }

  // ======= Password toggle =======
  pwdToggle.addEventListener('click', function() {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeOffIcon.style.display = isPassword ? 'none' : 'block';
    eyeOnIcon.style.display = isPassword ? 'block' : 'none';
  });

  // ======= Form submit =======
  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();

    const account = accountInput.value.trim();
    const password = passwordInput.value;

    if (!account) {
      showToast('请输入账号', 'error');
      accountInput.focus();
      return;
    }
    if (!password) {
      showToast('请输入密码', 'error');
      passwordInput.focus();
      return;
    }

    // Find matching demo account
    const accounts = demoAccounts[currentRole] || [];
    const matched = accounts.find(a => a.id === account && password === DEFAULT_PASSWORD);

    if (!matched) {
      showToast('账号或密码错误，请使用演示账号登录', 'error');
      return;
    }

    // Simulate login success
    showToast(`登录成功！欢迎您，${matched.name} — ${matched.roleLabel}`, 'success');

    // Visual feedback + redirect
    const btn = loginForm.querySelector('.btn-login');
    btn.textContent = '登录成功 ✓，正在跳转...';
    btn.style.background = 'linear-gradient(135deg, #059669, #10B981)';
    setTimeout(function() {
      window.location.href = 'workbench.html';
    }, 800);
  });

  // ======= Toast =======
  function showToast(msg, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }

  // ======= Initial render =======
  renderDemoAccounts();

  // ======= Keyboard shortcut: Enter to submit =======
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.activeElement === passwordInput) {
      loginForm.dispatchEvent(new Event('submit'));
    }
  });
})();
</script>

</body>
</html>
