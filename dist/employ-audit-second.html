<html lang="zh-CN">

<title>二审聘用手续 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--primary:#1E40AF;--primary-dark:#1E3A8A;--primary-light:#EFF6FF;--accent:#3B82F6;--text:#1E293B;--text-secondary:#64748B;--text-light:#94A3B8;--border:#E2E8F0;--bg:#F8FAFC;--white:#FFFFFF;--gray-bg:#F1F5F9;--danger:#EF4444;--success:#10B981;--warning:#F59E0B;--radius:8px;--radius-lg:12px;--shadow:0 4px 24px rgba(0,0,0,0.08);--shadow-lg:0 12px 48px rgba(0,0,0,0.12);--transition:0.2s cubic-bezier(0.4,0,0.2,1);--sidebar-w:240px;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.topnav{position:fixed;top:0;left:0;right:0;height:56px;background:linear-gradient(135deg,#1E3A8A,#1E40AF);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100;}
.topnav-left{display:flex;align-items:center;gap:14px;}
.topnav-logo{width:38px;height:38px;background:rgba(255,255,255,0.18);border-radius:10px;display:flex;align-items:center;justify-content:center;}
.topnav-title{font-size:17px;font-weight:600;color:#fff;}
.topnav-right{display:flex;align-items:center;gap:18px;}
.topnav-user{display:flex;align-items:center;gap:8px;cursor:pointer;color:rgba(255,255,255,0.9);padding:6px 12px;font-size:13px;position:relative;}
.topnav-user .avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;}
.user-dropdown{display:none;position:absolute;top:46px;right:0;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:160px;z-index:200;overflow:hidden;}
.user-dropdown.show{display:block;}
.user-dropdown a{display:block;padding:12px 18px;font-size:13px;color:var(--text);text-decoration:none;}
.user-dropdown a:hover{background:var(--primary-light);color:var(--primary);}
.user-dropdown .divider{height:1px;background:var(--border);}
.user-dropdown .logout{color:var(--danger);}
.sidebar{position:fixed;top:56px;left:0;bottom:0;width:var(--sidebar-w);background:#1E3A8A;z-index:90;overflow-y:auto;display:flex;flex-direction:column;}
.sidebar.collapsed{width:64px;}.sidebar.collapsed .menu-label,.sidebar.collapsed .menu-group{display:none;}
.sidebar.collapsed .menu-item{justify-content:center;padding:12px 0;}
.sidebar.collapsed .menu-icon{margin-right:0;}
.sidebar-menu{flex:1;padding:8px 0;}
.menu-group{padding:14px 20px 4px;font-size:11px;color:rgba(255,255,255,0.4);}
.menu-item{display:flex;align-items:center;padding:10px 20px;cursor:pointer;font-size:13px;color:rgba(255,255,255,0.7);text-decoration:none;border-left:3px solid transparent;}
.menu-item:hover{background:rgba(255,255,255,0.05);color:#fff;}
.menu-item.active{background:rgba(255,255,255,0.08);color:#fff;border-left-color:var(--accent);}
.menu-item .menu-icon{width:18px;height:18px;margin-right:10px;flex-shrink:0;}
.sidebar-bottom{border-top:1px solid rgba(255,255,255,0.08);}
.sidebar-toggle{display:flex;align-items:center;gap:8px;padding:10px 20px;cursor:pointer;font-size:12px;color:rgba(255,255,255,0.5);}
.sidebar-toggle svg{width:16px;height:16px;}
.role-switcher{padding:10px 16px 12px;border-top:1px solid rgba(255,255,255,0.08);}
.role-switcher-options{display:flex;flex-direction:column;gap:4px;}
.role-switch-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:rgba(255,255,255,0.55);border:1px solid transparent;background:transparent;font-family:inherit;text-align:left;}
.role-switch-btn:hover{background:rgba(255,255,255,0.06);}
.role-switch-btn.active{background:rgba(59,130,246,0.2);color:#fff;}
.role-switch-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.role-switch-dot.city{background:#3B82F6;}.role-switch-dot.district{background:#F59E0B;}
.main{margin-left:var(--sidebar-w);margin-top:56px;padding:24px;min-height:calc(100vh-56px);}
.sidebar.collapsed~.main{margin-left:64px;}
.breadcrumb{font-size:12px;color:var(--text-light);margin-bottom:16px;}
.breadcrumb a{color:var(--text-light);text-decoration:none;}
.breadcrumb a:hover{color:var(--primary);}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-header h1{font-size:20px;font-weight:700;}
.page-header .subtitle{font-size:12px;color:var(--text-light);margin-top:2px;}
.two-columns{display:flex;gap:24px;}
.main-col{flex:1;min-width:0;}
.side-col{width:360px;flex-shrink:0;}
.form-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;}
.form-card h3{font-size:14px;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.sidebar-section{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;}
.sidebar-section h4{font-size:13px;font-weight:600;margin-bottom:14px;}
.timeline{position:relative;padding-left:20px;}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border);}
.timeline-item{position:relative;padding-bottom:16px;}
.timeline-item:last-child{padding-bottom:0;}
.timeline-item::before{content:'';position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--border);}
.timeline-item .tl-time{font-size:11px;color:var(--text-light);}
.timeline-item .tl-action{font-size:12px;font-weight:500;margin-top:2px;}
.timeline-item .tl-operator{font-size:11px;color:var(--text-secondary);}
.status-stamp{display:inline-block;padding:6px 16px;border:2px solid;transform:rotate(-5deg);font-weight:700;font-size:14px;background:#fff;}
.status-stamp.pending{color:#F59E0B;border-color:#F59E0B;}
.status-stamp.approved{color:#10B981;border-color:#10B981;}
.status-stamp.rejected{color:#EF4444;border-color:#EF4444;}
.status-stamp.completed{color:#3730A3;border-color:#3730A3;}
.type-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500;}
.type-tag.recruitment{background:#EFF6FF;color:var(--primary);}
.type-tag.transfer{background:#F3E8FF;color:#6B21A8;}
.progress-bar{display:flex;align-items:center;padding:16px 24px;background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border);margin-bottom:20px;}
.step-wrapper{display:flex;align-items:center;flex:1;}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;min-width:70px;}
.step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:2px solid var(--border);color:var(--text-light);background:#fff;}
.step.done .step-dot{background:var(--success);color:#fff;border-color:var(--success);}
.step.current .step-dot{background:var(--primary);color:#fff;border-color:var(--primary);}
.step-text{font-size:11px;color:var(--text-light);}
.step.current .step-text{color:var(--primary);font-weight:500;}
.step.done .step-text{color:var(--success);}
.step-line{flex:1;height:2px;background:var(--border);margin:0 4px 20px;min-width:20px;}
.step-line.done{background:var(--success);}
.audit-bottom-bar{background:#fff;border:2px solid var(--primary);border-radius:var(--radius-lg);padding:16px 20px;display:flex;gap:12px;align-items:center;margin-top:20px;box-shadow:0 2px 16px rgba(0,0,0,0.08);}
.audit-bottom-bar .btn-approve{padding:12px 32px;font-size:14px;font-weight:600;border:none;border-radius:6px;background:var(--success);color:#fff;cursor:pointer;font-family:inherit;}
.audit-bottom-bar .btn-approve:hover{background:#059669;}
.audit-bottom-bar .btn-reject{padding:12px 32px;font-size:14px;font-weight:600;border:1px solid var(--danger);border-radius:6px;background:#fff;color:var(--danger);cursor:pointer;font-family:inherit;}
.audit-bottom-bar .btn-reject:hover{background:#FEF2F2;}
.audit-bottom-bar .opinion-hint{flex:1;font-size:12px;color:var(--text-light);}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:4px;}
.form-group input,.form-group select{width:100%;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;font-family:inherit;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent);}
.form-row{display:flex;gap:16px;}
.form-row .form-group{flex:1;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal-container{background:#fff;border-radius:var(--radius-lg);padding:28px;width:480px;max-width:90vw;box-shadow:var(--shadow-lg);}
.modal-container h3{font-size:18px;font-weight:600;margin-bottom:16px;}
.modal-buttons{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;}
.btn-cancel{padding:8px 20px;font-size:13px;font-weight:500;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);cursor:pointer;}
.btn-cancel:hover{background:var(--gray-bg);}
.btn-confirm{padding:8px 20px;font-size:13px;font-weight:500;border-radius:6px;border:none;color:#fff;cursor:pointer;background:var(--success);}
.btn-confirm:hover{background:#059669;}
.btn-confirm.danger{background:var(--danger);}
.btn-confirm.danger:hover{background:#DC2626;}
.back-link{font-size:12px;color:var(--text-secondary);cursor:pointer;margin-bottom:16px;display:inline-block;}
.back-link:hover{color:var(--primary);}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;animation:toastIn .3s ease;box-shadow:var(--shadow-lg);}
.toast.warning{background:var(--warning);color:#1E293B;}
.toast.success{background:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%)translateY(-10px)}to{opacity:1;transform:translateX(-50%)translateY(0)}}
</style>
</head>

function saveEmployRecords(r){localStorage.setItem('employ_records',JSON.stringify(r));}

function renderProgress(step){
  var labels=['学校提交','主管一审','学校录入','主管二审'];var steps=4;var idx=step==='submitted'?0:step==='first'?1:step==='second'?2:3;
  var h='<div class="progress-bar"><div class="step-wrapper">';
  for(var i=0;i<steps;i++){var st='pending',d=i+1;if(i<idx){st='done';d='&#10003;'}else if(i===idx){st='current';}
    h+='<span class="step '+st+'"><span class="step-dot">'+d+'</span><span class="step-text">'+labels[i]+'</span></span>';
    if(i<steps-1)h+='<span class="step-line'+(i<idx?' done':'')+'"></span>';}
  h+='</div></div>';return h;
}

function renderTimeline(r){
  var items=(r.timeline||[]).slice();var h='<div class="sidebar-section"><h4>申报履历</h4><div class="timeline">';
  if(items.length===0){h+='<div style="font-size:12px;color:var(--text-light);">暂无记录</div>';return h+'</div></div>';}
  items.sort(function(a,b){return(a.time||'').localeCompare(b.time||'');});
  for(var i=0;i<items.length;i++){var item=items[i];
    h+='<div class="timeline-item"><div class="tl-time">'+(item.time?item.time.substring(0,16):'')+'</div><div class="tl-action">'+escapeHtml(item.action)+'</div><div class="tl-operator">操作人：'+escapeHtml(item.operator||'')+'</div></div>';}
  h+='</div></div>';return h;
}

function renderPage(){
  if(!currentRecord){document.getElementById('mainContent').innerHTML='<div class="back-link" onclick="goBack()">&#8592; 返回</div><div class="form-card" style="text-align:center;padding:60px;">未找到记录</div>';return;}
  var r=currentRecord;var typeLabel=r.businessType==='recruitment'?'招聘':'调动';var typeCls=r.businessType;
  var statusLabel=STATUS_MAP[r.status]||r.status;var stampCls=r.status==='pending_second'?'pending':'completed';
  var stepStr=r.status==='pending_second'?'second':'completed';
  var hr=r.hrResult||{};
  var html='<div class="back-link" onclick="goBack()">&#8592; 返回列表</div>';
  html+='<div class="page-header"><div><h1>二审聘用手续 — <span style="color:var(--primary);">'+escapeHtml(r.schoolName)+'</span></h1>';
  html+='<div class="subtitle">'+r.id+' | <span class="type-tag '+typeCls+'">'+typeLabel+'</span> | 提交时间：'+(r.submitTime?r.submitTime.substring(0,16):'')+'</div></div>';
  html+='<span class="status-stamp '+stampCls+'">'+statusLabel+'</span></div>';
  html+=renderProgress(stepStr);

  html+='<div class="two-columns"><div class="main-col">';
  html+='<div class="form-card"><h3>申报概要</h3>';
  html+='<div style="font-size:12px;line-height:1.8;"><div>学校：<b>'+escapeHtml(r.schoolName)+'</b></div><div>业务类型：<b>'+typeLabel+'</b></div><div>关联批次：'+escapeHtml(r.recruitBatchName||'—')+'</div></div></div>';
  // HR result
  html+='<div class="form-card"><h3>人社核准结果</h3>';
  html+='<div class="form-row"><div class="form-group"><label>核准文号</label><input id="modApprovalNo" value="'+escapeHtml(hr.approvalNo||'')+'"></div>';
  html+='<div class="form-group"><label>核准日期</label><input type="date" id="modApprovalDate" value="'+escapeHtml(hr.approvalDate||'')+'"></div></div>';
  html+='<div class="form-group"><label>核准结果</label><select id="modResult"><option value="approved"'+(hr.result==='approved'?' selected':'')+'>审核通过</option><option value="rejected"'+(hr.result==='rejected'?' selected':'')+'>不通过</option></select></div>';
  html+='<div style="font-size:11px;color:var(--text-light);margin-top:4px;">二审确认时可手动修改以上字段</div></div>';
  html+='</div><div class="side-col">';
  html+=renderTimeline(r);
  html+='</div></div>';

  if(r.status==='pending_second'){
    html+='<div class="audit-bottom-bar"><span class="opinion-hint">确认通过后流程结束。可手动修改核准结果字段。</span>';
    html+='<button class="btn-reject" onclick="showRejectModal()">驳回</button>';
    html+='<button class="btn-approve" onclick="showApproveModal()">确认通过</button></div>';
  }
  document.getElementById('mainContent').innerHTML=html;
}

function showApproveModal(){
  var html='<div class="modal-overlay" id="approveModal"><div class="modal-container"><h3>二审确认通过</h3>';
  html+='<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">确认通过后流程结束，不可修改。</div>';
  html+='<div class="modal-buttons"><button class="btn-cancel" onclick="this.closest(\'.modal-overlay\').remove()">取消</button><button class="btn-confirm" onclick="doApprove()">确认通过</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}
function doApprove(){
  document.getElementById('approveModal').remove();if(!currentRecord)return;
  var records=loadEmployRecords();var idx=records.findIndex(function(r){return r.id===currentRecord.id;});
  if(idx===-1){showToast('记录不存在','warning');return;}
  // Collect modifications
  var hr=records[idx].hrResult||{};
  var modApprovalNo=document.getElementById('modApprovalNo').value.trim();
  var modResult=document.getElementById('modResult').value;
  var secondMod=null;
  if(modApprovalNo!==(hr.approvalNo||'')||modResult!==(hr.result||'')){
    secondMod={modifiedFields:{},modifiedBy:ROLES[currentRole].name,modifiedAt:now()};
    if(modApprovalNo!==(hr.approvalNo||''))secondMod.modifiedFields.approvalNo={before:hr.approvalNo||'',after:modApprovalNo};
    if(modResult!==(hr.result||''))secondMod.modifiedFields.result={before:hr.result||'',after:modResult};
  }
  // Update hrResult
  records[idx].hrResult=records[idx].hrResult||{};
  records[idx].hrResult.approvalNo=modApprovalNo;records[idx].hrResult.result=modResult;
  records[idx].secondModification=secondMod;
  records[idx].status='completed';records[idx].secondReviewResult='approved';
  records[idx].secondReviewer=ROLES[currentRole].name;records[idx].secondReviewTime=now();
  records[idx].timeline=records[idx].timeline||[];
  var tl={time:now(),action:'主管二审通过',operator:ROLES[currentRole].name};
  if(secondMod)tl.action='主管二审修改人社核准结果';
  records[idx].timeline.push(tl);
  if(secondMod)records[idx].timeline.push({time:now(),action:'主管二审通过',operator:ROLES[currentRole].name});
  saveEmployRecords(records);showToast('二审通过，流程完成','success');setTimeout(function(){goBack();},1000);
}

function showRejectModal(){
  var html='<div class="modal-overlay" id="rejectModal"><div class="modal-container"><h3>驳回</h3>';
  html+='<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">驳回后学校可修改人社结果后重新提交二审。</div>';
  html+='<div class="form-group"><label>驳回原因 <span style="color:var(--danger)">*</span></label><textarea id="rejectReason" rows="4" placeholder="请填写驳回原因"></textarea></div>';
  html+='<div class="modal-buttons"><button class="btn-cancel" onclick="this.closest(\'.modal-overlay\').remove()">取消</button><button class="btn-confirm danger" onclick="doReject()">驳回</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}
function doReject(){
  var reason=document.getElementById('rejectReason').value.trim();if(!reason){showToast('请填写驳回原因','warning');return;}
  document.getElementById('rejectModal').remove();if(!currentRecord)return;
  var records=loadEmployRecords();var idx=records.findIndex(function(r){return r.id===currentRecord.id;});
  if(idx===-1){showToast('记录不存在','warning');return;}
  records[idx].status='second_rejected';records[idx].secondReviewResult='rejected';
  records[idx].secondReviewer=ROLES[currentRole].name;records[idx].secondReviewTime=now();records[idx].secondRejectReason=reason;
  records[idx].timeline=records[idx].timeline||[];
  records[idx].timeline.push({time:now(),action:'主管二审驳回',operator:ROLES[currentRole].name,opinion:reason});
  saveEmployRecords(records);showToast('已驳回','success');setTimeout(function(){goBack();},1000);
}

function goBack(){window.location.href='employ-list-admin.html?role='+currentRole;}

function updateRoleUI(){var rd=ROLES[currentRole];if(!rd)return;document.getElementById('userAvatar').textContent=rd.short;document.getElementById('userName').textContent=rd.name;}
function switchRole(role){
  if(role==='school'){window.location.href='employ-list-school.html';return;}
  if(role==='teacher'){showToast('教师角色无法访问','warning');return;}
  window.location.href='employ-list-admin.html?role='+role;
}
function sidebarClick(el, id) {
  if (arguments.length === 1) { id = el; el = null; }
  if (el) { document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i){i.classList.remove('active');}); el.classList.add('active'); }
  if(id==='workbench'){window.location.href='workbench.html';return;}
  if(id==='staffing'){window.location.href='staffing-application.html';return;}
  if(id==='entry'){window.location.href='教师入编管理（学校管理员视角）.html';return;}
  if(id==='exit'){window.location.href='教师出编管理（学校管理员视角）.html';return;}
  if(id==='postset'){window.location.href='post-list-admin.html?role='+currentRole;return;}
  if(id==='promote'){window.location.href='promote-list-admin.html?role='+currentRole;return;}
  if(id==='recruit'){window.location.href='recruit-list-admin.html?role='+currentRole;return;}
  if(id==='employ'){window.location.href='employ-list-admin.html?role='+currentRole;return;}
  if (id === 'contract-entry') { var cr = (typeof currentUser!=='undefined' && currentUser) ? currentUser.role : (typeof currentRole!=='undefined'?currentRole:''); window.location.href = (cr === 'city' || cr === 'district') ? 'contract-entry-list-admin.html' : 'contract-entry-list-school.html'; return; }
  if (id === 'contract-exit') { var cr2 = (typeof currentUser!=='undefined' && currentUser) ? currentUser.role : (typeof currentRole!=='undefined'?currentRole:''); window.location.href = (cr2 === 'city' || cr2 === 'district') ? 'contract-exit-list-admin.html' : 'contract-exit-list-school.html'; return; }
  if(id==='retire'){showToast('退休呈报页面开发中');return;}
  if(id==='ethics'){showToast('师德师风举报页面开发中');return;}
  if(id==='account'){window.location.href='account-management.html';return;}

  if (id === 'ledger') { var lr = (typeof currentUser!=='undefined'?currentUser.role:currentRole); window.location.href = (lr === 'city' || lr === 'district') ? 'org-ledger-admin.html' : lr === 'school' ? 'org-ledger-school.html' : 'workbench.html'; return; }
  else if (id === 'org') { window.location.href = 'org-management.html'; }
  if (id === 'announcement') { window.location.href = 'announcement-management.html'; return; }
  if (id === 'menuMgr') { window.location.href = 'menu-management.html'; return; }
  if (id === 'perm') { window.location.href = 'perm-management.html'; return; }
  if (id === 'log') { window.location.href = 'log-management.html'; return; }

  showToast('跳转至：'+(el.textContent||id));
}
function renderSidebar(){
  if (currentRole === 'teacher') {
    var rd = ROLES.teacher; if (!rd || !rd.sidebar) { document.getElementById('sidebarMenu').innerHTML = ''; return; }
    var h = '';
    (rd.sidebar.top||[]).forEach(function(i){h+='<a class="menu-item" onclick="sidebarClick(this,\''+i.id+'\')">'+(ICONS[i.icon]||'')+'<span class="menu-label">'+i.label+'</span></a>';});
    (rd.sidebar.groups||[]).forEach(function(g){h+='<div class="menu-group">'+g.name+'</div>';g.items.forEach(function(i){h+='<a class="menu-item" onclick="sidebarClick(this,\''+i.id+'\')">'+(ICONS[MENU_ICONS[i.id]||'file'])+'<span class="menu-label">'+i.label+'</span>'+(i.badge?'<span class="menu-badge">'+i.badge+'</span>':'')+'</a>';});});
    document.getElementById('sidebarMenu').innerHTML = h;
  } else {
    renderSidebarMenu('sidebarMenu', currentRole, 'employ');
  }
}

(function init(){
  var params=new URLSearchParams(window.location.search);var urlRole=params.get('role');
  updateRoleUI();renderSidebar();
  if(urlRole==='city'||urlRole==='district')currentRole=urlRole;updateRoleUI();
  var id=params.get('id');if(id){var records=loadEmployRecords();currentRecord=records.find(function(r){return r.id===id;})||null;}
  renderPage();
})();
</script>
