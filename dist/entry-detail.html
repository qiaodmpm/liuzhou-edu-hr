<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>入编详情 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column;
}
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-label { white-space: nowrap; }
.menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}

/* Sidebar collapsed */
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }

.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.sidebar.collapsed ~ .main { margin-left: 64px; }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px);
}
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* Back button */
.back-row { margin-bottom: 16px; }
.btn-back {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; font-size: 12px; color: var(--text-secondary);
  background: #fff; border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; font-family: inherit; transition: var(--transition);
}
.btn-back:hover { color: var(--primary); border-color: var(--primary); }

/* Two-column layout */
.detail-layout { display: flex; gap: 24px; }
.detail-main { flex: 1; min-width: 0; }
.detail-side { width: 360px; flex-shrink: 0; }

/* Card */
.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  margin-bottom: 20px; overflow: hidden;
}
.card-header {
  padding: 14px 20px; font-size: 14px; font-weight: 600; color: var(--text);
  background: #FAFBFC; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
}
.card-body { padding: 20px; }

/* Status stamp */
.status-stamp {
  display: inline-block; padding: 6px 16px; border: 2px solid;
  transform: rotate(-5deg); font-weight: 700; font-size: 14px; background: #fff;
}
.status-stamp.approved { color: #10B981; border-color: #10B981; }
.status-stamp.rejected { color: #EF4444; border-color: #EF4444; }
.status-stamp.pending { color: #F59E0B; border-color: #F59E0B; }

/* Progress tracker */
.progress-tracker {
  display: flex; align-items: center; justify-content: center;
  padding: 8px 0 20px;
}
.progress-step {
  display: flex; flex-direction: column; align-items: center; position: relative;
}
.progress-dot {
  width: 32px; height: 32px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
  transition: var(--transition); position: relative; z-index: 1;
}
.progress-dot.done { background: var(--success); color: #fff; }
.progress-dot.current { background: var(--primary); color: #fff; box-shadow: 0 0 0 6px rgba(30,64,175,0.12); }
.progress-dot.pending { background: var(--gray-bg); color: var(--text-light); border: 2px solid var(--border); }
.progress-dot.rejected { background: #FEE2E2; color: var(--danger); border-color: var(--danger); }
.progress-label { font-size: 11px; font-weight: 500; margin-top: 8px; text-align: center; white-space: nowrap; }
.progress-label.done { color: var(--success); }
.progress-label.current { color: var(--primary); }
.progress-label.pending { color: var(--text-light); }
.progress-line {
  width: 100px; height: 2px; margin: 0 8px; margin-bottom: 24px;
  position: relative; z-index: 0;
}
.progress-line.done { background: var(--success); }
.progress-line.pending { background: var(--border); }

/* Info grid */
.info-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
}
.info-grid.col2 { grid-template-columns: repeat(2, 1fr); }
.info-item {
  background: #F8FAFC; padding: 10px 14px; border-radius: 8px;
}
.info-item.full { grid-column: 1 / -1; }
.info-label { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
.info-value { font-size: 13px; font-weight: 500; color: var(--text); }

/* Section label */
.section-label {
  grid-column: 1 / -1; padding: 8px 0 4px;
  font-size: 12px; font-weight: 600; color: var(--primary);
  border-bottom: 1px solid var(--primary-light); margin-bottom: 4px;
}

/* Data table */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  padding: 8px 12px; text-align: left; font-weight: 600; font-size: 12px;
  color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border);
}
.data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }

/* Materials */
.material-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: #F8FAFC; border-radius: 8px; margin-bottom: 8px;
}
.material-item:last-child { margin-bottom: 0; }
.material-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.material-tag {
  font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 500;
}
.material-tag.required { background: #FEF2F2; color: #EF4444; }
.material-tag.optional { background: #F1F5F9; color: #64748B; }
.material-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.file-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; background: #fff; border: 1px solid var(--border);
  border-radius: 4px; font-size: 12px; cursor: pointer;
}
.file-chip:hover { border-color: var(--accent); color: var(--primary); }

/* Timeline */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px;
  width: 2px; background: var(--border);
}
.timeline-item { position: relative; margin-bottom: 20px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot {
  position: absolute; left: -24px; top: 4px;
  width: 14px; height: 14px; border-radius: 50%; z-index: 1;
}
.timeline-dot.submit { background: var(--accent); }
.timeline-dot.reject { background: var(--danger); }
.timeline-dot.resubmit { background: var(--warning); }
.timeline-dot.approve { background: var(--success); }
.timeline-content .tlc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.timeline-content .tlc-title { font-size: 13px; font-weight: 600; color: var(--text); }
.timeline-content .tlc-time { font-size: 11px; color: var(--text-light); }
.timeline-content .tlc-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.timeline-content .tlc-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 500;
}
.tlc-tag.reject-reason { background: #FEE2E2; color: var(--danger); }
.tlc-tag.resubmit-tag { background: #FEF3C7; color: #D97706; }
.tlc-tag.approve-tag { background: #D1FAE5; color: #059669; }

/* Warning banner */
.warning-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; background: #FFFBEB; border: 1px solid #FDE68A;
  border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; color: #92400E;
}

/* Action bar */
.action-bar {
  display: flex; gap: 12px; padding: 20px;
  border-top: 1px solid var(--border); background: #FAFBFC;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 20px; font-size: 13px; font-weight: 500;
  border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition);
  border: 1px solid transparent; text-decoration: none;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: #fff; color: var(--text-secondary); border-color: var(--border); }
.btn-outline:hover { background: var(--gray-bg); }
.btn-danger { background: #FEF2F2; color: var(--danger); border-color: #FEE2E2; }
.btn-danger:hover { background: #FEE2E2; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Modal overlay */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 9998;
  animation: fadeIn 0.2s ease;
}
.modal-overlay.show { display: flex; align-items: center; justify-content: center; }
.modal {
  background: #fff; border-radius: 12px; box-shadow: var(--shadow-lg);
  max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;
  animation: slideUp 0.25s ease;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close {
  width: 32px; height: 32px; border-radius: 6px; border: none;
  background: transparent; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--text-light);
  transition: var(--transition);
}
.modal-close:hover { background: var(--gray-bg); color: var(--text); }
.modal-body { padding: 20px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* Download button */
.btn-download {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; font-size: 11px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 4px;
  background: #fff; color: var(--primary); transition: var(--transition);
  font-family: inherit; margin-left: 4px;
}
.btn-download:hover { background: var(--primary-light); border-color: var(--primary); }

/* Staffing batch card */
.batch-card {
  background: #F8FAFC; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 16px; overflow: hidden;
}
.batch-card .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; font-size: 13px; }
.batch-card .label { color: var(--text-light); font-size: 11px; }
.batch-card .value { font-weight: 500; color: var(--text); }
.batch-status {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 500;
}
.batch-status.valid { background: #ECFDF5; color: #059669; }
.batch-status.expiring { background: #FFFBEB; color: #D97706; }
.batch-status.expired { background: #FEF2F2; color: #EF4444; }

/* Staffing batch dashboard */
.batch-card { overflow: hidden; }
.batch-header { margin-bottom: 14px; }
.bh-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 13px; }
.bh-label { color: var(--text-light); min-width: 70px; font-size: 12px; }
.bh-value { color: var(--text); font-weight: 500; }
.d-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.d-panel {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 14px 12px 12px; text-align: center; box-shadow: var(--shadow-sm);
  transition: var(--transition);
}
.d-panel:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.d-title { font-size: 11px; color: var(--text-light); margin-bottom: 6px; }
.d-number { font-size: 28px; font-weight: 700; line-height: 1.2; }
.d-unit { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.d-divider { height: 1px; background: var(--border); margin: 8px 0; }
.d-items { text-align: left; font-size: 11px; color: var(--text-secondary); min-height: 20px; }
.d-item { padding: 2px 0; display: flex; justify-content: space-between; }
.d-num { font-weight: 600; color: var(--text); }
.d-progress { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
.dp-header { font-size: 12px; color: var(--text-light); margin-bottom: 6px; }
.dp-bar { display: flex; align-items: center; gap: 10px; }
.dp-bar-bg { flex: 1; height: 8px; background: #E2E8F0; border-radius: 4px; overflow: hidden; }
.dp-bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #3B82F6, #1E40AF); transition: width 0.3s; }
.dp-pct { font-size: 13px; font-weight: 700; min-width: 40px; text-align: right; }
.dp-desc { font-size: 11px; color: var(--text-light); margin-top: 4px; }

@media (max-width: 900px) { .d-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .d-grid { grid-template-columns: 1fr; } }

@media (max-width: 1024px) {
  .detail-layout { flex-direction: column; }
  .detail-side { width: 100%; }
  .info-grid { grid-template-columns: repeat(2, 1fr); }
}

/* Unit info detail table */
.info-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.info-table td { padding: 8px 14px; border: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.info-table .ilabel { background: var(--gray-bg); color: var(--text-secondary); font-weight: 500; width: 180px; white-space: nowrap; }
.info-table .ivalue { background: #fff; color: var(--text); font-weight: 600; }
.info-section-label { font-size: 13px; font-weight: 600; color: var(--primary); margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--border); }
.info-subtable { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
.info-subtable > tbody > tr > td { vertical-align: top; padding: 0; }
.isub-left { width: 50%; padding-right: 8px !important; }
.isub-right { width: 50%; padding-left: 8px !important; }
.info-mini { width: 100%; border-collapse: collapse; }
.info-mini td, .info-mini th { padding: 6px 10px; border: 1px solid var(--border); font-size: 12px; text-align: left; }
.info-mini th { background: var(--gray-bg); color: var(--text-secondary); font-weight: 500; }
.info-mini td { background: #fff; }
.info-mini td:last-child, .info-mini th:last-child { text-align: center; width: 120px; }

/* Unit info detail table */
.info-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.info-table td { padding: 8px 14px; border: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.info-table .ilabel { background: var(--gray-bg); color: var(--text-secondary); font-weight: 500; width: 180px; white-space: nowrap; }
.info-table .ivalue { background: #fff; color: var(--text); font-weight: 600; }
.info-section-label { font-size: 13px; font-weight: 600; color: var(--primary); margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--border); }
.info-subtable { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
.info-subtable > tbody > tr > td { vertical-align: top; padding: 0; }
.isub-left { width: 50%; padding-right: 8px !important; }
.isub-right { width: 50%; padding-left: 8px !important; }
.info-mini { width: 100%; border-collapse: collapse; }
.info-mini td, .info-mini th { padding: 6px 10px; border: 1px solid var(--border); font-size: 12px; text-align: left; }
.info-mini th { background: var(--gray-bg); color: var(--text-secondary); font-weight: 500; }
.info-mini td { background: #fff; }
.info-mini td:last-child, .info-mini th:last-child { text-align: center; width: 120px; }
</style>
</head>
<body>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topnav">
  <div class="topnav-left">

function resolveBatchForRecord(r) {
  if (r.staffingBatchId) return null;
  var sl = DEMO_BATCH_LOOKUP[r.schoolName];
  if (!sl) return null;
  var tk = r.staffingType === 'career' ? 'career' : 'control';
  var td = sl[tk];
  if (!td) return null;
  return { staffingBatchId: td.id, staffingBatchName: td.name, staffingBatchValidity: td.validity, totalFinalCount: td.totalFinalCount, useForms: td.useForms };
}

function calcBatchUsage(bid, eid) {
  var recs = loadRecords();
  var appr = {}, pend = {};
  var uc = 0, pc = 0;
  recs.forEach(function(r) {
    if (r.staffingBatchId === bid && r.id !== eid) {
      (r.applicants || []).forEach(function(a) {
        var em = a.entryMethod || '其他';
        if (r.status === 'approved') { appr[em] = (appr[em] || 0) + 1; uc++; }
        else if (r.status === 'pending') { pend[em] = (pend[em] || 0) + 1; pc++; }
      });
    }
  });
  return { used: { count: uc, details: appr }, pending: { count: pc, details: pend } };
}
// ===== DATA =====
function loadRecords() {
  var stored = JSON.parse(localStorage.getItem('entry_records') || '[]');
  var ids = {};
  stored.forEach(function(r) { ids[r.id] = true; });
  var merged = stored.slice();
  DEMO_RECORDS.forEach(function(r) { if (!ids[r.id]) { merged.push(r); ids[r.id] = true; } });
  NEW_FORMAT_RECORDS.forEach(function(r) { if (!ids[r.id]) { merged.push(r); ids[r.id] = true; } });
  return merged;
}

function findRecord(id) {
  var records = loadRecords();
  var found = records.find(function(r) { return r.id === id; });
  return found || null;
}

function canApprove() {
  if (!currentRecord || currentRecord.status !== 'pending') return false;
  if (currentRole === 'district') return currentRecord.district === '鱼峰区';
  if (currentRole === 'city') return currentRecord.district === '市直属';
  return false;
}

function canModifyResult() {
  if (!currentRecord || currentRecord.status !== 'approved') return false;
  if (currentRecord.approverRole !== currentRole) return false;
  if (!currentRecord.approveTime) return false;
  var days = (Date.now() - new Date(currentRecord.approveTime).getTime()) / 86400000;
  return days < 30;
}

function getDaysSinceApproval() {
  if (!currentRecord || !currentRecord.approveTime) return null;
  return Math.floor((Date.now() - new Date(currentRecord.approveTime).getTime()) / 86400000);
}
function getEmployUrl() {
  if (currentRole === 'city' || currentRole === 'district') return 'employ-list-admin.html?role=' + currentRole;
  if (currentRole === 'school') return 'employ-list-school.html';
  return null;
}

function renderProgress() {
  var r = currentRecord;
  var steps;
  if (r.status === 'approved') {
    steps = [
      { label: '提交申请', state: 'done' },
      { label: '教育局审批', state: 'done' },
      { label: '审核完成', state: 'done' }
    ];
  } else if (r.status === 'rejected') {
    steps = [
      { label: '提交申请', state: 'done' },
      { label: '教育局审批', state: 'done' },
      { label: '审核驳回', state: 'rejected' }
    ];
  } else {
    steps = [
      { label: '提交申请', state: 'done' },
      { label: '教育局审批', state: 'current' },
      { label: '审核完成', state: 'pending' }
    ];
  }

  var h = '';
  for (var i = 0; i < steps.length; i++) {
    var step = steps[i];
    var isRejected = step.state === 'rejected';
    var dotIcon = step.state === 'done' ? '✓' : (isRejected ? '✕' : (i + 1));
    var dotClass = step.state === 'done' ? 'done' : (step.state === 'current' ? 'current' : (isRejected ? 'rejected' : 'pending'));

    h += '<div class="progress-step">';
    h += '<div class="progress-dot ' + dotClass + '">' + dotIcon + '</div>';
    h += '<div class="progress-label ' + dotClass + '">' + step.label + '</div>';
    h += '</div>';
    if (i < steps.length - 1) {
      h += '<div class="progress-line ' + (step.state === 'done' ? 'done' : 'pending') + '"></div>';
    }
  }

  return '<div class="card"><div class="card-header">审批进度</div><div class="card-body">' +
    '<div class="progress-tracker">' + h + '</div></div></div>';
}

function renderStaffingBatchCard() {
  var r = currentRecord;
  var bid = r.staffingBatchId, bnm = r.staffingBatchName, bvl = r.staffingBatchValidity, btot = null, buf = null;
  if (!bid) {
    var res = resolveBatchForRecord(r);
    if (res) { bid = res.staffingBatchId; bnm = res.staffingBatchName; bvl = res.staffingBatchValidity; btot = res.totalFinalCount; buf = res.useForms; }
    else { return '<div class="batch-card"><div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px;">📦 关联编制使用申请</div><div style="font-size:12px;color:var(--text-light);">该申请提交时未关联编制使用申请批次，或关联数据已清理</div></div>'; }
  }

  // Validity status
  var vh = '';
  if (bvl && bvl.start && bvl.end) {
    var nw = new Date(), en = new Date(bvl.end), dl = Math.ceil((en-nw)/86400000),
        sc = dl<0?'expired':(dl<=30?'expiring':'valid'),
        sl = dl<0?'🔴 已过期':(dl<=30?'🟡 即将到期（剩'+dl+'天）':'🟢 有效（剩余'+dl+'天）');
    vh = '<span class="batch-status '+sc+'">'+sl+'</span>';
  }

  // Total from useForms if not directly provided
  var tn = btot;
  if (buf && tn == null) { tn = 0; Object.keys(buf).forEach(function(k){tn+=buf[k];}); }
  tn = Number(tn)||0;

  // Display name mapping
  var ufl = {publicRecruit:'统一公开招聘',selfRecruit:'单位自主实施招聘',talent:'引进人才',talentMid:'中高级人才招聘',talentHigh:'引进高层次人才',transfer:'调动',other:'其他'};

  // Usage stats

  var uc = usg.used.count, pc = usg.pending.count;
  var rm = tn - uc - pc;

    return keys.map(function(k) {
      return '<div class="d-item">'+k+' <span class="d-num">'+map[k]+'</span></div>';
    }).join('');
  }

  // Panel 1: 编办核定数

    pq = Object.keys(buf).filter(function(k){return buf[k]>0;}).map(function(k) {
      return '<div class="d-item">'+(ufl[k]||k)+' <span class="d-num">'+buf[k]+'</span></div>';
    }).join('');
  } else {
    pq = '<div style="color:var(--text-light);text-align:center;padding:4px 0;font-size:11px;">暂无核定明细</div>';
  }

  // Panel 2: 已使用
  var pu = buildItems(usg.used.details);

  // Panel 3: 待审核
  var pp = buildItems(usg.pending.details);

  // Panel 4: 剩余可申请 (skip zero items)
  var prItems = '', hasRemaining = false;
  if (buf) {

      }

  var nmColor = rm < 0 ? '#EF4444' : '#1E40AF';

  return '<div class="batch-card">'+
    '<div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:10px;">📦 关联编制使用申请</div>'+
    '<div class="batch-header">'+
    '<div class="bh-row"><span class="bh-label">申请编号</span><span class="bh-value" style="font-family:monospace;">'+bid+'</span></div>'+
    '<div class="bh-row"><span class="bh-label">批次名称</span><span class="bh-value">'+(bnm||'—')+'</span></div>'+
    '<div class="bh-row"><span class="bh-label">有效期</span><span class="bh-value">'+(bvl&&bvl.start?bvl.start:'')+' ~ '+(bvl&&bvl.end?bvl.end:'')+' '+vh+'</span></div>'+
    '</div>'+
    '<div class="d-grid">'+
    '<div class="d-panel"><div class="d-title">编办核定数</div><div class="d-number" style="color:#1E40AF;">'+tn+'</div><div class="d-unit">名</div><div class="d-divider"></div><div class="d-items">'+pq+'</div></div>'+
    '<div class="d-panel"><div class="d-title">已使用</div><div class="d-number" style="color:#10B981;">'+uc+'</div><div class="d-unit">名</div><div class="d-divider"></div><div class="d-items">'+pu+'</div></div>'+
    '<div class="d-panel"><div class="d-title">待审核</div><div class="d-number" style="color:#F59E0B;">'+pc+'</div><div class="d-unit">名</div><div class="d-divider"></div><div class="d-items">'+pp+'</div></div>'+

    '</div>'+
    '<div class="d-progress">'+
    '<div class="dp-header">使用率</div>'+
    '<div class="dp-bar"><div class="dp-bar-bg"><div class="dp-bar-fill" style="width:'+rate+'%;background:'+rateColor+'"></div></div><span class="dp-pct" style="color:'+rateColor+';">'+rate+'%</span></div>'+
    '<div class="dp-desc">已使用 '+uc+' + 待审核 '+pc+' = '+(uc+pc)+' / 编办核定 '+tn+'</div>'+

      '</div>';
  }
  return '<div class="warning-banner" style="background:#F8FAFC;border-color:#E2E8F0;color:#64748B;">' +
    '📋 该申请已审批通过。如需创建教师系统账号，请前往 <a href="account-management.html" style="color:var(--primary);font-weight:600;text-decoration:underline;">系统设置 → 账号管理</a> 操作。' +
    '</div>';
}

function renderPage() {
  if (!currentRecord) {
    document.getElementById('mainContent').innerHTML =
      '<div class="back-row"><button class="btn-back" onclick="goBack()">← 返回列表</button></div>' +
      '<div class="card"><div class="card-body" style="text-align:center;padding:60px;">' +
      '<div style="font-size:48px;margin-bottom:16px;">📋</div>' +
      '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">未找到申请记录</div>' +
      '<div style="color:var(--text-light);">请检查链接是否正确</div></div></div>';
    return;
  }

  var r = currentRecord;
  var typeLabel = TYPE_MAP[r.staffingType] || r.staffingType;

  var html = '<div class="back-row"><button class="btn-back" onclick="goBack()">← 返回列表</button></div>' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">' +
    '<div><h1 style="font-size:20px;font-weight:700;">' + r.schoolName + ' — ' + typeLabel + '入编申请</h1>' +
    '<div style="font-size:12px;color:var(--text-light);margin-top:4px;">申请编号：' + r.id + ' | 提交时间：' + (r.submitTime ? r.submitTime.substring(0,16) : '') + ' | 人数：' + ((r.applicants||[]).length) + ' 人</div></div>' +
    '<span class="status-stamp ' + r.status + '">' + (STATUS_MAP[r.status]||r.status) + '</span>' +
    '</div>' +
    renderWarning() +
    renderAccountPrompt() +

    '<div class="detail-layout">' +
    '<div class="detail-main">' +
    renderProgress() +
    renderUnitInfo() +
    renderStaffingBatchCard() +
    renderApplicants() +
    renderMaterials() +
    '</div>' +
    '<div class="detail-side">' +
    renderTimeline() +
    '</div>' +
    '</div>';

  document.getElementById('mainContent').innerHTML = html;
}

// ===== NAVIGATION =====
function goBack() {
  if (currentRole === 'school') {
    window.location.href = '教师入编管理（学校管理员视角）.html?role=school';
  } else if (currentRole === 'city' || currentRole === 'district') {
    window.location.href = '教师入编管理（主管单位视角）.html?role=' + currentRole;
  } else {
    history.back();
  }
}

function goApprove() {
  window.location.href = '审核教师入编页（主管单位视角）.html?id=' + currentRecord.id + '&role=' + currentRole;
}

function goModifyResult() {
  window.location.href = '审核教师入编页（主管单位视角）.html?id=' + currentRecord.id + '&role=' + currentRole + '&action=modify';
}

function goEdit() {
  window.location.href = 'entry-form.html?id=' + currentRecord.id + '&role=school';
}

// ===== SIDEBAR =====
function switchRole(role) {
  if (role === currentRole) return;
  // Navigate to the appropriate list page with new role
  if (role === 'school') {
    window.location.href = '教师入编管理（学校管理员视角）.html?role=school';
  } else if (role === 'city' || role === 'district') {
    window.location.href = '教师入编管理（主管单位视角）.html?role=' + role;
  } else if (role === 'teacher') {
    showToast('教师角色无入编管理权限');
  }
}

function updateRoleUI() {
  var roleData = ROLES[currentRole];
  document.getElementById('userAvatar').textContent = roleData.short;
  document.getElementById('userName').textContent = roleData.name;
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === currentRole);
  });
}

function renderSidebar() {
  renderSidebarMenu('sidebarMenu', currentRole, 'entry');
}
function sidebarClick(el, id) {
  if (arguments.length === 1) { id = el; el = null; }
  if (el) { document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); }); el.classList.add('active'); }
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') {
    if (currentRole === 'school') window.location.href = '教师入编管理（学校管理员视角）.html?role=school';
    else window.location.href = '教师入编管理（主管单位视角）.html?role=' + currentRole;
    return;
  }
  if (id === 'exit') {
    if (currentRole === 'school') window.location.href = '教师出编管理（学校管理员视角）.html?role=school';
    else window.location.href = '教师出编管理（主管单位视角）.html?role=' + currentRole;
    return;
  }
  if (id === 'promote') {
    if (currentRole === 'city' || currentRole === 'district') window.location.href = 'promote-list-admin.html?role=' + currentRole;
    else if (currentRole === 'school') window.location.href = 'promote-list-school.html';
    else if (currentRole === 'teacher') window.location.href = 'promote-list-teacher.html';
    else showToast('无权限访问', 'warning');
    return;
  }
  if (id === 'postset') {
    if (currentRole === 'city' || currentRole === 'district') window.location.href = 'post-list-admin.html?role=' + currentRole;
    else if (currentRole === 'school') window.location.href = 'post-list-school.html';
    else showToast('无权限访问', 'warning');
    return;
  }
  if (id === 'recruit') {
    if (currentRole === 'city' || currentRole === 'district') { window.location.href = 'recruit-list-admin.html?role=' + currentRole; return; }
  if (id === 'employ') { var url = getEmployUrl(); if (url) window.location.href = url; else showToast('跳转至：聘用手续办理'); return; }
  if (id === 'contract-entry') { var cr = (typeof currentUser!=='undefined' && currentUser) ? currentUser.role : (typeof currentRole!=='undefined'?currentRole:''); window.location.href = (cr === 'city' || cr === 'district') ? 'contract-entry-list-admin.html' : 'contract-entry-list-school.html'; return; }
  if (id === 'contract-exit') { var cr2 = (typeof currentUser!=='undefined' && currentUser) ? currentUser.role : (typeof currentRole!=='undefined'?currentRole:''); window.location.href = (cr2 === 'city' || cr2 === 'district') ? 'contract-exit-list-admin.html' : 'contract-exit-list-school.html'; return; }

    if (currentRole === 'school') { window.location.href = 'recruit-list-school.html'; return; }
    showToast('无权限访问', 'warning');
    return;
  }
  if (id === 'account') { window.location.href = 'account-management.html'; return; }

  if (id === 'ledger') { var lr = (typeof currentUser!=='undefined'?currentUser.role:currentRole); window.location.href = (lr === 'city' || lr === 'district') ? 'org-ledger-admin.html' : lr === 'school' ? 'org-ledger-school.html' : 'workbench.html'; return; }
    else if (id === 'org') { window.location.href = 'org-management.html'; }
  if (id === 'announcement') { window.location.href = 'announcement-management.html'; return; }
  showToast('跳转至：' + el.querySelector('.menu-label').textContent);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function showToast(msg) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function() { el.remove(); }, 2200);
}

// ===== INIT =====
(function init() {
  var params = new URLSearchParams(window.location.search);
  var urlRole = params.get('role');
  if (urlRole === 'city' || urlRole === 'district' || urlRole === 'school') {
    currentRole = urlRole;
  }
  updateRoleUI();
  renderSidebar();

  var recordId = params.get('id') || 'RN20260604001';
  currentRecord = findRecord(recordId);
  if (!currentRecord) { var all = loadRecords(); currentRecord = all.length > 0 ? all[0] : null; }
  renderPage();
})();
</script>

</body>
</html>
