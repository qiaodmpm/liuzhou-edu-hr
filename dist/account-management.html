});

function saveAccount(accountId) {
  var phone = document.getElementById('editPhone').value.trim();
  if (!phone) { showToast('请输入手机号', 'warning'); return; }
  if (!/^\d{11}$/.test(phone)) { showToast('请输入正确的11位手机号', 'warning'); return; }
  var name = document.getElementById('editName').value.trim();
  if (!name) { showToast('请输入姓名', 'warning'); return; }
  var idCard = document.getElementById('editIdCard').value.trim();
  if (!idCard) { showToast('请输入身份证号', 'warning'); return; }
  var selectedRoles = [];
  var chks = document.querySelectorAll('.roleChk:checked');
  for (var i = 0; i < chks.length; i++) { selectedRoles.push(chks[i].value); }
  if (!selectedRoles.length) { showToast('请选择至少一个角色', 'warning'); return; }
  var schoolVal = (document.getElementById('editSchool') || {}).value || '';
  if (!schoolVal) { showToast('请选择所属单位', 'warning'); return; }
  var staffingType = document.getElementById('editStaffingType2').value;
  if (!staffingType) { showToast('请选择编制类型', 'warning'); return; }
  if ((staffingType === '事业编' || staffingType === '控制数') && !document.getElementById('editEntryMethod2').value) {
    showToast('请选择入编方式', 'warning'); return;
  }
  var accounts = loadAccounts();
  for (var j = 0; j < accounts.length; j++) {
    if (accounts[j].accountId === accountId) {
      accounts[j].phone = phone;
      accounts[j].name = name;
      accounts[j].idCard = idCard;
      accounts[j].staffingType = staffingType;
      accounts[j].roles = selectedRoles;
      accounts[j].school = schoolVal;
      accounts[j].district = document.getElementById('editDistrict').value;
      accounts[j].entryMethod = staffingType === '合同制' ? '' : document.getElementById('editEntryMethod2').value;
      // Cross-school fields — validate and save
      var csType = document.getElementById('editCrossSchoolType').value || 'normal';
      // Contract teachers cannot have cross-school info
      if (staffingType === '合同制' || !staffingType || (staffingType !== '事业编' && staffingType !== '控制数')) {
        accounts[j].crossSchoolType = 'normal';
        accounts[j].crossSchool = '';
        accounts[j].crossStartDate = '';
        accounts[j].crossEndDate = '';
      } else if (csType === 'normal') {
        accounts[j].crossSchoolType = 'normal';
        accounts[j].crossSchool = '';
        accounts[j].crossStartDate = '';
        accounts[j].crossEndDate = '';
      } else {
        // Validate required fields for cross-school
        var csSchool = (document.getElementById('editCrossSchool') || {}).value || '';
        var csStart = (document.getElementById('editCrossStartDate') || {}).value || '';
        var csEnd = (document.getElementById('editCrossEndDate') || {}).value || '';
        if (!csSchool) { showToast('请选择任职学校', 'warning'); return; }
        if (!csStart) { showToast('请选择开始日期', 'warning'); return; }
        if (csType !== 'rotation' && !csEnd) { showToast('借调/支教须填写结束日期', 'warning'); return; }
        accounts[j].crossSchoolType = csType;
        accounts[j].crossSchool = csSchool;
        accounts[j].crossStartDate = csStart;
        accounts[j].crossEndDate = csEnd;
      }
      // Save isHighlandMember
      var hmCb = document.getElementById('fHighlandMember');
      accounts[j].isHighlandMember = hmCb ? hmCb.checked : false;
      var hlSel = document.getElementById('fHighlandPostLevel');
      accounts[j].highlandPostLevel = hmCb && hmCb.checked && hlSel ? hlSel.value : '';
      var now = new Date();
      accounts[j].updatedAt = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
      break;
    }
  }
  saveAccounts(accounts);
  // Save personnel profile fields to user_profile_{idCard}
  var up = {};
  try { up = JSON.parse(localStorage.getItem('user_profile_' + idCard) || '{}'); } catch(e) {}
  var getVal = function(id) { var el = document.getElementById(id); return el ? el.value : ''; };
  var gender = getVal('editGender'); if (gender) up.gender = gender;
  var ethnicity = getVal('editEthnicity'); if (ethnicity) up.ethnicity = ethnicity; else delete up.ethnicity;
  var birthDate = getVal('editBirthDate'); if (birthDate) up.birthDate = birthDate; else delete up.birthDate;
  var education = getVal('editEducation'); if (education) up.education = education; else delete up.education;
  var graduateInfo = getVal('editGraduateInfo'); if (graduateInfo) up.graduateInfo = graduateInfo; else delete up.graduateInfo;
  var politicalStatus = getVal('editPolitics2'); if (politicalStatus) up.politicalStatus = politicalStatus; else delete up.politicalStatus;
  var categoryName = getVal('editCategoryName'); if (categoryName) up.categoryName = categoryName; else delete up.categoryName;
  var currentPost = getVal('editPostLevel'); if (currentPost) up.currentPost = currentPost; else delete up.currentPost;
  var appointTime = getVal('editAppointTime'); if (appointTime) up.appointTime = appointTime; else delete up.appointTime;
  var assignPosition = getVal('editAssignPosition'); if (assignPosition) up.assignPosition = assignPosition; else delete up.assignPosition;
  var staffingType2 = getVal('editStaffingType2'); if (staffingType2) up.staffingType = staffingType2; else delete up.staffingType;
  var entryMethod2 = getVal('editEntryMethod2'); if (entryMethod2) up.entryMethod = entryMethod2; else delete up.entryMethod;
  // 补录字段
  var entryDate = getVal('editEntryDate'); if (entryDate) up.entryDate = entryDate; else delete up.entryDate;
  var rosterBook = getVal('editRosterBook'); if (rosterBook) up.rosterBook = rosterBook; else delete up.rosterBook;
  var docNumber = getVal('editDocNumber'); if (docNumber) up.docNumber = docNumber; else delete up.docNumber;
  var currentTitle = getVal('editCurrentTitle'); if (currentTitle) up.currentTitle = currentTitle; else delete up.currentTitle;
  var assessmentsStr = getVal('editAssessments'); if (assessmentsStr) up.assessments = assessmentsStr.split('/').map(function(s){return s.trim();}).filter(Boolean); else delete up.assessments;
  var contractEntryDate = getVal('editContractEntryDate'); if (contractEntryDate) up.contractEntryDate = contractEntryDate; else delete up.contractEntryDate;
  var contractStart = getVal('editContractStart'); if (contractStart) up.contractStart = contractStart; else delete up.contractStart;
  var contractEnd = getVal('editContractEnd'); if (contractEnd) up.contractEnd = contractEnd; else delete up.contractEnd;
  // Also save to account record for display in account list
  for (var k = 0; k < accounts.length; k++) {
    if (accounts[k].accountId === accountId) {
      accounts[k].entryDate = entryDate || '';
      accounts[k].rosterBook = rosterBook || '';
      accounts[k].docNumber = docNumber || '';
      accounts[k].currentTitle = currentTitle || '';
      if (assessmentsStr) accounts[k].assessments = assessmentsStr.split('/').map(function(s){return s.trim();}).filter(Boolean);
      accounts[k].contractEntryDate = contractEntryDate || '';
      accounts[k].contractStart = contractStart || '';
      accounts[k].contractEnd = contractEnd || '';
      break;
    }
  }
  localStorage.setItem('user_profile_' + idCard, JSON.stringify(up));
  closeModal();
  showToast('账号信息已更新', 'success');
  if (typeof writeLog === 'function') writeLog({ module: 'account', actionType: 'update', targetType: 'account', targetId: accountId, targetName: name, detail: '编辑账号信息', result: 'success' });
  renderAccounts();
}

var pendingAction = null;
var pendingAccountId = null;

function showConfirmModal(title, msg, accountId, action) {
  pendingAccountId = accountId;
  pendingAction = action;
  var reasonInput = '';
  if (action === 'disable') {
    reasonInput = '<div class="form-group" style="margin-top:12px;"><label>停用类型 <span style="color:var(--danger);">*</span></label><select id="disableTypeSelect" style="width:100%;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;font-family:inherit;outline:none;background:#fff;"><option value="">请选择停用类型</option><option value="exit">出编冻结</option><option value="violation">违规禁用</option><option value="other">其他</option></select></div>' +
    '<div class="form-group" style="margin-top:12px;"><label>停用原因 <span style="color:var(--danger);">*</span></label><input id="disableReasonInput" placeholder="请输入停用原因" style="width:100%;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;font-family:inherit;outline:none;"></div>';
  }
  document.getElementById('modalContainer').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)closeConfirmModal()">' +
    '<div class="modal-container" style="padding:24px;">' +
    '<h3 style="margin-bottom:16px;">' + title + '</h3>' +
    '<fieldset class="modal-fieldset" style="margin-bottom:0;">' +
    '<p style="font-size:14px;color:var(--text-secondary);">' + msg + '</p>' +
    reasonInput +
    '</fieldset>' +
    '<div class="modal-buttons"><button class="btn-cancel" onclick="closeConfirmModal()">取消</button>' +
    '<button class="btn-confirm warning" onclick="executePendingAction()">确认</button></div>' +
    '</div></div>';
}

function closeConfirmModal() {
  document.getElementById('modalContainer').innerHTML = '';
  pendingAction = null;
  pendingAccountId = null;
}

function executePendingAction() {
  if (pendingAction === 'restore') {
    var accounts = loadAccounts();
    for (var i = 0; i < accounts.length; i++) {
      if (accounts[i].accountId === pendingAccountId) {
        accounts[i].status = 'active';
        accounts[i].statusReason = null;
        accounts[i].disableType = '';
        accounts[i].disableReason = '';
        accounts[i].disableDate = '';
        accounts[i].disableOperator = '';
        break;
      }
    }
    saveAccounts(accounts);
    showToast('账号已恢复', 'success');
    if (typeof writeLog === 'function') writeLog({ module: 'account', actionType: 'enable', targetType: 'account', targetId: pendingAccountId, detail: '恢复账号', result: 'success' });
  } else if (pendingAction === 'disable') {
    var typeEl = document.getElementById('disableTypeSelect');
    var disableType = typeEl ? typeEl.value : '';
    if (!disableType) { showToast('请选择停用类型', 'warning'); return; }
    var reasonEl = document.getElementById('disableReasonInput');
    var reason = reasonEl ? reasonEl.value.trim() : '';
    if (!reason) { showToast('请输入停用原因', 'warning'); return; }
    var accounts = loadAccounts();
    var now = new Date();
    var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    for (var i = 0; i < accounts.length; i++) {
      if (accounts[i].accountId === pendingAccountId) {
        accounts[i].status = 'disabled';
        accounts[i].disableType = disableType;
        accounts[i].disableReason = reason;
        accounts[i].disableDate = nowStr;
        accounts[i].disableOperator = currentUser.name || '管理员';
        accounts[i].updatedAt = nowStr;
        break;
      }
    }
    saveAccounts(accounts);
    showToast('账号已停用', 'success');
    if (typeof writeLog === 'function') writeLog({ module: 'account', actionType: 'disable', targetType: 'account', targetId: pendingAccountId, detail: '停用账号，原因：' + reason, result: 'success' });
  }
  closeConfirmModal();
  renderAccounts();
}

function restoreAccount(accountId) {
  var accounts = loadAccounts();
  var a = accounts.filter(function(ac) { return ac.accountId === accountId; })[0];
  if (!a) return;
  showConfirmModal('确认恢复', '确认恢复「' + a.name + '」的账号？恢复后可正常登录系统。', accountId, 'restore');
}

function disableAccount(accountId) {
  var accounts = loadAccounts();
  var a = accounts.filter(function(ac) { return ac.accountId === accountId; })[0];
  if (!a) return;
  showConfirmModal('确认停用', '确认停用「' + a.name + '」的账号？停用后无法登录系统。', accountId, 'disable');
}

function getDistrictForSchool(schoolName) {
  if (!schoolName) return '';
  try {
    var dir = JSON.parse(localStorage.getItem('org_directory') || '[]');
    for (var i = 0; i < dir.length; i++) { if (dir[i].orgName === schoolName) return dir[i].district; }
  } catch(e) {}
  return '';
}

function viewAccount(accountId) {
  window.location.href = 'personal-center.html?accountId=' + encodeURIComponent(accountId);
}

function closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
}

function showToast(msg, type) {
  type = type || '';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2500);
}

// ===== Multi-select: 编制类型 =====
function toggleStaffingTypeDropdown() {
  document.getElementById('staffingTypeDropdown').classList.toggle('show');
}

function onStaffingTypeChange() {
  var checks = document.querySelectorAll('#staffingTypeDropdown input[type="checkbox"]');
  var selected = [];
  checks.forEach(function(c) { if (c.checked) selected.push(c.value); });
  var label = document.getElementById('staffingTypeLabel');
  if (selected.length === 0 || selected.length === 3) {
    label.textContent = '全部';
    // Uncheck all if all are checked (visual reset)
    if (selected.length === 3) { checks.forEach(function(c) { c.checked = false; }); }
  } else if (selected.length === 1) {
    label.textContent = selected[0];
  } else {
    label.textContent = selected.join('、');
  }
  renderAccounts();
}

function getStaffingTypeFilter() {
  var checks = document.querySelectorAll('#staffingTypeDropdown input[type="checkbox"]');
  var selected = [];
  checks.forEach(function(c) { if (c.checked) selected.push(c.value); });
  return selected;
}

function updateFilterVisibility() {
  var isSchool = currentRole === 'school';
  var isDistrict = currentRole === 'district';
  document.getElementById('districtFilterLabel').style.display = (isSchool || isDistrict) ? 'none' : '';
  document.getElementById('districtFilter').style.display = (isSchool || isDistrict) ? 'none' : '';
