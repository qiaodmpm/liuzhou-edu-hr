<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>账号管理 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-user { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.7); text-decoration: none; border-left: 3px solid transparent; transition: var(--transition); }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-label { white-space: nowrap; }
.menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }
.role-switch-dot.system { background: #64748B; }

.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px 28px; min-height: calc(100vh - 56px); }

.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 700; }

/* Filter bar */
.filter-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: #fff; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; }
.filter-bar label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.filter-select, .filter-input { padding: 6px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text); font-family: inherit; outline: none; }
.filter-select:focus, .filter-input:focus { border-color: var(--accent); }
.filter-input { width: 200px; }

/* Stats bar */
.stats-bar { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-item { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.stat-item .stat-num { font-size: 22px; font-weight: 700; color: var(--primary); }
.stat-item .stat-label { color: var(--text-secondary); font-size: 12px; }

/* Table */
.table-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: #F8FAFC; padding: 10px 14px; text-align: center; font-weight: 600; font-size: 12px; color: var(--text-secondary); border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: center; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #FAFBFC; }

.status-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.status-active { background: #ECFDF5; color: #059669; }
.status-disabled { background: #F1F5F9; color: #94A3B8; }
.status-login-yes { background: #ECFDF5; color: #059669; }
.status-login-no { background: #FEF3C7; color: #92400E; }

/* Cross-school tags */
.tag-cs { display:inline-flex; align-items:center; gap:3px; font-size:10px; padding:1px 7px; border-radius:3px; white-space:nowrap; font-weight:500; }
.tag-secondment { background: #FEF3C7; color: #92400E; }
.tag-support { background: #DBEAFE; color: #1E40AF; }
.tag-rotation { background: #D1FAE5; color: #065F46; }

/* Info rows in modals */
.info-row { display:flex; gap:8px; font-size:11px; padding:2px 0; }
.info-label { color:#94A3B8; min-width:70px; }
.info-value { color:#1E293B; font-weight:500; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-sm { padding: 5px 14px; font-size: 12px; }
.btn-xs { padding: 3px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.btn-xs-primary { background: var(--primary); color: #fff; }
.btn-xs-primary:hover { background: var(--primary-dark); }
.btn-xs-outline { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-xs-outline:hover { background: var(--gray-bg); }
.btn-xs-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
.btn-xs-danger:hover { background: #FEF2F2; }
.action-links { display: flex; gap: 6px; justify-content: center; }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
.modal-container { background: #fff; border-radius: 16px; width: 480px; max-width: 90%; padding: 24px; box-shadow: var(--shadow-lg); }
.modal-container h3 { margin-bottom: 12px; font-size: 16px; font-weight: 600; }
.modal-container .form-group { margin-bottom: 14px; }
.modal-container .form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.modal-container .form-group input { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; outline: none; }
.modal-container .form-group input:focus { border-color: var(--accent); }
.modal-container .form-group select { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; outline: none; background: #fff; }
.modal-container .form-group select:focus { border-color: var(--accent); }
/* Toggle switch */
.switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #CBD5E1; transition: 0.3s; border-radius: 24px; }
.slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: 0.3s; border-radius: 50%; }
.switch input:checked + .slider { background-color: var(--primary); }
.switch input:checked + .slider:before { transform: translateX(20px); }
.modal-buttons { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
.btn-cancel { background: var(--gray-bg); border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; }
.btn-cancel:hover { background: #E2E8F0; }
.btn-confirm { color: #fff; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; }
.btn-confirm.primary { background: var(--primary); }
.btn-confirm.primary:hover { background: var(--primary-dark); }
.btn-confirm.warning { background: #F59E0B; }
.btn-confirm.warning:hover { background: #D97706; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.form-group.span-full { grid-column: 1 / -1; }
.modal-fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.modal-fieldset legend { font-size: 12px; font-weight: 600; color: var(--primary); padding: 0 8px; }
.searchable-select { position: relative; }
.searchable-select input { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; outline: none; cursor: pointer; }
.searchable-select input:focus { border-color: var(--accent); }
.school-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; max-height: 200px; overflow-y: auto; background: #fff; border: 1px solid var(--border); border-radius: 6px; z-index: 20; box-shadow: var(--shadow); }
.school-dropdown.show { display: block; }
.school-option { padding: 8px 12px; font-size: 13px; cursor: pointer; transition: var(--transition); }
.school-option:hover { background: var(--primary-light); color: var(--primary); }

/* Multi-select dropdown */
.multi-select-wrap { position: relative; display: inline-block; vertical-align: middle; }
.multi-select-trigger { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; min-width: 130px; font-family: inherit; color: var(--text); transition: var(--transition); white-space: nowrap; }
.multi-select-trigger:hover { border-color: var(--accent); }
.multi-select-trigger .arrow { font-size: 10px; color: var(--text-light); margin-left: auto; }
.multi-select-dropdown { display: none; position: absolute; top: 100%; left: 0; min-width: 160px; background: #fff; border: 1px solid var(--border); border-radius: 8px; z-index: 25; box-shadow: var(--shadow-lg); padding: 6px 0; }
.multi-select-dropdown.show { display: block; }
.multi-select-dropdown label { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: var(--transition); white-space: nowrap; }
.multi-select-dropdown label:hover { background: var(--primary-light); }
.multi-select-dropdown input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }

.pwd-display { background: var(--primary-light); border: 2px dashed var(--accent); padding: 14px 16px; border-radius: 10px; font-family: 'Courier New', monospace; font-size: 22px; text-align: center; letter-spacing: 3px; margin: 14px 0; color: var(--primary); font-weight: 700; }
.pwd-copy-btn { display: block; margin: 0 auto; padding: 8px 20px; font-size: 12px; background: #fff; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); }
.pwd-copy-btn:hover { background: var(--primary-light); }
.pwd-info { font-size: 11px; color: var(--text-light); text-align: center; margin-top: 10px; padding: 8px 12px; background: #FFFBEB; border-radius: 6px; color: #92400E; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .text { font-size: 14px; }
.pagination { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 16px 0; }
.pagination button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text-secondary); transition: var(--transition); }
.pagination button:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
.pagination button:disabled { opacity: 0.35; cursor: not-allowed; }
.pagination .page-info { font-size: 12px; color: var(--text-light); margin: 0 8px; }

/* Password Modal */
.pwd-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1100; align-items: center; justify-content: center; }
.pwd-modal-overlay.show { display: flex; }
.pwd-modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 440px; max-width: 90vw; }
.pwd-modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.pwd-modal-header h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.pwd-modal-close { cursor: pointer; color: var(--text-light); font-size: 20px; padding: 4px; border: none; background: none; line-height: 1; }
.pwd-modal-close:hover { color: var(--text); }
.pwd-modal-body { padding: 20px 24px; }
.pwd-modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.pwd-field { margin-bottom: 16px; }
.pwd-field label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.pwd-input-wrap { position: relative; display: flex; align-items: center; }
.pwd-input-wrap input { width: 100%; height: 42px; padding: 0 40px 0 12px; font-size: 14px; font-family: inherit; color: var(--text); background: #F8FAFC; border: 1.5px solid var(--border); border-radius: var(--radius); outline: none; transition: var(--transition); }
.pwd-input-wrap input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px rgba(30,64,175,0.08); }
.pwd-eye { position: absolute; right: 8px; background: none; border: none; cursor: pointer; color: var(--text-light); padding: 4px; border-radius: 4px; }
.pwd-eye:hover { color: var(--text-secondary); background: #F1F5F9; }
.pwd-strength { display: flex; gap: 4px; margin-top: 8px; }
.pwd-strength-bar { flex: 1; height: 4px; border-radius: 2px; background: #E2E8F0; transition: var(--transition); }
.pwd-strength-bar.weak { background: var(--danger); }
.pwd-strength-bar.medium { background: var(--warning); }
.pwd-strength-bar.strong { background: var(--success); }
.pwd-strength-label { font-size: 11px; margin-top: 4px; font-weight: 500; }
.pwd-strength-label.weak { color: var(--danger); }
.pwd-strength-label.medium { color: var(--warning); }
.pwd-strength-label.strong { color: var(--success); }
.pwd-rules { margin-top: 12px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.pwd-rule { display: flex; align-items: center; gap: 6px; color: var(--text-light); }
.pwd-rule.pass { color: var(--success); }
.pwd-rule .rule-icon { width: 14px; text-align: center; }

@media (max-width: 1200px) { .filter-bar { flex-wrap: wrap; } }

.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 12px 28px; border-radius: var(--radius); color: #fff;
  font-size: 14px; font-weight: 500; z-index: 9999;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
  box-shadow: var(--shadow-lg);
}
.toast.success { background: var(--success); }
.toast.warning { background: var(--warning); color: #1E293B; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <span class="topnav-title">柳州教育人事管理平台</span>
  </div>
  <div class="topnav-right">
    <div class="topnav-bell" onclick="toggleMsgPopover()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge">3</span>
    </div>
    <div class="topnav-user" onclick="toggleUserMenu()">
      <span class="avatar" id="userAvatar">管</span>
      <span id="userName">管理员</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="user-dropdown" id="userDropdown">
        <a href="profile.html">👤 个人中心</a>
        <a href="personal-center.html">🔑 修改密码</a>
        <div class="divider"></div>
        <a href="index.html" class="logout">🚪 退出登录</a>
      </div>
    </div>
  </div>
</nav>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="sidebar-bottom">
    <div class="role-switcher" id="roleSwitcher"></div>
    <div class="sidebar-toggle" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>收起侧边栏</span>
    </div>
  </div>
</aside>

<div class="main" id="mainContent">
  <div class="breadcrumb" style="font-size:12px;color:var(--text-light);margin-bottom:16px;"><a href="workbench.html" style="color:var(--text-light);text-decoration:none;">首页</a> / <span style="color:var(--text-secondary);">账号管理</span></div>
  <div class="page-header">
    <h1>账号管理</h1>
    <button class="btn btn-primary" id="btnAddAccount" onclick="showCreateModal()" style="display:none;">+ 新增账号</button>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- Filter -->
  <div class="filter-bar">
    <label>搜索</label>
    <input class="filter-input" id="searchInput" placeholder="姓名 / 身份证号 / 手机号" oninput="renderAccounts()">
    <label>状态</label>
    <select class="filter-select" id="statusFilter" onchange="renderAccounts()">
      <option value="all">全部</option>
      <option value="active">正常</option>
      <option value="disabled">停用</option>
    </select>
    <label>所属角色</label>
    <select class="filter-select" id="roleFilter" onchange="renderAccounts()">
      <option value="all">全部角色</option>
      <option value="system">系统管理员</option>
      <option value="city">市管理员</option>
      <option value="district">区管理员</option>
      <option value="school">校管理员</option>
      <option value="teacher">教师</option>
    </select>
    <label>编制类型</label>
    <div class="multi-select-wrap" id="staffingTypeFilterWrap">
      <div class="multi-select-trigger" id="staffingTypeTrigger" onclick="toggleStaffingTypeDropdown()">
        <span id="staffingTypeLabel">全部</span>
        <span class="arrow">▼</span>
      </div>
      <div class="multi-select-dropdown" id="staffingTypeDropdown">
        <label><input type="checkbox" value="事业编" onchange="onStaffingTypeChange()"> 事业编</label>
        <label><input type="checkbox" value="控制数" onchange="onStaffingTypeChange()"> 控制数</label>
        <label><input type="checkbox" value="合同制" onchange="onStaffingTypeChange()"> 合同制</label>
      </div>
    </div>
    <label>跨校状态</label>
    <select class="filter-select" id="crossSchoolFilter" onchange="renderAccounts()">
      <option value="all">全部</option>
      <option value="normal">在岗（非跨校）</option>
      <option value="secondment">借调</option>
      <option value="support">支教</option>
      <option value="rotation">轮岗</option>
    </select>
    <label id="districtFilterLabel">所属区域</label>
    <select class="filter-select" id="districtFilter" onchange="renderAccounts()">
      <option value="all">全部区域</option>
    </select>
    <span id="schoolFilterWrap">
    <label>所属单位</label>
    <div class="searchable-select" style="display:inline-block;width:180px;vertical-align:middle;">
      <input id="filterSchoolInput" placeholder="搜索单位..." autocomplete="off" oninput="filterSchoolOptions_filter()" onfocus="toggleSchoolDropdown_filter(true)" style="padding:6px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;font-family:inherit;outline:none;width:100%;">
      <div class="school-dropdown" id="filterSchoolDropdown"></div>
      <input type="hidden" id="schoolFilterVal" value="all">
    </div>
    </span>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width:50px;">序号</th>
            <th>姓名</th>
            <th>身份证号</th>
            <th>手机号</th>
            <th>编制类型</th>
            <th>所属区域</th>
            <th>所属角色</th>
            <th>所属单位</th>
            <th>跨校状态</th>
            <th>小高地</th>
            <th>账号状态</th>
            <th>首次登录</th>
            <th>更新时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="accountTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Password Reset Modal -->
<div class="pwd-modal-overlay" id="pwdModalOverlay">
  <div class="pwd-modal">
    <div class="pwd-modal-header">
      <h3>🔑 重置密码</h3>
      <button class="pwd-modal-close" onclick="closePwdModal()">✕</button>
    </div>
    <div class="pwd-modal-body">
      <div style="margin-bottom:16px;padding:12px 14px;background:var(--gray-bg);border-radius:8px;font-size:13px;" id="pwdTargetInfo"></div>
      <div class="pwd-field">
        <label>新密码</label>
        <div class="pwd-input-wrap">
          <input type="password" id="pwdNew" placeholder="8-20位，含大小写字母+数字" autocomplete="off" oninput="checkPwdStrength_account()">
          <button class="pwd-eye" onclick="togglePwdEye_account('pwdNew',this)">👁</button>
        </div>
        <div class="pwd-strength" id="pwdStrengthBars">
          <span class="pwd-strength-bar"></span><span class="pwd-strength-bar"></span><span class="pwd-strength-bar"></span>
        </div>
        <div class="pwd-strength-label" id="pwdStrengthLabel"></div>
        <div class="pwd-rules" id="pwdRules">
          <div class="pwd-rule"><span class="rule-icon">⬜</span> 8-20位字符</div>
          <div class="pwd-rule"><span class="rule-icon">⬜</span> 至少包含1个大写字母</div>
          <div class="pwd-rule"><span class="rule-icon">⬜</span> 至少包含1个小写字母</div>
          <div class="pwd-rule"><span class="rule-icon">⬜</span> 至少包含1个数字</div>
          <div class="pwd-rule" id="pwdRuleMatch"><span class="rule-icon">⬜</span> 两次密码输入一致</div>
        </div>
      </div>
      <div class="pwd-field">
        <label>确认密码</label>
        <div class="pwd-input-wrap">
          <input type="password" id="pwdConfirm" placeholder="请再次输入新密码" autocomplete="off" oninput="checkPwdMatch_account()">
          <button class="pwd-eye" onclick="togglePwdEye_account('pwdConfirm',this)">👁</button>
        </div>
      </div>
    </div>
    <div class="pwd-modal-footer">
      <button class="btn-cancel" onclick="closePwdModal()">取消</button>
      <button class="btn-confirm primary" onclick="submitResetPwd()">确认重置</button>
    </div>
  </div>
</div>

function renderSidebar() {
  renderSidebarMenu('sidebarMenu', currentRole, 'account');
}

function sidebarClick(elOrId, idOrUndefined) {
  var id = arguments.length === 1 ? elOrId : idOrUndefined;
  var el = arguments.length === 1 ? null : elOrId;
  if (el) {
    document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
    el.classList.add('active');
  }
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') {
    if (currentRole === 'school') window.location.href = '教师入编管理（学校管理员视角）.html?role=school';
    else window.location.href = '教师入编管理（主管单位视角）.html?role=' + currentRole;
    return;
  }
  if (id === 'exit') {
    if (currentRole === 'school') window.location.href = '教师出编管理（学校管理员视角）.html?role=school';
    else window.location.href = '教师出编管理（主管单位视角）.html?role=' + currentRole;
    return;
  }
  if (id === 'promote') { window.location.href = 'promote-list-admin.html?role=' + currentRole; return; }
  if (id === 'postset') { window.location.href = 'post-list-admin.html?role=' + currentRole; return; }
  if (id === 'recruit') { window.location.href = 'recruit-list-admin.html?role=' + currentRole; return; }
  if (id === 'employ') { window.location.href = 'employ-list-admin.html?role=' + currentRole; return; }
  if (id === 'contract-entry') { var cr = (typeof currentUser!=='undefined' && currentUser) ? currentUser.role : (typeof currentRole!=='undefined'?currentRole:''); window.location.href = (cr === 'city' || cr === 'district') ? 'contract-entry-list-admin.html' : 'contract-entry-list-school.html'; return; }
  if (id === 'contract-exit') { var cr2 = (typeof currentUser!=='undefined' && currentUser) ? currentUser.role : (typeof currentRole!=='undefined'?currentRole:''); window.location.href = (cr2 === 'city' || cr2 === 'district') ? 'contract-exit-list-admin.html' : 'contract-exit-list-school.html'; return; }
  if (id === 'account') { return; }

  if (id === 'ledger') { var lr = (typeof currentUser!=='undefined'?currentUser.role:currentRole); window.location.href = (lr === 'city' || lr === 'district') ? 'org-ledger-admin.html' : lr === 'school' ? 'org-ledger-school.html' : 'workbench.html'; return; }
  else if (id === 'org') { window.location.href = 'org-management.html'; }
  else if (id === 'perm') { window.location.href = 'perm-management.html'; }
  else if (id === 'log') { window.location.href = 'log-management.html'; }
  else if (id === 'menuMgr') { window.location.href = 'menu-management.html'; }
  if (id === 'announcement') { window.location.href = 'announcement-management.html'; return; }
  showToast('导航到: ' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');

function updateRoleUI() {
  var roleData = ROLES[currentRole];
  var avatarEl = document.getElementById('userAvatar');
  var nameEl = document.getElementById('userName');
  if (roleData) {
    if (avatarEl) avatarEl.textContent = roleData.short;
    if (nameEl) nameEl.textContent = roleData.name;
  }
  var sw = document.getElementById('roleSwitcher');
  if (!sw) return;
  var roles = [
    { key: 'system', label: '系统管理员', dot: 'system' },
    { key: 'city', label: '市管理员', dot: 'city' },
    { key: 'district', label: '区管理员', dot: 'district' },
    { key: 'school', label: '校管理员', dot: 'school' },
    { key: 'teacher', label: '教 师', dot: 'teacher' }
  ];
  sw.innerHTML = '<div class="role-switcher-label">切换演示角色</div>' +
    '<div class="role-switcher-options">' +
    roles.map(function(r) {
      return '<button class="role-switch-btn' + (r.key === currentRole ? ' active' : '') + '" onclick="switchRole(\'' + r.key + '\')"><span class="role-switch-dot ' + r.dot + '"></span><span class="role-switcher-name">' + r.label + '</span></button>';
    }).join('') +
    '</div>';
}

function switchRole(role) {
  if (role === currentRole) return;

function saveAccounts(accounts) {
  var teachers = [];
  var admins = [];
  for (var i = 0; i < accounts.length; i++) {
    var a = accounts[i];
    var isTeacher = a.roles && a.roles.indexOf('teacher') !== -1;
    if (isTeacher) teachers.push(a);
    if (a.roles && a.roles.some(function(r) { return r !== 'teacher'; })) {
      admins.push({ role: a.roles[0], roles: a.roles, name: a.name, id: a.idCard, phone: a.phone, school: a.school, password: (a.password||''), status: a.status });
    }
  }
  localStorage.setItem('teacher_accounts', JSON.stringify(teachers));
  if (admins.length) localStorage.setItem('admin_accounts', JSON.stringify(admins));
}

var CROSS_SCHOOL_LABELS = { secondment: '借调', support: '支教', rotation: '轮岗' };
var CROSS_SCHOOL_CLASSES = { secondment: 'tag-secondment', support: 'tag-support', rotation: 'tag-rotation' };

function renderCrossSchoolCell(a) {
  var csType = a.crossSchoolType || 'normal';
  if (csType === 'normal' || !csType) return '<span style="color:var(--text-light);font-size:11px;">在岗（非跨校）</span>';
  var label = CROSS_SCHOOL_LABELS[csType] || csType;
  var cls = CROSS_SCHOOL_CLASSES[csType] || '';
  var html = '<span class="tag-cs ' + cls + '">' + label + '</span>';
  if (a.crossSchool) html += ' <span style="font-size:10px;color:var(--text-secondary);">' + a.crossSchool + '</span>';
  var dateRange = '';
  if (a.crossStartDate) dateRange += a.crossStartDate;
  if (a.crossEndDate) dateRange += (dateRange ? ' ~ ' : '') + a.crossEndDate;
  if (dateRange) html += '<div style="font-size:9px;color:var(--text-light);">' + dateRange + '</div>';
  return html;
}

// ===== RENDER =====
function renderAccounts() {
  var accounts = loadAccounts();
  var search = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  var statusFilter = document.getElementById('statusFilter').value;
  var schoolFilter = document.getElementById('schoolFilterVal').value;

  // Filter by role permissions
  var filtered = accounts;
  if (currentRole === 'school') {
    filtered = filtered.filter(function(a) { return a.school === currentUser.school; });
  } else if (currentRole === 'district') {
    // Use org_directory to filter by district
    var orgDir = [];
    try { orgDir = JSON.parse(localStorage.getItem('org_directory') || '[]'); } catch(e) {}
    var districtSchools = [];
    var userDistrict = currentUser.district || '';
    for (var di = 0; di < orgDir.length; di++) {
      if (orgDir[di].district === userDistrict) districtSchools.push(orgDir[di].orgName);
    }
    filtered = filtered.filter(function(a) { return a.school && districtSchools.indexOf(a.school) !== -1; });
  }

  // Apply search
  if (search) {
    filtered = filtered.filter(function(a) {
      return (a.name && a.name.toLowerCase().indexOf(search) !== -1) ||
             (a.idCard && a.idCard.indexOf(search) !== -1) ||
             (a.phone && a.phone.indexOf(search) !== -1);
    });
  }

  // Apply status filter
  if (statusFilter !== 'all') {
    filtered = filtered.filter(function(a) { return a.status === statusFilter; });
  }

  // Apply school filter
  if (schoolFilter !== 'all') {
    filtered = filtered.filter(function(a) { return a.school === schoolFilter; });
  }

  // Apply role filter
  var roleFilter = document.getElementById('roleFilter').value;
  if (roleFilter !== 'all') {
    filtered = filtered.filter(function(a) { return a.roles && a.roles.indexOf(roleFilter) !== -1; });
  }

  // Apply district filter
  var districtFilter = document.getElementById('districtFilter').value;
  if (districtFilter !== 'all') {
    filtered = filtered.filter(function(a) { return (a.district || getDistrictForSchool(a.school)) === districtFilter; });
  }

  // Apply staffing type filter (multi-select)
  var staffingTypeFilter = getStaffingTypeFilter();
  if (staffingTypeFilter.length > 0 && staffingTypeFilter.length < 3) {
    filtered = filtered.filter(function(a) { return staffingTypeFilter.indexOf(a.staffingType) !== -1; });
  }

  // Apply cross-school filter
  var crossSchoolFilter = document.getElementById('crossSchoolFilter').value;
  if (crossSchoolFilter !== 'all') {
    filtered = filtered.filter(function(a) { return (a.crossSchoolType || 'normal') === crossSchoolFilter; });
  }

  // Stats — based on role-filtered data
  var total = filtered.length;
  var activeCount = filtered.filter(function(a) { return a.status === 'active'; }).length;
  var disabledCount = filtered.filter(function(a) { return a.status === 'disabled'; }).length;
  var pendingLogin = filtered.filter(function(a) { return a.status === 'active' && !a.firstLogin; }).length;
  document.getElementById('statsBar').innerHTML =
    '<div class="stat-item"><span class="stat-num">' + total + '</span><span class="stat-label">总账号</span></div>' +
    '<div class="stat-item"><span class="stat-num" style="color:#10B981;">' + activeCount + '</span><span class="stat-label">正常</span></div>' +
    '<div class="stat-item"><span class="stat-num" style="color:#94A3B8;">' + disabledCount + '</span><span class="stat-label">停用</span></div>' +
    '<div class="stat-item"><span class="stat-num" style="color:#F59E0B;">' + pendingLogin + '</span><span class="stat-label">未首次登录</span></div>';

  // Populate district filter dropdown
  var districtSelect = document.getElementById('districtFilter');
  var districts = [];
  filtered.forEach(function(a) { var d = a.district || getDistrictForSchool(a.school); if (d && districts.indexOf(d) === -1) districts.push(d); });
  districts.sort();
  var currentDistVal = districtSelect.value;
  districtSelect.innerHTML = '<option value="all">全部区域</option>' + districts.map(function(d) { return '<option value="' + d + '">' + d + '</option>'; }).join('');
  districtSelect.value = currentDistVal;

  // Pagination
  var pageSize = 10;
  var totalItems = filtered.length;
  var totalPages = Math.ceil(totalItems / pageSize);
  var pageNum = parseInt(getUrlParam('page')) || 1;
  if (pageNum > totalPages) pageNum = totalPages || 1;
  if (pageNum < 1) pageNum = 1;
  var startIdx = (pageNum - 1) * pageSize;
  var pageData = filtered.slice(startIdx, startIdx + pageSize);

  // Table
  var tbody = document.getElementById('accountTableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="14"><div class="empty-state"><div class="icon">🔍</div><div class="text">暂无匹配的账号记录</div></div></td></tr>';
    return;
  }

  var html = '';
  var statusMap = { active: '正常', disabled: '停用' };
  var statusClass = { active: 'status-active', disabled: 'status-disabled' };
  var loginMap = { true: '已登录', false: '未登录' };
  var loginClass = { true: 'status-login-yes', false: 'status-login-no' };

  pageData.forEach(function(a, idx) {
    var roles = a.roles || [];
    var roleLabels = roles.map(function(r) { return ROLE_LABEL_MAP[r] || r; }).join('、');
    var canEdit = currentRole === 'system' || currentRole === 'city' || currentRole === 'district' || (currentRole === 'school' && a.school === currentUser.school);
    html += '<tr>' +
      '<td style="color:var(--text-light);">' + (idx + 1) + '</td>' +
      '<td><strong>' + (a.name || '—') + '</strong></td>' +
      '<td style="font-family:monospace;font-size:12px;">' + (a.idCard || '—') + '</td>' +
      '<td>' + (a.phone || '<span style="color:var(--danger);font-size:11px;">未绑定</span>') + '</td>' +
      '<td><span style="font-size:12px;">' + (a.staffingType || '—') + '</span></td>' +
      '<td>' + (a.district || getDistrictForSchool(a.school) || '—') + '</td>' +
      '<td><span style="font-size:12px;">' + (roleLabels || '—') + '</span></td>' +
      '<td>' + (a.school || '—') + '</td>' +
      '<td>' + renderCrossSchoolCell(a) + '</td>' +
      '<td>' + (a.isHighlandMember ? '🏔️ 是' : '<span style="color:var(--text-light);">—</span>') + '</td>' +
      '<td><span class="status-tag ' + (statusClass[a.status] || '') + '">' + (statusMap[a.status] || a.status) + '</span></td>' +
      '<td><span class="status-tag ' + (loginClass[a.firstLogin] || '') + '">' + (loginMap[a.firstLogin] || '—') + '</span></td>' +
      '<td style="font-size:12px;color:var(--text-secondary);">' + (a.updatedAt || '—') + '</td>' +
      '<td class="col-action"><div class="action-links">' +
        ((!a.firstLogin && ((a.entryRecords && a.entryRecords.length > 0) || a.staffingType === '合同制')) ? '<button class="btn-xs btn-xs-primary" onclick="showPassword(\'' + a.accountId + '\')">查看密码</button>' : '<button class="btn-xs btn-xs-outline" onclick="resetPassword(\'' + a.accountId + '\')">重置密码</button>') +
        '<button class="btn-xs btn-xs-outline" onclick="viewAccountModal(\'' + a.accountId + '\')">查看</button>' +
        '<button class="btn-xs btn-xs-outline" onclick="viewAccount(\'' + a.accountId + '\')">个人详情</button>' +
        (a.status !== 'disabled' ? '<button class="btn-xs btn-xs-outline" onclick="editAccount(\'' + a.accountId + '\')">编辑</button>' : '') +
        (a.status === 'disabled' && canEdit ? '<button class="btn-xs btn-xs-primary" onclick="restoreAccount(\'' + a.accountId + '\')">恢复</button>' : '') +
        (a.status === 'active' && canEdit ? '<button class="btn-xs btn-xs-danger" onclick="disableAccount(\'' + a.accountId + '\')">停用</button>' : '') +
      '</div></td>' +
      '</tr>';
  });
  tbody.innerHTML = html;

  // Pagination controls (append after table)
  var tableCard = document.querySelector('.table-card');
  var oldPag = document.getElementById('accountPagination');
  if (oldPag) oldPag.remove();
  if (totalPages > 1) {
    var pagHtml = '<div class="pagination" id="accountPagination">';
    pagHtml += '<button ' + (pageNum <= 1 ? 'disabled' : '') + ' onclick="goPage(' + (pageNum - 1) + ')">◀</button>';
    for (var p = 1; p <= totalPages; p++) {
      if (p <= 2 || p > totalPages - 2 || Math.abs(p - pageNum) <= 1) {
        pagHtml += '<button class="' + (p === pageNum ? 'active' : '') + '" onclick="goPage(' + p + ')">' + p + '</button>';
      } else if (p === 3 || p === totalPages - 2) {
        pagHtml += '<button disabled>…</button>';
      }
    }
    pagHtml += '<button ' + (pageNum >= totalPages ? 'disabled' : '') + ' onclick="goPage(' + (pageNum + 1) + ')">▶</button>';
    pagHtml += '<span class="page-info">共 ' + totalPages + ' 页 / ' + totalItems + ' 条</span>';
    pagHtml += '</div>';
    tableCard.insertAdjacentHTML('beforeend', pagHtml);
  }
}

function goPage(p) {
  var url = new URL(window.location.href);
  url.searchParams.set('page', p);
  window.location.href = url.toString();
}

function getUrlParam(name) {
  var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}

// Show password modal

      }
    } catch(e) {}

    '<div style="font-size:12px;color:var(--text-secondary);">登录账号：<span style="font-family:monospace;font-weight:600;color:var(--text);">' + a.idCard + '</span></div>' +
    (a.phone ? '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">备用登录：<span style="font-family:monospace;font-weight:600;color:var(--text);">' + a.phone + '</span></div>' : '') +
    '</div>' +
    '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">初始密码（请线下安全传递给教师）</div>' +
    '<div class="pwd-display" id="pwdDisplay">' + pwd + '</div>' +

function copyPassword() {
  var el = document.getElementById('pwdDisplay');
  if (!el) return;
  var input = document.createElement('input');
  input.value = el.textContent;
  document.body.appendChild(input);
  input.select();
  document.execCommand('copy');
  document.body.removeChild(input);
  showToast('密码已复制到剪贴板', 'success');
}

var resetTargetAccountId = null;

function resetPassword(accountId) {
  var accounts = loadAccounts();
  var a = accounts.filter(function(ac) { return ac.accountId === accountId; })[0];

  document.getElementById('pwdModalOverlay').classList.remove('show');

}

document.getElementById('pwdModalOverlay').addEventListener('click', function(e) {

});

function togglePwdEye_account(inputId, btn) {
  var input = document.getElementById(inputId);
  input.type = input.type === 'password' ? 'text' : 'password';
}

function checkPwdStrength_account() {
  var pwd = document.getElementById('pwdNew').value;
  var bars = document.querySelectorAll('#pwdStrengthBars .pwd-strength-bar');
  var label = document.getElementById('pwdStrengthLabel');
  var rules = document.getElementById('pwdRules').querySelectorAll('.pwd-rule');
  bars.forEach(function(b) { b.className = 'pwd-strength-bar'; });
  label.className = 'pwd-strength-label';
  var hasLen = pwd.length >= 8 && pwd.length <= 20;
  var hasUpper = /[A-Z]/.test(pwd);
  var hasLower = /[a-z]/.test(pwd);
  var hasDigit = /[0-9]/.test(pwd);
  var confirmPwd = document.getElementById('pwdConfirm').value;
  var ruleChecks = [hasLen, hasUpper, hasLower, hasDigit,
    confirmPwd === '' || pwd === confirmPwd
  ];
  rules.forEach(function(r, i) {
    var icon = r.querySelector('.rule-icon');
    if (ruleChecks[i]) { r.classList.add('pass'); icon.textContent = '✅'; }
    else { r.classList.remove('pass'); icon.textContent = '⬜'; }
  });
  if (!pwd) { label.textContent = ''; return; }
  var score = (hasLen?1:0) + (hasUpper?1:0) + (hasLower?1:0) + (hasDigit?1:0);
  if (score <= 1 || !hasLen) {
    bars[0].classList.add('weak'); label.textContent = '弱'; label.classList.add('weak');
  } else if (score === 2 || score === 3) {
    bars[0].classList.add('medium'); bars[1].classList.add('medium'); label.textContent = '中等'; label.classList.add('medium');
  } else if (score >= 4 && hasLen) {
    bars[0].classList.add('strong'); bars[1].classList.add('strong'); bars[2].classList.add('strong'); label.textContent = '强'; label.classList.add('strong');
  }
}

function checkPwdMatch_account() {
  var newPwd = document.getElementById('pwdNew').value;
  var confirmPwd = document.getElementById('pwdConfirm').value;
  var rule = document.getElementById('pwdRuleMatch');
  var icon = rule.querySelector('.rule-icon');
  if (confirmPwd && newPwd === confirmPwd) { rule.classList.add('pass'); icon.textContent = '✅'; }
  else { rule.classList.remove('pass'); icon.textContent = '⬜'; }
}

function resetPwdStrength_account() {
  var bars = document.querySelectorAll('#pwdStrengthBars .pwd-strength-bar');
  bars.forEach(function(b) { b.className = 'pwd-strength-bar'; });
  document.getElementById('pwdStrengthLabel').textContent = '';
  document.getElementById('pwdStrengthLabel').className = 'pwd-strength-label';
  var rules = document.getElementById('pwdRules').querySelectorAll('.pwd-rule');
  rules.forEach(function(r) { r.classList.remove('pass'); r.querySelector('.rule-icon').textContent = '⬜'; });
}

function submitResetPwd() {
  var newPwd = document.getElementById('pwdNew').value;
  var confirmPwd = document.getElementById('pwdConfirm').value;
  if (!newPwd) { showToast('请输入新密码', 'warning'); return; }
  if (newPwd.length < 8 || newPwd.length > 20) { showToast('密码须为8-20位', 'warning'); return; }
  if (!/[A-Z]/.test(newPwd)) { showToast('新密码须包含大写字母', 'warning'); return; }
  if (!/[a-z]/.test(newPwd)) { showToast('新密码须包含小写字母', 'warning'); return; }
  if (!/[0-9]/.test(newPwd)) { showToast('新密码须包含数字', 'warning'); return; }
  if (newPwd !== confirmPwd) { showToast('两次密码输入不一致', 'warning'); return; }
  var accounts = loadAccounts();
  for (var i = 0; i < accounts.length; i++) {
    if (accounts[i].accountId === resetTargetAccountId) {
      accounts[i].password = newPwd;
      accounts[i].initialPassword = newPwd;
      accounts[i].firstLogin = false;
      break;
    }
  }
  saveAccounts(accounts);
  closePwdModal();
  showToast('密码已重置', 'success');
  if (typeof writeLog === 'function') writeLog({ module: 'account', actionType: 'reset_pwd', targetType: 'account', targetId: resetTargetAccountId, detail: '重置密码', result: 'success' });
  renderAccounts();
}

    '<div style="font-size:11px;font-weight:600;color:#64748B;margin-bottom:6px;">⏸ 停用信息</div>' + rows + '</div>';

// Filter school dropdown for create modal
function filterCreateSchoolOptions() {
  loadSchoolList();
  var input = document.getElementById('crSchoolInput');
  var q = (input.value || '').toLowerCase();
  var html = '';
  // District admin: only show schools in their district
  var districtFilter = currentRole === 'district' ? (currentUser.district || '') : '';
  for (var i = 0; i < ALL_SCHOOLS.length; i++) {
    var s = ALL_SCHOOLS[i];
    if (q && s.toLowerCase().indexOf(q) === -1) continue;
    if (districtFilter) {
      var sd = getDistrictForSchool(s);
      if (sd !== districtFilter) continue;
    }
    html += '<div class="school-option" onclick="selectCreateSchool(\'' + s.replace(/'/g,"\\'") + '\')">' + s + '</div>';
  }
  var dd = document.getElementById('crSchoolDropdown');
  if (dd) { dd.innerHTML = html; dd.classList.add('show'); }
}
function selectCreateSchool(name) {
  document.getElementById('crSchoolInput').value = name;
  document.getElementById('crSchool').value = name;
  document.getElementById('crSchoolDropdown').classList.remove('show');
}
function toggleCreateSchoolDropdown(show) {
  var dd = document.getElementById('crSchoolDropdown');
  if (!dd) return;
  if (show) { filterCreateSchoolOptions(); dd.classList.add('show'); }
  else { setTimeout(function() { dd.classList.remove('show'); }, 200); }
}

// Role change → show/hide staffing type and post info
function onCreateRoleChange() {
  var chks = document.querySelectorAll('.createRoleChk:checked');
  var hasTeacher = false, hasSchool = false;
  for (var i = 0; i < chks.length; i++) {
    if (chks[i].value === 'teacher') hasTeacher = true;
    if (chks[i].value === 'school') hasSchool = true;
  }
  var needsPostInfo = hasTeacher || hasSchool;

  // 编制类型 + 入编方式
  document.getElementById('fgCrStaffingType').style.display = needsPostInfo ? '' : 'none';
  document.getElementById('fgCrEntryMethod').style.display = needsPostInfo ? '' : 'none';
  // 岗位信息
  document.getElementById('crPostFieldset').style.display = needsPostInfo ? '' : 'none';
  // 跨校信息
  document.getElementById('crCrossFieldset').style.display = needsPostInfo ? '' : 'none';

  if (!needsPostInfo) {
    document.getElementById('crStaffingType').value = '';
    document.getElementById('crEntryMethod').value = '';
  }
  onCreateStaffingTypeChange();
}

// Staffing type change → show/hide entry method, contract dates, required markers
function onCreateStaffingTypeChange() {
  var st = document.getElementById('crStaffingType').value;
  var isBianzhi = (st === '事业编' || st === '控制数');
  var isContract = (st === '合同制');

  // 入编方式
  document.getElementById('fgCrEntryMethod').style.display = isBianzhi ? '' : 'none';
  document.getElementById('reqCrEntry').innerHTML = isBianzhi ? ' <span style="color:var(--danger);">*</span>' : '';

  // 岗位类别+等级 required for 事业编/控制数
  document.getElementById('reqCrCategory').innerHTML = isBianzhi ? ' <span style="color:var(--danger);">*</span>' : '';
  document.getElementById('reqCrLevel').innerHTML = isBianzhi ? ' <span style="color:var(--danger);">*</span>' : '';

  // 岗位名称+任职时间 required when teacher or school role selected
  var chks = document.querySelectorAll('.createRoleChk:checked');
  var hasTeacherOrSchool = false;
  for (var i = 0; i < chks.length; i++) {
    if (chks[i].value === 'teacher' || chks[i].value === 'school') { hasTeacherOrSchool = true; break; }
  }
  document.getElementById('reqCrPosition').innerHTML = hasTeacherOrSchool ? ' <span style="color:var(--danger);">*</span>' : '';
  document.getElementById('reqCrAppoint').innerHTML = hasTeacherOrSchool ? ' <span style="color:var(--danger);">*</span>' : '';

  // 合同期限
  document.getElementById('fgCrContractStart').style.display = isContract ? '' : 'none';
  document.getElementById('fgCrContractEnd').style.display = isContract ? '' : 'none';
  document.getElementById('reqCrContractStart').innerHTML = isContract ? ' <span style="color:var(--danger);">*</span>' : '';
  document.getElementById('reqCrContractEnd').innerHTML = isContract ? ' <span style="color:var(--danger);">*</span>' : '';

  // Hint
  var hintEl = document.getElementById('crPostHint');
  if (hintEl) {
    if (isContract) hintEl.innerHTML = '※ 合同制教师必填合同期限。创建后合同期限变为只读，变更需走续聘审批。';
    else if (isBianzhi) hintEl.innerHTML = '※ 事业编/控制数教师须填写完整岗位信息。';
    else hintEl.innerHTML = '';
  }
}

function createAccount() {
  var name = document.getElementById('crName').value.trim();
  if (!name) { showToast('请输入姓名', 'warning'); return; }
  var idCard = document.getElementById('crIdCard').value.trim();
  if (!idCard) { showToast('请输入身份证号', 'warning'); return; }
  if (idCard.length !== 18) { showToast('身份证号须为18位', 'warning'); return; }
  var phone = document.getElementById('crPhone').value.trim();
  if (!phone) { showToast('请输入手机号', 'warning'); return; }
  if (!/^\d{11}$/.test(phone)) { showToast('请输入正确的11位手机号', 'warning'); return; }

  var selectedRoles = [];
  var chks = document.querySelectorAll('.createRoleChk:checked');
  for (var i = 0; i < chks.length; i++) { selectedRoles.push(chks[i].value); }
  if (!selectedRoles.length) { showToast('请选择至少一个角色', 'warning'); return; }
  var hasTeacher = selectedRoles.indexOf('teacher') !== -1;
  var hasSchool = selectedRoles.indexOf('school') !== -1;
  var needsPostInfo = hasTeacher || hasSchool;

  var school = document.getElementById('crSchool').value || '';
  if (!school) { showToast('请选择所属单位', 'warning'); return; }

  var staffingType = '';
  var entryMethod = '';
  var categoryName = '', postLevel = '', assignPosition = '', appointTime = '';
  var contractStart = '', contractEnd = '';

  if (needsPostInfo) {
    staffingType = document.getElementById('crStaffingType').value;
    if (!staffingType) { showToast('请选择编制类型', 'warning'); return; }
    var isBianzhi = (staffingType === '事业编' || staffingType === '控制数');
    var isContract = (staffingType === '合同制');

    if (isBianzhi) {
      entryMethod = document.getElementById('crEntryMethod').value;
      if (!entryMethod) { showToast('请选择入编方式', 'warning'); return; }
    }

    // 岗位名称 + 任职时间 (required for all teacher types)
    assignPosition = document.getElementById('crAssignPosition').value.trim();
    if (!assignPosition) { showToast('请输入岗位名称', 'warning'); return; }
    appointTime = document.getElementById('crAppointTime').value;
    if (!appointTime) { showToast('请选择任职时间', 'warning'); return; }

    if (isBianzhi) {
      categoryName = document.getElementById('crCategoryName').value;
      if (!categoryName) { showToast('请选择岗位类别', 'warning'); return; }
      postLevel = document.getElementById('crPostLevel').value;
      if (!postLevel) { showToast('请选择岗位等级', 'warning'); return; }
    }

    if (isContract) {
      contractStart = document.getElementById('crContractStart').value;
      if (!contractStart) { showToast('请选择合同开始日期', 'warning'); return; }
      contractEnd = document.getElementById('crContractEnd').value;
      if (!contractEnd) { showToast('请选择合同结束日期', 'warning'); return; }
    }
  } else {
    // Pure admin account (city/district only, no school or teacher) — no staffing type or post info
    staffingType = '—';
  }

  // Check idCard uniqueness
  var accounts = loadAccounts();
  for (var k = 0; k < accounts.length; k++) {
    if (accounts[k].idCard === idCard) { showToast('身份证号已存在，请勿重复创建', 'warning'); return; }
  }

  // Generate account
  var now = new Date();
  var ts = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0') + String(now.getSeconds()).padStart(2,'0');
  var accountId = 'TEA' + ts;
  var initialPwd = 'Edu@' + idCard.slice(-8);
  var district = getDistrictForSchool(school) || '';

  var newAccount = {
    accountId: accountId,
    roles: selectedRoles,
    name: name,
    idCard: idCard,
    phone: phone,
    staffingType: staffingType,
    school: school,
    district: district,
    status: 'active',
    entryMethod: entryMethod,
    categoryName: categoryName,
    postLevel: postLevel,
    assignPosition: assignPosition,
    appointTime: appointTime,
    contractStart: contractStart,
    contractEnd: contractEnd,
    crossSchoolType: (document.getElementById('crCrossSchoolType') ? document.getElementById('crCrossSchoolType').value : 'normal') || 'normal',
    crossSchool: (document.getElementById('crCrossSchool') ? document.getElementById('crCrossSchool').value : '') || '',
    crossStartDate: (document.getElementById('crCrossStartDate') ? document.getElementById('crCrossStartDate').value : '') || '',
    crossEndDate: (document.getElementById('crCrossEndDate') ? document.getElementById('crCrossEndDate').value : '') || '',
    disableType: '',
    disableReason: '',
    disableDate: '',
    disableOperator: '',
    isHighlandMember: false,
    initialPassword: initialPwd,
    password: initialPwd,
    firstLogin: true,
    createdAt: now.toISOString(),
    updatedAt: ts,
    activatedAt: null,
    entryRecords: [],
    exitRecords: []
  };

  accounts.push(newAccount);
  saveAccounts(accounts);
  closeModal();

  // Show password modal
  showCreatedPassword(accountId, name, idCard, initialPwd);

  if (typeof writeLog === 'function') writeLog({ module: 'account', actionType: 'create', targetType: 'account', targetId: accountId, targetName: name, detail: '新增账号', result: 'success' });
  renderAccounts();
}

function showCreatedPassword(accountId, name, idCard, pwd) {
  document.getElementById('modalContainer').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal-container" style="padding:24px;">' +
    '<h3>🔑 账号已创建</h3>' +
    '<div style="margin:12px 0;padding:14px;background:var(--gray-bg);border-radius:10px;">' +
    '<div style="margin-bottom:6px;"><strong style="font-size:14px;">' + escapeHtml(name) + '</strong></div>' +
    '<div style="font-size:12px;color:var(--text-secondary);">登录账号：<span style="font-family:monospace;font-weight:600;color:var(--text);">' + idCard + '</span></div>' +
    '</div>' +
    '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">初始密码（请线下安全传递给教师）</div>' +
    '<div class="pwd-display" id="createdPwdDisplay">' + pwd + '</div>' +
    '<button class="pwd-copy-btn" onclick="copyCreatedPassword()">📋 复制密码</button>' +
    '<div class="pwd-info">⚠ 教师首次登录后需修改密码，此密码将不再可用</div>' +
    '<div class="modal-buttons"><button class="btn-cancel" onclick="closeModal()">关闭</button></div>' +
    '</div></div>';
}

function copyCreatedPassword() {
  var el = document.getElementById('createdPwdDisplay');
  if (!el) return;
  var input = document.createElement('input');
  input.value = el.textContent;
  document.body.appendChild(input);
  input.select();
  document.execCommand('copy');
  document.body.removeChild(input);
  showToast('密码已复制到剪贴板', 'success');
}

// ===== VIEW ACCOUNT MODAL (read-only) =====
function viewAccountModal(accountId) {
  var accounts = loadAccounts();
  var a = accounts.filter(function(ac) { return ac.accountId === accountId; })[0];
  if (!a) return;
  var rolesDisplay = (a.roles || []).map(function(r) { return ROLE_LABEL_MAP[r] || r; }).join('、');
  var statusLabel = (a.status === 'active' ? '正常' : '停用');
  var loginLabel = a.firstLogin ? '已登录' : '未登录';
  var districtVal = a.district || getDistrictForSchool(a.school) || '—';
  var updatedAt = a.updatedAt || '—';
  var isContract = a.staffingType === '合同制';
  var isBianzhi = a.staffingType === '事业编' || a.staffingType === '控制数';

  var h = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal-container" style="width:600px;max-height:80vh;overflow-y:auto;padding:24px;">' +
    '<h3 style="margin-bottom:16px;">查看账号 — ' + escapeHtml(a.name) + '</h3>';

  // 账号信息
  h += '<fieldset class="modal-fieldset"><legend>账号信息</legend><div class="form-grid">';
  h += fv('姓名', a.name);
  h += fv('身份证号', a.idCard);
  h += fv('手机号', a.phone || '—');
  h += '<div class="form-group span-full"><label>所属角色</label><div style="font-size:12px;font-weight:500;padding:4px 0;">' + (rolesDisplay || '—') + '</div></div>';
  h += '</div></fieldset>';

  // 归属信息
  h += '<fieldset class="modal-fieldset"><legend>归属信息</legend><div class="form-grid">';
  h += fv('所属单位', a.school || '—');
  h += fv('编制类型', a.staffingType || '—');
  if (isBianzhi) h += fv('入编方式', a.entryMethod || '—');
  else if (isContract) h += '<div class="form-group"><label>入编方式</label><div style="font-size:12px;color:var(--text-light);padding:4px 0;">合同制无入编方式</div></div>';
  h += fv('所属区域', districtVal);
  h += '</div></fieldset>';

  // 个人档案
  h += '<fieldset class="modal-fieldset"><legend>个人档案</legend><div class="form-grid">';
  var up = {}; try { up = JSON.parse(localStorage.getItem('user_profile_' + (a.idCard || '')) || '{}'); } catch(e) {}
  h += fv('性别', up.gender || '—');
  h += fv('民族', up.ethnicity || '—');
  h += fv('出生日期', up.birthDate || '—');
  h += fv('政治面貌', up.politicalStatus || '—');
  h += fv('学历', up.education || '—');
  h += fv('毕业院校', up.graduateInfo || '—');
  h += '</div></fieldset>';

  // 岗位信息
  h += '<fieldset class="modal-fieldset"><legend>岗位信息</legend><div class="form-grid">';
  h += fv('岗位类别', up.categoryName || '—');
  h += fv('岗位等级', up.currentPost || '—');
  h += fv('岗位名称', up.assignPosition || '—');
  h += fv('任职时间', up.appointTime || '—');
  h += fv('是否小高地成员', a.isHighlandMember ? '是' : '否');
  if (isContract) {
    h += '<div class="form-group span-full"><label>合同期限</label><div style="font-size:12px;font-weight:500;padding:4px 0;color:var(--text-secondary);">' + (a.contractStart || '—') + ' ~ ' + (a.contractEnd || '—') + '</div></div>';
  }
  h += '</div></fieldset>';

  // 跨校信息
  if (isBianzhi || isContract) {
    var csType = a.crossSchoolType || 'normal';
    var csLabel = csType === 'normal' ? '在岗（非跨校）' : ((CROSS_SCHOOL_LABELS && CROSS_SCHOOL_LABELS[csType]) || csType);
    h += '<fieldset class="modal-fieldset"><legend>跨校信息</legend><div class="form-grid">';
    h += fv('跨校类型', csLabel);
    if (csType !== 'normal') {
      h += fv('任职学校', a.crossSchool || '—');
      h += fv('开始日期', a.crossStartDate || '—');
      h += fv('结束日期', a.crossEndDate || '—');
    }
    h += '</div></fieldset>';
  }

  // 编制与聘用信息（补录）
  if (isBianzhi || isContract) {
    h += '<fieldset class="modal-fieldset"><legend>编制与聘用信息（补录）</legend><div class="form-grid">';

      h += fv('近三年考核', up.assessments || a.assessments || '—');

    h += fv('现任职务', up.currentTitle || a.currentTitle || '—');
    if (isContract) {
      h += fv('入职时间', up.contractEntryDate || a.contractEntryDate || '—');
    }
    h += '</div></fieldset>';
  }

  // 停用信息
  h += buildStatusCard(a);

  // 只读状态条
  var stBg = a.status === 'disabled' ? '#FFF5F5' : '#F8FAFC';

  h += '<span style="color:var(--text-light);">更新时间：<b>' + updatedAt + '</b></span>';
  h += '</div>';

  h += '<div class="modal-buttons"><button class="btn-cancel" onclick="closeModal()">关闭</button></div>';
  h += '</div></div>';
  document.getElementById('modalContainer').innerHTML = h;
}

function fv(label, value) {
  return '<div class="form-group"><label>' + label + '</label><div style="font-size:12px;font-weight:500;padding:4px 0;color:var(--text);">' + escapeHtml(value || '—') + '</div></div>';
}

function editAccount(accountId) {

  if (!a) return;
  var rolesCheckboxes = '';

function updatePostLevelOptions() {
  var catEl = document.getElementById('editCategoryName');
  var lvlEl = document.getElementById('editPostLevel');
  if (!catEl || !lvlEl) return;
  var cat = catEl.value;
  var prevVal = lvlEl.value;
  var options = POST_LEVEL_OPTIONS[cat] || [];
  var h = '<option value="">—</option>';
  for (var i = 0; i < options.length; i++) {
    h += '<option value="' + options[i] + '">' + options[i] + '</option>';
  }
  lvlEl.innerHTML = h;
  // Restore previous value if it exists in new options
  if (prevVal) {
    for (var j = 0; j < lvlEl.options.length; j++) {
      if (lvlEl.options[j].value === prevVal) { lvlEl.value = prevVal; break; }
    }
  }
}

// Cross-school school dropdown
function filterCrossSchoolOptions() {
  loadSchoolList();
  var input = document.getElementById('editCrossSchoolInput');
  var q = (input.value || '').toLowerCase();
  var html = '';
  for (var i = 0; i < ALL_SCHOOLS.length; i++) {
    if (!q || ALL_SCHOOLS[i].toLowerCase().indexOf(q) !== -1) {
      html += '<div class="school-option" onclick="selectCrossSchool(\'' + ALL_SCHOOLS[i].replace(/'/g,"\\'") + '\')">' + ALL_SCHOOLS[i] + '</div>';
    }
  }
  var dd = document.getElementById('editCrossSchoolDropdown');
  if (dd) { dd.innerHTML = html; dd.classList.add('show'); }
}

function selectCrossSchool(name) {
  document.getElementById('editCrossSchoolInput').value = name;
  document.getElementById('editCrossSchool').value = name;
  document.getElementById('editCrossSchoolDropdown').classList.remove('show');
}

function toggleCrossSchoolDropdown(show) {
  var dd = document.getElementById('editCrossSchoolDropdown');
  if (!dd) return;
  if (show) { filterCrossSchoolOptions(); dd.classList.add('show'); }
  else { setTimeout(function() { dd.classList.remove('show'); }, 200); }
}

function onCrossSchoolTypeChange() {
  var typeEl = document.getElementById('editCrossSchoolType');
  var isNormal = !typeEl || typeEl.value === 'normal' || !typeEl.value;
  var fields = ['editCrossSchoolInput', 'editCrossSchool', 'editCrossStartDate', 'editCrossEndDate'];
  for (var i = 0; i < fields.length; i++) {
    var el = document.getElementById(fields[i]);
    if (el) {
      el.style.display = isNormal ? 'none' : '';
      if (isNormal && fields[i] !== 'editCrossSchool') el.value = '';
      if (isNormal && fields[i] === 'editCrossSchool') el.value = '';
    }
  }
  // Show/hide labels by finding parent form-group
  var labels = document.querySelectorAll('#editModalCrossFieldset .form-group');
  for (var j = 1; j < labels.length; j++) { // skip first (跨校类型 itself)
    labels[j].style.display = isNormal ? 'none' : '';

}

  // Cross-school fieldset visibility
  var csFieldset = document.getElementById('editModalCrossFieldset');
  if (csFieldset) {
    csFieldset.style.display = showCross ? '' : 'none';
    if (!showCross) {
      var typeEl = document.getElementById('editCrossSchoolType');
      if (typeEl) typeEl.value = 'normal';
      onCrossSchoolTypeChange();
    }
  }

  // 入编方式 visibility
  var fgEntry = document.getElementById('fgEntryMethod');
  if (fgEntry) {
    fgEntry.style.display = showEntryMethod ? '' : 'none';
    if (!showEntryMethod) {
      var emEl = document.getElementById('editEntryMethod2');
      if (emEl) emEl.value = '';
    }
  }
  // Update 入编方式 required marker
  var reqEm = document.getElementById('reqEntryMethod');
  if (reqEm) {
    reqEm.innerHTML = showEntryMethod ? ' <span style="color:var(--danger);">*</span>' : '';
  }
  // Trigger fill fields linkage
  onStaffingTypeChange_fill();
}

// 补录字段联动：编制类型切换时显示/隐藏对应字段
function onStaffingTypeChange_fill() {
  var stEl = document.getElementById('editStaffingType2');
  var stVal = stEl ? stEl.value : '';
  var isBianzhi = (stVal === '事业编' || stVal === '控制数');
  var isContract = (stVal === '合同制');

  // 事业编/控制数字段
  var carreraFields = ['fgEntryDate','fgRosterBook','fgDocNumber','fgAssessments'];
  for (var i = 0; i < carreraFields.length; i++) {
    var el = document.getElementById(carreraFields[i]);
    if (el) el.style.display = isBianzhi ? '' : 'none';
  }

  // 合同制字段
  var contractFields = ['fgContractEntryDate','fgContractStart','fgContractEnd'];
  for (var j = 0; j < contractFields.length; j++) {
    var el2 = document.getElementById(contractFields[j]);
    if (el2) el2.style.display = isContract ? '' : 'none';
  }

  // 入编时间必填标记
  var reqEd = document.getElementById('reqEntryDate2');
  if (reqEd) reqEd.innerHTML = isBianzhi ? ' <span style="color:var(--danger);">*</span>' : '';

  // 合同制必填标记
  var reqContractFields = ['reqContractEntry','reqContractStart','reqContractEnd'];
  for (var k = 0; k < reqContractFields.length; k++) {
    var el3 = document.getElementById(reqContractFields[k]);
    if (el3) el3.innerHTML = isContract ? ' <span style="color:var(--danger);">*</span>' : '';

  // 现任职务始终显示，必填标记

// Filter school dropdown functions
function loadSchoolList() {
  if (ALL_SCHOOLS.length) return;
  try {
    var dir = JSON.parse(localStorage.getItem('org_directory') || '[]');
    for (var i = 0; i < dir.length; i++) { if (dir[i].orgName) ALL_SCHOOLS.push(dir[i].orgName); }
    ALL_SCHOOLS.sort();
  } catch(e) {}
}

function filterSchoolOptions_filter() {
  loadSchoolList();
  var input = document.getElementById('filterSchoolInput');
  var q = (input.value || '').toLowerCase();
  var html = '<div class="school-option" onclick="selectSchool_filter(\'\')" style="color:var(--text-light);">全部单位</div>';
  for (var i = 0; i < ALL_SCHOOLS.length; i++) {
    if (!q || ALL_SCHOOLS[i].toLowerCase().indexOf(q) !== -1) {
      html += '<div class="school-option" onclick="selectSchool_filter(\'' + ALL_SCHOOLS[i].replace(/'/g,"\\'") + '\')">' + ALL_SCHOOLS[i] + '</div>';
    }
  }
  var dd = document.getElementById('filterSchoolDropdown');
  if (dd) { dd.innerHTML = html; dd.classList.add('show'); }
}

function selectSchool_filter(name) {
  document.getElementById('filterSchoolInput').value = name || '';
  document.getElementById('schoolFilterVal').value = name || 'all';
  document.getElementById('filterSchoolDropdown').classList.remove('show');
  renderAccounts();
}

function toggleSchoolDropdown_filter(show) {
  var dd = document.getElementById('filterSchoolDropdown');
  if (!dd) return;
  if (show) { filterSchoolOptions_filter(); dd.classList.add('show'); }
  else { setTimeout(function() { dd.classList.remove('show'); }, 200); }
}

// Close dropdown on outside click
document.addEventListener('click', function(e) {
  if (!e.target.closest('.searchable-select')) {
    var dd = document.getElementById('editSchoolDropdown');
    if (dd) dd.classList.remove('show');

    if (edd) edd.classList.remove('show');

    if (fd) fd.classList.remove('show');

    var msd = document.getElementById('staffingTypeDropdown');
