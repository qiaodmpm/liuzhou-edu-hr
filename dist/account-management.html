<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>账号管理 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-user { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.7); text-decoration: none; border-left: 3px solid transparent; transition: var(--transition); }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-label { white-space: nowrap; }
.menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 6px; }
.role-switch-btn { display: block; width: 100%; padding: 6px 10px; margin-bottom: 4px; border: none; border-radius: 4px; background: transparent; color: rgba(255,255,255,0.6); font-size: 12px; cursor: pointer; text-align: left; font-family: inherit; transition: var(--transition); }
.role-switch-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
.role-switch-btn.active { background: rgba(255,255,255,0.12); color: #fff; font-weight: 500; }

.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px 28px; min-height: calc(100vh - 56px); }

.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 700; }

/* Filter bar */
.filter-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: #fff; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; }
.filter-bar label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.filter-select, .filter-input { padding: 6px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text); font-family: inherit; outline: none; }
.filter-select:focus, .filter-input:focus { border-color: var(--accent); }
.filter-input { width: 200px; }

/* Stats bar */
.stats-bar { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-item { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.stat-item .stat-num { font-size: 22px; font-weight: 700; color: var(--primary); }
.stat-item .stat-label { color: var(--text-secondary); font-size: 12px; }

/* Table */
.table-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: #F8FAFC; padding: 10px 14px; text-align: left; font-weight: 600; font-size: 12px; color: var(--text-secondary); border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #FAFBFC; }

.status-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.status-active { background: #ECFDF5; color: #059669; }
.status-frozen { background: #FEF2F2; color: #EF4444; }
.status-disabled { background: #F1F5F9; color: #94A3B8; }

.action-btn { padding: 4px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: #fff; color: var(--text); transition: var(--transition); font-family: inherit; }
.action-btn:hover { border-color: var(--accent); color: var(--accent); }
.action-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.action-btn.primary:hover { background: var(--primary-dark); }
.action-btn.danger { color: var(--danger); border-color: var(--danger); }
.action-btn.danger:hover { background: #FEF2F2; }
.action-btn.success { color: var(--success); border-color: var(--success); }
.action-btn.success:hover { background: #ECFDF5; }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
.modal-container { background: #fff; border-radius: 16px; width: 480px; max-width: 90%; padding: 24px; box-shadow: var(--shadow-lg); }
.modal-container h3 { margin-bottom: 12px; font-size: 16px; font-weight: 600; }
.modal-container .form-group { margin-bottom: 14px; }
.modal-container .form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.modal-container .form-group input { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; outline: none; }
.modal-container .form-group input:focus { border-color: var(--accent); }
.modal-buttons { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
.btn-cancel { background: var(--gray-bg); border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; }
.btn-cancel:hover { background: #E2E8F0; }
.btn-confirm { color: #fff; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; }
.btn-confirm.primary { background: var(--primary); }
.btn-confirm.primary:hover { background: var(--primary-dark); }
.btn-confirm.warning { background: #F59E0B; }
.btn-confirm.warning:hover { background: #D97706; }

.pwd-display { background: var(--primary-light); border: 2px dashed var(--accent); padding: 14px 16px; border-radius: 10px; font-family: 'Courier New', monospace; font-size: 22px; text-align: center; letter-spacing: 3px; margin: 14px 0; color: var(--primary); font-weight: 700; }
.pwd-copy-btn { display: block; margin: 0 auto; padding: 8px 20px; font-size: 12px; background: #fff; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); }
.pwd-copy-btn:hover { background: var(--primary-light); }
.pwd-info { font-size: 11px; color: var(--text-light); text-align: center; margin-top: 10px; padding: 8px 12px; background: #FFFBEB; border-radius: 6px; color: #92400E; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .text { font-size: 14px; }

@media (max-width: 1200px) { .filter-bar { flex-wrap: wrap; } }

.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 12px 28px; border-radius: var(--radius); color: #fff;
  font-size: 14px; font-weight: 500; z-index: 9999;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
  box-shadow: var(--shadow-lg);
}
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>

function renderSidebar() {

  if (!roleData) { document.getElementById('sidebarMenu').innerHTML = ''; return; }
  var sidebar = roleData.sidebar;
  var html = '';
  (sidebar.top || []).forEach(function(item) {
    html += '<a class="menu-item" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[item.icon] || '') + '<span class="menu-label">' + item.label + '</span></a>';
  });
  (sidebar.groups || []).forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      html += '<a class="menu-item' + (item.id === 'account' ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[MENU_ICONS[item.id] || 'file'] || '') + '<span class="menu-label">' + item.label + '</span></a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') {
    if (currentRole === 'school') window.location.href = '教师入编管理（学校管理员视角）.html?role=school';
    else window.location.href = '教师入编管理（主管单位视角）.html?role=' + currentRole;
    return;
  }
  if (id === 'exit') {
    if (currentRole === 'school') window.location.href = '教师出编管理（学校管理员视角）.html?role=school';
    else window.location.href = '教师出编管理（主管单位视角）.html?role=' + currentRole;
    return;
  }
  if (id === 'promote') { window.location.href = 'promote-list-admin.html?role=' + currentRole; return; }
  if (id === 'postset') { window.location.href = 'post-list-admin.html?role=' + currentRole; return; }
  if (id === 'recruit') { window.location.href = 'recruit-list-admin.html?role=' + currentRole; return; }
  if (id === 'account') { return; }

  if (id === 'ledger') { var lr = (typeof currentUser!=='undefined'?currentUser.role:currentRole); window.location.href = (lr === 'city' || lr === 'district') ? 'org-ledger-admin.html' : lr === 'school' ? 'org-ledger-school.html' : 'workbench.html'; return; }
  showToast('导航到: ' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}

// ===== RENDER =====
function renderAccounts() {
  var accounts = loadAccounts();
  var search = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  var statusFilter = document.getElementById('statusFilter').value;
  var schoolFilter = document.getElementById('schoolFilter').value;

  // Filter by role permissions
  var filtered = accounts;
  if (currentRole === 'school') {
    filtered = filtered.filter(function(a) { return a.school === currentUser.school; });
  } else if (currentRole === 'district') {
    // District can see their own schools (demo: 鱼峰区)
    filtered = filtered.filter(function(a) { return a.school && (a.school.indexOf('八中') !== -1 || a.school.indexOf('鱼峰') !== -1 || a.school.indexOf('实验小学') !== -1); });
  }

  // Apply search
  if (search) {
    filtered = filtered.filter(function(a) {
      return (a.name && a.name.toLowerCase().indexOf(search) !== -1) ||
             (a.idCard && a.idCard.indexOf(search) !== -1) ||
             (a.phone && a.phone.indexOf(search) !== -1);
    });
  }

  // Apply status filter
  if (statusFilter !== 'all') {
    filtered = filtered.filter(function(a) { return a.status === statusFilter; });
  }

  // Apply school filter
  if (schoolFilter !== 'all') {
    filtered = filtered.filter(function(a) { return a.school === schoolFilter; });
  }

  // Stats
  var total = accounts.length;
  var activeCount = accounts.filter(function(a) { return a.status === 'active'; }).length;
  var frozenCount = accounts.filter(function(a) { return a.status === 'frozen'; }).length;
  var pendingLogin = accounts.filter(function(a) { return a.status === 'active' && !a.firstLogin; }).length;
  document.getElementById('statsBar').innerHTML =
    '<div class="stat-item"><span class="stat-num">' + total + '</span><span class="stat-label">总账号</span></div>' +
    '<div class="stat-item"><span class="stat-num" style="color:#10B981;">' + activeCount + '</span><span class="stat-label">正常</span></div>' +
    '<div class="stat-item"><span class="stat-num" style="color:#EF4444;">' + frozenCount + '</span><span class="stat-label">冻结</span></div>' +
    '<div class="stat-item"><span class="stat-num" style="color:#F59E0B;">' + pendingLogin + '</span><span class="stat-label">未首次登录</span></div>';

  // Populate school filter dropdown
  var schoolSelect = document.getElementById('schoolFilter');
  var schools = [];
  filtered.forEach(function(a) { if (a.school && schools.indexOf(a.school) === -1) schools.push(a.school); });
  schools.sort();
  var currentSchoolVal = schoolSelect.value;
  schoolSelect.innerHTML = '<option value="all">全部学校</option>' + schools.map(function(s) { return '<option value="' + s.replace(/'/g, "\\'") + '">' + s + '</option>'; }).join('');
  schoolSelect.value = currentSchoolVal;

  // Table
  var tbody = document.getElementById('accountTableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="icon">🔍</div><div class="text">暂无匹配的账号记录</div></div></td></tr>';
    return;
  }

  var html = '';
  var statusMap = { active: '正常', frozen: '冻结', disabled: '停用' };
  var statusClass = { active: 'status-active', frozen: 'status-frozen', disabled: 'status-disabled' };
  var loginMap = { true: '✅ 已登录', false: '⏳ 未登录' };

  filtered.forEach(function(a) {
    var canEdit = currentRole === 'city' || currentRole === 'district' || (currentRole === 'school' && a.school === currentUser.school);
    html += '<tr>' +
      '<td><strong>' + (a.name || '—') + '</strong></td>' +
      '<td style="font-family:monospace;font-size:12px;">' + (a.idCard || '—') + '</td>' +
      '<td>' + (a.phone || '<span style="color:var(--text-light);font-size:11px;">未绑定</span>') + '</td>' +
      '<td>' + (a.school || '—') + '</td>' +
      '<td><span style="font-size:12px;color:var(--text-secondary);">' + (a.entryMethod || '—') + '</span></td>' +
      '<td><span class="status-tag ' + (statusClass[a.status] || '') + '">' + (statusMap[a.status] || a.status) + '</span></td>' +
      '<td style="font-size:12px;">' + (loginMap[a.firstLogin] || '—') + '</td>' +
      '<td>' +
        '<button class="action-btn primary" onclick="showPassword(\'' + a.accountId + '\')" style="margin-right:4px;" title="查看密码">🔑</button>' +
        '<button class="action-btn" onclick="editPhone(\'' + a.accountId + '\')" style="margin-right:4px;" title="编辑手机号">📞</button>' +
        (a.status === 'frozen' && canEdit ? '<button class="action-btn success" onclick="restoreAccount(\'' + a.accountId + '\')" style="margin-right:4px;">恢复</button>' : '') +
        (a.status === 'active' && canEdit ? '<button class="action-btn danger" onclick="disableAccount(\'' + a.accountId + '\')">停用</button>' : '') +
      '</td>' +
      '</tr>';
  });
  tbody.innerHTML = html;
}

// Show password modal
function showPassword(accountId) {
  var accounts = loadAccounts();
  var a = accounts.filter(function(ac) { return ac.accountId === accountId; })[0];
  if (!a) return;
  var pwd = a.initialPassword || a.password;
  document.getElementById('modalContainer').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal-container">' +
    '<h3>🔑 账号密码</h3>' +
    '<div style="margin-bottom:16px;padding:14px;background:var(--gray-bg);border-radius:10px;">' +
    '<div style="margin-bottom:6px;"><strong style="font-size:14px;">' + a.name + '</strong> <span style="font-size:12px;color:var(--text-secondary);">（' + (a.idCard || '') + '）</span></div>' +
    '<div style="font-size:12px;color:var(--text-secondary);">登录账号：<span style="font-family:monospace;font-weight:600;color:var(--text);">' + a.idCard + '</span></div>' +
    (a.phone ? '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">备用登录：<span style="font-family:monospace;font-weight:600;color:var(--text);">' + a.phone + '</span></div>' : '') +
    '</div>' +
    '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">初始密码（请线下安全传递给教师）</div>' +
    '<div class="pwd-display" id="pwdDisplay">' + pwd + '</div>' +
    '<button class="pwd-copy-btn" onclick="copyPassword()">📋 复制密码</button>' +
    '<div class="pwd-info">⚠ 教师首次登录后需修改密码，此密码将不再可用</div>' +
    '<div class="modal-buttons"><button class="btn-cancel" onclick="closeModal()">关闭</button>' +
    '<button class="btn-confirm warning" onclick="resetPassword(\'' + accountId + '\')">重置密码</button></div>' +
    '</div></div>';
}

function copyPassword() {
  var el = document.getElementById('pwdDisplay');
  if (!el) return;
  var input = document.createElement('input');
  input.value = el.textContent;
  document.body.appendChild(input);
  input.select();
  document.execCommand('copy');
  document.body.removeChild(input);
  alert('密码已复制到剪贴板');
}

function resetPassword(accountId) {
  if (!confirm('确认重置该教师的密码？重置后账号将强制要求首次登录修改密码。')) return;
  var accounts = loadAccounts();
  for (var i = 0; i < accounts.length; i++) {
    if (accounts[i].accountId === accountId) {
      var newPwd = 'Edu@' + new Date().getFullYear();
      accounts[i].password = newPwd;
      accounts[i].initialPassword = newPwd;
      accounts[i].firstLogin = false;
      break;
    }
  }
  saveAccounts(accounts);
  document.getElementById('pwdDisplay').textContent = accounts.filter(function(a) { return a.accountId === accountId; })[0].password;
  alert('密码已重置');
  renderAccounts();
}

// Edit phone modal
function editPhone(accountId) {
  var accounts = loadAccounts();
  var a = accounts.filter(function(ac) { return ac.accountId === accountId; })[0];
  if (!a) return;
  document.getElementById('modalContainer').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal-container">' +
    '<h3>📞 编辑手机号</h3>' +
    '<div style="margin-bottom:16px;padding:12px 14px;background:var(--gray-bg);border-radius:8px;font-size:13px;">' +
    '<strong>' + a.name + '</strong> <span style="color:var(--text-secondary);">（' + a.idCard + '）</span></div>' +
    '<div class="form-group"><label>手机号</label><input id="phoneInput" value="' + (a.phone || '') + '" placeholder="输入11位手机号" maxlength="11"></div>' +
    '<div class="modal-buttons"><button class="btn-cancel" onclick="closeModal()">取消</button>' +
    '<button class="btn-confirm primary" onclick="savePhone(\'' + accountId + '\')">保存</button></div>' +
    '</div></div>';
}

function savePhone(accountId) {
  var phone = document.getElementById('phoneInput').value.trim();
  if (phone && !/^\d{11}$/.test(phone)) { alert('请输入正确的11位手机号'); return; }
  var accounts = loadAccounts();
  for (var i = 0; i < accounts.length; i++) {
    if (accounts[i].accountId === accountId) {
      accounts[i].phone = phone;
      break;
    }
  }
  saveAccounts(accounts);
  closeModal();
  renderAccounts();
}

function restoreAccount(accountId) {
  if (!confirm('确认恢复该教师账号？恢复后教师可正常登录系统。')) return;
  var accounts = loadAccounts();
  for (var i = 0; i < accounts.length; i++) {
    if (accounts[i].accountId === accountId) {
      accounts[i].status = 'active';
      accounts[i].frozenAt = null;
      accounts[i].frozenReason = null;
      accounts[i].restoredAt = new Date().toISOString();
      break;
    }
  }
  saveAccounts(accounts);
  renderAccounts();
}

function disableAccount(accountId) {
  if (!confirm('确认停用该教师账号？停用后教师无法登录系统。')) return;
  var accounts = loadAccounts();
  for (var i = 0; i < accounts.length; i++) {
    if (accounts[i].accountId === accountId) {
      accounts[i].status = 'disabled';
      break;
    }
  }
  saveAccounts(accounts);
  renderAccounts();
}

function closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
}

function showToast(msg, type) {
  type = type || '';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2500);
}

// ===== INIT =====
document.getElementById('userAvatar').textContent = SHORT[currentRole] || '管';
document.getElementById('userName').textContent = currentUser.name || '管理员';
updateRoleUI();
renderSidebar();
renderAccounts();
</script>
