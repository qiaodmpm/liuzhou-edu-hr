<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岗位晋升审核管理 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ===== TOP NAVBAR ===== */
.topnav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; transition: var(--transition); font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; display: flex; flex-direction: column; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label, .sidebar.collapsed .menu-group, .sidebar.collapsed .menu-badge, .sidebar.collapsed .role-switcher-label, .sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7); transition: var(--transition); position: relative; text-decoration: none; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN ===== */
.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px; min-height: calc(100vh - 56px); transition: margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.page-header-left h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-header-left .subtitle { font-size: 12px; color: var(--text-light); }
.page-header-right { display: flex; gap: 10px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--transition); border: 1px solid transparent; font-family: inherit; text-decoration: none; }
.btn-primary { background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); color: #fff; }
.btn-primary:hover { box-shadow: 0 4px 12px rgba(30,64,175,0.3); transform: translateY(-1px); }
.btn-outline { background: #fff; color: var(--primary); border-color: var(--border); }
.btn-outline:hover { border-color: var(--primary); background: var(--primary-light); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-outline-sm { padding: 4px 12px; font-size: 12px; background: #fff; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: inherit; }
.btn-outline-sm:hover { background: var(--gray-bg); }

/* ===== SCHOOL GROUP ACCORDION ===== */
.school-group { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); margin-bottom: 12px; overflow: hidden; }
.school-group-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; transition: var(--transition); user-select: none; }
.school-group-header:hover { background: #FAFBFC; }
.school-group-header .sg-left { display: flex; align-items: center; gap: 10px; }
.school-group-header .expand-icon { transition: transform var(--transition); font-size: 12px; color: var(--text-light); }
.school-group-header.open .expand-icon { transform: rotate(90deg); }
.school-group-name { font-size: 14px; font-weight: 600; color: var(--text); }
.school-group-count { font-size: 12px; color: var(--text-secondary); background: var(--gray-bg); padding: 2px 10px; border-radius: 10px; }
.school-group-body { display: none; padding: 0 18px 16px; }
.school-group-header.open + .school-group-body { display: block; }

.batch-summary-card { background: #FAFBFC; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
.batch-summary-card .summary-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-weight: 600; font-size: 13px; color: var(--text); }
.batch-summary-card .summary-stats { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.batch-summary-card .summary-stats .stat-item strong { color: var(--text); }
.batch-summary-card .summary-types { display: flex; gap: 6px; margin-bottom: 10px; }
.batch-summary-card .type-tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; background: #EFF6FF; color: var(--primary); }
.batch-summary-card .summary-actions { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
.batch-summary-card .summary-actions .action-link { font-size: 12px; }

/* Status filter buttons */
.status-filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.status-fbtn { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition); border: 1px solid var(--border); background: #fff; color: var(--text-secondary); font-family: inherit; }
.status-fbtn:hover { border-color: var(--accent); color: var(--primary); }
.status-fbtn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Filter bar */
.filter-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.filter-bar select, .filter-bar input { padding: 6px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; outline: none; }
.filter-bar select:focus, .filter-bar input:focus { border-color: var(--accent); }
.filter-bar input { width: 150px; }

/* Table */
.table-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.list-table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
.list-table th { padding: 10px 12px; text-align: center; font-weight: 600; font-size: 11px; color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
.list-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: center; }
.list-table tr:last-child td { border-bottom: none; }
.list-table tr:hover { background: #FAFBFC; }
.list-table .col-id { color: var(--primary); font-weight: 500; }
.list-table .col-name { text-align: left; font-weight: 500; }
.status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.status-badge.pending { background: #FEF3C7; color: #92400E; }
.status-badge.approved { background: #D1FAE5; color: #065F46; }
.status-badge.rejected { background: #FEE2E2; color: #991B1B; }
.status-badge.review { background: #DBEAFE; color: #1E40AF; }
.status-badge.completed { background: #E0E7FF; color: #3730A3; }
.action-link { font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: none; white-space: nowrap; }
.action-link:hover { text-decoration: underline; }
.action-links { display: flex; gap: 8px; justify-content: center; }

/* Category badge */
.cat-badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; margin-left: 6px; }
.cat-badge.district { background: #DBEAFE; color: #1E40AF; }
.cat-badge.city { background: #FEF3C7; color: #92400E; }

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state .empty-text { font-size: 14px; margin-bottom: 16px; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 520px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
.modal-wide { width: 960px; }
.modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { cursor: pointer; color: var(--text-light); font-size: 20px; padding: 4px; border: none; background: none; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-body .form-group { margin-bottom: 16px; }
.modal-body .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
.modal-body .form-group input, .modal-body .form-group select, .modal-body .form-group textarea { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; outline: none; }
.modal-body .form-group input:focus, .modal-body .form-group select:focus, .modal-body .form-group textarea:focus { border-color: var(--accent); }
.modal-body .form-group textarea { resize: vertical; min-height: 80px; }
.modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.modal-footer .btn-cancel { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); padding: 8px 18px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; }
.modal-footer .btn-cancel:hover { border-color: var(--text-light); }

/* Level tags */
.level-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.level-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; background: var(--gray-bg); color: var(--text-secondary); }

/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease; box-shadow: var(--shadow-lg); }
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>

function loadRecords() {

  localStorage.setItem('promote_records', JSON.stringify(DEMO_RECORDS));
  return JSON.parse(JSON.stringify(DEMO_RECORDS));
}
function saveRecords(r) { localStorage.setItem('promote_records', JSON.stringify(r)); }

function resetDemoData() {
  localStorage.removeItem('promote_records');
  localStorage.removeItem('promote_batches');
  localStorage.removeItem('promote_seq');
  location.reload();
}

// ===== PERMISSION =====
function getPermittedRecords() {
  var records = loadRecords();
  if (currentRole === 'district') {
    return records.filter(function(r) { return r.schoolCategory === '鱼峰区属'; });
  }
  return records;
}

function canAudit(record) {
  if (currentRole === 'district') return record.schoolCategory === '鱼峰区属';
  if (currentRole === 'city') return record.schoolCategory === '市直属';
  return false;
}

// ===== UNSUBMITTED SCHOOLS =====
function getUnsubmittedSchools() {
  var allRecords = loadRecords();
  var unsubmitted = allRecords.filter(function(r) { return r.status === 'first_approved'; });
  if (yearFilter !== 'all') {
    unsubmitted = unsubmitted.filter(function(r) { return (r.submitTime || '').substring(0, 4) === yearFilter; });
  }
  if (currentRole === 'district') {
    unsubmitted = unsubmitted.filter(function(r) { return r.schoolCategory === '鱼峰区属'; });
  }
  var schoolMap = {};
  unsubmitted.forEach(function(r) {
    if (!schoolMap[r.schoolName]) {
      schoolMap[r.schoolName] = { schoolName: r.schoolName, category: r.schoolCategory, count: 0, records: [] };
    }
    schoolMap[r.schoolName].count++;
    schoolMap[r.schoolName].records.push(r);
  });
  return Object.values(schoolMap);
}

// ===== REMINDERS =====
function loadReminders() {
  var s = localStorage.getItem('promote_reminders');
  if (s) { try { return JSON.parse(s); } catch(e) {} }
  return {};
}
function saveReminders(r) { localStorage.setItem('promote_reminders', JSON.stringify(r)); }

function canRemind(schoolName) {
  var reminders = loadReminders();
  var lastRemind = reminders[schoolName];
  if (!lastRemind) return true;
  var today = new Date().toISOString().substring(0, 10);
  return lastRemind !== today;
}

function getLastRemindTime(schoolName) {
  var reminders = loadReminders();
  return reminders[schoolName] || null;
}

function remindSchool(schoolName) {
  if (!canRemind(schoolName)) {
    showToast('今天已提醒过该校，请明天再试', 'warning');
    return;
  }
  var c = '<div class="modal-header"><h3>提醒申报</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  c += '<div class="modal-body"><p style="font-size:14px;">确认提醒「' + schoolName + '」提交申报材料？</p><p style="font-size:12px;color:var(--text-light);margin-top:8px;">该校有一审通过但尚未提交至主管部门的申报记录，提醒后学校管理员将收到通知。每个学校每天最多提醒一次。</p></div>';
  c += '<div class="modal-footer"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doRemindSchool(\'' + schoolName.replace(/'/g,"\\'") + '\')">确认提醒</button></div>';
  openModal(c);
}

function doRemindSchool(schoolName) {
  var reminders = loadReminders();
  var today = new Date().toISOString().substring(0, 10);
  reminders[schoolName] = today;
  saveReminders(reminders);
  closeModal();
  showToast('已提醒「' + schoolName + '」提交申报材料', 'success');
  renderMain();
}

function renderUnsubmittedView(schools) {
  if (schools.length === 0) {
    return '<div class="table-card"><div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无未提交的学校</div></div></div>';
  }
  var h = '<div class="table-card"><div class="table-scroll"><table class="list-table"><thead><tr>';
  h += '<th>学校名称</th><th>归属</th><th>未提交记录数</th><th>最近提醒时间</th><th>操作</th>';
  h += '</tr></thead><tbody>';
  schools.forEach(function(s) {
    var catCls = s.category === '市直属' ? 'city' : 'district';
    var lastRemind = getLastRemindTime(s.schoolName);
    h += '<tr>';
    h += '<td class="col-name">' + s.schoolName + '</td>';
    h += '<td><span class="cat-badge ' + catCls + '">' + (s.category||'—') + '</span></td>';
    h += '<td><strong>' + s.count + '</strong> 条</td>';
    h += '<td>' + (lastRemind ? lastRemind.substring(0, 10) : '从未提醒') + '</td>';

      h += '<button class="btn btn-outline btn-sm" onclick="remindSchool(\'' + s.schoolName.replace(/'/g,"\\'") + '\')">提醒申报</button>';

    }
    h += '</td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

function getFilteredRecords() {
  var records = getPermittedRecords();
  if (yearFilter !== 'all') {
    records = records.filter(function(r) { return (r.submitTime || '').substring(0, 4) === yearFilter; });

  if (currentStatusFilter === 'pending') {

function getAvailableYears() {

// ===== SCHOOL GROUP RENDERING =====
function getSchoolBatchGroups(records) {
  var groups = {};
  records.forEach(function(r) {
    var sn = r.schoolName || '未知学校';
    var bi = r.batchId || 'unknown';
    var key = sn + '|' + bi;
    if (!groups[key]) {
      groups[key] = {
        schoolName: sn,
        batchId: bi,
        batchName: r.batchName || '',
        category: r.schoolCategory || '',
        records: [],
        statusCounts: {},
        typeCounts: { mgmt: 0, prof: 0, labor: 0 }
      };
    }
    var g = groups[key];
    g.records.push(r);
    var st = r.status || 'unknown';
    g.statusCounts[st] = (g.statusCounts[st] || 0) + 1;
    var pt = r.promotionType || '';
    if (pt.indexOf('mgmt') >= 0 || pt === 'manage') g.typeCounts.mgmt++;
    else if (pt.indexOf('prof') >= 0 || pt === 'professional') g.typeCounts.prof++;
    else if (pt.indexOf('labor') >= 0 || pt === 'skill' || pt.indexOf('工勤') >= 0) g.typeCounts.labor++;
  });
  return Object.values(groups).sort(function(a, b) {
    return (a.schoolName || '').localeCompare(b.schoolName || '', 'zh-CN');
  });
}

function getStatusCounts(records) {
  return {
    all: records.length,
    pending: records.filter(function(r) {
      var s = r.status;
      return s === 'pending_school' || s === 'first_approved' || s === 'pending_second' || s === 'pending_third';
    }).length,
    completed: records.filter(function(r) { return r.status === 'completed'; }).length,
    rejected: records.filter(function(r) { return r.status === 'first_rejected' || r.status === 'second_rejected' || r.status === 'third_rejected'; }).length
  };
}

  var groups = getSchoolBatchGroups(records);

    var hasPendingSecond = g.statusCounts['pending_second'] > 0;

    var statusLabels = { pending_first: '待一审', first_approved: '一审通过', first_rejected: '一审驳回', pending_second: '待二审', second_approved: '二审通过', second_rejected: '二审驳回', pending_third: '待三审', third_rejected: '三审驳回', completed: '已完成' };
    var typeNames = { mgmt: '管理岗', prof: '专技岗', labor: '工勤岗' };
    var statusParts = [];
    Object.keys(statusLabels).forEach(function(k) {
      if (g.statusCounts[k]) statusParts.push(statusLabels[k] + ' ' + g.statusCounts[k]);
    });
    var typeParts = [];
    Object.keys(typeNames).forEach(function(k) {
      if (g.typeCounts[k]) typeParts.push(typeNames[k] + ' ' + g.typeCounts[k] + '人');
    });

    h += '<div class="school-group">';
    h += '<div class="school-group-header open" onclick="toggleSchoolGroup(this)">';

    h += '<span class="school-group-name">' + g.schoolName + '</span>';
    if (g.category) h += '<span class="cat-badge ' + (g.category === '鱼峰区属' ? 'district' : 'city') + '">' + g.category + '</span>';

    }
    h += '</div>';
    h += '</div>';
    h += '</div></div>';
  });
  return h;

function viewSchoolDetail(schoolName, batchId) {
  var records = getPermittedRecords();
  if (yearFilter !== 'all') {
    records = records.filter(function(r) { return (r.submitTime || '').substring(0, 4) === yearFilter; });

    records = records.filter(function(r) { return r.status === currentStatusFilter; });
  }
  var groups = getSchoolBatchGroups(records);
  var group = null;
  for (var i = 0; i < groups.length; i++) {
    if (groups[i].schoolName === schoolName && groups[i].batchId === batchId) {
      group = groups[i]; break;
    }
  }
  if (!group || group.records.length === 0) {
    showToast('未找到申报记录', 'warning'); return;
  }

  var statusLabels = {
    pending_first: '待一审', first_approved: '一审通过', first_rejected: '一审驳回',
    pending_second: '待二审', second_approved: '二审通过', second_rejected: '二审驳回',
    pending_third: '待三审', third_rejected: '三审驳回', completed: '已完成'
  };

  var rows = '';
  group.records.forEach(function(r, idx) {

    var targetFull = (catLabel + (r.targetLevel || '')) || '—';

    var statusCls = '';

    rows += '<tr>';
    rows += '<td>' + (idx + 1) + '</td>';
    rows += '<td class="col-name">' + escapeHtml(r.teacherName) + '</td>';
    rows += '<td>' + (r.gender || '—') + '</td>';
    rows += '<td>' + (r.ethnicity || '—') + '</td>';
    rows += '<td>' + (r.birthDate || '—') + '</td>';
    rows += '<td>' + (r.workStartTime || '—') + '</td>';
    rows += '<td>' + (r.education || '—') + '</td>';
    rows += '<td>' + (r.graduateTime || '—') + '</td>';
    rows += '<td>' + (r.currentPost || '—') + '</td>';
    rows += '<td>' + (r.appointTime || '—') + '</td>';
    rows += '<td>' + escapeHtml(targetFull) + '</td>';
    rows += '<td>' + transferLabel + '</td>';
    rows += '<td><span class="status-badge ' + statusCls + '">' + statusLabel + '</span></td>';
    rows += '<td><a href="promote-detail.html?id=' + r.id + '&role=' + currentRole + '" style="color:var(--primary);text-decoration:none;font-weight:500;">查看详情</a></td>';
    rows += '</tr>';
  });

  var c = '<div class="modal-header"><h3>申报详情</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  c += '<div class="modal-body" style="padding:4px 24px 20px;">';
  c += '<div style="margin-bottom:16px;padding:12px 16px;background:var(--bg);border-radius:8px;">';
  c += '<span style="font-weight:600;font-size:14px;">' + escapeHtml(schoolName) + '</span>';
  c += '<span style="margin-left:12px;font-size:12px;color:var(--text-secondary);">批次：' + escapeHtml(group.batchName || '—') + '</span>';
  c += '<span style="margin-left:12px;font-size:12px;color:var(--text-light);">编号：' + escapeHtml(batchId) + '</span>';
  c += '<span style="margin-left:12px;font-size:12px;color:var(--text-secondary);">共 <strong>' + group.records.length + '</strong> 人</span>';
  c += '</div>';
  c += '<div class="table-scroll"><table class="list-table">';
  c += '<thead><tr>';
  c += '<th style="width:40px;">序号</th><th>姓名</th><th>性别</th><th>民族</th><th>出生年月</th><th>参加工作时间</th><th>学历</th><th>毕业时间</th><th>现聘岗位（职务）</th><th>现聘岗位时间</th><th>拟聘岗位的类别等级（职务）</th><th>晋升类型</th><th>状态</th><th style="width:80px;">操作</th>';
  c += '</tr></thead><tbody>';
  c += rows;

  openModal(c, 'modal-wide');

function doExport() {
  var areaFilter = document.getElementById('exportArea').value;
  var schoolFilter = document.getElementById('exportSchool').value;
  var categoryFilter = document.getElementById('exportCategory').value;

  var checkedCbs = document.querySelectorAll('.export-status-cb:checked');
  var statusFilters = [];
  checkedCbs.forEach(function(cb) { statusFilters.push(cb.value); });

  var records = getPermittedRecords();

  if (areaFilter !== 'all') {
    records = records.filter(function(r) { return r.schoolCategory === areaFilter; });
  }
  if (statusFilters.length > 0) {
    records = records.filter(function(r) { return statusFilters.indexOf(r.status) >= 0; });
  }
  if (schoolFilter !== 'all') {
    records = records.filter(function(r) { return r.schoolName === schoolFilter; });
  }
  if (categoryFilter !== 'all') {
    records = records.filter(function(r) {
      var cat = getRecordCategory(r);
      return cat === CATEGORY_MAP[categoryFilter];
    });
  }

  if (records.length === 0) { showToast('没有符合条件的数据，请调整筛选条件', 'warning'); return; }

  var headers = ['申请编号', '批次名称', '教师姓名', '学校名称', '所属区域', '岗位类别', '原岗位等级', '目标岗位等级', '状态', '提交时间'];
  var rows = [headers.join(',')];

  records.forEach(function(r) {
    var row = [
      r.id,
      '"' + (r.batchName || '').replace(/"/g, '""') + '"',
      '"' + r.teacherName.replace(/"/g, '""') + '"',
      '"' + (r.schoolName || '').replace(/"/g, '""') + '"',
      r.schoolCategory || '',
      getRecordCategory(r),
      r.fromLevel || '',
      r.targetLevel || '',
      STATUS_MAP[r.status] || r.status,
      r.submitTime || ''
    ];
    rows.push(row.join(','));
  });

  var csv = '﻿' + rows.join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '岗位晋升数据导出_' + new Date().toISOString().substring(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  closeModal();
  showToast('已导出 ' + records.length + ' 条记录', 'success');
}

// ===== URL PARAMS & INIT =====
function getUrlParam(name) {
  var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}

function init() {
  var roleParam = getUrlParam('role');
  if (roleParam === 'city' || roleParam === 'district') currentRole = roleParam;
  renderSidebar();
  renderMain();
}
init();
</script>
