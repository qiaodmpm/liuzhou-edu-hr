<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>审核岗位晋升申请 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* Two-column layout */
.audit-layout { display: flex; gap: 24px; }
.audit-main { flex: 1; min-width: 0; }
.audit-sidebar { width: 360px; flex-shrink: 0; }

/* Page header */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }

/* Status badge */
.status-stamp {
  display: inline-block; padding: 6px 16px; border: 2px solid;
  transform: rotate(-5deg); font-weight: 700; font-size: 14px; background: #fff;
}
.status-stamp.pending { color: #F59E0B; border-color: #F59E0B; }
.status-stamp.approved { color: #10B981; border-color: #10B981; }
.status-stamp.rejected { color: #EF4444; border-color: #EF4444; }
.status-stamp.completed { color: #3730A3; border-color: #3730A3; }
.status-stamp.in-review { color: #2563EB; border-color: #2563EB; }
.status-stamp.modify { color: #1E40AF; border-color: #1E40AF; }

.audit-bottom-bar {
  background: #fff; border: 2px solid var(--primary);
  border-radius: var(--radius-lg); padding: 16px 20px;
  display: flex; gap: 12px; align-items: center; position: relative; z-index: 1;
  margin-top: 20px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.08);
}
.audit-bottom-bar .btn-approve {
  width: auto; padding: 12px 32px; font-size: 14px; font-weight: 600;
  border: none; border-radius: 6px; background: var(--success); color: #fff;
  cursor: pointer; font-family: inherit; transition: var(--transition);
}
.audit-bottom-bar .btn-approve:hover { background: #059669; }
.audit-bottom-bar .btn-reject {
  width: auto; padding: 12px 32px; font-size: 14px; font-weight: 600;
  border: 1px solid var(--danger); border-radius: 6px;
  background: #fff; color: var(--danger); cursor: pointer;
  font-family: inherit; transition: var(--transition);
}
.audit-bottom-bar .btn-reject:hover { background: #FEF2F2; }
.audit-bottom-bar .opinion-hint {
  flex: 1; font-size: 12px; color: var(--text-light);
}

/* Progress bar */
.progress-bar {
  display: flex; align-items: center; padding: 20px 24px;
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto;
}
.step-wrapper { display: flex; align-items: center; flex: 1; min-width: 0; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; min-width: 80px; }
.step-dot {
  width: 28px; height: 28px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
  border: 2px solid var(--border); color: var(--text-light); background: #fff;
  transition: var(--transition);
}
.step.done .step-dot { background: var(--success); color: #fff; border-color: var(--success); }
.step.current .step-dot { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30,64,175,0.12); }
.step-text { font-size: 11px; color: var(--text-light); white-space: nowrap; }
.step.current .step-text { color: var(--primary); font-weight: 500; }
.step.done .step-text { color: var(--success); }
.step-line { flex: 1; height: 2px; background: var(--border); margin: 0 4px 22px; min-width: 20px; }
.step-line.done { background: var(--success); }

/* Form cards (editable) */
.form-card {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px;
}
.form-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.form-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.form-item { display: flex; flex-direction: column; gap: 4px; }
.form-item.full { grid-column: 1 / -1; }
.form-item .label { font-size: 11px; color: var(--text-secondary); }
.form-item input, .form-item select {
  padding: 7px 10px; font-size: 13px; border: 1px solid var(--border);
  border-radius: 4px; font-family: inherit; background: #fff; color: var(--text);
  transition: var(--transition);
}
.form-item input:focus, .form-item select:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.1);
}
.form-item input.readonly, .form-item select.readonly {
  background: var(--gray-bg); color: var(--text-secondary); cursor: default;
}
.form-item input.readonly:focus, .form-item select.readonly:focus {
  border-color: var(--border); box-shadow: none;
}
.form-item .form-value {
  padding: 7px 10px; font-size: 13px; background: var(--gray-bg);
  border-radius: 4px; color: var(--text); border: 1px solid var(--border);
}

/* Attachments */
.attachment-list { margin-top: 8px; }
.attachment-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--gray-bg); border-radius: 6px;
  margin-bottom: 6px; font-size: 12px;
}
.attachment-item .file-icon { font-size: 16px; flex-shrink: 0; }
.attachment-item .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment-item .file-size { color: var(--text-light); flex-shrink: 0; }
.attachment-item .file-download {
  color: var(--primary); cursor: pointer; text-decoration: none; flex-shrink: 0;
}
.attachment-item .file-download:hover { text-decoration: underline; }
.attachment-empty { font-size: 12px; color: var(--text-light); padding: 8px 0; }

/* Upload area */
.upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 30px; text-align: center; cursor: pointer; transition: var(--transition);
  margin-top: 12px;
}
.upload-area:hover { border-color: var(--accent); background: var(--primary-light); }
.upload-area .upload-text { font-size: 13px; color: var(--text-secondary); }
.upload-area .upload-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }

.school-upload-list { margin-top: 10px; }
.school-upload-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; background: #EFF6FF; border: 1px solid #BFDBFE;
  border-radius: 6px; margin-bottom: 4px; font-size: 12px;
}
.school-upload-item .remove-file {
  color: var(--danger); cursor: pointer; font-size: 14px; font-weight: 700; margin-left: auto;
}
.school-upload-item .remove-file:hover { opacity: 0.7; }


/* ===== BORROW BANNER ===== */
.borrow-banner {
  margin-top: 8px; padding: 10px 14px;
  background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 6px;
  font-size: 12px; color: #92400E; line-height: 1.5;
}
/* Quota hint */
.quota-hint {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; background: #FFF7ED; border: 1px solid #FED7AA;
  border-radius: 6px; font-size: 12px; color: #92400E; margin-top: 12px;
}
.quota-hint.danger { background: #FEF2F2; border-color: #FECACA; color: #991B1B; }
.quota-hint.success { background: #ECFDF5; border-color: #A7F3D0; color: #065F46; }
.quota-hint.exempt { background: #EFF6FF; border-color: #BFDBFE; color: #1E40AF; }

/* Sidebar sections */
.sidebar-section {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px;
}
.sidebar-section h4 { font-size: 13px; font-weight: 600; margin-bottom: 14px; }

/* Timeline */
.timeline { position: relative; padding-left: 20px; }
.timeline::before {
  content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px;
  width: 2px; background: var(--border);
}
.timeline-item { position: relative; padding-bottom: 16px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before {
  content: ''; position: absolute; left: -17px; top: 4px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--border);
}
.timeline-item.current::before { background: var(--primary); }
.timeline-item .tl-time { font-size: 11px; color: var(--text-light); }
.timeline-item .tl-action { font-size: 12px; font-weight: 500; margin-top: 2px; }
.timeline-item .tl-operator { font-size: 11px; color: var(--text-secondary); }
.timeline-item .tl-opinion { font-size: 11px; color: var(--text-secondary); font-style: italic; margin-top: 2px; }

/* Action buttons */
.action-section { margin-top: 16px; }
.btn-save {
  width: 100%; padding: 12px; font-size: 14px; font-weight: 500;
  border: none; border-radius: 6px; background: var(--primary);
  color: #fff; cursor: pointer; font-family: inherit; transition: var(--transition);
}
.btn-save:hover { background: var(--primary-dark); }

/* Back link */
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  margin-bottom: 16px; font-size: 12px; color: var(--text-secondary);
  cursor: pointer;
}
.back-link:hover { color: var(--primary); }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.modal-container {
  background: #fff; border-radius: var(--radius-lg); padding: 28px;
  width: 480px; max-width: 90vw; box-shadow: var(--shadow-lg);
}
.modal-container h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
.form-group textarea, .form-group input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 14px; font-family: inherit; resize: vertical;
}
.form-group textarea:focus, .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel {
  padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px;
  border: 1px solid var(--border); background: #fff; color: var(--text-secondary); cursor: pointer;
}
.btn-cancel:hover { background: var(--gray-bg); }
.btn-confirm {
  padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px;
  border: none; color: #fff; cursor: pointer; background: var(--success);
}
.btn-confirm:hover { background: #059669; }
.btn-confirm.danger { background: var(--danger); }
.btn-confirm.danger:hover { background: #DC2626; }
.btn-confirm.primary { background: var(--primary); }
.btn-confirm.primary:hover { background: var(--primary-dark); }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Review comment textarea */
.review-comment textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical;
  min-height: 80px;
}
.review-comment textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

/* Responsive */
@media (max-width: 1024px) {
  .audit-layout { flex-direction: column; }
  .audit-sidebar { width: 100%; }
  .form-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">

</nav>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="role-switcher" id="roleSwitcher">
    <div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options">
      <button class="role-switch-btn" data-role="city" onclick="switchRole('city')"><span class="role-switch-dot city"></span><span class="role-switcher-name">市管理员</span></button>

// ===== UTILS =====
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + 'KB';
  return (bytes/1048576).toFixed(1) + 'MB';
}

function showToast(msg, type) {
  type = type || '';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function() { el.remove(); }, 2000);
}

function now() {
  return new Date().toISOString().replace('T',' ').substring(0,19);
}

  var records = loadRecords();

    return lv === levelNum
      && r.status !== "completed"
      && r.status !== "first_rejected" && r.status !== "second_rejected"
      && r.status !== "hr_rejected" ;
  }).length;
  var borrowedOut = records.filter(function(r) {
    return r.borrowFromLevel && parseInt((r.borrowFromLevel.replace("级", ""))) === levelNum
      && r.status !== "completed"
      && r.status !== "first_rejected" && r.status !== "second_rejected"
      && r.status !== "hr_rejected" ;
  }).length;
  return {
    authorized: q.authorized,
    employed: q.employed,
    pending: pending,
    borrowedOut: borrowedOut,
    remaining: q.authorized - q.employed - pending - borrowedOut
  };
}

function getBorrowOptions(schoolName, targetLevelNum) {
  var tier = LEVEL_TIER[targetLevelNum];
  var tierIdx = TIER_ORDER.indexOf(tier);
  var options = [];
  if (targetLevelNum <= 3) return options;
  var recs = loadRecords();
  for (var lv = targetLevelNum - 1; lv >= 1; lv--) {
    var lvTier = LEVEL_TIER[lv];
    var lvTierIdx = TIER_ORDER.indexOf(lvTier);
    var quota = getLevelQuota(schoolName, lv);
    if (!quota || quota.remaining <= 0) continue;
    if (tier === "mid" && lvTier === "vice_senior") continue;
    if (tier === "junior" && (lvTier === "vice_senior" || lvTier === "senior")) continue;
    if (tier === "mid" && lvTier === "senior") continue;
    options.push({ level: lv, label: NUM_CN_MAP[lv] + "级", tier: TIER_LABEL[lvTier], remaining: quota.remaining });
  }
  return options;
}

// ===== DATA PERSISTENCE =====
function loadRecords() {
  try {
    var stored = JSON.parse(localStorage.getItem('promote_records') || '[]');
    var ids = {};
    stored.forEach(function(r) { ids[r.id] = true; });
    var merged = stored.slice();
    DEMO_RECORDS.forEach(function(r) { if (!ids[r.id]) { merged.push(r); ids[r.id] = true; } });
    return merged;
  } catch(e) {
    localStorage.removeItem('promote_records');
    return JSON.parse(JSON.stringify(DEMO_RECORDS));
  }
}

function saveRecords(records) {
  localStorage.setItem('promote_records', JSON.stringify(records));
}

function findRecord(id) {
  return loadRecords().find(function(r) { return r.id === id; }) || null;
}

function renderProgress(currentStep) {
  var h = '';
  for (var i = 0; i < PROGRESS_STEPS.length; i++) {
    var step = PROGRESS_STEPS[i];
    var state = 'pending';
    var display = (i + 1);
    if (i < currentStep) { state = 'done'; display = '&#10003;'; }
    else if (i === currentStep) { state = 'current'; }

    h += '<span class="step ' + state + '">';
    h += '<span class="step-dot">' + display + '</span>';
    h += '<span class="step-text">' + step.label + '</span>';
    h += '</span>';
    if (i < PROGRESS_STEPS.length - 1) {
      var lineState = i < currentStep ? 'done' : '';
      h += '<span class="step-line ' + lineState + '"></span>';
    }
  }
  return h;
}

      '<div class="form-card" style="text-align:center;padding:60px;">' +
      '<div style="font-size:48px;margin-bottom:16px;">&#x1F4CB;</div>' +
      '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">未找到晋升申请记录</div>' +
      '<div style="color:var(--text-light);">请检查申请编号是否正确</div></div>';
    return;
  }

  var r = currentRecord;
  var statusLabel = STATUS_MAP[r.status] || r.status;
  var currentStep = 1; // school first audit

  var pageTitle = isModifyMode ? '修改教师资料' : '审核岗位晋升申请';
  var stampCls = isModifyMode ? 'modify' : getStatusStampClass(r.status);

  var html = '<div class="back-link" onclick="goBack()">&#8592; 返回列表</div>';

  // Page header
  html += '<div class="page-header">';
  html += '<div>';
  html += '<h1>' + pageTitle + ' — <span style="color:var(--primary);">' + escapeHtml(r.teacherName) + '</span></h1>';
  html += '<div class="subtitle">申请编号：' + r.id + ' | 提交时间：' + (r.submitTime ? r.submitTime.substring(0, 16) : '') + ' | 批次：' + escapeHtml(r.batchName) + '</div>';
  html += '</div>';
  html += '<span class="status-stamp ' + stampCls + '">' + (isModifyMode ? '修改模式' : statusLabel) + '</span>';
  html += '</div>';

  // Progress bar
  html += '<div class="progress-bar"><div class="step-wrapper">' + renderProgress(currentStep) + '</div></div>';

  // Two-column layout
  html += '<div class="audit-layout">';

  // Left main column
  html += '<div class="audit-main">';

  // Form based on promotion type
  if (r.promotionType === 'senior_3' && r.senior3Form) {
    html += renderSenior3Form(r);
  } else {
    html += renderRegularForm(r);
  }

  // Attachments
  html += renderAttachments(r);

  // School uploads
  html += renderSchoolUploads(r);

  // Quota hint (only for regular, not senior_3)
  if (r.promotionType !== 'senior_3') {
    html += renderQuotaHint(r);
  }

  html += '</div>'; // .audit-main

  // Right sidebar
  html += '<div class="audit-sidebar">';
  html += renderTimeline(r);
  if (isModifyMode) {
    html += renderActionSidebar(r);
  }
  html += '</div>'; // .audit-sidebar

  html += '</div>'; // .audit-layout

  // Bottom action bar (only in audit mode, not modify mode)
  if (!isModifyMode) {
    html += '<div class="audit-bottom-bar">';
    html += '<span class="opinion-hint">审核意见将在点击按钮后填写</span>';
    html += '<button type="button" class="btn-reject" onclick="doRejectNoPromotion()">不予晋升</button>';
    html += '<button type="button" class="btn-approve" onclick="showApproveModal()">审核通过</button>';
    html += '</div>';
  }

  document.getElementById('mainContent').innerHTML = html;
}

// ===== FORM FIELD UPDATES =====
function updateRecordField(field, value) {
  if (!currentRecord) return;
  // Handle special target fields
  if (field === '_targetCategory') {
    if (value.indexOf('管理') >= 0) currentRecord.transferCategory = 'mgmt';
    else if (value.indexOf('工勤') >= 0) currentRecord.transferCategory = 'labor';
    else currentRecord.transferCategory = 'prof';
    return;
  }
  if (field === '_targetLevel') {
    currentRecord.targetLevel = value;
    return;
  }
  currentRecord[field] = value;
}

function updateAssessment(index, value) {
  if (!currentRecord) return;
  if (!currentRecord.assessments) currentRecord.assessments = [];
  currentRecord.assessments[index] = value;
}

function updateSenior3Field(field, value) {
  if (!currentRecord || !currentRecord.senior3Form) return;
  currentRecord.senior3Form[field] = value;
}

function deleteAttachment(idx) {
  if (!currentRecord) return;
  currentRecord.attachments.splice(idx, 1);
  var records = loadRecords();
  var ri = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (ri >= 0) records[ri].attachments = currentRecord.attachments;
  saveRecords(records);
  renderPage();
  showToast('附件已删除');
}

// ===== FILE UPLOAD (SIMULATED) =====
function triggerUpload() {
  // Simulated file upload
  var demoFiles = [
    { name: '补充公示材料.pdf', size: 142000 },
    { name: '学校推荐意见表.pdf', size: 98000 },
    { name: '教师考核记录.pdf', size: 176000 }
  ];
  var randomFile = demoFiles[Math.floor(Math.random() * demoFiles.length)];
  // Check for duplicate
  var existingNames = (currentRecord.schoolAttachments || []).map(function(f) { return f.name; })
    .concat(schoolFiles.map(function(f) { return f.name; }));
  if (existingNames.indexOf(randomFile.name) >= 0) {
    showToast('该文件已存在', 'warning');
    return;
  }
  schoolFiles.push(randomFile);
  showToast('文件已添加：' + randomFile.name, 'success');
  renderPage();
}

function removeNewFile(index) {
  schoolFiles.splice(index, 1);
  renderPage();
}

function removeSchoolAttachment(index) {
  if (!currentRecord || !currentRecord.schoolAttachments) return;
  currentRecord.schoolAttachments.splice(index, 1);
  renderPage();
}

// ===== AUDIT ACTIONS =====
function showApproveModal() {
  if (!currentRecord) return;

  var modalHtml =
    '<div class="modal-overlay" id="approveModal">' +
      '<div class="modal-container">' +
        '<h3>审核通过确认</h3>' +
        '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">' +
          '确认通过「' + escapeHtml(currentRecord.teacherName) + '」的晋升申请？' +
        '</div>' +
        '<div class="form-group">' +
          '<label>审核意见（选填）</label>' +
          '<textarea id="approveOpinion" rows="3" placeholder="可选填审核意见"></textarea>' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelApprove">取消</button>' +
          '<button class="btn-confirm" id="confirmApprove">确认通过</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('cancelApprove').onclick = function() { document.getElementById('approveModal').remove(); };
  document.getElementById('confirmApprove').onclick = doApprove;
}

function doApprove() {
  var approveEl = document.getElementById('approveModal');
  if (approveEl) approveEl.remove();
  if (!currentRecord) return;

  var records = loadRecords();
  var idx = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx === -1) { showToast('记录不存在', 'warning'); return; }

  var approverName = ROLES[currentRole].name;
  var time = now();

  // Merge school upload files
  if (schoolFiles.length > 0) {
    if (!records[idx].schoolAttachments) records[idx].schoolAttachments = [];
    schoolFiles.forEach(function(f) {
      records[idx].schoolAttachments.push(f);
    });
  }

  records[idx].status = 'first_approved';
  records[idx].firstReviewer = approverName;
  records[idx].firstReviewTime = time;
  records[idx].firstRejectReason = null;

  var opinionEl = document.getElementById('approveOpinion');
  var opinionText = opinionEl ? opinionEl.value.trim() : '';

  records[idx].timeline = records[idx].timeline || [];
  var tlEntry = { time: time, action: '学校一审通过', operator: approverName };
  if (opinionText) tlEntry.opinion = opinionText;
  records[idx].timeline.push(tlEntry);

  saveRecords(records);
  showToast('一审通过', 'success');
  setTimeout(function() { window.location.href = 'promote-list-school.html'; }, 1000);
}

function doRejectNoPromotion() {
  if (!currentRecord) return;
  if (!confirm('确认不予晋升？该教师本次晋升申请将终止，无法恢复。')) return;
  var records = loadRecords();
  var idx = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx === -1) { showToast('记录不存在', 'warning'); return; }
  var approverName = ROLES[currentRole].name;
  var time = now();
  if (schoolFiles.length > 0) {
    if (!records[idx].schoolAttachments) records[idx].schoolAttachments = [];
    schoolFiles.forEach(function(f) { records[idx].schoolAttachments.push(f); });
  }
  records[idx].status = 'first_rejected';
  records[idx].firstReviewer = approverName;
  records[idx].firstReviewTime = time;
  records[idx].firstRejectReason = '学校审核不予晋升';
  records[idx].timeline = records[idx].timeline || [];
  records[idx].timeline.push({ time: time, action: '学校不予晋升', operator: approverName, opinion: '学校审核不予晋升' });
  saveRecords(records);
  showToast('已标记为不予晋升', 'success');
  setTimeout(function() { window.location.href = 'promote-list-school.html'; }, 1000);
}

function saveModifications() {
  if (!currentRecord) return;

  var records = loadRecords();
  var idx = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx === -1) { showToast('记录不存在', 'warning'); return; }

  // Save all current record fields back to persisted record
  // Merge school upload files
  if (schoolFiles.length > 0) {
    if (!records[idx].schoolAttachments) records[idx].schoolAttachments = [];
    schoolFiles.forEach(function(f) {
      records[idx].schoolAttachments.push(f);
    });
  }

  // Save editable fields
  records[idx].teacherName = currentRecord.teacherName;
  records[idx].gender = currentRecord.gender;
  records[idx].ethnicity = currentRecord.ethnicity;
  records[idx].birthDate = currentRecord.birthDate;
  records[idx].politicalStatus = currentRecord.politicalStatus;
  records[idx].education = currentRecord.education;
  records[idx].graduateTime = currentRecord.graduateTime;
  records[idx].workStartTime = currentRecord.workStartTime;
  records[idx].currentPost = currentRecord.currentPost;
  records[idx].currentTitle = currentRecord.currentTitle;
  records[idx].appointTime = currentRecord.appointTime;
  records[idx].assessments = currentRecord.assessments;
  records[idx].senior3Form = currentRecord.senior3Form;
  records[idx].schoolAttachments = currentRecord.schoolAttachments;

  var approverName = ROLES[currentRole].name;
  var time = now();

  records[idx].status = 'first_approved';
  records[idx].firstReviewer = approverName;
  records[idx].firstReviewTime = time;

  records[idx].timeline = records[idx].timeline || [];
  records[idx].timeline.push({
    time: time,
    action: '学校修改教师资料',
    operator: approverName
  });

  saveRecords(records);
  showToast('修改已保存', 'success');
  setTimeout(function() { window.location.href = 'promote-list-school.html'; }, 1000);
}

// ===== NAVIGATION =====
function goBack() {
  window.location.href = 'promote-list-school.html';
}

// ===== SIDEBAR RENDERING =====
function renderSidebar() {
  var roleData = ROLES[currentRole];
  if (!roleData) { document.getElementById('sidebarMenu').innerHTML = ''; return; }
  var sidebar = roleData.sidebar;
  var html = '';
  (sidebar.top || []).forEach(function(item) {
    html += '<a class="menu-item" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[item.icon] || '') + '<span class="menu-label">' + item.label + '</span></a>';
  });
  (sidebar.groups || []).forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      html += '<a class="menu-item' + (item.id === 'promote' ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[MENU_ICONS[item.id] || 'file']) + '<span class="menu-label">' + item.label + '</span>' + (item.badge ? '<span class="menu-badge">' + item.badge + '</span>' : '') + '</a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'promote') { window.location.href = 'promote-list-school.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') { window.location.href = '教师入编管理（学校管理员视角）.html?role=school'; return; }
  if (id === 'exit') { window.location.href = '教师出编管理（学校管理员视角）.html?role=school'; return; }
  if (id === 'postset') { window.location.href = 'post-list-school.html'; return; }
  if (id === 'contract-entry') { var cr = (typeof currentUser!=='undefined' && currentUser) ? currentUser.role : (typeof currentRole!=='undefined'?currentRole:''); window.location.href = (cr === 'city' || cr === 'district') ? 'contract-entry-list-admin.html' : 'contract-entry-list-school.html'; return; }
  if (id === 'contract-exit') { var cr2 = (typeof currentUser!=='undefined' && currentUser) ? currentUser.role : (typeof currentRole!=='undefined'?currentRole:''); window.location.href = (cr2 === 'city' || cr2 === 'district') ? 'contract-exit-list-admin.html' : 'contract-exit-list-school.html'; return; }
  if (id === 'ledger') { var lr = (typeof currentUser!=='undefined'?currentUser.role:currentRole); window.location.href = (lr === 'city' || lr === 'district') ? 'org-ledger-admin.html' : lr === 'school' ? 'org-ledger-school.html' : 'workbench.html'; return; }


  else if (id === 'account') { window.location.href = 'account-management.html'; }

  else if (id === 'org') { window.location.href = 'org-management.html'; }
  showToast('跳转至：' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}

function switchRole(role) {
  if (role === 'school') { window.location.href = 'promote-list-school.html'; return; }
  if (role === 'city' || role === 'district') { window.location.href = 'promote-list-admin.html?role=' + role; return; }
  if (role === 'teacher') { window.location.href = 'promote-list-teacher.html'; return; }
}

function updateRoleUI() {
  var roleData = ROLES[currentRole];
  if (!roleData) return;
  document.getElementById('userAvatar').textContent = roleData.short;
  document.getElementById('userName').textContent = roleData.name;
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === currentRole);
  });
}

// ===== INIT =====
(function init() {
  var params = new URLSearchParams(window.location.search);
  var urlRole = params.get('role');
  if (urlRole === 'school' || urlRole === 'city' || urlRole === 'district') {
    currentRole = urlRole;
  }
  isModifyMode = params.get('mode') === 'modify';

  updateRoleUI();
  renderSidebar();

  // Update breadcrumb
  var bcCurrent = document.getElementById('breadcrumbCurrent');
  if (isModifyMode) {
    bcCurrent.textContent = '修改教师资料';
  }

  var recordId = params.get('id');
  if (recordId) {
    currentRecord = findRecord(recordId);
    if (!currentRecord) {
      // Could be in memory from parent page. Try the first pending_first record as fallback for demo.
      // Actually, just let renderPage show the not-found message.
    }
  } else {
    // No ID provided - show the first pending_first record for demo
    var records = loadRecords();
    currentRecord = records.find(function(r) { return r.status === 'pending_first' || r.status === 'second_rejected' || r.status === 'hr_rejected'; }) || records[0] || null;
  }

  // Initialize schoolFiles from current record's pending school attachments
  // (in a real app, these would be separated, but for the demo we merge on save)
  schoolFiles = [];

  renderPage();
})();
</script>
