<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>教师入编管理 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}

.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }

.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

.page-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
}
.page-header h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); }
.page-header-right { display: flex; gap: 8px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; font-size: 13px; font-weight: 500;
  border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition);
  border: 1px solid transparent; text-decoration: none;
}
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: #fff; color: var(--text-secondary); border-color: var(--border); }
.btn-outline:hover { background: var(--gray-bg); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-warning { background: #fff; color: #B45309; border-color: #F59E0B; }
.btn-warning:hover { background: #FFFBEB; }

/* Filters */
.filter-bar {
  display: flex; align-items: center; gap: 12px; padding: 12px 20px; flex-wrap: wrap;
}
.status-filters { display: flex; gap: 4px; }
.status-fbtn {
  padding: 6px 16px; font-size: 12px; border: 1px solid var(--border); border-radius: 20px;
  cursor: pointer; background: #fff; color: var(--text-secondary); font-family: inherit;
  transition: var(--transition); white-space: nowrap;
}
.status-fbtn:hover { border-color: var(--accent); color: var(--primary); }
.status-fbtn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.filter-select {
  padding: 6px 12px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px;
  font-family: inherit; background: #fff; color: var(--text); outline: none;
}
.filter-select:focus { border-color: var(--accent); }

/* Card */
.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  margin-bottom: 20px; overflow: hidden;
}

/* School type badge */
.school-type-badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 500;
}
.school-type-badge.city { background: #DBEAFE; color: #1E40AF; }
.school-type-badge.district { background: #FEF3C7; color: #92400E; }

/* Table */
.table-wrap { overflow-x: auto; }
.flat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.flat-table th {
  padding: 10px 14px; text-align: left; font-weight: 600; font-size: 12px;
  color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.flat-table td {
  padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text);
}
.flat-table tbody tr:hover { background: #FAFBFC; }

/* Status badges */
.status-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 12px; font-weight: 500;
}
.status-badge.pending { background: #EFF6FF; color: #1E40AF; }
.status-badge.approved { background: #ECFDF5; color: #10B981; }
.status-badge.rejected { background: #FEF2F2; color: #EF4444; }

/* Type badges */
.type-badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 500;
}
.type-badge.career { background: #DBEAFE; color: #1E40AF; }
.type-badge.control { background: #E0E7FF; color: #3730A3; }

/* Actions */
.table-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-light);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }

/* Permission hint */
.permission-hint {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--text-light); padding: 4px 8px;
  background: var(--gray-bg); border-radius: 4px;
}

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Export modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-export { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 720px; max-width: 92vw; max-height: 80vh; display: flex; flex-direction: column; }
.modal-export .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-export .modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { cursor: pointer; color: var(--text-light); font-size: 20px; padding: 4px; border: none; background: none; line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-export .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
.modal-export .modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-export .modal-footer .btn-cancel { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.modal-export .modal-footer .btn-cancel:hover { border-color: var(--text-light); }
.modal-export .modal-footer .btn-primary { background: var(--primary); color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
.modal-export .modal-footer .btn-primary:hover { background: var(--primary-dark); }
.modal-export .modal-footer .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.export-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.export-toolbar .btn-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0; }
.export-toolbar .btn-link:hover { text-decoration: underline; }
.export-count { font-size: 13px; color: var(--text-secondary); margin-left: auto; }

.export-table { width: 100%; border-collapse: collapse; }
.export-table th, .export-table td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
.export-table th { background: var(--gray-bg); font-weight: 500; color: var(--text-secondary); position: sticky; top: 0; }
.export-table td .check-wrap { display: flex; align-items: center; }
.export-table input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }
.export-table tbody tr:hover { background: var(--primary-light); }
.export-table .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.export-table .status-dot.approved { background: var(--success); }
</style>
</head>
<body>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <rect x="3" y="1" width="18" height="22" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/>
        <line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="12" y2="14"/>

      </svg>

  </div>
  <div class="topnav-right">
    <div class="topnav-bell">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

      <div class="avatar" id="userAvatar">李</div>
      <span id="userName">李振华</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="user-dropdown" id="userDropdown">
        <a href="#">个人中心</a><a href="#">修改密码</a>
        <div class="divider"></div>
        <a href="index.html" class="logout">退出登录</a>
      </div>

  </div>
</nav>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="role-switcher" id="roleSwitcher">
    <div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options">
      <button class="role-switch-btn" data-role="city" onclick="switchRole('city')"><span class="role-switch-dot city"></span><span class="role-switcher-name">市管理员</span><span style="font-size:10px;color:rgba(255,255,255,0.3);margin-left:auto;">张建国</span></button>
      <button class="role-switch-btn active" data-role="district" onclick="switchRole('district')"><span class="role-switch-dot district"></span><span class="role-switcher-name">区管理员</span><span style="font-size:10px;color:rgba(255,255,255,0.3);margin-left:auto;">李振华</span></button>
      <button class="role-switch-btn" data-role="school" onclick="switchRole('school')"><span class="role-switch-dot school"></span><span class="role-switcher-name">校管理员</span><span style="font-size:10px;color:rgba(255,255,255,0.3);margin-left:auto;">王玉兰</span></button>
      <button class="role-switch-btn" data-role="teacher" onclick="switchRole('teacher')"><span class="role-switch-dot teacher"></span><span class="role-switcher-name">教&emsp;师</span><span style="font-size:10px;color:rgba(255,255,255,0.3);margin-left:auto;">陈明辉</span></button>
    </div>
  </div>
  <div class="sidebar-bottom">
    <div class="sidebar-toggle" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      <span class="menu-label">收起菜单</span>
    </div>
  </div>
</aside>

<!-- ===== MAIN CONTENT ===== -->
<main class="main">
  <div class="breadcrumb">
    <a href="workbench.html">首页</a> &nbsp;/&nbsp;
    <span id="breadcrumbScope">入编管理</span>
  </div>

  <div class="page-header">
    <div>
      <h1>入编管理</h1>
      <div class="subtitle" id="scopeSubtitle">管理权限范围内的教师入编申请</div>
    </div>
    <div class="page-header-right">
      <button class="btn btn-outline btn-sm" onclick="openExportModal()">导出数据</button>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="filter-bar" style="padding-bottom:0;">
      <div class="status-filters" id="statusFilters">
        <button class="status-fbtn active" onclick="setFilter('all')">全部</button>
        <button class="status-fbtn" onclick="setFilter('pending')">待审批</button>
        <button class="status-fbtn" onclick="setFilter('approved')">已通过</button>
        <button class="status-fbtn" onclick="setFilter('rejected')">已驳回</button>
      </div>
    </div>
    <div class="filter-bar" style="padding-top:8px;padding-bottom:0;">
      <select class="filter-select" id="typeFilter" onchange="renderTable()">
        <option value="all">全部类型</option>
        <option value="career">事业编</option>
        <option value="control">控制数</option>
      </select>
      <select class="filter-select" id="schoolFilter" onchange="renderTable()" style="display:none;">
        <option value="all">全部学校</option>
      </select>
    </div>
    <div class="table-wrap">
      <table class="flat-table">
        <thead>
          <tr>
            <th>申请编号</th>
            <th>学校名称</th>
            <th>所属区域</th>
            <th>编制类型</th>
            <th>申请时间</th>
            <th>人数</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="empty-icon">📋</div>
      <div id="emptyText">暂无入编申请记录</div>
    </div>
  </div>
</main>

<!-- Export modal -->
<div class="modal-overlay" id="exportModalOverlay">
  <div class="modal-export">
    <div class="modal-header">
      <h3>选择导出记录</h3>
      <button class="modal-close" onclick="closeExportModal()">&times;</button>
    </div>
    <div class="modal-body" id="exportModalBody"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeExportModal()">取消</button>
      <button class="btn-primary" id="exportConfirmBtn" onclick="doExport()">确认导出</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

// ===== SVG ICONS =====
var ICONS = {
  home: '<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',

// ===== DATA LOADING =====
function loadRecords() {
  var stored = JSON.parse(localStorage.getItem('entry_records') || '[]');
  var ids = {};
  stored.forEach(function(r) { ids[r.id] = true; });
  var merged = stored.slice();
  DEMO_RECORDS.forEach(function(r) { if (!ids[r.id]) { merged.push(r); ids[r.id] = true; } });
  return merged;
}

// ===== PERMISSION LOGIC =====
function canApprove(record) {
  if (record.status !== 'pending') return false;
  if (currentRole === 'district') return record.schoolType === '鱼峰区属';
  if (currentRole === 'city') return record.schoolType === '市直属';
  return false;
}

function canModifyResult(record) {
  if (record.status !== 'approved') return false;
  if (record.approverRole !== currentRole) return false;
  if (!record.approveTime) return false;
  var daysSince = (Date.now() - new Date(record.approveTime).getTime()) / 86400000;
  return daysSince < 30;
}

function getDaysSinceApproval(record) {
  if (!record.approveTime) return null;
  return Math.floor((Date.now() - new Date(record.approveTime).getTime()) / 86400000);
}

// ===== FILTERING =====
function getFilteredRecords() {
  var records = loadRecords();

  // Role-based scope
  if (currentRole === 'district') {
    records = records.filter(function(r) { return r.schoolType === '鱼峰区属'; });
  }
  // city: all records visible (read-only for non-市直属)

  // Status filter
  if (currentFilter !== 'all') {
    records = records.filter(function(r) { return r.status === currentFilter; });
  }

  // Type filter
  var typeFilter = document.getElementById('typeFilter').value;
  if (typeFilter !== 'all') {
    records = records.filter(function(r) { return r.staffingType === typeFilter; });
  }

  // School filter (city role only)
  var schoolSel = document.getElementById('schoolFilter');
  if (schoolSel && schoolSel.value !== 'all') {
    records = records.filter(function(r) { return r.schoolName === schoolSel.value; });
  }

  // Sort by submitTime desc
  records.sort(function(a, b) { return b.submitTime.localeCompare(a.submitTime); });
  return records;
}

// ===== TABLE RENDERING =====
function renderTable() {
  var records = getFilteredRecords();
  var tbody = document.getElementById('tableBody');
  var empty = document.getElementById('emptyState');
  var emptyText = document.getElementById('emptyText');

  if (records.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    emptyText.textContent = '暂无入编申请记录';
    updateSchoolFilter(records);
    return;
  }
  empty.style.display = 'none';

  var html = '';
  records.forEach(function(r) {
    var typeLabel = TYPE_MAP[r.staffingType] || r.staffingType;
    var statusLabel = STATUS_MAP[r.status] || r.status;
    var count = r.applicants ? r.applicants.length : 0;

    html += '<tr>';
    html += '<td><span style="font-weight:600;color:var(--primary);">' + r.id + '</span></td>';
    html += '<td>' + r.schoolName + '</td>';
    html += '<td>' + (r.schoolType || '—') + '</td>';
    html += '<td><span class="type-badge ' + r.staffingType + '">' + typeLabel + '</span></td>';
    html += '<td>' + r.submitTime.substring(0, 10) + '</td>';
    html += '<td>' + count + '人</td>';
    html += '<td><span class="status-badge ' + r.status + '">' + statusLabel + '</span></td>';
    html += '<td><div class="table-actions">';

    // View always available
    html += '<button class="btn btn-outline btn-sm" onclick="viewDetail(\'' + r.id + '\')">查看</button>';

    if (canApprove(r)) {
      html += '<button class="btn btn-primary btn-sm" onclick="approveRecord(\'' + r.id + '\')">审核</button>';
    } else if (r.status === 'pending' && currentRole === 'city' && r.schoolType !== '市直属') {
      // City admin sees pending 区属 — show read-only hint
      html += '<span class="permission-hint">仅只读</span>';
    }

    if (canModifyResult(r)) {
      var daysLeft = 30 - getDaysSinceApproval(r);
      html += '<button class="btn btn-warning btn-sm" onclick="modifyResult(\'' + r.id + '\')" title="剩余' + daysLeft + '天">修改结果</button>';
    }

    html += '</div></td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;

  // Update pending badge
  updatePendingBadge(records);

  // Update school filter dropdown
  updateSchoolFilter(records);
}

function updatePendingBadge(records) {
  var badge = document.getElementById('pendingBadge');
  if (!badge) return;
  if (currentRole === 'district') {
    var pending = records.filter(function(r) { return r.status === 'pending'; }).length;
    badge.textContent = pending;
    badge.style.display = pending > 0 ? '' : 'none';
  } else if (currentRole === 'city') {
    var cityPending = records.filter(function(r) { return r.status === 'pending' && r.schoolType === '市直属'; }).length;
    badge.textContent = cityPending;
    badge.style.display = cityPending > 0 ? '' : 'none';
  }
}

function updateSchoolFilter(records) {
  var schoolSel = document.getElementById('schoolFilter');
  if (!schoolSel) return;

  if (currentRole === 'city') {
    schoolSel.style.display = '';
    var schools = {};
    records.forEach(function(r) { schools[r.schoolName] = true; });
    // Also collect from full dataset for the dropdown
    var allRecords = loadRecords();
    allRecords.forEach(function(r) { schools[r.schoolName] = true; });

    var options = '<option value="all">全部学校</option>';
    Object.keys(schools).sort().forEach(function(s) {
      options += '<option value="' + s + '"' + (schoolSel.value === s ? ' selected' : '') + '>' + s + '</option>';
    });
    // Preserve selection if possible
    var currentVal = schoolSel.value;
    schoolSel.innerHTML = options;
    if (currentVal && Object.prototype.hasOwnProperty.call(schools, currentVal)) {
      schoolSel.value = currentVal;
    }
  } else {
    schoolSel.style.display = 'none';
  }
}

// ===== FILTER =====
function setFilter(filter) {
  currentFilter = filter;
  var btns = document.querySelectorAll('.status-fbtn');
  btns.forEach(function(b) { b.classList.remove('active'); });
  btns.forEach(function(b) {
    if ((filter === 'all' && b.textContent.trim().indexOf('全部') === 0) ||
        (filter === 'pending' && b.textContent.trim().indexOf('待审批') === 0) ||
        (filter === 'approved' && b.textContent.trim().indexOf('已通过') === 0) ||
        (filter === 'rejected' && b.textContent.trim().indexOf('已驳回') === 0)) {
      b.classList.add('active');
    }
  });
  renderTable();
}

	    html += '<td>' + (TYPE_MAP[r.staffingType] || r.staffingType) + '</td>';
	    html += '<td>' + (r.submitTime ? r.submitTime.substring(0, 10) : '') + '</td>';
	    html += '<td>' + (r.applicants || []).length + '</td>';
	    html += '</tr>';
	  });

	  html += '</tbody></table></div>';
	  body.innerHTML = html;
	  btn.disabled = selectedCount === 0;
	  btn.textContent = '确认导出 (' + selectedCount + ')';
	}

	function getApprovedRecords() {
	  return getFilteredRecords().filter(function(r) { return r.status === 'approved'; });
	}

	function doExport() {
	  var records = getApprovedRecords().filter(function(r) { return exportSelection[r.id]; });
	  if (records.length === 0) { showToast('请至少选择一条记录', 'warning'); return; }

	  var rows = [['申请编号','学校名称','所属区域','编制类型','申请时间','审批时间','人数','申请人']];
	  records.forEach(function(r) {
	    rows.push([
	      r.id, r.schoolName, r.schoolType || '',
	      TYPE_MAP[r.staffingType] || r.staffingType,
	      r.submitTime ? r.submitTime.substring(0, 10) : '',
	      r.approveTime ? r.approveTime.substring(0, 10) : '',
	      (r.applicants || []).length,
	      (r.applicants || []).map(function(a) { return a.name; }).join('、')
	    ]);
	  });
	  var csv = rows.map(function(row) { return row.join(','); }).join('\n');
	  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
	  var url = URL.createObjectURL(blob);
	  var a = document.createElement('a');
	  a.href = url; a.download = '入编已通过申请_' + new Date().toISOString().substring(0, 10) + '.csv';
	  a.click(); URL.revokeObjectURL(url);
	  showToast('已导出 ' + records.length + ' 条记录', 'success');
	  closeExportModal();
	}

// ===== TOAST =====
function showToast(msg, type) {
  type = type || '';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function() { el.remove(); }, 2200);
}

// ===== SIDEBAR =====
function toggleUserMenu() {
  document.getElementById('userDropdown').classList.toggle('show');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.topnav-user')) {
    document.getElementById('userDropdown').classList.remove('show');
  }
});

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function switchRole(role) {
  if (role === 'city' || role === 'district') {
    if (currentRole !== role) {
      currentRole = role;
      updateRoleUI();
      currentFilter = 'all';
      document.getElementById('typeFilter').value = 'all';
      var schoolSel = document.getElementById('schoolFilter');
      if (schoolSel) schoolSel.value = 'all';
      renderTable();
    }
    return;
  }
  if (role === 'school') {
    window.location.href = '教师入编管理（学校管理员视角）.html';
    return;
  }
  if (role === 'teacher') {
    showToast('教师角色无入编管理权限', 'warning');
    return;
  }
}

function updateRoleUI() {
  var roleData = ROLES[currentRole];
  // Update avatar/name
  document.getElementById('userAvatar').textContent = roleData.short;
  document.getElementById('userName').textContent = roleData.name;
  // Update subtitle
  document.getElementById('scopeSubtitle').textContent = '管理' + roleData.scopeLabel + '的教师入编申请';
  // Update active role button
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === currentRole);
  });
  // Update school filter visibility
  var schoolSel = document.getElementById('schoolFilter');
  if (schoolSel) {
    schoolSel.style.display = currentRole === 'city' ? '' : 'none';
    schoolSel.value = 'all';
  }
  renderSidebar();
}

function renderSidebar() {
  var roleData = ROLES[currentRole];
  if (!roleData) { document.getElementById('sidebarMenu').innerHTML = ''; return; }
  var sidebar = roleData.sidebar;
  var html = '';
  (sidebar.top || []).forEach(function(item) {
    html += '<a class="menu-item' + (item.id === 'entry' ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[item.icon] || '') + '<span class="menu-label">' + item.label + '</span></a>';
  });
  (sidebar.groups || []).forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      html += '<a class="menu-item' + (item.id === 'entry' ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[MENU_ICONS[item.id] || 'file']) + '<span class="menu-label">' + item.label + '</span>' + (item.badge ? '<span class="menu-badge">' + item.badge + '</span>' : '') + '</a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') {
    if (currentRole === 'city' || currentRole === 'district') return;
    if (currentRole === 'school') { window.location.href = '教师入编管理（学校管理员视角）.html'; return; }
  }
  if (id === 'exit') {
    if (currentRole === 'city' || currentRole === 'district') { window.location.href = '教师出编管理（主管单位视角）.html'; return; }
    if (currentRole === 'school') { window.location.href = '教师出编管理（学校管理员视角）.html'; return; }
  }
  if (id === 'promote') { window.location.href = 'promote-list-admin.html?role=' + currentRole; return; }
  if (id === 'postset') { window.location.href = 'post-list-admin.html?role=' + currentRole; return; }
  if (id === 'recruit') { window.location.href = 'recruit-list-admin.html?role=' + currentRole; return; }
  showToast('导航到: ' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}

// ===== INIT =====
(function init() {
  var params = new URLSearchParams(window.location.search);
  var urlRole = params.get('role');
  if (urlRole === 'city' || urlRole === 'district') {
    currentRole = urlRole;
  }
  updateRoleUI();
  renderTable();
})();
</script>
