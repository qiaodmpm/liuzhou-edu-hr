<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岗位晋升申报 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}

.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }

.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

.page-header { margin-bottom: 20px; display: flex; align-items: flex-start; justify-content: space-between; }
.page-header h1 { font-size: 20px; font-weight: 700; color: var(--text); }
.page-header .subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }

/* ===== STEP INDICATOR ===== */
.step-bar {
  display: flex; align-items: center; margin-bottom: 24px;
  padding: 16px 20px; background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border);
}
.step-item { display: flex; align-items: center; gap: 8px; }
.step-num {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  border: 2px solid var(--border); color: var(--text-light);
  transition: var(--transition);
}
.step-item.active .step-num { background: var(--primary); color: #fff; border-color: var(--primary); }
.step-item.done .step-num { background: var(--success); color: #fff; border-color: var(--success); }
.step-label { font-size: 12px; color: var(--text-light); }
.step-item.active .step-label { color: var(--primary); font-weight: 500; }
.step-item.done .step-label { color: var(--success); }
.step-connector { flex: 1; height: 2px; background: var(--border); margin: 0 12px; }
.step-connector.done { background: var(--success); }

/* ===== BATCH CARDS ===== */
.batch-cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.batch-card {
  padding: 20px; border: 2px solid var(--border); border-radius: var(--radius-lg);
  cursor: pointer; transition: var(--transition);
}
.batch-card:hover { border-color: var(--accent); }
.batch-card.selected { border-color: var(--primary); background: var(--primary-light); }
.batch-card .batch-name { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.batch-card .batch-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.batch-card .batch-levels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.batch-card .level-chip {
  padding: 2px 8px; background: var(--gray-bg);
  border-radius: 10px; font-size: 11px; color: var(--text-secondary);
}
.batch-card .batch-scope {
  display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
  margin-top: 8px;
}
.batch-card .batch-scope.city { background: #DBEAFE; color: #1E40AF; }
.batch-card .batch-scope.district { background: #FEF3C7; color: #92400E; }

/* ===== LEVEL TAGS ===== */
.level-card {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 24px; margin-bottom: 16px;
}
.level-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.level-card .level-hint { font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }
.level-tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.level-tag {
  padding: 10px 20px; border: 2px solid var(--border);
  border-radius: 8px; cursor: pointer; transition: var(--transition);
  font-size: 14px; font-weight: 500;
}
.level-tag:hover { border-color: var(--accent); }
.level-tag.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
.level-tag.disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--border); background: var(--gray-bg); }
.level-tag .tag-arrow { margin: 0 4px; color: var(--text-light); }
.level-tag.selected .tag-arrow { color: var(--primary); }

/* ===== QUOTA HINT ===== */
.quota-hint {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; background: #FFF7ED; border: 1px solid #FED7AA;
  border-radius: 6px; font-size: 12px; color: #92400E; margin-top: 12px;
}
.quota-hint.danger {
  background: #FEF2F2; border-color: #FECACA; color: #991B1B;
}
.quota-hint .quota-number { font-weight: 700; font-size: 14px; }

/* ===== FORM CARDS ===== */
.form-card {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px;
}
.form-card h3 {
  font-size: 14px; font-weight: 600; margin-bottom: 16px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border);
}
.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.form-item { display: flex; flex-direction: column; gap: 4px; }
.form-item .label { font-size: 11px; color: var(--text-secondary); }
.form-item .value { font-size: 13px; font-weight: 500; }
.form-item input, .form-item select {
  padding: 6px 10px; font-size: 13px; border: 1px solid var(--border);
  border-radius: 4px; font-family: inherit;
}
.form-item input:focus, .form-item select:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.1);
}
.form-item input.readonly, .form-item .readonly-value {
  padding: 6px 10px; font-size: 13px; font-weight: 500;
  background: #F8FAFC; border-radius: 4px; border: 1px solid var(--border);
  color: var(--text);
}

/* ===== UPLOAD AREA ===== */
.upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 40px; text-align: center; cursor: pointer; transition: var(--transition);
}
.upload-area:hover { border-color: var(--accent); background: var(--primary-light); }
.upload-area .upload-icon { font-size: 32px; margin-bottom: 8px; color: var(--text-light); }
.upload-area .upload-text { font-size: 13px; color: var(--text-secondary); }
.upload-area .upload-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.file-list { margin-top: 12px; }
.file-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--gray-bg); border-radius: 6px; margin-bottom: 6px; font-size: 12px;
}
.file-item .file-name { flex: 1; }
.file-item .file-size { color: var(--text-light); }
.file-item .file-remove { color: var(--danger); cursor: pointer; font-size: 11px; }
.file-item .file-remove:hover { text-decoration: underline; }

/* ===== REJECT NOTICE ===== */
.reject-notice { background: #FEF2F2; border: 1px solid #FECACA; border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; }
.reject-notice .rn-title { font-size: 14px; font-weight: 600; color: #991B1B; margin-bottom: 6px; }
.reject-notice .rn-meta { font-size: 11px; color: #B91C1C; margin-bottom: 4px; }
.reject-notice .rn-reason { font-size: 13px; color: #7F1D1D; line-height: 1.6; }

/* ===== ACTION BAR ===== */
.action-bar {
  position: sticky; bottom: 0; background: #fff;
  border-top: 1px solid var(--border); padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  margin: 24px -24px -24px;
  box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
}
.action-bar .btn-prev {
  padding: 8px 20px; font-size: 13px;
  border: 1px solid var(--border); border-radius: 6px;
  background: #fff; color: var(--text-secondary); cursor: pointer; font-family: inherit;
}
.action-bar .btn-prev:hover { background: var(--gray-bg); }
.action-bar .btn-next {
  padding: 8px 24px; font-size: 13px;
  border: none; border-radius: 6px;
  background: var(--primary); color: #fff; cursor: pointer;
  font-family: inherit; font-weight: 500;
}
.action-bar .btn-next:hover { background: var(--primary-dark); }
.action-bar .btn-next:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== ROLE GUARD ===== */
.role-guard {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 80px 20px; text-align: center;
}
.role-guard .guard-icon { font-size: 40px; margin-bottom: 16px; color: var(--text-light); }
.role-guard .guard-text { font-size: 15px; color: var(--text-secondary); margin-bottom: 8px; }
.role-guard .guard-sub { font-size: 12px; color: var(--text-light); }

/* ===== TOAST ===== */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ===== UTILITY ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; font-size: 13px; font-weight: 500;
  border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition);
  border: 1px solid transparent; text-decoration: none;
}
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.promotion-type-badge {
  display: inline-block; padding: 4px 12px; border-radius: 4px;
  font-size: 12px; font-weight: 500; margin-bottom: 16px;
}
.promotion-type-badge.regular { background: #DBEAFE; color: #1E40AF; }
.promotion-type-badge.senior_3 { background: #FEF3C7; color: #92400E; }
</style>
</head>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">

      <button class="role-switch-btn" data-role="teacher" onclick="switchRole('teacher')">

</aside>

<!-- ===== MAIN CONTENT ===== -->
<main class="main" id="mainContent">

    <a href="workbench.html">首页</a> &nbsp;/&nbsp; <span>岗位晋升申报</span>

      <h1 id="pageTitle">岗位晋升申报</h1>
      <div class="subtitle" id="pageSubtitle">按步骤选择批次、目标等级并填写申报信息</div>
    </div>
  </div>

  <!-- Step indicator -->
  <div class="step-bar" id="stepBar"></div>

  <!-- Content area (changes per step) -->
  <div id="contentArea"></div>

  <!-- Action bar -->
  <div class="action-bar" id="actionBar"></div>
</main>

function getCurrentTeacher() {
  var params = new URLSearchParams(window.location.search);

  var t = TEACHERS.find(function(x) { return x.id === tid; });
  t = t || TEACHERS[0];
  if (!t) return null;
  // Merge saved profile (from school approval) over base data
  var profiles = loadTeacherProfiles();
  var p = profiles[t.name];
  if (p) {
    return {
      id: t.id,
      name: p.name || t.name,
      short: t.short,
      gender: p.gender || t.gender,
      ethnicity: p.ethnicity || t.ethnicity,
      birthDate: p.birthDate || t.birthDate,
      politicalStatus: p.politicalStatus || t.politicalStatus,
      education: p.education || t.education,
      graduateTime: p.graduateTime || t.graduateTime,
      workStartTime: p.workStartTime || t.workStartTime,
      currentPost: t.currentPost,
      currentTitle: t.currentTitle,
      appointTime: t.appointTime,
      schoolName: t.schoolName,
      schoolCategory: t.schoolCategory

// ===== CHINESE NUMBER MAPPING =====
var CN_NUM_MAP = {
  '一': 1, '二': 2, '三': 3, '四': 4, '五': 5,
  '六': 6, '七': 7, '八': 8, '九': 9, '十': 10,
  '十一': 11, '十二': 12, '十三': 13
};
var NUM_CN_MAP = {};
for (var k in CN_NUM_MAP) { NUM_CN_MAP[CN_NUM_MAP[k]] = k; }

// ===== UTILITY FUNCTIONS =====
function extractLevelNumber(levelStr) {
  // "六级" -> 6, "三级" -> 3, "十一级" -> 11
  var match = levelStr.match(/(十一|十二|十三|[一二三四五六七八九十])级/);
  if (match) return CN_NUM_MAP[match[1]] || 0;
  return 0;
}

function extractCurrentLevelNumber() {
  var match = CURRENT_TEACHER.currentPost.match(/(十一|十二|十三|[一二三四五六七八九十])级/);
  if (match) return CN_NUM_MAP[match[1]] || 0;
  return 0;
}

function parseLevelPair(pair) {
  // "七级→六级" -> { from: 7, to: 6, fromLabel: "七级", toLabel: "六级" }
  var parts = pair.split('→');
  if (parts.length !== 2) return null;
  return {
    from: extractLevelNumber(parts[0]),
    to: extractLevelNumber(parts[1]),
    fromLabel: parts[0].trim(),
    toLabel: parts[1].trim()
  };
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(isoStr) {
  if (!isoStr) return '';
  return isoStr.substring(0, 10);
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
  return (bytes / 1048576).toFixed(1) + 'MB';
}

function formatDateTime(isoStr) {
  if (!isoStr) return '';
  return isoStr.replace('T', ' ').substring(0, 19);
}

function isExemptFromQuota(levelNum) {
  // Levels 8-13 are exempt from quota control
  return levelNum >= 8 && levelNum <= 13;

function getRemainingQuota(schoolName, levelNum) {
  var schoolQuota = PROMOTE_QUOTA[schoolName];
  if (!schoolQuota) return 0;
  var levelKey = String(levelNum);
  var q = schoolQuota[levelKey];
  if (!q) return 0;
  return q.authorized - q.employed;
}

var CATEGORY_MIN_LEVEL = { mgmt: 4, prof: 3, labor: 1 };

function getApplicableLevels(batch) {
  var currentNum = extractCurrentLevelNumber();
  var levels = [];

  // Determine which target levels are allowed by the batch
  var allowedSet = null;
  if (batch.allowedLevels && batch.allowedLevels.length > 0) {
    allowedSet = {};
    batch.allowedLevels.forEach(function(item) {
      var num = extractLevelNumber(item);
      if (num > 0) allowedSet[num] = true;
    });
  }
  // allowedSet === null means all levels are allowed (empty allowedLevels)

  // Category-aware min level: 专业技术岗最高三级, 管理岗最高四级, 工勤岗最高一级
  var cat = getTeacherCategory();
  var minLevel = CATEGORY_MIN_LEVEL[cat] || 1;

  // Cross-level: teacher can promote to ANY level higher than current (minLevel to currentNum-1)
  for (var targetNum = minLevel; targetNum < currentNum; targetNum++) {
    // If batch restricts levels, only add matching ones
    if (allowedSet && !allowedSet[targetNum]) continue;

    var targetCn = NUM_CN_MAP[targetNum];
    if (!targetCn) continue;
    var fromCn = NUM_CN_MAP[currentNum];
    if (!fromCn) continue;

    levels.push({
      from: currentNum,
      to: targetNum,
      fromLabel: fromCn + '级',
      toLabel: targetCn + '级'
    });
  }
  return levels;
}

function getTransferLevels(category) {
  var levels = [];
  var ranges = { mgmt: [4, 10], prof: [3, 13], labor: [1, 5] };
  var range = ranges[category];
  if (!range) return levels;
  for (var n = range[0]; n <= range[1]; n++) {
    var cn = NUM_CN_MAP[n];
    if (!cn) continue;
    levels.push({ num: n, label: cn + '级' });
  }
  // Labor has extra "普通工"
  if (category === 'labor') levels.push({ num: 0, label: '普通工' });
  return levels;
}

function buildReadonlyRow(label, value) {
  return '<div class="form-item"><span class="label">' + label + '</span><div class="readonly-value">' + (value || '—') + '</div></div>';
}

function buildEditRow(label, fieldId, value, type) {
  return '<div class="form-item"><span class="label">' + label + '</span><input type="' + type + '" id="' + fieldId + '" value="' + (value || '') + '" onchange="onSenior3FieldChange(\'' + fieldId + '\')"></div>';
}

function buildAssessmentSelect(label, idx) {
  var options = ['优秀', '合格', '基本合格', '不合格'];
  var html = '<div class="form-item"><span class="label">' + label + '</span><select id="assessment_' + idx + '" onchange="onAssessmentChange(' + idx + ', this.value)">';
  options.forEach(function (opt) {
    html += '<option value="' + opt + '"' + (formAssessments[idx] === opt ? ' selected' : '') + '>' + opt + '</option>';
  });
  html += '</select></div>';
  return html;
}

function onAssessmentChange(idx, value) {
  formAssessments[idx] = value;
}

function onSenior3FieldChange(fieldId) {
  var el = document.getElementById(fieldId);
  if (!el) return;
  var key = fieldId.replace('senior3_', '');
  senior3Form[key] = el.value;
}

function collectSenior3Form() {
  var keys = ['schoolMajor', 'graduateTime', 'workStartTime', 'profYears', 'qualName', 'qualTime', 'employStart', 'employEnd', 'targetStart', 'targetEnd', 'publicMethod', 'publicStart', 'publicEnd'];
  keys.forEach(function (k) {
    var el = document.getElementById('senior3_' + k);
    if (el) senior3Form[k] = el.value;
  });
}

// ===== STEP 5: UPLOAD =====
function renderStep5_Upload() {
  var html = '';

  html += '<div class="form-card">';
  html += '<h3>附件材料 <span style="color:var(--text-light);font-size:12px;">（选填）</span></h3>';
  html += '<div class="upload-area" onclick="document.getElementById(\'fileInput\').click()">';
  html += '<div class="upload-icon">&#128206;</div>';
  html += '<div class="upload-text">点击选择文件上传</div>';
  html += '<div class="upload-hint">支持 PDF、Word (.doc/.docx)、图片 (.jpg/.png)，单个文件不超过 20MB</div>';
  html += '</div>';
  html += '<input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style="display:none" onchange="handleFileUpload(this)">';

  html += '<div class="file-list" id="fileList">';
  uploadedFiles.forEach(function (f, i) {
    html += '<div class="file-item"><span class="file-name">' + f.name + '</span><span class="file-size">' + formatSize(f.size) + '</span><span class="file-remove" onclick="removeFile(' + i + ')">移除</span></div>';
  });
  html += '</div></div>';

  document.getElementById('contentArea').innerHTML = html;

  // Bind drag events on upload area
  var area = document.querySelector('.upload-area');
  if (area) {
    area.addEventListener('dragover', function (e) { e.preventDefault(); area.style.borderColor = 'var(--primary)'; area.style.background = 'var(--primary-light)'; });
    area.addEventListener('dragleave', function (e) { e.preventDefault(); area.style.borderColor = ''; area.style.background = ''; });
    area.addEventListener('drop', function (e) {
      e.preventDefault();
      area.style.borderColor = '';
      area.style.background = '';
      handleFiles(e.dataTransfer.files);
    });
  }
}

function handleFileUpload(input) {
  handleFiles(input.files);
  input.value = '';
}

function handleFiles(files) {
  var allowed = ['pdf', 'doc', 'docx', 'jpg', 'jpeg', 'png'];
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    var ext = f.name.split('.').pop().toLowerCase();
    if (allowed.indexOf(ext) === -1) { showToast('不支持的文件格式：' + f.name, 'warning'); continue; }
    if (f.size > 20 * 1024 * 1024) { showToast('文件超过20MB限制：' + f.name, 'warning'); continue; }
    uploadedFiles.push({ name: f.name, size: f.size });
  }
  refreshFileList();
}

function removeFile(idx) {
  uploadedFiles.splice(idx, 1);
  refreshFileList();
}

function refreshFileList() {
  var fl = document.getElementById('fileList');
  if (!fl) return;
  var html = '';
  uploadedFiles.forEach(function (f, i) {
    html += '<div class="file-item"><span class="file-name">' + f.name + '</span><span class="file-size">' + formatSize(f.size) + '</span><span class="file-remove" onclick="removeFile(' + i + ')">移除</span></div>';
  });
  fl.innerHTML = html;
}

// ===== ACTION BAR =====
function renderActionBar() {
  var html = '<div>';
  if (currentStep > 1) {
    html += '<button class="btn-prev" onclick="prevStep()">上一步</button>';
  }
  html += '</div>';
  html += '<div>';
  if (currentStep < STEP_COUNT) {
    html += '<button class="btn-next" onclick="nextStep()">下一步</button>';
  } else {
    html += '<button class="btn-next" onclick="submitApplication()">提交申报</button>';
  }
  html += '</div>';
  document.getElementById('actionBar').innerHTML = html;
}

// ===== STEP NAVIGATION =====
function nextStep() {
  // Validate current step
  if (currentStep === 1) {
    if (!selectedBatch) {
      showToast('请先选择晋升批次', 'warning');
      return;
    }
  }
  if (currentStep === 2) {
    if (selectedTransferType === 'promote') {
      var applicable = getApplicableLevels(selectedBatch);
      if (applicable.length === 0) {
        showToast('当前批次无可申报的晋升等级', 'warning');
        return;
      }
    }
  }
  if (currentStep === 3) {
    if (selectedTransferType === 'promote') {
      if (!selectedLevel || !selectedLevel.toLabel) {
        showToast('请先选择目标等级', 'warning');
        return;
      }
      var targetNum = extractLevelNumber(selectedLevel.toLabel);
      if (!isExemptFromQuota(targetNum)) {
        var remaining = getRemainingQuota(CURRENT_TEACHER.schoolName, targetNum);
        if (remaining <= 0) {
          showToast('目标等级无可申报岗位数', 'warning');
          return;
        }
      }
    } else {
      if (!selectedTransferCategory || !selectedTransferLevel) {
        showToast('请选择转岗目标类别和等级', 'warning');
        return;
      }
      if (!selectedLevel) { selectedLevel = { fromLabel: CURRENT_TEACHER.currentPost, toLabel: selectedTransferLevel }; }
    }
  }
  if (currentStep === 4) {
    // Collect any edited fields
    collectSenior3Form();
    var targetNum = selectedLevel ? extractLevelNumber(selectedLevel.toLabel) : 0;
    var fromNum = selectedLevel ? extractLevelNumber(selectedLevel.fromLabel) : 0;
    if (fromNum === 4 && targetNum === 3) {
      // Validate senior_3 required fields
      var required = [
        { key: 'schoolMajor', label: '毕业学校及专业' },
        { key: 'graduateTime', label: '毕业时间' },
        { key: 'workStartTime', label: '参加工作时间' },
        { key: 'profYears', label: '从事本专业时间' },
        { key: 'qualName', label: '专业技术资格名称' },
        { key: 'qualTime', label: '取得资格时间' },
        { key: 'employStart', label: '聘用时间起' },
        { key: 'employEnd', label: '聘用时间止' },
        { key: 'targetStart', label: '拟聘起始时间' },
        { key: 'targetEnd', label: '拟聘截止时间' },
        { key: 'publicMethod', label: '公示方式' },
        { key: 'publicStart', label: '公示开始时间' },
        { key: 'publicEnd', label: '公示结束时间' }
      ];
      for (var i = 0; i < required.length; i++) {
        if (!senior3Form[required[i].key]) {
          showToast('请填写' + required[i].label, 'warning');
          return;
        }
      }
    }
  }

  currentStep++;
  renderPage();
}

function prevStep() {
  if (currentStep > 1) {
    currentStep--;
    renderPage();
  }
}

// ===== SUBMIT =====
function submitApplication() {
  // Prevent duplicate application for same batch (only allow if editing a rejected record)
  if (pageMode !== 'edit') {
    var existingRecords = loadRecords().filter(function(r) {
      return r.teacherName === CURRENT_TEACHER.name && r.batchId === selectedBatch.id;
    });
    var hasActive = existingRecords.some(function(r) {
      return r.status !== 'first_rejected' && r.status !== 'second_rejected' && r.status !== 'third_rejected';
    });
    if (hasActive) {
      showToast('该批次您已申报，请勿重复提交', 'warning');
      return;
    }
  }

  // Check quota for the target level
  var targetNum = extractLevelNumber(selectedLevel.toLabel);
  if (!isExemptFromQuota(targetNum)) {
    var remaining = getRemainingQuota(CURRENT_TEACHER.schoolName, targetNum);
    if (remaining <= 0) {
      showToast('无可申报岗位数，无法提交', 'warning');
      return;
    }
  }

  // Collect form data from step 3
  collectSenior3Form();

  // Generate ID
  var seq = parseInt(localStorage.getItem('promote_seq') || '0') + 1;
  localStorage.setItem('promote_seq', String(seq));
  var today = new Date();
  var dateStr = today.getFullYear() + ('0' + (today.getMonth() + 1)).slice(-2) + ('0' + today.getDate()).slice(-2);
  var newId = 'PR' + dateStr + ('000' + seq).slice(-3);

  // Determine promotion type
  var fromNum = selectedLevel ? extractLevelNumber(selectedLevel.fromLabel) : 0;
  var isSenior3 = (fromNum === 4 && targetNum === 3);
  var promotionType = isSenior3 ? 'senior_3' : (selectedTransferType === 'transfer' ? 'transfer' : 'regular');

  // Build timeline
  var now = new Date().toISOString().replace('T', ' ').slice(0, 19);

  // Build record
  var record = {
    id: newId,
    batchId: selectedBatch.id,
    batchName: selectedBatch.name,
    teacherName: formTeacherInfo.teacherName || CURRENT_TEACHER.name,
    gender: formTeacherInfo.gender || CURRENT_TEACHER.gender,
    ethnicity: formTeacherInfo.ethnicity || CURRENT_TEACHER.ethnicity,
    birthDate: formTeacherInfo.birthDate || CURRENT_TEACHER.birthDate,
    politicalStatus: formTeacherInfo.politicalStatus || CURRENT_TEACHER.politicalStatus,
    education: formTeacherInfo.education || CURRENT_TEACHER.education,
    graduateTime: formTeacherInfo.graduateTime || CURRENT_TEACHER.graduateTime,
    workStartTime: formTeacherInfo.workStartTime || CURRENT_TEACHER.workStartTime,
    currentPost: CURRENT_TEACHER.currentPost,
    currentTitle: CURRENT_TEACHER.currentTitle,
    appointTime: CURRENT_TEACHER.appointTime,
    promotionType: promotionType,
    targetLevel: selectedLevel ? selectedLevel.toLabel : '',
    fromLevel: selectedLevel ? selectedLevel.fromLabel : '',
    transferType: selectedTransferType,
    transferCategory: selectedTransferType === 'transfer' ? selectedTransferCategory : null,
    transferTargetLevel: selectedTransferType === 'transfer' ? selectedTransferLevel : null,
    assessments: formAssessments.slice(),
    senior3Form: isSenior3 ? JSON.parse(JSON.stringify(senior3Form)) : null,
    schoolName: CURRENT_TEACHER.schoolName,
    schoolCategory: CURRENT_TEACHER.schoolCategory,
    attachments: uploadedFiles.slice(),
    schoolAttachments: [],
    remark: '',
    status: 'pending_first',
    statusLabel: '一审待审核',
    firstReviewer: null,
    firstReviewTime: null,
    firstRejectReason: null,
    secondReviewer: null,
    secondReviewTime: null,
    secondReviewOpinion: null,
    secondRejectReason: null,
    hrResult: null,
    hrApprovalAttachment: null,
    thirdReviewer: null,
    thirdReviewTime: null,
    thirdModifications: [],
    timeline: [{ time: now, action: '教师提交申报', operator: CURRENT_TEACHER.name }],
    submitTime: now,
    completeTime: null
  };

  // Save — replace old record if editing, otherwise append
  var records = loadRecords();
  if (pageMode === 'edit' && editRecordId) {
    for (var i = 0; i < records.length; i++) {
      if (records[i].id === editRecordId) {
        // Preserve original timeline and prepend new entry
        var oldTimeline = records[i].timeline || [];
        record.timeline = oldTimeline.concat([{ time: now, action: '教师修改重提', operator: CURRENT_TEACHER.name }]);
        record.id = editRecordId; // keep original ID
        records[i] = record;
        break;
      }
    }
  } else {
    records.push(record);
  }
  saveRecords(records);

  showToast('申报提交成功', 'success');
  setTimeout(function () {
    window.location.href = 'promote-list-teacher.html';
  }, 1000);
}

// ===== LOAD FOR EDIT =====
function loadForEdit(id) {
  var records = loadRecords();
  var rec = null;
  for (var i = 0; i < records.length; i++) {
    if (records[i].id === id) { rec = records[i]; break; }
  }
  if (!rec) { showToast('未找到记录', 'warning'); return; }

  editRecordId = id;

  // Extract reject reason
  rejectInfo = null;
  if (rec.firstRejectReason) {
    rejectInfo = { type: '一审驳回', reason: rec.firstRejectReason, reviewer: rec.firstReviewer, time: rec.firstReviewTime };
  } else if (rec.secondRejectReason) {
    rejectInfo = { type: '二审驳回', reason: rec.secondRejectReason, reviewer: rec.secondReviewer, time: rec.secondReviewTime };
  }

  // Pre-fill teacher info from record (overrides CURRENT_TEACHER defaults)
  initFormTeacherInfo({
    teacherName: rec.teacherName,
    gender: rec.gender,
    ethnicity: rec.ethnicity,
    birthDate: rec.birthDate,
    politicalStatus: rec.politicalStatus,
    education: rec.education,
    graduateTime: rec.graduateTime,
    workStartTime: rec.workStartTime
  });

  // Pre-fill batch
  var allBatches = loadBatches();
  for (var j = 0; j < allBatches.length; j++) {
    if (allBatches[j].id === rec.batchId) {
      selectedBatch = allBatches[j];
      break;
    }
  }

  // Pre-fill level
  if (rec.fromLevel && rec.targetLevel) {
    selectedLevel = { fromLabel: rec.fromLevel, toLabel: rec.targetLevel };
  }

  // Pre-fill assessments
  if (rec.assessments && rec.assessments.length >= 3) {
    formAssessments = rec.assessments.slice();
  }

  // Pre-fill senior3 form
  if (rec.senior3Form) {
    senior3Form = JSON.parse(JSON.stringify(rec.senior3Form));
  }

  // Pre-fill attachments
  if (rec.attachments) {
    uploadedFiles = JSON.parse(JSON.stringify(rec.attachments));
  }

  // Pre-fill transfer type
  if (rec.transferType) {
    selectedTransferType = rec.transferType;
    if (rec.transferType === 'transfer') {
      selectedTransferCategory = rec.transferCategory || null;
      selectedTransferLevel = rec.transferTargetLevel || null;
    }
  }

  // Update page header
  document.getElementById('pageTitle').textContent = '修改晋升申报';
  document.getElementById('pageSubtitle').textContent = '已驳回申报的重新提交，请修改信息后再次申报';

  // Jump directly to the form step so teacher can edit
  currentStep = 4;
  renderPage();
}

function renderRejectNotice() {
  if (!rejectInfo) return '';
  return '<div class="reject-notice">' +
    '<div class="rn-title">&#9888; ' + (rejectInfo.type || '驳回通知') + '</div>' +
    (rejectInfo.reviewer || rejectInfo.time ? '<div class="rn-meta">' + (rejectInfo.reviewer || '') + (rejectInfo.reviewer && rejectInfo.time ? ' · ' : '') + (rejectInfo.time ? rejectInfo.time.substring(0, 16) : '') + '</div>' : '') +
    '<div class="rn-reason">驳回理由：' + escapeHtml(rejectInfo.reason || '无') + '</div>' +
    '</div>';
}

// ===== MAIN RENDER =====
function renderPage() {
  // Show reject notice in edit mode (remove existing first to prevent duplicates)
  var existing = document.getElementById('rejectNoticeArea');
  if (existing) existing.remove();
  if (pageMode === 'edit' && rejectInfo) {
    document.getElementById('pageSubtitle').insertAdjacentHTML('afterend', '<div id="rejectNoticeArea">' + renderRejectNotice() + '</div>');
  }

  renderStepIndicator();

  if (currentStep === 1) {
    renderStep1_BatchSelect();
  } else if (currentStep === 2) {
    renderStep2_PromotionType();
  } else if (currentStep === 3) {
    renderStep3_LevelSelect();
  } else if (currentStep === 4) {
    renderStep4_Form();
  } else if (currentStep === 5) {
    renderStep5_Upload();
  }

  renderActionBar();
}

// ===== INIT =====
function init() {
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var mode = params.get('mode');
  var teacherParam = params.get('teacher');

  if (teacherParam) {
    setCurrentTeacher(teacherParam);
    CURRENT_TEACHER = getCurrentTeacher();
  }

  renderSidebar();

  // Initialize editable teacher info from CURRENT_TEACHER
  initFormTeacherInfo(null);

  if (id && mode === 'edit') {
    pageMode = 'edit';
    loadForEdit(id);
  } else {
    var batchParam = params.get('batch');
    var batches = getOpenBatches();
    if (batchParam) {
      var matched = batches.find(function(b) { return b.id === batchParam; });
      if (matched) selectedBatch = matched;
    } else if (batches.length === 1) {
      selectedBatch = batches[0];
    }
    renderPage();
  }
}

init();
