<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>教师出编管理 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}

.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }

.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

.page-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
}
.page-header h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); }
.page-header-right { display: flex; gap: 8px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; font-size: 13px; font-weight: 500;
  border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition);
  border: 1px solid transparent; text-decoration: none;
}
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: #fff; color: var(--text-secondary); border-color: var(--border); }
.btn-outline:hover { background: var(--gray-bg); }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* Filters */
.filter-bar {
  display: flex; align-items: center; gap: 12px; padding: 12px 20px; flex-wrap: wrap;
}
.status-filters { display: flex; gap: 4px; }
.status-fbtn {
  padding: 6px 16px; font-size: 12px; border: 1px solid var(--border); border-radius: 20px;
  cursor: pointer; background: #fff; color: var(--text-secondary); font-family: inherit;
  transition: var(--transition); white-space: nowrap;
}
.status-fbtn:hover { border-color: var(--accent); color: var(--primary); }
.status-fbtn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.filter-select {
  padding: 6px 12px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px;
  font-family: inherit; background: #fff; color: var(--text); outline: none;
}
.filter-select:focus { border-color: var(--accent); }

/* Card */
.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  margin-bottom: 20px; overflow: hidden;
}

/* Table */
.table-wrap { overflow-x: auto; }
.flat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.flat-table th {
  padding: 10px 14px; text-align: left; font-weight: 600; font-size: 12px;
  color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.flat-table td {
  padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text);
}
.flat-table tbody tr:hover { background: #FAFBFC; }

/* Status badges */
.status-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 12px; font-weight: 500;
}
.status-badge.pending { background: #EFF6FF; color: #1E40AF; }
.status-badge.approved { background: #ECFDF5; color: #10B981; }
.status-badge.rejected { background: #FEF2F2; color: #EF4444; }

/* Type badges */
.type-badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 500;
}
.type-badge.career { background: #DBEAFE; color: #1E40AF; }
.type-badge.control { background: #E0E7FF; color: #3730A3; }

/* Actions */
.table-actions { display: flex; gap: 6px; }
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-light);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Export modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center;
  justify-content: center; z-index: 1000;
}
.modal-box {
  background: #fff; border-radius: var(--radius-lg); width: 560px;
  max-width: 92%; padding: 24px; box-shadow: var(--shadow-lg);
}
.modal-box h3 { font-size: 16px; margin-bottom: 16px; }
.modal-list { max-height: 300px; overflow-y: auto; margin-bottom: 16px; }
.modal-list label {
  display: flex; align-items: center; gap: 8px; padding: 8px 0;
  border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer;
}
.modal-buttons { display: flex; justify-content: flex-end; gap: 12px; }
</style>
</head>

function loadRecords() {
  var stored = JSON.parse(localStorage.getItem('exit_records') || '[]');
  var ids = {};
  stored.forEach(function(r) { ids[r.id] = true; });
  var merged = stored.slice();
  DEMO_RECORDS.forEach(function(r) { if (!ids[r.id]) { merged.push(r); ids[r.id] = true; } });
  return merged;
}

function getFilteredRecords() {
  var records = loadRecords();
  records = records.filter(function(r) { return r.schoolName === '柳州市第八中学'; });
  if (currentFilter !== 'all') {
    records = records.filter(function(r) { return r.status === currentFilter; });
  }
  var typeFilter = document.getElementById('typeFilter').value;
  if (typeFilter !== 'all') {
    records = records.filter(function(r) { return r.staffingType === typeFilter; });
  }
  records.sort(function(a, b) { return b.submitTime.localeCompare(a.submitTime); });
  return records;
}

// ===== TABLE RENDERING =====
function renderTable() {
  var records = getFilteredRecords();
  var tbody = document.getElementById('tableBody');
  var empty = document.getElementById('emptyState');

  if (records.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  var html = '';
  records.forEach(function(r) {
    var typeLabel = TYPE_MAP[r.staffingType] || r.staffingType;
    var statusLabel = STATUS_MAP[r.status] || r.status;
    var count = r.applicants ? r.applicants.length : 0;
    html += '<tr>';
    html += '<td><span style="font-weight:600;color:var(--primary);">' + r.id + '</span></td>';
    html += '<td><span class="type-badge ' + r.staffingType + '">' + typeLabel + '</span></td>';
    html += '<td>' + r.submitTime.substring(0,10) + '</td>';
    html += '<td>' + count + '人</td>';
    html += '<td><span class="status-badge ' + r.status + '">' + statusLabel + '</span></td>';
    html += '<td><div class="table-actions">';
    html += '<button class="btn btn-outline btn-sm" onclick="viewDetail(\'' + r.id + '\')">查看</button>';
    if (r.status === 'rejected') {
      html += '<button class="btn btn-primary btn-sm" onclick="editRejected(\'' + r.id + '\')">修改重提</button>';
    }
    if (r.status === 'approved') {
      html += '<button class="btn btn-outline btn-sm" onclick="exportSingleRecord(\'' + r.id + '\')">导出数据</button>';
    }
    html += '</div></td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function setFilter(filter) {
  currentFilter = filter;
  var btns = document.querySelectorAll('.status-fbtn');
  btns.forEach(function(b) { b.classList.remove('active'); });
  btns.forEach(function(b) {
    if ((filter === 'all' && b.textContent === '全部') ||
        (filter === 'pending' && b.textContent === '待审批') ||
        (filter === 'approved' && b.textContent === '已通过') ||
        (filter === 'rejected' && b.textContent === '已驳回')) {
      b.classList.add('active');
    }
  });
  renderTable();
  renderTable();
}

// ===== EXPORT =====
function exportSingleRecord(id) {
  var r = loadRecords().find(function(rec) { return rec.id === id; });
  if (!r) { showToast("记录不存在", "warning"); return; }
  if (r.status !== "approved") { showToast("仅可导出已通过的申请记录", "warning"); return; }

  var rows = [["申请编号","编制类型","申请时间","审批时间","人数","出编人员"]];
  rows.push([
    r.id,
    TYPE_MAP[r.staffingType] || r.staffingType,
    r.submitTime ? r.submitTime.substring(0,10) : "",
    r.approveTime ? r.approveTime.substring(0,10) : "",
    (r.applicants || []).length,
    (r.applicants || []).map(function(a) { return a.name + "(" + a.exitForm + ")"; }).join("、")
  ]);

  var csv = rows.map(function(row) { return row.join(","); }).join(String.fromCharCode(10));
  var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "出编数据_" + r.id + "_" + new Date().toISOString().substring(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(url);
  showToast("已导出：" + r.id, "success");
}
// ===== TOAST =====
function showToast(msg, type) {
  type = type || '';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function() { el.remove(); }, 1500);
}

function renderSidebar() {

  if (!roleData) { document.getElementById('sidebarMenu').innerHTML = ''; return; }

  var html = '';

  });
  (sidebar.groups || []).forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      html += '<a class="menu-item' + (item.id === 'exit' ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[MENU_ICONS[item.id] || 'file']) + '<span class="menu-label">' + item.label + '</span>' + (item.badge ? '<span class="menu-badge">' + item.badge + '</span>' : '') + '</a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
  var btns = document.querySelectorAll('.role-switch-btn');
  btns.forEach(function(b) { b.classList.toggle('active', b.dataset.role === currentRole); });

  if (nameEl) nameEl.textContent = roleData.name;
  var avatarEl = document.querySelector('.topnav-user .avatar');
  if (avatarEl) avatarEl.textContent = roleData.short;
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') {
    if (currentRole === 'school') { window.location.href = '教师入编管理（学校管理员视角）.html'; return; }
    if (currentRole === 'city' || currentRole === 'district') { window.location.href = '教师入编管理（主管单位视角）.html'; return; }
  }
  if (id === 'exit') { return; }
  if (id === 'promote') { window.location.href = 'promote-list-school.html'; return; }
  if (id === 'postset') {
    if (currentRole === 'city' || currentRole === 'district') { window.location.href = 'post-list-admin.html?role=' + currentRole; return; }
    if (currentRole === 'school') { window.location.href = 'post-list-school.html'; return; }
  }
  if (id === 'recruit') {
    if (currentRole === 'city' || currentRole === 'district') { window.location.href = 'recruit-list-admin.html?role=' + currentRole; return; }
    if (currentRole === 'school') { window.location.href = 'recruit-list-school.html'; return; }
    return;
  }
  if (id === 'account') { window.location.href = 'account-management.html'; return; }
  if (id === 'ledger') { var lr = (typeof currentUser!=='undefined'?currentUser.role:currentRole); window.location.href = (lr === 'city' || lr === 'district') ? 'org-ledger-admin.html' : lr === 'school' ? 'org-ledger-school.html' : 'workbench.html'; return; }

  showToast('跳转至：' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}
