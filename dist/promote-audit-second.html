<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>材料审核（二审） — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* ===== TWO-COLUMN AUDIT LAYOUT ===== */
.audit-layout { display: flex; gap: 24px; }
.audit-main { flex: 1; min-width: 0; }
.audit-sidebar { width: 360px; flex-shrink: 0; }

/* ===== PAGE HEADER ===== */
.page-header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
.page-header-left h1 { font-size: 20px; font-weight: 700; }
.page-header-left .meta { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.status-badge {
  display: inline-block; padding: 6px 16px; border: 2px solid;
  transform: rotate(-5deg); font-weight: 700; font-size: 14px; background: #fff;
}
.status-badge.pending { color: #F59E0B; border-color: #F59E0B; }

/* ===== PROGRESS BAR ===== */
.progress-bar {
  display: flex; align-items: center; padding: 20px 24px;
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto;
}
.step-wrapper { display: flex; align-items: center; flex: 1; min-width: 0; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; min-width: 80px; }
.step-dot {
  width: 28px; height: 28px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
  border: 2px solid var(--border); color: var(--text-light); background: #fff;
  transition: var(--transition);
}
.step.done .step-dot { background: var(--success); color: #fff; border-color: var(--success); }
.step.current .step-dot { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30,64,175,0.12); }
.step-text { font-size: 11px; color: var(--text-light); white-space: nowrap; }
.step.current .step-text { color: var(--primary); font-weight: 500; }
.step.done .step-text { color: var(--success); }
.step-line { flex: 1; height: 2px; background: var(--border); margin: 0 4px 22px; min-width: 20px; }
.step-line.done { background: var(--success); }

/* ===== QUOTA SUMMARY TABLE ===== */
.summary-top-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px; }
.summary-top-table th { padding: 8px 12px; border: 1px solid var(--border); background: #F8FAFC; font-weight: 600; text-align: center; width: 12%; }
.summary-top-table td { padding: 8px 12px; border: 1px solid var(--border); text-align: center; }
.summary-top-table b { color: var(--primary); }
.summary-sec-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.summary-sec-table th { padding: 5px 6px; border: 1px solid var(--border); text-align: center; font-weight: 600; font-size: 11px; background: #F8FAFC; }
.summary-sec-table td { padding: 5px 6px; border: 1px solid var(--border); text-align: center; font-size: 12px; }
.summary-sec-table .sec-title { background: #F8FAFC; font-weight: 600; font-size: 12px; text-align: center; vertical-align: middle; }
.summary-sec-table .row-label-1 { background: #F8FAFC; font-weight: 500; color: var(--text-secondary); font-size: 11px; text-align: left; padding-left: 10px; }
.summary-sec-table .row-label-2 { background: #FAFAFA; color: var(--text-light); font-size: 11px; text-align: left; padding-left: 20px; }
.summary-sec-table .note-col { min-width: 44px; color: var(--text-light); font-size: 11px; }
.summary-sec-table .data-zero { color: var(--text-light); }
.quota-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
.quota-card-header { padding: 14px 20px; background: #F8FAFC; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
.quota-card-header h3 { font-size: 14px; font-weight: 600; margin: 0; }
.quota-card-body { padding: 20px; }
.quota-card-body.collapsed { display: none; }
.over-quota-warn { background: #FEF2F2; border: 1px solid #FECACA; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #991B1B; margin-top: 12px; }
.over-quota-ok { background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #166534; margin-top: 12px; }

/* ===== PERSON CARDS ===== */
.person-card {
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 16px 20px; margin-bottom: 12px;
  transition: var(--transition); background: #fff;
}
.person-card:hover { border-color: var(--accent); }
.person-card.reviewed-approved { border-left: 3px solid var(--success); }
.person-card.reviewed-rejected { border-left: 3px solid var(--danger); }
.person-header { display: flex; align-items: center; justify-content: space-between; }
.person-info { display: flex; align-items: center; gap: 12px; }
.person-name { font-weight: 600; font-size: 14px; }
.person-target {
  font-size: 12px; color: var(--text-secondary);
  background: var(--gray-bg); padding: 2px 8px; border-radius: 10px;
}
.person-badge { font-size: 11px; padding: 2px 10px; border-radius: 12px; font-weight: 500; }
.person-badge.pending { background: #FEF3C7; color: #92400E; }
.person-badge.approved { background: #D1FAE5; color: #065F46; }
.person-badge.rejected { background: #FEE2E2; color: #991B1B; }
.btn-expand {
  padding: 4px 12px; font-size: 12px; border: 1px solid var(--border);
  border-radius: 4px; background: #fff; cursor: pointer;
  color: var(--text-secondary); font-family: inherit;
}
.btn-expand:hover { background: var(--gray-bg); }
.person-body { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ===== INFO GRID ===== */
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.info-item { font-size: 12px; }
.info-item .lbl { color: var(--text-light); font-size: 11px; }
.info-item .val { font-weight: 500; margin-top: 2px; }
.info-item.full { grid-column: 1 / -1; }

/* ===== PROMOTION TYPE BADGE ===== */
.promotion-type-badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 600; margin-bottom: 8px;
}
.promotion-type-badge.regular { background: #DBEAFE; color: #1E40AF; }
.promotion-type-badge.senior_3 { background: #FEF3C7; color: #92400E; }

/* ===== SENIOR-3 FORM SECTION ===== */
.senior3-section {
  background: #FFFBEB; border: 1px solid #FDE68A; border-radius: var(--radius);
  padding: 12px 16px; margin: 12px 0;
}
.senior3-section h5 { font-size: 13px; font-weight: 600; color: #92400E; margin-bottom: 10px; }
.senior3-section .info-grid { margin-bottom: 0; }
.s3-subtitle { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 14px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }

/* ===== ATTACHMENTS INSIDE PERSON ===== */
.person-attachments { margin: 12px 0; }
.person-attachments h5 { font-size: 12px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
.att-item {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; background: var(--gray-bg); border-radius: 4px;
  font-size: 11px; margin-right: 6px; margin-bottom: 4px;
}
.att-item a { color: var(--primary); text-decoration: none; }
.att-item a:hover { text-decoration: underline; }
.att-item .att-size { color: var(--text-light); margin-left: 2px; }
.att-item .att-name { flex: 1; }
.att-item .att-link { color: var(--primary); text-decoration: none; font-size: 11px; margin-left: 6px; cursor: pointer; }
.att-item .att-link:hover { text-decoration: underline; }

/* ===== INFO SECTION (public notice / remarks) ===== */
.info-section {
  margin: 12px 0;
  padding: 14px 16px;
  background: #FAFBFC;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.info-section h5 {
  font-size: 13px; font-weight: 600;
  margin-bottom: 10px; color: var(--text);
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}

/* ===== PER-PERSON ACTION BUTTONS ===== */
.person-actions {
  display: flex; gap: 8px; margin-top: 14px;
  padding-top: 12px; border-top: 1px solid var(--border);
}
.btn-person-approve {
  padding: 6px 16px; font-size: 12px; border: 1px solid var(--success);
  border-radius: 4px; background: #fff; color: var(--success);
  cursor: pointer; font-family: inherit; font-weight: 500;
}
.btn-person-approve:hover { background: #F0FDF4; }
.btn-person-approve.active { background: var(--success); color: #fff; }
.btn-person-reject {
  padding: 6px 16px; font-size: 12px; border: 1px solid var(--danger);
  border-radius: 4px; background: #fff; color: var(--danger);
  cursor: pointer; font-family: inherit; font-weight: 500;
}
.btn-person-reject:hover { background: #FEF2F2; }
.btn-person-reject.active { background: var(--danger); color: #fff; }

/* ===== SUMMARY TABLE DELTA INDICATORS ===== */
.summary-sec-table .cv { color: var(--text-secondary); }
.summary-sec-table .ar { font-weight: 600; margin: 0 1px; }
.summary-sec-table .dt { font-size: 10px; white-space: nowrap; }
.summary-sec-table .dt.up { color: #16A34A; }
.summary-sec-table .dt.down { color: #DC2626; }
.modal-summary-table .dt { font-size: 10px; white-space: nowrap; }
.modal-summary-table .dt.up { color: #16A34A; }
.modal-summary-table .dt.down { color: #DC2626; }
.note-item { font-size: 11px; line-height: 1.6; padding: 2px 6px; text-align: left; white-space: nowrap; }

/* ===== REJECT REASON INLINE ===== */
.reject-reason-area { margin-top: 8px; display: none; }
.reject-reason-area.show { display: block; }
.reject-reason-area textarea {
  width: 100%; padding: 8px; font-size: 12px;
  border: 1px solid var(--border); border-radius: 4px;
  font-family: inherit; resize: vertical; min-height: 60px;
}
.reject-reason-area textarea:focus { outline: none; border-color: var(--danger); box-shadow: 0 0 0 2px rgba(239,68,68,0.1); }

/* ===== SIDEBAR SECTIONS ===== */
.sidebar-section {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px;
}
.sidebar-section h4 { font-size: 13px; font-weight: 600; margin-bottom: 14px; }

/* ===== REVIEW SUMMARY ===== */
.review-summary { display: flex; gap: 12px; margin-bottom: 12px; }
.summary-item {
  text-align: center; flex: 1; padding: 10px;
  background: var(--gray-bg); border-radius: 6px;
}
.summary-item .num { font-size: 20px; font-weight: 700; }
.summary-item .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.summary-item.approved .num { color: var(--success); }
.summary-item.rejected .num { color: var(--danger); }

/* ===== TIMELINE ===== */
.timeline { position: relative; padding-left: 20px; }
.timeline-item {
  position: relative; padding-bottom: 14px; border-left: 2px solid var(--border);
}
.timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline-item::before {
  content: ''; position: absolute; left: -5px; top: 4px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--border);
}
.timeline-item.current::before { background: var(--primary); }
.timeline-item .tl-time { font-size: 11px; color: var(--text-light); }
.timeline-item .tl-action { font-size: 12px; font-weight: 500; margin-top: 2px; }
.timeline-item .tl-operator { font-size: 11px; color: var(--text-secondary); }

/* ===== SUBMIT BUTTON ===== */
.btn-submit-review {
  width: 100%; padding: 12px; font-size: 14px; font-weight: 500;
  border: none; border-radius: 6px; background: var(--primary);
  color: #fff; cursor: pointer; font-family: inherit;
}
.btn-submit-review:hover { background: var(--primary-dark); }
.btn-submit-review:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.modal-container {
  background: #fff; border-radius: var(--radius-lg); padding: 28px;
  width: 480px; max-width: 90vw; box-shadow: var(--shadow-lg);
}
.modal-container h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
.modal-container p { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6; }
.modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }

.btn-cancel {
  padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px;
  border: 1px solid var(--border); background: #fff; color: var(--text-secondary);
  cursor: pointer; font-family: inherit;
}
.btn-cancel:hover { background: var(--gray-bg); }
.btn-confirm {
  padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px;
  border: none; color: #fff; cursor: pointer; font-family: inherit;
}
.btn-confirm.success { background: var(--success); }
.btn-confirm.success:hover { background: #059669; }
.btn-confirm.danger { background: var(--danger); }
.btn-confirm.danger:hover { background: #DC2626; }

/* ===== TOAST ===== */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ===== BACK LINK ===== */
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  margin-bottom: 16px; font-size: 12px; color: var(--text-secondary);
  cursor: pointer;
}
.back-link:hover { color: var(--primary); }

/* ===== EMPTY STATE ===== */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state .empty-text { font-size: 14px; margin-bottom: 16px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px) {
  .audit-layout { flex-direction: column; }
  .audit-sidebar { width: 100%; }
  .info-grid { grid-template-columns: 1fr; }
}
</style>

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
  return (bytes / 1048576).toFixed(1) + 'MB';
}

function now() {
  return new Date().toISOString().replace('T', ' ').substring(0, 19);
}

function showToast(msg, type) {
  type = type || '';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function() { el.remove(); }, 2000);
}

    // Merge: start from stored (has runtime changes), fill missing structural fields from DEMO
    var merged = [];
    var seenIds = {};
    stored.forEach(function(sr) {
      var dr = demoMap[sr.id];
      if (dr) {
        NEW_RECORD_FIELDS.forEach(function(k) {
          if (!(k in sr) && k in dr) { sr[k] = dr[k]; }
        });
      }
      // Migrate old senior3Form field names to new ones
      if (sr.senior3Form && sr.senior3Form.graduateSchool && !sr.senior3Form.schoolMajor) {
        var old = sr.senior3Form;
        sr.senior3Form = {
          schoolMajor: old.graduateSchool || '',
          graduateTime: old.graduateTime || '',
          workStartTime: old.workStartTime || '',
          profYears: old.profYears || '',
          qualName: old.techQualName || '',
          qualTime: old.techQualTime || '',
          employStart: old.currentPostPeriod ? old.currentPostPeriod.from : (old.employStart || ''),
          employEnd: old.currentPostPeriod ? old.currentPostPeriod.to : (old.employEnd || ''),
          targetPostName: old.targetPostName || '',
          targetStart: old.targetPostPeriod ? old.targetPostPeriod.from : (old.targetStart || ''),
          targetEnd: old.targetPostPeriod ? old.targetPostPeriod.to : (old.targetEnd || ''),
          publicMethod: old.publicityMethod || old.publicMethod || '',
          publicStart: old.publicityPeriod ? old.publicityPeriod.from : (old.publicStart || ''),
          publicEnd: old.publicityPeriod ? old.publicityPeriod.to : (old.publicEnd || '')
        };
      }
      merged.push(sr);
      seenIds[sr.id] = true;
    });
    // Add DEMO records not in stored
    DEMO_RECORDS.forEach(function(dr) {
      if (!seenIds[dr.id]) { merged.push(dr); seenIds[dr.id] = true; }
    });
    return merged;
  } catch(e) {
    localStorage.removeItem('promote_records');
    return DEMO_RECORDS.slice();
  }
}

  } catch(e) { return null; }

function computeSubmitChanges(schoolName, selected) {
  var deltas = { mgmt: {}, prof: {}, labor: {} };
  var notes = { mgmt: {}, prof: {}, labor: {} };
  var allGrades = { mgmt: MGMT_GRADES_SUMMARY, prof: PROF_SUMMARY, labor: LABOR_SUMMARY };
  ['mgmt', 'prof', 'labor'].forEach(function(cat) {
    allGrades[cat].forEach(function(g) {
      deltas[cat][g] = { total: 0, career: 0, control: 0, over: 0 };
      notes[cat][g] = [];
    });
  });
  selected.forEach(function(r) {
    var src = parseCategoryFromPost(r.currentPost);
    var srcGrade = levelToKey(r.fromLevel);
    var tgtCat = src.category;
    if (r.transferType === 'transfer' && r._targetCategory) {
      if (r._targetCategory === 'mgmt' || r._targetCategory.indexOf('管理') >= 0) tgtCat = 'mgmt';
      else if (r._targetCategory === 'labor' || r._targetCategory.indexOf('工勤') >= 0) tgtCat = 'labor';
    }
    var tgtGrade = levelToKey(r.targetLevel);
    var promoType = r.transferType === 'transfer' ? '转岗' : '晋升';
    var staffType = r._staffType || 'career';
    var srcCatLabel = getCategoryLabel(src.category);
    var tgtCatLabel = getCategoryLabel(tgtCat);
    if (srcGrade && deltas[src.category] && deltas[src.category][srcGrade]) {
      deltas[src.category][srcGrade].total -= 1;
      deltas[src.category][srcGrade][staffType] -= 1;
      notes[src.category][srcGrade].push({ name: r.teacherName, type: 'down', promoType: promoType, detail: '→ ' + tgtCatLabel + (r.targetLevel || '') });
    }
    if (tgtGrade && deltas[tgtCat] && deltas[tgtCat][tgtGrade]) {
      deltas[tgtCat][tgtGrade].total += 1;
      deltas[tgtCat][tgtGrade][staffType] += 1;
      notes[tgtCat][tgtGrade].push({ name: r.teacherName, type: 'up', promoType: promoType, detail: '← ' + srcCatLabel + (r.fromLevel || '') });
    }
  });
  return { deltas: deltas, notes: notes };
}

function cellWithDelta(schoolName, cat, g, subKey, deltas) {
  var current = subKey === 'highland' ? getHighlandCount(schoolName, g) : getEmployedVal(schoolName, cat, g, subKey);
  var d = subKey === 'highland' ? 0 : (deltas[cat] && deltas[cat][g] ? (deltas[cat][g][subKey] || 0) : 0);
  var after = current + d;
  if (d === 0) {
    var zc = current === 0 ? ' data-zero' : '';
    return '<td class="' + zc + '">' + current + '</td>';
  }
  var dc = d > 0 ? ' up' : ' down';
  return '<td><span class="cv">' + current + '</span><span class="ar">→' + after + '</span><span class="dt' + dc + '">' + (d > 0 ? '+' : '') + d + '</span></td>';
}

function renderQuotaSummary(schoolName) {
  var quota = loadSchoolQuota(schoolName);

    return '<div class="quota-card">' +
      '<div class="quota-card-header" onclick="toggleQuotaCard()">' +
      '<h3>岗位聘用汇总表</h3><span class="collapsible-arrow" id="quotaArrow">▼</span>' +

      '</div></div>';
  }

  var changes = computeSubmitChanges(schoolName, schoolRecords);
  var deltas = changes.deltas;

  function profQuotaVal(g) {
    var v = 0;
    PROF_LAYER_CONFIG.forEach(function(layer) {
      if (layer.grades.indexOf(g) !== -1) v = quota.profLevels[layer.key].levels[g] || 0;
    });
    return v;
  }

  function getQuotaVal(cat, g) {
    if (cat === 'mgmt') return (quota.mgmtLevels && quota.mgmtLevels[g]) || 0;
    if (cat === 'labor') return (quota.laborLevels && quota.laborLevels[g]) || 0;
    if (cat === 'prof') return profQuotaVal(g);
    return 0;
  }

  function shortGrade(label) { return (label || '').replace('级', ''); }

  // Compute real headcount from POST_EMPLOYED_DATA
  var careerTotal = 0, controlTotal = 0;
  ['mgmt','prof','labor'].forEach(function(c) {
    var gs = c === 'mgmt' ? MGMT_GRADES_SUMMARY : (c === 'labor' ? LABOR_SUMMARY : PROF_SUMMARY);
    gs.forEach(function(g) { careerTotal += getEmployedVal(schoolName, c, g, 'career'); controlTotal += getEmployedVal(schoolName, c, g, 'control'); });
  });
  var realTotal = careerTotal + controlTotal;

  var sections = [
    { cat: 'mgmt', title: '管理岗位', grades: MGMT_GRADES_SUMMARY, labels: MGMT_GRADE_LABELS_FULL, hasHighland: false },
    { cat: 'prof', title: '专业技术岗位', grades: PROF_SUMMARY, labels: PROF_LABELS_FLAT, hasHighland: true },
    { cat: 'labor', title: '工勤技能岗位', grades: LABOR_SUMMARY, labels: LABOR_GRADE_LABELS, hasHighland: false }
  ];

  var h = '<div class="quota-card">';
  h += '<div class="quota-card-header" onclick="toggleQuotaCard()">';
  h += '<h3>岗位聘用汇总表 — ' + escapeHtml(schoolName) + '</h3><span class="collapsible-arrow" id="quotaArrow">▼</span>';
  h += '</div>';
  h += '<div class="quota-card-body" id="quotaCardBody">';

  // Top summary row
  h += '<table class="summary-top-table" style="width:100%;margin-bottom:12px;"><tr>';
  h += '<th>定编人数</th><td>实名编<b>' + (quota.authCareerStaff || 0) + '</b>+控制数<b>' + (quota.authControlNo || 0) + '</b>（合计<b>' + (quota.totalQuota || 0) + '</b>）</td>';
  h += '<th>实有人数</th><td>实名编<b>' + careerTotal + '</b>+控制数<b>' + controlTotal + '</b>（合计<b>' + realTotal + '</b>）</td>';
  h += '<th>小高地岗位</th><td><b>' + (quota.highlandPosts || 0) + '</b></td>';
  h += '</tr></table>';

  sections.forEach(function(sec) {
    var grades = sec.grades;
    var subRows = [
      { sub: '合计', key: 'total' },
      { sub: '实名编', key: 'career' },
      { sub: '控制数', key: 'control' },
      { sub: '超岗聘用数', key: 'over' }
    ];
    if (sec.hasHighland) subRows.push({ sub: '小高地岗位', key: 'highland' });
    var nRows = 2 + subRows.length;
    h += '<table class="summary-sec-table" style="width:100%;margin-bottom:12px;"><tbody>';
    // Header
    h += '<tr><td class="sec-title" rowspan="' + nRows + '">' + sec.title + '</td>';
    h += '<th>等级</th><th></th>';
    grades.forEach(function(g) { h += '<th>' + shortGrade(sec.labels[g] || g) + '</th>'; });
    h += '<th class="note-col">备注</th></tr>';
    // 核准岗位数 row
    h += '<tr><th class="row-label-1">核准岗位数</th><th></th>';
    grades.forEach(function(g) {
      var qv = getQuotaVal(sec.cat, g);
      h += '<td' + (qv === 0 ? ' class="data-zero"' : '') + '>' + (qv != null ? qv : '—') + '</td>';
    });
    h += '<td></td></tr>';
    // 实聘数 sub-rows with deltas
    var noteHtml = renderNoteCell(sec.cat, schoolRecords);
    var schoolRemarkText = '';
    var firstRec = schoolRecords.length > 0 ? schoolRecords[0] : null;
    if (firstRec && firstRec.schoolRemarks && firstRec.schoolRemarks[sec.cat]) {
      schoolRemarkText = '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);color:var(--text-secondary);font-size:10px;">' + escapeHtml(firstRec.schoolRemarks[sec.cat]) + '</div>';
    }
    subRows.forEach(function(sr, idx) {
      h += '<tr>';
      if (idx === 0) h += '<td class="row-label-1" rowspan="' + subRows.length + '">实聘数</td>';
      h += '<td class="row-label-2">' + sr.sub + '</td>';
      grades.forEach(function(g) {
        h += cellWithDelta(schoolName, sec.cat, g, sr.key, deltas);
      });
      if (idx === 0) h += '<td class="note-col" rowspan="' + subRows.length + '">' + noteHtml + schoolRemarkText + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table>';
  });

  h += '</div></div>';
  return h;
}

function toggleQuotaCard() {
  var body = document.getElementById('quotaCardBody');
  var arrow = document.getElementById('quotaArrow');
  if (!body || !arrow) return;
  if (body.classList.contains('collapsed')) {
    body.classList.remove('collapsed');
    arrow.textContent = '▼';
  } else {
    body.classList.add('collapsed');
    arrow.textContent = '▶';
  }
}

// ===== RENDER OVER-QUOTA WARNING =====
function renderOverQuotaWarning(schoolName, schoolRecords) {
  var quota = loadSchoolQuota(schoolName);
  if (!quota) return '';

  // Count how many applicants per target level
  var levelCount = {};
  schoolRecords.forEach(function(r) {
    var lv = r.targetLevel;
    if (!lv) return;
    levelCount[lv] = (levelCount[lv] || 0) + 1;
  });

  function getQuotaForLevel(lv) {
    if (quota.mgmtLevels && quota.mgmtLevels[lv] !== undefined) return quota.mgmtLevels[lv];
    if (quota.laborLevels && quota.laborLevels[lv] !== undefined) return quota.laborLevels[lv];
    var v = 0;
    PROF_LAYER_CONFIG.forEach(function(layer) {
      if (layer.grades.indexOf(lv) !== -1) v = quota.profLevels[layer.key].levels[lv] || 0;
    });
    return v;
  }

  var warnings = [];
  Object.keys(levelCount).forEach(function(lv) {
    var q = getQuotaForLevel(lv);
    if (q === 0) {
      warnings.push(lv + '：核准岗位数为 0，但本次有 ' + levelCount[lv] + ' 人申报（无核准岗位）');
    } else {
      // Can't calculate actual usage without real employment data, just show quota
      warnings.push(lv + '：核准岗位数 ' + q + '，本次申报 ' + levelCount[lv] + ' 人');
    }
  });

  if (warnings.length === 0) return '';

  var h = '<div class="over-quota-ok">';
  h += '<strong>申报人数对照：</strong> ';
  warnings.forEach(function(w, i) {
    if (i > 0) h += '；';
    h += w;
  });
  h += '</div>';
  return h;
}

// ===== RENDER PERSON CARD =====
function renderPersonCard(record) {
  var decision = decisions[record.id];
  var cardClass = '';
  var badgeHtml = '<span class="person-badge pending">待审核</span>';
  var actionHtml = '';

  if (decision) {
    if (decision.result === 'approved') {
      cardClass = ' reviewed-approved';
      badgeHtml = '<span class="person-badge approved">已通过</span>';
    } else {
      cardClass = ' reviewed-rejected';
      badgeHtml = '<span class="person-badge rejected">已驳回</span>';
    }
  }

  // Per-person action buttons
  actionHtml += '<div class="person-actions">';
  actionHtml += '<button class="btn-person-approve' + (decision && decision.result === 'approved' ? ' active' : '') + '" onclick="approvePerson(\'' + record.id + '\')">' +
    (decision && decision.result === 'approved' ? '✓ 已通过' : '✓ 通过') + '</button>';
  actionHtml += '<button class="btn-person-reject' + (decision && decision.result === 'rejected' ? ' active' : '') + '" onclick="rejectPerson(\'' + record.id + '\')">' +
    (decision && decision.result === 'rejected' ? '✗ 已驳回' : '✗ 驳回') + '</button>';
  actionHtml += '</div>';

  // Reject reason area
  actionHtml += '<div class="reject-reason-area' + (decision && decision.result === 'rejected' ? ' show' : '') + '" id="reject-reason-' + record.id + '">';
  actionHtml += '<textarea id="reject-text-' + record.id + '" placeholder="请输入驳回理由（必填）..." oninput="updateRejectReason(\'' + record.id + '\')">' +
    (decision ? escapeHtml(decision.reason || '') : '') + '</textarea>';
  actionHtml += '</div>';

  var targetText = escapeHtml(record.fromLevel + ' → ' + record.targetLevel);
  if (record.promotionType === 'senior_3') {
    targetText = '(正高三级) ' + targetText;
  }
  if (record.transferType === 'transfer') {
    targetText = '(转岗) ' + targetText;
  }

  var html = '<div class="person-card' + cardClass + '" id="person-' + record.id + '">';
  html += '<div class="person-header">';
  html += '<div class="person-info">';
  html += '<span class="person-name">' + escapeHtml(record.teacherName) + '</span>';
  html += '<span class="person-target">' + targetText + '</span>';
  html += '</div>';
  html += '<div style="display:flex;align-items:center;gap:10px;">';
  html += badgeHtml;
  html += '<button class="btn-expand" onclick="togglePerson(\'' + record.id + '\')" id="expand-btn-' + record.id + '">展开 ▼</button>';
  html += '</div>';
  html += '</div>';

  html += '<div class="person-body" id="body-' + record.id + '" style="display:none">';
  html += renderPersonForm(record);
  html += renderPersonAttachments(record);
  html += actionHtml;
  html += '</div>';

  html += '</div>';
  return html;
}

// ===== RENDER SIDEBAR =====
function renderSidebarContent() {
  var approvedCount = 0;
  var rejectedCount = 0;
  var pendingCount = schoolRecords.length;

  Object.keys(decisions).forEach(function(id) {
    if (decisions[id].result === 'approved') { approvedCount++; pendingCount--; }
    if (decisions[id].result === 'rejected') { rejectedCount++; pendingCount--; }
  });

  var allReviewed = pendingCount === 0;

  var html = '';

  // Review summary
  html += '<div class="sidebar-section">';
  html += '<h4>审核概况</h4>';
  html += '<div class="review-summary">';
  html += '<div class="summary-item"><div class="num">' + pendingCount + '</div><div class="label">待审核</div></div>';
  html += '<div class="summary-item approved"><div class="num">' + approvedCount + '</div><div class="label">已通过</div></div>';
  html += '<div class="summary-item rejected"><div class="num">' + rejectedCount + '</div><div class="label">已驳回</div></div>';
  html += '</div>';

  // Batch info
  html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:8px;">';

  html += '<div style="margin-top:4px;">编号：' + escapeHtml(schoolRecords.length > 0 ? schoolRecords[0].batchId : '--') + '</div>';
  html += '<div style="margin-top:4px;">学校：' + escapeHtml(schoolRecords.length > 0 ? schoolRecords[0].schoolName : '--') + '</div>';
  html += '<div style="margin-top:4px;">类别：' + escapeHtml(schoolRecords.length > 0 ? schoolRecords[0].district : '--') + '</div>';
  html += '</div>';
  html += '</div>';

  // Overall action
  html += '<div class="sidebar-section">';
  html += '<h4>提交审核结果</h4>';

  if (allReviewed && rejectedCount > 0) {
    html += '<div style="font-size:12px;color:var(--warning);margin-bottom:12px;background:#FFF7ED;padding:8px 12px;border-radius:6px;">';
    html += '有 ' + rejectedCount + ' 人审核不通过，通过者标记二审通过，不通过者退回学校。';
    html += '</div>';
  } else if (allReviewed) {
    html += '<div style="font-size:12px;color:var(--success);margin-bottom:12px;background:#F0FDF4;padding:8px 12px;border-radius:6px;">';
    html += '全部 ' + schoolRecords.length + ' 人已审核通过，提交后将标记为二审通过。';
    html += '</div>';
  } else {
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">请先对所有教师完成逐一审核后再提交结果。</div>';
  }

  html += '<button class="btn-submit-review" id="btnSubmitReview" onclick="submitReviewResult()"' +
    (!allReviewed ? ' disabled' : '') + '>提交审核结果</button>';
  html += '</div>';

  var sidebar = document.getElementById('sidebarContent');
  if (sidebar) {
    sidebar.innerHTML = html;
  }
}

// ===== APPROVE PERSON =====
function approvePerson(recordId) {
  decisions[recordId] = { result: 'approved', reason: '' };

  // Update card UI
  var card = document.getElementById('person-' + recordId);
  if (card) {
    card.className = 'person-card reviewed-approved';
    card.querySelector('.person-badge').className = 'person-badge approved';
    card.querySelector('.person-badge').textContent = '已通过';
    var approveBtn = card.querySelector('.btn-person-approve');
    var rejectBtn = card.querySelector('.btn-person-reject');
    if (approveBtn) {
      approveBtn.className = 'btn-person-approve active';
      approveBtn.innerHTML = '✓ 已通过';
    }
    if (rejectBtn) {
      rejectBtn.className = 'btn-person-reject';
      rejectBtn.innerHTML = '✗ 驳回';
    }
    // Hide reject reason
    var reasonArea = document.getElementById('reject-reason-' + recordId);
    if (reasonArea) { reasonArea.classList.remove('show'); }
  }

  renderSidebarContent();
}

// ===== REJECT PERSON =====
function rejectPerson(recordId) {
  var reasonArea = document.getElementById('reject-reason-' + recordId);
  var textarea = document.getElementById('reject-text-' + recordId);

  if (!reasonArea || !textarea) return;

  // If already rejected, toggle off
  if (decisions[recordId] && decisions[recordId].result === 'rejected') {
    // Allow editing - just show the reason area
    reasonArea.classList.toggle('show');
    if (reasonArea.classList.contains('show')) {
      textarea.focus();
    }
    return;
  }

  // Show reason area
  reasonArea.classList.add('show');
  textarea.focus();

  // Mark as rejected immediately (must have reason before submit, but we set state now)
  decisions[recordId] = { result: 'rejected', reason: textarea.value || '' };

  // Update card UI
  var card = document.getElementById('person-' + recordId);
  if (card) {
    card.className = 'person-card reviewed-rejected';
    card.querySelector('.person-badge').className = 'person-badge rejected';
    card.querySelector('.person-badge').textContent = '已驳回';
    var rejectBtn = card.querySelector('.btn-person-reject');
    var approveBtn = card.querySelector('.btn-person-approve');
    if (rejectBtn) {
      rejectBtn.className = 'btn-person-reject active';
      rejectBtn.innerHTML = '✗ 已驳回';
    }
    if (approveBtn) {
      approveBtn.className = 'btn-person-approve';
      approveBtn.innerHTML = '✓ 通过';
    }
  }

  renderSidebarContent();
}

// ===== UPDATE REJECT REASON =====
function updateRejectReason(recordId) {
  var textarea = document.getElementById('reject-text-' + recordId);
  if (!textarea) return;
  if (decisions[recordId]) {
    decisions[recordId].reason = textarea.value;
  }
}

// ===== SUBMIT REVIEW RESULT =====
function submitReviewResult() {
  // Check all have been reviewed
  var unreviewed = schoolRecords.filter(function(r) { return !decisions[r.id]; });
  if (unreviewed.length > 0) {
    showToast('请先对所有教师完成审核', 'warning');
    return;
  }

  // Check that rejected records have reason
  var rejectedNoReason = schoolRecords.filter(function(r) {
    return decisions[r.id] && decisions[r.id].result === 'rejected' && !decisions[r.id].reason;
  });
  if (rejectedNoReason.length > 0) {
    showToast('请为驳回的教师填写驳回理由', 'warning');
    // Expand the first one without reason
    var first = rejectedNoReason[0];
    var body = document.getElementById('body-' + first.id);
    if (body && body.style.display === 'none') { togglePerson(first.id); }
    var textarea = document.getElementById('reject-text-' + first.id);
    if (textarea) { textarea.focus(); }
    return;
  }

  var hasRejected = Object.keys(decisions).some(function(id) { return decisions[id].result === 'rejected'; });
  var rejectedCount = Object.keys(decisions).filter(function(id) { return decisions[id].result === 'rejected'; }).length;

  if (hasRejected) {
    showConfirmModal(
      '有 ' + rejectedCount + ' 人审核不通过（退回学校），' + (schoolRecords.length - rejectedCount) + ' 人审核通过。确认提交？',
      '确认提交',
      'danger',
      function() { doSaveReviewResult(); }
    );
  } else {
    showConfirmModal(
      '确认通过该校全部 ' + schoolRecords.length + ' 人的申请？',
      '确认通过',
      'success',
      function() { doSaveReviewResult(); }
    );
  }
}

function doSaveReviewResult() {
  var records = loadRecords();
  var approverName = getApproverName();
  var currentTime = now();
  var approvedCount = 0, rejectedCount = 0;

  schoolRecords.forEach(function(schoolRecord) {
    var idx = records.findIndex(function(r) { return r.id === schoolRecord.id; });
    if (idx === -1) return;
    var decision = decisions[schoolRecord.id];

    if (decision && decision.result === 'rejected') {
      records[idx].status = 'second_rejected';
      records[idx].secondReviewer = approverName;
      records[idx].secondReviewTime = currentTime;
      records[idx].secondRejectReason = decision.reason || '';
      records[idx].timeline = records[idx].timeline || [];
      records[idx].timeline.push({
        time: currentTime, action: '二审驳回', operator: approverName, opinion: records[idx].secondRejectReason
      });
      rejectedCount++;
    } else {
      records[idx].status = 'second_approved';
      records[idx].secondReviewer = approverName;
      records[idx].secondReviewTime = currentTime;
      records[idx].secondReviewOpinion = '同意';
      records[idx].timeline = records[idx].timeline || [];
      records[idx].timeline.push({
        time: currentTime, action: '二审通过', operator: approverName, opinion: '同意'
      });
      approvedCount++;
    }
  });

  saveRecords(records);

  var toastMsg = '二审完成：' + approvedCount + ' 人通过';
  if (rejectedCount > 0) toastMsg += '，' + rejectedCount + ' 人退回';
  showToast(toastMsg, rejectedCount > 0 ? 'warning' : 'success');

  setTimeout(function() {
    window.location.href = 'promote-list-admin.html?role=' + currentRole;
  }, 1000);
}

// ===== CONFIRM MODAL =====
function showConfirmModal(message, confirmText, confirmClass, callback) {
  closeModal();

  var html = '<div class="modal-overlay" id="confirmModal">' +
    '<div class="modal-container">' +
    '<h3>提交审核结果</h3>' +
    '<p>' + message + '</p>' +
    '<div class="modal-buttons">' +
    '<button class="btn-cancel" onclick="closeModal()">取消</button>' +
    '<button class="btn-confirm ' + confirmClass + '" id="modalConfirmBtn">' + confirmText + '</button>' +
    '</div>' +
    '</div>' +
    '</div>';

  document.body.insertAdjacentHTML('beforeend', html);

  document.getElementById('modalConfirmBtn').onclick = function() {
    closeModal();
    callback();
  };

  // Click overlay to close
  document.getElementById('confirmModal').addEventListener('click', function(e) {
    if (e.target === this) { closeModal(); }
  });
}

function closeModal() {
  var el = document.getElementById('confirmModal');
  if (el) { el.remove(); }
}

// ===== RENDER PAGE =====
function renderPage() {
  if (schoolRecords.length === 0) {
    document.getElementById('mainContent').innerHTML =
      '<div class="back-link" onclick="goBack()">← 返回列表</div>' +
      '<div class="card"><div class="card-body empty-state">' +
      '<div class="empty-icon">📋</div>' +
      '<div class="empty-text">未找到待审核记录</div>' +
      '<div style="color:var(--text-light);font-size:13px;">请确认学校名称和批次编号是否正确，或该批次已无待审核的申请。</div>' +
      '</div></div>';
    return;
  }

  if (!checkPermission()) {
    var reason = '';
    if (currentRole === 'school') {
      reason = '学校管理员无二审审批权限，仅主管单位（市/区教育局）可进行二审操作';
    } else if (currentRole === 'teacher') {
      reason = '教师无审核权限';
    } else {
      reason = '您没有权限审批该申请';
    }
    document.getElementById('mainContent').innerHTML =
      '<div class="back-link" onclick="goBack()">← 返回列表</div>' +
      '<div class="card"><div class="card-body empty-state">' +
      '<div class="empty-icon">🔒</div>' +
      '<div class="empty-text">无操作权限</div>' +
      '<div style="color:var(--text-light);font-size:13px;">' + reason + '</div>' +
      '</div></div>';
    return;
  }

  var schoolName = schoolRecords[0].schoolName;
  var batchName = schoolRecords[0].batchName;
  var count = schoolRecords.length;

  var html = '<div class="back-link" onclick="goBack()">← 返回列表</div>';

  // Page header
  html += '<div class="page-header">';
  html += '<div class="page-header-left">';
  html += '<h1>材料审核 — ' + escapeHtml(schoolName) + '（' + count + '人）</h1>';
  html += '<div class="meta">批次：' + escapeHtml(batchName) + ' | 编号：' + escapeHtml(schoolRecords[0].batchId) + ' | 类别：' + escapeHtml(schoolRecords[0].district) + '</div>';
  html += '</div>';
  html += '<span class="status-badge pending">待主管部门二审</span>';
  html += '</div>';

  html += '<div class="audit-layout">';

  // MAIN COLUMN
  html += '<div class="audit-main">';
  html += '<div class="progress-bar"><div class="step-wrapper">' + renderProgress(2) + '</div></div>';

  // Batch-level public notice (shown once)
  html += renderBatchPublicNotice();

  // Quota summary table
	var schoolNameQuota = schoolRecords.length > 0 ? schoolRecords[0].schoolName : '';
	html += renderQuotaSummary(schoolNameQuota);

		// Person cards
  schoolRecords.forEach(function(record) {
    html += renderPersonCard(record);
  });
  html += '</div>';

  // SIDEBAR
  html += '<div class="audit-sidebar" id="sidebarContent"></div>';

  html += '</div>';

  document.getElementById('mainContent').innerHTML = html;
  renderSidebarContent();
}

// ===== NAVIGATION =====
function goBack() {
  window.location.href = listUrl;
}

// ===== SIDEBAR MENU =====
function switchRole(role) {
  if (role === 'school') { window.location.href = 'promote-list-school.html'; return; }
  if (role === 'teacher') { window.location.href = 'promote-list-teacher.html'; return; }
  if (role === currentRole) return;

  var params = new URLSearchParams(window.location.search);
  window.location.href = 'promote-audit-second.html?school=' +
    encodeURIComponent(schoolRecords.length > 0 ? schoolRecords[0].schoolName : '') +
    '&batch=' + (schoolRecords.length > 0 ? schoolRecords[0].batchId : '') +
    '&role=' + role;
}

function updateRoleUI() {
  var roleData = ROLES[currentRole];
  document.getElementById('userAvatar').textContent = roleData.short;
  document.getElementById('userName').textContent = roleData.name;
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === currentRole);
  });
  document.getElementById('breadcrumbList').setAttribute('href', listUrl);
}

function renderSidebar() {
  renderSidebarMenu('sidebarMenu', currentRole, 'promote');
}

function sidebarClick(el, id) {
  if (arguments.length === 1) { id = el; el = null; }
  if (el) { document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); }); el.classList.add('active'); }
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') {
    if (currentRole === 'city' || currentRole === 'district') { window.location.href = '教师入编管理（主管单位视角）.html?role=' + currentRole; return; }
    if (currentRole === 'school') { window.location.href = '教师入编管理（学校管理员视角）.html?role=school'; return; }
  }
  if (id === 'exit') {
    if (currentRole === 'city' || currentRole === 'district') { window.location.href = '教师出编管理（主管单位视角）.html?role=' + currentRole; return; }
    if (currentRole === 'school') { window.location.href = '教师出编管理（学校管理员视角）.html?role=school'; return; }
  }
  if (id === 'postset') { window.location.href = 'post-list-admin.html?role=' + currentRole; return; }
  if (id === 'promote') { window.location.href = listUrl; return; }
  if (id === 'recruit') { window.location.href = 'recruit-list-admin.html?role=' + currentRole; return; }
  if (id === 'employ') { var url = getEmployUrl(); if (url) window.location.href = url; else showToast('跳转至：聘用手续办理'); return; }
  if (id === 'contract-entry') { var cr = (typeof currentUser!=='undefined' && currentUser) ? currentUser.role : (typeof currentRole!=='undefined'?currentRole:''); window.location.href = (cr === 'city' || cr === 'district') ? 'contract-entry-list-admin.html' : 'contract-entry-list-school.html'; return; }
  if (id === 'contract-exit') { var cr2 = (typeof currentUser!=='undefined' && currentUser) ? currentUser.role : (typeof currentRole!=='undefined'?currentRole:''); window.location.href = (cr2 === 'city' || cr2 === 'district') ? 'contract-exit-list-admin.html' : 'contract-exit-list-school.html'; return; }

  if (id === 'ledger') { var lr = (typeof currentUser!=='undefined'?currentUser.role:currentRole); window.location.href = (lr === 'city' || lr === 'district') ? 'org-ledger-admin.html' : lr === 'school' ? 'org-ledger-school.html' : 'workbench.html'; return; }


  else if (id === 'account') { window.location.href = 'account-management.html'; }

  else if (id === 'org') { window.location.href = 'org-management.html'; }
  if (id === 'announcement') { window.location.href = 'announcement-management.html'; return; }
  showToast('跳转至：' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function toggleUserMenu() {
  document.getElementById('userDropdown').classList.toggle('show');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.topnav-user')) document.getElementById('userDropdown').classList.remove('show');
});

// ===== RESET DEMO DATA =====
function resetDemoData() {
  localStorage.removeItem('promote_records');
  location.reload();
}

// ===== INIT =====
(function init() {
  var params = new URLSearchParams(window.location.search);
  var urlRole = params.get('role');
  if (urlRole === 'city' || urlRole === 'district' || urlRole === 'school' || urlRole === 'teacher') {
    currentRole = urlRole;
  }
  listUrl = 'promote-list-admin.html?role=' + currentRole;
  updateRoleUI();
  renderSidebar();

  seedPostRecords();

  var schoolName = params.get('school');
  var batchId = params.get('batch');
  var recordId = params.get('id');

  if (schoolName && batchId) {
    // Direct school+batch lookup
    schoolRecords = getSchoolBatchRecords(schoolName, batchId);
  } else if (recordId) {
    // Lookup by record id, then find its school+batch group
    var all = loadRecords();
    var record = all.find(function(r) { return r.id === recordId; });
    if (record) {
      schoolRecords = getSchoolBatchRecords(record.schoolName, record.batchId);
    } else {
      schoolRecords = [];
    }
  } else {
    // Default: show 柳州市第八中学 pending_second records
    schoolRecords = getSchoolBatchRecords('柳州市第八中学', 'PB20260501001');
  }

  renderPage();
})();

</script>
