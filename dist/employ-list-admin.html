    {id:'EMP20260609001',businessType:'recruitment',recruitBatchName:'2026年中高级人才招聘',schoolName:'柳州市第八中学',schoolCategory:'鱼峰区属',status:'pending_second',submitTime:'2026-06-09 14:00:00',
      formData:{positions:[{batchName:'2026年中高级人才招聘',positionName:'高中化学教师',rosterRows:[{name:'陈刚'}]},{batchName:'2026年直属学校统一公招',positionName:'高中生物教师',rosterRows:[{name:'刘洋'},{name:'孙丽'}]}]},
      firstReviewResult:'approved',firstReviewer:'李振华',firstReviewTime:'2026-06-10 10:00:00',hrResult:{approvalNo:'柳人社函[2026]88号',approvalDate:'2026-06-12',result:'approved'},timeline:[{time:'2026-06-09 14:00',action:'学校提交申报',operator:'王玉兰'},{time:'2026-06-10 10:00',action:'主管一审通过',operator:'李振华'},{time:'2026-06-12 16:00',action:'学校录入人社结果',operator:'王玉兰'}],attachments:[]},
    {id:'EMP20260608001',businessType:'transfer',recruitBatchName:'',schoolName:'柳州市第八中学',schoolCategory:'鱼峰区属',status:'completed',submitTime:'2026-06-08 11:00:00',
      formData:{transferRows:[{name:'黄丽',gender:'女'},{name:'周杰',gender:'男'}]},
      firstReviewResult:'approved',firstReviewer:'李振华',firstReviewTime:'2026-06-09 09:00:00',secondReviewResult:'approved',secondReviewer:'李振华',secondReviewTime:'2026-06-13 10:00:00',timeline:[{time:'2026-06-08 11:00',action:'学校提交申报',operator:'王玉兰'},{time:'2026-06-09 09:00',action:'主管一审通过',operator:'李振华'},{time:'2026-06-12 16:00',action:'学校录入人社结果',operator:'王玉兰'},{time:'2026-06-13 10:00',action:'主管二审通过',operator:'李振华'}],attachments:[]}
  ];
  var demoIds={};demos.forEach(function(r){demoIds[r.id]=true;});
  var merged=existing.filter(function(r){return !demoIds[r.id];}).concat(demos);
  localStorage.setItem('employ_records',JSON.stringify(merged));
  return JSON.parse(JSON.stringify(merged));
}
function saveEmployRecords(r){localStorage.setItem('employ_records',JSON.stringify(r));}

function getStatusBadgeClass(s){
  if(s==='pending_first'||s==='pending_second')return'pending';
  if(s==='first_approved'||s==='completed')return'approved';
  if(s==='first_rejected'||s==='second_rejected')return'rejected';
  return'';
}

function getBatchNames(r){
  if(r.businessType&&r.businessType!=='recruitment')return['—'];
  var names=[],seen={};
  if(r.formData&&r.formData.batchSummaries){
    Object.keys(r.formData.batchSummaries).forEach(function(bid){
      var n=r.formData.batchSummaries[bid].batchName;
      if(n&&!seen[n]){seen[n]=true;names.push(n);}
    });
  }
  if(r.formData&&r.formData.positions){
    r.formData.positions.forEach(function(p){
      if(p.batchName&&!seen[p.batchName]){seen[p.batchName]=true;names.push(p.batchName);}
    });
  }
  if(names.length===0&&r.recruitBatchName){names.push(r.recruitBatchName);}
  return names.length>0?names:['—'];
}

function getDistrict(schoolName){
  var sd=SCHOOL_DATA[schoolName];
  return sd?sd.district||'—':'—';
}

function renderSidebar(){
  var rd=ROLES[currentRole];if(!rd)return;
  var h='';
  (rd.sidebar.top||[]).forEach(function(i){h+='<a class="menu-item" onclick="sidebarClick(this,\''+i.id+'\')">'+(ICONS[i.icon]||'')+'<span class="menu-label">'+i.label+'</span></a>';});
  (rd.sidebar.groups||[]).forEach(function(g){
    h+='<div class="menu-group">'+g.name+'</div>';
    g.items.forEach(function(i){h+='<a class="menu-item'+(i.id==='employ'?' active':'')+'" onclick="sidebarClick(this,\''+i.id+'\')">'+(ICONS[MENU_ICONS[i.id]||'file'])+'<span class="menu-label">'+i.label+'</span>'+(i.badge?'<span class="menu-badge">'+i.badge+'</span>':'')+'</a>';});
  });
  document.getElementById('sidebarMenu').innerHTML=h;
}
function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') { window.location.href = currentRole === 'school' ? '教师入编管理（学校管理员视角）.html' : '教师入编管理（学校管理员视角）.html'; return; }
  if (id === 'exit') { window.location.href = '教师出编管理（学校管理员视角）.html'; return; }
  if (id === 'postset') { window.location.href = currentRole === 'school' ? 'post-list-school.html' : 'post-list-admin.html?role=' + currentRole; return; }
  if (id === 'promote') { window.location.href = currentRole === 'school' ? 'promote-list-school.html' : currentRole === 'teacher' ? 'promote-list-teacher.html' : 'promote-list-admin.html?role=' + currentRole; return; }
  if (id === 'recruit') { window.location.href = currentRole === 'school' ? 'recruit-list-school.html' : 'recruit-list-admin.html?role=' + currentRole; return; }
  if (id === 'employ') { window.location.href = currentRole === 'school' ? 'employ-list-school.html' : 'employ-list-admin.html?role=' + currentRole; return; }
  if (id === 'retire') { showToast('退休呈报页面开发中'); return; }
  if (id === 'salary') { showToast('工资核定申请页面开发中'); return; }
  if (id === 'ethics') { showToast('师德师风举报页面开发中'); return; }
  if (id === 'honor') { showToast('荣誉申请页面开发中'); return; }
  if (id === 'account') { window.location.href = 'account-management.html'; return; }
  else if (id === 'ledger') { var _r3 = (typeof currentUser!=='undefined'?currentUser.role:currentRole); window.location.href = (_r3 === 'city' || _r3 === 'district') ? 'org-ledger-admin.html' : _r3 === 'school' ? 'org-ledger-school.html' : 'workbench.html'; }

  if (id === 'dashboard' { showToast('编制岗位台账页面开发中'); return; }
  showToast('跳转至：' + (el.textContent || id));
}
function switchRole(role){
  if(role==='school'){window.location.href='employ-list-school.html';return;}
  if(role==='city'||role==='district'){window.location.href='employ-list-admin.html?role='+role;return;}
}
function updateRoleUI(){
  var rd=ROLES[currentRole];if(!rd)return;
  document.getElementById('userAvatar').textContent=rd.short;
  document.getElementById('userName').textContent=rd.name;
  document.querySelectorAll('.role-switch-btn').forEach(function(b){b.classList.toggle('active',b.dataset.role===currentRole);});
}

function renderList(){
  var all = loadEmployRecords();
  var records = all;
  if(currentRole==='district'){
    records = all.filter(function(r){return r.schoolCategory==='鱼峰区属';});
  }
  var counts = {all:records.length,pending:0,approved:0,rejected:0};
  records.forEach(function(r){
    if(r.status==='pending_first'||r.status==='pending_second')counts.pending++;
    else if(r.status==='first_approved'||r.status==='completed')counts.approved++;
    else if(r.status==='first_rejected'||r.status==='second_rejected')counts.rejected++;
  });

  var filters = [
    {key:'all',label:'全部('+counts.all+')'},
    {key:'pending',label:'待审核('+counts.pending+')'},
    {key:'approved',label:'已通过('+counts.approved+')'},
    {key:'rejected',label:'已驳回('+counts.rejected+')'}
  ];
  var fb=document.getElementById('filterBar');fb.innerHTML='';
  filters.forEach(function(f){
    var b=document.createElement('button');b.className='filter-pill'+(currentFilter===f.key?' active':'');b.textContent=f.label;
    b.onclick=function(){currentFilter=f.key;renderList();};fb.appendChild(b);
  });

  var statusMap={pending:['pending_first','pending_second'],approved:['first_approved','completed'],rejected:['first_rejected','second_rejected']};
  var filtered=records;
  if(currentFilter!=='all'&&statusMap[currentFilter]){
    filtered=records.filter(function(r){return statusMap[currentFilter].indexOf(r.status)>=0;});
  }

  var list=document.getElementById('recordList');var empty=document.getElementById('emptyState');
  if(filtered.length===0){list.innerHTML='<div class="list-card"><div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无申报记录</div></div></div>';empty.style.display='none';return;}
  empty.style.display='none';

  var h='<div class="list-card"><div class="table-scroll"><table class="list-table"><thead><tr>';
  h+='<th>申请编号</th>';
  h+='<th>学校名称</th>';
  h+='<th>所属区域</th>';
  h+='<th>业务类型</th>';
  h+='<th>关联批次</th>';
  h+='<th>岗位数</th>';
  h+='<th>人数</th>';
  h+='<th>提交时间</th>';
  h+='<th>状态</th>';
  h+='<th>操作</th>';
  h+='</tr></thead><tbody>';

  filtered.forEach(function(r){
    var tLabel=r.businessType==='recruitment'?'招聘':(r.businessType==='transfer'?'调动':(r.persons?'招聘':'调动'));var tCls=r.businessType||(r.persons?'recruitment':'');
    var sLabel=STATUS_MAP[r.status]||r.status;var badgeCls=getStatusBadgeClass(r.status);
    var batchNames=getBatchNames(r);
    var hasFormData = r.formData && (r.formData.positions||r.formData.transferRows);
    var posCount = (r.businessType==='recruitment'&&r.formData&&r.formData.positions) ? r.formData.positions.length : (r.persons?r.persons.length:'—');
    var personCount = '—';
    if(r.formData){
      if(r.businessType==='recruitment'&&r.formData.positions){
        personCount = r.formData.positions.reduce(function(s,p){return s+(p.rosterRows||[]).length;},0);
      }else if(r.businessType==='transfer'&&r.formData.transferRows){
        personCount = r.formData.transferRows.length;
      }
    }
    if(personCount==='—'&&r.persons){personCount=r.persons.length;}
    var timeStr=r.submitTime?r.submitTime.substring(5,16):'—';

    h+='<tr>';
    h+='<td class="col-id" onclick="viewDetail(\''+r.id+'\')">'+escapeHtml(r.id)+'</td>';
    h+='<td class="col-name">'+escapeHtml(r.schoolName)+'</td>';
    h+='<td>'+getDistrict(r.schoolName)+'</td>';
    h+='<td><span class="type-tag '+tCls+'">'+tLabel+'</span></td>';
    h+='<td class="col-left">';
    batchNames.forEach(function(n){h+='<div class="batch-line">'+escapeHtml(n)+'</div>';});
    h+='</td>';
    h+='<td>'+posCount+'</td>';
    h+='<td>'+personCount+'</td>';
    h+='<td style="font-size:12px;">'+timeStr+'</td>';
    h+='<td><span class="status-badge '+badgeCls+'">'+sLabel+'</span></td>';
    h+='<td class="col-action"><div class="action-links">';
    h+='<a class="action-link" onclick="viewDetail(\''+r.id+'\')">查看</a>';
    if(r.status==='pending_first'){h+='<a class="action-link success" onclick="goFirstAudit(\''+r.id+'\')">一审</a>';}
    if(r.status==='pending_second'){h+='<a class="action-link success" onclick="goSecondAudit(\''+r.id+'\')">二审</a>';}
    h+='</div></td></tr>';
  });
  h+='</tbody></table></div></div>';
  list.innerHTML=h;
}
function viewDetail(id){window.location.href='employ-detail.html?id='+id;}
function goFirstAudit(id){window.location.href='employ-audit-first.html?id='+id+'&role='+currentRole;}
function goSecondAudit(id){window.location.href='employ-audit-second.html?id='+id+'&role='+currentRole;}

(function init(){
  var params=new URLSearchParams(window.location.search);
  var urlRole=params.get('role');
  if(urlRole==='city'||urlRole==='district')currentRole=urlRole;
  updateRoleUI();renderSidebar();renderList();
})();
</script>
