<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师离职管理 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top:0; left:0; right:0; height:56px; background:linear-gradient(135deg,#1E3A8A,#1E40AF); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display:flex; align-items:center; gap:14px; }
.topnav-logo { width:38px; height:38px; background:rgba(255,255,255,0.18); border-radius:10px; display:flex; align-items:center; justify-content:center; }
.topnav-logo svg { width:24px; height:24px; }
.topnav-title { font-size:17px; font-weight:600; color:#fff; letter-spacing:1px; }
.topnav-right { display:flex; align-items:center; gap:18px; }
.topnav-bell { position:relative; cursor:pointer; color:rgba(255,255,255,0.85); padding:6px; border-radius:6px; transition:var(--transition); }
.topnav-bell:hover { background:rgba(255,255,255,0.1); color:#fff; }
.topnav-bell .badge { position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.topnav-user { display:flex; align-items:center; gap:8px; cursor:pointer; color:rgba(255,255,255,0.9); padding:6px 12px; border-radius:6px; transition:var(--transition); font-size:13px; position:relative; }
.topnav-user:hover { background:rgba(255,255,255,0.1); }
.topnav-user .avatar { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
.user-dropdown { display:none; position:absolute; top:46px; right:0; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-lg); min-width:160px; z-index:200; overflow:hidden; }
.user-dropdown.show { display:block; }
.user-dropdown a { display:block; padding:12px 18px; font-size:13px; color:var(--text); text-decoration:none; transition:var(--transition); }
.user-dropdown a:hover { background:var(--primary-light); color:var(--primary); }
.sidebar { position:fixed; top:56px; left:0; bottom:0; width:var(--sidebar-w); background:#1E3A8A; z-index:90; overflow-y:auto; display:flex; flex-direction:column; transition:width var(--transition); }
.sidebar.collapsed { width:64px; }
.sidebar.collapsed .menu-label,.sidebar.collapsed .menu-group,.sidebar.collapsed .menu-badge,.sidebar.collapsed .role-switcher-label,.sidebar.collapsed .role-switcher-name { display:none; }
.sidebar.collapsed .menu-item { justify-content:center; padding:12px 0; }
.sidebar.collapsed .menu-icon { margin-right:0; }
.sidebar-menu { flex:1; padding:8px 0; }
.menu-group { padding:14px 20px 4px; font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; }
.menu-item { display:flex; align-items:center; padding:10px 20px; cursor:pointer; font-size:13px; font-weight:400; color:rgba(255,255,255,0.7); transition:var(--transition); position:relative; text-decoration:none; border-left:3px solid transparent; }
.menu-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
.menu-item.active { background:rgba(255,255,255,0.08); color:#fff; font-weight:500; border-left-color:var(--accent); }
.menu-item .menu-icon { width:18px; height:18px; margin-right:10px; flex-shrink:0; opacity:0.7; }
.menu-item.active .menu-icon { opacity:1; }
.menu-item .menu-badge { margin-left:auto; background:var(--danger); color:#fff; font-size:10px; padding:2px 7px; border-radius:10px; font-weight:600; }
.sidebar-bottom { border-top:1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display:flex; align-items:center; gap:8px; padding:10px 20px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.5); transition:var(--transition); }
.sidebar-toggle:hover { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.8); }
.sidebar-toggle svg { width:16px; height:16px; transition:transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform:rotate(180deg); }
.role-switcher { padding:10px 16px 12px; border-top:1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:1px; margin-bottom:8px; padding:0 4px; }
.role-switcher-options { display:flex; flex-direction:column; gap:4px; }
.role-switch-btn { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.55); transition:var(--transition); border:1px solid transparent; background:transparent; font-family:inherit; width:100%; text-align:left; }
.role-switch-btn:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.8); }
.role-switch-btn.active { background:rgba(59,130,246,0.2); color:#fff; border-color:rgba(59,130,246,0.4); font-weight:500; }
.role-switch-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.role-switch-dot.city { background:#3B82F6; }
.role-switch-dot.district { background:#F59E0B; }
.role-switch-dot.school { background:#10B981; }
.role-switch-dot.teacher { background:#A78BFA; }
.main { margin-left:var(--sidebar-w); margin-top:56px; padding:24px; min-height:calc(100vh - 56px); transition:margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left:64px; }
.breadcrumb { font-size:12px; color:var(--text-light); margin-bottom:16px; }
.breadcrumb a { color:var(--text-light); text-decoration:none; }
.breadcrumb a:hover { color:var(--primary); }
.breadcrumb span { color:var(--text-secondary); }
.page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.page-header h1 { font-size:20px; font-weight:700; }
.page-header .subtitle { font-size:12px; color:var(--text-light); margin-top:2px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; font-size:13px; font-weight:500; border-radius:6px; cursor:pointer; font-family:inherit; transition:var(--transition); border:1px solid transparent; text-decoration:none; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-danger { background:var(--danger); color:#fff; border-color:var(--danger); }
.btn-danger:hover { filter:brightness(0.93); }
.btn-primary:hover { background:var(--primary-dark); }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-outline { background:#fff; color:var(--text-secondary); border:1px solid var(--border); }
.btn-outline:hover { background:var(--gray-bg); }
.btn-success { background:var(--success); color:#fff; border-color:var(--success); }
.btn-success:hover { filter:brightness(0.95); }
/* toolbar */
.list-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
.filter-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.filter-pill { padding:6px 16px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--border); background:#fff; color:var(--text-secondary); transition:var(--transition); font-family:inherit; }
.filter-pill:hover { border-color:var(--accent); color:var(--primary); }
.filter-pill.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.search-box { position:relative; }
.search-box svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-light); }
.search-input { padding:8px 12px 8px 32px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; width:240px; }
.search-input:focus { outline:none; border-color:var(--accent); }
/* Table list */
.list-card { background:#fff; border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow-sm); overflow:hidden; }
.table-scroll { overflow-x:auto; }
.list-table { width:100%; border-collapse:collapse; font-size:13px; }
.list-table th { padding:11px 14px; text-align:center; font-weight:600; font-size:11px; color:var(--text-secondary); background:#F8FAFC; border-bottom:1px solid var(--border); white-space:nowrap; }
.list-table td { padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; text-align:center; }
.list-table tr.data-row:hover { background:#FAFBFC; }
.list-table .col-id { color:var(--primary); font-weight:600; cursor:pointer; }
.list-table .col-id:hover { text-decoration:underline; }
.status-badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:500; }
.status-badge.pending { background:#FEF3C7; color:#92400E; }
.status-badge.approved { background:#D1FAE5; color:#065F46; }
.status-badge.rejected { background:#FEE2E2; color:#991B1B; }
.status-badge.draft { background:#E2E8F0; color:#475569; }
.type-tag { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:500; background:#EFF6FF; color:var(--primary); }
.type-tag.multi { background:#F3E8FF; color:#6B21A8; }
.expand-btn { cursor:pointer; color:var(--primary); font-size:12px; user-select:none; display:inline-flex; align-items:center; gap:4px; }
.expand-icon { display:inline-block; transition:transform .2s; font-size:10px; }
.expand-icon.open { transform:rotate(90deg); }
/* expanded detail row */
.detail-row td { background:#F8FAFC; padding:0 !important; border-bottom:1px solid var(--border); }
.detail-panel { padding:18px 22px; }
.detail-panel h4 { font-size:13px; font-weight:600; margin:0 0 10px; color:var(--text); display:flex; align-items:center; gap:6px; }
.detail-panel h4:not(:first-child) { margin-top:18px; }
.detail-table { width:100%; border-collapse:collapse; font-size:12px; background:#fff; }
.detail-table th { padding:8px 10px; background:#fff; border:1px solid var(--border); font-size:11px; color:var(--text-secondary); font-weight:600; }
.detail-table td { padding:8px 10px; border:1px solid var(--border); text-align:center; }
.att-links { display:flex; flex-wrap:wrap; gap:10px; }
.att-link { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--border); border-radius:6px; padding:6px 12px; font-size:12px; color:var(--primary); cursor:pointer; text-decoration:none; transition:var(--transition); }
.att-link:hover { border-color:var(--accent); background:var(--primary-light); }
.att-link svg { width:14px; height:14px; }
.reject-note { background:#FEF2F2; border:1px solid #FECACA; border-radius:6px; padding:10px 12px; font-size:12px; color:#991B1B; margin-top:14px; }
.detail-actions { margin-top:16px; display:flex; gap:10px; }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-light); }
.empty-state .empty-icon { font-size:40px; margin-bottom:12px; }
.empty-state .empty-text { font-size:14px; }
/* modal */
.modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.5); display:none; align-items:flex-start; justify-content:center; z-index:1000; overflow-y:auto; padding:40px 20px; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); width:100%; max-width:880px; animation:modalIn .25s ease; margin:auto; }
@keyframes modalIn { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
.modal-header { padding:18px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-header h2 { font-size:16px; font-weight:600; }
.modal-header .sub { font-size:12px; color:var(--text-light); margin-top:2px; font-weight:400; }
.modal-close { cursor:pointer; color:var(--text-light); font-size:24px; line-height:1; background:none; border:none; padding:0 4px; }
.modal-close:hover { color:var(--text); }
.modal-body { padding:20px 24px; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
.section-title { font-size:13px; font-weight:600; margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; }
.section-title .req { color:var(--danger); }
.entry-table { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:10px; }
.entry-table th { padding:8px; font-size:11px; color:var(--text-secondary); background:#F8FAFC; border:1px solid var(--border); font-weight:600; }
.entry-table td { padding:6px; border:1px solid var(--border); vertical-align:middle; }
.entry-table input, .entry-table select { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:12px; font-family:inherit; }
.entry-table input:focus, .entry-table select:focus { outline:none; border-color:var(--accent); }
.entry-table .row-del { color:var(--danger); cursor:pointer; font-size:16px; }
.entry-table .row-del:hover { opacity:0.7; }
.add-row-btn { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--primary); cursor:pointer; padding:6px 12px; border:1px dashed var(--accent); border-radius:6px; background:var(--primary-light); }
.add-row-btn:hover { background:#DBEAFE; }
.upload-section { margin-top:20px; padding-top:18px; border-top:1px solid var(--border); }
.upload-label { font-size:13px; font-weight:600; margin-bottom:8px; display:block; }
.upload-label .req { color:var(--danger); }
.upload-label .hint { font-size:11px; color:var(--text-light); font-weight:400; margin-left:6px; }
.dropzone { border:2px dashed var(--border); border-radius:var(--radius); padding:20px; text-align:center; cursor:pointer; transition:var(--transition); color:var(--text-secondary); font-size:13px; }
.dropzone:hover { border-color:var(--accent); background:var(--primary-light); color:var(--primary); }
.dropzone svg { width:26px; height:26px; margin-bottom:6px; opacity:0.6; }
.file-chip { display:inline-flex; align-items:center; gap:8px; background:var(--gray-bg); padding:6px 12px; border-radius:6px; font-size:12px; margin-top:8px; }
.file-chip svg { width:14px; height:14px; color:var(--primary); }
.file-chip .rm { color:var(--danger); cursor:pointer; font-weight:700; }
.checklist-container { display:flex; flex-direction:column; gap:4px; }
.checklist-item { display:flex; align-items:center; gap:4px; font-size:11px; padding:3px 0; }
.checklist-icon { font-size:12px; flex-shrink:0; }
.checklist-name { flex-shrink:0; color:var(--text-secondary); min-width:110px; font-size:10px; }
.checklist-upload-btn { font-size:10px; padding:2px 8px; background:#F8FAFC; border:1px solid var(--border); border-radius:3px; cursor:pointer; color:var(--primary); font-family:inherit; flex-shrink:0; }
.checklist-upload-btn:hover { background:var(--primary-light); }
.checklist-file-name { font-size:10px; color:#10B981; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:70px; cursor:default; }
.file-remove { color:var(--danger); cursor:pointer; margin-left:2px; font-size:12px; }
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#1E293B; color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:9999; animation:toastIn .3s ease; box-shadow:var(--shadow-lg); }
.toast.warning { background:var(--warning); color:#1E293B; }
.toast.success { background:var(--success); }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
</style>
</head>

<nav class="topnav">

</nav>

<aside class="sidebar" id="sidebar"><div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="role-switcher"><div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options">

      <button class="role-switch-btn active" data-role="school" onclick="switchRole('school')"><span class="role-switch-dot school"></span><span class="role-switcher-name">校管理员</span></button>
      <button class="role-switch-btn" data-role="teacher" onclick="switchRole('teacher')"><span class="role-switch-dot teacher"></span><span class="role-switcher-name">教&emsp;师</span></button>

</div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="delConfirmModal" style="z-index:1100;">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <div><h2>确认删除</h2></div>
      <button class="modal-close" onclick="closeDelConfirm()">&times;</button>
    </div>
    <div class="modal-body">
      <p id="delConfirmMsg" style="font-size:14px;color:var(--text);line-height:1.7;margin:0;"></p>
    </div>

      <button class="btn btn-outline" onclick="closeDelConfirm()">取消</button>
      <button class="btn btn-danger" onclick="confirmDeleteRow()">确认删除</button>
    </div>
  </div>

var ALLOWED_EXTS=['.pdf','.jpg','.jpeg','.png','.bmp','.gif','.doc','.docx','.xls','.xlsx'];
var BLOCKED_EXTS=['.zip','.rar','.7z','.tar','.gz','.bz2','.xz','.tgz'];
var MAX_FILE_SIZE=10*1024*1024;

function validateFile(file){
  var ext='.'+file.name.split('.').pop().toLowerCase();
  if(BLOCKED_EXTS.indexOf(ext)>=0) return '不支持压缩包格式（'+ext+'），请解压后上传';
  if(ALLOWED_EXTS.indexOf(ext)<0) return '不支持的文件格式：'+ext;
  if(file.size>MAX_FILE_SIZE) return '文件过大（'+(file.size/1024/1024).toFixed(1)+'MB），单个文件不能超过 10MB';
  return null;
}

function nowStr(){
  var d=new Date();
  function p(n){return (n<10?'0':'')+n;}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function p3(n){ n=String(n); while(n.length<3)n='0'+n; return n; }
function genId(){
  var d=new Date();
  function p(n){return (n<10?'0':'')+n;}
  var prefix='CX'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  var all=loadRecords();
  var max=0;
  all.forEach(function(r){ if(r.id&&r.id.indexOf(prefix)===0){ var seq=parseInt(r.id.slice(prefix.length),10); if(!isNaN(seq)&&seq>max)max=seq; } });
  return prefix+p3(max+1);
}

    h+='<td><select onchange="setField('+i+',\'gender\',this.value)"><option value="">请选择</option><option value="男"'+(t.gender==='男'?' selected':'')+'>男</option><option value="女"'+(t.gender==='女'?' selected':'')+'>女</option></select></td>';
    h+='<td><input value="'+escapeHtml(t.idCard)+'" placeholder="18位身份证号" maxlength="18" oninput="setField('+i+',\'idCard\',this.value)"></td>';
    h+='<td><select onchange="setField('+i+',\'exitType\',this.value)"><option value="">请选择</option>';
    EXIT_TYPES.forEach(function(opt){ h+='<option value="'+opt+'"'+(t.exitType===opt?' selected':'')+'>'+opt+'</option>'; });
    h+='</select></td>';
    h+='<td><input type="date" value="'+escapeHtml(t.exitDate)+'" oninput="setField('+i+',\'exitDate\',this.value)"></td>';
    // 证明材料列 — checklist 上传
    h+='<td><div class="checklist-container">';
    var mats=t.materials||{};
    EXIT_MATERIALS.forEach(function(item){
      var uploaded=mats[item];
      var isMulti=item===MULTI_FILE_MATERIAL;
      var hasFiles=isMulti?(Array.isArray(uploaded)&&uploaded.length>0):!!uploaded;
      h+='<div class="checklist-item">';
      h+='<span class="checklist-icon">'+(hasFiles?'&#9745;':'&#9744;')+'</span>';
      var hint=isMulti?'(可上传多个)':'(单文件)';
      h+='<span class="checklist-name">'+escapeHtml(item)+' <span style="font-size:9px;color:var(--text-light);">'+hint+'</span></span>';
      h+='<button class="checklist-upload-btn" onclick="triggerMaterialUpload(event,'+i+',\''+escapeHtml(item)+'\')">上传</button>';
      if(hasFiles){
        if(isMulti){
          uploaded.forEach(function(f,fi){
            h+='<span style="display:inline-flex;align-items:center;gap:1px;">';
            h+='<span class="checklist-file-name" title="'+escapeHtml(f.name)+'" style="max-width:60px;">'+escapeHtml(f.name.substring(0,6))+'...</span>';
            h+='<span class="file-remove" onclick="event.stopPropagation();removeMaterialFile('+i+',\''+escapeHtml(item)+'\','+fi+')">×</span>';
            h+='</span>';
          });
        }else{
          h+='<span style="display:inline-flex;align-items:center;gap:1px;">';
          h+='<span class="checklist-file-name" title="'+escapeHtml(uploaded.name)+'" style="max-width:60px;">'+escapeHtml(uploaded.name.substring(0,8))+'...</span>';
          h+='<span class="file-remove" onclick="event.stopPropagation();removeMaterialFile('+i+',\''+escapeHtml(item)+'\')">×</span>';
          h+='</span>';
        }
      }
      h+='</div>';
    });
    h+='</div></td>';
    h+='<td style="text-align:center;"><span class="row-del" title="删除" onclick="delTeacherRow('+i+')">&times;</span></td>';
    h+='</tr>';
  });
  tb.innerHTML=h;
  // 动态生成每行的隐藏 file input
  var fiContainer=document.getElementById('rowFileInputs');
  var fiHtml='';
  modalTeachers.forEach(function(t,i){
    fiHtml+='<input type="file" id="rowFileInput_'+i+'" accept=".pdf,.jpg,.jpeg,.png,.bmp,.gif,.doc,.docx,.xls,.xlsx" style="display:none;" onchange="handleMaterialFile('+i+',event)">';
  });
  fiContainer.innerHTML=fiHtml;
}
function setField(i,field,val){ if(modalTeachers[i]) modalTeachers[i][field]=val; }
function addTeacherRow(){ modalTeachers.push({name:'',gender:'',idCard:'',exitType:'',exitDate:'',materials:{}}); renderEntryRows(); }

function onContractNameChange(idx,val){
  modalTeachers[idx].name=val;
  var found=null;
  for(var i=0;i<DEMO_CONTRACT_STAFF.length;i++){
    if(DEMO_CONTRACT_STAFF[i].name===val){ found=DEMO_CONTRACT_STAFF[i]; break; }
  }
  if(found){
    modalTeachers[idx].gender=found.gender;
    modalTeachers[idx].idCard=found.idCard;
  }else{
    modalTeachers[idx].gender='';
    modalTeachers[idx].idCard='';
  }
  renderEntryRows();
}

function triggerMaterialUpload(e,idx,itemName){
  e.stopPropagation();
  pendingMaterialUpload={rowIdx:idx,materialItem:itemName};
  var fi=document.getElementById('rowFileInput_'+idx);
  if(fi){ fi.value=''; fi.click(); }
}
function handleMaterialFile(idx,event){
  if(!event.target.files||!event.target.files[0]){ pendingMaterialUpload=null; return; }
  var file=event.target.files[0];
  var err=validateFile(file);
  if(err){ showToast(err,'warning'); pendingMaterialUpload=null; return; }
  if(!pendingMaterialUpload||pendingMaterialUpload.rowIdx!==idx){ pendingMaterialUpload=null; return; }
  var itemName=pendingMaterialUpload.materialItem;
  pendingMaterialUpload=null;
  if(!modalTeachers[idx].materials) modalTeachers[idx].materials={};
  if(itemName===MULTI_FILE_MATERIAL){
    if(!Array.isArray(modalTeachers[idx].materials[itemName])){
      modalTeachers[idx].materials[itemName]=[];
    }
    modalTeachers[idx].materials[itemName].push(file);
  }else{
    modalTeachers[idx].materials[itemName]=file;
  }
  renderEntryRows();
  event.target.value='';
}
function removeMaterialFile(rowIdx,itemName,fileIndex){
  if(modalTeachers[rowIdx]&&modalTeachers[rowIdx].materials){
    if(itemName===MULTI_FILE_MATERIAL&&fileIndex!==undefined){
      var arr=modalTeachers[rowIdx].materials[itemName];
      if(Array.isArray(arr)){ arr.splice(fileIndex,1); if(arr.length===0){ delete modalTeachers[rowIdx].materials[itemName]; } }
    }else{
      delete modalTeachers[rowIdx].materials[itemName];
    }
  }
  renderEntryRows();
}
var pendingDelIdx=null;
function teacherRowHasData(i){
  var t=modalTeachers[i]; if(!t) return false;
  return !!((t.name&&t.name.trim())||(t.idCard&&t.idCard.trim())||t.gender||t.exitType||t.exitDate);
}
function delTeacherRow(i){
  if(modalTeachers.length<=1){ showToast('至少保留 1 名教师','warning'); return; }
  if(!teacherRowHasData(i)){ modalTeachers.splice(i,1); renderEntryRows(); return; }
  pendingDelIdx=i;
  var nm=(modalTeachers[i].name||'').trim();
  document.getElementById('delConfirmMsg').innerHTML='确定删除第 '+(i+1)+' 行教师'+(nm?'「'+escapeHtml(nm)+'」':'')+'？<br>删除后该行离职信息将被移除。';
  document.getElementById('delConfirmModal').classList.add('show');
}
function confirmDeleteRow(){ if(pendingDelIdx!==null){ modalTeachers.splice(pendingDelIdx,1); renderEntryRows(); } pendingDelIdx=null; closeDelConfirm(); }
function closeDelConfirm(){ document.getElementById('delConfirmModal').classList.remove('show'); pendingDelIdx=null; }

function collectTeachers(){
  return modalTeachers.map(function(t){
    var mats={};
    var src=t.materials||{};
    EXIT_MATERIALS.forEach(function(item){
      if(item===MULTI_FILE_MATERIAL){
        if(Array.isArray(src[item])&&src[item].length>0){
          mats[item]=src[item].map(function(f){ return {name:f.name,size:f.size}; });
        }
      }else{
        if(src[item]) mats[item]={name:src[item].name,size:src[item].size};
      }
    });
    return {name:t.name,gender:t.gender,idCard:t.idCard,exitType:t.exitType,exitDate:t.exitDate,materials:mats};
  });
}

function validateFull(){
  if(modalTeachers.length<1){ showToast('请至少录入 1 名教师','warning'); return false; }
  for(var i=0;i<modalTeachers.length;i++){
    var t=modalTeachers[i]; var no=(i+1);
    if(!t.name||!t.name.trim()){ showToast('第'+no+'行：请填写姓名','warning'); return false; }
    if(!t.gender){ showToast('第'+no+'行：请选择性别','warning'); return false; }
    if(!t.idCard||!/^\d{17}[\dXx]$/.test(t.idCard.trim())){ showToast('第'+no+'行：身份证号格式不正确','warning'); return false; }
    if(!t.exitType){ showToast('第'+no+'行：请选择离职类型','warning'); return false; }
    if(!t.exitDate){ showToast('第'+no+'行：请选择离职日期','warning'); return false; }
  }
  return true;
}

function submitApplication(){
  if(!validateFull())return;
  var t=nowStr();
  var newId=genId();
  var rec={ id:newId, schoolName:currentSchool, district:currentDistrict, status:'pending', submitTime:t,
    teachers:collectTeachers(), reviewer:null, reviewTime:null, rejectReason:'',
    timeline:[{time:t,action:'学校提交申报',operator:'王玉兰'}] };
  var all=loadRecords(); all.unshift(rec); saveRecords(all);
  closeNewModal();
  currentFilter='all';
  showToast('离职申报已提交，等待主管部门审核','success');
  renderList();
}

document.getElementById('newModal').addEventListener('click',function(e){ if(e.target===this) closeNewModal(); });

/* ---------- init ---------- */
(function init(){
  updateRoleUI();
  renderSidebar();
  renderList();
})();
</script>
</body>
</html>
