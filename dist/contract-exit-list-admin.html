<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top:0; left:0; right:0; height:56px; background:linear-gradient(135deg,#1E3A8A,#1E40AF); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display:flex; align-items:center; gap:14px; }
.topnav-logo { width:38px; height:38px; background:rgba(255,255,255,0.18); border-radius:10px; display:flex; align-items:center; justify-content:center; }
.topnav-logo svg { width:24px; height:24px; }
.topnav-title { font-size:17px; font-weight:600; color:#fff; letter-spacing:1px; }
.topnav-right { display:flex; align-items:center; gap:18px; }
.topnav-bell { position:relative; cursor:pointer; color:rgba(255,255,255,0.85); padding:6px; border-radius:6px; transition:var(--transition); }
.topnav-bell:hover { background:rgba(255,255,255,0.1); color:#fff; }
.topnav-bell .badge { position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.topnav-user { display:flex; align-items:center; gap:8px; cursor:pointer; color:rgba(255,255,255,0.9); padding:6px 12px; border-radius:6px; transition:var(--transition); font-size:13px; position:relative; }
.topnav-user:hover { background:rgba(255,255,255,0.1); }
.topnav-user .avatar { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
.user-dropdown { display:none; position:absolute; top:46px; right:0; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-lg); min-width:160px; z-index:200; overflow:hidden; }
.user-dropdown.show { display:block; }
.user-dropdown a { display:block; padding:12px 18px; font-size:13px; color:var(--text); text-decoration:none; transition:var(--transition); }
.user-dropdown a:hover { background:var(--primary-light); color:var(--primary); }
.sidebar { position:fixed; top:56px; left:0; bottom:0; width:var(--sidebar-w); background:#1E3A8A; z-index:90; overflow-y:auto; display:flex; flex-direction:column; transition:width var(--transition); }
.sidebar.collapsed { width:64px; }
.sidebar.collapsed .menu-label,.sidebar.collapsed .menu-group,.sidebar.collapsed .menu-badge,.sidebar.collapsed .role-switcher-label,.sidebar.collapsed .role-switcher-name { display:none; }
.sidebar.collapsed .menu-item { justify-content:center; padding:12px 0; }
.sidebar.collapsed .menu-icon { margin-right:0; }
.sidebar-menu { flex:1; padding:8px 0; }
.menu-group { padding:14px 20px 4px; font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; }
.menu-item { display:flex; align-items:center; padding:10px 20px; cursor:pointer; font-size:13px; font-weight:400; color:rgba(255,255,255,0.7); transition:var(--transition); position:relative; text-decoration:none; border-left:3px solid transparent; }
.menu-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
.menu-item.active { background:rgba(255,255,255,0.08); color:#fff; font-weight:500; border-left-color:var(--accent); }
.menu-item .menu-icon { width:18px; height:18px; margin-right:10px; flex-shrink:0; opacity:0.7; }
.menu-item.active .menu-icon { opacity:1; }
.menu-item .menu-badge { margin-left:auto; background:var(--danger); color:#fff; font-size:10px; padding:2px 7px; border-radius:10px; font-weight:600; }
.sidebar-bottom { border-top:1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display:flex; align-items:center; gap:8px; padding:10px 20px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.5); transition:var(--transition); }
.sidebar-toggle:hover { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.8); }
.sidebar-toggle svg { width:16px; height:16px; transition:transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform:rotate(180deg); }
.role-switcher { padding:10px 16px 12px; border-top:1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:1px; margin-bottom:8px; padding:0 4px; }
.role-switcher-options { display:flex; flex-direction:column; gap:4px; }
.role-switch-btn { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.55); transition:var(--transition); border:1px solid transparent; background:transparent; font-family:inherit; width:100%; text-align:left; }
.role-switch-btn:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.8); }
.role-switch-btn.active { background:rgba(59,130,246,0.2); color:#fff; border-color:rgba(59,130,246,0.4); font-weight:500; }
.role-switch-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.role-switch-dot.city { background:#3B82F6; }
.role-switch-dot.district { background:#F59E0B; }
.role-switch-dot.school { background:#10B981; }
.role-switch-dot.teacher { background:#A78BFA; }
.main { margin-left:var(--sidebar-w); margin-top:56px; padding:24px; min-height:calc(100vh - 56px); transition:margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left:64px; }
.breadcrumb { font-size:12px; color:var(--text-light); margin-bottom:16px; }
.breadcrumb a { color:var(--text-light); text-decoration:none; }
.breadcrumb a:hover { color:var(--primary); }
.breadcrumb span { color:var(--text-secondary); }
.page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.page-header h1 { font-size:20px; font-weight:700; }
.page-header .subtitle { font-size:12px; color:var(--text-light); margin-top:2px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; font-size:13px; font-weight:500; border-radius:6px; cursor:pointer; font-family:inherit; transition:var(--transition); border:1px solid transparent; text-decoration:none; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { background:var(--primary-dark); }
.btn-sm { padding:6px 13px; font-size:12px; }
.btn-outline { background:#fff; color:var(--text-secondary); border:1px solid var(--border); }
.btn-outline:hover { background:var(--gray-bg); }
.btn-success { background:var(--success); color:#fff; border-color:var(--success); }
.btn-success:hover { filter:brightness(0.95); }
.btn-danger-outline { background:#fff; color:var(--danger); border:1px solid #FECACA; }
.btn-danger-outline:hover { background:#FEF2F2; }
.btn-danger { background:var(--danger); color:#fff; border-color:var(--danger); }
.btn-danger:hover { filter:brightness(0.95); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
/* toolbar */
.list-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
.filter-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.filter-pill { padding:6px 16px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--border); background:#fff; color:var(--text-secondary); transition:var(--transition); font-family:inherit; }
.filter-pill:hover { border-color:var(--accent); color:var(--primary); }
.filter-pill.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.school-select { padding:7px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; background:#fff; color:var(--text); cursor:pointer; min-width:180px; }
.school-select:focus { outline:none; border-color:var(--accent); }
.school-search { padding:7px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; background:#fff; color:var(--text); min-width:200px; outline:none; }
.school-search:focus { border-color:var(--accent); }
/* Table list */
.list-card { background:#fff; border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow-sm); overflow:hidden; }
.table-scroll { overflow-x:auto; }
.list-table { width:100%; border-collapse:collapse; font-size:13px; }
.list-table th { padding:11px 14px; text-align:center; font-weight:600; font-size:11px; color:var(--text-secondary); background:#F8FAFC; border-bottom:1px solid var(--border); white-space:nowrap; }
.list-table td { padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; text-align:center; }
.list-table tr.data-row:hover { background:#FAFBFC; }
.list-table .col-id { color:var(--primary); font-weight:600; white-space:nowrap; }
.list-table .col-school { text-align:left; font-weight:500; }
.region-tag { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; background:var(--gray-bg); color:var(--text-secondary); }
.status-badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:500; }
.status-badge.pending { background:#FEF3C7; color:#92400E; }
.status-badge.approved { background:#D1FAE5; color:#065F46; }
.status-badge.rejected { background:#FEE2E2; color:#991B1B; }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-light); }
.empty-state .empty-icon { font-size:40px; margin-bottom:12px; }
.empty-state .empty-text { font-size:14px; }
/* modal */
.modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.5); display:none; align-items:flex-start; justify-content:center; z-index:1000; overflow-y:auto; padding:60px 20px; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); width:100%; max-width:480px; animation:modalIn .25s ease; margin:auto; }
@keyframes modalIn { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
.modal-header { padding:18px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-header h2 { font-size:16px; font-weight:600; }
.modal-header .sub { font-size:12px; color:var(--text-light); margin-top:2px; font-weight:400; }
.modal-close { cursor:pointer; color:var(--text-light); font-size:24px; line-height:1; background:none; border:none; padding:0 4px; }
.modal-close:hover { color:var(--text); }
.modal-body { padding:20px 24px; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
.modal-textarea { width:100%; min-height:96px; border:1px solid var(--border); border-radius:6px; padding:10px; font-size:13px; font-family:inherit; resize:vertical; }
.modal-textarea:focus { outline:none; border-color:var(--accent); }
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#1E293B; color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:9999; animation:toastIn .3s ease; box-shadow:var(--shadow-lg); }
.toast.warning { background:var(--warning); color:#1E293B; }
.toast.success { background:var(--success); }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
</style>
</head>

    groups:[
      {name:'编制管理',items:[{id:'staffing',label:'编制使用申请'},{id:'entry',label:'入编申请',badge:1},{id:'exit',label:'教师出编管理'}]},
      {name:'岗位管理',items:[{id:'postset',label:'岗位设置申请'},{id:'promote',label:'岗位晋升申请',badge:3},{id:'recruit',label:'招聘岗位申请'}]},
      {name:'聘用管理',items:[{id:'employ',label:'聘用手续办理'}]},
      {name:'编外教师管理',items:[{id:'contract-entry',label:'教师入职管理'},{id:'contract-exit',label:'教师离职管理'}]},
      {name:'人事管理',items:[{id:'retire',label:'退休呈报'},{id:'ethics',label:'师德师风举报'}]},

};

var STORAGE_KEY = 'contract_exit_records';
var STATUS_MAP = { pending:'待审核', approved:'已通过', rejected:'已驳回' };
var currentRole = 'city';
var currentFilter = 'all';
var schoolFilter = 'all';

function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(m,t){var e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;document.getElementById('toastContainer').appendChild(e);setTimeout(function(){e.remove();},2500);}
function toggleUserMenu(){document.getElementById('userDropdown').classList.toggle('show');}
document.addEventListener('click',function(e){if(!e.target.closest('.topnav-user'))document.getElementById('userDropdown').classList.remove('show');});
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed');}
function fmtSize(b){ if(!b&&b!==0)return''; if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function nowStr(){ var d=new Date(); function p(n){return (n<10?'0':'')+n;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }

/* ---------- data ---------- */
function loadRecords(){
  var s=localStorage.getItem(STORAGE_KEY);
  var existing=[];
  if(s){try{existing=JSON.parse(s);}catch(e){}}
  if(existing && existing.length){ return JSON.parse(JSON.stringify(existing)); }
  var demos=[
    { id:'CX20260701001', schoolName:'柳州市第八中学', district:'鱼峰区', status:'pending', submitTime:'2026-07-01 09:20:00',

        {name:'梁晓彤',gender:'女',idCard:'450203199607182024',exitType:'辞职',exitDate:'2026-06-30',materials:{'辞职申请书':{name:'辞职申请书_梁晓彤.pdf',size:124000}}},
        {name:'韦俊明',gender:'男',idCard:'450203199503095517',exitType:'辞退',exitDate:'2026-07-15',materials:{'单位同意离职批复':{name:'批复_韦俊明.pdf',size:98000}}}

      teachers:[
        {name:'黄志强',gender:'男',idCard:'450203199001124513',exitType:'合同到期不续签',exitDate:'2026-06-30',materials:{}},
        {name:'罗美玲',gender:'女',idCard:'450203199206052026',exitType:'退休',exitDate:'2026-07-01',materials:{'其他佐证材料':{name:'佐证_罗美玲.pdf',size:76000}}}
      ],
      reviewer:'李振华', reviewTime:'2026-06-26 09:15:00', rejectReason:'',
      timeline:[{time:'2026-06-25 10:40:00',action:'学校提交申报',operator:'王玉兰'},{time:'2026-06-26 09:15:00',action:'主管部门审核通过',operator:'李振华'}] },
    { id:'CX20260610001', schoolName:'柳州高级中学', district:'市直属', status:'rejected', submitTime:'2026-06-10 15:05:00',
      teachers:[
        {name:'吴佳怡',gender:'女',idCard:'450203199704187042',exitType:'其他',exitDate:'2026-06-20',materials:{'辞职申请书':{name:'辞职申请书_吴佳怡.pdf',size:76000}}}
      ],
      reviewer:'张建国', reviewTime:'2026-06-11 11:00:00', rejectReason:'证明材料不齐全，请补充单位同意离职批复。',
      timeline:[{time:'2026-06-10 15:05:00',action:'学校提交申报',operator:'王玉兰'},{time:'2026-06-11 11:00:00',action:'主管部门审核驳回',operator:'张建国',opinion:'证明材料不齐全，请补充单位同意离职批复。'}] }

function saveRecords(r){localStorage.setItem(STORAGE_KEY, JSON.stringify(r));}
function findIn(arr,id){ for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];} return null; }

/* records visible to current admin scope (district filter only) */
function scopeRecords(all){
  if(currentRole==='district'){ return all.filter(function(r){return r.district==='鱼峰区';}); }
  return all;
}
/* records shown in the table (scope + school filter + status filter) */
function getFilteredRecords(){
  var records=scopeRecords(loadRecords());
  if(schoolFilter!=='all'){ records=records.filter(function(r){return r.schoolName.indexOf(schoolFilter)>=0;}); }
  if(currentFilter!=='all'){ records=records.filter(function(r){return r.status===currentFilter;}); }
  return records;
}

/* ---------- sidebar / role ---------- */
function renderSidebar(){
  renderSidebarMenu('sidebarMenu', currentRole, 'contract-exit');
}
function sidebarClick(el,id){
  if (arguments.length === 1) { id = el; el = null; }
  if(id==='contract-exit'){return;}
  if(id==='workbench'){window.location.href='workbench.html';return;}
  if(id==='ledger'){window.location.href='org-ledger-admin.html';return;}
  if(id==='staffing'){window.location.href='staffing-application.html';return;}
  if(id==='entry'){window.location.href='教师入编管理（学校管理员视角）.html';return;}
  if(id==='exit'){window.location.href='教师出编管理（学校管理员视角）.html';return;}
  if(id==='postset'){window.location.href='post-list-admin.html?role='+currentRole;return;}
  if(id==='promote'){window.location.href='promote-list-admin.html?role='+currentRole;return;}
  if(id==='recruit'){window.location.href='recruit-list-admin.html?role='+currentRole;return;}
  if(id==='employ'){window.location.href='employ-list-admin.html?role='+currentRole;return;}
  if(id==='contract-entry'){window.location.href='contract-entry-list-admin.html?role='+currentRole;return;}
  if(id==='retire'){window.location.href='retire-list-admin.html?role='+currentRole;return;}
  if(id==='ethics'){showToast('师德师风举报页面开发中');return;}
  if(id==='account'){window.location.href='account-management.html';return;}
  if(id==='org'){window.location.href='org-management.html';return;}
  if(id==='perm'){showToast('角色权限页面开发中');return;}
  if(id==='log'){showToast('操作日志页面开发中');return;}
  if (id === 'announcement') { window.location.href = 'announcement-management.html'; return; }
  showToast('跳转至：'+(el.textContent||id));
}
function switchRole(role){
  if(role==='school'){window.location.href='contract-exit-list-school.html';return;}
  if(role==='city'||role==='district'){window.location.href='contract-exit-list-admin.html?role='+role;return;}
}
function updateRoleUI(){
  var rd=ROLES[currentRole]; if(!rd)return;
  document.getElementById('userAvatar').textContent=rd.short;
  document.getElementById('userName').textContent=rd.name;
  document.querySelectorAll('.role-switch-btn').forEach(function(b){b.classList.toggle('active',b.dataset.role===currentRole);});
}

/* ---------- list ---------- */
function onSchoolSearch(){
  var v=(document.getElementById('schoolSearch').value||'').trim();
  schoolFilter=v||'all';
  renderList();
}

function buildSchoolDatalist(){
  var scope=scopeRecords(loadRecords());
  var seen={}, opts=[];
  scope.forEach(function(r){ if(!seen[r.schoolName]){ seen[r.schoolName]=true; opts.push(r.schoolName); } });
  opts.sort();
  var dl=document.getElementById('schoolList');
  var h='';
  opts.forEach(function(s){ h+='<option value="'+escapeHtml(s)+'">'; });
  dl.innerHTML=h;
}

function renderFilters(){
  var records=scopeRecords(loadRecords());
  if(schoolFilter!=='all'){ records=records.filter(function(r){return r.schoolName.indexOf(schoolFilter)>=0;}); }
  var counts={ all:records.length, pending:0, approved:0, rejected:0 };
  records.forEach(function(r){ if(counts[r.status]!==undefined) counts[r.status]++; });
  var filters=[
    {key:'all',label:'全部('+counts.all+')'},
    {key:'pending',label:'待审核('+counts.pending+')'},
    {key:'approved',label:'已通过('+counts.approved+')'},
    {key:'rejected',label:'已驳回('+counts.rejected+')'}
  ];
  var fb=document.getElementById('filterBar'); fb.innerHTML='';
  filters.forEach(function(f){
    var b=document.createElement('button');
    b.className='filter-pill'+(currentFilter===f.key?' active':'');
    b.textContent=f.label;
    b.onclick=function(){currentFilter=f.key; renderList();};
    fb.appendChild(b);
  });
}

function renderList(){
  buildSchoolDatalist();
  renderFilters();

  var filtered=getFilteredRecords();
  var list=document.getElementById('recordList');
  if(filtered.length===0){
    list.innerHTML='<div class="list-card"><div class="empty-state"><div class="empty-icon">&#128196;</div><div class="empty-text">暂无离职申报记录</div></div></div>';
    return;
  }

  var h='<div class="list-card"><div class="table-scroll"><table class="list-table"><thead><tr>';
  h+='<th>申请编号</th><th style="text-align:left;">单位名称</th><th>所属区县</th><th>申报人数</th><th>提交时间</th><th>状态</th><th style="width:120px;">操作</th>';
  h+='</tr></thead><tbody>';

  filtered.forEach(function(r){
    var statusLabel=STATUS_MAP[r.status]||r.status;
    var teacherCount=(r.teachers||[]).length;
    var actionBtn;
    if(r.status==='pending'){
      actionBtn='<button class="btn btn-primary btn-sm" onclick="location.href=\'contract-exit-detail.html?id='+escapeHtml(r.id)+'&mode=audit&role='+currentRole+'\'">审核</button>';
    }else{
      actionBtn='<button class="btn btn-outline btn-sm" onclick="location.href=\'contract-exit-detail.html?id='+escapeHtml(r.id)+'&role='+currentRole+'\'">查看</button>';
    }
    h+='<tr class="data-row">';
    h+='<td class="col-id">'+escapeHtml(r.id)+'</td>';
    h+='<td class="col-school">'+escapeHtml(r.schoolName)+'</td>';
    h+='<td><span class="region-tag">'+escapeHtml(r.district)+'</span></td>';
    h+='<td>'+teacherCount+' 人</td>';
    h+='<td style="font-size:12px;">'+escapeHtml(r.submitTime||'—')+'</td>';
    h+='<td><span class="status-badge '+r.status+'">'+statusLabel+'</span></td>';
    h+='<td>'+actionBtn+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  list.innerHTML=h;
}

/* ---------- init ---------- */
(function init(){
  var params=new URLSearchParams(window.location.search);
  var urlRole=params.get('role');
  if(urlRole==='city'||urlRole==='district') currentRole=urlRole;
  updateRoleUI();
  renderSidebar();
  renderList();
})();
</script>
