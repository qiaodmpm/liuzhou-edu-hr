<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入职申报 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top:0; left:0; right:0; height:56px; background:linear-gradient(135deg,#1E3A8A,#1E40AF); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display:flex; align-items:center; gap:14px; }
.topnav-logo { width:38px; height:38px; background:rgba(255,255,255,0.18); border-radius:10px; display:flex; align-items:center; justify-content:center; }
.topnav-logo svg { width:24px; height:24px; }
.topnav-title { font-size:17px; font-weight:600; color:#fff; letter-spacing:1px; }
.topnav-right { display:flex; align-items:center; gap:18px; }
.topnav-bell { position:relative; cursor:pointer; color:rgba(255,255,255,0.85); padding:6px; border-radius:6px; transition:var(--transition); }
.topnav-bell:hover { background:rgba(255,255,255,0.1); color:#fff; }
.topnav-bell .badge { position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.topnav-user { display:flex; align-items:center; gap:8px; cursor:pointer; color:rgba(255,255,255,0.9); padding:6px 12px; border-radius:6px; transition:var(--transition); font-size:13px; position:relative; }
.topnav-user:hover { background:rgba(255,255,255,0.1); }
.topnav-user .avatar { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
.user-dropdown { display:none; position:absolute; top:46px; right:0; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-lg); min-width:160px; z-index:200; overflow:hidden; }
.user-dropdown.show { display:block; }
.user-dropdown a { display:block; padding:12px 18px; font-size:13px; color:var(--text); text-decoration:none; transition:var(--transition); }
.user-dropdown a:hover { background:var(--primary-light); color:var(--primary); }
.sidebar { position:fixed; top:56px; left:0; bottom:0; width:var(--sidebar-w); background:#1E3A8A; z-index:90; overflow-y:auto; display:flex; flex-direction:column; transition:width var(--transition); }
.sidebar.collapsed { width:64px; }
.sidebar.collapsed .menu-label,.sidebar.collapsed .menu-group,.sidebar.collapsed .menu-badge,.sidebar.collapsed .role-switcher-label,.sidebar.collapsed .role-switcher-name { display:none; }
.sidebar.collapsed .menu-item { justify-content:center; padding:12px 0; }
.sidebar.collapsed .menu-icon { margin-right:0; }
.sidebar-menu { flex:1; padding:8px 0; }
.menu-group { padding:14px 20px 4px; font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; }
.menu-item { display:flex; align-items:center; padding:10px 20px; cursor:pointer; font-size:13px; font-weight:400; color:rgba(255,255,255,0.7); transition:var(--transition); position:relative; text-decoration:none; border-left:3px solid transparent; }
.menu-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
.menu-item.active { background:rgba(255,255,255,0.08); color:#fff; font-weight:500; border-left-color:var(--accent); }
.menu-item .menu-icon { width:18px; height:18px; margin-right:10px; flex-shrink:0; opacity:0.7; }
.menu-item.active .menu-icon { opacity:1; }
.menu-item .menu-badge { margin-left:auto; background:var(--danger); color:#fff; font-size:10px; padding:2px 7px; border-radius:10px; font-weight:600; }
.sidebar-bottom { border-top:1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display:flex; align-items:center; gap:8px; padding:10px 20px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.5); transition:var(--transition); }
.sidebar-toggle:hover { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.8); }
.sidebar-toggle svg { width:16px; height:16px; transition:transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform:rotate(180deg); }
.role-switcher { padding:10px 16px 12px; border-top:1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:1px; margin-bottom:8px; padding:0 4px; }
.role-switcher-options { display:flex; flex-direction:column; gap:4px; }
.role-switch-btn { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.55); transition:var(--transition); border:1px solid transparent; background:transparent; font-family:inherit; width:100%; text-align:left; }
.role-switch-btn:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.8); }
.role-switch-btn.active { background:rgba(59,130,246,0.2); color:#fff; border-color:rgba(59,130,246,0.4); font-weight:500; }
.role-switch-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.role-switch-dot.city { background:#3B82F6; } .role-switch-dot.district { background:#F59E0B; } .role-switch-dot.school { background:#10B981; } .role-switch-dot.teacher { background:#A78BFA; }
.main { margin-left:var(--sidebar-w); margin-top:56px; padding:24px; min-height:calc(100vh - 56px); transition:margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left:64px; }
.breadcrumb { font-size:12px; color:var(--text-light); margin-bottom:16px; }
.breadcrumb a { color:var(--text-light); text-decoration:none; }
.breadcrumb a:hover { color:var(--primary); }
.breadcrumb span { color:var(--text-secondary); }
.page-header { margin-bottom:20px; display:flex; align-items:flex-start; justify-content:space-between; }
.page-header h1 { font-size:20px; font-weight:700; }
.page-header .subtitle { font-size:12px; color:var(--text-light); margin-top:2px; }
.form-card { background:#fff; border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow-sm); padding:28px 32px; margin-bottom:20px; }
.form-card-title { font-size:15px; font-weight:600; color:var(--text); padding-bottom:16px; margin-bottom:20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
.edit-table { width:100%; border-collapse:collapse; font-size:12.5px; }
.edit-table th { padding:8px; background:#F1F5F9; font-weight:600; font-size:11px; color:var(--text-secondary); text-align:left; border:1px solid var(--border); white-space:nowrap; }
.edit-table td { padding:6px 8px; border:1px solid var(--border); vertical-align:middle; }
.edit-table input, .edit-table select { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:5px; font-size:12.5px; font-family:inherit; color:var(--text); outline:none; }
.edit-table input:focus, .edit-table select:focus { border-color:var(--accent); }
.date-pair { display:flex; align-items:center; gap:4px; }
.date-pair span { color:var(--text-light); font-size:11px; }
.row-remove { cursor:pointer; color:var(--danger); font-size:16px; line-height:1; background:none; border:none; padding:2px 6px; }
.row-remove:hover { color:#B91C1C; }
.checklist-container { display:flex; flex-direction:column; gap:3px; }
.checklist-item { display:flex; align-items:center; gap:3px; font-size:10px; padding:2px 0; }
.checklist-icon { font-size:11px; flex-shrink:0; }
.checklist-cname { flex-shrink:0; color:var(--text-secondary); min-width:72px; font-size:10px; }
.checklist-upload-btn { font-size:9px; padding:1px 6px; background:#F8FAFC; border:1px solid var(--border); border-radius:3px; cursor:pointer; color:var(--primary); font-family:inherit; flex-shrink:0; }
.checklist-upload-btn:hover { background:var(--primary-light); }
.checklist-file-tag { font-size:9px; color:#10B981; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:55px; cursor:default; display:inline-flex; align-items:center; gap:1px; }
.file-remove { color:var(--danger); cursor:pointer; font-size:12px; flex-shrink:0; }
.add-row-btn { margin-top:10px; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--primary); cursor:pointer; padding:6px 14px; border:1px dashed var(--accent); border-radius:6px; background:var(--primary-light); transition:var(--transition); }
.add-row-btn:hover { background:#DBEAFE; }
.up-tip { font-size:11.5px; color:var(--text-light); margin-top:10px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; font-size:13px; font-weight:500; border-radius:6px; cursor:pointer; font-family:inherit; transition:var(--transition); border:1px solid transparent; text-decoration:none; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { background:var(--primary-dark); }
.btn-outline { background:#fff; color:var(--text-secondary); border:1px solid var(--border); }
.btn-outline:hover { background:var(--gray-bg); }
.btn-lg { padding:10px 28px; font-size:14px; }
.form-footer { display:flex; justify-content:space-between; align-items:center; padding-top:8px; }
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#1E293B; color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:9999; animation:toastIn .3s ease; box-shadow:var(--shadow-lg); }
.toast.warning { background:var(--warning); color:#1E293B; }
.toast.success { background:var(--success); }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
</style>
</head>

<script>
window.onerror = function(msg,url,line){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#FEE2E2;color:#991B1B;padding:16px 20px;font-family:monospace;font-size:13px;';d.innerHTML='ERROR: '+msg+' (line '+line+')<br><button onclick="location.reload()" style="margin-top:8px;padding:6px 16px;cursor:pointer;">重新加载</button>';document.body.prepend(d);};

var currentRole='school';
var CURRENT_SCHOOL='柳州市第八中学';
var CURRENT_DISTRICT='鱼峰区';
var ENTRY_MATERIALS=['身份证正反面','劳动合同'];
var rowSeq=0;
var rowMaterials={};
var pendingEntryUpload=null;
var editRecordId=null;

function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(m,t){var e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;document.getElementById('toastContainer').appendChild(e);setTimeout(function(){e.remove();},2200);}
function toggleUserMenu(){document.getElementById('userDropdown').classList.toggle('show');}
document.addEventListener('click',function(e){if(!e.target.closest('.topnav-user'))document.getElementById('userDropdown').classList.remove('show');});
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed');}
function fileExt(name,def){ var m=/\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():def; }
function goBack(){ window.location.href='contract-entry-list-school.html'; }

var ICONS={home:'<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',chart:'<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',badge:'<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h4M15 12h4M5 16h14"/></svg>',out:'<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>'};
var MENU_ICONS={workbench:'home',ledger:'chart',staffing:'monitor',entry:'userp',exit:'userx',postset:'shield',promote:'arrowup',recruit:'search',employ:'file','contract-entry':'badge','contract-exit':'out',retire:'clock',ethics:'warn',account:'users',org:'building'};

var ROLES={school:{name:'王玉兰',short:'王',org:'柳州市第八中学',role:'school',sidebar:{top:[{id:'workbench',icon:'home',label:'工作台'},{id:'ledger',icon:'chart',label:'编制岗位台账'}],groups:[{name:'编制管理',items:[{id:'staffing',label:'编制使用申请'},{id:'entry',label:'入编申请'},{id:'exit',label:'教师出编管理'}]},{name:'岗位管理',items:[{id:'postset',label:'岗位设置申请'},{id:'promote',label:'岗位晋升申请',badge:2},{id:'recruit',label:'招聘岗位申请'}]},{name:'聘用管理',items:[{id:'employ',label:'聘用手续办理'}]},{name:'编外教师管理',items:[{id:'contract-entry',label:'教师入职管理'},{id:'contract-exit',label:'教师离职管理'}]},{name:'人事管理',items:[{id:'retire',label:'退休呈报'},{id:'ethics',label:'师德师风举报'}]},{name:'系统设置',items:[{id:'account',label:'账号管理'},{id:'org',label:'机构管理'}]}]}}};

function renderSidebar(){ renderSidebarMenu('sidebarMenu',currentRole,'contract-entry'); }
function sidebarClick(el,id){if(arguments.length===1){id=el;el=null;}if(id==='contract-entry')return;if(id==='workbench'){window.location.href='workbench.html';return;}if(id==='ledger'){window.location.href='org-ledger-school.html';return;}if(id==='staffing'){window.location.href='staffing-application.html';return;}if(id==='entry'){window.location.href='教师入编管理（学校管理员视角）.html';return;}if(id==='exit'){window.location.href='教师出编管理（学校管理员视角）.html';return;}if(id==='postset'){window.location.href='post-list-school.html';return;}if(id==='promote'){window.location.href='promote-list-school.html';return;}if(id==='recruit'){window.location.href='recruit-list-school.html';return;}if(id==='employ'){window.location.href='employ-list-school.html';return;}if(id==='contract-exit'){window.location.href='contract-exit-list-school.html';return;}if(id==='retire'){showToast('退休呈报页面开发中');return;}if(id==='ethics'){showToast('师德师风举报页面开发中');return;}if(id==='account'){window.location.href='account-management.html';return;}if(id==='org'){window.location.href='org-management.html';return;}showToast('跳转至：'+(el.textContent||id));}

function loadRecords(){var s=localStorage.getItem('contract_entry_records');try{return JSON.parse(s)||[];}catch(e){return[];}}
function saveRecords(r){localStorage.setItem('contract_entry_records',JSON.stringify(r));}

/* ---------- row management ---------- */
function addTeacherRow(){
  var uid='r'+(++rowSeq);
  rowMaterials[uid]={};
  var tb=document.getElementById('teacherTableBody');
  var tr=document.createElement('tr');
  tr.setAttribute('data-uid',uid);
  var h='';
  h+='<td class="row-index" style="text-align:center;color:var(--text-secondary);"></td>';
  h+='<td><input type="text" class="f-name" placeholder="姓名"></td>';
  h+='<td><select class="f-gender"><option value="">选择</option><option value="男">男</option><option value="女">女</option></select></td>';
  h+='<td><input type="text" class="f-id" placeholder="身份证号" maxlength="18"></td>';
  h+='<td><input type="text" class="f-phone" placeholder="手机号" maxlength="11"></td>';
  h+='<td><div class="date-pair"><input type="date" class="f-start"><span>至</span><input type="date" class="f-end"></div></td>';
  h+='<td><input type="date" class="f-entry"></td>';
  h+='<td><div class="checklist-container">';
  ENTRY_MATERIALS.forEach(function(item){
    h+='<div class="checklist-item" id="ci-'+uid+'-'+item+'">';
    h+='<span class="checklist-icon">☐</span><span class="checklist-cname">'+item+'</span>';
    h+='<button class="checklist-upload-btn" onclick="triggerEntryUpload(event,\''+uid+'\',\''+item+'\')">上传</button>';
    h+='</div>';
  });
  h+='</div></td>';
  h+='<td style="text-align:center;"><button class="row-remove" onclick="removeRow(\''+uid+'\')" title="删除">&times;</button></td>';
  tr.innerHTML=h;
  tb.appendChild(tr);
  var fi=document.createElement('input');
  fi.type='file'; fi.id='file-'+uid; fi.style.display='none';
  fi.onchange=function(){handleEntryFile(uid,this);};
  document.getElementById('rowFileInputs').appendChild(fi);
  refreshRowIndexes();
}

function removeRow(uid){
  var tr=document.querySelector('#teacherTableBody tr[data-uid="'+uid+'"]');
  if(tr) tr.remove();
  var fi=document.getElementById('file-'+uid); if(fi) fi.remove();
  delete rowMaterials[uid];
  refreshRowIndexes();
}
function refreshRowIndexes(){
  var rows=document.querySelectorAll('#teacherTableBody tr');
  rows.forEach(function(tr,i){ var c=tr.querySelector('.row-index'); if(c) c.textContent=(i+1); });
}

/* ---------- upload ---------- */
function triggerEntryUpload(e,uid,itemName){
  e.stopPropagation(); e.preventDefault();
  pendingEntryUpload={uid:uid,item:itemName};
  var fi=document.getElementById('file-'+uid);
  if(fi){ fi.value=''; fi.click(); }
}
function handleEntryFile(uid,input){
  var f=input.files&&input.files[0]; if(!f){ pendingEntryUpload=null; return; }
  if(!pendingEntryUpload||pendingEntryUpload.uid!==uid){ pendingEntryUpload=null; return; }
  var itemName=pendingEntryUpload.item; pendingEntryUpload=null;
  if(itemName==='身份证正反面'){
    if(!/\.(jpe?g|png|pdf)$/i.test(f.name) && f.type.indexOf('image/')!==0 && f.type!=='application/pdf'){ showToast('身份证支持 JPG/PNG/PDF 格式','warning'); input.value=''; return; }
  }else{
    if(!/\.pdf$/i.test(f.name) && f.type!=='application/pdf'){ showToast('劳动合同仅支持 PDF 格式','warning'); input.value=''; return; }
  }
  if(f.size>10*1048576){ showToast('文件不能超过 10MB','warning'); input.value=''; return; }
  if(!rowMaterials[uid]) rowMaterials[uid]={};
  rowMaterials[uid][itemName]={name:f.name,size:f.size};
  renderEntryMaterialLabel(uid,itemName);
  input.value='';
}
function clearEntryMaterial(uid,itemName){
  if(rowMaterials[uid]){ delete rowMaterials[uid][itemName]; }
  renderEntryMaterialLabel(uid,itemName);
}
function renderEntryMaterialLabel(uid,itemName){
  var div=document.getElementById('ci-'+uid+'-'+itemName);
  if(!div) return;
  var file=rowMaterials[uid]&&rowMaterials[uid][itemName];
  var h='';
  h+='<span class="checklist-icon">'+(file?'☑':'☐')+'</span>';
  h+='<span class="checklist-cname">'+itemName+'</span>';
  h+='<button class="checklist-upload-btn" onclick="triggerEntryUpload(event,\''+uid+'\',\''+itemName+'\')">上传</button>';
  if(file){
    var short=file.name.length>8?file.name.substring(0,8)+'...':file.name;
    h+='<span class="checklist-file-tag" title="'+escapeHtml(file.name)+'">'+escapeHtml(short)+'</span>';
    h+='<span class="file-remove" onclick="event.stopPropagation();clearEntryMaterial(\''+uid+'\',\''+itemName+'\')">×</span>';
  }
  div.innerHTML=h;
}

/* ---------- collect & submit ---------- */
function collectTeachers(){
  var rows=document.querySelectorAll('#teacherTableBody tr');
  var list=[];
  rows.forEach(function(tr){
    var uid=tr.getAttribute('data-uid');
    var mats=rowMaterials[uid]||{};
    list.push({
      name:tr.querySelector('.f-name').value.trim(),
      gender:tr.querySelector('.f-gender').value,
      idCard:tr.querySelector('.f-id').value.trim(),
      phone:tr.querySelector('.f-phone').value.trim(),
      contractStart:tr.querySelector('.f-start').value,
      contractEnd:tr.querySelector('.f-end').value,
      entryDate:tr.querySelector('.f-entry').value,
      materials:{'身份证正反面':mats['身份证正反面']||null,'劳动合同':mats['劳动合同']||null}
    });
  });
  return list;
}

function submitForm(){
  var teachers=collectTeachers();
  if(teachers.length===0){ showToast('请至少添加一位入职教师','warning'); return; }
  for(var i=0;i<teachers.length;i++){
    var t=teachers[i]; var n=i+1;
    if(!t.name){ showToast('第'+n+'行：请填写姓名','warning'); return; }
    if(!t.gender){ showToast('第'+n+'行：请选择性别','warning'); return; }
    if(!t.idCard||!/^\d{17}[\dXx]$/.test(t.idCard)){ showToast('第'+n+'行：身份证号格式不正确','warning'); return; }
    if(!t.phone||!/^1[3-9]\d{9}$/.test(t.phone)){ showToast('第'+n+'行：手机号格式不正确','warning'); return; }
    if(!t.contractStart||!t.contractEnd){ showToast('第'+n+'行：请填写合同起止日期','warning'); return; }
    if(t.contractEnd<t.contractStart){ showToast('第'+n+'行：合同截止日期不能早于起始日期','warning'); return; }
    if(!t.entryDate){ showToast('第'+n+'行：请选择入职时间','warning'); return; }
    if(t.entryDate<t.contractStart){ showToast('第'+n+'行：入职时间不能早于合同起始日期','warning'); return; }
    if(!t.materials['身份证正反面']){ showToast('第'+n+'行：请上传身份证正反面','warning'); return; }
    if(!t.materials['劳动合同']){ showToast('第'+n+'行：请上传劳动合同（PDF）','warning'); return; }
  }

  var all=loadRecords();
  var now=new Date();
  var pad=function(x){return x<10?'0'+x:''+x;};
  var ts=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());

  var usedNames={};
  function uniqueName(base){
    if(!(base in usedNames)){ usedNames[base]=true; return base; }
    var m=/^(.*?)(\.[^.]+)$/.exec(base), stem=m?m[1]:base, ext=m?m[2]:'';
    var i=2, cand; do { cand=stem+'_'+i+ext; i++; } while(cand in usedNames);
    usedNames[cand]=true; return cand;
  }
  var mappedTeachers=teachers.map(function(t){
    var materials={};
    var ic=t.materials['身份证正反面'];
    var lc=t.materials['劳动合同'];
    if(ic){ materials['身份证正反面']={ name:uniqueName((t.name||'教师')+'_身份证正反面.'+fileExt(ic.name||'','jpg')), size:ic.size, type:ic.type||'image/jpeg' }; }
    if(lc){ materials['劳动合同']={ name:uniqueName((t.name||'教师')+'_劳动合同.pdf'), size:lc.size, type:lc.type||'application/pdf' }; }
    return { name:t.name, gender:t.gender, idCard:t.idCard, phone:t.phone, contractStart:t.contractStart, contractEnd:t.contractEnd, entryDate:t.entryDate, materials:materials };
  });

  if(editRecordId){
    for(var i=0;i<all.length;i++){ if(all[i].id===editRecordId){ all[i].teachers=mappedTeachers; all[i].status='pending'; all[i].submitTime=ts; all[i].rejectOpinion=''; break; } }
    saveRecords(all);
    showToast('修改重提成功，已重新提交审核','success');
    setTimeout(function(){ window.location.href='contract-entry-list-school.html'; },1200);
    return;
  }

  var ds=now.getFullYear()+''+pad(now.getMonth()+1)+pad(now.getDate());
  var sameDay=all.filter(function(r){return r.id.indexOf('CE'+ds)===0;}).length;
  var newId='CE'+ds+('00'+(sameDay+1)).slice(-3);
  var rec={id:newId, schoolName:CURRENT_SCHOOL, district:CURRENT_DISTRICT, status:'pending', submitTime:ts, rejectOpinion:'', teachers:mappedTeachers};
  all.push(rec); saveRecords(all);
  showToast('入职申报已提交，等待审核','success');
  setTimeout(function(){ window.location.href='contract-entry-list-school.html'; },1200);
}

/* ---------- edit mode ---------- */
function loadForEdit(id){
  var all=loadRecords();
  var rec=null;
  for(var i=0;i<all.length;i++){ if(all[i].id===id){ rec=all[i]; break; } }
  if(!rec) return;
  editRecordId=id;
  rowSeq=0; rowMaterials={};
  document.getElementById('teacherTableBody').innerHTML='';
  document.getElementById('rowFileInputs').innerHTML='';
  (rec.teachers||[]).forEach(function(t){
    var uid='r'+(++rowSeq);
    var mats=t.materials||{};
    var ic=mats['身份证正反面']||t.idCardAttachment||null;
    var lc=mats['劳动合同']||t.laborContractAttachment||null;
    rowMaterials[uid]={};
    if(ic) rowMaterials[uid]['身份证正反面']={name:ic.name,size:ic.size};
    if(lc) rowMaterials[uid]['劳动合同']={name:lc.name,size:lc.size};
    var tb=document.getElementById('teacherTableBody');
    var tr=document.createElement('tr');
    tr.setAttribute('data-uid',uid);
    var h='';
    h+='<td class="row-index" style="text-align:center;color:var(--text-secondary);"></td>';
    h+='<td><input type="text" class="f-name" value="'+escapeHtml(t.name||'')+'"></td>';
    h+='<td><select class="f-gender"><option value="">选择</option><option value="男"'+(t.gender==='男'?' selected':'')+'>男</option><option value="女"'+(t.gender==='女'?' selected':'')+'>女</option></select></td>';
    h+='<td><input type="text" class="f-id" value="'+escapeHtml(t.idCard||'')+'" maxlength="18"></td>';
    h+='<td><input type="text" class="f-phone" value="'+escapeHtml(t.phone||'')+'" maxlength="11"></td>';
    h+='<td><div class="date-pair"><input type="date" class="f-start" value="'+escapeHtml(t.contractStart||'')+'"><span>至</span><input type="date" class="f-end" value="'+escapeHtml(t.contractEnd||'')+'"></div></td>';
    h+='<td><input type="date" class="f-entry" value="'+escapeHtml(t.entryDate||'')+'"></td>';
    h+='<td><div class="checklist-container">';
    ENTRY_MATERIALS.forEach(function(item){
      var hasFile=!!rowMaterials[uid][item];
      h+='<div class="checklist-item" id="ci-'+uid+'-'+item+'">';
      h+='<span class="checklist-icon">'+(hasFile?'☑':'☐')+'</span>';
      h+='<span class="checklist-cname">'+item+'</span>';
      h+='<button class="checklist-upload-btn" onclick="triggerEntryUpload(event,\''+uid+'\',\''+item+'\')">上传</button>';
      if(hasFile){
        var f=rowMaterials[uid][item];
        var short=f.name.length>8?f.name.substring(0,8)+'...':f.name;
        h+='<span class="checklist-file-tag" title="'+escapeHtml(f.name)+'">'+escapeHtml(short)+'</span>';
        h+='<span class="file-remove" onclick="event.stopPropagation();clearEntryMaterial(\''+uid+'\',\''+item+'\')">×</span>';
      }
      h+='</div>';
    });
    h+='</div></td>';
    h+='<td style="text-align:center;"><button class="row-remove" onclick="removeRow(\''+uid+'\')" title="删除">&times;</button></td>';
    tr.innerHTML=h;
    tb.appendChild(tr);
    var fi=document.createElement('input');
    fi.type='file'; fi.id='file-'+uid; fi.style.display='none';
    fi.onchange=function(){handleEntryFile(uid,this);};
    document.getElementById('rowFileInputs').appendChild(fi);
  });
  refreshRowIndexes();
  document.getElementById('pageTitle').textContent='修改入职申报 — '+escapeHtml(id);
  document.getElementById('bcPage').textContent='修改申报';
  document.getElementById('submitBtn').textContent='重新提交';
}

/* ---------- init ---------- */
(function init(){
  var params=new URLSearchParams(window.location.search);
  var id=params.get('id');
  renderSidebar();
  addTeacherRow();
  if(id) loadForEdit(id);
})();
</script>
