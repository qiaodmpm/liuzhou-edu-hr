<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离职申报详情 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top:0; left:0; right:0; height:56px; background:linear-gradient(135deg,#1E3A8A,#1E40AF); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display:flex; align-items:center; gap:14px; }
.topnav-logo { width:38px; height:38px; background:rgba(255,255,255,0.18); border-radius:10px; display:flex; align-items:center; justify-content:center; }
.topnav-logo svg { width:24px; height:24px; }
.topnav-title { font-size:17px; font-weight:600; color:#fff; letter-spacing:1px; }
.topnav-right { display:flex; align-items:center; gap:18px; }
.topnav-bell { position:relative; cursor:pointer; color:rgba(255,255,255,0.85); padding:6px; border-radius:6px; transition:var(--transition); }
.topnav-bell:hover { background:rgba(255,255,255,0.1); color:#fff; }
.topnav-bell .badge { position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.topnav-user { display:flex; align-items:center; gap:8px; cursor:pointer; color:rgba(255,255,255,0.9); padding:6px 12px; border-radius:6px; transition:var(--transition); font-size:13px; position:relative; }
.topnav-user:hover { background:rgba(255,255,255,0.1); }
.topnav-user .avatar { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
.user-dropdown { display:none; position:absolute; top:46px; right:0; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-lg); min-width:160px; z-index:200; overflow:hidden; }
.user-dropdown.show { display:block; }
.user-dropdown a { display:block; padding:12px 18px; font-size:13px; color:var(--text); text-decoration:none; transition:var(--transition); }
.user-dropdown a:hover { background:var(--primary-light); color:var(--primary); }
.sidebar { position:fixed; top:56px; left:0; bottom:0; width:var(--sidebar-w); background:#1E3A8A; z-index:90; overflow-y:auto; display:flex; flex-direction:column; transition:width var(--transition); }
.sidebar.collapsed { width:64px; }
.sidebar.collapsed .menu-label,.sidebar.collapsed .menu-group,.sidebar.collapsed .menu-badge,.sidebar.collapsed .role-switcher-label,.sidebar.collapsed .role-switcher-name { display:none; }
.sidebar.collapsed .menu-item { justify-content:center; padding:12px 0; }
.sidebar.collapsed .menu-icon { margin-right:0; }
.sidebar-menu { flex:1; padding:8px 0; }
.menu-group { padding:14px 20px 4px; font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; }
.menu-item { display:flex; align-items:center; padding:10px 20px; cursor:pointer; font-size:13px; font-weight:400; color:rgba(255,255,255,0.7); transition:var(--transition); position:relative; text-decoration:none; border-left:3px solid transparent; }
.menu-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
.menu-item.active { background:rgba(255,255,255,0.08); color:#fff; font-weight:500; border-left-color:var(--accent); }
.menu-item .menu-icon { width:18px; height:18px; margin-right:10px; flex-shrink:0; opacity:0.7; }
.menu-item.active .menu-icon { opacity:1; }
.menu-item .menu-badge { margin-left:auto; background:var(--danger); color:#fff; font-size:10px; padding:2px 7px; border-radius:10px; font-weight:600; }
.sidebar-bottom { border-top:1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display:flex; align-items:center; gap:8px; padding:10px 20px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.5); transition:var(--transition); }
.sidebar-toggle:hover { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.8); }
.sidebar-toggle svg { width:16px; height:16px; transition:transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform:rotate(180deg); }
.role-switcher { padding:10px 16px 12px; border-top:1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:1px; margin-bottom:8px; padding:0 4px; }
.role-switcher-options { display:flex; flex-direction:column; gap:4px; }
.role-switch-btn { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.55); transition:var(--transition); border:1px solid transparent; background:transparent; font-family:inherit; width:100%; text-align:left; }
.role-switch-btn:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.8); }
.role-switch-btn.active { background:rgba(59,130,246,0.2); color:#fff; border-color:rgba(59,130,246,0.4); font-weight:500; }
.role-switch-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.role-switch-dot.city { background:#3B82F6; }
.role-switch-dot.district { background:#F59E0B; }
.role-switch-dot.school { background:#10B981; }
.role-switch-dot.teacher { background:#A78BFA; }
.main { margin-left:var(--sidebar-w); margin-top:56px; padding:24px; min-height:calc(100vh - 56px); transition:margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left:64px; }
.breadcrumb { font-size:12px; color:var(--text-light); margin-bottom:16px; }
.breadcrumb a { color:var(--text-light); text-decoration:none; }
.breadcrumb a:hover { color:var(--primary); }
.breadcrumb span { color:var(--text-secondary); }
.page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:16px; }
.page-header h1 { font-size:20px; font-weight:700; }
.page-header .subtitle { font-size:12px; color:var(--text-light); margin-top:2px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; font-size:13px; font-weight:500; border-radius:6px; cursor:pointer; font-family:inherit; transition:var(--transition); border:1px solid transparent; text-decoration:none; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { background:var(--primary-dark); }
.btn-sm { padding:6px 13px; font-size:12px; }
.btn-lg { padding:9px 22px; font-size:13px; }
.btn-outline { background:#fff; color:var(--text-secondary); border:1px solid var(--border); }
.btn-outline:hover { background:var(--gray-bg); }
.btn-success { background:var(--success); color:#fff; border-color:var(--success); }
.btn-success:hover { filter:brightness(0.95); }
.btn-danger-outline { background:#fff; color:var(--danger); border:1px solid #FECACA; }
.btn-danger-outline:hover { background:#FEF2F2; }
.btn-danger { background:var(--danger); color:#fff; border-color:var(--danger); }
.btn-danger:hover { filter:brightness(0.95); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
/* detail cards */
.detail-card { background:#fff; border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow-sm); padding:20px 24px; margin-bottom:18px; }
.detail-card h3 { font-size:14px; font-weight:600; margin:0 0 16px; display:flex; align-items:center; gap:8px; }
.detail-card h3::before { content:''; width:3px; height:14px; background:var(--primary); border-radius:2px; display:inline-block; }
.info-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px 28px; }
.info-item { display:flex; flex-direction:column; gap:5px; }
.info-item .label { font-size:11px; color:var(--text-light); }
.info-item .value { font-size:13px; color:var(--text); font-weight:500; }
.detail-table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; }
.detail-table th { padding:9px 12px; background:#F8FAFC; border:1px solid var(--border); font-size:11px; color:var(--text-secondary); font-weight:600; }
.detail-table td { padding:9px 12px; border:1px solid var(--border); text-align:center; }
.exit-tag { display:inline-block; padding:1px 9px; border-radius:10px; font-size:11px; background:var(--primary-light); color:var(--primary); }
.region-tag { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; background:var(--gray-bg); color:var(--text-secondary); }
.status-badge { display:inline-block; padding:2px 12px; border-radius:12px; font-size:12px; font-weight:500; }
.status-badge.pending { background:#FEF3C7; color:#92400E; }
.status-badge.approved { background:#D1FAE5; color:#065F46; }
.status-badge.rejected { background:#FEE2E2; color:#991B1B; }
.status-badge.draft { background:#E2E8F0; color:#475569; }
.att-links { display:flex; flex-wrap:wrap; gap:10px; }
.att-link { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--border); border-radius:6px; padding:8px 14px; font-size:12px; color:var(--primary); cursor:pointer; text-decoration:none; transition:var(--transition); }
.att-link:hover { border-color:var(--accent); background:var(--primary-light); }
.att-link svg { width:14px; height:14px; }
.reject-note { background:#FEF2F2; border:1px solid #FECACA; border-radius:6px; padding:12px 14px; font-size:12px; color:#991B1B; margin-top:16px; line-height:1.6; }
.review-meta { background:#F0FDF4; border:1px solid #BBF7D0; border-radius:6px; padding:12px 14px; font-size:12px; color:#065F46; margin-top:16px; line-height:1.6; }
/* audit box */
.audit-box { background:#fff; border:1px solid var(--accent); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:20px 24px; margin-bottom:18px; }
.audit-box h3 { font-size:14px; font-weight:600; margin:0 0 14px; display:flex; align-items:center; gap:8px; }
.audit-box h3::before { content:''; width:3px; height:14px; background:var(--accent); border-radius:2px; display:inline-block; }
.audit-box label { font-size:13px; font-weight:600; display:block; margin-bottom:8px; }
.audit-box label .hint { font-size:11px; color:var(--text-light); font-weight:400; margin-left:6px; }
.audit-box textarea { width:100%; min-height:84px; border:1px solid var(--border); border-radius:6px; padding:10px 12px; font-size:13px; font-family:inherit; resize:vertical; }
.audit-box textarea:focus { outline:none; border-color:var(--accent); }
.audit-actions { margin-top:18px; display:flex; gap:12px; }
.audit-actions .btn { flex:1; justify-content:center; }
/* back link */
.back-link { display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; font-size:12px; color:var(--text-secondary); cursor:pointer; }
.back-link:hover { color:var(--primary); }
/* status stamp */
.status-stamp { display:inline-block; padding:6px 16px; border:2px solid; transform:rotate(-5deg); font-weight:700; font-size:14px; background:#fff; }
.status-stamp.pending { color:#F59E0B; border-color:#F59E0B; }
.status-stamp.approved { color:#10B981; border-color:#10B981; }
.status-stamp.rejected { color:#EF4444; border-color:#EF4444; }
/* progress bar */
.progress-bar { display:flex; align-items:center; padding:20px 24px; background:#fff; border-radius:var(--radius-lg); border:1px solid var(--border); margin-bottom:18px; overflow-x:auto; }
.step-wrapper { display:flex; align-items:center; flex:1; min-width:0; }
.step { display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; min-width:80px; }
.step-dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; border:2px solid var(--border); color:var(--text-light); background:#fff; transition:var(--transition); }
.step.done .step-dot { background:var(--success); color:#fff; border-color:var(--success); }
.step.current .step-dot { background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 0 0 4px rgba(30,64,175,0.12); }
.step.rejected .step-dot { background:var(--danger); color:#fff; border-color:var(--danger); }
.step-text { font-size:11px; color:var(--text-light); white-space:nowrap; }
.step.current .step-text { color:var(--primary); font-weight:500; }
.step.done .step-text { color:var(--success); }
.step.rejected .step-text { color:var(--danger); font-weight:500; }
.step-line { flex:1; height:2px; background:var(--border); margin:0 4px 22px; min-width:20px; }
.step-line.done { background:var(--success); }
/* two-column layout */
.two-columns { display:flex; gap:18px; align-items:stretch; }
.two-columns .main-col { flex:1; min-width:0; display:flex; flex-direction:column; }
.two-columns .main-col > .detail-card { flex:1; }
.two-columns .side-col { width:340px; flex-shrink:0; }
/* sidebar sections / timeline / summary */
.sidebar-section { background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px 20px; margin-bottom:18px; }
.sidebar-section:last-child { margin-bottom:0; }
.sidebar-section h4 { font-size:13px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:7px; }
.sidebar-section h4:before { content:""; width:3px; height:14px; background:var(--accent); border-radius:2px; }
.timeline { position:relative; padding-left:18px; }
.timeline:before { content:''; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--border); }
.timeline-item { position:relative; padding-bottom:14px; }
.timeline-item:last-child { padding-bottom:0; }
.timeline-item:before { content:''; position:absolute; left:-16px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--border); }
.timeline-item.current:before { background:var(--primary); }
.timeline-item.rejected:before { background:var(--danger); }
.timeline-item .tl-time { font-size:11px; color:var(--text-light); }
.timeline-item .tl-action { font-size:12px; font-weight:500; margin-top:2px; }
.timeline-item .tl-operator { font-size:11px; color:var(--text-secondary); margin-top:1px; }
.timeline-item .tl-opinion { font-size:11px; color:var(--danger); margin-top:2px; line-height:1.5; }
.summary-list { display:flex; flex-direction:column; }
.summary-list .s-row { display:flex; justify-content:space-between; gap:12px; font-size:12px; line-height:1.5; padding:3px 0; }
.summary-list .s-label { color:var(--text-light); flex-shrink:0; }
.summary-list .s-value { color:var(--text); font-weight:500; text-align:right; word-break:break-all; }
/* audit bottom bar */
.audit-bottom-bar { background:#fff; border:2px solid var(--primary); border-radius:var(--radius-lg); padding:16px 20px; display:flex; gap:12px; align-items:center; margin-top:18px; box-shadow:0 2px 16px rgba(0,0,0,0.08); }
.audit-bottom-bar .hint { flex:1; font-size:12px; color:var(--text-light); }
.readonly-note { text-align:center; padding:14px; border-radius:var(--radius-lg); font-size:13px; margin-top:18px; }
.readonly-note.info { background:#EFF6FF; color:var(--primary); }
@media (max-width:1100px){ .two-columns { flex-direction:column; } .two-columns .side-col { width:100%; } }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-light); }
.empty-state .empty-icon { font-size:42px; margin-bottom:14px; }
.empty-state .empty-text { font-size:14px; margin-bottom:20px; }
/* modal */
.modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.5); display:none; align-items:flex-start; justify-content:center; z-index:1000; overflow-y:auto; padding:60px 20px; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); width:100%; max-width:440px; animation:modalIn .25s ease; margin:auto; }
@keyframes modalIn { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
.modal-header { padding:18px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-header h2 { font-size:16px; font-weight:600; }
.modal-close { cursor:pointer; color:var(--text-light); font-size:24px; line-height:1; background:none; border:none; padding:0 4px; }
.modal-close:hover { color:var(--text); }
.modal-body { padding:20px 24px; }
.modal-body p { margin-bottom:12px; }
.modal-body label { display:block; font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:8px; }
.modal-body textarea { width:100%; min-height:90px; padding:12px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; resize:vertical; color:var(--text); }
.modal-body textarea:focus { outline:none; border-color:var(--accent); }
.modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#1E293B; color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:9999; animation:toastIn .3s ease; box-shadow:var(--shadow-lg); }
.toast.warning { background:var(--warning); color:#1E293B; }
.toast.success { background:var(--success); }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
@media (max-width:768px){ .info-grid { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-left"><div class="topnav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="1" width="18" height="22" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="12" y2="14"/><line x1="12" y1="18" x2="16" y2="18"/><circle cx="8" cy="18" r="1.5" fill="#fff"/></svg></div><span class="topnav-title">柳州教育人事管理平台</span></div>
  <div class="topnav-right">
    <div class="topnav-bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="badge">2</span></div>
    <div class="topnav-user" onclick="toggleUserMenu()"><div class="avatar" id="userAvatar">张</div><span id="userName">张建国</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="user-dropdown" id="userDropdown"><a href="personal-center.html">个人中心</a></div></div>
  </div>
</nav>

<aside class="sidebar" id="sidebar"><div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="role-switcher"><div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options">
      <button class="role-switch-btn" data-role="city" onclick="switchRole('city')"><span class="role-switch-dot city"></span><span class="role-switcher-name">市管理员</span></button>
      <button class="role-switch-btn" data-role="district" onclick="switchRole('district')"><span class="role-switch-dot district"></span><span class="role-switcher-name">区管理员</span></button>
      <button class="role-switch-btn" data-role="school" onclick="switchRole('school')"><span class="role-switch-dot school"></span><span class="role-switcher-name">校管理员</span></button>
    </div>
  </div>
  <div class="sidebar-bottom"><div class="sidebar-toggle" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg><span class="menu-label">收起菜单</span></div></div>
</aside>

<main class="main">
  <div class="breadcrumb"><a href="workbench.html">首页</a> &nbsp;/&nbsp; <span>编外教师管理</span> &nbsp;/&nbsp; <span>教师离职管理</span> &nbsp;/&nbsp; <span id="bcLast">详情</span></div>
  <div id="pageContent"></div>
</main>

<!-- 审核通过确认弹窗 -->
<div class="modal-overlay" id="approveModal">
  <div class="modal">
    <div class="modal-header"><h2>确认审核通过</h2><button class="modal-close" onclick="closeApproveModal()">&times;</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-secondary);line-height:1.8;">确认通过申请编号 <strong id="approveId" style="color:var(--primary);"></strong> 的离职申报？<br>通过后该批次教师离职手续即办结，操作不可撤销。</p>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeApproveModal()">取消</button><button class="btn btn-success" onclick="confirmApprove()">确认通过</button></div>
  </div>
</div>

<!-- 审核驳回确认弹窗 -->
<div class="modal-overlay" id="rejectModal">

function stampClass(st){ if(st==='approved') return 'approved'; if(st==='rejected') return 'rejected'; return 'pending'; }

/* 进度条：学校提交 → 主管单位审核 → 完成 */
function renderProgress(status){
  var steps=['学校提交','主管单位审核','完成'];
  var idx=1, rejected=false;
  if(status==='approved') idx=3;
  else if(status==='rejected'){ idx=1; rejected=true; }
  var h='<div class="progress-bar"><div class="step-wrapper">';
  for(var i=0;i<steps.length;i++){
    var cls='', disp=(i+1);
    if(rejected && i===1){ cls='rejected'; disp='&#10005;'; }
    else if(i<idx){ cls='done'; disp='&#10003;'; }
    else if(i===idx){ cls='current'; }
    h+='<span class="step '+cls+'"><span class="step-dot">'+disp+'</span><span class="step-text">'+steps[i]+'</span></span>';
    if(i<steps.length-1){
      var lc=((i<idx) || (rejected && i===0))?'done':'';
      h+='<span class="step-line '+lc+'"></span>';
    }
  }
  h+='</div></div>';
  return h;
}

/* 申报履历（优先使用记录自带 timeline） */
function buildTimeline(r){
  var items=[];
  if(r.timeline && r.timeline.length){ items=r.timeline.slice(); }
  else if(r.submitTime){ items.push({time:r.submitTime, action:'学校提交申报', operator:'—'}); }
  if(r.status==='pending'){ items.push({time:'', action:'等待主管单位审核', operator:'', pending:true}); }
  return items;
}
function renderTimeline(r){
  var items=buildTimeline(r);
  var h='<div class="detail-card"><h3>申报履历</h3><div class="timeline">';
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var cls=(i===items.length-1)?' current':'';
    if(it.action && it.action.indexOf('驳回')>=0) cls=' rejected';
    h+='<div class="timeline-item'+cls+'">';
    h+='<div class="tl-time">'+escapeHtml(it.time? it.time.substring(0,16) : (it.pending?'进行中':''))+'</div>';
    h+='<div class="tl-action">'+escapeHtml(it.action)+'</div>';
    if(it.operator){ h+='<div class="tl-operator">操作人：'+escapeHtml(it.operator)+'</div>'; }
    if(it.opinion){ h+='<div class="tl-opinion">'+escapeHtml(it.opinion)+'</div>'; }
    h+='</div>';
  }
  h+='</div></div>';
  return h;
}

  h+=renderTimeline(r);
  h+=renderSummary(r,teacherCount);
  h+='</div>';

  h+='</div>';

  // bottom audit bar
  if(showAudit){
    h+='<div class="audit-bottom-bar">';
    h+='<span class="hint">请核对离职教师明细及附件材料，审核通过后该批次教师离职手续办结。</span>';
    h+='<button class="btn btn-danger btn-lg" onclick="onReject()">审核驳回</button>';
    h+='<button class="btn btn-success btn-lg" onclick="openApproveModal()">审核通过</button>';
    h+='</div>';
  } else if(isAudit && r.status!=='pending'){
    h+='<div class="readonly-note info">该批次已审核（'+escapeHtml(statusLabel)+'），无需重复操作。</div>';
  }

  box.innerHTML=h;
}

/* ---------- audit actions ---------- */
function openApproveModal(){
  document.getElementById('approveId').textContent=currentId;
  document.getElementById('approveModal').classList.add('show');
}
function closeApproveModal(){ document.getElementById('approveModal').classList.remove('show'); }
function confirmApprove(){
  var t=nowStr(); var op=ROLES[currentRole].name;
  updateRecord(currentId, function(rec){
    rec.status='approved';
    rec.reviewer=op; rec.approver=op;
    rec.reviewTime=t; rec.approveTime=t;
    rec.rejectReason=''; rec.opinion='';
    rec.timeline=rec.timeline||[]; rec.timeline.push({time:t,action:'主管部门审核通过',operator:op});
  });
  closeApproveModal();
  showToast('已审核通过','success');
  setTimeout(function(){ window.location.href='contract-exit-list-admin.html?role='+currentRole; }, 1000);
}
function onReject(){
  var el=document.getElementById('rejectOpinion');
  if(el) el.value='';
  document.getElementById('rejectModal').classList.add('show');
  if(el) setTimeout(function(){ el.focus(); }, 50);
}
function closeRejectModal(){ document.getElementById('rejectModal').classList.remove('show'); }
function confirmReject(){
  var el=document.getElementById('rejectOpinion');
  var txt=el?el.value.trim():'';
  if(!txt){ showToast('请填写驳回意见','warning'); if(el) el.focus(); return; }
  var t=nowStr(); var op=ROLES[currentRole].name;
  updateRecord(currentId, function(rec){
    rec.status='rejected';
    rec.reviewer=op; rec.reviewTime=t;
    rec.rejectReason=txt; rec.opinion=txt;
    rec.timeline=rec.timeline||[]; rec.timeline.push({time:t,action:'主管部门审核驳回',operator:op,opinion:txt});
  });
  closeRejectModal();
  showToast('已驳回，意见将反馈给申报学校','warning');
  setTimeout(function(){ window.location.href='contract-exit-list-admin.html?role='+currentRole; }, 1000);
}

document.getElementById('approveModal').addEventListener('click',function(e){ if(e.target===this) closeApproveModal(); });
document.getElementById('rejectModal').addEventListener('click',function(e){ if(e.target===this) closeRejectModal(); });

/* ---------- init ---------- */
(function init(){
  var params=new URLSearchParams(window.location.search);
  currentId=params.get('id')||'';
  currentMode=(params.get('mode')==='audit')?'audit':'detail';
  var urlRole=params.get('role');
  if(urlRole==='city'||urlRole==='district'||urlRole==='school') currentRole=urlRole;
  updateRoleUI();
  renderSidebar();
  render();
})();
</script>
