<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; transition: var(--transition); font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }
.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; display: flex; flex-direction: column; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label, .sidebar.collapsed .menu-group, .sidebar.collapsed .menu-badge, .sidebar.collapsed .role-switcher-label, .sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7); transition: var(--transition); position: relative; text-decoration: none; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }
.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px; min-height: calc(100vh - 56px); transition: margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }
.page-header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-outline-sm { padding: 4px 12px; font-size: 12px; background: #fff; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: inherit; }
.btn-outline-sm:hover { background: var(--gray-bg); }

/* Batch Cards */
.batch-cards { display: flex; flex-direction: column; gap: 16px; }
.batch-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 20px 24px; box-shadow: var(--shadow-sm); transition: var(--transition); }
.batch-card:hover { box-shadow: var(--shadow); }
.batch-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.batch-card-title { font-size: 16px; font-weight: 600; }
.batch-card-info { display: flex; flex-wrap: wrap; gap: 12px 20px; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
.batch-card-info .info-item { display: flex; align-items: center; gap: 4px; }
.batch-card-remark { font-size: 12px; color: var(--text-light); margin-top: 8px; padding: 8px 12px; background: var(--gray-bg); border-radius: 6px; line-height: 1.5; }
.batch-card-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.status-badge.open { background: #D1FAE5; color: #065F46; }
.status-badge.closed { background: #E2E8F0; color: #64748B; }
.type-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; margin-right: 4px; }
.type-tag.mgmt { background: #EFF6FF; color: #1E40AF; }
.type-tag.prof { background: #FEF3C7; color: #92400E; }
.type-tag.labor { background: #F3E8FF; color: #6B21A8; }
.level-group { margin-bottom: 8px; }
.level-group-header { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
.filter-bar { margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }

/* School switcher */
.school-switcher-select { padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; min-width: 180px; cursor: pointer; }
.school-switcher-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); color: var(--text-light); }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state .empty-text { font-size: 14px; margin-bottom: 16px; }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal-container { background: #fff; border-radius: var(--radius-lg); padding: 28px; width: 640px; max-width: 90vw; box-shadow: var(--shadow-lg); max-height: 85vh; overflow-y: auto; }
.modal-container h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel { padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.btn-cancel:hover { background: var(--gray-bg); }
.btn-confirm { padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px; border: none; color: #fff; cursor: pointer; font-family: inherit; }
.btn-confirm.success { background: var(--success); }
.btn-confirm.success:hover { background: #059669; }
.btn-confirm.warn { background: var(--warning); color: #1E293B; }
.btn-confirm.warn:hover { background: #D97706; }
.btn-confirm.danger { background: var(--danger); }
.btn-confirm.danger:hover { background: #DC2626; }

/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease; box-shadow: var(--shadow-lg); }
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Modal form */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
.checkbox-group label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text); cursor: pointer; padding: 4px 10px; border: 1px solid var(--border); border-radius: 16px; transition: var(--transition); font-weight: 400; }
.checkbox-group label:hover { border-color: var(--accent); }
.checkbox-group label.checked { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

/* Access denied */
.access-denied { text-align: center; padding: 80px 20px; }
.access-denied .denied-icon { font-size: 64px; margin-bottom: 20px; color: var(--text-light); }
.access-denied h2 { font-size: 20px; margin-bottom: 8px; color: var(--text-secondary); }
.access-denied p { font-size: 14px; color: var(--text-light); margin-bottom: 24px; }
</style>
</head>

// ========== DATA PERSISTENCE ==========
function loadBatches() {
  var s = localStorage.getItem('promote_batches');
  if (s) { try { return JSON.parse(s); } catch(e) {} }
  return JSON.parse(JSON.stringify(DEMO_BATCHES));
}
function saveBatches(data) { localStorage.setItem('promote_batches', JSON.stringify(data)); }
function resetDemoData() { localStorage.removeItem('promote_batches'); location.reload(); }

// ========== UTILITY FUNCTIONS ==========
function showToast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function() { el.remove(); }, 2000);
}

function toggleUserMenu() { document.getElementById('userDropdown').classList.toggle('show'); }
document.addEventListener('click', function(e) {
  if (!e.target.closest('.topnav-user')) document.getElementById('userDropdown').classList.remove('show');
});

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

function getUrlParam(name) {
  var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}

function generateBatchId() {
  var now = new Date();
  var ds = now.toISOString().substring(0, 10).replace(/-/g, '');
  var batches = loadBatches();
  var prefix = 'PB' + ds;
  var seq = 1;
  batches.forEach(function(b) {
    if (b.id && b.id.substring(0, 8) === prefix) {
      var n = parseInt(b.id.substring(8), 10);
      if (n >= seq) seq = n + 1;
    }
  });
  return prefix + String(seq).padStart(3, '0');
}

    currentRole = role;
    renderSidebar();
    renderPage();

  if (role === 'teacher') { window.location.href = 'promote-list-teacher.html'; return; }
  if (role === 'city' || role === 'district') { window.location.href = 'promote-list-admin.html?role=' + role; return; }

function onSchoolChange(schoolName) {
  currentSchool = schoolName;
  populateYearFilter();
  renderCards();
}

// ========== YEAR FILTER ==========
function populateYearFilter() {
  var sel = document.getElementById('yearFilter');
  if (!sel) return;
  var batches = loadBatches();
  var years = [];
  batches.forEach(function(b) {
    if (b.schoolName === currentSchool && typeof b.year === 'number' && years.indexOf(b.year) === -1) {
      years.push(b.year);
    }
  });
  years.sort(function(a, b) { return b - a; });

  var currentVal = sel.value;
  sel.innerHTML = '<option value="">全部年度</option>';
  years.forEach(function(y) {
    sel.innerHTML += '<option value="' + y + '">' + y + '年</option>';
  });
  if (years.length > 0 && currentVal) {
    // Try to restore the previously selected year
    var found = false;
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === currentVal) { sel.value = currentVal; found = true; break; }
    }
    if (!found) sel.value = '';
  }
}

function renderCards() {
  var batches = loadBatches();
  var yearFilter = document.getElementById('yearFilter');
  var selectedYear = yearFilter ? yearFilter.value : '';

  // Filter by school and year
  var filtered = batches.filter(function(b) {
    if (b.schoolName !== currentSchool) return false;
    if (selectedYear && b.year !== parseInt(selectedYear)) return false;
    return true;
  });

  // Sort: year desc, then createTime desc
  filtered.sort(function(a, b) {
    if (a.year !== b.year) return b.year - a.year;
    return (b.createTime || '').localeCompare(a.createTime || '');
  });

  var area = document.getElementById('cardListArea');
  if (!area) return;

  if (filtered.length === 0) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128203;</div><div class="empty-text">暂无晋升批次</div><button class="btn btn-primary" onclick="openBatchModal()">+ 新建批次</button></div>';
    return;
  }

  var h = '<div class="batch-cards">';
  filtered.forEach(function(b) {
    var statusLabel = b.status === 'open' ? '进行中' : '已关闭';

    h += '<div class="batch-card">';
    // Header: name + status badge
    h += '<div class="batch-card-header">';
    h += '<span class="batch-card-title">' + (b.name || '—') + '</span>';
    h += '<span class="status-badge ' + b.status + '">' + statusLabel + '</span>';
    h += '</div>';

    // Info row
    h += '<div class="batch-card-info">';
    h += '<span class="info-item"><strong>年度：</strong>' + (b.year || '—') + '</span>';

    // Promote type tags
    if (b.promoteTypes && b.promoteTypes.length > 0) {
      h += '<span class="info-item"><strong>晋升类别：</strong>';
      b.promoteTypes.forEach(function(t) {
        h += '<span class="type-tag ' + t + '">' + (PROMOTE_TYPE_MAP[t] || t) + '</span>';
      });
      h += '</span>';
    }

    h += '<span class="info-item"><strong>申报时间：</strong>' + (b.startTime || '—') + ' 至 ' + (b.endTime || '—') + '</span>';
    h += '</div>';

    // Remark
    if (b.remark) {
      h += '<div class="batch-card-remark">' + b.remark + '</div>';
    }

    // Actions
    h += '<div class="batch-card-actions">';
    if (b.status === 'open') {
      h += '<button class="btn-outline-sm" onclick="openBatchModal(\'' + b.id + '\')">编辑</button>';
      h += '<button class="btn-outline-sm" style="color:var(--danger);border-color:var(--danger)" onclick="closeBatch(\'' + b.id + '\')">关闭批次</button>';
    } else {
      h += '<button class="btn-outline-sm" onclick="openBatchModal(\'' + b.id + '\')">查看</button>';
    }
    h += '</div>';

    h += '</div>'; // end batch-card
  });
  h += '</div>'; // end batch-cards

  area.innerHTML = h;
}

// ========== MODAL ==========
function openBatchModal(id) {
  var batches = loadBatches();
  var batch = id ? batches.find(function(b) { return b.id === id; }) : null;
  var isView = batch && batch.status === 'closed';

  var h = '<div class="modal-overlay" id="batchModal" onclick="if(event.target===this)closeModal()">';
  h += '<div class="modal-container">';
  h += '<h3>' + (id ? (isView ? '查看批次' : '编辑批次') : '新建批次') + '</h3>';

  // Batch name
  h += '<div class="form-group"><label>批次名称 <span style="color:var(--danger)">*</span></label>';
  h += '<input type="text" id="batchName" value="' + htmlEscape(batch ? batch.name : '') + '" placeholder="请输入批次名称"' + (isView ? ' disabled' : '') + '></div>';

  // Year
  h += '<div class="form-group"><label>年度 <span style="color:var(--danger)">*</span></label>';
  h += '<select id="batchYear"' + (isView ? ' disabled' : '') + '>';
  YEAR_OPTIONS.forEach(function(y) {
    h += '<option value="' + y + '"' + (batch && batch.year === y ? ' selected' : '') + '>' + y + '年</option>';
  });
  h += '</select></div>';

  // Promote types (checkboxes)
  h += '<div class="form-group"><label>晋升类别 <span style="color:var(--danger)">*</span></label>';
  h += '<div class="checkbox-group" id="promoteTypeCheckboxes">';
  var typeOptions = [
    { value: 'mgmt', label: '管理岗位晋升' },
    { value: 'prof', label: '专技岗位晋升' },
    { value: 'labor', label: '工勤技能岗位晋升' }
  ];
  typeOptions.forEach(function(t) {
    var checked = batch && (batch.promoteTypes || []).indexOf(t.value) >= 0;
    h += '<label onclick="toggleCheckbox(this)" class="' + (checked ? 'checked' : '') + '" data-value="' + t.value + '"' + (isView ? ' style="pointer-events:none"' : '') + '>';
    h += '<input type="checkbox" value="' + t.value + '" style="display:none"' + (checked ? ' checked' : '') + (isView ? ' disabled' : '') + '>' + t.label;
    h += '</label>';
  });
  h += '</div></div>';

  // Date row
  h += '<div class="form-row">';
  h += '<div class="form-group"><label>申报开始时间 <span style="color:var(--danger)">*</span></label>';
  h += '<input type="date" id="batchStartTime" value="' + (batch ? batch.startTime : '') + '"' + (isView ? ' disabled' : '') + '></div>';
  h += '<div class="form-group"><label>申报截止时间 <span style="color:var(--danger)">*</span></label>';
  h += '<input type="date" id="batchEndTime" value="' + (batch ? batch.endTime : '') + '"' + (isView ? ' disabled' : '') + '></div>';
  h += '</div>';

  // Remark
  h += '<div class="form-group"><label>备注说明 <span style="color:var(--text-light);font-weight:400;">(选填)</span></label>';
  h += '<textarea id="batchRemark" placeholder="选填"' + (isView ? ' disabled' : '') + '>' + (batch ? (batch.remark || '') : '') + '</textarea></div>';

  // Buttons
  h += '<div class="modal-buttons">';
  h += '<button class="btn-cancel" onclick="closeModal()">' + (isView ? '关闭' : '取消') + '</button>';
  if (!isView) {
    h += '<button class="btn-confirm success" id="btnSaveBatch">' + (batch ? '保存修改' : '创建批次') + '</button>';
  }
  h += '</div>';

  h += '</div></div>';

  document.body.insertAdjacentHTML('beforeend', h);

  if (!isView) {
    document.getElementById('btnSaveBatch').onclick = function() { saveBatch(id); };
  }
}

function htmlEscape(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toggleCheckbox(el) {
  var cb = el.querySelector('input[type=checkbox]');
  if (cb.disabled) return;
  cb.checked = !cb.checked;
  el.classList.toggle('checked', cb.checked);

  // If toggling a promote type checkbox, update level group visibility
  if (el.closest('#promoteTypeCheckboxes')) {
    updateLevelGroupVisibility();
  }
}

function updateLevelGroupVisibility() {
  var checkedTypes = getCheckedPromoteTypes();
  Object.keys(LEVEL_GROUPS).forEach(function(cat) {
    var group = document.getElementById('levelGroup_' + cat);
    if (group) {
      group.style.display = checkedTypes.indexOf(cat) >= 0 ? '' : 'none';
    }
  });
}

function getCheckedPromoteTypes() {
  var result = [];
  var container = document.getElementById('promoteTypeCheckboxes');
  if (!container) return result;
  var labels = container.querySelectorAll('label');
  labels.forEach(function(l) {
    var cb = l.querySelector('input[type=checkbox]');
    if (cb && cb.checked) result.push(cb.value);
  });
  return result;
}

function getCheckedLevels() {
  var result = [];
  var groups = document.querySelectorAll('.level-group .checkbox-group');
  groups.forEach(function(g) {
    var labels = g.querySelectorAll('label');
    labels.forEach(function(l) {
      var cb = l.querySelector('input[type=checkbox]');
      if (cb && cb.checked) result.push(cb.value);
    });
  });
  return result;
}

// ========== CRUD OPERATIONS ==========
function saveBatch(editId) {
  var nameEl = document.getElementById('batchName');
  var name = nameEl ? nameEl.value.trim() : '';
  var year = parseInt(document.getElementById('batchYear').value, 10);
  var startTime = document.getElementById('batchStartTime').value;
  var endTime = document.getElementById('batchEndTime').value;
  var remark = document.getElementById('batchRemark').value.trim();
  var promoteTypes = getCheckedPromoteTypes();

  // allowedLevels — UI removed, keep existing data when editing
  var allowedLevels = editId ? (function() {
    var batches = loadBatches();
    var b = batches.find(function(x) { return x.id === editId; });
    return b ? (b.allowedLevels || []) : [];
  })() : [];

  // Validate
  if (!name) { showToast('请输入批次名称', 'warning'); return; }
  if (!year) { showToast('请选择年度', 'warning'); return; }
  if (promoteTypes.length === 0) { showToast('请至少选择一个晋升类别', 'warning'); return; }
  if (!startTime) { showToast('请选择申报开始时间', 'warning'); return; }
  if (!endTime) { showToast('请选择申报截止时间', 'warning'); return; }
  if (startTime >= endTime) { showToast('截止时间必须晚于开始时间', 'warning'); return; }

  var batches = loadBatches();
  var now = new Date();
  var ts = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0') + ' ' +
    String(now.getHours()).padStart(2, '0') + ':' +
    String(now.getMinutes()).padStart(2, '0') + ':' +
    String(now.getSeconds()).padStart(2, '0');

  if (editId) {
    var idx = batches.findIndex(function(b) { return b.id === editId; });
    if (idx >= 0 && batches[idx].status !== 'closed') {
      batches[idx].name = name;
      batches[idx].year = year;
      batches[idx].promoteTypes = promoteTypes;
      batches[idx].allowedLevels = allowedLevels;
      batches[idx].startTime = startTime;
      batches[idx].endTime = endTime;
      batches[idx].remark = remark;
      saveBatches(batches);
      closeModal();
      renderCards();
      showToast('批次已更新', 'success');
    } else {
      showToast('该批次不可编辑', 'warning');
    }
  } else {
    var newBatch = {
      id: generateBatchId(),
      name: name,
      year: year,
      promoteTypes: promoteTypes,
      allowedLevels: allowedLevels,
      startTime: startTime,
      endTime: endTime,
      remark: remark,
      status: 'open',
      schoolName: currentSchool,
      createdBy: 'school',
      createTime: ts
    };
    batches.push(newBatch);
    saveBatches(batches);
    closeModal();
    populateYearFilter();
    renderCards();
    showToast('批次创建成功', 'success');
  }
}

function closeBatch(id) {
  if (!confirm('确认关闭该批次？关闭后教师将无法申报。')) return;
  var batches = loadBatches();
  var batch = batches.find(function(b) { return b.id === id; });
  if (!batch) return;
  if (batch.status !== 'open') { showToast('只能关闭进行中的批次', 'warning'); return; }
  batch.status = 'closed';
  saveBatches(batches);
  renderCards();
  showToast('批次已关闭', 'success');
}

function closeModal() {
  var m = document.getElementById('batchModal');
  if (m) m.remove();
}

// ========== INITIALIZATION ==========
function showAccessDenied() {
  document.getElementById('mainContent').innerHTML =
    '<div class="access-denied">' +
    '<div class="denied-icon">&#128274;</div>' +
    '<h2>无权限访问</h2>' +
    '<p>批次管理页面仅限学校管理员访问，请切换到学校管理员角色。</p>' +
    '<button class="btn btn-primary" onclick="switchRole(\'school\')">切换到学校管理员</button>' +
    '</div>';
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === currentRole);
  });
}

function init() {
  var roleParam = getUrlParam('role');
  if (roleParam === 'school') currentRole = roleParam;

  renderSidebar();

  if (currentRole !== 'school') {
    showAccessDenied();
    return;
  }

  renderPage();
}

init();
</script>
