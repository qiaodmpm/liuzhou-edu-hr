<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岗位设置申请管理 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; transition: var(--transition); font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }
.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; display: flex; flex-direction: column; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label, .sidebar.collapsed .menu-group, .sidebar.collapsed .menu-badge, .sidebar.collapsed .role-switcher-label, .sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7); transition: var(--transition); position: relative; text-decoration: none; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }
.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px; min-height: calc(100vh - 56px); transition: margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }
.page-header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-outline-sm { padding: 4px 12px; font-size: 12px; background: #fff; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: inherit; }
.btn-outline-sm:hover { background: var(--gray-bg); }

/* Filter bar */
.filter-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-tabs { display: flex; gap: 4px; background: var(--gray-bg); border-radius: 8px; padding: 3px; }
.filter-tab { padding: 6px 16px; font-size: 12px; font-weight: 500; border-radius: 6px; cursor: pointer; transition: var(--transition); color: var(--text-secondary); background: transparent; border: none; font-family: inherit; }
.filter-tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); }
.filter-tab .count { font-size: 10px; margin-left: 4px; opacity: 0.7; }

/* School filter */
.school-filter { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
.school-filter select { padding: 6px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; }

/* Table */
.list-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.list-table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
.list-table th { padding: 10px 12px; text-align: center; font-weight: 600; font-size: 11px; color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
.list-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: center; }
.list-table tr:last-child td { border-bottom: none; }
.list-table tr:hover { background: #FAFBFC; }
.list-table .col-id { color: var(--primary); font-weight: 500; }
.list-table .col-name { text-align: left; font-weight: 500; }
.list-table .col-num { font-family: 'SF Mono', 'Consolas', monospace; }
.list-table .col-pct { color: var(--text-secondary); font-size: 12px; }
.list-table .col-action { white-space: nowrap; }
.status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.status-badge.pending { background: #FEF3C7; color: #92400E; }
.status-badge.approved { background: #D1FAE5; color: #065F46; }
.status-badge.rejected { background: #FEE2E2; color: #991B1B; }
.status-badge.review { background: #DBEAFE; color: #1E40AF; }
.status-badge.completed { background: #E0E7FF; color: #3730A3; }
.action-links { display: flex; gap: 8px; }
.action-link { font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: none; white-space: nowrap; }
.action-link:hover { text-decoration: underline; }
.action-link.warn { color: var(--warning); }

/* Category badge */
.cat-badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; margin-left: 6px; }
.cat-badge.district { background: #DBEAFE; color: #1E40AF; }
.cat-badge.city { background: #FEF3C7; color: #92400E; }

/* File link */
.file-link { font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: none; }
.file-link:hover { text-decoration: underline; }
.file-link.none { color: var(--text-light); cursor: default; }
.file-link.none:hover { text-decoration: none; }

/* Remind button */
.btn-remind { padding: 4px 12px; font-size: 12px; background: #fff; color: var(--primary); border: 1px solid var(--primary); border-radius: 4px; cursor: pointer; font-family: inherit; white-space: nowrap; }
.btn-remind:hover { background: var(--primary-light); }
.btn-reminded { padding: 4px 12px; font-size: 12px; background: var(--gray-bg); color: var(--text-light); border: 1px solid var(--border); border-radius: 4px; cursor: default; font-family: inherit; white-space: nowrap; }

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state .empty-text { font-size: 14px; margin-bottom: 16px; }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal-container { background: #fff; border-radius: var(--radius-lg); padding: 28px; width: 480px; max-width: 90vw; box-shadow: var(--shadow-lg); }
.modal-container h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel { padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.btn-cancel:hover { background: var(--gray-bg); }
.btn-confirm { padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px; border: none; color: #fff; cursor: pointer; font-family: inherit; }
.btn-confirm.success { background: var(--success); }
.btn-confirm.success:hover { background: #059669; }

/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease; box-shadow: var(--shadow-lg); }
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Export modal */
.modal-wide { width: 920px; max-width: 95vw; max-height: 90vh; display: flex; flex-direction: column; }
.export-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.export-filters label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-secondary); }
.export-filters select { padding: 5px 8px; font-size: 12px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; background: #fff; min-width: 120px; }
.export-table-wrap { flex: 1; overflow: auto; max-height: 380px; border: 1px solid var(--border); border-radius: 6px; }
.export-table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
.export-table th { padding: 8px 10px; text-align: center; font-weight: 600; font-size: 11px; color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; }
.export-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: center; }
.export-table tr:hover { background: #FAFBFC; }
.export-table .cb-cell { width: 36px; text-align: center; }
.export-summary { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 12px; color: var(--text-secondary); }
.btn-export { padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px; border: none; background: var(--primary); color: #fff; cursor: pointer; font-family: inherit; }
.btn-export:hover { background: var(--primary-dark); }
.btn-export:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-outline { padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
.btn-outline:hover { background: var(--gray-bg); border-color: var(--text-light); }
</style>
</head>

function loadRecords() { try { var stored = JSON.parse(localStorage.getItem('post_records') || 'null'); if (stored && stored.length) { var ids = {}; stored.forEach(function(r) { ids[r.id] = true; }); var merged = stored.slice(); DEMO_RECORDS.forEach(function(r) { if (!ids[r.id]) { merged.push(r); ids[r.id] = true; } }); return merged; } } catch(e) {} return JSON.parse(JSON.stringify(DEMO_RECORDS)); }
function saveRecords(r) { localStorage.setItem('post_records', JSON.stringify(r)); }
function resetDemoData() { localStorage.removeItem('post_records'); localStorage.removeItem('post_seq'); location.reload(); }

function showToast(msg, type) { var el = document.createElement('div'); el.className = 'toast ' + (type||''); el.textContent = msg; document.getElementById('toastContainer').appendChild(el); setTimeout(function(){el.remove();}, 2000); }
function pct(n, total) { return total > 0 ? (n / total * 100).toFixed(1) : '0.0'; }
function formatSize(bytes) { if (!bytes) return ''; if (bytes < 1024) return bytes + 'B'; if (bytes < 1048576) return (bytes/1024).toFixed(1) + 'KB'; return (bytes/1048576).toFixed(1) + 'MB'; }
function toggleUserMenu() { document.getElementById('userDropdown').classList.toggle('show'); }
document.addEventListener('click', function(e) { if (!e.target.closest('.topnav-user')) document.getElementById('userDropdown').classList.remove('show'); });
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

function switchRole(role) {
  if (role === 'school') { window.location.href = 'post-list-school.html'; }
  else if (role === 'city' || role === 'district') { window.location.href = 'post-list-admin.html?role=' + role; }
  else if (role === 'teacher') { showToast('教师角色无此功能权限', 'warning'); }
}

function canFirstReview(record) {
  if (record.status !== 'first_review') return false;
  var cat = SCHOOL_CATEGORY_MAP[record.schoolName] || '';
  if (currentRole === 'district') return cat === '鱼峰区属';
  if (currentRole === 'city') return cat === '市直属';
  return false;
}

function canSecondReview(record) {
  if (record.status !== 'second_review') return false;
  var cat = SCHOOL_CATEGORY_MAP[record.schoolName] || '';
  if (currentRole === 'district') return cat === '鱼峰区属';
  if (currentRole === 'city') return cat === '市直属';
  return false;
}

function getPermittedRecords() {
  var records = loadRecords();
  return records.filter(function(r) {
    var cat = SCHOOL_CATEGORY_MAP[r.schoolName] || '';
    if (currentRole === 'district') return cat === '鱼峰区属';
    if (currentRole === 'city') return true;
    return false;
  });
}

function getUnsubmittedSchools() {
  var records = loadRecords();
  var submittedSchools = {};
  records.forEach(function(r) { submittedSchools[r.schoolName] = true; });
  return SCHOOL_LIST.filter(function(name) {
    var cat = SCHOOL_CATEGORY_MAP[name] || '';
    if (currentRole === 'district' && cat !== '鱼峰区属') return false;
    return !submittedSchools[name];
  });
}

function loadReminders() {
  try { return JSON.parse(localStorage.getItem('post_reminders') || '{}'); } catch(e) { return {}; }
}
function saveReminders(data) { localStorage.setItem('post_reminders', JSON.stringify(data)); }

function canRemind(schoolName) {
  var reminders = loadReminders();
  var r = reminders[schoolName];
  if (!r) return true;
  var today = new Date().toISOString().substring(0, 10);
  return (r.time || '').substring(0, 10) !== today;
}

function getLastReminderDisplay(schoolName) {
  var reminders = loadReminders();
  var r = reminders[schoolName];
  if (!r) return '—';
  var time = (r.time || '').substring(0, 16);
  var cnt = r.count || 1;
  return time + ' (第' + cnt + '次)';
}

function showRemindModal(schoolName) {
  var modalHtml =
    '<div class="modal-overlay" id="remindModal">' +
      '<div class="modal-container">' +
        '<h3>提醒申报确认</h3>' +
        '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">' +
          '将向<strong>' + schoolName + '</strong>发送岗位设置申请提醒通知。每个学校每日最多提醒一次。' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelRemind">取消</button>' +
          '<button class="btn-confirm success" id="confirmRemind">确认发送</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('cancelRemind').onclick = function() { document.getElementById('remindModal').remove(); };
  document.getElementById('confirmRemind').onclick = function() { doRemind(schoolName); };
}

function doRemind(schoolName) {
  var modalEl = document.getElementById('remindModal');
  if (modalEl) modalEl.remove();
  var now = new Date().toISOString().replace('T', ' ').substring(0, 19);
  var reminders = loadReminders();
  if (!reminders[schoolName]) { reminders[schoolName] = { time: now, count: 1, read: false }; }
  else {
    reminders[schoolName].time = now;
    reminders[schoolName].count = (reminders[schoolName].count || 0) + 1;
    reminders[schoolName].read = false;
  }
  saveReminders(reminders);
  showToast('已向' + schoolName + '发送提醒', 'success');
  renderTable();
}

function getFilteredRecords() {
  if (currentFilter === 'unsubmitted') return [];
  var records = getPermittedRecords();
  if (currentSchoolFilter !== 'all') {
    records = records.filter(function(r) { return r.schoolName === currentSchoolFilter; });
  }
  if (currentFilter === 'reviewing') return records.filter(function(r) { return r.status === 'first_review' || r.status === 'second_review'; });
  if (currentFilter === 'passed') return records.filter(function(r) { return r.status === 'first_approved' || r.status === 'completed'; });
  if (currentFilter === 'rejected') return records.filter(function(r) { return r.status === 'first_rejected'; });
  return records;
}

function getFilterCounts() {
  var records = getPermittedRecords();
  return {
    all: records.length,
    reviewing: records.filter(function(r){ return r.status==='first_review' || r.status==='second_review'; }).length,
    passed: records.filter(function(r){ return r.status==='first_approved' || r.status==='completed'; }).length,
    rejected: records.filter(function(r){ return r.status==='first_rejected'; }).length,
    unsubmitted: getUnsubmittedSchools().length
  };
}

function renderSidebar() {
  var roleData = ROLES[currentRole]; if (!roleData) return;
  var s = roleData.sidebar, html = '';
  (s.top||[]).forEach(function(i) { html += '<a class="menu-item' + (i.id==='postset'?' active':'') + '" onclick="sidebarClick(this,\'' + i.id + '\')">' + (ICONS[i.icon]||'') + '<span class="menu-label">' + i.label + '</span></a>'; });
  (s.groups||[]).forEach(function(g) { html += '<div class="menu-group">' + g.name + '</div>'; g.items.forEach(function(i) { html += '<a class="menu-item' + (i.id==='postset'?' active':'') + '" onclick="sidebarClick(this,\'' + i.id + '\')">' + (ICONS[MENU_ICONS[i.id]||'file']) + '<span class="menu-label">' + i.label + '</span>' + (i.badge?'<span class="menu-badge">'+i.badge+'</span>':'') + '</a>'; }); });
  document.getElementById('sidebarMenu').innerHTML = html;
  document.querySelectorAll('.role-switch-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.role===currentRole); });
  var n = document.querySelector('.topnav-user span'); if(n) n.textContent = roleData.name;
  var a = document.querySelector('.topnav-user .avatar'); if(a) a.textContent = roleData.short;
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i){i.classList.remove('active');}); el.classList.add('active');
  if (id==='workbench') { window.location.href='workbench.html'; return; }
  if (id==='staffing') { window.location.href='staffing-application.html'; return; }
  if (id==='entry') { window.location.href='教师入编管理（学校管理员视角）.html'; return; }
  if (id==='exit') { window.location.href='教师出编管理（学校管理员视角）.html'; return; }
  if (id==='promote') { window.location.href = 'promote-list-admin.html?role=' + currentRole; return; }
  if (id==='recruit') { window.location.href='recruit-list-admin.html?role=' + currentRole; return; }
  if (id==='postset') return;
  showToast('跳转至：' + (el.querySelector('.menu-label')?el.querySelector('.menu-label').textContent:id));
}

function getStatusBadgeClass(status) {
  if (status === 'first_review' || status === 'second_review') return 'review';
  if (status === 'first_approved') return 'approved';
  if (status === 'first_rejected') return 'rejected';
  if (status === 'completed') return 'completed';
  return 'pending';
}

function renderFilterBar() {
  var counts = getFilterCounts();
  var tabs = [
    { key:'all', label:'全部', count:counts.all },
    { key:'reviewing', label:'审核中', count:counts.reviewing },
    { key:'passed', label:'已通过', count:counts.passed },
    { key:'rejected', label:'已驳回', count:counts.rejected },
    { key:'unsubmitted', label:'待提交', count:counts.unsubmitted }
  ];
  var h = '<div class="filter-tabs">';
  tabs.forEach(function(t) {
    h += '<button class="filter-tab' + (currentFilter===t.key?' active':'') + '" onclick="setFilter(\'' + t.key + '\')">' + t.label + '<span class="count">(' + t.count + ')</span></button>';
  });
  h += '</div>';
  h += '<div class="school-filter"><span>筛选学校：</span><select onchange="currentSchoolFilter=this.value;renderAll()">';
  h += '<option value="all"' + (currentSchoolFilter==='all'?' selected':'') + '>全部学校</option>';
  SCHOOL_LIST.forEach(function(s) { h += '<option value="' + s + '"' + (currentSchoolFilter===s?' selected':'') + '>' + s + '</option>'; });
  h += '</select></div>';
  document.getElementById('filterBar').innerHTML = h;
}

function renderTable() {
  if (currentFilter === 'unsubmitted') {
    var schools = getUnsubmittedSchools();
    if (schools.length === 0) {
      document.getElementById('tableArea').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">所有学校均已提交岗位设置申请</div></div>';
      return;
    }
    var h = '<table class="list-table"><thead><tr><th>学校名称</th><th>所属类别</th><th>最近提醒</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    schools.forEach(function(name) {
      h += '<tr><td>' + name + '</td><td>' + (SCHOOL_CATEGORY_MAP[name]||'—') + '</td>';
      h += '<td style="font-size:12px;color:var(--text-secondary);">' + getLastReminderDisplay(name) + '</td>';
      h += '<td><span class="status-badge pending">待提交</span></td>';
      h += '<td>';
      if (canRemind(name)) {
        h += '<button class="btn-remind" onclick="event.stopPropagation();showRemindModal(\'' + name + '\')">提醒申报</button>';
      } else {
        h += '<button class="btn-reminded" disabled>今日已提醒</button>';
      }
      h += '</td></tr>';
    });
    h += '</tbody></table>';
    document.getElementById('tableArea').innerHTML = h;
    return;
  }
  var records = getFilteredRecords();
  if (records.length === 0) {
    document.getElementById('tableArea').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无岗位设置申请记录</div></div>';
    return;
  }
  var h = '<div class="table-scroll"><table class="list-table"><thead><tr>';
  h += '<th>申请编号</th><th>学校名称</th><th>学校类型</th><th>所属区域</th><th>机构规格</th><th>经费形式</th>';
  h += '<th>总量控制数</th><th>事业编制数</th><th>聘用控制数</th>';
  h += '<th>岗位总量</th>';
  h += '<th>管理岗</th><th>管理岗比</th>';
  h += '<th>专技岗</th><th>专技岗比</th>';
  h += '<th>工勤岗</th><th>工勤岗比</th>';
  h += '<th>附件</th><th>人社批复</th>';
  h += '<th>提交时间</th><th>状态</th><th>操作</th>';
  h += '</tr></thead><tbody>';
  records.forEach(function(r) {
    var cat = SCHOOL_CATEGORY_MAP[r.schoolName] || '';
    var tp = r.totalPosts || 0;
    h += '<tr>';
    h += '<td class="col-id">' + r.id + '</td>';
    h += '<td class="col-name">' + (r.schoolName||'—') + '</td>';
    h += '<td>' + (r.schoolType||'—') + '</td>';
    h += '<td>' + (cat||'—') + '</td>';
    h += '<td>' + (r.orgLevel||'—') + '</td>';
    h += '<td>' + (r.fundType||'—') + '</td>';
    h += '<td class="col-num">' + (r.totalControlQuota||0) + '</td>';
    h += '<td class="col-num">' + (r.careerStaffQuota||0) + '</td>';
    h += '<td class="col-num">' + (r.authControlNo||0) + '</td>';
    h += '<td class="col-num"><strong>' + tp + '</strong></td>';
    h += '<td class="col-num">' + (r.mgmtPosts||0) + '</td>';
    h += '<td class="col-pct">' + pct(r.mgmtPosts||0, tp) + '%</td>';
    h += '<td class="col-num">' + (r.profPosts||0) + '</td>';
    h += '<td class="col-pct">' + pct(r.profPosts||0, tp) + '%</td>';
    h += '<td class="col-num">' + (r.laborPosts||0) + '</td>';
    h += '<td class="col-pct">' + pct(r.laborPosts||0, tp) + '%</td>';
    // Attachments
    h += '<td>';
    if (r.attachments && r.attachments.length > 0) {
      r.attachments.forEach(function(f, fi) {
        h += '<div><a class="file-link" onclick="showToast(\'预览：' + f.name + '（模拟）\')">' + (fi+1) + '.' + f.name + '</a></div>';
      });
    } else { h += '<span class="file-link none">无</span>'; }
    h += '</td>';
    // HR approval attachment
    h += '<td>';
    if (r.hrApprovalAttachment) {
      h += '<a class="file-link" onclick="showToast(\'预览：' + r.hrApprovalAttachment.name + '（模拟）\')">' + r.hrApprovalAttachment.name + '</a>';
    } else { h += '<span class="file-link none">—</span>'; }
    h += '</td>';
    // Submit time
    h += '<td style="font-size:12px;color:var(--text-secondary);">' + (r.submitTime ? r.submitTime.substring(0,10) : '—') + '</td>';
    // Status
    var statusCls = '';
    var st = r.status || '';
    if (st === 'first_review' || st === 'second_review') statusCls = 'review';
    else if (st === 'first_approved') statusCls = 'approved';
    else if (st === 'first_rejected') statusCls = 'rejected';
    else if (st === 'completed') statusCls = 'completed';
    h += '<td><span class="status-badge ' + statusCls + '">' + STATUS_MAP[st] + '</span></td>';
    // Actions
    h += '<td class="col-action"><div class="action-links">';
    if (canFirstReview(r)) { h += '<a class="action-link" onclick="reviewFirst(\'' + r.id + '\')">审核</a>'; }
    else if (canSecondReview(r)) { h += '<a class="action-link" onclick="reviewSecond(\'' + r.id + '\')">审核</a>'; }
    else { h += '<a class="action-link" onclick="viewDetail(\'' + r.id + '\')">查看</a>'; }
    h += '</div></td></tr>';
  });
  h += '</tbody></table></div>';
  document.getElementById('tableArea').innerHTML = h;
}

function setFilter(f) { currentFilter = f; renderFilterBar(); renderTable(); }
function viewDetail(id) { window.location.href = 'post-detail.html?id=' + id; }
function reviewFirst(id) { window.location.href = 'post-audit-first.html?id=' + id; }
function reviewSecond(id) { window.location.href = 'post-audit-second.html?id=' + id; }

function renderAll() { renderFilterBar(); renderTable(); }

// ===== Export Modal =====
function showExportModal() {
  var records = getPermittedRecords();
  var schools = [], orgLevels = [], fundTypes = [], categories = [], schoolTypes = [], statuses = [];
  records.forEach(function(r) {
    var cat = SCHOOL_CATEGORY_MAP[r.schoolName] || '';
    if (r.schoolName && schools.indexOf(r.schoolName) < 0) schools.push(r.schoolName);
    if (r.orgLevel && orgLevels.indexOf(r.orgLevel) < 0) orgLevels.push(r.orgLevel);
    if (r.fundType && fundTypes.indexOf(r.fundType) < 0) fundTypes.push(r.fundType);
    if (cat && categories.indexOf(cat) < 0) categories.push(cat);
    if (r.schoolType && schoolTypes.indexOf(r.schoolType) < 0) schoolTypes.push(r.schoolType);
    if (r.status && statuses.indexOf(r.status) < 0) statuses.push(r.status);
  });

  var h = '<div class="modal-overlay" id="exportModal" onclick="if(event.target===this)closeExportModal()">';
  h += '<div class="modal-container modal-wide">';
  h += '<h3>导出数据</h3>';

  // Filters
  h += '<div class="export-filters">';
  h += '<label>学校名称<select id="ef_school" onchange="filterExportTable()"><option value="">全部</option>';
  schools.forEach(function(s) { h += '<option value="' + s + '">' + s + '</option>'; });
  h += '</select></label>';
  h += '<label>机构规格<select id="ef_org" onchange="filterExportTable()"><option value="">全部</option>';
  orgLevels.forEach(function(s) { h += '<option value="' + s + '">' + s + '</option>'; });
  h += '</select></label>';
  h += '<label>经费形式<select id="ef_fund" onchange="filterExportTable()"><option value="">全部</option>';
  fundTypes.forEach(function(s) { h += '<option value="' + s + '">' + s + '</option>'; });
  h += '</select></label>';
  h += '<label>所属区域<select id="ef_cat" onchange="filterExportTable()"><option value="">全部</option>';
  categories.forEach(function(s) { h += '<option value="' + s + '">' + s + '</option>'; });
  h += '</select></label>';
  h += '<label>学校类型<select id="ef_type" onchange="filterExportTable()"><option value="">全部</option>';
  schoolTypes.forEach(function(s) { h += '<option value="' + s + '">' + s + '</option>'; });
  h += '</select></label>';
  h += '<label>状态<select id="ef_status" onchange="filterExportTable()"><option value="">全部</option>';
  statuses.forEach(function(s) { h += '<option value="' + s + '">' + STATUS_MAP[s] + '</option>'; });
  h += '</select></label>';
  h += '</div>';

  // Table
  h += '<div class="export-table-wrap"><table class="export-table"><thead><tr>';
  h += '<th class="cb-cell"><input type="checkbox" id="exportSelectAll" onchange="toggleExportSelectAll()" checked></th>';
  h += '<th>申请编号</th><th>学校名称</th><th>学校类型</th><th>所属区域</th><th>机构规格</th><th>经费形式</th>';
  h += '<th>岗位总量</th><th>管理岗</th><th>专技岗</th><th>工勤岗</th><th>状态</th><th>提交时间</th>';
  h += '</tr></thead><tbody id="exportTbody">';
  records.forEach(function(r) {
    var cat = SCHOOL_CATEGORY_MAP[r.schoolName] || '';
    h += '<tr data-id="' + r.id + '" data-school="' + (r.schoolName||'') + '" data-org="' + (r.orgLevel||'') + '" data-fund="' + (r.fundType||'') + '" data-cat="' + cat + '" data-type="' + (r.schoolType||'') + '" data-status="' + (r.status||'') + '">';
    h += '<td class="cb-cell"><input type="checkbox" class="export-cb" value="' + r.id + '" checked onchange="updateExportSummary()"></td>';
    h += '<td>' + r.id + '</td>';
    h += '<td>' + (r.schoolName||'') + '</td>';
    h += '<td>' + (r.schoolType||'') + '</td>';
    h += '<td>' + cat + '</td>';
    h += '<td>' + (r.orgLevel||'') + '</td>';
    h += '<td>' + (r.fundType||'') + '</td>';
    h += '<td>' + (r.totalPosts||0) + '</td>';
    h += '<td>' + (r.mgmtPosts||0) + '</td>';
    h += '<td>' + (r.profPosts||0) + '</td>';
    h += '<td>' + (r.laborPosts||0) + '</td>';
    h += '<td>' + (STATUS_MAP[r.status]||'') + '</td>';
    h += '<td>' + (r.submitTime||'').substring(0,10) + '</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  // Footer
  h += '<div class="export-summary">';
  h += '<span id="exportCountInfo">已选 ' + records.length + ' 条，共 ' + records.length + ' 条</span>';
  h += '<div style="display:flex;gap:10px;">';
  h += '<button class="btn-cancel" onclick="closeExportModal()">取消</button>';
  h += '<button class="btn-export" id="btnDoExport" onclick="doExportChecked()">下载CSV</button>';
  h += '</div></div>';

  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
  updateExportSummary();
}

function closeExportModal() {
  var m = document.getElementById('exportModal');
  if (m) m.remove();
}

function filterExportTable() {
  var fSchool = document.getElementById('ef_school').value;
  var fOrg = document.getElementById('ef_org').value;
  var fFund = document.getElementById('ef_fund').value;
  var fCat = document.getElementById('ef_cat').value;
  var fType = document.getElementById('ef_type').value;
  var fStatus = document.getElementById('ef_status').value;

  var rows = document.querySelectorAll('#exportTbody tr');
  rows.forEach(function(row) {
    var show = true;
    if (fSchool && row.dataset.school !== fSchool) show = false;
    if (fOrg && row.dataset.org !== fOrg) show = false;
    if (fFund && row.dataset.fund !== fFund) show = false;
    if (fCat && row.dataset.cat !== fCat) show = false;
    if (fType && row.dataset.type !== fType) show = false;
    if (fStatus && row.dataset.status !== fStatus) show = false;
    row.style.display = show ? '' : 'none';
    if (!show) {
      var cb = row.querySelector('.export-cb');
      if (cb) cb.checked = false;
    }
  });
  updateExportSummary();
}

function toggleExportSelectAll() {
  var all = document.getElementById('exportSelectAll').checked;
  var rows = document.querySelectorAll('#exportTbody tr');
  rows.forEach(function(row) {
    if (row.style.display !== 'none') {
      var cb = row.querySelector('.export-cb');
      if (cb) cb.checked = all;
    }
  });
  updateExportSummary();
}

function updateExportSummary() {
  var total = 0, checked = 0;
  var rows = document.querySelectorAll('#exportTbody tr');
  rows.forEach(function(row) {
    if (row.style.display !== 'none') {
      total++;
      var cb = row.querySelector('.export-cb');
      if (cb && cb.checked) checked++;
    }
  });
  var info = document.getElementById('exportCountInfo');
  if (info) info.textContent = '已选 ' + checked + ' 条，共 ' + total + ' 条';
  var btn = document.getElementById('btnDoExport');
  if (btn) btn.disabled = (checked === 0);
}

function doExportChecked() {
  var selectedIds = [];
  document.querySelectorAll('#exportTbody tr').forEach(function(row) {
    if (row.style.display !== 'none') {
      var cb = row.querySelector('.export-cb');
      if (cb && cb.checked) selectedIds.push(cb.value);
    }
  });
  if (selectedIds.length === 0) { showToast('请至少选择一条记录', 'warning'); return; }

  var records = getPermittedRecords().filter(function(r) { return selectedIds.indexOf(r.id) >= 0; });
  var headers = ['申请编号','学校名称','学校类型','所属区域','机构规格','经费形式',
    '总量控制数','事业编制数','聘用控制数','岗位总量',
    '管理岗位数','管理岗占比','专技岗位数','专技岗占比','工勤岗位数','工勤岗占比',
    '管理五级','管理六级','管理七级','管理八级','管理九级','管理十级',
    '专技正高合计','专技三级','专技四级',
    '专技副高合计','专技五级','专技六级','专技七级',
    '专技中级合计','专技八级','专技九级','专技十级',
    '专技初级合计','专技十一级','专技十二级','专技十三级',
    '工勤一级','工勤二级','工勤三级','工勤四级','工勤五级','工勤普工',
    '状态','提交时间'];

  var rows = [headers.join(',')];
  records.forEach(function(r) {
    var cat = SCHOOL_CATEGORY_MAP[r.schoolName] || '';
    var tp = r.totalPosts || 0;
    var pl = r.profLevels || { senior:{total:0,levels:{}}, vice:{total:0,levels:{}}, middle:{total:0,levels:{}}, junior:{total:0,levels:{}} };
    var ml = r.mgmtLevels || {};
    var ll = r.laborLevels || {};
    var row = [
      r.id, r.schoolName||'', r.schoolType||'', cat, r.orgLevel||'', r.fundType||'',
      r.totalControlQuota||0, r.careerStaffQuota||0, r.authControlNo||0, tp,
      r.mgmtPosts||0, pct(r.mgmtPosts||0,tp)+'%', r.profPosts||0, pct(r.profPosts||0,tp)+'%', r.laborPosts||0, pct(r.laborPosts||0,tp)+'%',
      ml['5']||0, ml['6']||0, ml['7']||0, ml['8']||0, ml['9']||0, ml['10']||0,
      (pl.senior?pl.senior.total:0), (pl.senior&&pl.senior.levels?pl.senior.levels['3']||0:0), (pl.senior&&pl.senior.levels?pl.senior.levels['4']||0:0),
      (pl.vice?pl.vice.total:0), (pl.vice&&pl.vice.levels?pl.vice.levels['5']||0:0), (pl.vice&&pl.vice.levels?pl.vice.levels['6']||0:0), (pl.vice&&pl.vice.levels?pl.vice.levels['7']||0:0),
      (pl.middle?pl.middle.total:0), (pl.middle&&pl.middle.levels?pl.middle.levels['8']||0:0), (pl.middle&&pl.middle.levels?pl.middle.levels['9']||0:0), (pl.middle&&pl.middle.levels?pl.middle.levels['10']||0:0),
      (pl.junior?pl.junior.total:0), (pl.junior&&pl.junior.levels?pl.junior.levels['11']||0:0), (pl.junior&&pl.junior.levels?pl.junior.levels['12']||0:0), (pl.junior&&pl.junior.levels?pl.junior.levels['13']||0:0),
      ll['1']||0, ll['2']||0, ll['3']||0, ll['4']||0, ll['5']||0, ll['common']||0,
      STATUS_MAP[r.status]||'', (r.submitTime||'').substring(0,10)
    ];
    rows.push(row.join(','));
  });

  var csv = '﻿' + rows.join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '岗位设置申请汇总表_' + new Date().toISOString().substring(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出 ' + records.length + ' 条记录', 'success');
  closeExportModal();
}

function getUrlParam(name) {
  var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}

function init() {
  var roleParam = getUrlParam('role');
  if (roleParam === 'city' || roleParam === 'district') currentRole = roleParam;
  renderSidebar();
  renderAll();
}
init();
</script>
