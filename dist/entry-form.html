<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入编申请 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}

.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }

.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

.page-header { margin-bottom: 24px; display: flex; align-items: flex-start; justify-content: space-between; }
.page-header h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); }

/* Form card */
.form-card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  padding: 28px 32px; margin-bottom: 20px;
}
.form-card-title {
  font-size: 15px; font-weight: 600; color: var(--text);
  padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}

/* Type selector */
.type-selector { display: flex; gap: 12px; }
.type-option {
  flex: 1; padding: 16px; border: 2px solid var(--border); border-radius: var(--radius-lg);
  cursor: pointer; text-align: center; transition: var(--transition); background: #fff;
}
.type-option:hover { border-color: var(--accent); }
.type-option.selected { border-color: var(--primary); background: var(--primary-light); }
.type-option .type-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.type-option .type-form { font-size: 12px; color: var(--text-secondary); }
.type-option .type-badge {
  display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 500;
}
.type-badge.career { background: #DBEAFE; color: #1E40AF; }
.type-badge.control { background: #E0E7FF; color: #3730A3; }
.type-option .type-desc { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* Unit info readonly grid */
.unit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.unit-grid .info-item {
  padding: 10px 14px; background: #F8FAFC; border-radius: 8px;
  border: 1px solid var(--border);
}
.unit-grid .info-item.full-width { grid-column: 1 / -1; }
.unit-grid .info-label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; font-weight: 500; }
.unit-grid .info-value {
  font-size: 14px; font-weight: 600; color: var(--text);
}
.unit-grid .info-value.calculated {
  color: var(--primary); font-size: 14px;
}
.info-value.select-like {
  font-size: 14px; font-weight: 600; color: var(--text); padding: 8px 0;
}

/* Unit info: 控制数类型 selector (in unit info section) */
.unit-grid select {
  width: 100%; padding: 4px 8px; font-size: 13px;
  border: 1px solid var(--border); border-radius: 4px; font-family: inherit;
  background: #fff; color: var(--text); margin-top: 4px;
}

/* Quota summary bar */
.quota-summary {
  display: flex; gap: 16px; margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.quota-item {
  flex: 1; text-align: center; padding: 10px; background: #F8FAFC;
  border-radius: 8px;
}
.quota-item .q-label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
.quota-item .q-value { font-size: 18px; font-weight: 700; }
.quota-item .q-value.ok { color: #10B981; }
.quota-item .q-value.warn { color: #F59E0B; }
.quota-item .q-value.error { color: #EF4444; }
.quota-detail { font-size: 11px; color: var(--text-light); margin-top: 4px; line-height: 1.5; }
input[readonly], select[disabled] { background: #F1F5F9; color: #64748B; cursor: not-allowed; }

/* Career form groups */
.form-group-section {
  margin-bottom: 24px;
}
.form-group-section .section-label {
  font-size: 12px; font-weight: 600; color: var(--primary);
  margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px dashed var(--border);
  text-transform: uppercase; letter-spacing: 1px;
}
.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.form-grid .full-width { grid-column: 1 / -1; }
.form-field { }
.form-field label {
  display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px;
}
.form-field label .required { color: var(--danger); margin-left: 2px; }
.form-field input, .form-field select, .form-field textarea {
  width: 100%; padding: 8px 12px; font-size: 13px;
  border: 1px solid var(--border); border-radius: 6px;
  font-family: inherit; outline: none; transition: var(--transition);
  background: #fff; color: var(--text);
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}
.form-field textarea { resize: vertical; min-height: 80px; }

/* Control table */
.entry-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.entry-table th {
  padding: 10px 12px; text-align: center; font-weight: 600; font-size: 12px;
  color: var(--text-secondary); background: #F8FAFC; border: 1px solid var(--border);
}
.entry-table td {
  padding: 8px; border: 1px solid var(--border); text-align: center;
}
.entry-table td input, .entry-table td select {
  width: 100%; padding: 6px 8px; font-size: 12px; border: 1px solid var(--border);
  border-radius: 4px; font-family: inherit; outline: none;
}
.entry-table td input:focus, .entry-table td select:focus {
  border-color: var(--accent);
}
.entry-table .row-actions button {
  padding: 4px 10px; font-size: 12px; border-radius: 4px; border: none;
  cursor: pointer; font-family: inherit; transition: var(--transition);
}
.btn-delete-row { background: #FEF2F2; color: var(--danger); }
.btn-delete-row:hover { background: #FEE2E2; }
.btn-add-row {
  margin-top: 12px; padding: 8px 20px; font-size: 13px;
  background: #fff; color: var(--primary); border: 1px dashed var(--accent);
  border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition);
}
.btn-add-row:hover { background: var(--primary-light); }
.row-materials-section { font-size: 11px; text-align: left; }
.row-materials-section .row-upload-btn {
  font-size: 11px; padding: 3px 10px; background: #F8FAFC; border: 1px solid var(--border);
  border-radius: 4px; cursor: pointer; color: var(--primary);
}
.row-materials-section .file-list { font-size: 11px; margin-top: 4px; }
.row-materials-section .file-list .file-tag {
  display: inline-block; background: #F0FDF4; padding: 1px 8px; border-radius: 3px;
  margin-right: 4px; margin-bottom: 2px; cursor: pointer;
}

/* Materials upload */
.upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 24px; text-align: center; cursor: pointer; transition: var(--transition);
  margin-bottom: 4px;
}
.upload-area:hover { border-color: var(--accent); background: #F8FAFC; }
.upload-area.drag-over { border-color: var(--primary); background: var(--primary-light); }
.upload-area .upload-icon { font-size: 32px; margin-bottom: 4px; }
.upload-area .upload-text { font-size: 13px; color: var(--text-secondary); }
.upload-area .upload-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.upload-file-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px;
  background: #F0FDF4; border-radius: 6px; margin-top: 8px; font-size: 13px;
}
.upload-file-item .remove { color: var(--danger); cursor: pointer; margin-left: auto; font-size: 16px; }

/* ===== Material Inline Row ===== */
.material-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; margin: 0 -10px; min-height: 36px;
  border-radius: 6px; font-size: 13px;
  transition: background 0.15s; flex-wrap: wrap;
}
.material-row:hover { background: #F8FAFC; }
.material-row .mat-marker { width: 16px; flex-shrink: 0; text-align: center; font-size: 13px; }
.material-row .mat-marker.red { color: var(--danger); font-weight: 700; }
.material-row .mat-marker.gray { color: var(--text-light); font-size: 12px; }
.material-row .mat-label { flex: 1; min-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--text); }
.material-row .mat-note { font-size: 10px; color: var(--text-light); flex-shrink: 0; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* File chip */
.file-chip {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; font-size: 11px; line-height: 1.5;
  background: #EFF6FF; color: #1E40AF;
  border-radius: 4px; max-width: 130px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.file-chip .file-del {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 3px;
  font-size: 12px; color: #94A3B8; cursor: pointer; margin-left: 2px; flex-shrink: 0;
  transition: background 0.15s;
}
.file-chip .file-del:hover { background: #FEE2E2; color: var(--danger); }
.file-chip-more {
  display: inline-flex; align-items: center;
  padding: 2px 8px; font-size: 11px; line-height: 1.5;
  background: #F1F5F9; color: var(--text-secondary);
  border-radius: 4px; cursor: default;
}

/* Status chip */
.status-chip {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 500; flex-shrink: 0; line-height: 1.5;
}
.status-chip.done { background: #ECFDF5; color: #059669; }
.status-chip.pending { background: #FFFBEB; color: #D97706; }
.status-chip.none { background: transparent; color: var(--text-light); font-weight: 400; }

/* Select file button */
.btn-file-select {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 14px; font-size: 12px; font-weight: 500;
  border: 1px solid var(--accent); color: var(--accent);
  border-radius: 6px; background: #fff; cursor: pointer;
  transition: all 0.15s; flex-shrink: 0;
  font-family: inherit; line-height: 1.5;
}
.btn-file-select:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

/* Section header */
.mat-section-header {
  font-size: 12px; font-weight: 600; color: var(--text);
  padding: 8px 0 4px; margin-bottom: 2px;
}
.mat-section-header.opt { color: var(--text-secondary); }
.mat-section-header .bar {
  display: inline-block; width: 3px; height: 14px;
  background: var(--primary); border-radius: 2px; margin-right: 6px; vertical-align: middle;
}
.mat-section-header.opt .bar { background: var(--text-light); }

/* Progress bar */
.mat-progress {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; font-size: 12px; color: var(--text-secondary);
}
.mat-progress-bar { flex: 1; max-width: 180px; height: 8px; background: #E2E8F0; border-radius: 4px; overflow: hidden; }
.mat-progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--success)); border-radius: 4px; transition: width 0.3s; }

/* Placeholder */
.mat-placeholder { padding: 24px 0; text-align: center; font-size: 13px; color: var(--text-light); }


/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; font-size: 13px; font-weight: 500;
  border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition);
  border: 1px solid transparent; text-decoration: none;
}
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: #fff; color: var(--text-secondary); border-color: var(--border); }
.btn-outline:hover { background: var(--gray-bg); }
.btn-lg { padding: 10px 28px; font-size: 14px; }
.form-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 0; margin-top: 8px;
}

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Empty / error */
.field-error { border-color: var(--danger) !important; }
.field-error-msg { font-size: 11px; color: var(--danger); margin-top: 2px; }

/* Unit info detail table */
.info-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.info-table td { padding: 8px 14px; border: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.info-table .ilabel { background: var(--gray-bg); color: var(--text-secondary); font-weight: 500; width: 180px; white-space: nowrap; }
.info-table .ivalue { background: #fff; color: var(--text); font-weight: 600; }
.info-section-label { font-size: 13px; font-weight: 600; color: var(--primary); margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--border); }
.info-subtable { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
.info-subtable > tbody > tr > td { vertical-align: top; padding: 0; }
.isub-left { width: 50%; padding-right: 8px !important; }
.isub-right { width: 50%; padding-left: 8px !important; }
.info-mini { width: 100%; border-collapse: collapse; }
.info-mini td, .info-mini th { padding: 6px 10px; border: 1px solid var(--border); font-size: 12px; text-align: left; }
.info-mini th { background: var(--gray-bg); color: var(--text-secondary); font-weight: 500; }
.info-mini td { background: #fff; }
.info-mini td:last-child, .info-mini th:last-child { text-align: center; width: 120px; }

.btn-edit-org {
  margin-left: auto; padding: 4px 14px; font-size: 12px; font-weight: 400;
  background: #fff; color: var(--accent); border: 1px solid var(--accent);
  border-radius: 4px; cursor: pointer; transition: var(--transition);
}
.btn-edit-org:hover { background: var(--primary-light); }

/* Staffing batch dashboard */
.batch-card { overflow: hidden; }
.batch-header { margin-bottom: 14px; }
.bh-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 13px; }
.bh-label { color: var(--text-light); min-width: 70px; font-size: 12px; }
.bh-value { color: var(--text); font-weight: 500; }
.d-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.d-panel {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 14px 12px 12px; text-align: center; box-shadow: var(--shadow-sm);
  transition: var(--transition);
}
.d-panel:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.d-title { font-size: 11px; color: var(--text-light); margin-bottom: 6px; }
.d-number { font-size: 28px; font-weight: 700; line-height: 1.2; }
.d-unit { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.d-divider { height: 1px; background: var(--border); margin: 8px 0; }
.d-items { text-align: left; font-size: 11px; color: var(--text-secondary); min-height: 20px; }
.d-item { padding: 2px 0; display: flex; justify-content: space-between; }
.d-num { font-weight: 600; color: var(--text); }
.d-progress { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
.dp-header { font-size: 12px; color: var(--text-light); margin-bottom: 6px; }
.dp-bar { display: flex; align-items: center; gap: 10px; }
.dp-bar-bg { flex: 1; height: 8px; background: #E2E8F0; border-radius: 4px; overflow: hidden; }
.dp-bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #3B82F6, #1E40AF); transition: width 0.3s; }
.dp-pct { font-size: 13px; font-weight: 700; min-width: 40px; text-align: right; }
.dp-desc { font-size: 11px; color: var(--text-light); margin-top: 4px; }

.batch-status {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 500;
}
.batch-status.valid { background: #ECFDF5; color: #059669; }
.batch-status.expiring { background: #FFFBEB; color: #D97706; }
.batch-status.expired { background: #FEF2F2; color: #EF4444; }

@media (max-width: 900px) { .d-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .d-grid { grid-template-columns: 1fr; } }

// ===== UPLOAD RULES =====
var ALLOWED_EXTS = ['.pdf','.jpg','.jpeg','.png','.bmp','.gif','.doc','.docx','.xls','.xlsx'];
var BLOCKED_EXTS = ['.zip','.rar','.7z','.tar','.gz','.bz2','.xz','.tgz'];
var MAX_FILE_SIZE = 10 * 1024 * 1024;
var MAX_FILES_PER_ITEM = 10;

function validateFile(file) {
  var ext = '.' + file.name.split('.').pop().toLowerCase();
  if (BLOCKED_EXTS.indexOf(ext) >= 0) return '不支持压缩包格式（' + ext + '），请解压后上传';
  if (ALLOWED_EXTS.indexOf(ext) < 0) return '不支持的文件格式：' + ext;
  if (file.size > MAX_FILE_SIZE) return '文件过大（' + (file.size / 1024 / 1024).toFixed(1) + 'MB），单个文件不能超过 10MB';
  return null;
}

function renderQuotaSummary(sd) {
  var summary = document.getElementById('quotaSummary');
  if (staffingType === 'career') {
    // 优先使用已选批次的数据，否则回退到汇总
    var breakdown = [];
    var totalQuota = 0;
    if (selectedStaffingBatchData && selectedStaffingBatchData.useForms) {
      var uf = selectedStaffingBatchData.useForms;
      var ufKeys = Object.keys(uf);
      for (var qi = 0; qi < ufKeys.length; qi++) {
        var k = ufKeys[qi];
        var count = uf[k] || 0;
        if (count > 0) {
          breakdown.push({ type: USE_FORM_LABEL[k] || k, count: count });
        }
        totalQuota += count;
      }
      // 如果存在核定数，用核定数替代
      if (selectedStaffingBatchData.schoolFinalConfirm && selectedStaffingBatchData.schoolFinalConfirm.totalFinalCount != null) {
        totalQuota = selectedStaffingBatchData.schoolFinalConfirm.totalFinalCount;
      }
    } else {
      breakdown = getApprovedUseFormBreakdown(schoolName);
      for (var qi = 0; qi < breakdown.length; qi++) {
        totalQuota += breakdown[qi].count;
      }
    }
    var breakdownHtml = '';
    if (breakdown.length > 0) {
      var parts = [];
      for (var qi = 0; qi < breakdown.length; qi++) {
        var b = breakdown[qi];
        parts.push(b.type + b.count + '人');
      }
      breakdownHtml = '<div class="quota-detail">（' + parts.join('/') + '）</div>';
    }
    var remaining = totalQuota - 1;
    summary.innerHTML =
      '<div class="quota-item">' +
        '<div class="q-label">可申请入编的编制数</div>' +
        '<div class="q-value ok">' + totalQuota + '</div>' +
        breakdownHtml +
      '</div>' +
      '<div class="quota-item"><div class="q-label">本次申请使用人数</div><div class="q-value" id="applyCount">1</div></div>' +
      '<div class="quota-item"><div class="q-label">剩余可申请入编编制数</div><div class="q-value ok" id="remainingQuota">' + remaining + '</div></div>';
  } else {
    // 控制数：优先使用已选批次的数据
    var totalQuotaCtrl = sd.authControlNo - sd.currentControlStaff;
    var breakdownCtrl = [];
    if (selectedStaffingBatchData && selectedStaffingBatchData.useForms) {
      breakdownCtrl = [];

      var ufc = selectedStaffingBatchData.useForms;
      var ufcKeys = Object.keys(ufc);
      for (var qi2 = 0; qi2 < ufcKeys.length; qi2++) {

      if (selectedStaffingBatchData.schoolFinalConfirm && selectedStaffingBatchData.schoolFinalConfirm.totalFinalCount != null) {
        totalQuotaCtrl = selectedStaffingBatchData.schoolFinalConfirm.totalFinalCount;
      }
    }
    var breakdownHtmlCtrl = '';
    if (breakdownCtrl.length > 0) {
      var partsCtrl = [];
      for (var qi2 = 0; qi2 < breakdownCtrl.length; qi2++) {
        partsCtrl.push(breakdownCtrl[qi2].type + breakdownCtrl[qi2].count + '人');
      }
      breakdownHtmlCtrl = '<div class="quota-detail">（' + partsCtrl.join('/') + '）</div>';
    }
    var applicantCount = controlRows.length;
    var remainingCtrl = totalQuotaCtrl - applicantCount;

var USE_FORM_LABEL = {
  transfer: '调动',
  publicRecruit: '统一公开招聘',
  selfRecruit: '单位自主实施招聘',

function getApprovedUseFormBreakdown(school) {
  var stored = JSON.parse(localStorage.getItem('staffing_submissions') || '[]');
  var matchingStored = stored.filter(function(s) {
    return s.schoolName === school && s.staffingType === 'career' && s.status === 'approved';
  });
  var source = matchingStored.length > 0 ? stored : DEMO_STAFFING_SUBMISSIONS;
  var approved = source.filter(function(s) {
    return s.schoolName === school && s.staffingType === 'career' && s.status === 'approved';
  });
  var agg = {};
  approved.forEach(function(s) {
    var uf = s.useForms || {};
    Object.keys(uf).forEach(function(k) {
      agg[k] = (agg[k] || 0) + uf[k];
    });
  });
  var result = [];
  Object.keys(agg).forEach(function(k) {
    result.push({ type: USE_FORM_LABEL[k] || k, count: agg[k] });
  });
  return result;
}

function getApprovedRecruitPositions(school) {
  var stored = JSON.parse(localStorage.getItem('recruit_positions') || '[]');
  var matchingStored = stored.filter(function(p) {
    return p.schoolName === school && p.status === 'approved';
  });
  var source = matchingStored.length > 0 ? stored : DEMO_RECRUIT_POSITIONS;
  return source.filter(function(p) {
    return p.schoolName === school && p.status === 'approved';
  });
}

function onPositionChange() {
  var sel = document.getElementById('c_assignPosition');
  var val = sel ? sel.value : '';
  careerForm.assignPosition = val;
  var positions = getApprovedRecruitPositions(schoolName);
  var found = null;
  for (var i = 0; i < positions.length; i++) {
    if (positions[i].positionName === val) { found = positions[i]; break; }
  }
  careerForm.assignCategoryLevel = found ? found.categoryLevel : '';
  var catEl = document.getElementById('c_assignCategoryLevel');
  if (catEl) catEl.value = careerForm.assignCategoryLevel;
}

function getAvailableEmployNames(school) {
  var stored = JSON.parse(localStorage.getItem('employ_records') || '[]');
  var matchingStored = stored.filter(function(e) {
    return e.schoolName === school && e.status === 'employed';
  });
  var source = matchingStored.length > 0 ? stored : DEMO_EMPLOY_RECORDS;
  return source.filter(function(e) {
    return e.schoolName === school && e.status === 'employed';
  });
}

function onNameChange() {
  var sel = document.getElementById('c_name');
  var val = sel ? sel.value : '';
  careerForm.name = val;
  var employList = getAvailableEmployNames(schoolName);
  var found = null;
  for (var i = 0; i < employList.length; i++) {
    if (employList[i].name === val) { found = employList[i]; break; }
  }
  if (found && found.gender) {
    careerForm.gender = found.gender;
    var genderEl = document.getElementById('c_gender');
    if (genderEl) genderEl.value = found.gender;
  }
}

function updateSpouseFields() {

}

function onProvinceChange() {
  var sel = document.getElementById('c_nativeProvince');
  careerForm.nativeProvince = sel ? sel.value : '';
  careerForm.nativeCity = '';
  careerForm.nativeDistrict = '';
  rebuildCitySelect();
  rebuildDistrictSelect();
}

function onCityChange() {
  var sel = document.getElementById('c_nativeCity');
  careerForm.nativeCity = sel ? sel.value : '';
  careerForm.nativeDistrict = '';
  rebuildDistrictSelect();
}

function rebuildCitySelect() {
  var cityEl = document.getElementById('c_nativeCity');
  var distEl = document.getElementById('c_nativeDistrict');
  if (!cityEl) return;
  var prov = careerForm.nativeProvince;
  var cityMap = REGION_DATA[prov] || {};

  cities.forEach(function(c) { html += '<option value="' + c + '">' + c + '</option>'; });

}

function rebuildDistrictSelect() {
  var distEl = document.getElementById('c_nativeDistrict');
  if (!distEl) return;
  var prov = careerForm.nativeProvince;
  var city = careerForm.nativeCity;
  var districts = (REGION_DATA[prov] || {})[city] || [];
  var html = '<option value="">区/县</option>';
  districts.forEach(function(d) { html += '<option value="' + d + '">' + d + '</option>'; });
  distEl.innerHTML = html;
}

function rebuildNativeCascades() {
  // populate city/district dropdowns from current careerForm state
  var prov = careerForm.nativeProvince;
  if (!prov) { rebuildCitySelect(); return; }
  rebuildCitySelect();
  var cityEl = document.getElementById('c_nativeCity');
  if (cityEl && careerForm.nativeCity) { cityEl.value = careerForm.nativeCity; }
  rebuildDistrictSelect();
  var distEl = document.getElementById('c_nativeDistrict');
  if (distEl && careerForm.nativeDistrict) { distEl.value = careerForm.nativeDistrict; }
}

function updatePreviousJobFields() {
  var fields = ['c_orgNature','c_fundingSource','c_cadreOrWorker','c_title'];
  var isEmpty = !careerForm.previousJob || careerForm.previousJob === '无';
  fields.forEach(function(fid) {

function updateControlCalculated() {

function formField(id, label, type, value, required, hint, selectOptions, fullWidth, readonly) {
  var cls = 'form-field' + (fullWidth ? ' full-width' : '');
  var html = '<div class="' + cls + '">';
  html += '<label>' + label + (required ? '<span class="required">*</span>' : '') + '</label>';
  if (type === 'select') {
    html += '<select id="' + id + '" onchange="careerForm.' + id.replace('c_','') + '=this.value;"' + (readonly ? ' disabled' : '') + '>';
    if (!required) html += '<option value="">— 无 —</option>';
    selectOptions.forEach(function(opt) {
      html += '<option value="' + opt + '"' + (value === opt ? ' selected' : '') + '>' + opt + '</option>';
    });
    html += '</select>';
  } else {
    html += '<input type="' + type + '" id="' + id + '" value="' + escapeHtml(value) + '" placeholder="' + (hint || '') + '" oninput="careerForm.' + id.replace('c_','') + '=this.value;"' + (readonly ? ' readonly' : '') + '>';
  }
  html += '</div>';
  return html;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

  html += '</select></td>';
  html += '<td><input type="text" value="' + escapeHtml(row.idCard) + '" oninput="controlRows[' + idx + '].idCard=this.value;" placeholder="18位身份证号" maxlength="18"></td>';

  html += '<td><select onchange="controlRows[' + idx + '].entryMethod=this.value;">';
  entryOptions.forEach(function(opt) {
    html += '<option value="' + opt + '"' + (row.entryMethod === opt ? ' selected' : '') + '>' + opt + '</option>';
  });
  html += '</select></td>';
  html += '<td class="row-materials-section">';

    row.rowMaterials.forEach(function(f, fi) {

  html += '</td>';
  html += '<td class="row-actions"><button class="btn-delete-row" onclick="deleteControlRow(' + idx + ')">×</button></td>';

function addControlRow() {
  controlRows.push({ name: '', gender: '男', idCard: '', docNumber: '', entryMethod: '统一公开招聘', rowMaterials: [] });
  renderControlTable();
  updateControlCalculated();
  renderMaterialsArea();
  refreshQuotaSummary();
}

function deleteControlRow(idx) {
  if (controlRows.length <= 1) { showToast('至少保留1名申请人', 'warning'); return; }
  controlRows.splice(idx, 1);
  renderControlTable();
  updateControlCalculated();
  renderMaterialsArea();
  refreshQuotaSummary();
}

function refreshQuotaSummary() {
  var sd = SCHOOL_DATA[schoolName] || SCHOOL_DATA['柳州市第八中学'];
  renderQuotaSummary(sd);
}

function triggerRowUpload(idx) {
  document.getElementById('rowFileInput_' + idx).click();
}

function handleRowFile(idx, event) {
  if (!event.target.files || !event.target.files[0]) return;
  var file = event.target.files[0];
  var err = validateFile(file);
  if (err) { showToast(err, 'warning'); return; }
  if (!controlRows[idx].rowMaterials) controlRows[idx].rowMaterials = [];
  if (controlRows[idx].rowMaterials.length >= MAX_FILES_PER_ITEM) {
    showToast('每项材料最多上传' + MAX_FILES_PER_ITEM + '个文件', 'warning'); return;
  }
  controlRows[idx].rowMaterials.push(file);
  renderControlTable();
  event.target.value = '';
}

function renderDirectMaterials(map, em) {

}

// Render for 调动/其他 (dropdown first, then conditional full list)
function renderPerSubtypeMaterials(map, em) {
  var prefix = em === '调动' ? 'transfer' : 'other';
  var selected = em === '调动' ? selectedTransferSubType : selectedOtherSubType;
  var typeLabel = em === '调动' ? '调动类型' : '入编类型';

  var html = '';
  // Subtype dropdown
  html += '<div style="margin-bottom:10px;">';
  html += '<label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">' + typeLabel + ' <span class="required">*</span></label>';
  html += '<select id="subtypeSelect" onchange="onSubtypeChange(\'' + prefix + '\', this.value)" style="width:100%;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;font-family:inherit;background:#fff;cursor:pointer;color:var(--text);">';
  html += '<option value="">— 请选择 —</option>';
  var keys = Object.keys(map.subTypes);
  keys.forEach(function(k) {
    var st = map.subTypes[k];
    html += '<option value="' + k + '"' + (selected === k ? ' selected' : '') + '>' + st.label + '</option>';
  });
  html += '</select>';
  html += '</div>';

  if (!selected || !map.subTypes[selected]) {
    // No selection → placeholder
    html += '<div class="mat-placeholder">请先选择上方' + typeLabel + '，将展示对应的材料清单</div>';
    html += '<div style="margin-top:12px;padding:8px 14px;background:#F0F9FF;border-radius:6px;font-size:11px;color:#1E40AF;">📌 <strong>提示：</strong>实名制Key盘为线下硬件设备，无需上传，请按规定携带至现场办理。<br>📌 所有上传材料请提供原件扫描件或高清照片，支持 PDF/Word/Excel/JPG/PNG 格式，单个文件不超过10MB。</div>';
    return html;
  }

  var st = map.subTypes[selected];
  html += renderMaterialListInline(st.required, st.optional, true, st.note);
  return html;
}

// Render compact inline material list
function renderMaterialListInline(requiredKeys, optionalKeys, showHint, note) {
  var html = '';
  var allKeys = (requiredKeys || []).concat(optionalKeys || []);
  var totalItems = allKeys.length;
  var uploadedItems = 0;
  allKeys.forEach(function(k) {
    if (careerUploadState[k] && careerUploadState[k].files.length > 0) uploadedItems++;
  });
  var pct = totalItems > 0 ? Math.round(uploadedItems / totalItems * 100) : 0;

  // Progress bar
  html += '<div class="mat-progress">';
  html += '<span>📎 已上传 <strong>' + uploadedItems + '</strong>/' + totalItems + ' 项</span>';
  html += '<div class="mat-progress-bar"><div class="mat-progress-fill" style="width:' + pct + '%;"></div></div>';
  html += '<span style="font-size:11px;color:var(--text-light);">' + pct + '%</span>';
  html += '</div>';

  // Required materials as inline rows
  if (requiredKeys && requiredKeys.length > 0) {
    html += '<div class="mat-section-header"><span class="bar"></span>必传材料</div>';
    requiredKeys.forEach(function(k) {
      html += buildInlineRow(k, true);
    });
  }

  // Optional materials as inline rows
  if (optionalKeys && optionalKeys.length > 0) {
    html += '<div class="mat-section-header opt"><span class="bar"></span>选传材料</div>';
    optionalKeys.forEach(function(k) {
      html += buildInlineRow(k, false);
    });
  }

  // Subtype note
  if (note) {
    html += '<div style="font-size:11px;color:var(--text-secondary);margin:4px 0;padding:4px 10px;background:#FAFAFA;border-radius:4px;">💡 ' + note + '</div>';
  }

  // Key hint
  if (showHint) {
    html += '<div style="margin-top:10px;padding:8px 14px;background:#F0F9FF;border-radius:6px;font-size:11px;color:#1E40AF;line-height:1.6;">📌 <strong>提示：</strong>实名制Key盘为线下硬件设备，无需上传，请按规定携带至现场办理。<br>📌 所有上传材料请提供原件扫描件或高清照片，支持 PDF/Word/Excel/JPG/PNG 格式，单个文件不超过10MB。</div>';
  }

  return html;
}

// Compact single-row material upload item
function buildInlineRow(key, isRequired) {
  var cat = MATERIAL_CATALOG[key];
  if (!cat) return '';
  var state = careerUploadState[key] || { files: [] };
  var files = state.files;
  var label = cat.name;
  var note = cat.note || '';

  var html = '<div class="material-row" id="matRow_' + key + '">';
  // Required/optional marker
  if (isRequired) {
    html += '<span class="mat-marker red">*</span>';
  } else {
    html += '<span class="mat-marker gray">☐</span>';
  }
  // Label
  html += '<span class="mat-label">' + label + '</span>';
  // Note for optional items
  if (note && !isRequired) {
    html += '<span class="mat-note">— ' + note + '</span>';
  }
  // File chips
  if (files.length > 0) {
    var shown = files.slice(0, 2);
    shown.forEach(function(f, fi) {
      var fname = escapeHtml(f.name);
      html += '<span class="file-chip" title="' + fname + '">📎' + fname + '<span class="file-del" onclick="event.stopPropagation();removeFile(\'' + key + '\',' + fi + ')" title="删除">✕</span></span>';
    });
    if (files.length > 2) {
      html += '<span class="file-chip-more">+' + (files.length - 2) + '</span>';
    }
  }
  // [选择文件] button
  html += '<button type="button" class="btn-file-select" onclick="document.getElementById(\'fileInput_' + key + '\').click()">📄 选择文件</button>';
  // Status
  if (files.length > 0) {
    html += '<span class="status-chip done">✅ ' + files.length + '个</span>';
  } else if (isRequired) {
    html += '<span class="status-chip pending">⚠ 未上传</span>';
  } else {
    html += '<span class="status-chip none">无</span>';
  }
  html += '</div>';
  // Hidden file input
  html += '<input type="file" id="fileInput_' + key + '" accept=".pdf,.jpg,.jpeg,.png,.bmp,.gif,.doc,.docx,.xls,.xlsx" style="display:none;" onchange="handleFile(event,\'' + key + '\')">';

  return html;
}

function onSubtypeChange(prefix, value) {
  if (prefix === 'transfer') {
    selectedTransferSubType = value;
  } else {
    selectedOtherSubType = value;
  }
  renderMaterialsArea();
}

// Keep buildMaterialUpload for control type
function buildMaterialUpload(key, label, required, fileList) {
  var html = '<div class="form-field" style="margin-bottom:4px;">';
  html += '<label>' + label + (required ? ' <span class="required">*</span>' : '') + '</label>';
  html += '<div class="upload-area" id="uploadArea_' + key + '"';
  html += ' onclick="document.getElementById(\'fileInput_' + key + '\').click()"';
  html += ' ondragover="event.preventDefault();this.classList.add(\'drag-over\');"';
  html += ' ondragleave="this.classList.remove(\'drag-over\');"';
  html += ' ondrop="event.preventDefault();this.classList.remove(\'drag-over\');handleDrop(event,\'' + key + '\');">';
  html += '<div class="upload-icon">📄</div>';
  html += '<div class="upload-text">点击上传或拖拽文件到此处</div>';
  html += '<div class="upload-hint">支持 PDF、Word、Excel、图片格式，单个文件不超过 10MB，最多10个文件，不支持压缩包</div>';
  html += '</div>';
  html += '<input type="file" id="fileInput_' + key + '" accept=".pdf,.jpg,.jpeg,.png,.bmp,.gif,.doc,.docx,.xls,.xlsx" style="display:none;" onchange="handleFile(event,\'' + key + '\')">';
  html += '<div id="fileList_' + key + '">';
  if (fileList && fileList.length > 0) {
    fileList.forEach(function(f, i) {
      html += '<div class="upload-file-item"><span>📎 ' + escapeHtml(f.name) + '</span><span style="font-size:11px;color:var(--text-light);">(' + formatSize(f.size) + ')</span><span class="remove" onclick="removeFile(\'' + key + '\',' + i + ')">✕</span></div>';
    });
  }
  html += '</div>';
  html += '</div>';
  return html;
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
  return (bytes / 1048576).toFixed(1) + 'MB';
}

function handleFile(event, key) {
  if (!event.target.files || !event.target.files[0]) return;
  var file = event.target.files[0];
  var err = validateFile(file);
  if (err) { showToast(err, 'warning'); event.target.value = ''; return; }
  var fileList = getFileListRef(key);
  if (fileList.length >= MAX_FILES_PER_ITEM) {
    showToast('每项材料最多上传' + MAX_FILES_PER_ITEM + '个文件', 'warning'); event.target.value = ''; return;
  }
  fileList.push(file);
  renderMaterialsArea();
  event.target.value = '';
}

function handleDrop(event, key) {
  var files = event.dataTransfer.files;
  if (!files || !files.length) return;
  var fileList = getFileListRef(key);
  for (var i = 0; i < files.length; i++) {
    var err = validateFile(files[i]);
    if (err) { showToast(err, 'warning'); continue; }
    if (fileList.length >= MAX_FILES_PER_ITEM) { showToast('每项材料最多' + MAX_FILES_PER_ITEM + '个文件', 'warning'); break; }
    fileList.push(files[i]);
  }
  renderMaterialsArea();
}

function removeFile(key, idx) {
  var fileList = getFileListRef(key);
  fileList.splice(idx, 1);
  renderMaterialsArea();
}

// ===== STAFFING BATCH SELECTOR (需求一) =====
function renderStaffingBatchSelector() {
  if (staffingType !== 'career' && staffingType !== 'control') {
    document.getElementById('staffingBatchCard').style.display = 'none';
    return;
  }
  document.getElementById('staffingBatchCard').style.display = '';

  // Load approved staffing submissions from localStorage
  var stored = JSON.parse(localStorage.getItem('staffing_submissions') || '[]');
  var approved = stored.filter(function(s) {
    return (s.school === schoolName) && s.staffingType === staffingType &&
           s.status === 'approved';
  });

  // Fallback to demo data if localStorage is empty
  if (approved.length === 0) {
    approved = DEMO_STAFFING_SUBMISSIONS.filter(function(s) {
      return s.schoolName === schoolName && s.staffingType === staffingType && s.status === 'approved';
    });
  }

  var area = document.getElementById('staffingBatchArea');
  if (approved.length === 0) {
    var typeLabel = (staffingType === 'career' ? '事业编' : '控制数');
    area.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="empty-text" style="font-size:13px;">暂无已通过审批的' + typeLabel + '编制使用申请，请先在"编制使用申请"模块提交' + typeLabel + '申请并完成审批</div></div>';
    return;
  }

  // Build dropdown + detail panel
  var html = '';
  html += '<select id="staffingBatchSelect" onchange="onBatchSelectChange(this.value)" style="width:100%;padding:10px 14px;font-size:13px;border:1px solid var(--border);border-radius:6px;font-family:inherit;background:#fff;cursor:pointer;color:var(--text);">';
  html += '<option value="">— 请选择关联的编制使用申请 —</option>';
  for (var i = 0; i < approved.length; i++) {
    var s = approved[i];
    var isSelected = (selectedStaffingBatchId === s.id);
    var statusSuffix = '';
    if (s.schoolFinalConfirm && s.schoolFinalConfirm.validityEnd) {
      var now = new Date();
      var endDate = new Date(s.schoolFinalConfirm.validityEnd);
      var daysLeft = Math.ceil((endDate - now) / 86400000);
      if (daysLeft < 0) statusSuffix = ' [已过期]';
      else if (daysLeft <= 30) statusSuffix = ' [即将到期·剩' + daysLeft + '天]';
      else statusSuffix = ' [有效]';
    }
    var label = s.id + ' · ' + (s.batchName || '自主申报')
      + ' | ' + (s.staffingType === 'career' ? '事业编' : '控制数')
      + ' | 核定' + (s.schoolFinalConfirm ? s.schoolFinalConfirm.totalFinalCount : '?') + '名'
      + statusSuffix;
    html += '<option value="' + s.id + '"' + (isSelected ? ' selected' : '') + '>' + label + '</option>';
  }
  html += '</select>';

  // Detail panel
  html += '<div id="staffingBatchDetail" style="margin-top:12px;' + (selectedStaffingBatchData ? '' : 'display:none;') + '">';
  if (selectedStaffingBatchData) {
    html += buildBatchDetailHtml(selectedStaffingBatchData);
  }
  html += '</div>';

  area.innerHTML = html;
}

function onBatchSelectChange(id) {
  if (!id) {
    selectedStaffingBatchId = null;
    selectedStaffingBatchData = null;
    document.getElementById('staffingBatchDetail').style.display = 'none';
    renderUnitInfo();
    return;
  }
  selectStaffingBatch(id);
}

function calcBatchUsage(batchId, excludeId) {
  var allRecords = JSON.parse(localStorage.getItem('entry_records') || '[]');
  var appr = {}, pend = {};
  var uc = 0, pc = 0;
  allRecords.forEach(function(r) {
    if (r.staffingBatchId === batchId && r.id !== excludeId) {
      (r.applicants || []).forEach(function(a) {
        var em = a.entryMethod || '其他';
        if (r.status === 'approved') { appr[em] = (appr[em] || 0) + 1; uc++; }
        else if (r.status === 'pending') { pend[em] = (pend[em] || 0) + 1; pc++; }
      });
    }
  });
  return { used: { count: uc, details: appr }, pending: { count: pc, details: pend } };
}

function buildBatchDetailHtml(s) {
  var totalCount = 0;
  var uf = s.useForms || {};
  var ufKeys = Object.keys(uf);
  for (var k = 0; k < ufKeys.length; k++) {
    totalCount += (uf[ufKeys[k]] || 0);
  }
  var finalCount = s.schoolFinalConfirm ? s.schoolFinalConfirm.totalFinalCount : null;
  var tn = finalCount != null ? finalCount : totalCount;

  // Validity status
  var vh = '';
  if (s.schoolFinalConfirm && s.schoolFinalConfirm.validityStart) {
    var vStart = s.schoolFinalConfirm.validityStart;
    var vEnd = s.schoolFinalConfirm.validityEnd;
    var nw = new Date(), en = new Date(vEnd), dl = Math.ceil((en-nw)/86400000),
        sc = dl<0?'expired':(dl<=30?'expiring':'valid'),
        sl = dl<0?'🔴 已过期':(dl<=30?'🟡 即将到期（剩'+dl+'天）':'🟢 有效（剩余'+dl+'天）');
    vh = '<span style="font-size:12px;color:var(--text-secondary);">'+vStart+' ~ '+vEnd+'</span> <span class="batch-status '+sc+'">'+sl+'</span>';
  } else {
    vh = '<span style="color:var(--text-light);font-size:12px;">⏳ 有效期未设定</span>';
  }

  // Display name mapping for useForms keys
  var ufl = {publicRecruit:'统一公开招聘',selfRecruit:'单位自主实施招聘',talent:'引进人才',talentMid:'中高级人才招聘',talentHigh:'引进高层次人才',transfer:'调动',other:'其他'};

  // Usage stats
  var usg = calcBatchUsage(s.id, isEditMode ? editRecordId : null);
  var uc = usg.used.count, pc = usg.pending.count;
  var applyCount = staffingType === 'career' ? 1 : controlRows.length;
  var rate = tn > 0 ? Math.round((uc+pc+applyCount)/tn*100) : 0;
  var rateColor = rate > 85 ? '#EF4444' : (rate > 60 ? '#F59E0B' : '#3B82F6');

  // Helper: build detail item list from map
  function buildItems(map) {
    var keys = Object.keys(map);
    if (!keys.length) return '<div style="color:var(--text-light);text-align:center;padding:4px 0;font-size:11px;">暂无数据</div>';
    return keys.map(function(k) {
      return '<div class="d-item">'+k+' <span class="d-num">'+map[k]+'</span></div>';
    }).join('');
  }

  // Panel 1: 编办核定数
  var pq = '';
  if (s.schoolFinalConfirm && s.schoolFinalConfirm.details) {
    pq = s.schoolFinalConfirm.details.filter(function(d){return d.finalNum>0;}).map(function(d){
      return '<div class="d-item">'+d.type+' <span class="d-num">'+d.finalNum+'</span></div>';
    }).join('');
  } else if (uf) {
    pq = Object.keys(uf).filter(function(k){return uf[k]>0;}).map(function(k) {
      return '<div class="d-item">'+(ufl[k]||k)+' <span class="d-num">'+uf[k]+'</span></div>';
    }).join('');
  }
  if (!pq) pq = '<div style="color:var(--text-light);text-align:center;padding:4px 0;font-size:11px;">暂无核定明细</div>';

  // Panel 2: 已使用
  var pu = buildItems(usg.used.details);

  // Panel 3: 待审核
  var pp = buildItems(usg.pending.details);

  // Panel 4: 本次申请
  var applyLabel = '<div class="d-item">当前申报 <span class="d-num">'+applyCount+'</span></div>';

  return '<div class="batch-card">'+
    '<div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:10px;">📦 关联编制使用申请</div>'+
    '<div class="batch-header">'+
    '<div class="bh-row"><span class="bh-label">申请编号</span><span class="bh-value" style="font-family:monospace;">'+s.id+'</span></div>'+
    '<div class="bh-row"><span class="bh-label">批次名称</span><span class="bh-value">'+(s.batchName||'自主申报')+'</span></div>'+
    '<div class="bh-row"><span class="bh-label">有效期</span><span class="bh-value">'+vh+'</span></div>'+
    '</div>'+
    '<div class="d-grid">'+
    '<div class="d-panel"><div class="d-title">编办核定数</div><div class="d-number" style="color:#1E40AF;">'+tn+'</div><div class="d-unit">名</div><div class="d-divider"></div><div class="d-items">'+pq+'</div></div>'+
    '<div class="d-panel"><div class="d-title">已使用</div><div class="d-number" style="color:#10B981;">'+uc+'</div><div class="d-unit">名</div><div class="d-divider"></div><div class="d-items">'+pu+'</div></div>'+
    '<div class="d-panel"><div class="d-title">待审核</div><div class="d-number" style="color:#F59E0B;">'+pc+'</div><div class="d-unit">名</div><div class="d-divider"></div><div class="d-items">'+pp+'</div></div>'+
    '<div class="d-panel"><div class="d-title">本次申请</div><div class="d-number" style="color:#1E40AF;">'+applyCount+'</div><div class="d-unit">名</div><div class="d-divider"></div><div class="d-items">'+applyLabel+'</div></div>'+
    '</div>'+
    '<div class="d-progress">'+
    '<div class="dp-header">使用率</div>'+
    '<div class="dp-bar"><div class="dp-bar-bg"><div class="dp-bar-fill" style="width:'+rate+'%;background:'+rateColor+'"></div></div><span class="dp-pct" style="color:'+rateColor+';">'+rate+'%</span></div>'+
    '<div class="dp-desc">已使用 '+uc+' + 待审核 '+pc+' + 本次 '+applyCount+' = '+(uc+pc+applyCount)+' / 编办核定 '+tn+'</div>'+
    '</div></div>';
}function selectStaffingBatch(id) {
  selectedStaffingBatchId = id;
  // Find the full data record
  var stored = JSON.parse(localStorage.getItem('staffing_submissions') || '[]');
  var found = null;
  for (var i = 0; i < stored.length; i++) {
    if (stored[i].id === id) { found = stored[i]; break; }
  }
  if (!found) {
    for (var i = 0; i < DEMO_STAFFING_SUBMISSIONS.length; i++) {
      if (DEMO_STAFFING_SUBMISSIONS[i].id === id) { found = DEMO_STAFFING_SUBMISSIONS[i]; break; }
    }
  }
  selectedStaffingBatchData = found;
  // Update dropdown selected option
  var selectEl = document.getElementById('staffingBatchSelect');
  if (selectEl) selectEl.value = id;
  // Update detail panel
  var detail = document.getElementById('staffingBatchDetail');
  if (detail && found) {
    detail.innerHTML = buildBatchDetailHtml(found);
    detail.style.display = '';
  }
  renderUnitInfo();
}

function collectCareerMaterialFiles() {
  var result = {};
  var keys = Object.keys(careerUploadState);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (careerUploadState[k].files.length > 0) {
      result[k] = careerUploadState[k].files.map(function(f) { return f.name; });
    }
  }
  return result;
}

function getFileListRef(key) {
  if (staffingType === 'career') {
    return (careerUploadState[key] || { files: [] }).files;
  }
  if (key === 'ctrlNotice') return controlNoticeMaterials;
  return [];
}

function getEmployUrl() {
  if (currentRole === 'city' || currentRole === 'district') return 'employ-list-admin.html?role=' + currentRole;
  if (currentRole === 'school') return 'employ-list-school.html';

}

// ===== SUBMIT =====
function submitForm() {
  collectCareerForm();

  // Validate
  if (staffingType === 'career') {
    var requiredFields = [
      { key: 'name', label: '姓名' }, { key: 'gender', label: '性别' },
      { key: 'politics', label: '政治面貌' }, { key: 'ethnicity', label: '民族' },
      { key: 'nativeProvince', label: '籍贯（省）' }, { key: 'nativeCity', label: '籍贯（市）' }, { key: 'nativeDistrict', label: '籍贯（区/县）' }, { key: 'education', label: '文化程度' },
      { key: 'graduateInfo', label: '毕业院校及专业' },
      { key: 'assignPosition', label: '拟分配岗位' },
      { key: 'entryMethod', label: '入编方式' }, { key: 'docNumber', label: '依据文号' },
      { key: 'reason', label: '申请使用编制的主要理由' }
    ];
    // 原单位信息：仅当有原单位时必填
    var hasPrevJob = careerForm.previousJob && careerForm.previousJob !== '无';
    if (hasPrevJob) {
      requiredFields.push({ key: 'orgNature', label: '单位性质' });
      requiredFields.push({ key: 'fundingSource', label: '经费来源' });
      requiredFields.push({ key: 'cadreOrWorker', label: '干部或工人' });
    }
    for (var i = 0; i < requiredFields.length; i++) {
      var f = requiredFields[i];
      if (!careerForm[f.key]) { showToast('请填写：' + f.label, 'warning'); return; }
    }
    if (careerForm.reason.length > 500) { showToast('申请理由不超过500字', 'warning'); return; }
    // Validate career materials dynamically based on entry method
    var em = careerForm.entryMethod || '统一公开招聘';
    var emMap = ENTRY_METHOD_MAP[em];
    if (emMap) {
      var checkKeys = [];
      if (emMap.perSubtype) {
        var prefix = em === '调动' ? 'transfer' : 'other';
        var selected = em === '调动' ? selectedTransferSubType : selectedOtherSubType;
        if (!selected) {
          showToast('请选择' + em + '的具体类型', 'warning'); return;
        }
        var st = (emMap.subTypes || {})[selected];
        if (st) checkKeys = (st.required || []).slice();
      } else {
        checkKeys = (emMap.common || []).slice();
      }
      var missing = [];
      checkKeys.forEach(function(k) {
        var state = careerUploadState[k];
        if (!state || state.files.length === 0) {
          var cat = MATERIAL_CATALOG[k];
          if (cat && cat.required) missing.push(cat.name);
        }
      });
      if (missing.length > 0) {
        showToast('请上传以下必传材料：' + missing.join('、'), 'warning');
        return;
      }
    }
  } else {
    for (var j = 0; j < controlRows.length; j++) {
      var r = controlRows[j];
      if (!r.name || r.name.length < 2 || r.name.length > 20) { showToast('第' + (j+1) + '行：姓名需2-20个字符', 'warning'); return; }
      if (!r.gender) { showToast('第' + (j+1) + '行：请选择性别', 'warning'); return; }
      if (!r.idCard || r.idCard.length !== 18 || !/^\d{17}[\dXx]$/.test(r.idCard)) { showToast('第' + (j+1) + '行：身份证号格式错误', 'warning'); return; }
      if (!r.docNumber) { showToast('第' + (j+1) + '行：请填写依据文号', 'warning'); return; }
      if (!r.entryMethod) { showToast('第' + (j+1) + '行：请选择增人形式', 'warning'); return; }
    }
    if (controlNoticeMaterials.length === 0) { showToast('请上传：市人社局下发的岗位增补计划下达通知书', 'warning'); return; }
  }

  // Validate staffing batch selection (需求一)
  if (!selectedStaffingBatchId) {
    showToast('请选择关联的编制使用申请', 'warning');
    return;
  }
  // Check validity period
  if (selectedStaffingBatchData && selectedStaffingBatchData.schoolFinalConfirm && selectedStaffingBatchData.schoolFinalConfirm.validityEnd) {
    var endDate = new Date(selectedStaffingBatchData.schoolFinalConfirm.validityEnd);
    if (endDate < new Date()) {
      showToast('关联的编制使用申请已超过有效期（' + selectedStaffingBatchData.schoolFinalConfirm.validityEnd + '），请重新选择', 'warning');
      return;
    }
  }

  // Check quota (不能超过可申请数)
  var maxQuota = selectedStaffingBatchData && selectedStaffingBatchData.schoolFinalConfirm
    ? selectedStaffingBatchData.schoolFinalConfirm.totalFinalCount : null;
  if (maxQuota == null && selectedStaffingBatchData && selectedStaffingBatchData.useForms) {
    var ufTot = selectedStaffingBatchData.useForms;
    maxQuota = 0;
    var ufKeysTot = Object.keys(ufTot);
    for (var ti = 0; ti < ufKeysTot.length; ti++) {
      maxQuota += (ufTot[ufKeysTot[ti]] || 0);
    }
  }
  if (maxQuota != null) {
    var applyCount = staffingType === 'career' ? 1 : controlRows.length;
    if (applyCount > maxQuota) {
      showToast('申请人数（' + applyCount + '人）已超过该批次可申请数（' + maxQuota + '人），请减少申请人数或重新选择批次', 'warning');
      return;
    }
  }

  // Generate ID
  var now = new Date();
  var datePart = now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate());
  var stored = JSON.parse(localStorage.getItem('entry_seq') || '{"date":"","seq":0}');
  if (stored.date !== datePart) { stored.date = datePart; stored.seq = 0; }
  stored.seq++;
  localStorage.setItem('entry_seq', JSON.stringify(stored));
  var newId = 'RN' + datePart + pad3(stored.seq);

  // Build record
  var record = {
    id: isEditMode ? editRecordId : newId,
    schoolName: schoolName,
    schoolType: SCHOOL_DATA[schoolName] ? SCHOOL_DATA[schoolName].schoolType : '鱼峰区属',
    staffingType: staffingType,
    controlType: staffingType === 'control' ? controlType : null,
    status: 'pending',
    submitTime: now.toISOString().replace('T',' ').substring(0,19),
    approveTime: null, approver: null, approverRole: null,
    opinion: null, rejectReason: null,
    staffingBatchId: selectedStaffingBatchId,
    staffingBatchName: selectedStaffingBatchData ? (selectedStaffingBatchData.batchName || '自主申报') : null,
    staffingBatchValidity: (selectedStaffingBatchData && selectedStaffingBatchData.schoolFinalConfirm)
      ? { start: selectedStaffingBatchData.schoolFinalConfirm.validityStart, end: selectedStaffingBatchData.schoolFinalConfirm.validityEnd }
      : null
  };

  // Unit info
  var sd = SCHOOL_DATA[schoolName] || SCHOOL_DATA['柳州市第八中学'];
  record.unitName = sd.unitName;
  if (staffingType === 'career') {
    record.orgLevel = sd.orgLevel; record.orgNature = sd.orgNature;
    record.careerStaffQuota = sd.careerStaffQuota; record.currentCareerStaff = sd.currentCareerStaff;
    record.unusedCareerPlan = sd.unusedCareerPlan;
    record.authLeader = sd.authLeader; record.actualLeader = sd.actualLeader;
    record.actualOtherLeader = sd.actualOtherLeader;
    record.applicants = [{ name: careerForm.name, gender: careerForm.gender, politics: careerForm.politics,
      ethnicity: careerForm.ethnicity, nativeProvince: careerForm.nativeProvince, nativeCity: careerForm.nativeCity, nativeDistrict: careerForm.nativeDistrict, nativePlace: careerForm.nativeProvince + careerForm.nativeCity + careerForm.nativeDistrict,
      education: careerForm.education, graduateInfo: careerForm.graduateInfo,
      spouseName: careerForm.spouseName, spouseWorkUnit: careerForm.spouseWorkUnit,
      previousJob: careerForm.previousJob, orgNature: careerForm.orgNature,
      fundingSource: careerForm.fundingSource, cadreOrWorker: careerForm.cadreOrWorker,
      title: careerForm.title, assignPosition: careerForm.assignPosition,
      assignCategoryLevel: careerForm.assignCategoryLevel,
      entryMethod: careerForm.entryMethod, docNumber: careerForm.docNumber,
      reason: careerForm.reason
    }];
  } else {
    record.authControlNo = sd.authControlNo; record.currentControlStaff = sd.currentControlStaff;
    record.applicants = controlRows.map(function(r) {
      return { name: r.name, gender: r.gender, idCard: r.idCard,
        docNumber: r.docNumber, entryMethod: r.entryMethod,
        hasIdMaterials: r.rowMaterials && r.rowMaterials.length > 0 };
    });
  }

  // Materials (file names only for demo)
  record.materials = staffingType === 'career'
    ? collectCareerMaterialFiles()
    : {
        notice: controlNoticeMaterials.map(function(f) { return f.name; }),
        idCards: controlRows.map(function(r) { return (r.rowMaterials || []).map(function(f) { return f.name; }); })
      };

  // Timeline
  record.timeline = [{
    time: record.submitTime,
    operator: ROLES[currentRole].name,
    action: '学校提交入编申请',
    opinion: staffingType === 'career'
      ? '使用事业编制1名（' + careerForm.name + '，' + careerForm.assignPosition + '）'
      : '使用控制数合计' + controlRows.length + '名（' + controlRows.map(function(r){return r.name;}).join('、') + '）'
  }];
  record.versionHistory = [];

  // Save
  if (isEditMode) {
    var all = JSON.parse(localStorage.getItem('entry_records') || '[]');
    var idx = -1;
    for (var k = 0; k < all.length; k++) { if (all[k].id === editRecordId) { idx = k; break; } }
    if (idx >= 0) {
      record.versionHistory = (all[idx].versionHistory || []).concat([{
        time: record.submitTime, previous: JSON.parse(JSON.stringify(all[idx]))
      }]);
      record.id = editRecordId;
      all[idx] = record;
    } else { all.push(record); }
    localStorage.setItem('entry_records', JSON.stringify(all));
  } else {
    var allRecords = JSON.parse(localStorage.getItem('entry_records') || '[]');
    allRecords.push(record);
    localStorage.setItem('entry_records', JSON.stringify(allRecords));
  }

  showToast(isEditMode ? '修改提交成功，编号：' + record.id : '提交成功！编号：' + record.id, 'success');
  setTimeout(function() {
    window.location.href = '教师入编管理（学校管理员视角）.html?role=school';
  }, 1500);
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function pad3(n) { return n < 10 ? '00' + n : (n < 100 ? '0' + n : '' + n); }

function goBack() {
  window.location.href = '教师入编管理（学校管理员视角）.html?role=school';
}

// ===== INIT =====
(function init() {
  // URL params
  var params = new URLSearchParams(window.location.search);
  var urlRole = params.get('role');
  if (urlRole === 'city' || urlRole === 'district' || urlRole === 'school') {
    currentRole = urlRole;
  }
  var urlType = params.get('type');
  if (urlType === 'career' || urlType === 'control') {
    staffingType = urlType;
  }
  var editId = params.get('id');
  if (editId) {
    isEditMode = true;
    editRecordId = editId;
    var all = JSON.parse(localStorage.getItem('entry_records') || '[]');
    var found = null;
    for (var i = 0; i < all.length; i++) { if (all[i].id === editId) { found = all[i]; break; } }
    if (found) {
      staffingType = found.staffingType;
      if (found.controlType) controlType = found.controlType;
      if (found.schoolName) schoolName = found.schoolName;
      if (found.staffingBatchId) {
        selectedStaffingBatchId = found.staffingBatchId;
        // Try to look up the batch data
        var stored = JSON.parse(localStorage.getItem('staffing_submissions') || '[]');
        for (var si = 0; si < stored.length; si++) {
          if (stored[si].id === found.staffingBatchId) {
            selectedStaffingBatchData = stored[si];
            break;
          }
        }
        if (!selectedStaffingBatchData) {
          for (var si = 0; si < DEMO_STAFFING_SUBMISSIONS.length; si++) {
            if (DEMO_STAFFING_SUBMISSIONS[si].id === found.staffingBatchId) {
              selectedStaffingBatchData = DEMO_STAFFING_SUBMISSIONS[si];
              break;
            }
          }
        }
      }
      var app = found.applicants[0];
      if (staffingType === 'career' && app) {
        careerForm = {
          name: app.name || '', gender: app.gender || '', politics: app.politics || '',
          ethnicity: app.ethnicity || '', nativeProvince: app.nativeProvince || '', nativeCity: app.nativeCity || '', nativeDistrict: app.nativeDistrict || '',
          education: app.education || '', graduateInfo: app.graduateInfo || '',
          spouseName: app.spouseName || '', spouseWorkUnit: app.spouseWorkUnit || '',
          previousJob: app.previousJob || '', orgNature: app.orgNature || '',
          fundingSource: app.fundingSource || '', cadreOrWorker: app.cadreOrWorker || '',
          title: app.title || '', assignPosition: app.assignPosition || '',
          assignCategoryLevel: app.assignCategoryLevel || '',
          entryMethod: app.entryMethod || '', docNumber: app.docNumber || '',
          reason: app.reason || ''
        };
      } else if (staffingType === 'control' && found.applicants) {
        controlRows = found.applicants.map(function(a) {
          return { name: a.name || '', gender: a.gender || '男', idCard: a.idCard || '',
                   docNumber: a.docNumber || '', entryMethod: a.entryMethod || '统一公开招聘',
                   rowMaterials: [] };
        });
      }
      document.getElementById('pageTitle').textContent = '修改入编申请';
      document.getElementById('pageSubtitle').textContent = '编辑被驳回的申请信息，重新提交';
      document.getElementById('breadcrumbPage').textContent = '修改申请';
      document.getElementById('submitBtn').textContent = '重新提交';
    }
  }

  renderSidebar();
  renderTypeSelector();
  renderStaffingBatchSelector();
  renderUnitInfo();
  renderApplicantArea();
  renderMaterialsArea();
})();
</script>
