.topnav-user { display:flex; align-items:center; gap:8px; cursor:pointer; color:rgba(255,255,255,0.9); padding:6px 12px; border-radius:6px; transition:var(--transition); font-size:13px; position:relative; }

function renderList(){
  var records=loadRecords();var dataVersion=localStorage.getItem('retire_data_version')||'0';
  if(records.length===0||dataVersion!=='2'){records=seedDemo();saveRecords(records);localStorage.setItem('retire_data_version','2');}
  records=records.filter(function(r){return r.schoolName===currentSchool;});
  var counts={all:records.length,pending:0,approved:0,rejected:0};
  records.forEach(function(r){var k=getFilterKey(r.status);if(counts[k]!==undefined)counts[k]++;});
  var filters=[{key:'all',label:'全部('+counts.all+')'},{key:'pending',label:'待审核('+counts.pending+')'},{key:'approved',label:'已通过('+counts.approved+')'},{key:'rejected',label:'已驳回('+counts.rejected+')'}];
  var fb=document.getElementById('filterBar');fb.innerHTML='';
  filters.forEach(function(f){var b=document.createElement('button');b.className='filter-pill'+(currentFilter===f.key?' active':'');b.textContent=f.label;b.onclick=function(){currentFilter=f.key;renderList();};fb.appendChild(b);});
  if(currentFilter!=='all')records=records.filter(function(r){return getFilterKey(r.status)===currentFilter;});
  var list=document.getElementById('recordList');
  if(records.length===0){list.innerHTML='<div class="list-card"><div class="empty-state"><div class="empty-icon">&#128196;</div><div class="empty-text">暂无退休申报记录</div></div></div>';return;}
  var h='<div class="list-card"><div class="table-scroll"><table class="list-table"><thead><tr><th>申请编号</th><th>姓名</th><th>性别</th><th>年龄</th><th>学历/文化程度</th><th>政治面貌</th><th>参加工作时间</th><th>实际工作年限</th><th>教护龄</th><th>人员类别</th><th>岗位</th><th>薪级</th><th>提交时间</th><th>状态</th><th style="width:160px;white-space:nowrap">操作</th></tr></thead><tbody>';
  records.forEach(function(r){
    var age=calcAge(r.birthDate,r.retireDate);var wy=calcWorkYears(r.workStart,r.retireDate);
    var ptShort=r.personType?r.personType.substring(0,3):'—';var postShort=r.post?r.post.split(' ')[0]:'—';var slShort=r.salaryLevel?r.salaryLevel.split(' ')[0]:'—';
    h+='<tr><td style="color:var(--primary);font-weight:600;white-space:nowrap">'+escapeHtml(r.id)+'</td><td>'+escapeHtml(r.teacherName||'—')+'</td><td>'+escapeHtml(r.gender||'—')+'</td><td>'+age+'</td><td>'+escapeHtml(r.education||'—')+'</td><td>'+escapeHtml(r.politics||'—')+'</td><td>'+escapeHtml(r.workStart||'—')+'</td><td>'+wy+'</td><td>'+escapeHtml(r.teachYears||'—')+'</td><td>'+escapeHtml(ptShort)+'</td><td>'+escapeHtml(postShort)+'</td><td>'+escapeHtml(slShort)+'</td><td style="font-size:11px">'+escapeHtml((r.submitTime||'').substring(0,16))+'</td><td><span class="status-badge '+r.status+'">'+(STATUS_MAP[r.status]||r.status)+'</span></td><td style="white-space:nowrap">';
    if(r.status==='rejected')h+='<button class="btn btn-primary btn-sm" onclick="location.href=\'retire-form.html?id='+r.id+'\'">修改重提</button> ';
    if(r.status==='approved_first')h+='<button class="btn btn-success btn-sm" onclick="location.href=\'retire-hr-entry.html?id='+r.id+'\'">录入人社结果</button> ';
    h+='<button class="btn btn-outline btn-sm" onclick="location.href=\'retire-detail.html?id='+r.id+'&role=school\'">查看</button></td></tr>';
  });
  h+='</tbody></table></div></div>';list.innerHTML=h;
}
function sidebarClick(el,id){
  if(arguments.length===1){id=el;el=null;}
  if(id==='retire'){return;}
  if(id==='workbench'){window.location.href='workbench.html';return;}
  if(id==='ledger'){window.location.href='org-ledger-school.html';return;}
  if(id==='staffing'){window.location.href='staffing-application.html';return;}
  if(id==='entry'){window.location.href='教师入编管理（学校管理员视角）.html';return;}
  if(id==='exit'){window.location.href='教师出编管理（学校管理员视角）.html';return;}
  if(id==='postset'){window.location.href='post-list-school.html';return;}
  if(id==='promote'){window.location.href='promote-list-school.html';return;}
  if(id==='recruit'){window.location.href='recruit-list-school.html';return;}
  if(id==='employ'){window.location.href='employ-list-school.html';return;}
  if(id==='contract-entry'){window.location.href='contract-entry-list-school.html';return;}
  if(id==='contract-exit'){window.location.href='contract-exit-list-school.html';return;}
  if(id==='ethics'){showToast('师德师风举报页面开发中');return;}
  if(id==='account'){window.location.href='account-management.html';return;}
  if(id==='org'){window.location.href='org-management.html';return;}
  if(id==='announcement'){window.location.href='announcement-management.html';return;}
  showToast('跳转至：'+(el?el.textContent:id));
}
