<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.topnav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; transition: var(--transition); font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; display: flex; flex-direction: column; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label, .sidebar.collapsed .menu-group, .sidebar.collapsed .menu-badge, .sidebar.collapsed .role-switcher-label, .sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7); transition: var(--transition); position: relative; text-decoration: none; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px; min-height: calc(100vh - 56px); transition: margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* Profile Card */
.profile-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 28px 32px; margin-bottom: 20px; }
.profile-top { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 16px; }
.profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #1E40AF, #3B82F6); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #fff; flex-shrink: 0; }
.profile-info { flex: 1; }
.profile-name { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.profile-name .demo-tag { display: inline-block; padding: 1px 8px; background: #FEF3C7; color: #92400E; border-radius: 10px; font-size: 10px; font-weight: 500; margin-left: 8px; vertical-align: middle; }
.profile-meta { font-size: 13px; color: var(--text-secondary); line-height: 1.8; }
.profile-meta .meta-sep { color: var(--border); margin: 0 8px; }
.profile-divider { height: 1px; background: var(--border); margin: 14px 0; }
.profile-section-title { font-size: 12px; font-weight: 600; color: var(--text-light); margin-bottom: 8px; letter-spacing: 1px; }
.profile-section { display: flex; gap: 24px; font-size: 13px; color: var(--text-secondary); flex-wrap: wrap; }
.profile-section .field { display: flex; align-items: center; gap: 6px; }
.profile-section .field-label { color: var(--text-light); }
.profile-section .field-value { color: var(--text); font-weight: 500; }
.profile-section .account-status { display: inline-block; padding: 1px 10px; background: #D1FAE5; color: #065F46; border-radius: 10px; font-size: 11px; font-weight: 500; }
.profile-section .account-status.frozen { background: #FEE2E2; color: #991B1B; }

/* Tabs */
.info-tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 2px solid var(--border); }
.info-tab { padding: 10px 20px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: var(--transition); }
.info-tab:hover { color: var(--text); }
.info-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* Content cards */
.content-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 24px 28px; margin-bottom: 16px; }
.content-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.content-card h3 .card-icon { width: 28px; height: 28px; background: var(--primary-light); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 16px; }
.field-grid.cols2 { grid-template-columns: repeat(2, 1fr); }
.field-grid.cols4 { grid-template-columns: repeat(4, 1fr); }
.field-item { display: flex; flex-direction: column; gap: 2px; }
.field-item .fl { font-size: 11px; color: var(--text-light); }
.field-item .fv { font-size: 13px; color: var(--text); font-weight: 500; word-break: break-all; }

/* Timeline */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.timeline-item { position: relative; padding-bottom: 18px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before { content: ''; position: absolute; left: -19px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--accent); }
.timeline-item.completed::before { background: var(--success); box-shadow: 0 0 0 2px var(--success); }
.timeline-item.rejected::before { background: var(--danger); box-shadow: 0 0 0 2px var(--danger); }
.timeline-item.pending::before { background: var(--warning); box-shadow: 0 0 0 2px var(--warning); }
.tl-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.tl-time { font-size: 12px; color: var(--text-light); }
.tl-title { font-size: 13px; font-weight: 600; }
.tl-detail { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.tl-expand { font-size: 12px; color: var(--primary); cursor: pointer; margin-top: 6px; user-select: none; }
.tl-expand:hover { text-decoration: underline; }
.tl-body { display: none; margin-top: 10px; padding: 14px 16px; background: #F8FAFC; border-radius: 6px; border: 1px solid var(--border); }
.tl-body.show { display: block; }

/* Attachments */
.att-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.att-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: #fff; }
.att-name { flex: 1; color: var(--text); font-weight: 500; }
.att-size { color: var(--text-light); white-space: nowrap; }
.att-source { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 500; background: var(--primary-light); color: var(--primary); white-space: nowrap; }
.att-actions { display: flex; gap: 6px; }
.att-link { font-size: 11px; color: var(--primary); cursor: pointer; text-decoration: none; white-space: nowrap; }
.att-link:hover { text-decoration: underline; }

/* Status badges */
.status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.status-badge.pending { background: #FEF3C7; color: #92400E; }
.status-badge.approved { background: #D1FAE5; color: #065F46; }
.status-badge.rejected { background: #FEE2E2; color: #991B1B; }
.status-badge.review { background: #DBEAFE; color: #1E40AF; }

/* Login history */
.login-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.login-table th { padding: 8px 14px; text-align: left; font-weight: 600; font-size: 11px; color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border); }
.login-table td { padding: 8px 14px; border-bottom: 1px solid var(--border); }
.login-result { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
.login-result.success { background: #D1FAE5; color: #065F46; }
.login-result.fail { background: #FEE2E2; color: #991B1B; }

/* Empty state */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 32px; margin-bottom: 10px; }
.empty-state .empty-text { font-size: 13px; margin-bottom: 6px; }
.empty-state .empty-hint { font-size: 11px; color: var(--text-light); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 680px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
.modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { cursor: pointer; color: var(--text-light); font-size: 20px; padding: 4px; border: none; background: none; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--transition); border: 1px solid transparent; font-family: inherit; text-decoration: none; }
.btn-primary { background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); color: #fff; }
.btn-primary:hover { box-shadow: 0 4px 12px rgba(30,64,175,0.3); transform: translateY(-1px); }
.btn-outline { background: #fff; color: var(--text-secondary); border-color: var(--border); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-cancel { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); padding: 8px 18px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; }

/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease; box-shadow: var(--shadow-lg); }
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ===== Change Password Modal ===== */
.pwd-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
.pwd-modal-overlay.show { display: flex; }
.pwd-modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 440px; max-width: 90vw; }
.pwd-modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.pwd-modal-header h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.pwd-modal-close { cursor: pointer; color: var(--text-light); font-size: 20px; padding: 4px; border: none; background: none; line-height: 1; }
.pwd-modal-close:hover { color: var(--text); }
.pwd-modal-body { padding: 20px 24px; }
.pwd-modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

.pwd-field { margin-bottom: 16px; }
.pwd-field label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.pwd-input-wrap { position: relative; display: flex; align-items: center; }
.pwd-input-wrap input { width: 100%; height: 42px; padding: 0 40px 0 12px; font-size: 14px; font-family: inherit; color: var(--text); background: #F8FAFC; border: 1.5px solid var(--border); border-radius: var(--radius); outline: none; transition: var(--transition); }
.pwd-input-wrap input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px rgba(30,64,175,0.08); }
.pwd-eye { position: absolute; right: 8px; background: none; border: none; cursor: pointer; color: var(--text-light); padding: 4px; border-radius: 4px; }
.pwd-eye:hover { color: var(--text-secondary); background: #F1F5F9; }

.pwd-strength { display: flex; gap: 4px; margin-top: 8px; }
.pwd-strength-bar { flex: 1; height: 4px; border-radius: 2px; background: #E2E8F0; transition: var(--transition); }
.pwd-strength-bar.weak { background: var(--danger); }
.pwd-strength-bar.medium { background: var(--warning); }
.pwd-strength-bar.strong { background: var(--success); }
.pwd-strength-label { font-size: 11px; margin-top: 4px; font-weight: 500; }
.pwd-strength-label.weak { color: var(--danger); }
.pwd-strength-label.medium { color: var(--warning); }
.pwd-strength-label.strong { color: var(--success); }

.pwd-rules { margin-top: 12px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.pwd-rule { display: flex; align-items: center; gap: 6px; color: var(--text-light); }
.pwd-rule.pass { color: var(--success); }
.pwd-rule .rule-icon { width: 14px; text-align: center; }

/* ===== Attachment Preview Modal ===== */
.preview-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1001; align-items: center; justify-content: center; }
.preview-modal-overlay.show { display: flex; }
.preview-modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 560px; max-width: 90vw; }
.preview-modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.preview-modal-header h3 { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; }
.preview-modal-close { cursor: pointer; color: var(--text-light); font-size: 20px; padding: 4px; border: none; background: none; line-height: 1; }
.preview-modal-close:hover { color: var(--text); }
.preview-modal-body { padding: 20px; text-align: center; }
.preview-img-placeholder { width: 100%; max-height: 340px; background: #F1F5F9; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px 20px; border: 2px dashed var(--border); }
.preview-img-placeholder .preview-icon { font-size: 48px; }
.preview-img-placeholder .preview-name { font-size: 14px; font-weight: 600; color: var(--text); }
.preview-img-placeholder .preview-meta { font-size: 12px; color: var(--text-light); }
.preview-file-info { background: #F8FAFC; border-radius: 8px; padding: 24px; text-align: left; }
.preview-file-info .pfi-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.preview-file-info .pfi-row:last-child { border-bottom: none; }
.preview-file-info .pfi-label { color: var(--text-light); }
.preview-file-info .pfi-value { color: var(--text); font-weight: 500; }
.preview-file-hint { margin-top: 12px; padding: 10px 14px; background: #FEF3C7; border-radius: 6px; font-size: 12px; color: #92400E; text-align: center; }
.preview-modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

/* ===== Source tag ===== */
.source-tag { display: inline-block; padding: 1px 8px; background: #DBEAFE; color: #1E40AF; border-radius: 10px; font-size: 10px; font-weight: 500; margin-left: 6px; vertical-align: middle; }

/* ===== Required marker ===== */
.required-marker { display: inline-block; padding: 1px 6px; background: #FEE2E2; color: #991B1B; border-radius: 3px; font-size: 10px; font-weight: 600; margin-left: 4px; }

/* ===== Cert list in profile card ===== */
.cert-list { display: flex; flex-direction: column; gap: 8px; }
.cert-card { padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
.cert-card.required-cert { border-left: 3px solid var(--danger); }
.cert-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.cert-card-header .cert-type-icon { font-size: 16px; }
.cert-card-header .cert-title { font-size: 13px; font-weight: 600; color: var(--text); }
.cert-card-header .cert-status { margin-left: auto; }
.cert-card-detail { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.cert-card-detail .cert-detail-sep { color: var(--border); margin: 0 6px; }
.cert-card-actions { margin-top: 6px; display: flex; gap: 10px; }
.cert-card-actions a { font-size: 11px; color: var(--primary); cursor: pointer; text-decoration: none; }
.cert-card-actions a:hover { text-decoration: underline; }

/* ===== Edu cert list ===== */
.edu-cert-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
.edu-cert-item .edu-cert-name { color: var(--primary); cursor: pointer; font-weight: 500; }
.edu-cert-item .edu-cert-name:hover { text-decoration: underline; }

// ===== MIGRATE ENTRY ATTACHMENTS =====
function migrateEntryAttachments(teacherName) {
  var up = loadUserProfile();
  if (up._migrated) return; // Already migrated, skip

  var records = loadData();
  var data = findTeacherRecords(records, teacherName);
  if (!data.entry) return; // No entry record, nothing to migrate

  var entryAttachments = data.entry.attachments || [];
  if (entryAttachments.length === 0) return;

  // Match by filename keywords
  function findAttach(keys) {
    for (var i = 0; i < entryAttachments.length; i++) {
      var a = entryAttachments[i];
      for (var k = 0; k < keys.length; k++) {
        if (a.name.indexOf(keys[k]) >= 0) return a;
      }
    }
    return null;
  }

  var changed = false;

  // Migrate ID card attachment
  if (!up.idCardAttachment) {
    var idCard = findAttach(['身份证']);
    if (idCard) {
      up.idCardAttachment = { name: idCard.name, size: idCard.size, type: idCard.name.match(/\.(jpg|jpeg|png)$/i) ? 'image/' + (idCard.name.match(/\.(jpg|jpeg|png)$/i)[1] === 'jpg' ? 'jpeg' : idCard.name.match(/\.(jpg|jpeg|png)$/i)[1]) : 'application/pdf', source: 'entry' };
      changed = true;
    }
  }

  // Migrate education certificates
  if (!up.eduCertificates || up.eduCertificates.length === 0) {
    up.eduCertificates = [];
    var eduCert = findAttach(['学历证书']);
    var degreeCert = findAttach(['学位证书']);
    if (eduCert) {
      up.eduCertificates.push({ name: eduCert.name, size: eduCert.size, type: 'application/pdf', source: 'entry' });
      changed = true;
    }
    if (degreeCert) {
      up.eduCertificates.push({ name: degreeCert.name, size: degreeCert.size, type: 'application/pdf', source: 'entry' });
      changed = true;
    }
  }

  // Migrate teaching certificate
  if (!up.certificates || up.certificates.length === 0) {
    var teachCert = findAttach(['教师资格证', '教师资格证书']);
    up.certificates = up.certificates || [];
    // Check if teaching cert already exists
    var hasTeachCert = false;
    for (var i = 0; i < up.certificates.length; i++) {
      if (up.certificates[i].certType === '教师资格证') { hasTeachCert = true; break; }
    }
    if (!hasTeachCert) {
      var certEntry = {
        id: 'cert_' + Date.now(),
        certType: '教师资格证',
        certName: '高级中学教师资格证',
        certCategory: '高中数学',
        certNo: '2011451234567890',
        certifyDate: '2011-07-15',
        certifyOrg: '广西壮族自治区教育厅',
        certStatus: '有效',
        isRequired: true,
        attachment: null
      };
      if (teachCert) {
        certEntry.attachment = { name: teachCert.name, size: teachCert.size, type: 'application/pdf', source: 'entry' };
      }
      up.certificates.unshift(certEntry);
      changed = true;
    }
  }

  if (changed) {
    up._migrated = true;
    saveUserProfile(up);
  }
}

// ===== DATA LOADING =====
function loadData() {
  var records = { promote: [], entry: [], exit: [], employ: [], ethics: [], retire: [] };
  try { records.promote = JSON.parse(localStorage.getItem('promote_records') || '[]'); } catch(e) {}
  try { records.entry = JSON.parse(localStorage.getItem('entry_records') || '[]'); } catch(e) {}
  try { records.exit = JSON.parse(localStorage.getItem('exit_records') || '[]'); } catch(e) {}
  try { records.employ = JSON.parse(localStorage.getItem('employ_records') || '[]'); } catch(e) {}
  return records;
}

function findTeacherRecords(records, teacherName) {
  var result = { promote: [], entry: null, exit: [], employ: [], transfers: [] };
  result.promote = records.promote.filter(function(r) { return r.teacherName === teacherName; }).sort(function(a,b) { return (b.submitTime||'').localeCompare(a.submitTime||''); });
  // Entry: career match by name, control match by persons[].name
  for (var i = 0; i < records.entry.length; i++) {
    var r = records.entry[i];
    if (r.type === 'career' && r.name === teacherName) { result.entry = r; break; }
    if (r.type === 'control' && r.persons) {
      for (var j = 0; j < r.persons.length; j++) { if (r.persons[j].name === teacherName) { result.entry = r; result.entry._matchedPerson = r.persons[j]; break; } }
      if (result.entry) break;
    }
  }
  // Exit
  for (var i = 0; i < records.exit.length; i++) {
    var r = records.exit[i];
    if (r.persons) {
      for (var j = 0; j < r.persons.length; j++) { if (r.persons[j].name === teacherName) { result.exit.push(r); break; } }
    }
  }
  // Employ
  for (var i = 0; i < records.employ.length; i++) {
    var r = records.employ[i];
    if (r.persons) {
      for (var j = 0; j < r.persons.length; j++) { if (r.persons[j].name === teacherName) { result.employ.push(r); break; } }
    }
  }
  // Transfers: entry records with entryMethod==调动 + exit records with exitForm==调动
  for (var i = 0; i < records.entry.length; i++) {
    var r = records.entry[i];
    if (r.entryMethod === '调动' && ((r.type === 'career' && r.name === teacherName) || (r.type === 'control' && r.persons && r.persons.some(function(p){return p.name===teacherName})))) {
      result.transfers.push({ type:'调入', record: r, time: r.submitTime });
    }
  }
  for (var i = 0; i < records.exit.length; i++) {
    var r = records.exit[i];
    if (r.persons) {
      for (var j = 0; j < r.persons.length; j++) {
        if (r.persons[j].name === teacherName && r.persons[j].exitForm === '调动') {
          result.transfers.push({ type:'调出', record: r, person: r.persons[j], time: r.submitTime });
        }
      }
    }
  }
  result.transfers.sort(function(a,b) { return (a.time||'').localeCompare(b.time||''); });
  return result;
}

function buildProfile(data) {
  var p = { name: targetTeacher.name, school: targetTeacher.school, role: currentRole, gender: '', ethnicity: '', birthDate: '', idCard: '', politicalStatus: '', education: '', graduateInfo: '', spouseName: '', spouseWorkUnit: '', currentPost: '', currentTitle: '', appointTime: '', categoryName: '', staffingType: '', entryMethod: '', assignPosition: '', phone: '', email: '' };
  // ID card — from targetTeacher (accountId mode) first, then exit records
  if (targetTeacher.idCard) p.idCard = targetTeacher.idCard;
  // Staffing type — fallback from teacher_accounts (for contract teachers etc.)
  try {
    var taccs = JSON.parse(localStorage.getItem('teacher_accounts') || '[]');
    for (var tai = 0; tai < taccs.length; tai++) {
      if (taccs[tai].accountId === targetTeacher.accountId || taccs[tai].idCard === targetTeacher.idCard || taccs[tai].name === targetTeacher.name) {
        p.staffingType = taccs[tai].staffingType || '';
        p.crossSchoolType = taccs[tai].crossSchoolType || 'normal';
        p.crossSchool = taccs[tai].crossSchool || '';
        p.crossStartDate = taccs[tai].crossStartDate || '';
        p.crossEndDate = taccs[tai].crossEndDate || '';
        break;
      }
    }
  } catch(e) {}
  // From entry
  if (data.entry) {
    var e = data.entry;
    if (e.type === 'career') {
      p.gender = p.gender || e.gender; p.ethnicity = p.ethnicity || e.ethnicity; p.politicalStatus = p.politicalStatus || e.politics;
      p.education = p.education || e.education; p.graduateInfo = p.graduateInfo || e.graduateInfo;
      p.spouseName = e.spouseName || ''; p.spouseWorkUnit = e.spouseWorkUnit || '';
      p.phone = e.phone || ''; p.email = e.email || '';
      var st = e.staffingType || e.type || '';
      p.staffingType = (st === 'career' || st === '事业编') ? '事业编' : (st === 'control' || st === '控制数') ? '控制数' : (st === 'contract' || st === '合同制') ? '合同制' : st;
      p.entryMethod = e.entryMethod || '';
      p.assignPosition = e.assignPosition || '';
    } else {
      var st2 = e.staffingType || e.type || '';
      p.staffingType = (st2 === 'control' || st2 === '控制数') ? '控制数' : (st2 === 'career' || st2 === '事业编') ? '事业编' : (st2 === 'contract' || st2 === '合同制') ? '合同制' : st2;
      p.entryMethod = e.entryMethod || (e._matchedPerson ? e._matchedPerson.entryMethod : '') || '';
      p.assignPosition = (e._matchedPerson ? e._matchedPerson.assignPosition : '') || '';
    }
  }
  // ID card from exit records (fallback)
  if (!p.idCard && data.exit.length > 0) {
    for (var i = 0; i < data.exit.length; i++) {
      var exitRec = data.exit[i];
      if (exitRec.persons) {
        for (var j = 0; j < exitRec.persons.length; j++) {
          if (exitRec.persons[j].name === targetTeacher.name && exitRec.persons[j].idCard) {
            p.idCard = exitRec.persons[j].idCard;
            break;
          }
        }
      }
      if (p.idCard) break;
    }
  }
  // From promote (latest)
  if (data.promote.length > 0) {
    var pm = data.promote[0];
    p.gender = p.gender || pm.gender; p.ethnicity = p.ethnicity || pm.ethnicity; p.birthDate = p.birthDate || pm.birthDate;
    p.politicalStatus = p.politicalStatus || pm.politicalStatus; p.education = p.education || pm.education;
    p.currentPost = pm.currentPost || ''; p.currentTitle = pm.currentTitle || ''; p.appointTime = pm.appointTime || '';
    p.categoryName = pm.categoryName || '专业技术岗位';
  }
  // Merge user-edited profile (takes priority over business records)
  var up = loadUserProfile();
  if (up.gender) p.gender = up.gender;
  if (up.ethnicity) p.ethnicity = up.ethnicity;
  if (up.birthDate) p.birthDate = up.birthDate;
  if (up.education) p.education = up.education;
  if (up.graduateInfo) p.graduateInfo = up.graduateInfo;
  if (up.politicalStatus) p.politicalStatus = up.politicalStatus;
  if (up.categoryName) p.categoryName = up.categoryName;
  if (up.currentPost) p.currentPost = up.currentPost;
  if (up.currentTitle) p.currentTitle = up.currentTitle;
  if (up.appointTime) p.appointTime = up.appointTime;
  if (up.staffingType) p.staffingType = up.staffingType;
  if (up.entryMethod) p.entryMethod = up.entryMethod;
  if (up.assignPosition) p.assignPosition = up.assignPosition;
  if (up.phone) p.phone = up.phone;
  if (up.email) p.email = up.email;
  if (up.spouseName !== undefined) p.spouseName = up.spouseName;
  if (up.spouseWorkUnit !== undefined) p.spouseWorkUnit = up.spouseWorkUnit;
  // New editable fields: job, title, degree, teachingInfo
  if (up.job) p.job = up.job;
  if (up.title) p.title = up.title;
  if (up.degree) p.degree = up.degree;
  if (up.teachingInfo) p.teachingInfo = up.teachingInfo;
  // Family extension — new structured format
  p.maritalStatus = up.maritalStatus || '';
  p.familyMembers = up.familyMembers || {};
  // Migrate old flat format to new structured format
  if (!p.familyMembers || Object.keys(p.familyMembers).length === 0) {
    var migrated = false;
    var fm = {};
    // Spouse
    if (up.spouseName || up.spouseWorkUnit) {
      fm.spouse = { name: up.spouseName || '', gender: '', birthDate: '', relationship: '夫妻', phone: '', workUnit: up.spouseWorkUnit || '', position: '' };
      migrated = true;
    }
    // Father
    if (up.fatherName || up.fatherPhone) {
      fm.father = { name: up.fatherName || '', gender: '男', birthDate: '', relationship: '父子', phone: up.fatherPhone || '', workUnit: '', position: '' };
      migrated = true;
    }
    // Mother
    if (up.motherName || up.motherPhone) {
      fm.mother = { name: up.motherName || '', gender: '女', birthDate: '', relationship: '母子', phone: up.motherPhone || '', workUnit: '', position: '' };
      migrated = true;
    }
    // Children (old free text)
    if (up.children) {
      fm.children = [{ name: up.children, gender: '', birthDate: '', relationship: '子女', phone: '', workUnit: '', position: '' }];
      migrated = true;
    }
    if (migrated) {
      p.familyMembers = fm;
      // Save migrated data back
      up.familyMembers = fm;
      saveUserProfile(up);
    }
  }
  // Contract teacher: extract contract data
  p.contracts = [];
  if (p.staffingType === '合同制') {
    var contractList = [];
    // From contract_entry_records
    var crs = [];
    try { crs = JSON.parse(localStorage.getItem('contract_entry_records') || '[]'); } catch(e) {}
    for (var ci = 0; ci < crs.length; ci++) {
      if (crs[ci].status === 'approved' && crs[ci].teachers) {
        for (var cj = 0; cj < crs[ci].teachers.length; cj++) {
          if (crs[ci].teachers[cj].idCard === (targetTeacher.idCard || p.idCard)) {
            var ct = crs[ci].teachers[cj];
            contractList.push({
              type: '入职签订',
              startDate: ct.contractStart || '',
              endDate: ct.contractEnd || '',
              entryDate: ct.entryDate || '',
              schoolName: crs[ci].schoolName,
              attachments: [ct.idCardAttachment, ct.laborContractAttachment].filter(Boolean),
              approveTime: crs[ci].approveTime || crs[ci].submitTime,
              source: 'contract_entry',
              status: crs[ci].status
            });
          }
        }
      }
    }
    // From employ_records (续聘等)
    var ers = [];
    try { ers = JSON.parse(localStorage.getItem('employ_records') || '[]'); } catch(e) {}
    for (var ek = 0; ek < ers.length; ek++) {
      if (ers[ek].persons) {
        for (var em = 0; em < ers[ek].persons.length; em++) {
          if (ers[ek].persons[em].name === targetTeacher.name) {
            var ep = ers[ek].persons[em];
            var cp = (ep.contractPeriod || '').split('至');
            contractList.push({
              type: ep.recruitSource || '聘用',
              startDate: (cp[0]||'').trim(),
              endDate: (cp[1]||'').trim(),
              schoolName: ers[ek].schoolName,
              attachments: ers[ek].attachments || [],
              approveTime: ers[ek].submitTime,
              source: 'employ',
              status: ers[ek].status
            });
          }
        }
      }
    }
    contractList.sort(function(a,b) { return (b.startDate||'').localeCompare(a.startDate||''); });
    p.contracts = contractList;
  }

  // Attachments
  p.idCardAttachment = up.idCardAttachment || null;
  p.photoAttachment = up.photoAttachment || null;
  p.eduCertificates = up.eduCertificates || [];
  p.certificates = up.certificates || [];
  return p;
}

// ===== ATTACHMENTS RENDERING =====
function renderAttachments(attachments, sourceLabel) {
  if (!attachments || attachments.length === 0) return '<span style="font-size:12px;color:var(--text-light);">未上传</span>';
  var h = '<div class="att-list">';
  attachments.forEach(function(a) {
    h += '<div class="att-item"><span class="att-name">' + escapeHtml(a.name) + '</span><span class="att-size">' + formatSize(a.size) + '</span>';
    if (sourceLabel) h += '<span class="att-source">' + sourceLabel + '</span>';
    h += '<span class="att-actions"><span class="att-link" onclick="downloadMockFile(\'' + escapeHtml(a.name) + '\')">下载</span></span></div>';
  });
  h += '</div>';
  return h;
}

function downloadMockFile(filename) {
  var content = '演示数据文件：' + filename + '\n生成时间：' + new Date().toISOString() + '\n此为模拟文件，实际环境中将下载真实附件。';
  var blob = new Blob(['﻿' + content], { type: 'text/plain;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = filename.replace(/\.[^.]+$/, '') + '_演示.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ===== FIELD RENDERING =====
function fv(label, val, cls) {
  var display = (val === undefined || val === null || val === '') ? '—' : String(val);
  return '<div class="field-item"><span class="fl">' + label + '</span><div class="fv' + (cls?' '+cls:'') + '">' + escapeHtml(display) + '</div></div>';
}

// ===== SELECT RENDERER =====
function renderSelect(name, id, options, selectedValue, placeholder, style) {
  var h = '<select name="' + name + '" id="' + id + '" style="width:100%;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;font-family:inherit;' + (style||'') + '">';
  if (placeholder) h += '<option value="">' + placeholder + '</option>';
  for (var i = 0; i < options.length; i++) {
    h += '<option value="' + escapeHtml(options[i]) + '"' + (options[i] === selectedValue ? ' selected' : '') + '>' + escapeHtml(options[i]) + '</option>';
  }
  h += '</select>';
  return h;
}

// ===== MULTI-SELECT RENDERER =====
function renderMultiSelect(name, id, options, selectedValues, size) {
  var selSet = {};
  if (selectedValues && selectedValues.length > 0) {
    for (var s = 0; s < selectedValues.length; s++) { selSet[selectedValues[s]] = true; }
  }
  var h = '<select multiple name="' + name + '" id="' + id + '" size="' + (size||6) + '" style="width:100%;padding:6px 8px;font-size:13px;border:1px solid var(--border);border-radius:6px;font-family:inherit;">';
  for (var i = 0; i < options.length; i++) {
    h += '<option value="' + escapeHtml(options[i]) + '"' + (selSet[options[i]] ? ' selected' : '') + '>' + escapeHtml(options[i]) + '</option>';
  }
  h += '</select><div style="font-size:11px;color:var(--text-light);margin-top:2px;">按住 Ctrl 可多选</div>';
  return h;
}

function renderExpandableForm(fields, attachments, sourceLabel) {
  var h = '<div class="field-grid">';
  fields.forEach(function(f) { h += fv(f.label, f.value); });
  h += '</div>';
  if (attachments && attachments.length > 0) {
    h += '<div style="margin-top:10px;font-size:12px;font-weight:600;color:var(--text-secondary);">附件资料</div>';
    h += renderAttachments(attachments, sourceLabel);
  }
  return h;
}

// ===== LOGIN HISTORY =====
var LOGIN_PAGE_SIZE = 15;
var loginCurrentPage = 1;

function renderLoginHistory() {
  var loginData = [];
  try { loginData = JSON.parse(localStorage.getItem('login_history') || '[]'); } catch(e) {}

  var totalPages = Math.ceil(loginData.length / LOGIN_PAGE_SIZE);
  if (loginCurrentPage > totalPages) loginCurrentPage = totalPages;
  if (loginCurrentPage < 1) loginCurrentPage = 1;

  var start = (loginCurrentPage - 1) * LOGIN_PAGE_SIZE;
  var pageData = loginData.slice(start, start + LOGIN_PAGE_SIZE);

  var h = '<div class="content-card"><h3><span class="card-icon">🔐</span>登录历史</h3>';

  if (loginData.length === 0) {
    h += '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无登录记录</div></div>';
  } else {
    h += '<table class="login-table"><thead><tr>';
    h += '<th>登录时间</th><th>IP地址</th><th>设备/浏览器</th><th>结果</th>';
    h += '</tr></thead><tbody>';
    for (var i = 0; i < pageData.length; i++) {
      var row = pageData[i];
      h += '<tr>';
      h += '<td>' + escapeHtml(row.time) + '</td>';
      h += '<td>' + escapeHtml(row.ip) + '</td>';
      h += '<td>' + escapeHtml(row.device) + '</td>';
      h += '<td><span class="login-result ' + (row.result==='success'?'success':'fail') + '">' + (row.result==='success'?'✅ 成功':'❌ ' + (row.failReason||'失败')) + '</span></td>';
      h += '</tr>';
    }
    h += '</tbody></table>';

    // Pagination
    if (totalPages > 1) {
      h += '<div class="pagination" style="margin-top:14px;display:flex;justify-content:center;align-items:center;gap:8px;">';
      h += '<button class="btn btn-sm btn-outline" onclick="loginGoPage(' + (loginCurrentPage-1) + ')" ' + (loginCurrentPage<=1?'disabled':'') + '>上一页</button>';
      h += '<span style="font-size:12px;color:var(--text-secondary);">第 ' + loginCurrentPage + ' / ' + totalPages + ' 页（共 ' + loginData.length + ' 条）</span>';
      h += '<button class="btn btn-sm btn-outline" onclick="loginGoPage(' + (loginCurrentPage+1) + ')" ' + (loginCurrentPage>=totalPages?'disabled':'') + '>下一页</button>';
      h += '</div>';
    }
  }

  h += '</div>';
  return h;
}

function loginGoPage(page) {
  var loginData = [];
  try { loginData = JSON.parse(localStorage.getItem('login_history') || '[]'); } catch(e) {}
  var totalPages = Math.ceil(loginData.length / LOGIN_PAGE_SIZE);
  if (page < 1 || page > totalPages) return;
  loginCurrentPage = page;
  var tc = document.getElementById('tabContent');
  if (tc) tc.innerHTML = renderLoginHistory();
}

// ===== MAIN RENDER =====
function toggleExpand(id) {
  var el = document.getElementById(id);
  if (!el) return;
  var isOpen = el.classList.contains('show');
  el.classList.toggle('show', !isOpen);
  // Update arrow on trigger
  var trigger = el.previousElementSibling;
  if (trigger && trigger.classList.contains('tl-expand')) {
    trigger.textContent = isOpen ? '展开 ▼' : '收起 ▲';
  }
}

// ===== EDIT PROFILE =====
function getUserProfileKey() {
  // Derive key from targetTeacher's idCard for multi-user support
  if (targetTeacher && targetTeacher.idCard) return 'user_profile_' + targetTeacher.idCard;
  // Fallback: try currentUser
  var cu = null;
  try { cu = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch(e) {}
  if (cu && cu.id) return 'user_profile_' + cu.id;
  return 'user_profile';
}

function loadUserProfile() {
  var key = getUserProfileKey();
  try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { return {}; }
}
function saveUserProfile(up) {
  var key = getUserProfileKey();
  localStorage.setItem(key, JSON.stringify(up));
}

function handleEditAttachUpload(type, fileInput) {
  var file = fileInput.files[0];
  if (!file) return;
  var maxSize = type === 'photo' ? 5242880 : 10485760;
  if (file.size > maxSize) { showToast('文件过大，最大' + (type==='photo'?'5MB':'10MB'), 'warning'); fileInput.value = ''; return; }
  var attach = { name: file.name, size: file.size, type: file.type, source: 'manual' };
  if (type === 'idCard') {
    window._editIdCardFile = attach;
    refreshEditAttachItem('idCard', attach, false);
  } else if (type === 'photo') {
    window._editPhotoFile = attach;
    refreshEditAttachItem('photo', attach, false);
  } else if (type === 'eduCert') {
    window._editEduCerts.push(attach);
    refreshEduCertsList();
  }
  fileInput.value = '';
}

function removeEditAttach(prefix) {
  if (prefix === 'idCard') {
    window._editIdCardFile = null;
    refreshEditAttachItem('idCard', null, false);
  } else if (prefix === 'photo') {
    window._editPhotoFile = null;
    refreshEditAttachItem('photo', null, false);
  } else if (prefix.indexOf('eduCert_') === 0) {
    var idx = parseInt(prefix.split('_')[1]);
    if (!isNaN(idx) && idx >= 0 && idx < window._editEduCerts.length) {
      window._editEduCerts.splice(idx, 1);
      refreshEduCertsList();
    }
  }
}

function refreshEditAttachItem(prefix, attach, removable) {
  var el = document.getElementById('edit_' + prefix + '_item');
  if (!el) return;
  if (!attach) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = '<span class="attach-info"><span class="attach-name">📄 ' + escapeHtml(attach.name) + '</span> <span class="attach-meta">(' + formatSize(attach.size) + ')</span>' + (attach.source==='entry' ? ' <span class="source-tag">来源于入编</span>' : '') + '</span><span class="edit-attach-actions"><button onclick="previewAttachment(\'' + escapeHtml(attach.name) + '\',' + (attach.size||0) + ',\'' + (attach.type||'application/pdf') + '\')">👁 预览</button><button onclick="downloadMockFile(\'' + escapeHtml(attach.name) + '\')">⬇ 下载</button><button class="danger" onclick="removeEditAttach(\'' + prefix + '\')">移除</button></span>';
}

function refreshEduCertsList() {

function toggleFmEditor(key) {
  var fields = document.getElementById('fm_' + key + '_fields');
  var card = document.getElementById('fm_' + key + '_card');
  var toggle = card.querySelector('.fe-toggle');
  if (!fields) return;
  var isHidden = fields.style.display === 'none';
  fields.style.display = isHidden ? '' : 'none';
  // Clear fields if hiding (mark as 无)
  if (!isHidden) {
    var prefix = 'fm_' + key;
    ['name','gender','idcard','birth','rel','phone','unit','pos'].forEach(function(f) {
      var el = document.getElementById(prefix + '_' + f);
      if (el) {
        if (el.tagName === 'SELECT') el.selectedIndex = 0;
        else el.value = '';
      }
    });
    card.classList.remove('has-data');
    toggle.textContent = '无 ▲';
  } else {
    card.classList.add('has-data');
    toggle.textContent = '填写中 ▼';
  }
}

// ===== SMS VERIFICATION =====
function sendSmsCode() {
  var phoneEl = document.getElementById('editPhone');
  var newPhone = (phoneEl ? phoneEl.value.trim() : '');
  if (!newPhone || !/^\d{11}$/.test(newPhone)) {
    showToast('请输入正确的11位手机号', 'warning');
    return;
  }
  if (newPhone === window._originalPhone) {
    showToast('手机号未变更，无需验证', 'warning');
    return;
  }
  if (window._smsCountdown > 0) return;
  // Simulate sending SMS (demo mode)
  window._smsCountdown = 60;
  var btn = document.getElementById('btnSendSms');
  btn.disabled = true;
  btn.textContent = window._smsCountdown + 's后重发';
  var timer = setInterval(function() {
    window._smsCountdown--;
    if (window._smsCountdown <= 0) {
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = '获取验证码';
    } else {
      btn.textContent = window._smsCountdown + 's后重发';
    }
  }, 1000);
  // Show SMS code input
  var smsGroup = document.getElementById('smsCodeGroup');
  if (smsGroup) smsGroup.style.display = '';
  showToast('验证码已发送至 ' + newPhone.slice(0,3) + '****' + newPhone.slice(7), 'success');
  // In demo mode, auto-fill with '123456' for convenience
  window._demoSmsCode = '123456';
}

function verifySmsCode() {
  var codeEl = document.getElementById('editSmsCode');
  var code = codeEl ? codeEl.value.trim() : '';
  if (!code || code.length !== 6) {
    showToast('请输入完整的6位短信验证码', 'warning');
    return false;
  }
  // Demo verification: accept '123456' or match the demo code
  if (code === '123456' || code === (window._demoSmsCode || '123456')) {
    window._smsVerified = true;
    return true;
  }
  showToast('验证码错误，请重新输入', 'warning');
  return false;
}

function saveEditProfile() {
  var up = loadUserProfile();

  // Validate required fields
  var politics = document.getElementById('editPolitics').value;
  if (!politics) { showToast('请选择政治面貌', 'warning'); return; }

  var newPhone = document.getElementById('editPhone').value.trim();
  if (!newPhone) { showToast('请输入手机号', 'warning'); return; }
  if (!/^\d{11}$/.test(newPhone)) { showToast('请输入正确的11位手机号', 'warning'); return; }

  var newEmail = document.getElementById('editEmail').value.trim();
  if (!newEmail) { showToast('请输入邮箱', 'warning'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)) { showToast('请输入正确的邮箱地址', 'warning'); return; }

  var maritalStatus = document.getElementById('editMaritalStatus').value;
  if (!maritalStatus) { showToast('请选择婚姻状况', 'warning'); return; }

  up.politicalStatus = politics;
  up.maritalStatus = maritalStatus;

  // SMS verification if phone changed
  if (newPhone !== window._originalPhone) {
    if (!window._smsVerified) {
      // Try to verify now
      if (!verifySmsCode()) return;
    }
    if (!window._smsVerified) {
      showToast('请先验证新手机号', 'warning');
      return;
    }
  }
  up.phone = newPhone;
  up.email = newEmail;

  // New fields: job, title, education, degree
  up.education = document.getElementById('editEducation') ? document.getElementById('editEducation').value : '';
  up.degree = document.getElementById('editDegree') ? document.getElementById('editDegree').value : '';
  up.job = document.getElementById('editJob') ? document.getElementById('editJob').value : '';
  up.title = document.getElementById('editTitle') ? document.getElementById('editTitle').value : '';

  // Teaching info
  var ti = up.teachingInfo || {};
  ti.firstTeachingTime = document.getElementById('editFirstTeachTime') ? document.getElementById('editFirstTeachTime').value : '';
  ti.mainPeriod = document.getElementById('editMainPeriod') ? document.getElementById('editMainPeriod').value : '';
  ti.mainSubject = document.getElementById('editMainSubject') ? document.getElementById('editMainSubject').value : '';
  ti.chineseLevel = document.getElementById('editChineseLevel') ? document.getElementById('editChineseLevel').value : '';

  // Multi-select: secPeriods
  ti.secPeriods = [];
  var spEl = document.getElementById('editSecPeriods');
  if (spEl) {
    for (var spi = 0; spi < spEl.options.length; spi++) {
      if (spEl.options[spi].selected && spEl.options[spi].value !== '') ti.secPeriods.push(spEl.options[spi].value);
    }
  }
  // Multi-select: secSubjects
  ti.secSubjects = [];
  var ssEl = document.getElementById('editSecSubjects');
  if (ssEl) {
    for (var ssi = 0; ssi < ssEl.options.length; ssi++) {
      if (ssEl.options[ssi].selected && ssEl.options[ssi].value !== '') ti.secSubjects.push(ssEl.options[ssi].value);
    }
  }
  up.teachingInfo = ti;

  // Helper: validate required fields for a family member
  function validateFmFields(prefix, label, isChild) {
    var name = document.getElementById(prefix + '_name');
    if (!name || !name.value.trim()) return null;
    var gender = document.getElementById(prefix + '_gender') ? document.getElementById(prefix + '_gender').value : '';
    var idCard = document.getElementById(prefix + '_idcard') ? document.getElementById(prefix + '_idcard').value.trim() : '';
    var birthDate = document.getElementById(prefix + '_birth') ? document.getElementById(prefix + '_birth').value.trim() : '';
    var relationship = document.getElementById(prefix + '_rel') ? document.getElementById(prefix + '_rel').value.trim() : '';
    var phone = document.getElementById(prefix + '_phone') ? document.getElementById(prefix + '_phone').value.trim() : '';
    var workUnit = document.getElementById(prefix + '_unit') ? document.getElementById(prefix + '_unit').value.trim() : '';
    var position = document.getElementById(prefix + '_pos') ? document.getElementById(prefix + '_pos').value.trim() : '';

    // Check required fields
    if (!name.value.trim()) { showToast(label + '：姓名为必填项', 'warning'); return { error: true }; }
    if (!gender) { showToast(label + '：性别为必填项', 'warning'); return { error: true }; }
    if (!idCard) { showToast(label + '：身份证号为必填项', 'warning'); return { error: true }; }
    if (!birthDate) { showToast(label + '：出生时间为必填项', 'warning'); return { error: true }; }
    if (!relationship) { showToast(label + '：与本人关系为必填项', 'warning'); return { error: true }; }

    // Phone: optional for minors (under 18), required for others
    var isMinor = false;
    if (isChild && birthDate) {
      var birth = new Date(birthDate);
      var now = new Date();
      var age = now.getFullYear() - birth.getFullYear();
      var monthDiff = now.getMonth() - birth.getMonth();
      if (monthDiff < 0 || (monthDiff === 0 && now.getDate() < birth.getDate())) age--;
      if (age < 18) isMinor = true;
    }
    if (!isMinor && !phone) { showToast(label + '：联系电话为必填项', 'warning'); return { error: true }; }

    return { name: name.value.trim(), gender: gender, idCard: idCard, birthDate: birthDate, relationship: relationship, phone: phone, workUnit: workUnit, position: position };
  }

  // Family members — new structured format
  var fm = {};
  function readFmEditor(key) {
    var prefix = 'fm_' + key;
    var fields = document.getElementById(prefix + '_fields');
    if (!fields || fields.style.display === 'none') return null; // Marked as 无
    var nameEl = document.getElementById(prefix + '_name');
    if (!nameEl || !nameEl.value.trim()) return null;
    var result = validateFmFields(prefix, key === 'spouse' ? '配偶' : key === 'father' ? '父亲' : '母亲', false);
    if (result.error) return 'error';
    return result;
  }

  // Validate spouse is required when married
  if (maritalStatus === '已婚') {
    var spouseFields = document.getElementById('fm_spouse_fields');
    if (!spouseFields || spouseFields.style.display === 'none') {
      showToast('婚姻状态为已婚时，配偶信息为必填项', 'warning');
      return;
    }
    var spouseName = document.getElementById('fm_spouse_name');
    if (!spouseName || !spouseName.value.trim()) {
      showToast('婚姻状态为已婚时，配偶信息为必填项', 'warning');
      return;
    }
  }

  var spouse = readFmEditor('spouse'); if (spouse === 'error') return; if (spouse) fm.spouse = spouse;
  var father = readFmEditor('father'); if (father === 'error') return; if (father) fm.father = father;
  var mother = readFmEditor('mother'); if (mother === 'error') return; if (mother) fm.mother = mother;

  // Children
  var children = [];
  if (window._editChildren) {
    for (var ci = 0; ci < window._editChildren.length; ci++) {
      var prefix = 'fm_child_' + ci;
      var cName = document.getElementById(prefix + '_name');
      if (cName && cName.value.trim()) {
        var cResult = validateFmFields(prefix, '子女' + (window._editChildren.length > 1 ? String(ci + 1) : ''), true);
        if (cResult.error) return;
        children.push(cResult);
      }
    }
  }
  if (children.length > 0) fm.children = children;

  up.familyMembers = fm;
  // Clean up old flat fields
  delete up.spouseName; delete up.spouseWorkUnit;
  delete up.fatherName; delete up.fatherPhone;
  delete up.motherName; delete up.motherPhone;
  delete up.children;

  // ID card attachment
  if (window._editIdCardFile !== undefined) {
    if (window._editIdCardFile === null) {
      up.idCardAttachment = null;
    } else {
      up.idCardAttachment = window._editIdCardFile;
    }
  }

  // Photo
  if (window._editPhotoFile !== undefined) {
    if (window._editPhotoFile === null) {
      up.photoAttachment = null;
    } else {
      up.photoAttachment = window._editPhotoFile;
    }
  }

  // Education certificates
  up.eduCertificates = window._editEduCerts || [];

  // Certificates
  var newCerts = [];
  // Teaching cert
  var tc = window._editTeachCert;
  if (tc) {
    var certId = tc.id;
    tc.certName = document.getElementById('cert_name_' + certId) ? document.getElementById('cert_name_' + certId).value.trim() : tc.certName;
    tc.certCategory = document.getElementById('cert_category_' + certId) ? document.getElementById('cert_category_' + certId).value.trim() : tc.certCategory;
    tc.certNo = document.getElementById('cert_no_' + certId) ? document.getElementById('cert_no_' + certId).value.trim() : tc.certNo;
    tc.certifyDate = document.getElementById('cert_date_' + certId) ? document.getElementById('cert_date_' + certId).value.trim() : tc.certifyDate;
    tc.certifyOrg = document.getElementById('cert_org_' + certId) ? document.getElementById('cert_org_' + certId).value.trim() : tc.certifyOrg;
    tc.certStatus = document.getElementById('cert_status_' + certId) ? document.getElementById('cert_status_' + certId).value : tc.certStatus;
    // Validate mandatory fields
    if (!tc.certNo || !tc.certCategory || !tc.certifyDate || !tc.attachment) {
      showToast('教师资格证为必传信息，请完善证书编号、种类、认证时间和附件', 'warning');
      return;
    }
    newCerts.push(tc);
  }
  // Other certs
  var otherCerts = window._editOtherCerts || [];
  for (var oi = 0; oi < otherCerts.length; oi++) {
    var oc = otherCerts[oi];
    var ocId = oc.id;
    oc.certType = document.getElementById('cert_type_' + ocId) ? document.getElementById('cert_type_' + ocId).value : oc.certType;
    oc.certName = document.getElementById('cert_name_' + ocId) ? document.getElementById('cert_name_' + ocId).value.trim() : oc.certName;
    oc.certCategory = document.getElementById('cert_category_' + ocId) ? document.getElementById('cert_category_' + ocId).value.trim() : oc.certCategory;
    oc.certNo = document.getElementById('cert_no_' + ocId) ? document.getElementById('cert_no_' + ocId).value.trim() : oc.certNo;
    oc.certifyDate = document.getElementById('cert_date_' + ocId) ? document.getElementById('cert_date_' + ocId).value.trim() : oc.certifyDate;
    oc.certifyOrg = document.getElementById('cert_org_' + ocId) ? document.getElementById('cert_org_' + ocId).value.trim() : oc.certifyOrg;
    oc.certStatus = document.getElementById('cert_status_' + ocId) ? document.getElementById('cert_status_' + ocId).value : oc.certStatus;
    // Skip empty certs
    if (!oc.certName && !oc.certNo) continue;
    newCerts.push(oc);
  }
  up.certificates = newCerts;

  // Validate ID card attachment (always required)
  if (!up.idCardAttachment) {
    showToast('请上传身份证附件（必填）', 'warning');
    return;
  }

  // Keep migration flag
  if (!up._migrated && up.idCardAttachment) up._migrated = true;

  saveUserProfile(up);
  closeModal();
  showToast('个人信息已保存', 'success');

  if (window._editIsSetup) {
    // Setup mode: redirect to workbench after profile completion
    setTimeout(function() {
      window.location.href = 'workbench.html';
    }, 1000);
  } else {
    // Refresh profile card
    renderContent();
  }
}

function switchTab(key) {
  currentTab = key;
  renderContent();
}

function renderContent() {
  var records = loadData();
  var data = findTeacherRecords(records, targetTeacher.name);
  var profile = buildProfile(data);

  // Contract teachers default to contract tab
  if (profile.staffingType === '合同制' && (currentTab === 'staffing' || currentTab === 'post' || currentTab === 'employ')) {
    currentTab = 'contract';
  }

  var h = '';
  h += renderProfileCard(profile);
  h += renderTabs();
  document.getElementById('contentArea').innerHTML = h;

  var tc = document.getElementById('tabContent');
  if (currentTab === 'staffing') tc.innerHTML = renderStaffingTab(data);
  else if (currentTab === 'post') tc.innerHTML = renderPostTab(data);
  else if (currentTab === 'employ') tc.innerHTML = renderEmployTab(data);
  else if (currentTab === 'contract') tc.innerHTML = renderContractEmployTab(profile);
  else if (currentTab === 'personnel') tc.innerHTML = renderPersonnelTab();
  else if (currentTab === 'login') tc.innerHTML = renderLoginHistory();
}

var previewFileInfo = null;

function previewAttachment(name, size, type) {
  previewFileInfo = { name: name, size: size, type: type || 'application/pdf' };
  document.getElementById('previewModalTitle').textContent = name;
  var body = document.getElementById('previewModalBody');
  var isImage = type && type.indexOf('image/') === 0;
  if (isImage) {
    body.innerHTML = '<div class="preview-img-placeholder"><div class="preview-icon">🖼️</div><div class="preview-name">' + escapeHtml(name) + '</div><div class="preview-meta">' + formatSize(size) + ' | ' + escapeHtml(type) + '</div><div style="margin-top:8px;font-size:11px;color:var(--text-light);">（演示环境，实际部署后显示真实图片）</div></div>';
  } else {
    var ext = (name.match(/\.(\w+)$/) || ['','未知'])[1].toUpperCase();
    body.innerHTML = '<div class="preview-file-info"><div class="pfi-row"><span class="pfi-label">文件名</span><span class="pfi-value">' + escapeHtml(name) + '</span></div><div class="pfi-row"><span class="pfi-label">文件大小</span><span class="pfi-value">' + formatSize(size) + '</span></div><div class="pfi-row"><span class="pfi-label">文件类型</span><span class="pfi-value">' + escapeHtml(type) + '（' + ext + '）</span></div></div><div class="preview-file-hint">📄 此文件类型（' + ext + '）的预览需要后端支持，当前为演示环境。请下载文件查看完整内容。</div>';
  }
  document.getElementById('previewModalOverlay').classList.add('show');
}

function closePreviewModal() {
  document.getElementById('previewModalOverlay').classList.remove('show');
  previewFileInfo = null;
}

function previewDownload() {
  if (previewFileInfo) {
    downloadMockFile(previewFileInfo.name);
  }
}

document.getElementById('previewModalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closePreviewModal();
});

// ===== INIT =====
function init() {
  seedDemoData();
  var accountIdParam = getUrlParam('accountId');
  if (accountIdParam) {
    // Load teacher data from teacher_accounts
    var accounts = JSON.parse(localStorage.getItem('teacher_accounts') || '[]');
    var found = null;
    for (var i = 0; i < accounts.length; i++) {
      if (accounts[i].accountId === accountIdParam) { found = accounts[i]; break; }
    }
    if (found) {
      targetTeacher = { name: found.name, school: found.school, idCard: found.idCard, phone: found.phone, accountId: found.accountId, crossSchoolType: found.crossSchoolType || 'normal', crossSchool: found.crossSchool || '', crossStartDate: found.crossStartDate || '', crossEndDate: found.crossEndDate || '' };
      // Set currentUser to allow admin viewing
      localStorage.setItem('currentUser', JSON.stringify({ name: found.name, role: 'teacher', school: found.school, id: found.idCard, accountId: found.accountId }));
    } else {
      targetTeacher = { name: '未知教师', school: '—' };
    }
    currentRole = 'teacher';
  } else {
    var teacherParam = getUrlParam('teacher');
    if (teacherParam) {
      targetTeacher = { name: decodeURIComponent(teacherParam), school: decodeURIComponent(getUrlParam('school')||'') };
      if (currentRole !== 'teacher') {
        currentRole = 'teacher';
      }
    } else {
      // Fallback: use currentUser from localStorage
      var cu = null;
      try { cu = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch(e) {}
      if (cu && cu.name) {
        targetTeacher = { name: cu.name, school: cu.school || '', idCard: cu.id || '', accountId: cu.accountId || '' };
        // Load cross-school fields from teacher_accounts
        try {
          var taccs2 = JSON.parse(localStorage.getItem('teacher_accounts') || '[]');
          for (var ti2 = 0; ti2 < taccs2.length; ti2++) {
            if (taccs2[ti2].idCard === cu.id || taccs2[ti2].accountId === cu.accountId) {
              targetTeacher.crossSchoolType = taccs2[ti2].crossSchoolType || 'normal';
              targetTeacher.crossSchool = taccs2[ti2].crossSchool || '';
              targetTeacher.crossStartDate = taccs2[ti2].crossStartDate || '';
              targetTeacher.crossEndDate = taccs2[ti2].crossEndDate || '';
              break;
            }
          }
        } catch(e) {}
      } else {
        targetTeacher = { name: '陈明辉', school: '柳州市第八中学' };
      }
      currentRole = 'teacher';
    }
  }

  // Migrate entry attachments (runs once)
  if (targetTeacher && targetTeacher.name) {
    migrateEntryAttachments(targetTeacher.name);
  }

  renderSidebar();
  renderContent();

  // Setup mode: auto-open edit modal
  if (getUrlParam('mode') === 'setup') {
    setTimeout(function() { showEditProfileModal(); }, 300);
  }
}

    var defaults = [
      { role: 'city',     name: '张建国', id: '13807720001', password: 'Edu@2025' },
      { role: 'district', name: '李振华', id: '13807720002', password: 'Edu@2025' },
      { role: 'school',   name: '王玉兰', id: '13807720003', password: 'Edu@2025' }
    ];
    localStorage.setItem('admin_accounts', JSON.stringify(defaults));
  }
  return JSON.parse(localStorage.getItem('admin_accounts') || '[]');
}

function openChangePwdModal() {
  initAdminAccounts();
  document.getElementById('pwdOld').value = '';
  document.getElementById('pwdNew').value = '';
  document.getElementById('pwdConfirm').value = '';
  document.getElementById('pwdOld').type = 'password';
  document.getElementById('pwdNew').type = 'password';
  document.getElementById('pwdConfirm').type = 'password';
  resetPwdStrength();
  document.getElementById('pwdModalOverlay').classList.add('show');
}

function closeChangePwdModal() {
  document.getElementById('pwdModalOverlay').classList.remove('show');
}

document.getElementById('pwdModalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeChangePwdModal();
});

function togglePwdEye(inputId, btn) {
  var input = document.getElementById(inputId);
  input.type = input.type === 'password' ? 'text' : 'password';
}

function checkPwdStrength() {
  var pwd = document.getElementById('pwdNew').value;
  var bars = document.querySelectorAll('#pwdStrengthBars .pwd-strength-bar');
  var label = document.getElementById('pwdStrengthLabel');
  var rules = document.getElementById('pwdRules').querySelectorAll('.pwd-rule');

  bars.forEach(function(b) { b.className = 'pwd-strength-bar'; });
  label.className = 'pwd-strength-label';

  var hasLen = pwd.length >= 8 && pwd.length <= 20;
  var hasUpper = /[A-Z]/.test(pwd);
  var hasLower = /[a-z]/.test(pwd);
  var hasDigit = /[0-9]/.test(pwd);
  var oldPwd = document.getElementById('pwdOld').value;

  var ruleChecks = [hasLen, hasUpper, hasLower, hasDigit,
    !oldPwd || pwd !== oldPwd,
    document.getElementById('pwdConfirm').value === '' || pwd === document.getElementById('pwdConfirm').value
  ];
  rules.forEach(function(r, i) {
    var icon = r.querySelector('.rule-icon');
    if (ruleChecks[i]) { r.classList.add('pass'); icon.textContent = '✅'; }
    else { r.classList.remove('pass'); icon.textContent = '⬜'; }
  });

  if (!pwd) { label.textContent = ''; return; }

  var score = (hasLen?1:0) + (hasUpper?1:0) + (hasLower?1:0) + (hasDigit?1:0);
  if (score <= 1 || !hasLen) {
    bars[0].classList.add('weak');
    label.textContent = '弱'; label.classList.add('weak');
  } else if (score === 2 || score === 3) {
    bars[0].classList.add('medium'); bars[1].classList.add('medium');
    label.textContent = '中等'; label.classList.add('medium');
  } else if (score >= 4 && hasLen) {
    bars[0].classList.add('strong'); bars[1].classList.add('strong'); bars[2].classList.add('strong');
    label.textContent = '强'; label.classList.add('strong');
  }
}

function checkPwdMatch() {
  var newPwd = document.getElementById('pwdNew').value;
  var confirmPwd = document.getElementById('pwdConfirm').value;
  var rule = document.getElementById('pwdRuleMatch');
  var icon = rule.querySelector('.rule-icon');
  if (confirmPwd && newPwd === confirmPwd) { rule.classList.add('pass'); icon.textContent = '✅'; }
  else { rule.classList.remove('pass'); icon.textContent = '⬜'; }
}

function resetPwdStrength() {
  var bars = document.querySelectorAll('#pwdStrengthBars .pwd-strength-bar');
  bars.forEach(function(b) { b.className = 'pwd-strength-bar'; });
  document.getElementById('pwdStrengthLabel').textContent = '';
  document.getElementById('pwdStrengthLabel').className = 'pwd-strength-label';
  var rules = document.getElementById('pwdRules').querySelectorAll('.pwd-rule');
  rules.forEach(function(r) { r.classList.remove('pass'); r.querySelector('.rule-icon').textContent = '⬜'; });
}

function submitChangePwd() {
  var user = JSON.parse(localStorage.getItem('currentUser') || '{}');
  var oldPwd = document.getElementById('pwdOld').value;
  var newPwd = document.getElementById('pwdNew').value;
  var confirmPwd = document.getElementById('pwdConfirm').value;

  if (!oldPwd) { showToast('请输入当前密码','warning'); return; }
  if (!newPwd) { showToast('请输入新密码','warning'); return; }
  if (!confirmPwd) { showToast('请确认新密码','warning'); return; }

  if (newPwd.length < 8 || newPwd.length > 20) { showToast('密码须为8-20位','warning'); return; }
  if (!/[A-Z]/.test(newPwd)) { showToast('新密码须包含大写字母','warning'); return; }
  if (!/[a-z]/.test(newPwd)) { showToast('新密码须包含小写字母','warning'); return; }
  if (!/[0-9]/.test(newPwd)) { showToast('新密码须包含数字','warning'); return; }
  if (newPwd === oldPwd) { showToast('新密码不能与当前密码相同','warning'); return; }
  if (newPwd !== confirmPwd) { showToast('两次密码输入不一致','warning'); return; }

  if (user.role === 'teacher') {
    var teachers = JSON.parse(localStorage.getItem('teacher_accounts') || '[]');
    var found = false;
    for (var i = 0; i < teachers.length; i++) {
      if (teachers[i].idCard === user.id || teachers[i].accountId === user.accountId) {
        if (teachers[i].password !== oldPwd && (teachers[i].initialPassword || '') !== oldPwd) {
          showToast('当前密码错误','warning'); return;
        }
        teachers[i].password = newPwd;
        if (!teachers[i].firstLogin) { teachers[i].firstLogin = true; }
        found = true;
        break;
      }
    }
    if (!found) { showToast('账号数据异常，请联系管理员','warning'); return; }
    localStorage.setItem('teacher_accounts', JSON.stringify(teachers));
  } else {
    var admins = initAdminAccounts();
    var foundAdmin = false;
    for (var j = 0; j < admins.length; j++) {
      if (admins[j].id === user.id) {
        if (admins[j].password !== oldPwd) { showToast('当前密码错误','warning'); return; }
        admins[j].password = newPwd;
        foundAdmin = true;
        break;
      }
    }
    if (!foundAdmin) { showToast('账号数据异常，请联系管理员','warning'); return; }
    localStorage.setItem('admin_accounts', JSON.stringify(admins));
  }

  closeChangePwdModal();
  showToast('密码修改成功，即将跳转登录页…','success');

  setTimeout(function() {
    localStorage.removeItem('currentUser');
    window.location.href = 'index.html';
  }, 1500);
}

init();
