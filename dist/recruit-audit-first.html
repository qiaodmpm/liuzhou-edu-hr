<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审核招聘岗位申请 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* Two-column layout */
.two-columns { display: flex; gap: 24px; }
.main-col { flex: 1; min-width: 0; }
.side-col { width: 360px; flex-shrink: 0; }

/* Page header */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }

/* Status stamp */
.status-stamp {
  display: inline-block; padding: 6px 16px; border: 2px solid;
  transform: rotate(-5deg); font-weight: 700; font-size: 14px; background: #fff;
}
.status-stamp.pending { color: #F59E0B; border-color: #F59E0B; }
.status-stamp.approved { color: #10B981; border-color: #10B981; }
.status-stamp.rejected { color: #EF4444; border-color: #EF4444; }
.status-stamp.completed { color: #3730A3; border-color: #3730A3; }

/* Type tag */
.type-tag {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 500;
}
.type-tag.independent { background: #EFF6FF; color: var(--primary); }
.type-tag.public { background: #FEF3C7; color: #92400E; }
.type-tag.senior { background: #F3E8FF; color: #6B21A8; }

/* Audit bottom bar */
.audit-bottom-bar {
  background: #fff; border: 2px solid var(--primary);
  border-radius: var(--radius-lg); padding: 16px 20px;
  display: flex; gap: 12px; align-items: center; position: relative; z-index: 1;
  margin-top: 20px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.08);
}
.audit-bottom-bar .btn-approve {
  width: auto; padding: 12px 32px; font-size: 14px; font-weight: 600;
  border: none; border-radius: 6px; background: var(--success); color: #fff;
  cursor: pointer; font-family: inherit; transition: var(--transition);
}
.audit-bottom-bar .btn-approve:hover { background: #059669; }
.audit-bottom-bar .btn-reject {
  width: auto; padding: 12px 32px; font-size: 14px; font-weight: 600;
  border: 1px solid var(--danger); border-radius: 6px;
  background: #fff; color: var(--danger); cursor: pointer;
  font-family: inherit; transition: var(--transition);
}
.audit-bottom-bar .btn-reject:hover { background: #FEF2F2; }
.audit-bottom-bar .opinion-hint {
  flex: 1; font-size: 12px; color: var(--text-light);
}

/* Progress bar */
.progress-bar {
  display: flex; align-items: center; padding: 20px 24px;
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto;
}
.step-wrapper { display: flex; align-items: center; flex: 1; min-width: 0; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; min-width: 80px; }
.step-dot {
  width: 28px; height: 28px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
  border: 2px solid var(--border); color: var(--text-light); background: #fff;
  transition: var(--transition);
}
.step.done .step-dot { background: var(--success); color: #fff; border-color: var(--success); }
.step.current .step-dot { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30,64,175,0.12); }
.step-text { font-size: 11px; color: var(--text-light); white-space: nowrap; }
.step.current .step-text { color: var(--primary); font-weight: 500; }
.step.done .step-text { color: var(--success); }
.step-line { flex: 1; height: 2px; background: var(--border); margin: 0 4px 22px; min-width: 20px; }
.step-line.done { background: var(--success); }

/* Form cards (read-only) */
.form-card {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px;
}
.form-card h3, .form-card-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.form-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.form-item { display: flex; flex-direction: column; gap: 4px; }
.form-item.full { grid-column: 1 / -1; }
.form-item.col-span2 { grid-column: span 2; }
.form-item .label { font-size: 11px; color: var(--text-secondary); }
.form-item .value {
  padding: 7px 10px; font-size: 13px; background: var(--gray-bg);
  border-radius: 4px; color: var(--text); border: 1px solid var(--border);
  min-height: 34px;
}

/* Position card */
.position-card {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px; background: #FAFBFC;
}
.position-card .pos-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.position-card .pos-title { font-size: 14px; font-weight: 600; }
.position-card .field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 16px; }
.position-card .field-grid.cols2 { grid-template-columns: repeat(2, 1fr); }
.position-card .field-grid .full-width { grid-column: 1 / -1; }
.position-card .field-grid .col-span2 { grid-column: span 2; }
.position-card .field-item { display: flex; flex-direction: column; gap: 4px; }
.position-card .field-item .fl { font-size: 11px; color: var(--text-secondary); }
.position-card .field-item .fv {
  padding: 6px 10px; font-size: 13px; background: #fff;
  border-radius: 4px; color: var(--text); border: 1px solid var(--border);
  min-height: 32px;
}

/* Attachments */
.attachment-list { margin-top: 8px; }
.attachment-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--gray-bg); border-radius: 6px;
  margin-bottom: 6px; font-size: 12px;
}
.attachment-item .file-icon { font-size: 16px; flex-shrink: 0; }
.attachment-item .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment-item .file-size { color: var(--text-light); flex-shrink: 0; }
.attachment-item .file-download {
  color: var(--primary); cursor: pointer; text-decoration: none; flex-shrink: 0;
}
.attachment-item .file-download:hover { text-decoration: underline; }
.attachment-empty { font-size: 12px; color: var(--text-light); padding: 8px 0; }

/* Quota banner */
.quota-banner { padding: 12px 16px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
.quota-banner.warn { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
.quota-banner.ok { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
.quota-banner.error { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }

/* Flow info */
.flow-info {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; background: #EFF6FF; border: 1px solid #BFDBFE;
  border-radius: 6px; font-size: 12px; color: var(--primary); margin-bottom: 16px;
}

/* Sidebar sections */
.sidebar-section {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px;
}
.sidebar-section h4 { font-size: 13px; font-weight: 600; margin-bottom: 14px; }

/* Timeline */
.timeline { position: relative; padding-left: 20px; }
.timeline::before {
  content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px;
  width: 2px; background: var(--border);
}
.timeline-item { position: relative; padding-bottom: 16px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before {
  content: ''; position: absolute; left: -17px; top: 4px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--border);
}
.timeline-item.current::before { background: var(--primary); }
.timeline-item .tl-time { font-size: 11px; color: var(--text-light); }
.timeline-item .tl-action { font-size: 12px; font-weight: 500; margin-top: 2px; }
.timeline-item .tl-operator { font-size: 11px; color: var(--text-secondary); }
.timeline-item .tl-opinion { font-size: 11px; color: var(--text-secondary); font-style: italic; margin-top: 2px; }

/* Back link */
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  margin-bottom: 16px; font-size: 12px; color: var(--text-secondary);
  cursor: pointer;
}
.back-link:hover { color: var(--primary); }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.modal-container {
  background: #fff; border-radius: var(--radius-lg); padding: 28px;
  width: 480px; max-width: 90vw; box-shadow: var(--shadow-lg);
}
.modal-container h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
.form-group textarea, .form-group input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 14px; font-family: inherit; resize: vertical;
}
.form-group textarea:focus, .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel {
  padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px;
  border: 1px solid var(--border); background: #fff; color: var(--text-secondary); cursor: pointer;
}
.btn-cancel:hover { background: var(--gray-bg); }
.btn-confirm {
  padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px;
  border: none; color: #fff; cursor: pointer; background: var(--success);
}
.btn-confirm:hover { background: #059669; }
.btn-confirm.danger { background: var(--danger); }
.btn-confirm.danger:hover { background: #DC2626; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Modification history */
.mod-history { margin-top: 12px; }
.mod-entry {
  padding: 8px 12px; background: #FFFBEB; border: 1px solid #FDE68A;
  border-radius: 6px; margin-bottom: 6px; font-size: 12px;
}
.mod-entry .mod-time { color: var(--text-light); font-size: 11px; }
.mod-entry .mod-detail { color: var(--text); margin-top: 4px; }

/* Responsive */
@media (max-width: 1024px) {
  .two-columns { flex-direction: column; }
  .side-col { width: 100%; }
  .form-grid { grid-template-columns: repeat(2, 1fr); }
  .position-card .field-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
  .position-card .field-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <rect x="3" y="1" width="18" height="22" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/>
        <line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="12" y2="14"/>
        <line x1="12" y1="18" x2="16" y2="18"/><circle cx="8" cy="18" r="1.5" fill="#fff"/>
      </svg>
    </div>
    <span class="topnav-title">柳州教育人事管理平台</span>
  </div>
  <div class="topnav-right">
    <div class="topnav-bell">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge">3</span>
    </div>
    <div class="topnav-user" onclick="toggleUserMenu()">
      <div class="avatar" id="userAvatar">张</div>
      <span id="userName">张建国</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="user-dropdown" id="userDropdown">
        <a href="#">个人中心</a><a href="#">修改密码</a>
        <div class="divider"></div>
        <a href="index.html" class="logout">退出登录</a>
      </div>
    </div>
  </div>
</nav>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="role-switcher" id="roleSwitcher">
    <div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options">
      <button class="role-switch-btn" data-role="city" onclick="switchRole('city')"><span class="role-switch-dot city"></span><span class="role-switcher-name">市管理员</span></button>
      <button class="role-switch-btn" data-role="district" onclick="switchRole('district')"><span class="role-switch-dot district"></span><span class="role-switcher-name">区管理员</span></button>
      <button class="role-switch-btn" data-role="school" onclick="switchRole('school')"><span class="role-switch-dot school"></span><span class="role-switcher-name">校管理员</span></button>
      <button class="role-switch-btn" data-role="teacher" onclick="switchRole('teacher')"><span class="role-switch-dot teacher"></span><span class="role-switcher-name">教&emsp;师</span></button>
    </div>
  </div>
  <div class="sidebar-bottom">
    <div class="sidebar-toggle" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      <span class="menu-label">收起菜单</span>
    </div>
  </div>

var PROGRESS_STEPS_TWO = [

var PROGRESS_STEPS_ONE = [

]

function renderProgress(currentStep, totalSteps) {
  var steps = totalSteps === 4 ? PROGRESS_STEPS_TWO : PROGRESS_STEPS_ONE;
  var stepIndex = -1;
  if (currentStep === 'submitted') stepIndex = 0;
  else if (currentStep === 'first') stepIndex = 1;
  else if (currentStep === 'second') stepIndex = 2;
  else if (currentStep === 'completed') stepIndex = steps.length - 1;
  var h = '';
  for (var i = 0; i < steps.length; i++) {
    var state = 'pending';
    var display = (i + 1);
    if (i < stepIndex) { state = 'done'; display = '&#10003;'; }
    else if (i === stepIndex) { state = 'current'; }
    h += '<span class="step ' + state + '">';
    h += '<span class="step-dot">' + display + '</span>';
    h += '<span class="step-text">' + steps[i].label + '</span>';
    h += '</span>';
    if (i < steps.length - 1) {
      var lineState = i < stepIndex ? 'done' : '';
      h += '<span class="step-line ' + lineState + '"></span>';
    }
  }
  return h;
}
;

// ===== AUDIT FLOW LOGIC =====
function getAuditFlow(schoolCategory, recruitmentType) {
  if (schoolCategory === '市直属') {
    return { flow: 'A', steps: [{ level: 'first', reviewer: 'city', isFinal: true }] };
  }
  if (recruitmentType === 'independent') {
    return { flow: 'B', steps: [
      { level: 'first', reviewer: 'district', isFinal: false },
      { level: 'second', reviewer: 'city', isFinal: true }
    ]};
  }
  return { flow: 'C', steps: [{ level: 'first', reviewer: 'district', isFinal: true }] };
}

function canAudit(record) {
  var flow = getAuditFlow(record.schoolCategory, record.recruitmentType);
  var currentStepLevel = null;
  if (record.status === 'pending_first') currentStepLevel = 'first';
  else if (record.status === 'pending_second') currentStepLevel = 'second';

  if (!currentStepLevel) return { can: false, level: null, isFinal: false, readonly: false };

  var step = null;
  for (var i = 0; i < flow.steps.length; i++) {
    if (flow.steps[i].level === currentStepLevel) { step = flow.steps[i]; break; }
  }
  if (!step) return { can: false, level: null, isFinal: false, readonly: false };

  if (step.reviewer === currentRole) {
    return { can: true, level: step.level, isFinal: step.isFinal, readonly: false };
  }

  if (currentRole === 'city' && flow.flow === 'C') {
    return { can: false, level: null, isFinal: true, readonly: true };
  }

  return { can: false, level: null, isFinal: false, readonly: false };
}

// ===== TIMELINE =====
function renderTimeline(r) {
  var items = [];
  // Add existing timeline entries
  (r.timeline || []).forEach(function(t) { items.push(t); });
  // Add first audit info if not already in timeline
  if (r.firstReviewer) {
    var hasFirst = items.some(function(t) { return t.action && t.action.indexOf('审') >= 0; });
    if (!hasFirst) {
      var firstAction = r.firstReviewResult === 'rejected' ? '主管审核驳回' : '主管审核通过';
      items.push({
        time: r.firstReviewTime || '',
        action: firstAction,
        operator: r.firstReviewer,
        opinion: r.firstReviewOpinion || r.firstRejectReason || ''
      });
    }
  }
  // Sort by time
  items.sort(function(a, b) { return (a.time||'').localeCompare(b.time||''); });

  var h = '<div class="sidebar-section"><h4>申报履历</h4><div class="timeline">';
  if (items.length === 0) {
    h += '<div style="font-size:12px;color:var(--text-light);">暂无记录</div>';
  } else {
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var cls = (i === items.length - 1) ? ' current' : '';
      h += '<div class="timeline-item' + cls + '">';
      h += '<div class="tl-time">' + (item.time ? item.time.substring(0, 16) : '') + '</div>';
      h += '<div class="tl-action">' + escapeHtml(item.action) + '</div>';
      h += '<div class="tl-operator">操作人：' + escapeHtml(item.operator || '') + '</div>';
      if (item.opinion) {
        h += '<div class="tl-opinion">' + escapeHtml(item.opinion) + '</div>';
      }
      h += '</div>';
    }
  }
  h += '</div></div>';
  return h;
}

function getStatusStampClass(status) {
  if (status === 'pending_first' || status === 'pending_second') return 'pending';
  if (status === 'first_approved') return 'approved';
  if (status === 'first_rejected' || status === 'second_rejected') return 'rejected';
  if (status === 'completed') return 'completed';
  return 'pending';
}

function getTypeTagClass(type) {
  if (type === 'independent') return 'independent';
  if (type === 'public') return 'public';
  if (type === 'senior') return 'senior';
  return '';
}

function getEmployUrl() {
  if (currentRole === 'city' || currentRole === 'district') return 'employ-list-admin.html?role=' + currentRole;
  if (currentRole === 'school') return 'employ-list-school.html';
  return null;
}

  // Flow info
  
  // Progress bar
  html += '<div class="progress-bar"><div class="step-wrapper">' + renderProgress(currentStepStr, totalSteps) + '</div></div>';

  // Two-column layout
  html += '<div class="two-columns">';

  // Left main column
  html += '<div class="main-col">';

  // Quota
  // Quota banner removed

  // Form based on recruitment type
  html += renderFormByType(r);

  // Modification history (if any)
  html += renderModifications(r);

  // Attachments
  html += renderAttachments(r);

  html += '</div>'; // .main-col

  // Right sidebar
  html += '<div class="side-col">';
  html += renderTimeline(r);

  // Record info
  html += '<div class="sidebar-section"><h4>申报概要</h4>';
  html += '<div style="font-size:12px;line-height:2;">';
  html += '<div>学校：<b>' + escapeHtml(r.schoolName) + '</b></div>';
  html += '<div>学校类型：' + escapeHtml(r.schoolCategory||'—') + '</div>';
  html += '<div>招聘类型：<b>' + typeLabel + '</b></div>';
  html += '<div>岗位数：<b>' + ((r.formData && r.formData.positions) ? r.formData.positions.length : 0) + '</b></div>';
  html += '<div>招聘总人数：<b>' + getTotalCount(r.formData) + '</b></div>';
  html += '<div>附件数：<b>' + ((r.attachments||[]).length) + '</b></div>';
  html += '</div></div>';

  html += '</div>'; // .side-col
  html += '</div>'; // .two-columns

  // Bottom action bar
  if (auditInfo.can) {
    html += '<div class="audit-bottom-bar">';
    html += '<span class="opinion-hint">' + (auditInfo.isFinal ? '此为终审，审核通过后申报完成。' : '初审通过后将提交至市级终审。') + '</span>';
    html += '<button type="button" class="btn-reject" onclick="showRejectModal()">审核驳回</button>';
    html += '<button type="button" class="btn-approve" onclick="showApproveModal()">审核通过</button>';
    html += '</div>';
  } else if (r.status === 'completed' && r.firstModifiableUntil && new Date(r.firstModifiableUntil) > new Date()) {
    var daysLeft = Math.ceil((new Date(r.firstModifiableUntil) - new Date()) / (1000 * 60 * 60 * 24));
    html += '<div class="audit-bottom-bar">';
    html += '<span class="opinion-hint" style="color:var(--warning);">&#9888; 该申报已终审通过，' + daysLeft + '天内可修改审核结果。</span>';
    html += '<button type="button" class="btn-reject" onclick="showRejectAfterApproveModal()">修改审核结果变驳回</button>';
    html += '</div>';
  } else if (auditInfo.readonly) {
    html += '<div style="text-align:center;padding:16px;background:#EFF6FF;border-radius:8px;color:var(--primary);font-size:13px;margin-top:20px;">';
    html += '&#128274; 市管理员对该申报仅有查看权限，不可审核。';
    html += '</div>';
  } else if (r.status === 'first_approved' || r.status === 'pending_second') {
    html += '<div style="text-align:center;padding:16px;background:#FEF3C7;border-radius:8px;color:#92400E;font-size:13px;margin-top:20px;">';
    html += '该申报已通过一审，等待市级终审。';
    html += '</div>';
  }

  document.getElementById('mainContent').innerHTML = html;
}

// ===== AUDIT ACTIONS =====
function showApproveModal() {
  if (!currentRecord || !auditInfo.can) return;

  var titleText = auditInfo.isFinal ? '终审通过确认' : '初审通过确认';
  var hintText = auditInfo.isFinal
    ? '确认通过「' + currentRecord.schoolName + '」的招聘申报？审核通过后该申报标记为完成。'
    : '确认通过「' + currentRecord.schoolName + '」的招聘申报？初审通过后将提交至市级进行终审。';

  var modalHtml =
    '<div class="modal-overlay" id="approveModal">' +
      '<div class="modal-container">' +
        '<h3>' + titleText + '</h3>' +
        '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">' + hintText + '</div>' +
        
        '<div class="form-group">' +
          '<label>审核意见（选填）</label>' +
          '<textarea id="approveOpinion" rows="3" placeholder="可选填审核意见"></textarea>' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelApprove">取消</button>' +
          '<button class="btn-confirm" id="confirmApprove">确认通过</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('cancelApprove').onclick = function() { document.getElementById('approveModal').remove(); };
  document.getElementById('confirmApprove').onclick = doApprove;
}

function doApprove() {
  var approveEl = document.getElementById('approveModal');
  if (approveEl) approveEl.remove();
  if (!currentRecord || !auditInfo.can) return;

  var records = loadRecords();
  var idx = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx === -1) { showToast('记录不存在', 'warning'); return; }

  var approverName = ROLES[currentRole].name;
  var time = now();

  var opinionEl = document.getElementById('approveOpinion');
  var opinionText = opinionEl ? opinionEl.value.trim() : '';

  if (auditInfo.isFinal) {
    // Final approve → completed
    records[idx].status = 'completed';
    records[idx].firstReviewResult = 'approved';
  } else {
    // Non-final approve → pending_second
    records[idx].status = 'pending_second';
    records[idx].firstReviewResult = 'approved';
  }
  records[idx].firstReviewer = approverName;
  records[idx].firstReviewTime = time;
  records[idx].firstReviewOpinion = opinionText;
  records[idx].firstRejectReason = '';

  // Set 30-day modification window
  var modUntil = new Date();
  modUntil.setDate(modUntil.getDate() + 30);
  records[idx].firstModifiableUntil = modUntil.toISOString();

  records[idx].timeline = records[idx].timeline || [];
  var tlEntry = { time: time, action: auditInfo.isFinal ? '主管审核通过（终审）' : '主管一审通过', operator: approverName };
  if (opinionText) tlEntry.opinion = opinionText;
  records[idx].timeline.push(tlEntry);

  saveRecords(records);
  showToast(auditInfo.isFinal ? '终审通过，申报完成' : '一审通过，已提交至市级终审', 'success');
  setTimeout(function() { goBack(); }, 1000);
}

function showRejectModal() {
  if (!currentRecord || !auditInfo.can) return;

  var modalHtml =
    '<div class="modal-overlay" id="rejectModal">' +
      '<div class="modal-container">' +
        '<h3>驳回申请</h3>' +
        '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">' +
          '驳回后学校将收到通知，可根据驳回原因修改后重新提交。' +
        '</div>' +
        '<div class="form-group">' +
          '<label>驳回原因 <span style="color:var(--danger)">*</span></label>' +
          '<textarea id="rejectReason" rows="4" placeholder="请详细说明驳回原因，以便学校修改"></textarea>' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelReject">取消</button>' +
          '<button class="btn-confirm danger" id="confirmReject">确认驳回</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('cancelReject').onclick = function() { document.getElementById('rejectModal').remove(); };
  document.getElementById('confirmReject').onclick = doReject;
}

function doReject() {
  var reason = document.getElementById('rejectReason').value.trim();
  if (!reason) { showToast('请填写驳回原因', 'warning'); return; }
  document.getElementById('rejectModal').remove();

  if (!currentRecord) return;

  var records = loadRecords();
  var idx = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx === -1) { showToast('记录不存在', 'warning'); return; }

  var approverName = ROLES[currentRole].name;
  var time = now();

  records[idx].status = 'first_rejected';
  records[idx].firstReviewer = approverName;
  records[idx].firstReviewTime = time;
  records[idx].firstRejectReason = reason;
  records[idx].firstReviewResult = 'rejected';

  records[idx].timeline = records[idx].timeline || [];
  records[idx].timeline.push({
    time: time,
    action: '主管审核驳回',
    operator: approverName,
    opinion: reason
  });

  saveRecords(records);
  showToast('已驳回', 'success');
  setTimeout(function() { goBack(); }, 1000);
}

// ===== MODIFY AFTER APPROVE (30-day window) =====
function showRejectAfterApproveModal() {
  if (!currentRecord) return;
  var modalHtml =
    '<div class="modal-overlay" id="modifyModal">' +
      '<div class="modal-container">' +
        '<h3>修改审核结果</h3>' +
        '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">' +
          '您之前已审核通过该申报，现在可将其修改为<strong>驳回</strong>状态。修改后学校将收到通知，可根据驳回原因修改后重新提交。' +
        '</div>' +
        '<div class="form-group">' +
          '<label>驳回原因 <span style="color:var(--danger)">*</span></label>' +
          '<textarea id="modifyReason" rows="4" placeholder="请说明驳回原因"></textarea>' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelModify">取消</button>' +
          '<button class="btn-confirm danger" id="confirmModify">确认修改为驳回</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('cancelModify').onclick = function() { document.getElementById('modifyModal').remove(); };
  document.getElementById('confirmModify').onclick = doRejectAfterApprove;
}
function doRejectAfterApprove() {
  var reason = document.getElementById('modifyReason').value.trim();
  if (!reason) { showToast('请填写驳回原因', 'warning'); return; }
  document.getElementById('modifyModal').remove();
  if (!currentRecord) return;
  var records = loadRecords();
  var idx = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx === -1) { showToast('记录不存在', 'warning'); return; }
  var approverName = ROLES[currentRole].name;
  var time = now();
  records[idx].status = 'first_rejected';
  records[idx].firstReviewResult = 'rejected';
  records[idx].firstRejectReason = reason;
  records[idx].firstReviewTime = time;
  records[idx].firstModifiableUntil = null;
  records[idx].timeline = records[idx].timeline || [];
  records[idx].timeline.push({
    time: time,
    action: '主管审核修改为驳回',
    operator: approverName,
    opinion: reason
  });
  records[idx].modifications = records[idx].modifications || [];
  records[idx].modifications.push({
    time: time,
    operator: approverName,
    description: '将审核结果由"已通过"修改为"驳回"，原因：' + reason
  });
  saveRecords(records);
  showToast('已修改为驳回', 'success');
  setTimeout(function() { goBack(); }, 1000);
}

// ===== NAVIGATION =====
function goBack() {
  window.location.href = 'recruit-list-admin.html?role=' + currentRole;
}

// ===== SIDEBAR =====
function renderSidebar() {
  var roleData = ROLES[currentRole];
  if (!roleData) { document.getElementById('sidebarMenu').innerHTML = ''; return; }
  var sidebar = roleData.sidebar;
  var html = '';
  (sidebar.top || []).forEach(function(item) {
    html += '<a class="menu-item" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[item.icon] || '') + '<span class="menu-label">' + item.label + '</span></a>';
  });
  (sidebar.groups || []).forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      html += '<a class="menu-item' + (item.id === 'recruit' ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[MENU_ICONS[item.id] || 'file']) + '<span class="menu-label">' + item.label + '</span>' + (item.badge ? '<span class="menu-badge">' + item.badge + '</span>' : '') + '</a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'recruit') { window.location.href = 'recruit-list-admin.html?role=' + currentRole; return; }
  if (id === 'employ') { var url = getEmployUrl(); if (url) window.location.href = url; else showToast('跳转至：聘用手续办理'); return; }

  if (id === 'postset') { window.location.href = 'post-list-admin.html?role=' + currentRole; return; }
  if (id === 'promote') { window.location.href = 'promote-list-admin.html?role=' + currentRole; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') { window.location.href = '教师入编管理（学校管理员视角）.html'; return; }
  if (id === 'exit') { window.location.href = '教师出编管理（学校管理员视角）.html'; return; }
  showToast('跳转至：' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}

function switchRole(role) {
  if (role === 'school') { window.location.href = 'recruit-list-school.html'; return; }
  if (role === 'teacher') { showToast('教师角色无法访问招聘模块', 'warning'); return; }
  if (role === 'city' || role === 'district') {
    window.location.href = 'recruit-list-admin.html?role=' + role;
    return;
  }
}

function updateRoleUI() {
  var roleData = ROLES[currentRole];
  if (!roleData) return;
  document.getElementById('userAvatar').textContent = roleData.short;
  document.getElementById('userName').textContent = roleData.name;
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === currentRole);
  });
  var bcl = document.getElementById('bcList');
  if (bcl) bcl.href = 'recruit-list-admin.html?role=' + currentRole;
}

// ===== INIT =====
(function init() {
  var params = new URLSearchParams(window.location.search);
  var urlRole = params.get('role');
  if (urlRole === 'city' || urlRole === 'district') {
    currentRole = urlRole;
  }

  updateRoleUI();
  renderSidebar();

  var recordId = params.get('id');
  if (recordId) {
    currentRecord = findRecord(recordId);
    if (currentRecord) {
      var a = canAudit(currentRecord);
      if (!a.can && !a.readonly) {
        // Redirect to second audit page if it's a pending_second record for city
        if (currentRecord.status === 'pending_second' && currentRole === 'city') {
          window.location.href = 'recruit-audit-second.html?id=' + currentRecord.id + '&role=' + currentRole;
          return;
        }
      }
    }
  } else {
    // Fallback: find first pending record appropriate for this role
    var records = loadRecords();
    currentRecord = records.find(function(r) {
      if (currentRole === 'city') return r.status === 'pending_first' || (r.status === 'pending_first' && r.schoolCategory === '市直属');
      if (currentRole === 'district') return r.status === 'pending_first' && r.schoolCategory === '鱼峰区属';
      return false;
    }) || null;
  }

  if (currentRecord) {
    auditInfo = canAudit(currentRecord);
  }

  renderPage();
})();
</script>
