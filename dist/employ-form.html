<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聘用手续申报 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; transition: var(--transition); font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }
.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; display: flex; flex-direction: column; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label, .sidebar.collapsed .menu-group, .sidebar.collapsed .menu-badge, .sidebar.collapsed .role-switcher-label, .sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7); transition: var(--transition); position: relative; text-decoration: none; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }
.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px; min-height: calc(100vh - 56px); transition: margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }
.page-header { margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-outline { padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 6px; background: #fff; color: var(--text-secondary); border: 1px solid var(--border); cursor: pointer; font-family: inherit; }
.btn-outline:hover { background: var(--gray-bg); }
.btn-danger { background: var(--danger); color: #fff; border: none; }
.btn-danger:hover { background: #DC2626; }
.form-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 24px; margin-bottom: 20px; }
.form-card h2, .form-card-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.form-card h2 .card-icon { width: 28px; height: 28px; background: var(--primary-light); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
.form-group label .req { color: var(--danger); }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
.form-group textarea { resize: vertical; min-height: 50px; }
.form-group input[type=radio] { width: auto; margin-right: 4px; }
.form-row { display: flex; gap: 16px; }
.form-row .form-group { flex: 1; }
.form-row-3 { display: flex; gap: 12px; }
.form-row-3 .form-group { flex: 1; }
fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
legend { font-size: 13px; font-weight: 600; color: var(--primary); padding: 0 8px; }
.checkbox-group { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.checkbox-group label { font-size: 12px; font-weight: 400; display: flex; align-items: center; gap: 4px; cursor: pointer; }
/* Step bar */
.step-bar { display: flex; align-items: center; padding: 16px 24px; background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 20px; }
.step-wrapper { display: flex; align-items: center; flex: 1; min-width: 0; }
.step { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; min-width: 70px; }
.step-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; border: 2px solid var(--border); color: var(--text-light); background: #fff; transition: var(--transition); }
.step.done .step-dot { background: var(--success); color: #fff; border-color: var(--success); }
.step.current .step-dot { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30,64,175,0.12); }
.step-text { font-size: 11px; color: var(--text-light); white-space: nowrap; }
.step.current .step-text { color: var(--primary); font-weight: 500; }
.step.done .step-text { color: var(--success); }
.step-line { flex: 1; height: 2px; background: var(--border); margin: 0 4px 20px; min-width: 20px; }
.step-line.done { background: var(--success); }
/* Type card */
.type-card { display: flex; gap: 16px; margin-bottom: 16px; }
.type-option { flex: 1; border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 20px; cursor: pointer; text-align: center; transition: var(--transition); background: #fff; }
.type-option:hover { border-color: var(--accent); background: var(--primary-light); }
.type-option.selected { border-color: var(--primary); background: var(--primary-light); }
.type-option .type-icon { font-size: 32px; margin-bottom: 8px; }
.type-option .type-name { font-size: 15px; font-weight: 600; color: var(--text); }
.type-option .type-desc { font-size: 11px; color: var(--text-light); margin-top: 4px; }
/* Batch info box */
.batch-info-box { display: none; padding: 12px 16px; background: var(--primary-light); border-radius: var(--radius); margin-top: 8px; font-size: 12px; color: var(--primary); line-height: 1.8; }
.batch-info-box.show { display: block; }
/* Form section divider */
.form-section { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.form-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.form-section .section-title { font-size: 13px; font-weight: 600; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
/* Dynamic table */
.dyn-table-wrap { overflow-x: auto; margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--radius); }
.dyn-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
.dyn-table th { padding: 8px 6px; text-align: center; font-weight: 600; font-size: 11px; color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border); white-space: nowrap; }
.dyn-table td { padding: 6px; border-bottom: 1px solid var(--border); text-align: center; vertical-align: middle; }
.dyn-table tr:last-child td { border-bottom: none; }
.dyn-table td input, .dyn-table td select { width: 100%; padding: 4px 6px; font-size: 12px; border: 1px solid transparent; border-radius: 3px; font-family: inherit; background: transparent; box-sizing: border-box; min-width: 0; text-align: center; }
.dyn-table td input:focus, .dyn-table td select:focus { border-color: var(--accent); background: #fff; outline: none; }
.dyn-table .row-del { color: var(--danger); cursor: pointer; text-align: center; font-size: 16px; font-weight: 600; }
.add-row-btn { padding: 6px 16px; font-size: 12px; color: var(--primary); cursor: pointer; border: 1px dashed var(--border); border-radius: 4px; background: transparent; font-family: inherit; margin-top: 8px; }
.add-row-btn:hover { background: var(--primary-light); }

/* Info grid */
.info-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 10px; }
.info-item { background: #F8FAFC; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); }
.info-item .info-label { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
.info-item .info-value { font-size: 13px; font-weight: 500; color: var(--text); }
.info-item .info-value.highlight { color: var(--primary); font-weight: 600; }
.info-item .info-value input { width: 56px; padding: 2px 6px; font-size: 13px; font-weight: 500; color: var(--primary); border: 1px solid var(--border); border-radius: 4px; font-family: inherit; text-align: center; }
.info-item .info-value input:focus { border-color: var(--accent); outline: none; }
@media (max-width: 768px) { .info-grid { grid-template-columns: repeat(2, 1fr); } }

/* Roster card */
.roster-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
.roster-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.roster-card-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #F8FAFC; border-bottom: 1px solid var(--border); }
.roster-card-seq { font-size: 12px; font-weight: 700; color: var(--primary); min-width: 48px; white-space: nowrap; }
.roster-card-name { flex: 1; display: flex; align-items: center; gap: 4px; }
.roster-card-name label { font-size: 11px; color: var(--text-light); white-space: nowrap; }
.roster-card-name input { flex: 1; padding: 5px 8px; font-size: 13px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; }
.roster-card-name input:focus { border-color: var(--accent); outline: none; }
.roster-card-gender { display: flex; align-items: center; gap: 4px; }
.roster-card-gender label { font-size: 11px; color: var(--text-light); }
.roster-card-gender select { padding: 5px 8px; font-size: 13px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; min-width: 72px; }
.roster-card-del { width: 24px; height: 24px; border: none; background: none; color: var(--danger); font-size: 18px; cursor: pointer; border-radius: 4px; line-height: 1; }
.roster-card-del:hover { background: #FEE2E2; }
.roster-card-body { display: flex; flex-direction: column; padding: 0; }
.roster-card-footer { display: flex; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--border); background: #FAFBFC; }
.roster-card-link { font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: none; }
.roster-card-link:hover { text-decoration: underline; }
.roster-card-link.done { color: var(--success); }
.auto-fill-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; background: #DBEAFE; color: #1E40AF; margin-left: 4px; }
/* Roster sections */
.roster-section { margin: 0; padding: 12px 14px; border-bottom: 1px solid #F1F5F9; }
.roster-section:last-of-type { border-bottom: none; }
.roster-section-title { font-size: 10px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.roster-section-title::after { content: ''; flex: 1; height: 1px; background: #F1F5F9; }
.roster-section-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 14px; }
.roster-field { display: flex; align-items: center; gap: 6px; }
.roster-field label { font-size: 11px; color: var(--text-light); white-space: nowrap; min-width: 64px; }
.roster-field input, .roster-field select { flex: 1; padding: 6px 8px; font-size: 12px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; min-width: 0; }
.roster-field input:focus, .roster-field select:focus { border-color: var(--accent); outline: none; }
.roster-field-locked { flex: 1; padding: 6px 8px; font-size: 12px; border: 1px solid #DBEAFE; border-radius: 4px; background: #EFF6FF; color: var(--primary); font-family: inherit; min-width: 0; display: flex; align-items: center; gap: 4px; }
.roster-field-locked .lock-icon { font-size: 10px; opacity: 0.6; }
.roster-field-textarea { grid-column: 1 / -1; }
.roster-field-textarea textarea { width: 100%; padding: 6px 8px; font-size: 12px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; resize: vertical; min-height: 36px; box-sizing: border-box; }
.roster-field-textarea textarea:focus { border-color: var(--accent); outline: none; }
.roster-field-wide { grid-column: span 2; }
/* File upload */
.upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px; text-align: center; cursor: pointer; margin-bottom: 12px; transition: var(--transition); }
.upload-area:hover { border-color: var(--accent); background: var(--primary-light); }
.upload-area .upload-icon { font-size: 28px; margin-bottom: 8px; }
.upload-area .upload-text { font-size: 13px; color: var(--text-secondary); }
.upload-area .upload-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.file-list { margin-bottom: 12px; }
.file-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 6px; font-size: 12px; background: #fff; }
.file-item .file-name { color: var(--text); flex: 1; }
.file-item .file-size { color: var(--text-light); margin: 0 16px; }
.file-item .file-remove { color: var(--danger); cursor: pointer; font-size: 11px; }
/* Submit bar */
.submit-bar { display: flex; justify-content: flex-end; gap: 12px; padding-top: 8px; }
.submit-bar .summary { flex: 1; font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 16px; }
/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease; box-shadow: var(--shadow-lg); }
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
/* Access denied */
.access-denied { text-align: center; padding: 80px 20px; }
.access-denied .denied-icon { font-size: 64px; margin-bottom: 20px; color: var(--text-light); }
.access-denied h2 { font-size: 20px; margin-bottom: 8px; color: var(--text-secondary); }
.access-denied p { font-size: 14px; color: var(--text-light); margin-bottom: 24px; }
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal-container{background:#fff;border-radius:var(--radius-lg);padding:28px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-container h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.modal-container .modal-subtitle{font-size:12px;color:var(--text-light);margin-bottom:16px;}
.modal-buttons{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.btn-cancel{padding:8px 20px;font-size:13px;font-weight:500;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);cursor:pointer;font-family:inherit;}
.btn-cancel:hover{background:var(--gray-bg);}
.btn-confirm{padding:8px 20px;font-size:13px;font-weight:500;border-radius:6px;border:none;color:#fff;cursor:pointer;background:var(--success);font-family:inherit;}
.btn-confirm:hover{background:#059669;}
.input-readonly{background:var(--gray-bg) !important;border-color:transparent !important;color:var(--text);}



.modal-row{display:flex;gap:12px;}
.modal-row .mg{flex:1;min-width:0;}
.modal-container input[type="text"],.modal-container input[type="number"],.modal-container select,.modal-container textarea{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;font-family:inherit;background:#fff;box-sizing:border-box;transition:var(--transition);}
.modal-container input:focus,.modal-container select:focus,.modal-container textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,0.1);}
.modal-container .mg{margin-bottom:10px;}
.modal-container .mg span{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:4px;}
.modal-container .input-readonly{background:var(--gray-bg) !important;color:var(--text) !important;border-color:transparent !important;cursor:default;}
.modal-container .modal-section{padding:16px;margin-bottom:12px;border:1px solid var(--border);border-radius:var(--radius);background:#FAFBFC;}

function addPosition() {
  formData.positions.push({ batchId:'', batchName:'', positionIndex:-1, positionName:'', planCount:0, completedCount:0, pendingCount:0, confirmed:false, positionCategory:'', positionLevel:'', employmentMethod:'', rosterRows:[{seq:1,name:'',gender:'',birth:'',maritalStatus:'',education:'',degree:'',gradTime:'',school:'',major:'',score:'',rank:'',title:'',positionCategory:'',positionLevel:'',method:'career',source:'',sourceDetail:'',originalUnit:'',spouseName:'',spouseUnit:'',meetingTime:'',remark:''}], recordCards:[], personAttachments:{}, cancelCount:0, cancelDocNo:'', cancelReason:'', deferredPersons:[] });
  renderPage();
  var pi = formData.positions.length - 1;
  initPosNameDropdown(pi);
}

function removePosition(pi) {
  if (formData.positions.length <= 1) return;
  formData.positions.splice(pi, 1);
  cleanupEmptyBatchSummaries();
  renderPage();
}

function onPositionBatchChange(pi, batchId) {
  var pos = formData.positions[pi]; if (!pos) return;
  var oldBatchId = pos.batchId;
  if (!batchId) {
    pos.batchId = ''; pos.batchName = ''; pos.positionName = '';
    pos.planCount = 0; pos.completedCount = 0; pos.pendingCount = 0; pos.confirmed = false;
    cleanupEmptyBatchSummaries(); renderPage(); return;
  }
  var batches = getCompletedRecruitBatches();
  var batch = batches.find(function(b) { return b.id === batchId; });
  pos.batchId = batchId; pos.batchName = batch ? batch.name : '';
  pos.positionName = ''; pos.planCount = 0; pos.completedCount = 0; pos.pendingCount = 0; pos.confirmed = false;
  if (oldBatchId !== batchId) cleanupEmptyBatchSummaries();
  renderPage();
  initPosNameDropdown(pi);
}

function initPosNameDropdown(pi) {
  var pos = formData.positions[pi];
  if (!pos || !pos.batchId) return;
  try {
    var recruitRecs = JSON.parse(localStorage.getItem('recruit_records') || '[]');
    var batchRecs = recruitRecs.filter(function(r) { return r.batchId === pos.batchId && r.status === 'completed'; });
    var sel = document.querySelector('#posCard_' + pi + ' select[onchange*="onPositionNameChange(' + pi + ',this.value)"]');
    if (!sel) return;
    sel.innerHTML = '<option value="">— 请选择岗位 —</option>';
    var seen = {};
    batchRecs.forEach(function(rec) {
      if (!rec.formData || !rec.formData.positions) return;
      rec.formData.positions.forEach(function(p) { if (p.positionName && !seen[p.positionName]) seen[p.positionName] = p.count||0; });
    });
    Object.keys(seen).forEach(function(n) { sel.innerHTML += '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + '（计划' + (seen[n]||0) + '人）</option>'; });
  } catch(e) {}
}

function onPositionNameChange(pi, posName) {
  var pos = formData.positions[pi]; if (!pos) return;
  pos.positionName = posName;
  pos.confirmed = false;
  // Reset position-level fields
  pos.positionCategory = ''; pos.positionLevel = ''; pos.employmentMethod = '';
  if (posName && pos.batchId) {
    try {
      var recruitRecs = JSON.parse(localStorage.getItem('recruit_records') || '[]');
      var batchRecs = recruitRecs.filter(function(r) { return r.batchId === pos.batchId && r.status === 'completed'; });
      var planC = 0;
      var matchedRp = null;
      batchRecs.forEach(function(rec) {
        if (rec.formData && rec.formData.positions) rec.formData.positions.forEach(function(p) {
          if (p.positionName === posName) { planC += parseInt(p.count)||0; if (!matchedRp) matchedRp = p; }
        });
      });
      pos.planCount = planC;
      // Extract position-level fields from recruit record
      if (matchedRp) {
        if (matchedRp.positionCategory) pos.positionCategory = matchedRp.positionCategory;
        if (matchedRp.positionLevel) pos.positionLevel = matchedRp.positionLevel;
        if (matchedRp.employmentMethod) pos.employmentMethod = matchedRp.employmentMethod;
      }
      try {
        var employRecs = JSON.parse(localStorage.getItem('employ_records') || '[]');
        // 已完成招聘 = 同批次+同岗位+status==='completed' 的人员总数
        pos.completedCount = employRecs
          .filter(function(r) { return r.status === 'completed'; })
          .reduce(function(total, r) {
            if (!r.formData || !r.formData.positions) return total;
            return total + r.formData.positions.reduce(function(s, p) {
              if (p.batchId === pos.batchId && p.positionName === posName) {
                return s + (p.rosterRows || []).length;
              }
              return s;
            }, 0);
          }, 0);
        // 待审核 = 同批次+同岗位+非终审通过状态的人员总数（驳回的材料修改后继续录用，名额不释放）
        var PENDING_STATUSES = ['pending_first','pending_second','first_approved','first_rejected','second_rejected'];
        pos.pendingCount = employRecs
          .filter(function(r) { return PENDING_STATUSES.indexOf(r.status) >= 0; })
          .reduce(function(total, r) {
            if (!r.formData || !r.formData.positions) return total;
            return total + r.formData.positions.reduce(function(s, p) {
              if (p.batchId === pos.batchId && p.positionName === posName) {
                return s + (p.rosterRows || []).length;
              }
              return s;
            }, 0);
          }, 0);
      } catch(e) {}
    } catch(e) {}
  }
  // Sync position-level fields to all roster rows
  if (pos.rosterRows) {
    pos.rosterRows.forEach(function(row) {
      if (pos.positionCategory) row.positionCategory = pos.positionCategory;
      if (pos.positionLevel) row.positionLevel = pos.positionLevel;
      if (pos.employmentMethod) row.method = pos.employmentMethod;
    });
  }
  renderPage();
}

function addRosterRow(pi) {
  var pos = formData.positions[pi]; if (!pos) return;
  // 名额校验：当前人数+1 不能超过 计划-已完成-待审核
  if (pos.planCount > 0) {
    var occupied = (pos.completedCount || 0) + (pos.pendingCount || 0);
    var current = (pos.rosterRows || []).length;
    var remaining = pos.planCount - occupied;
    if (current >= remaining) {
      showToast(
        '拟聘岗位「' + (pos.positionName || '岗位' + (pi+1)) + '」名额已满' +
        '（计划' + pos.planCount + '人，已完成' + (pos.completedCount||0) + '人，待审核' + (pos.pendingCount||0) + '人，剩余' + remaining + '人），无法继续添加',
        'warning'
      );
      return;

function saveRecordCard(pi, idx) {
  var modal = document.querySelector('.modal-overlay');
  if (!modal) return;
  var card = {};
  modal.querySelectorAll('[data-card]').forEach(function(el) {
    var field = el.dataset.cfield;
    if (field) card[field] = el.value;
  });
  var pos = formData.positions[pi];
  if (!pos) return;
  if (!pos.recordCards) pos.recordCards = [];
  pos.recordCards[idx] = pos.recordCards[idx] || {};
  Object.keys(card).forEach(function(k) { pos.recordCards[idx][k] = card[k]; });
  modal.remove();
  renderPage();
  showToast('备案表已保存', 'success');
}

function handlePersonFileUpload(pi, idx) {
  var input = document.getElementById('pfInput_' + idx);
  if (!input || !input.files) return;
  for (var i = 0; i < input.files.length; i++) {
    var f = input.files[i];
    var ext = f.name.split('.').pop().toLowerCase();
    if (['pdf','doc','docx','jpg','jpeg','png','xls','xlsx'].indexOf(ext) === -1) { showToast('不支持的文件格式：' + f.name, 'warning'); continue; }
    if (f.size > 10*1024*1024) { showToast('文件超过10MB限制：' + f.name, 'warning'); continue; }
    if (!formData.positions[pi].personAttachments) formData.positions[pi].personAttachments = {};
    if (!formData.positions[pi].personAttachments[idx]) formData.positions[pi].personAttachments[idx] = [];
    formData.positions[pi].personAttachments[idx].push({ name: f.name, size: f.size });
  }
  input.value = '';
  document.getElementById('personFileModal').remove();
  openPersonFileModal(idx);
}

function previewPersonFile(pi, rowIdx, fileIdx) {
  var pos = formData.positions[pi]; if (!pos) return; var files = (pos.personAttachments||{})[rowIdx] || [];
  var f = files[fileIdx];
  if (!f) return;
  var h = '<div class="modal-overlay" onclick="if(event.target===this)this.remove()"><div class="modal-container" style="width:500px;">';
  h += '<h3>文件预览</h3>';
  h += '<div style="padding:30px;text-align:center;background:#F8FAFC;border-radius:8px;border:1px dashed var(--border);margin-bottom:12px;">';
  h += '<div style="font-size:48px;margin-bottom:12px;">📄</div>';
  h += '<div style="font-size:14px;font-weight:500;">' + escapeHtml(f.name) + '</div>';
  h += '<div style="font-size:12px;color:var(--text-light);margin-top:4px;">' + formatSize(f.size) + '</div>';
  h += '<div style="font-size:12px;color:var(--text-light);margin-top:8px;">该文件为模拟演示数据，实际系统将在此处展示文件内容</div>';
  h += '</div>';
  h += '<div class="modal-buttons"><button class="btn-cancel" onclick="this.closest(\'.modal-overlay\').remove()">关闭</button><button class="btn-confirm" onclick="this.closest(\'.modal-overlay\').remove();downloadPersonFile(' + rowIdx + ',' + fileIdx + ')">下载文件</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function downloadPersonFile(pi, rowIdx, fileIdx) {
  var pos = formData.positions[pi]; if (!pos) return; var files = (pos.personAttachments||{})[rowIdx] || [];
  var f = files[fileIdx];
  if (!f) return;
  showToast('下载：' + f.name + '（模拟）');
}

function removePersonFile(pi, rowIdx, fileIdx) {
  var pos = formData.positions[pi]; if (!pos || !pos.personAttachments || !pos.personAttachments[rowIdx]) return;
  pos.personAttachments[rowIdx].splice(fileIdx, 1);
  if (pos.personAttachments[rowIdx].length === 0) delete pos.personAttachments[rowIdx];
  document.getElementById('personFileModal').remove();
  openPersonFileModal(rowIdx);
}

// ===== ATTACHMENTS =====
function renderAttachmentSection() {
  var h = '<div class="form-card">';
  h += '<h2><span class="card-icon">&#128206;</span>上传附件</h2>';
  h += '<div class="upload-area" onclick="document.getElementById(\'fileInput\').click()">';
  h += '<div class="upload-icon">&#128194;</div><div class="upload-text">点击上传或拖拽文件到此处</div>';
  h += '<div class="upload-hint">支持 PDF、Word、Excel、JPG、PNG，单文件不超过10MB</div></div>';
  h += '<input type="file" id="fileInput" multiple onchange="handleFileUpload(this)" style="display:none">';
  h += '<div class="file-list" id="fileList">';
  attachedFiles.forEach(function(f, i) {
    h += '<div class="file-item"><span class="file-name">&#128196; '+escapeHtml(f.name)+'</span><span class="file-size">'+formatSize(f.size)+'</span><span class="file-remove" onclick="removeFile('+i+')">删除</span></div>';
  });
  h += '</div></div>';
  return h;
}

// ===== TABLE EVENTS =====
function bindRosterTableEvents() {
  document.querySelectorAll('#mainContent input[data-pos], #mainContent select[data-pos], #mainContent textarea[data-pos]').forEach(function(el) {
    if (el._bound) return; el._bound = true;
    el.onchange = function() {
      var pi = parseInt(this.dataset.pos);
      var idx = parseInt(this.dataset.idx);
      var field = this.dataset.field;
      if (isNaN(pi) || isNaN(idx) || !field || !formData.positions[pi]) return;
      if (!formData.positions[pi].rosterRows[idx]) return;
      formData.positions[pi].rosterRows[idx][field] = this.value;
    };
  });
}
function bindTransferTableEvents() {
  document.querySelectorAll('#transferBody input, #transferBody select').forEach(function(el) {
    el.onchange = function() {
      var idx = parseInt(this.dataset.tidx);
      var field = this.dataset.tfield;
      if (isNaN(idx) || !field) return;
      if (!formData.transferRows[idx]) return;
      formData.transferRows[idx][field] = this.value;
      // 联动更新登记表
      syncTransferForm();
    };
  });
}

function syncTransferForm() {
  // 取第一条备案表行联动到登记表
  if (formData.transferRows.length > 0) {
    var row = formData.transferRows[0];
    formData.transferForm.outflowUnit = row.outflow || formData.transferForm.outflowUnit;
    formData.transferForm.inflowUnit = row.inflow || currentSchool;
    // 不自动覆盖姓名等字段，留给用户确认
  }
}
// updateSF removed — 核减/暂缓已下沉到岗位级，见 onCancelCountChange / addDeferredPerson / removeDeferredPerson

function handleFileUpload(input) {
  var files = input.files;
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    var ext = f.name.split('.').pop().toLowerCase();
    if (['pdf','doc','docx','jpg','jpeg','png','xls','xlsx'].indexOf(ext) === -1) { showToast('不支持的文件格式：'+f.name, 'warning'); continue; }

// ===== SUBMIT =====
function submitForm() {
  if (!businessType) { showToast('请选择业务类型', 'warning'); return; }
  // 招聘类校验
  if (businessType === 'recruitment') {
    var valid = true;
    if (formData.positions.length === 0) { showToast('请至少添加一个拟聘岗位', 'warning'); return; }
    formData.positions.forEach(function(pos, pi) {
      if (!pos.batchId) { showToast('拟聘岗位'+(pi+1)+'：请选择关联招聘批次', 'warning'); valid = false; return; }
      if (!pos.positionName) { showToast('拟聘岗位'+(pi+1)+'：请选择招聘岗位名称', 'warning'); valid = false; return; }
      (pos.rosterRows||[]).forEach(function(row, ri) {
        if (!row.name) { showToast('拟聘岗位'+(pi+1)+'花名册第'+(ri+1)+'行：请填写姓名', 'warning'); valid = false; }
        if (row.name && (!pos.recordCards || !pos.recordCards[ri] || !pos.recordCards[ri].idNumber)) {
          showToast('拟聘岗位'+(pi+1)+'：请为「' + row.name + '」填写聘用备案表', 'warning');
          valid = false;
        }
      });
    });
    if (!valid) return;
    // 校验本次办理聘用人数与实际填写人数一致
    formData.positions.forEach(function(pos, pi) {
      if (!pos.confirmed) return;
      var expected = pos.hireCount || (pos.rosterRows||[]).length;
      var actual = (pos.rosterRows||[]).length;
      if (expected !== actual) {
        showToast('拟聘岗位'+(pi+1)+'「'+escapeHtml(pos.positionName||'')+'」：本次办理聘用人数（'+expected+'）与实际填写人数（'+actual+'）不一致，请调整', 'warning');
        valid = false;
      }
    });
    if (!valid) return;
    // 校验名额上限（计入核减）
    formData.positions.forEach(function(pos, pi) {
      if (!pos.confirmed || !pos.planCount) return;
      var occupied = (pos.completedCount || 0) + (pos.pendingCount || 0);
      var current = (pos.rosterRows||[]).length;
      var actualPlan2 = (pos.planCount||0) - (pos.cancelCount||0);
      if (current > actualPlan2 - occupied) {
        showToast('拟聘岗位'+(pi+1)+'「'+escapeHtml(pos.positionName||'')+'」：拟聘人数（'+current+'）超出剩余名额（原计划'+pos.planCount+'人，核减'+(pos.cancelCount||0)+'人，实际计划'+actualPlan2+'人，已完成'+(pos.completedCount||0)+'人，待审核'+(pos.pendingCount||0)+'人，剩余'+(actualPlan2-occupied)+'人），请调整', 'warning');
        valid = false;
      }
    });
    if (!valid) return;

    // 校验核减与暂缓
    formData.positions.forEach(function(pos, pi) {
      if (!pos.confirmed) return;
      var cancelC = pos.cancelCount || 0;
      if (cancelC > 0) {
        if (!pos.cancelDocNo) { showToast('拟聘岗位'+(pi+1)+'「'+escapeHtml(pos.positionName||'')+'」：核减人数>0，请填写核减依据（文号/文件名）', 'warning'); valid = false; }
        if (!pos.cancelReason) { showToast('拟聘岗位'+(pi+1)+'「'+escapeHtml(pos.positionName||'')+'」：核减人数>0，请填写核减原因', 'warning'); valid = false; }
        if (cancelC > (pos.planCount||0)) { showToast('拟聘岗位'+(pi+1)+'「'+escapeHtml(pos.positionName||'')+'」：核减数（'+cancelC+'）不能超过原计划数（'+pos.planCount+'）', 'warning'); valid = false; }
      }
      var actualPlan3 = (pos.planCount||0) - cancelC;
      var rosterCount = (pos.rosterRows||[]).length;
      var defCount = (pos.deferredPersons||[]).length;
      if (actualPlan3 < (pos.completedCount||0) + rosterCount + defCount) {
        showToast('拟聘岗位'+(pi+1)+'「'+escapeHtml(pos.positionName||'')+'」：实际计划（'+actualPlan3+'）不足以覆盖已办理（'+(pos.completedCount||0)+'）+ 本次办理（'+rosterCount+'）+ 暂缓（'+defCount+'）', 'warning');
        valid = false;
      }
      (pos.deferredPersons||[]).forEach(function(dp, di) {
        if (!dp.reason) { showToast('拟聘岗位'+(pi+1)+'暂缓人员'+(di+1)+'：请填写暂缓原因', 'warning'); valid = false; }
      });
      var rosterNames = (pos.rosterRows||[]).map(function(r){return r.name;}).filter(Boolean);
      (pos.deferredPersons||[]).forEach(function(dp) {
        if (dp.name && rosterNames.indexOf(dp.name) >= 0) {
          showToast('拟聘岗位'+(pi+1)+'：「'+dp.name+'」同时在花名册和暂缓列表中，同一个人不能既办理又暂缓', 'warning');
          valid = false;
        }
      });
    });
    if (!valid) return;

    var hasAnyName = formData.positions.some(function(p) { return (p.rosterRows||[]).some(function(r) { return r.name; }); });
    if (!hasAnyName) { showToast('请至少填写一条花名册记录', 'warning'); return; }
  }
// 调动类校验
  if (businessType === 'transfer') {
    var valid = true;
    formData.transferRows.forEach(function(row, i) {
      if (!row.name && !row.outflow) { showToast('备案表第'+(i+1)+'行：请填写姓名和流出单位', 'warning'); valid = false; }
    });
    if (!valid) return;
    var hasData = formData.transferRows.some(function(r) { return r.name || r.outflow; });
    if (!hasData) { showToast('请至少填写一条交流备案记录', 'warning'); return; }
  }

  if (attachedFiles.length === 0) { showToast('请至少上传一个附件', 'warning'); return; }

  // 保存数据
  var sd = SCHOOL_DATA[currentSchool] || {};
  var ts = now();
  var record = {
    id: generateId(),
    businessType: businessType,
    recruitBatchId: formData.positions.length > 0 ? formData.positions[0].batchId : '',
    recruitBatchName: formData.positions.length > 0 ? formData.positions[0].batchName : '',
    schoolName: currentSchool,
    district: sd.district || '',
    status: 'pending_first',
    formData: JSON.parse(JSON.stringify(formData)),
    submitTime: ts,
    firstReviewResult: null, firstReviewOpinion: '', firstReviewer: null, firstReviewTime: null, firstRejectReason: '',
    secondReviewResult: null, secondReviewOpinion: '', secondReviewer: null, secondReviewTime: null, secondRejectReason: '',
    secondModification: null,
    modifications: [],
    attachments: attachedFiles.slice(),
    timeline: [{ time: ts, action: '学校提交申报', operator: ROLES[currentRole].name }]
  };

  var records = loadEmployRecords();
  if (pageMode === 'edit' && editRecordId) {
    var idx = records.findIndex(function(r) { return r.id === editRecordId; });
    if (idx >= 0) {
      record.id = editRecordId;
      // 清空一审审核字段（驳回后重提）
      record.firstReviewResult = null; record.firstReviewer = null; record.firstReviewTime = null;
      record.firstReviewOpinion = ''; record.firstRejectReason = '';
      record.timeline = (records[idx].timeline || []).concat([{ time: ts, action: '学校修改后重新提交', operator: ROLES[currentRole].name }]);
      records[idx] = record;
    }
  } else {
    records.push(record);
  }
  saveEmployRecords(records);
  showToast('保存成功', 'success');
  setTimeout(function() { window.location.href = 'employ-list-school.html'; }, 1000);
}

// ===== EDIT MODE =====
function loadForEdit(id) {
  var records = loadEmployRecords();
  var rec = records.find(function(r) { return r.id === id; });
  if (!rec) { showToast('未找到记录', 'warning'); return; }
  editRecordId = id;
  pageMode = 'edit';
  currentSchool = rec.schoolName;
  businessType = rec.businessType;

  if (rec.formData) {
    formData = JSON.parse(JSON.stringify(rec.formData));
    if (!formData.positions) { formData.positions = []; }
    // 兼容旧数据：已有批次+岗位的记录自动标记为已确认
    formData.positions.forEach(function(p) {
      if (p.batchId && p.positionName && p.confirmed === undefined) { p.confirmed = true; }
    });
    // 兼容旧数据：旧 summaryForm 迁移到 batchSummaries
    if (formData.summaryForm && !formData.batchSummaries) {
      formData.batchSummaries = {};
      var firstBatchId = null;
      formData.positions.forEach(function(p) { if (p.batchId && !firstBatchId) firstBatchId = p.batchId; });
      if (firstBatchId) {
        formData.batchSummaries[firstBatchId] = JSON.parse(JSON.stringify(formData.summaryForm));
        formData.batchSummaries[firstBatchId].batchName = formData.positions[0].batchName || '';
      }
      delete formData.summaryForm;
    }
    if (!formData.batchSummaries) { formData.batchSummaries = {}; }
  }
  attachedFiles = rec.attachments ? JSON.parse(JSON.stringify(rec.attachments)) : [];
  editRecordRef = rec;

  document.getElementById('pageTitle').textContent = '修改聘用申报';
  document.getElementById('pageSubtitle').textContent = '已驳回申报的重新提交，请修改后再次申报';
  renderPage();
}

// ===== INIT =====
function init() {
  var id = getUrlParam('id');
  var mode = getUrlParam('mode');
  var schoolParam = getUrlParam('school');
  if (schoolParam) { currentSchool = decodeURIComponent(schoolParam); }
  updateRoleUI();
  renderSidebar();

  if (id && mode === 'edit') {
    loadForEdit(id);
  } else {
    renderPage();
  }
}

init();
</script>
