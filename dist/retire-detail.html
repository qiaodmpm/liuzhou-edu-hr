<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退休呈报详情 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#1E40AF;--primary-dark:#1E3A8A;--primary-light:#EFF6FF;--accent:#3B82F6;--text:#1E293B;--text-secondary:#64748B;--text-light:#94A3B8;--border:#E2E8F0;--bg:#F8FAFC;--danger:#EF4444;--success:#10B981;--warning:#F59E0B;--radius:8px;--radius-lg:12px;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow:0 4px 24px rgba(0,0,0,.08);--transition:.2s;--sidebar-w:240px}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topnav{position:fixed;top:0;left:0;right:0;height:56px;background:linear-gradient(135deg,#1E3A8A,#1E40AF);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100}.topnav-left{display:flex;align-items:center;gap:14px}.topnav-logo{width:38px;height:38px;background:rgba(255,255,255,.18);border-radius:10px;display:flex;align-items:center;justify-content:center}.topnav-logo svg{width:24px;height:24px}.topnav-title{font-size:17px;font-weight:600;color:#fff}.topnav-right{display:flex;align-items:center;gap:18px}.topnav-bell{position:relative;cursor:pointer;color:rgba(255,255,255,.85);padding:6px;border-radius:6px;transition:var(--transition)}.topnav-user{display:flex;align-items:center;gap:8px;cursor:pointer;color:rgba(255,255,255,.9);padding:6px 12px;border-radius:6px;transition:var(--transition);font-size:13px;position:relative}.topnav-user .avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}.user-dropdown{display:none;position:absolute;top:46px;right:0;background:#fff;border-radius:var(--radius);box-shadow:0 12px 48px rgba(0,0,0,.12);min-width:160px;z-index:200;overflow:hidden}.user-dropdown.show{display:block}.user-dropdown a{display:block;padding:12px 18px;font-size:13px;color:var(--text);text-decoration:none}.user-dropdown a:hover{background:var(--primary-light);color:var(--primary)}
.sidebar{position:fixed;top:56px;left:0;bottom:0;width:var(--sidebar-w);background:#1E3A8A;z-index:90;overflow-y:auto;display:flex;flex-direction:column}.sidebar-menu{flex:1;padding:8px 0}.menu-group{padding:14px 20px 4px;font-size:11px;color:rgba(255,255,255,.4)}.menu-item{display:flex;align-items:center;padding:10px 20px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.7);transition:var(--transition);border-left:3px solid transparent}.menu-item:hover{background:rgba(255,255,255,.05);color:#fff}.menu-item.active{background:rgba(255,255,255,.08);color:#fff;font-weight:500;border-left-color:var(--accent)}.menu-item .menu-icon{width:18px;height:18px;margin-right:10px;opacity:.7}
.main{margin-left:var(--sidebar-w);margin-top:56px;padding:24px;min-height:calc(100vh - 56px)}.breadcrumb{font-size:12px;color:var(--text-light);margin-bottom:16px}.breadcrumb a{color:var(--text-light);text-decoration:none}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.page-header h1{font-size:20px;font-weight:700}
.progress-bar{display:flex;align-items:center;padding:16px 20px;background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border);margin-bottom:18px}.step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:2px solid var(--border);color:var(--text-light);background:#fff}.step.done .step-dot{background:var(--success);color:#fff;border-color:var(--success)}.step.current .step-dot{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 0 0 4px rgba(30,64,175,.12)}.step.rejected .step-dot{background:var(--danger);color:#fff;border-color:var(--danger)}.step-text{font-size:10px;color:var(--text-light);text-align:center}.step.current .step-text{color:var(--primary)}.step-line{flex:1;height:2px;background:var(--border);margin-bottom:18px}.step-line.done{background:var(--success)}
.status-stamp{display:inline-block;padding:6px 16px;border:2px solid;transform:rotate(-5deg);font-weight:700;font-size:14px;background:#fff}.status-stamp.pending_first{color:#F59E0B;border-color:#F59E0B}.status-stamp.approved_first{color:#3B82F6;border-color:#3B82F6}.status-stamp.rejected{color:#EF4444;border-color:#EF4444}.status-stamp.pending_second{color:#F59E0B;border-color:#F59E0B}.status-stamp.approved{color:#10B981;border-color:#10B981}
.detail-card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:20px 24px;margin-bottom:18px}.detail-card h3{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}.detail-card h3::before{content:'';width:3px;height:14px;background:var(--primary);border-radius:2px;display:inline-block}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px}.info-item{background:#F8FAFC;padding:8px 12px;border-radius:6px}.info-label{font-size:11px;color:var(--text-light)}.info-value{font-size:13px;font-weight:500}
.sub-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}.sub-table th{padding:6px 8px;background:#F8FAFC;border:1px solid var(--border);font-size:11px;color:var(--text-secondary)}.sub-table td{padding:5px 8px;border:1px solid var(--border);text-align:center}
.checklist-item{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 0}
.checklist-file-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#fff;border:1px solid var(--border);border-radius:4px;font-size:11px;cursor:pointer;color:var(--primary)}.checklist-file-chip:hover{border-color:var(--accent)}
.timeline{padding:12px 0}.timeline-item{display:flex;gap:12px;padding:8px 0}.tl-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0;background:var(--accent)}.tl-content{font-size:12px}.tl-time{color:var(--text-light);font-size:11px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;font-size:13px;font-weight:500;border-radius:6px;cursor:pointer;font-family:inherit;transition:var(--transition);border:1px solid transparent}.btn-outline{background:#fff;color:var(--text-secondary);border:1px solid var(--border)}.btn-primary{background:var(--primary);color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;animation:toastIn .3s ease}.toast.warning{background:var(--warning);color:#1E293B}.toast.success{background:var(--success)}@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<nav class="topnav"><div class="topnav-left"><div class="topnav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="1" width="18" height="22" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="12" y2="14"/><line x1="12" y1="18" x2="16" y2="18"/><circle cx="8" cy="18" r="1.5" fill="#fff"/></svg></div><span class="topnav-title">柳州教育人事管理平台</span></div>
<div class="topnav-right"><div class="topnav-bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="badge">1</span></div>
<div class="topnav-user" onclick="toggleUserMenu()"><div class="avatar" id="userAvatar">王</div><span id="userName">王玉兰</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg><div class="user-dropdown" id="userDropdown"><a href="personal-center.html">个人中心</a></div></div></div>
</nav>
<aside class="sidebar" id="sidebar"><div class="sidebar-menu" id="sidebarMenu"></div></aside>
<main class="main" id="pageContent"></main>
<div id="toastContainer"></div>
<script src="src/menu-config.js"></script>
<script>
window.onerror=function(msg,url,line){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#FEE2E2;color:#991B1B;padding:16px 20px;font-family:monospace;font-size:13px';d.innerHTML='ERROR: '+msg+' (line '+line+')<br><button onclick="location.reload()" style="margin-top:8px;padding:6px 16px">重新加载</button>';document.body.prepend(d)};
var currentRole='school',currentId='',record=null;
var STATUS_MAP={pending_first:'待一审',approved_first:'一审通过',rejected:'一审驳回',pending_hr:'待人社录入',pending_second:'待二审',approved:'已完成'};
var ATTACH=['退休审批表','档案年龄证明材料','其他佐证材料'];
function escapeHtml(s){if(s===undefined||s===null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function showToast(m,t){var e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;document.getElementById('toastContainer').appendChild(e);setTimeout(function(){e.remove()},2200)}
function toggleUserMenu(){document.getElementById('userDropdown').classList.toggle('show')}
function goBack(){if(currentRole==='school')window.location.href='retire-list-school.html';else window.location.href='retire-list-admin.html?role='+currentRole}
function getRecord(id){var s=localStorage.getItem('retire_records');try{var all=JSON.parse(s)||[];for(var i=0;i<all.length;i++)if(all[i].id===id)return all[i]}catch(e){}return null}
function renderField(label,val){return val?'<div class="info-item"><div class="info-label">'+label+'</div><div class="info-value">'+escapeHtml(val)+'</div></div>':'<div class="info-item"><div class="info-label">'+label+'</div><div class="info-value" style="color:var(--text-light)">—</div></div>'}

function renderAll(){
  if(!record){document.getElementById('pageContent').innerHTML='<div class="detail-card" style="text-align:center;padding:40px">未找到该退休申报记录</div>';return}
  var r=record;var isAdmin=currentRole==='city'||currentRole==='district';
  var listUrl=isAdmin?('retire-list-admin.html?role='+currentRole):'retire-list-school.html';
  var h='<div class="breadcrumb"><a href="workbench.html">首页</a> &nbsp;/&nbsp; <a href="'+listUrl+'">退休呈报</a> &nbsp;/&nbsp; <span>详情</span></div>';
  h+='<div class="page-header"><div><h1>退休呈报详情 — '+escapeHtml(r.teacherName||'')+'</h1><div style="font-size:12px;color:var(--text-light);margin-top:4px">申请编号：'+escapeHtml(r.id)+' | '+escapeHtml(r.schoolName||'')+' | 提交时间：'+escapeHtml(r.submitTime||'—')+'</div></div><span class="status-stamp '+r.status+'">'+(STATUS_MAP[r.status]||r.status)+'</span></div>';

  // Progress
  var steps=[{label:'学校申报'},{label:'主管初审'},{label:'人社录入'},{label:'主管二审'},{label:'完成'}];
  var stepIdx=r.status==='pending_first'?0:r.status==='approved_first'?1:r.status==='rejected'?-1:r.status==='pending_hr'?2:r.status==='pending_second'?3:r.status==='approved'?4:0;
  h+='<div class="progress-bar">';
  for(var i=0;i<steps.length;i++){var cls='',disp=i+1;if(stepIdx===-1&&i===1)cls='rejected';else if(i<stepIdx)cls='done';else if(i===stepIdx)cls='current';h+='<div class="step '+cls+'"><div class="step-dot">'+(cls==='done'?'✓':cls==='rejected'?'✕':i+1)+'</div><div class="step-text">'+steps[i].label+'</div></div>';if(i<steps.length-1)h+='<div class="step-line '+(i<stepIdx?'done':'')+'"></div>'}
  h+='</div>';

  // 基本信息
  h+='<div class="detail-card"><h3>基本信息</h3><div class="info-grid">';
  h+=renderField('姓名',r.teacherName);h+=renderField('性别',r.gender);h+=renderField('出生日期',r.birthDate);h+=renderField('身份证号',r.idCard);
  h+=renderField('退休日期',r.retireDate);h+=renderField('学历/文化程度',r.education);h+=renderField('政治面貌',r.politics);h+=renderField('籍贯',r.native);
  h+=renderField('单位名称',r.schoolName);
  h+='</div></div>';

  // 岗位信息
  h+='<div class="detail-card"><h3>岗位与工资</h3><div class="info-grid">';
  h+=renderField('人员类别',r.personType);h+=renderField('岗位',r.post);h+=renderField('薪级',r.salaryLevel);
  h+=renderField('岗位工资',r.postSalary);h+=renderField('薪级工资',r.levelSalary);h+=renderField('教护10%',r.teachSubsidy);
  h+=renderField('参加工作时间',r.workStart);h+=renderField('教护龄',r.teachYears);h+=renderField('退休费计发比例%',r.retireRatio);
  h+=renderField('生活补贴',r.lifeSubsidy);h+=renderField('增加退休费',r.extraRetire);h+=renderField('教龄津贴',r.teachAllowance);h+=renderField('其他',r.other);
  h+='</div></div>';

  // 简历
  if(r.resumeRows&&r.resumeRows.length>0){
    h+='<div class="detail-card"><h3>本人简历</h3><table class="sub-table"><thead><tr><th>何年何月起</th><th>在何地区何部门</th><th>任何职</th></tr></thead><tbody>';
    r.resumeRows.forEach(function(rr){h+='<tr><td>'+escapeHtml(rr.start)+'</td><td>'+escapeHtml(rr.org)+'</td><td>'+escapeHtml(rr.position)+'</td></tr>'});
    h+='</tbody></table></div>';
  }
  // 配偶子女
  if(r.spouseRows&&r.spouseRows.length>0){
    h+='<div class="detail-card"><h3>配偶及子女情况</h3><table class="sub-table"><thead><tr><th>姓名</th><th>性别</th><th>年龄</th><th>与本人关系</th><th>在何部门任何职</th></tr></thead><tbody>';
    r.spouseRows.forEach(function(sr){h+='<tr><td>'+escapeHtml(sr.name)+'</td><td>'+escapeHtml(sr.gender)+'</td><td>'+escapeHtml(sr.age)+'</td><td>'+escapeHtml(sr.relation)+'</td><td>'+escapeHtml(sr.dept)+'</td></tr>'});
    h+='</tbody></table></div>';
  }
  // 其他
  h+='<div class="detail-card"><h3>其他信息</h3><div class="info-grid">';
  h+=renderField('有何重大政治历史问题',r.politicalIssue||'无');
  h+='</div></div>';

  // 附件
  h+='<div class="detail-card"><h3>附件材料</h3>';
  var mats=r.materials||{};
  ATTACH.forEach(function(item){var v=mats[item];var isMulti=item==='其他佐证材料';
    if(isMulti&&Array.isArray(v)&&v.length>0){h+='<div class="checklist-item"><span style="color:#10B981">☑</span> '+item+' ('+v.length+'个文件)</div>';v.forEach(function(f){h+='<div style="padding-left:18px" class="checklist-item"><span class="checklist-file-chip" onclick="showToast(\'预览：'+escapeHtml(f.name)+'\')">📄 '+escapeHtml((f.name||'').substring(0,14))+'</span></div>'})}
    else if(!isMulti&&v){h+='<div class="checklist-item"><span style="color:#10B981">☑</span> '+item+': <span class="checklist-file-chip" onclick="showToast(\'预览：'+escapeHtml(v.name)+'\')">📄 '+escapeHtml((v.name||'').substring(0,14))+'</span></div>'}
    else{h+='<div class="checklist-item"><span style="color:#94A3B8">☐</span> '+item+': <span style="color:#F59E0B;font-size:11px">未上传</span></div>'}
  });
  h+='</div>';

  // HR result
  if(r.hrResult&&(r.status==='pending_second'||r.status==='approved')){
    h+='<div class="detail-card"><h3>人社审批结果</h3><div class="info-grid">';
    h+=renderField('批准退休等级',r.hrResult.level);h+=renderField('人社批复文号',r.hrResult.docNumber);h+=renderField('备注',r.hrResult.remark);
    if(r.hrApprovalAttachment)h+=renderField('批复文档',r.hrApprovalAttachment.name);
    h+='</div></div>';
  }

  // Reject reason
  if(r.status==='rejected'&&r.rejectReason){h+='<div class="detail-card" style="background:#FEF2F2;border:1px solid #FECACA"><h3 style="color:var(--danger)">驳回原因</h3><p style="font-size:13px;color:#991B1B">'+escapeHtml(r.rejectReason)+'</p></div>'}

  h+='<div style="text-align:right"><button class="btn btn-outline" onclick="goBack()">返回列表</button></div>';
  document.getElementById('pageContent').innerHTML=h;
}

(function init(){
  var p=new URLSearchParams(window.location.search);currentId=p.get('id')||'';var r=p.get('role');if(r==='city'||r==='district'||r==='school')currentRole=r;
  record=getRecord(currentId);renderSidebarMenu('sidebarMenu',currentRole,'retire');renderAll()
})();
</script>
</body>
</html>
