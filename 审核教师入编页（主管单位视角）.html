<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>审核教师入编 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 12px; }
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column;
}
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}

.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }

.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* Two-column layout */
.review-layout { display: flex; gap: 24px; }
.review-main { flex: 1; min-width: 0; }
.review-side { width: 360px; flex-shrink: 0; }

/* Card */
.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  margin-bottom: 20px; overflow: hidden;
}
.card-header {
  padding: 14px 20px; font-size: 14px; font-weight: 600; color: var(--text);
  background: #FAFBFC; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
}
.card-body { padding: 20px; }

/* Status stamp */
.status-stamp {
  display: inline-block; padding: 6px 16px; border: 2px solid;
  transform: rotate(-5deg); font-weight: 700; font-size: 14px; background: #fff;
}
.status-stamp.approved { color: #10B981; border-color: #10B981; }
.status-stamp.rejected { color: #EF4444; border-color: #EF4444; }
.status-stamp.pending { color: #F59E0B; border-color: #F59E0B; }

/* Progress tracker */
.progress-tracker {
  display: flex; align-items: center; justify-content: center;
  padding: 8px 0 20px;
}
.progress-step {
  display: flex; flex-direction: column; align-items: center; position: relative;
}
.progress-dot {
  width: 32px; height: 32px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
  transition: var(--transition); position: relative; z-index: 1;
}
.progress-dot.done { background: var(--success); color: #fff; }
.progress-dot.current { background: var(--primary); color: #fff; box-shadow: 0 0 0 6px rgba(30,64,175,0.12); }
.progress-dot.pending { background: var(--gray-bg); color: var(--text-light); border: 2px solid var(--border); }
.progress-dot.rejected { background: #FEE2E2; color: var(--danger); border-color: var(--danger); }
.progress-label { font-size: 11px; font-weight: 500; margin-top: 8px; text-align: center; white-space: nowrap; }
.progress-label.done { color: var(--success); }
.progress-label.current { color: var(--primary); }
.progress-label.pending { color: var(--text-light); }
.progress-line {
  width: 100px; height: 2px; margin: 0 8px; margin-bottom: 24px;
  position: relative; z-index: 0;
}
.progress-line.done { background: var(--success); }
.progress-line.pending { background: var(--border); }

/* Info grid */
.info-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
}
.info-item {
  background: #F8FAFC; padding: 10px 14px; border-radius: 8px;
}
.info-item.full { grid-column: 1 / -1; }
.info-label { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
.info-value { font-size: 13px; font-weight: 500; color: var(--text); }

.section-label {
  grid-column: 1 / -1; padding: 8px 0 4px;
  font-size: 12px; font-weight: 600; color: var(--primary);
  border-bottom: 1px solid var(--primary-light); margin-bottom: 4px;
}

/* Data table */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  padding: 8px 12px; text-align: left; font-weight: 600; font-size: 12px;
  color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border);
}
.data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }

/* Materials */
.material-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: #F8FAFC; border-radius: 8px; margin-bottom: 8px;
}
.material-item:last-child { margin-bottom: 0; }
.material-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.material-tag {
  font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 500;
}
.material-tag.required { background: #FEF2F2; color: #EF4444; }
.material-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.file-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; background: #fff; border: 1px solid var(--border);
  border-radius: 4px; font-size: 12px; cursor: pointer;
}
.file-chip:hover { border-color: var(--accent); color: var(--primary); }

/* Timeline */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px;
  width: 2px; background: var(--border);
}
.timeline-item { position: relative; margin-bottom: 20px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot {
  position: absolute; left: -24px; top: 4px;
  width: 14px; height: 14px; border-radius: 50%; z-index: 1;
}
.timeline-dot.submit { background: var(--accent); }
.timeline-dot.reject { background: var(--danger); }
.timeline-dot.resubmit { background: var(--warning); }
.timeline-dot.approve { background: var(--success); }
.timeline-content .tlc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.timeline-content .tlc-title { font-size: 13px; font-weight: 600; color: var(--text); }
.timeline-content .tlc-time { font-size: 11px; color: var(--text-light); }
.timeline-content .tlc-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.timeline-content .tlc-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 500;
}
.tlc-tag.reject-reason { background: #FEE2E2; color: var(--danger); }
.tlc-tag.resubmit-tag { background: #FEF3C7; color: #D97706; }
.tlc-tag.approve-tag { background: #D1FAE5; color: #059669; }

/* Warning banner */
.warning-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; background: #FFFBEB; border: 1px solid #FDE68A;
  border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; color: #92400E;
}

/* Action bar */
.action-bar {
  display: flex; gap: 12px; padding: 20px;
  border-top: 1px solid var(--border); background: #FAFBFC;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 24px; font-size: 14px; font-weight: 600;
  border-radius: 8px; cursor: pointer; font-family: inherit; transition: var(--transition);
  border: none; text-decoration: none;
}
.btn-approve { background: #10B981; color: #fff; }
.btn-approve:hover { background: #059669; }
.btn-reject { background: #EF4444; color: #fff; }
.btn-reject:hover { background: #DC2626; }
.btn-warning { background: #F59E0B; color: #fff; }
.btn-warning:hover { background: #D97706; }
.btn-outline { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); font-weight: 500; }
.btn-outline:hover { background: var(--gray-bg); }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center;
  justify-content: center; z-index: 1000;
}
.modal-container {
  background: #fff; border-radius: 16px; width: 480px;
  max-width: 90%; padding: 24px; box-shadow: var(--shadow-lg);
}
.modal-container h3 { margin-bottom: 12px; font-size: 16px; }
.modal-container textarea {
  width: 100%; padding: 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-family: inherit;
  margin-bottom: 16px; resize: vertical; min-height: 80px;
}
.modal-container .form-group { margin-bottom: 12px; }
.modal-container .form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.modal-container textarea.optional { border-color: #D1D5DB; }
.modal-buttons { display: flex; justify-content: flex-end; gap: 12px; }
.btn-cancel {
  background: var(--gray-bg); border: none; padding: 8px 20px;
  border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit;
}
.btn-confirm {
  color: #fff; border: none; padding: 8px 20px;
  border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600;
}
.btn-confirm.danger { background: #EF4444; }
.btn-confirm.danger:hover { background: #DC2626; }
.btn-confirm.success { background: #10B981; }
.btn-confirm.success:hover { background: #059669; }
.btn-confirm.warning { background: #F59E0B; }
.btn-confirm.warning:hover { background: #D97706; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.success { background: #10B981; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

@media (max-width: 1024px) {
  .review-layout { flex-direction: column; }
  .review-side { width: 100%; }
  .info-grid { grid-template-columns: repeat(2, 1fr); }
}

/* Back link */
.back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
.back-link:hover { color: var(--primary); }

/* Unit info detail table */
.info-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.info-table td { padding: 8px 14px; border: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.info-table .ilabel { background: var(--gray-bg); color: var(--text-secondary); font-weight: 500; width: 180px; white-space: nowrap; }
.info-table .ivalue { background: #fff; color: var(--text); font-weight: 600; }
.info-section-label { font-size: 13px; font-weight: 600; color: var(--primary); margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--border); }
.info-subtable { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
.info-subtable > tbody > tr > td { vertical-align: top; padding: 0; }
.isub-left { width: 50%; padding-right: 8px !important; }
.isub-right { width: 50%; padding-left: 8px !important; }
.info-mini { width: 100%; border-collapse: collapse; }
.info-mini td, .info-mini th { padding: 6px 10px; border: 1px solid var(--border); font-size: 12px; text-align: left; }
.info-mini th { background: var(--gray-bg); color: var(--text-secondary); font-weight: 500; }
.info-mini td { background: #fff; }
.info-mini td:last-child, .info-mini th:last-child { text-align: center; width: 120px; }
</style>
</head>

<!-- ===== TOP NAVBAR ===== -->

  <div class="topnav-left">

      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">

// ===== DATA =====
function loadRecords() {
  var stored = JSON.parse(localStorage.getItem('entry_records') || '[]');
  var ids = {};
  stored.forEach(function(r) { ids[r.id] = true; });
  var merged = stored.slice();
  DEMO_RECORDS.forEach(function(r) { if (!ids[r.id]) { merged.push(r); ids[r.id] = true; } });
  return merged;
}

function saveRecords(records) {
  localStorage.setItem('entry_records', JSON.stringify(records));
}

function findRecord(id) {
  return loadRecords().find(function(r) { return r.id === id; }) || null;
}

function getApproverName() {
  var roleData = ROLES[currentRole];
  return roleData ? roleData.name : '';
}

// ===== PERMISSION CHECKS =====
function checkPermission() {
  if (!currentRecord) return false;
  if (isModifyMode) {
    // Must be approved, approverRole must match, within 30 days
    if (currentRecord.status !== 'approved') return false;
    if (currentRecord.approverRole !== currentRole) return false;
    if (!currentRecord.approveTime) return false;
    var days = (Date.now() - new Date(currentRecord.approveTime).getTime()) / 86400000;
    return days < 30;
  }
  // Normal approval: must be pending, and role-scope match
  if (currentRecord.status !== 'pending') return false;
  if (currentRole === 'district') return currentRecord.schoolType === '鱼峰区属';
  if (currentRole === 'city') return currentRecord.schoolType === '市直属';
  return false;
}

  var r = currentRecord;
  var steps;
  if (isModifyMode) {
    steps = [
      { label: '提交申请', state: 'done' },
      { label: '教育局审批', state: 'current' },
      { label: '审核完成', state: 'pending' }
    ];
  } else if (r.status === 'approved') {
    steps = [
      { label: '提交申请', state: 'done' },
      { label: '教育局审批', state: 'done' },
      { label: '审核完成', state: 'done' }
    ];
  } else if (r.status === 'rejected') {
    steps = [
      { label: '提交申请', state: 'done' },
      { label: '教育局审批', state: 'done' },
      { label: '审核驳回', state: 'rejected' }
    ];
  } else {

      { label: '教育局审批', state: 'current' },

    ];
  }

  var h = '';
  for (var i = 0; i < steps.length; i++) {
    var step = steps[i];
    var isRejected = step.state === 'rejected';
    var dotIcon = step.state === 'done' ? '✓' : (isRejected ? '✕' : (i + 1));
    var dotClass = step.state === 'done' ? 'done' : (step.state === 'current' ? 'current' : (isRejected ? 'rejected' : 'pending'));

    h += '<div class="progress-step">';
    h += '<div class="progress-dot ' + dotClass + '">' + dotIcon + '</div>';
    h += '<div class="progress-label ' + dotClass + '">' + step.label + '</div>';
    h += '</div>';
    if (i < steps.length - 1) {
      h += '<div class="progress-line ' + (step.state === 'done' ? 'done' : 'pending') + '"></div>';
    }
  }

  return '<div class="card"><div class="card-header">审批进度</div><div class="card-body">' +
    '<div class="progress-tracker">' + h + '</div></div></div>';
}

function renderTimeline() {

  if (r.status === 'approved') {
    items.push({ time: r.approveTime || '', title: '审批通过', desc: (r.approver || '') + ' 审批通过' + (r.opinion ? '，意见：' + r.opinion : ''), action: 'approve' });
  } else if (r.status === 'rejected') {
    items.push({ time: r.approveTime || r.submitTime || '', title: '审批驳回', desc: (r.rejectReason || ''), action: 'reject', reason: r.rejectReason || '' });
  }
  if (r.timeline) {
    for (var i = 0; i < r.timeline.length; i++) {
      var t = r.timeline[i];
      items.push({ time: t.time || '', title: t.action || '', desc: t.desc || (t.operator || '') + ' ' + (t.opinion || ''), action: 'resubmit' });
    }
  }
  var tagMap = {
    approve: '<span class="tlc-tag approve-tag">审批通过</span>',
    reject: '<span class="tlc-tag reject-reason">驳回</span>',
    resubmit: '<span class="tlc-tag resubmit-tag">修改重提</span>'
  };

  var html = '<div class="card"><div class="card-header">申报履历</div><div class="card-body"><div class="timeline">';
  for (var j = 0; j < items.length; j++) {
    var item = items[j];

      '<div class="timeline-dot ' + (dotClassMap[item.action] || 'submit') + '"></div>' +
      '<div class="timeline-content">' +
      '<div class="tlc-header">' +
      '<span class="tlc-title">' + item.title + '</span>' +

      '</div></div>';
  }
  html += '</div></div></div>';

function showApproveModal() {
  var modalHtml =
    '<div class="modal-overlay" id="approveModal">' +
      '<div class="modal-container">' +
        '<h3>审批通过</h3>' +
        '<div class="form-group"><label>审批意见（可选）</label>' +
        '<textarea id="approveOpinion" class="optional" rows="3" placeholder="输入审批意见..."></textarea></div>' +
        '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:16px;">' +
          '确认通过后，申请状态变更为"已通过"，本学校可用编制数/控制数将自动减去对应人数。' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelApprove">取消</button>' +
          '<button class="btn-confirm success" id="confirmApprove">确认通过</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('cancelApprove').onclick = function() { document.getElementById('approveModal').remove(); };
  document.getElementById('confirmApprove').onclick = doApprove;
}

function doApprove() {
  var opinion = document.getElementById('approveOpinion').value.trim();
  document.getElementById('approveModal').remove();

  var records = loadRecords();
  var idx = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx === -1) { showToast('记录不存在'); return; }

  records[idx].status = 'approved';
  records[idx].approveTime = new Date().toISOString();
  records[idx].approver = getApproverName();
  records[idx].approverRole = currentRole;
  records[idx].opinion = opinion || '同意入编';
  records[idx].timeline = records[idx].timeline || [];
  records[idx].timeline.push({
    time: new Date().toISOString(),
    action: '审批通过',
    operator: getApproverName(),
    opinion: opinion || '同意入编'
  });

  saveRecords(records);
  showToast('审批通过', 'success');
  setTimeout(function() { goBack(); }, 800);
}

function showRejectModal() {
  var modalHtml =
    '<div class="modal-overlay" id="rejectModal">' +
      '<div class="modal-container">' +
        '<h3>审批驳回</h3>' +
        '<div class="form-group"><label>驳回原因（必填）</label>' +
        '<textarea id="rejectReason" rows="4" placeholder="请填写驳回原因..."></textarea></div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelReject">取消</button>' +
          '<button class="btn-confirm danger" id="confirmReject">确认驳回</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('cancelReject').onclick = function() { document.getElementById('rejectModal').remove(); };
  document.getElementById('confirmReject').onclick = doReject;
}

function doReject() {
  var reason = document.getElementById('rejectReason').value.trim();
  if (!reason) { showToast('请填写驳回原因'); return; }
  document.getElementById('rejectModal').remove();

  var records = loadRecords();
  var idx = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx === -1) { showToast('记录不存在'); return; }

  records[idx].status = 'rejected';
  records[idx].rejectReason = reason;
  records[idx].timeline = records[idx].timeline || [];
  records[idx].timeline.push({
    time: new Date().toISOString(),
    action: '审批驳回',
    operator: getApproverName(),
    opinion: reason
  });

  saveRecords(records);
  showToast('已驳回');
  setTimeout(function() { goBack(); }, 800);
}

function showModifyModal() {
  var modalHtml =
    '<div class="modal-overlay" id="modifyModal">' +
      '<div class="modal-container">' +
        '<h3>修改审核结果为驳回</h3>' +
        '<div class="form-group"><label>驳回原因（必填）</label>' +
        '<textarea id="modifyReason" rows="4" placeholder="请填写驳回原因..."></textarea></div>' +
        '<div style="font-size:12px;color:var(--danger);margin-bottom:16px;">' +
          '⚠ 此操作将撤销原审批结果，申请退回学校，需重新审批。' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelModify">取消</button>' +
          '<button class="btn-confirm warning" id="confirmModify">确认修改</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('cancelModify').onclick = function() { document.getElementById('modifyModal').remove(); };
  document.getElementById('confirmModify').onclick = doModifyResult;
}

function doModifyResult() {
  var reason = document.getElementById('modifyReason').value.trim();
  if (!reason) { showToast('请填写驳回原因'); return; }
  document.getElementById('modifyModal').remove();

  var records = loadRecords();
  var idx = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx === -1) { showToast('记录不存在'); return; }

  // Save old state as version history
  records[idx].versionHistory = records[idx].versionHistory || [];
  records[idx].versionHistory.push({
    status: records[idx].status,
    approveTime: records[idx].approveTime,
    approver: records[idx].approver,
    opinion: records[idx].opinion,
    modifiedAt: new Date().toISOString()
  });

  records[idx].status = 'pending';
  records[idx].rejectReason = reason;
  records[idx].approveTime = null;
  records[idx].opinion = null;
  records[idx].timeline = records[idx].timeline || [];
  records[idx].timeline.push({
    time: new Date().toISOString(),
    action: '修改审核结果',
    operator: getApproverName(),
    opinion: '修改审批结果为驳回，原因：' + reason
  });

  saveRecords(records);
  showToast('已退回学校重新审批', 'success');
  setTimeout(function() { goBack(); }, 800);
}

// ===== NAVIGATION =====
function goBack() {
  window.location.href = '教师入编管理（主管单位视角）.html?role=' + currentRole;
}

// ===== SIDEBAR =====
function switchRole(role) {
  if (role === currentRole) return;
  if (role === 'school') {
    window.location.href = '教师入编管理（学校管理员视角）.html?role=school';
  } else if (role === 'city' || role === 'district') {
    window.location.href = '教师入编管理（主管单位视角）.html?role=' + role;
  } else {
    showToast('教师角色无操作权限');
  }
}

function updateRoleUI() {
  var roleData = ROLES[currentRole];
  document.getElementById('userAvatar').textContent = roleData.short;
  document.getElementById('userName').textContent = roleData.name;
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === currentRole);
  });
}

function renderSidebar() {
  var roleData = ROLES[currentRole];
  if (!roleData) { document.getElementById('sidebarMenu').innerHTML = ''; return; }
  var sidebar = roleData.sidebar;
  var html = '';
  (sidebar.top || []).forEach(function(item) {
    html += '<a class="menu-item" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[item.icon] || '') + '<span class="menu-label">' + item.label + '</span></a>';
  });
  (sidebar.groups || []).forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      html += '<a class="menu-item' + (item.id === 'entry' ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[MENU_ICONS[item.id] || 'file']) + '<span class="menu-label">' + item.label + '</span></a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') { goBack(); return; }
  if (id === 'exit') {
    if (currentRole === 'city' || currentRole === 'district') { window.location.href = '教师出编管理（主管单位视角）.html'; return; }
    if (currentRole === 'school') { window.location.href = '教师出编管理（学校管理员视角）.html'; return; }
  }
  if (id === 'postset') { window.location.href = 'post-list-admin.html?role=' + currentRole; return; }
  showToast('跳转至：' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function showToast(msg, type) {
  type = type || '';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function() { el.remove(); }, 2000);
}

// ===== INIT =====
(function init() {
  var params = new URLSearchParams(window.location.search);
  var urlRole = params.get('role');
  if (urlRole === 'city' || urlRole === 'district' || urlRole === 'school') {
    currentRole = urlRole;
  }
  isModifyMode = params.get('action') === 'modify';
  updateRoleUI();
  renderSidebar();

  var recordId = params.get('id') || 'RN20260515001';
  currentRecord = findRecord(recordId);
  if (!currentRecord) { var all = loadRecords(); currentRecord = all.length > 0 ? all[0] : null; }
  renderPage();
})();
</script>
