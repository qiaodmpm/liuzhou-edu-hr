.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }

.btn-sm { padding: 5px 12px; font-size: 12px; }

.btn-success { background: var(--success); color: #fff; border: none; }

/* Status badge */
.status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.status-badge.pending { background: #FEF3C7; color: #92400E; }

.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
.form-group input:read-only, .form-group select:disabled { background: #F8FAFC; color: var(--text-secondary); }
.form-row { display: flex; gap: 16px; }
.form-row .form-group { flex: 1; }
.form-row-3 { display: flex; gap: 12px; }

.info-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.info-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.info-table td:first-child { color: var(--text-secondary); width: 140px; font-size: 12px; }
.info-table td:last-child { font-weight: 500; }
/* Level grid */
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; font-size: 12px; }
.level-item { text-align: center; padding: 6px 4px; border-radius: 4px; background: var(--bg); }
.level-item .lv { color: var(--text-secondary); font-size: 10px; }

.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-header h3 { margin: 0; padding: 0; border: none; }
/* Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 480px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
.modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { cursor: pointer; color: var(--text-light); font-size: 20px; padding: 4px; border: none; background: none; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-body .form-group { margin-bottom: 16px; }
.modal-body .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
.modal-body .form-group textarea { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; outline: none; resize: vertical; }
.modal-body .form-group textarea:focus { border-color: var(--accent); }
.modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
/* Toast */
.toast { position: fixed; top: 20px; right: 20px; z-index: 9999; padding: 12px 20px; border-radius: 8px; font-size: 13px; color: #fff; font-weight: 500; opacity: 0; transform: translateY(-10px); transition: var(--transition); pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--success); }
.toast.warning { background: var(--warning); }

// ===== INIT =====
function init() {
  // Load or initialize ledger data
  var stored = localStorage.getItem('org_ledger');
  if (!stored) {
    localStorage.setItem('org_ledger', JSON.stringify(getDemoLedgers()));
    stored = localStorage.getItem('org_ledger');
  }
  var allLedgers = JSON.parse(stored);

  // Merge demo data for any missing schools
  var demos = getDemoLedgers();
  var changed = false;
  Object.keys(demos).forEach(function(k) {
    if (!allLedgers[k]) { allLedgers[k] = demos[k]; changed = true; }
  });
  if (changed) { localStorage.setItem('org_ledger', JSON.stringify(allLedgers)); }

  // Ensure schoolId exists with region prefix
  var REGION_CODE = { '柳城县':'01','鹿寨县':'02','融安县':'03','融水县':'04','三江县':'05','柳北区':'06','城中区':'07','鱼峰区':'08','柳南区':'09','柳江区':'10','市直属':'00' };
  var regionCounters = {};
  var schoolKeys = Object.keys(allLedgers).sort();
  var idChanged = false;
  schoolKeys.forEach(function(k) {
    var d = allLedgers[k];
    var prefix = 'gxlj-' + (REGION_CODE[d.district] || '00');
    if (!regionCounters[prefix]) regionCounters[prefix] = 0;
    var needsNew = !d.schoolId || d.schoolId.indexOf('SCH-') === 0 || d.schoolId.indexOf('gxlj-') !== 0;
    if (needsNew) {
      regionCounters[prefix]++;
      d.schoolId = prefix + '-' + String(regionCounters[prefix]).padStart(3, '0');
      idChanged = true;
    } else {
      var parts = d.schoolId.split('-');
      if (parts.length === 3) { var seq = parseInt(parts[2]); if (seq >= regionCounters[prefix]) regionCounters[prefix] = seq; }
    }
  });
  if (idChanged) { localStorage.setItem('org_ledger', JSON.stringify(allLedgers)); }

  ledger = allLedgers[currentSchool] || null;
  backfillChangeLog();

  renderSidebar();
  renderPage();
}

function backfillChangeLog() {
  if (!ledger) return;
  if (!ledger.changeLog) ledger.changeLog = [];
  if (ledger.changeLog.length > 0) return;

  if (ledger.submittedAt) {
    ledger.changeLog.push({
      type: 'submit',
      time: ledger.submittedAt + ' 00:00:00',
      operator: ledger.schoolName || '',
      action: '学校提交申报'
    });
  }
  if (ledger.returnReason) {
    ledger.changeLog.push({
      type: 'return',
      time: (ledger.updatedAt || ledger.submittedAt || '') + ' 00:00:00',
      operator: ledger.updatedBy || ledger.reviewedBy || '',
      action: '退回修改',
      reason: ledger.returnReason
    });
  }
  if (ledger.status === 'active' && ledger.reviewedAt) {
    ledger.changeLog.push({
      type: 'approve',
      time: ledger.reviewedAt + ' 00:00:00',
      operator: ledger.reviewedBy || '',
      action: '审核通过'
    });
  }
  if (ledger.changeLog.length > 0) {
    var allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
    allLedgers[currentSchool] = ledger;
    localStorage.setItem('org_ledger', JSON.stringify(allLedgers));
  }
}

// ===== SIDEBAR =====
function renderSidebar() {
  var role = currentUser.role || 'school';
  var cfg = ROLES[role];
  if (!cfg) cfg = ROLES.school;
  var h = '';
  // Top items
  (cfg.sidebar.top||[]).forEach(function(item) {
    var icon = ICONS[item.icon] || '';
    var active = item.id === 'ledger';
    h += '<a class="menu-item' + (active ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + icon + item.label + '</a>';
  });
  // Groups
  (cfg.sidebar.groups||[]).forEach(function(group) {
    h += '<div class="menu-group">' + group.name + '</div>';
    (group.items||[]).forEach(function(item) {
      var icon = ICONS[MENU_ICONS[item.id]] || '';
      var badge = item.badge ? '<span class="menu-badge">' + item.badge + '</span>' : '';
      h += '<a class="menu-item" onclick="sidebarClick(this,\'' + item.id + '\')">' + icon + item.label + badge + '</a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = h;
  // Update user info
  document.getElementById('userName').textContent = cfg.name;
  document.getElementById('userAvatar').textContent = cfg.short;
  // Update role switcher
  document.querySelectorAll('.role-switch-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.role === role); });
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; }
  else if (id === 'ledger') { window.location.href = currentUser.role === 'city' || currentUser.role === 'district' ? 'org-ledger-admin.html' : 'org-ledger-school.html'; }
  else if (id === 'staffing') { window.location.href = 'staffing-application.html'; }
  else if (id === 'entry') { window.location.href = '教师入编管理（学校管理员视角）.html'; }
  else if (id === 'exit') { window.location.href = '教师出编管理（学校管理员视角）.html'; }
  else if (id === 'postset') { window.location.href = 'post-list-school.html'; }
  else if (id === 'promote') { window.location.href = 'promote-list-school.html'; }
  else if (id === 'recruit') { window.location.href = 'recruit-list-school.html'; }
  else if (id === 'employ') { window.location.href = 'employ-list-school.html'; }
  else if (id === 'retire') { showToast('跳转至：退休呈报'); }
  else if (id === 'salary') { showToast('跳转至：工资核定申请'); }

function switchRole(role) {
  var cfg = ROLES[role];
  currentUser = { role: role, name: cfg.name, id: role === 'city' ? 'C001' : role === 'district' ? 'D001' : role === 'school' ? 'S001' : 'T001', district: cfg.district || '', schoolName: role === 'school' ? '柳州市第八中学' : '' };
  localStorage.setItem('currentUser', JSON.stringify(currentUser));
  if (role === 'city' || role === 'district') { window.location.href = 'org-ledger-admin.html'; return; }
  if (role === 'teacher') { window.location.href = 'workbench.html'; return; }
  // school role: reload current page with new user
  currentSchool = currentUser.schoolName;
  var allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
  ledger = allLedgers[currentSchool] || null;
  isEditing = false;
  renderSidebar();
  renderPage();
}

// ===== COMPUTED FIELDS =====
function getComputed(ledgerData) {
  var d = ledgerData;
  var careerUnusedPlan = d.careerApprovedPlan - d.careerUsedPlan;
  var careerAvailable = Math.max(0, d.careerQuota - d.careerActual - d.careerApprovedPlan);
  var controlUnusedPlan = Math.max(0, d.controlApprovedPlan - d.controlUsedPlan);
  var controlAvailable = Math.max(0, d.controlQuota - d.controlActual - d.controlApprovedPlan);
  var totalControlQuota = d.careerQuota + d.controlQuota;
  var totalPosts = totalControlQuota - (d.highlandPosts || 0);
  return {
    careerUnusedPlan: careerUnusedPlan,
    careerAvailable: careerAvailable,
    controlUnusedPlan: controlUnusedPlan,
    controlAvailable: controlAvailable,
    totalControlQuota: totalControlQuota,
    totalPosts: totalPosts,
    careerUsageRate: d.careerQuota > 0 ? Math.round(d.careerActual / d.careerQuota * 100) : 0,
    controlUsageRate: d.controlQuota > 0 ? Math.round(d.controlActual / d.controlQuota * 100) : 0
  };
}

function shouldShowForm() {
  // Only show edit form when user explicitly clicks "编辑" button
  return isEditing;
}

// ===== RENDER PAGE =====
function renderPage() {
  // School switcher always visible
  var ALL_SCHOOLS = ['柳州市第一中学','柳州市第二中学','柳州高级中学','柳州市民族高中','柳州市第八中学','柳州铁一中学','柳州市第十三中学','柳州市第二十五中学','鱼峰区实验小学','柳州市特色实验高中','鱼峰区机关幼儿园','柳州市第三中学','柳州市第六中学','城中区实验小学','柳江区实验中学'];
  var allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
  // Merge registered schools + ledger schools
  var schoolSet = {};
  ALL_SCHOOLS.forEach(function(s) { schoolSet[s] = true; });
  Object.keys(allLedgers).forEach(function(s) { schoolSet[s] = true; });
  var schoolList = Object.keys(schoolSet).sort();
  var swHTML = '<div class="school-switcher" style="margin-bottom:16px;display:inline-flex;align-items:center;gap:8px;">';
  swHTML += '<label>当前学校：</label><select onchange="switchSchool(this.value)">';
  schoolList.forEach(function(s) {
    swHTML += '<option value="' + s + '"' + (s === currentSchool ? ' selected' : '') + '>' + s + '</option>';
  });
  swHTML += '</select>';
  swHTML += '<button onclick="resetCurrentSchool()" style="padding:4px 10px;font-size:11px;border:1px dashed #94A3B8;border-radius:4px;background:#fff;color:#94A3B8;cursor:pointer;font-family:inherit;" title="清除当前学校台账数据">重置</button>';
  swHTML += '</div>';
  document.getElementById('schoolSwitcherArea').innerHTML = swHTML;

  if (!ledger) {
    renderEmptyState();
    return;
  }
  if (!ledger.submittedAt && !isEditing) {
    renderEmptyState();
    return;
  }

  var comp = getComputed(ledger);
  var status = ledger.status || 'active';
  var showForm = shouldShowForm();

  // Header
  document.getElementById('pageSubtitle').textContent = ledger.schoolName + ' ｜ 更新日期：' + (ledger.updatedAt || '—');

  var statusHtml = '';
  var headerRightHtml = '';
  if (!ledger.submittedAt) {
    if (isEditing) { statusHtml = '<span class="status-badge review">编辑中</span>'; }
  } else if (status === 'pending' && !ledger.returnReason) {
    statusHtml = '<span class="status-badge pending">待审核</span>';
  } else if (status === 'pending' && ledger.returnReason) {
    statusHtml = '<span class="status-badge rejected">审核退回</span>';
  } else if (status === 'active') {
    statusHtml = '<span class="status-badge active">已生效</span>';
  }
  // Edit button in header for returned/active states
  if (!showForm && ledger.submittedAt && (status === 'active' || (status === 'pending' && ledger.returnReason))) {
    headerRightHtml += '<button class="btn btn-outline-sm" onclick="startEdit()">编辑</button>';
  }
  document.getElementById('headerActions').innerHTML = statusHtml + (headerRightHtml ? '<div style="margin-top:8px;">' + headerRightHtml + '</div>' : '');

  var h = '';

  // Return reason banner (if returned)
  if (status === 'pending' && ledger.returnReason) {
    h += '<div class="return-banner">';
    h += '<div class="return-label">⚠️ 审核退回</div>';
    h += '<div class="return-text">退回原因：' + escapeHtml(ledger.returnReason) + '</div>';
    h += '<div style="margin-top:8px;font-size:12px;color:#991B1B;">请修改后重新提交审核。</div>';
    h += '</div>';
  }

  // Pending banner
  if (status === 'pending' && !ledger.returnReason && ledger.submittedAt) {
    h += '<div class="alert alert-info">⏳ 台账已提交至上级管理部门审核，审核期间不可修改。</div>';
  }

  if (showForm) {
    h += renderEditForm(ledger, comp);
  } else {
    // 机构基础信息
    h += renderBasicInfo(ledger, false);
    // 编制概览（双卡 + 环形图）
    h += renderQuotaDashboard(ledger, comp);
    // 岗位结构
    h += renderPostStructure(ledger, comp, false);
    // 领导职数
    h += renderLeaderInfo(ledger, false);
  }

  // Action buttons
  h += renderActionBar(status, showForm);

  document.getElementById('mainContent').innerHTML = h;
}

function renderQuotaCard(type, title, quota, actual, approvedPlan, usedPlan, unusedPlan, available, usageRate) {
  var colorVal = usageRate >= 90 ? 'var(--danger)' : usageRate >= 70 ? 'var(--warning)' : 'var(--success)';
  var dashLen = 97.4 * usageRate / 100; // circumference ~97.4
  if (usageRate <= 0) dashLen = 0;
  if (usageRate >= 100) dashLen = 97.4;

  var h = '<div class="form-card" style="flex:1;">';
  h += '<h2><span class="card-icon">' + (type === 'career' ? '📊' : '📋') + '</span>' + title + '</h2>';

  // Donut chart
  h += '<div style="text-align:center;margin-bottom:12px;">';
  h += '<svg width="96" height="96" viewBox="0 0 36 36">';
  h += '<circle cx="18" cy="18" r="15.5" fill="none" stroke="#E2E8F0" stroke-width="2.5"/>';
  if (usageRate > 0) {
    h += '<circle cx="18" cy="18" r="15.5" fill="none" stroke="' + colorVal + '" stroke-width="2.5" stroke-dasharray="' + dashLen + ' ' + (97.4 - dashLen) + '" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 18 18)"/>';
  }
  h += '<text x="18" y="17" text-anchor="middle" font-size="7" fill="#1E293B" font-weight="700">' + (quota > 0 ? usageRate + '%' : '—') + '</text>';
  h += '<text x="18" y="24" text-anchor="middle" font-size="3.5" fill="#94A3B8">已用 ' + actual + '</text>';
  h += '</svg>';
  h += '</div>';

  // Metrics
  var rows = [
    { label: '核定' + (type === 'career' ? '编制数' : '控制数'), value: quota },
    { label: '实有' + (type === 'career' ? '在编人数' : '控制数人数'), value: actual },
    { label: '空缺' + (type === 'career' ? '编制' : '控制数'), value: Math.max(0, quota - actual) },
    { label: '已批复计划数', value: approvedPlan },
    { label: '已使用计划数', value: usedPlan },
    { label: '未使用计划数', value: unusedPlan },
    { label: '可申请' + (type === 'career' ? '编制数' : '控制数'), value: available, highlight: true }
  ];
  rows.forEach(function(row) {
    var valColor = row.highlight ? (available <= 0 ? 'var(--danger)' : 'var(--primary)') : 'var(--text)';
    h += '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid #F1F5F9;">';
    h += '<span style="color:var(--text-secondary);">' + row.label + '</span>';
    h += '<span style="font-weight:500;color:' + valColor + ';">' + row.value + ' 人</span>';
    h += '</div>';
  });

  h += '</div>';
  return h;
}

// ===== SCHOOL SWITCHER =====
function resetCurrentSchool() {
  if (!confirm('确定要重置「' + currentSchool + '」的台账数据吗？重置后将回到未建立状态。')) return;
  var allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
  delete allLedgers[currentSchool];
  localStorage.setItem('org_ledger', JSON.stringify(allLedgers));
  ledger = null;
  isEditing = false;
  renderPage();
  showToast('台账数据已重置', 'success');
}

function switchSchool(schoolName) {
  currentSchool = schoolName;
  currentUser.schoolName = schoolName;
  localStorage.setItem('currentUser', JSON.stringify(currentUser));
  var allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
  ledger = allLedgers[currentSchool] || null;
  isEditing = false;
  renderSidebar();
  renderPage();
}

    authLeader: 0, actualLeader: 0, actualOtherLeader: 0,
    leaderBreakdown: { deptLevel:{auth:0,actual:0}, divisionLevel:{auth:0,actual:0}, sectionLevel:{auth:0,actual:0} },
    highlandPosts: 0,
    postBreakdown: { admin:{auth:0,actual:0}, tech:{auth:0,actual:0}, logistics:{auth:0,actual:0} },
    mgmtLevels: {'5':0,'6':0,'7':0,'8':0,'9':0,'10':0},
    profLevels: {
      senior: { total:0, levels:{'3':0,'4':0} },
      vice: { total:0, levels:{'5':0,'6':0,'7':0} },
      middle: { total:0, levels:{'8':0,'9':0,'10':0} },
      junior: { total:0, levels:{'11':0,'12':0,'13':0} }
    },

    status: 'pending',
    submittedAt: '',
    reviewedAt: '',
    reviewedBy: '',
    returnReason: '',
    updatedAt: new Date().toISOString().split('T')[0],
    updatedBy: currentUser.name || currentSchool
  };
  isEditing = true;
  renderPage();
  showToast('请填写全部字段后提交审核', 'info');
}

function submitLedger() {
  if (!ledger) return;

  // Basic validation
  if (!ledger.district) { showToast('请填写所属区域', 'warning'); return; }
  if (!ledger.schoolType) { showToast('请填写学校类型', 'warning'); return; }
  if (!ledger.orgLevel) { showToast('请填写机构级别', 'warning'); return; }
  if (!ledger.careerQuota && !ledger.controlQuota) { showToast('事业编制数和控制数至少填写一项', 'warning'); return; }

  document.getElementById('submitModal').classList.add('show');
}

function closeSubmitModal() {
  document.getElementById('submitModal').classList.remove('show');
}

function confirmSubmit() {
  document.getElementById('submitModal').classList.remove('show');

  ledger.status = 'pending';
  ledger.submittedAt = new Date().toISOString().split('T')[0];
  ledger.returnReason = '';
  ledger.updatedAt = new Date().toISOString().split('T')[0];
  ledger.updatedBy = currentUser.name || currentSchool;

  // Add to change log
  if (!ledger.changeLog) ledger.changeLog = [];
  var now = new Date();
  var ts = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  ledger.changeLog.push({
    type: 'submit',
    time: ts,
    operator: currentUser.name || currentSchool,
    action: '学校提交申报'
  });

  // Save to localStorage
  var allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
  allLedgers[currentSchool] = ledger;
  localStorage.setItem('org_ledger', JSON.stringify(allLedgers));

  isEditing = false;
  renderPage();
  showToast('台账已提交审核', 'success');
}

function startEdit() {
  isEditing = true;
  renderPage();
}

function cancelEdit() {
  isEditing = false;
  // If never submitted, discard the ledger (no draft state)
  if (ledger && !ledger.submittedAt) {
    var allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
    delete allLedgers[currentSchool];
    localStorage.setItem('org_ledger', JSON.stringify(allLedgers));
    ledger = null;
  } else {
    // Reload from storage for submitted ledgers
    var allLedgers2 = JSON.parse(localStorage.getItem('org_ledger') || '{}');
    ledger = allLedgers2[currentSchool] || null;
  }
  renderPage();
}

function saveEdit() {
  ledger.updatedAt = new Date().toISOString().split('T')[0];
  ledger.updatedBy = currentUser.name || currentSchool;

  var allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
  allLedgers[currentSchool] = ledger;
  localStorage.setItem('org_ledger', JSON.stringify(allLedgers));

  isEditing = false;
  renderPage();
  showToast('台账已更新', 'success');
}

// ===== UTILS =====
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success') + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function logout() {
  localStorage.removeItem('currentUser');
  window.location.href = 'index.html';
}

// ===== INIT =====
init();
</script>
</body>
</html>
