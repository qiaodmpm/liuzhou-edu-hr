.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; text-decoration: none; }

.status-badge.none { background: #F1F5F9; color: #94A3B8; }
.alert { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; display: flex; align-items: flex-start; gap: 8px; }
.alert-info { background: var(--primary-light); color: var(--primary); border: 1px solid #DBEAFE; }
.form-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 24px; margin-bottom: 20px; }

.modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 480px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
.modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

.toast.warning { background: var(--warning); }

/* Fieldset */
fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
legend { font-size: 13px; font-weight: 600; color: var(--primary); padding: 0 8px; }
/* Section title */
.section-title { font-size: 13px; font-weight: 600; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
/* Table number input */
.table-input-num { width: 80px; padding: 6px 8px; font-size: 12px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; text-align: center; }
.table-input-num:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
/* Page header layout */
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.page-header-left h1 { font-size: 20px; font-weight: 700; }
.page-header-left .subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.page-header-right { display: flex; gap: 8px; align-items: center; }
/* Two-column layout for edit/view with history sidebar */
.detail-layout { display: flex; gap: 24px; align-items: flex-start; }
.detail-main { flex: 1; min-width: 0; }

.side-history { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; position: sticky; top: 76px; }

.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.timeline-item { position: relative; padding-bottom: 16px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before { content: ''; position: absolute; left: -17px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--border); }

// ===== SIDEBAR =====
function renderSidebar() {

  var h = '';
  (cfg.sidebar.top||[]).forEach(function(item) {
    var icon = ICONS[item.icon] || '';
    var active = item.id === 'ledger';
    h += '<a class="menu-item' + (active ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + icon + item.label + '</a>';
  });
  (cfg.sidebar.groups||[]).forEach(function(group) {
    h += '<div class="menu-group">' + group.name + '</div>';
    (group.items||[]).forEach(function(item) {
      var icon = ICONS[MENU_ICONS[item.id]] || '';

// ===== COMPUTED =====
function getComputed(d) {
  var careerUnusedPlan = d.careerApprovedPlan - d.careerUsedPlan;
  var careerAvailable = d.careerQuota - d.careerActual - d.careerApprovedPlan;
  var controlUnusedPlan = d.controlApprovedPlan - d.controlUsedPlan;
  var controlAvailable = d.controlQuota - d.controlActual - d.controlApprovedPlan;
  var totalControlQuota = d.careerQuota + d.controlQuota;
  var totalPosts = totalControlQuota - (d.highlandPosts || 0);
  return { careerUnusedPlan:careerUnusedPlan, careerAvailable:careerAvailable, controlUnusedPlan:controlUnusedPlan, controlAvailable:controlAvailable, totalControlQuota:totalControlQuota, totalPosts:totalPosts };
}

function renderDetailLevelGrid(levels, keys) {
  var LABEL_MAP = { 'common': '普通工' };
  var h = '<div style="display:grid;grid-template-columns:repeat(' + keys.length + ', 1fr);gap:6px;font-size:12px;">';
  keys.forEach(function(k) {
    var label = LABEL_MAP[k] || (k + '级');
    var val = levels[k] || 0;
    h += '<div style="text-align:center;padding:6px 4px;border-radius:4px;background:var(--bg);"><div style="font-size:10px;color:var(--text-light);">' + label + '</div><div style="font-weight:600;color:var(--text);">' + val + '</div></div>';
  });
  h += '</div>';
  return h;
}

function selOptions(current, list) {
  var h = '<option value="">—</option>';
  list.forEach(function(v) { h += '<option value="' + v + '"' + (current===v?' selected':'') + '>' + v + '</option>'; });
  return h;
}

function init() {
  if (!schoolName) {

    renderSidebar();
    return;
  }
  var allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
  ledger = allLedgers[schoolName];
  if (!ledger) {
    document.getElementById('detailContent').innerHTML = '<div class="form-card"><div style="text-align:center;padding:40px;color:var(--text-light);">未找到「' + escapeHtml(schoolName) + '」的台账数据</div></div>';
    renderSidebar();
    return;
  }
  // District admin permission check
  var userDistrict = currentUser.district || '';
  if (currentUser.role === 'district' && userDistrict && ledger.district !== userDistrict) {
    document.getElementById('detailContent').innerHTML = '<div class="form-card"><div style="text-align:center;padding:60px 20px;"><div style="font-size:36px;margin-bottom:8px;">🔒</div><div style="font-size:14px;color:var(--text-secondary);">您无权查看该校的台账数据</div><div style="font-size:12px;color:var(--text-light);margin-top:4px;">所属区域：' + escapeHtml(ledger.district) + ' ｜ 您的辖区：' + escapeHtml(userDistrict) + '</div><div style="margin-top:16px;"><a class="btn btn-outline btn-sm" href="org-ledger-admin.html">← 返回列表</a></div></div></div>';
    renderSidebar();
    return;
  }

  document.getElementById('breadcrumbSchool').textContent = schoolName;
  backfillChangeLog();
  renderSidebar();
  renderDetail();
}

function backfillChangeLog() {
  if (!ledger) return;
  if (!ledger.changeLog) ledger.changeLog = [];
  if (ledger.changeLog.length > 0) return; // already has records

  // Reconstruct change log from status fields
  // 1. School submission
  if (ledger.submittedAt) {
    ledger.changeLog.push({
      type: 'submit',
      time: ledger.submittedAt + ' 00:00:00',
      operator: ledger.schoolName || '',
      action: '学校提交申报'
    });
  }
  // 2. Return (if any)
  if (ledger.returnReason) {
    ledger.changeLog.push({
      type: 'return',
      time: (ledger.updatedAt || ledger.submittedAt || '') + ' 00:00:00',
      operator: ledger.updatedBy || ledger.reviewedBy || '',
      action: '退回修改',
      reason: ledger.returnReason
    });
  }
  // 3. Approval (if approved)
  if (ledger.status === 'active' && ledger.reviewedAt) {
    ledger.changeLog.push({
      type: 'approve',
      time: ledger.reviewedAt + ' 00:00:00',
      operator: ledger.reviewedBy || '',
      action: '审核通过'
    });
  }
  // Save backfilled data
  if (ledger.changeLog.length > 0) {
    var allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
    allLedgers[schoolName] = ledger;
    localStorage.setItem('org_ledger', JSON.stringify(allLedgers));
  }
}

  h += '<tr><td style="padding:10px 12px;border-bottom:1px solid var(--border);">专业技术岗位</td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);"><input type="number" min="0" value="' + pb.tech.auth + '" onchange="ledger.postBreakdown.tech.auth=parseInt(this.value)||0" class="table-input-num"></td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);"><input type="number" min="0" value="' + pb.tech.actual + '" onchange="ledger.postBreakdown.tech.actual=parseInt(this.value)||0" class="table-input-num"></td></tr>';
  h += '<tr><td style="padding:10px 12px;">工勤技能岗位</td><td style="padding:8px 12px;text-align:center;"><input type="number" min="0" value="' + pb.logistics.auth + '" onchange="ledger.postBreakdown.logistics.auth=parseInt(this.value)||0" class="table-input-num"></td><td style="padding:8px 12px;text-align:center;"><input type="number" min="0" value="' + pb.logistics.actual + '" onchange="ledger.postBreakdown.logistics.actual=parseInt(this.value)||0" class="table-input-num"></td></tr>';
  h += '</table>';

  // Level distributions
  var mgmt = d.mgmtLevels || {};
  var pl = d.profLevels || {};
  var labor = d.laborLevels || {};

  h += '<fieldset style="margin-top:12px;"><legend>管理岗位等级分布</legend>';
  h += renderDetailLevelGrid(mgmt, ['5','6','7','8','9','10']);
  h += '</fieldset>';

  h += '<fieldset style="margin-top:12px;"><legend>专业技术岗位等级分布</legend>';
  h += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">';
  h += '正高级：' + (pl.senior?pl.senior.total:0) + '人 ｜ 副高级：' + (pl.vice?pl.vice.total:0) + '人 ｜ ';
  h += '中级：' + (pl.middle?pl.middle.total:0) + '人 ｜ 初级：' + (pl.junior?pl.junior.total:0) + '人';
  h += '</div>';
  h += '<div style="display:flex;gap:16px;flex-wrap:wrap;">';
  h += '<div style="flex:1;min-width:150px;"><div style="font-size:11px;color:var(--text-light);margin-bottom:4px;">正高级</div>' + renderDetailLevelGrid(pl.senior?pl.senior.levels:{}, ['3','4']) + '</div>';
  h += '<div style="flex:1;min-width:150px;"><div style="font-size:11px;color:var(--text-light);margin-bottom:4px;">副高级</div>' + renderDetailLevelGrid(pl.vice?pl.vice.levels:{}, ['5','6','7']) + '</div>';
  h += '<div style="flex:1;min-width:150px;"><div style="font-size:11px;color:var(--text-light);margin-bottom:4px;">中级</div>' + renderDetailLevelGrid(pl.middle?pl.middle.levels:{}, ['8','9','10']) + '</div>';
  h += '<div style="flex:1;min-width:150px;"><div style="font-size:11px;color:var(--text-light);margin-bottom:4px;">初级</div>' + renderDetailLevelGrid(pl.junior?pl.junior.levels:{}, ['11','12','13']) + '</div>';
  h += '</div>';
  h += '</fieldset>';

  h += '<fieldset style="margin-top:12px;"><legend>工勤技能岗位等级分布</legend>';
  h += renderDetailLevelGrid(labor, ['1','2','3','4','5','common']);
  h += '</fieldset>';

  h += '</div>';

  // ===== 领导职数 =====
  h += '<div class="form-card">';
  h += '<h2><span class="card-icon">👤</span>领导职数</h2>';
  h += '<div class="form-row">';
  h += '<div class="form-group"><label>核定领导职数</label><input type="number" min="0" value="' + d.authLeader + '" onchange="ledger.authLeader=parseInt(this.value)||0"' + (canEdit ? '' : ' readonly') + '></div>';
  h += '<div class="form-group"><label>实配领导人数</label><input type="number" min="0" value="' + d.actualLeader + '" onchange="ledger.actualLeader=parseInt(this.value)||0"' + (canEdit ? '' : ' readonly') + '></div>';
  h += '<div class="form-group"><label>实配非领导人数</label><input type="number" min="0" value="' + d.actualOtherLeader + '" onchange="ledger.actualOtherLeader=parseInt(this.value)||0"' + (canEdit ? '' : ' readonly') + '></div>';
  h += '</div>';
  var lb = d.leaderBreakdown || { deptLevel:{auth:0,actual:0}, divisionLevel:{auth:0,actual:0}, sectionLevel:{auth:0,actual:0} };
  h += '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
  h += '<tr style="background:var(--bg);"><th style="padding:10px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--text-secondary);border-bottom:1px solid var(--border);">级别</th><th style="padding:10px 12px;text-align:center;font-weight:600;font-size:11px;color:var(--text-secondary);border-bottom:1px solid var(--border);">核定职数</th><th style="padding:10px 12px;text-align:center;font-weight:600;font-size:11px;color:var(--text-secondary);border-bottom:1px solid var(--border);">实配人数</th></tr>';
  h += '<tr><td style="padding:10px 12px;border-bottom:1px solid var(--border);">厅级</td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);"><input type="number" min="0" value="' + lb.deptLevel.auth + '" onchange="ledger.leaderBreakdown.deptLevel.auth=parseInt(this.value)||0" class="table-input-num"></td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);"><input type="number" min="0" value="' + lb.deptLevel.actual + '" onchange="ledger.leaderBreakdown.deptLevel.actual=parseInt(this.value)||0" class="table-input-num"></td></tr>';
  h += '<tr><td style="padding:10px 12px;border-bottom:1px solid var(--border);">处级</td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);"><input type="number" min="0" value="' + lb.divisionLevel.auth + '" onchange="ledger.leaderBreakdown.divisionLevel.auth=parseInt(this.value)||0" class="table-input-num"></td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);"><input type="number" min="0" value="' + lb.divisionLevel.actual + '" onchange="ledger.leaderBreakdown.divisionLevel.actual=parseInt(this.value)||0" class="table-input-num"></td></tr>';
  h += '<tr><td style="padding:10px 12px;">科级</td><td style="padding:8px 12px;text-align:center;"><input type="number" min="0" value="' + lb.sectionLevel.auth + '" onchange="ledger.leaderBreakdown.sectionLevel.auth=parseInt(this.value)||0" class="table-input-num"></td><td style="padding:8px 12px;text-align:center;"><input type="number" min="0" value="' + lb.sectionLevel.actual + '" onchange="ledger.leaderBreakdown.sectionLevel.actual=parseInt(this.value)||0" class="table-input-num"></td></tr>';
  h += '</table>';
  h += '</div>';

  // Close main column
  h += '</div>'; // close detail-main

  // Change log sidebar
  h += '<div class="detail-side">';
  h += renderChangeLog();
  h += '</div>';

  h += '</div>'; // close detail-layout

  // Bottom action bar
  if (isReviewing) {
    h += '<div class="submit-bar">';
    h += '<span></span>';
    h += '<div style="display:flex;gap:8px;">';
    h += '<button class="btn btn-danger" onclick="openReturnModal()">退回修改</button>';
    h += '<button class="btn btn-success" onclick="approveLedger()">审核通过</button>';
    h += '</div>';
    h += '</div>';
  } else if (isEditing) {
    h += '<div class="submit-bar">';
    h += '<a class="btn btn-outline" href="org-ledger-detail.html?school=' + encodeURIComponent(schoolName) + '&mode=view">取消编辑</a>';
    h += '<button class="btn btn-primary" onclick="openEditModal()">保存修改</button>';
    h += '</div>';
  }

  document.getElementById('detailContent').innerHTML = h;
}

// ===== ACTIONS =====
function saveLedger() {
  var allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
  allLedgers[schoolName] = JSON.parse(JSON.stringify(ledger));
  localStorage.setItem('org_ledger', JSON.stringify(allLedgers));
}

function approveLedger() {
  ledger.status = 'active';
  ledger.reviewedAt = new Date().toISOString().split('T')[0];
  ledger.reviewedBy = currentUser.name || '管理员';
  ledger.returnReason = '';
  ledger.updatedAt = new Date().toISOString().split('T')[0];
  ledger.updatedBy = currentUser.name || '管理员';
  addChangeLogEntry({
    type: 'approve',
    operator: currentUser.name || '管理员',
    action: '审核通过'
  });
  saveLedger();
  pageMode = 'view';
  renderDetail();
  showToast(schoolName + ' 台账审核已通过', 'success');
}

function updateComputedFields() {
  var comp = getComputed(ledger);
  var elT = document.getElementById('fldTotalControlQuota');
  var elP = document.getElementById('fldTotalPosts');
  if (elT) elT.value = comp.totalControlQuota;
  if (elP) elP.value = comp.totalPosts;
}

// ===== CHANGE LOG =====
function initChangeLog() {
  if (!ledger.changeLog) ledger.changeLog = [];
}

function addChangeLogEntry(entry) {
  initChangeLog();
  var now = new Date();
  var ts = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  entry.time = ts;
  ledger.changeLog.push(entry);
}

function buildChanges(original, updated) {
  var numericFields = ['careerQuota','careerActual','careerApprovedPlan','careerUsedPlan',
    'controlQuota','controlActual','controlApprovedPlan','controlUsedPlan',
    'authLeader','actualLeader','actualOtherLeader','highlandPosts'];
  var changes = {};
  numericFields.forEach(function(key) {
    if (original[key] !== updated[key]) {
      changes[key] = { old: original[key], new: updated[key] };
    }
  });
  return changes;
}

function fieldLabelMap(key) {
  var map = {
    careerQuota:'核定编制数', careerActual:'实有在编人数', careerApprovedPlan:'已批复计划数', careerUsedPlan:'已使用计划数',
    controlQuota:'核定控制数', controlActual:'实有控制数', controlApprovedPlan:'已批复控制数', controlUsedPlan:'已使用控制数',
    authLeader:'核定领导职数', actualLeader:'实配领导人数', actualOtherLeader:'实配非领导人数', highlandPosts:'小高地岗位数'
  };
  return map[key] || key;
}

function renderChangeLog() {
  initChangeLog();
  // Sort by time ascending
  ledger.changeLog.sort(function(a, b) { return (a.time||'').localeCompare(b.time||''); });
  var h = '<div class="side-history">';
  h += '<h4>变更记录</h4>';
  if (ledger.changeLog.length === 0) {
    h += '<div style="font-size:12px;color:var(--text-light);text-align:center;padding:20px 0;">暂无变更记录</div>';
  } else {
    h += '<div class="timeline">';
    ledger.changeLog.forEach(function(entry) {
      var cls = entry.type || 'edit';
      h += '<div class="timeline-item ' + cls + '">';
      h += '<div class="tl-time">' + (entry.time||'') + '</div>';
      h += '<div class="tl-action">' + escapeHtml(entry.operator||'') + ' ' + (entry.action||'编辑台账') + '</div>';
      if (entry.reason) {
        h += '<div class="tl-reason">' + escapeHtml(entry.reason) + '</div>';
      }
      if (entry.changes && Object.keys(entry.changes).length > 0) {
        var changeItems = [];
        Object.keys(entry.changes).forEach(function(k) {
          var c = entry.changes[k];
          if (c.old !== c.new) {
            changeItems.push(fieldLabelMap(k) + '：' + c.old + ' → ' + c.new);
          }
        });
        if (changeItems.length > 0) {
          h += '<div class="tl-changes">' + changeItems.join('<br>') + '</div>';
        }
      }
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

// ===== EDIT SAVE FLOW =====
var originalLedger = null;

function openEditModal() {
  originalLedger = JSON.parse(JSON.stringify(ledger));
  document.getElementById('editReasonInput').value = '';
  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  originalLedger = null;
}

function confirmSaveEdit() {
  var reason = document.getElementById('editReasonInput').value.trim();
  if (!reason) { showToast('请填写修改原因', 'warning'); return; }

  var changes = originalLedger ? buildChanges(originalLedger, ledger) : {};

  addChangeLogEntry({
    type: 'edit',
    operator: currentUser.name || '管理员',
    action: '编辑台账',
    reason: reason,
    changes: changes
  });

  ledger.updatedAt = new Date().toISOString().split('T')[0];
  ledger.updatedBy = currentUser.name || '管理员';
  saveLedger();
  closeEditModal();
  pageMode = 'view';
  renderDetail();
  showToast('台账修改已保存', 'success');
}

function openReturnModal() {
  document.getElementById('returnReasonInput').value = '';
  document.getElementById('returnModal').classList.add('show');
}
function closeReturnModal() {
  document.getElementById('returnModal').classList.remove('show');
}
function confirmReturn() {
  var reason = document.getElementById('returnReasonInput').value.trim();
  if (!reason) { showToast('请填写退回原因', 'warning'); return; }
  ledger.returnReason = reason;
  ledger.updatedAt = new Date().toISOString().split('T')[0];
  ledger.updatedBy = currentUser.name || '管理员';
  addChangeLogEntry({
    type: 'return',
    operator: currentUser.name || '管理员',
    action: '退回修改',
    reason: reason
  });
  saveLedger();
  closeReturnModal();
  renderDetail();
  showToast('台账已退回至学校修改', 'success');
}


// ===== UTILS =====
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type||'success') + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function logout() {
  localStorage.removeItem('currentUser');
  window.location.href = 'index.html';
}

// ===== INIT =====
init();
</script>
