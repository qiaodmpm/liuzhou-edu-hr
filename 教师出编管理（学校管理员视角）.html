<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>柳州教育人事管理平台 — 教师出编管理（学校）</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 12px; }
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}

.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column;
}
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
  margin-top: auto;
}
.role-switcher-label {
  font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;
  margin-bottom: 8px; padding: 0 4px;
}
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px);
}
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

.two-column-layout { display: flex; gap: 24px; }
.left-panel { width: 320px; flex-shrink: 0; }
.right-panel { flex: 1; min-width: 0; }

.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid #f0f2f5;
  font-weight: 600; font-size: 14px;
  display: flex; justify-content: space-between; align-items: center;
}
.batch-filter { padding: 14px 20px; border-bottom: 1px solid #f0f2f5; }
.batch-filter select {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-family: inherit;
}
.batch-list { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; padding: 14px; }
.batch-card {
  background: #fff; border-radius: 12px; padding: 16px 18px;
  border: 1.5px solid var(--border); cursor: pointer; transition: 0.15s;
}
.batch-card:hover { border-color: #93c5fd; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.batch-card.active { border-color: var(--primary); background: #EFF6FF; }
.batch-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.batch-card-name { font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; }
.batch-card-name:hover { color: var(--primary); }
.batch-card-status {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 10px; font-weight: 500; flex-shrink: 0;
}
.batch-card-status.active { background: #EFF6FF; color: var(--primary); }
.batch-card-status.closed { background: #F1F5F9; color: #64748B; }
.batch-card-meta { font-size: 11px; color: var(--text-light); margin-bottom: 10px; }
.batch-card-progress { margin-bottom: 2px; }
.batch-card-progress-bar { height: 6px; background: #E2E8F0; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
.batch-card-progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.3s; }
.batch-card-progress-text { font-size: 11px; color: var(--text-secondary); }

.tab-bar {
  display: flex; gap: 8px; padding: 12px 20px 0 20px;
  flex-wrap: wrap; border-bottom: 1px solid var(--border);
}
.tab-btn {
  padding: 6px 16px; border-radius: 30px; font-size: 12px;
  cursor: pointer; background: var(--gray-bg); color: var(--text-secondary);
  border: none; font-family: inherit; transition: all 0.2s;
}
.tab-btn.active { background: var(--primary); color: #fff; }
.tab-count { margin-left: 6px; font-size: 11px; }

.data-table { padding: 0 20px 20px 20px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: center; padding: 10px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--text-secondary); font-weight: 600; background-color: #FAFBFC; }

.status-badge {
  padding: 4px 10px; border-radius: 30px; font-size: 11px; display: inline-block;
}
.status-pending { background: #FEF3C7; color: #B45309; }
.status-approved { background: #D1FAE5; color: #065F46; }
.status-rejected { background: #FEE2E2; color: #991B1B; }

.action-link { color: var(--accent); cursor: pointer; margin: 0 4px; font-size: 12px; display: inline-block; }
.action-link:hover { text-decoration: underline; }
.reject-reason { font-size: 11px; color: #991B1B; margin-top: 2px; }

.list-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-top: 1px solid #f0f2f5;
}
.btn-primary-sm {
  background: var(--primary); color: #fff; border: none;
  padding: 6px 16px; border-radius: 30px; font-size: 12px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  font-family: inherit;
}
.btn-primary-sm:hover { background: var(--primary-dark); }

.pagination { display: flex; gap: 6px; align-items: center; }
.page-btn {
  padding: 6px 12px; border: 1px solid var(--border);
  background: #fff; border-radius: 6px; cursor: pointer;
  font-size: 12px; font-family: inherit;
}
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: flex-start;
  justify-content: center; z-index: 1000; padding-top: 40px;
  overflow-y: auto;
}
.modal-container {
  background: #fff; border-radius: 16px; width: 680px;
  max-width: 92%; padding: 24px; box-shadow: var(--shadow-lg);
  margin-bottom: 40px;
}
.modal-container h3 { margin-bottom: 16px; font-size: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.form-group input, .form-group select, .form-group textarea, .readonly-field {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-family: inherit;
}
.form-group textarea { resize: vertical; }
.readonly-field { background: #F8FAFC; color: var(--text-secondary); }
.form-row { display: flex; gap: 16px; }
.form-row .form-group { flex: 1; }
.modal-buttons { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
.btn-cancel {
  background: var(--gray-bg); border: none; padding: 8px 20px;
  border-radius: 30px; font-size: 13px; cursor: pointer; font-family: inherit;
}
.btn-submit {
  background: var(--primary); color: #fff; border: none;
  padding: 8px 24px; border-radius: 30px; cursor: pointer; font-size: 13px;
  font-family: inherit;
}
.btn-submit:hover { background: var(--primary-dark); }

/* Material checklist */
.material-section {
  border: 1px solid var(--border); border-radius: var(--radius); padding: 12px;
  margin-top: 8px; background: #FAFBFC;
}
.material-section h4 { font-size: 13px; margin-bottom: 10px; }
.material-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid #edf2f7;
}
.material-item:last-child { border-bottom: none; }
.material-info { flex: 1; }
.material-name { font-size: 12px; font-weight: 500; }
.material-req { font-size: 11px; color: var(--text-secondary); }
.upload-btn {
  padding: 4px 12px; border: 1px dashed var(--border); border-radius: 6px;
  font-size: 11px; cursor: pointer; background: #fff; color: var(--text-secondary);
  font-family: inherit;
}
.upload-btn.uploaded { border-color: var(--success); color: var(--success); background: #F0FDF4; }
.upload-btn:hover { border-color: var(--accent); color: var(--accent); }

.toast-msg {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px;
  border-radius: 40px; z-index: 2000; font-size: 13px;
  animation: toastAnim 1.8s ease forwards;
}
@keyframes toastAnim {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
  15% { opacity: 1; transform: translateX(-50%) translateY(0); }
  85% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
}
</style>
</head>

  document.body.insertAdjacentHTML('beforeend', modalHtml);

      app.submitTime = new Date().toISOString().slice(0, 19).replace('T', ' ');
    } else {
      var newId = Math.max.apply(null, schoolApps.map(function(a) { return a.id; })) + 1;
      schoolApps.push({
        id: newId, teacherName: teacherName, gender: gender, idCard: idCard, position: position,
        staffingType: staffingType, exitForm: exitForm, basisDoc: basisDoc,
        staffingBook: staffingBook, rosterSeq: rosterSeq, remark: remark,
        status: "待审批", submitTime: new Date().toISOString().slice(0, 19).replace('T', ' '),
        rejectReason: null, materials: uploadedNames
      });
    }

    document.getElementById("newAppModal").remove();
    showToast(isEdit ? "已重新提交" : "出编申请已提交");
    renderPage();
  };
}

// ==================== MAIN PAGE ====================
function renderPage() {
  var mainContent = document.getElementById("mainContent");
  var year = document.getElementById("batchYearFilter") ? document.getElementById("batchYearFilter").value : "2026";
  var filteredBatches = batches.filter(function(b) { return b.year === year; });
  var counts = getStatusCounts();

  var batchListHtml = filteredBatches.map(function(b) {
    var isActive = currentBatchId === b.id ? " active" : "";
    var ratio = b.total > 0 ? Math.round(b.submitted / b.total * 100) : 0;
    var isClosed = new Date(b.applyEnd.replace(/-/g, '/')) < new Date();
    var statusClass = isClosed ? 'closed' : 'active';
    var statusText = isClosed ? '已结束' : '进行中';
    return '<div class="batch-card' + isActive + '" data-id="' + b.id + '">' +
      '<div class="batch-card-header">' +
        '<span class="batch-card-name">' + b.name + '</span>' +
        '<span class="batch-card-status ' + statusClass + '">' + statusText + '</span>' +
      '</div>' +
      '<div class="batch-card-meta">' + b.id + ' | ' + b.createdAt + '</div>' +
      '<div class="batch-card-progress">' +
        '<div class="batch-card-progress-bar"><div class="batch-card-progress-fill" style="width:' + ratio + '%"></div></div>' +
        '<div class="batch-card-progress-text">申报进度：' + b.submitted + '/' + b.total + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  var tabs = ["全部", "待审批", "已通过", "已驳回"];
  var tabsHtml = tabs.map(function(tab) {
    return '<button class="tab-btn' + (currentTab === tab ? ' active' : '') + '" data-tab="' + tab + '">' +
      tab + '<span class="tab-count">(' + (counts[tab] || 0) + ')</span></button>';
  }).join('');

  var filteredApps = getFilteredApps();
  var start = (currentPage - 1) * pageSize;
  var pageApps = filteredApps.slice(start, start + pageSize);
  var totalPages = Math.ceil(filteredApps.length / pageSize);

  var tableRows = pageApps.map(function(app, idx) {
    var statusClass = app.status === "待审批" ? "status-pending" : (app.status === "已通过" ? "status-approved" : "status-rejected");
    var actionHtml = '';
    if (app.status === "待审批") {
      actionHtml = '<span class="action-link" onclick="handleView(' + app.id + ')">查看</span>';
    } else if (app.status === "已驳回") {
      actionHtml = '<span class="action-link" onclick="handleResubmit(' + app.id + ')">重新提交</span><span class="action-link" onclick="handleView(' + app.id + ')">查看</span>';
    } else {
      actionHtml = '<span class="action-link" onclick="handleView(' + app.id + ')">查看</span>';
    }
    return '<tr>' +
      '<td>' + (start + idx + 1) + '</td>' +
      '<td>' + app.teacherName + '</td>' +
      '<td>' + app.gender + '</td>' +
      '<td>' + app.idCard + '</td>' +
      '<td>' + app.exitForm + '</td>' +
      '<td><span class="status-badge ' + statusClass + '">' + app.status + '</span>' +
        (app.rejectReason ? '<div class="reject-reason">' + app.rejectReason + '</div>' : '') + '</td>' +
      '<td>' + app.submitTime + '</td>' +
      '<td>' + actionHtml + '</td>' +
    '</tr>';
  }).join('');

  var paginationHtml = '';
  if (totalPages > 1) {
    var pagesHtml = '';
    for (var i = 1; i <= totalPages; i++) {
      pagesHtml += '<button class="page-btn' + (currentPage === i ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
    }
    paginationHtml =
      '<div class="pagination">' +
        '<button class="page-btn" ' + (currentPage === 1 ? 'disabled' : '') + ' id="prevPage">上一页</button>' +
        pagesHtml +
        '<button class="page-btn" ' + (currentPage === totalPages ? 'disabled' : '') + ' id="nextPage">下一页</button>' +
      '</div>';
  }

  var fullHtml =
    '<div class="two-column-layout">' +
      '<div class="left-panel">' +
        '<div class="card">' +
          '<div class="card-header">出编批次</div>' +
          '<div class="batch-filter">' +
            '<select id="batchYearFilter">' +
              '<option value="2026"' + (year === '2026' ? ' selected' : '') + '>2026年</option>' +
              '<option value="2025"' + (year === '2025' ? ' selected' : '') + '>2025年</option>' +
            '</select>' +
          '</div>' +
          '<div class="batch-list" id="batchList">' + batchListHtml + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="right-panel">' +
        '<div class="card">' +
          '<div class="card-header">' +
            '<span>出编申请列表</span>' +
            '<button class="btn-primary-sm" id="newAppBtn">+ 新建出编申请</button>' +
          '</div>' +
          '<div class="tab-bar">' + tabsHtml + '</div>' +
          '<div class="data-table">' +
            '<table>' +
              '<thead><tr><th>序号</th><th>教师姓名</th><th>性别</th><th>身份证号</th><th>减员形式</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead>' +
              '<tbody>' + (tableRows || '<tr><td colspan="8" style="text-align:center;">暂无数据</td></tr>') + '</tbody>' +
            '</table>' +
          '</div>' +
          '<div class="list-footer">' +
            '<div></div>' +
            paginationHtml +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  mainContent.innerHTML = fullHtml;

  document.querySelectorAll('.batch-card').forEach(function(el) {
    el.addEventListener('click', function() {
      currentBatchId = el.dataset.id;
      currentTab = "全部"; currentPage = 1; renderPage();
    });
  });

  document.getElementById("batchYearFilter").addEventListener('change', function() {
    var newYear = this.value;
    var firstBatch = batches.find(function(b) { return b.year === newYear; });
    if (firstBatch) currentBatchId = firstBatch.id;
    currentTab = "全部"; currentPage = 1; renderPage();
  });

  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      currentTab = btn.dataset.tab; currentPage = 1; renderPage();
    });
  });

  document.querySelectorAll('[data-page]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      currentPage = parseInt(e.target.dataset.page); renderPage();
    });
  });

  var prevBtn = document.getElementById("prevPage");
  if (prevBtn) prevBtn.addEventListener('click', function() { if (currentPage > 1) { currentPage--; renderPage(); } });
  var nextBtn = document.getElementById("nextPage");
  if (nextBtn) nextBtn.addEventListener('click', function() { if (currentPage < totalPages) { currentPage++; renderPage(); } });

  var newAppBtn = document.getElementById("newAppBtn");
  if (newAppBtn) newAppBtn.addEventListener('click', function() { showNewAppModal(); });
}

window.handleView = function(appId) {
  window.location.href = '教师出编详情-学校申请.html?id=' + appId;
};
window.handleResubmit = function(appId) {
  var app = schoolApps.find(function(a) { return a.id === appId; });
  if (app) showNewAppModal(app);
};

// ===== Init =====
renderSidebar();
renderPage();
</script>
</body>
</html>
