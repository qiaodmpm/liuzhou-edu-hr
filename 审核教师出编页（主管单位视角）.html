<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>柳州教育人事管理平台 — 审核教师出编</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 12px; }
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}

.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column;
}
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
  margin-top: auto;
}
.role-switcher-label {
  font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;
  margin-bottom: 8px; padding: 0 4px;
}
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px);
}
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

.two-columns { display: flex; gap: 24px; align-items: flex-start; }
.main-col { flex: 1; min-width: 0; }
.side-col { width: 360px; flex-shrink: 0; }

.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid #f0f2f5;
  font-weight: 600; font-size: 14px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px; background-color: #FAFBFC;
}

/* Progress bar */
.progress-container { padding: 20px; }
.progress-steps { display: flex; justify-content: space-between; align-items: flex-start; }
.progress-node { flex: 1; text-align: center; }
.progress-node .node-dot {
  width: 36px; height: 36px; background: #e2e8f0; border-radius: 50%;
  margin: 0 auto 8px; line-height: 36px; font-size: 14px;
  font-weight: 600; color: #64748B;
}
.progress-node.completed .node-dot { background: #10B981; color: white; }
.progress-node.active .node-dot { background: var(--primary); color: white; }
.progress-node .node-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.progress-node .node-detail { font-size: 10px; color: var(--text-secondary); }

/* Timeline */
.timeline { position: relative; padding-left: 30px; }
.timeline-item {
  position: relative; padding-bottom: 20px;
  border-left: 2px solid #e2e8f0; margin-left: 12px; padding-left: 20px;
}
.timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline-dot {
  position: absolute; left: -9px; top: 0;
  width: 16px; height: 16px; border-radius: 50%;
  background: white; border: 2px solid #cbd5e1;
}
.timeline-item.completed .timeline-dot { background: #10B981; border-color: #10B981; }
.timeline-time { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.timeline-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.timeline-desc { font-size: 11px; color: #475569; }

/* Stamp */
.status-stamp {
  display: inline-block; padding: 6px 16px; border: 2px solid;
  transform: rotate(-5deg); font-weight: 700; font-size: 14px; background: white;
}
.status-stamp.approved { color: #10B981; border-color: #10B981; }
.status-stamp.rejected { color: #EF4444; border-color: #EF4444; }
.status-stamp.pending { color: #F59E0B; border-color: #F59E0B; }

/* Unit info */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; }
.info-item { background: #F8FAFC; padding: 12px; border-radius: var(--radius); }
.info-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.info-value { font-size: 13px; font-weight: 500; }

/* Stats cards */
.stats-row { display: flex; gap: 20px; margin: 0 20px 20px 20px; }
.stats-card {
  flex: 1; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
}
.stats-card-header {
  background: #F8FAFC; padding: 12px 16px; font-weight: 700; font-size: 13px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.stats-card-header .total-number { font-size: 18px; color: var(--primary); }
.three-col-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.three-col-table th, .three-col-table td {
  border-bottom: 1px solid var(--border); padding: 8px 10px;
  text-align: left; vertical-align: top;
}
.three-col-table th { background: #FAFBFC; font-weight: 600; width: 33%; }
.three-col-table tr:last-child td { border-bottom: none; }

/* Control quota stats */
.control-stats {
  display: flex; gap: 16px; padding: 0 20px 20px 20px;
}
.control-item {
  flex: 1; text-align: center; background: #F8FAFC;
  padding: 12px; border-radius: var(--radius); border: 1px solid var(--border);
}
.control-label { font-size: 11px; color: var(--text-secondary); }
.control-number { font-size: 16px; font-weight: 700; color: var(--primary); margin-top: 4px; }

/* 附件8 table */
.form-table { padding: 0 20px 20px 20px; overflow-x: auto; }
.form-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
.form-table th, .form-table td {
  text-align: center; padding: 10px 6px; border: 1px solid var(--border);
}
.form-table th { color: var(--text-secondary); font-weight: 600; background-color: #FAFBFC; white-space: nowrap; }
.form-table .opinion-cell { height: 60px; vertical-align: middle; color: var(--text-secondary); font-size: 11px; }

/* Materials list */
.material-list { padding: 0 20px 20px 20px; }
.material-list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid #edf2f7;
}
.material-list-item:last-child { border-bottom: none; }
.material-name { font-size: 13px; font-weight: 500; }
.material-req { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.material-status { font-size: 11px; }
.material-status.uploaded { color: #10B981; }

/* Review actions */
.review-actions {
  display: flex; gap: 16px; padding: 20px; border-top: 1px solid #f0f2f5;
  justify-content: center;
}
.btn-approve {
  background: #10B981; color: #fff; border: none;
  padding: 10px 32px; border-radius: 30px; font-size: 14px;
  cursor: pointer; font-family: inherit; font-weight: 500;
}
.btn-approve:hover { background: #059669; }
.btn-reject {
  background: #fff; color: #EF4444; border: 1px solid #EF4444;
  padding: 10px 32px; border-radius: 30px; font-size: 14px;
  cursor: pointer; font-family: inherit; font-weight: 500;
}
.btn-reject:hover { background: #FEF2F2; }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center;
  justify-content: center; z-index: 1000;
}
.modal-container {
  background: #fff; border-radius: 16px; width: 500px;
  max-width: 90%; padding: 24px; box-shadow: var(--shadow-lg);
}
.modal-container h3 { margin-bottom: 16px; font-size: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.form-group textarea {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-family: inherit; resize: vertical;
}
.modal-buttons { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
.btn-cancel {
  background: var(--gray-bg); border: none; padding: 8px 20px;
  border-radius: 30px; font-size: 13px; cursor: pointer; font-family: inherit;
}
.btn-confirm-danger {
  background: #EF4444; color: #fff; border: none;
  padding: 8px 24px; border-radius: 30px; cursor: pointer; font-size: 13px; font-family: inherit;
}
.btn-confirm-danger:hover { background: #DC2626; }

/* Toast */
.toast-msg {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px;
  border-radius: 40px; z-index: 2000; font-size: 13px;
  animation: toastAnim 1.8s ease forwards;
}
@keyframes toastAnim {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
  15% { opacity: 1; transform: translateX(-50%) translateY(0); }
  85% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
}
</style>
</head>

// ==================== SIDEBAR ====================
function renderSidebar() {
  var data = ROLES[currentRole].sidebar;
  var html = '';
  data.top.forEach(function(item) {
    html += '<a class="menu-item" onclick="sidebarClick(\'' + item.id + '\')">';
    html += ICONS[item.icon];
    html += '<span>' + item.label + '</span></a>';
  });
  data.groups.forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      var isActive = item.id === 'exit';
      html += '<a class="menu-item' + (isActive ? ' active' : '') + '" onclick="sidebarClick(\'' + item.id + '\')">';
      html += ICONS[MENU_ICONS[item.id] || 'file'];
      html += '<span>' + item.label + '</span></a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
}

function updateUserInfo() {
  var role = ROLES[currentRole];
  var roleLabel = currentRole === 'city' ? '市管理员' : currentRole === 'district' ? '区管理员' : currentRole === 'school' ? '校管理员' : '教师';
  var avatarEl = document.querySelector('.topnav-user .avatar');
  var nameEl = document.querySelector('.topnav-user span');
  if (avatarEl) avatarEl.textContent = role.short;
  if (nameEl) nameEl.textContent = role.name + ' · ' + roleLabel;
}

function updateRoleUI() {
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === currentRole);
  });
  updateUserInfo();
  renderSidebar();
}

function switchRole(role) {
  if (role === 'city' || role === 'district') {
    if (currentRole !== role) {
      currentRole = role;
      updateRoleUI();
    }
    return;
  }
  if (role === 'school') { window.location.href = '教师出编管理（学校管理员视角）.html'; return; }
  window.location.href = 'workbench.html';
}

function sidebarClick(id) {
  if (id === 'workbench') { window.location.href = 'workbench.html'; }
  else if (id === 'staffing') { window.location.href = 'staffing-application.html'; }
  else if (id === 'exit') { window.location.href = '教师出编管理（主管单位视角）.html'; }
  else if (id === 'entry') { window.location.href = '教师入编管理（主管单位视角）.html'; }
  else { showToast('跳转至：' + id); }
}

function showToast(message, callback) {
  var toast = document.createElement('div');
  toast.className = 'toast-msg';
  toast.innerText = message;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); if (callback) callback(); }, 1500);
}

// ==================== REVIEW ACTIONS ====================
function handleApprove() {
  app.status = '已通过';
  app.rejectReason = null;
  var now = new Date().toISOString().slice(0, 19).replace('T', ' ');
  app.timeline.push({
    time: now, operator: '李振华', action: '主管单位审核通过',
    opinion: '材料齐全，符合出编条件，同意核减', result: '通过'
  });
  showToast('已通过审批', function() {
    window.location.href = '教师出编管理（主管单位视角）.html';
  });
}

function handleReject() {
  var modalHtml =
    '<div class="modal-overlay" id="rejectModal">' +
      '<div class="modal-container">' +
        '<h3>驳回出编申请</h3>' +
        '<div class="form-group">' +
          '<label>驳回理由 <span style="color:red;">*</span></label>' +
          '<textarea id="rejectReason" rows="4" placeholder="请填写驳回理由，以便学校重新申报时参考..."></textarea>' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelReject">取消</button>' +
          '<button class="btn-confirm-danger" id="confirmReject">确认驳回</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('cancelReject').onclick = function() { document.getElementById('rejectModal').remove(); };
  document.getElementById('confirmReject').onclick = function() {
    var reason = document.getElementById('rejectReason').value.trim();
    if (!reason) { showToast('请填写驳回理由'); return; }
    app.status = '已驳回';
    app.rejectReason = reason;
    var now = new Date().toISOString().slice(0, 19).replace('T', ' ');
    app.timeline.push({
      time: now, operator: '李振华', action: '主管单位审核驳回',
      opinion: reason, result: '驳回'
    });
    document.getElementById('rejectModal').remove();
    showToast('已驳回', function() {
      window.location.href = '教师出编管理（主管单位视角）.html';
    });
  };
}

function renderPage() {

  var progressNodes = [
    { title: '学校提交', detail: app.submitTime, status: 'completed' },
    { title: '主管单位审核', detail: '', status: 'pending' },
    { title: '审核完成', detail: '', status: 'pending' }
  ];

  if (app.status === '已通过') {
    progressNodes[1] = { title: '主管单位审核', detail: app.timeline.length >= 2 ? app.timeline[1].time : '审核通过', status: 'completed' };
    progressNodes[2] = { title: '审核完成', detail: '审批通过', status: 'completed' };
  } else if (app.status === '已驳回') {
    progressNodes[1] = { title: '主管单位审核', detail: '审核驳回', status: 'completed' };
    progressNodes[2] = { title: '审核完成', detail: app.rejectReason || '已驳回', status: 'completed' };
  }

  var getNodeClass = function(status) { return status === 'completed' ? 'completed' : (status === 'active' ? 'active' : ''); };
  var getNodeIcon = function(status) { return status === 'completed' ? '✓' : (status === 'active' ? '●' : '○'); };

  var progressHtml =
    '<div class="card">' +
      '<div class="card-header">审批进度</div>' +
      '<div class="progress-container">' +
        '<div class="progress-steps">' +
          progressNodes.map(function(node) {
            return '<div class="progress-node ' + getNodeClass(node.status) + '">' +
              '<div class="node-dot">' + getNodeIcon(node.status) + '</div>' +
              '<div class="node-title">' + node.title + '</div>' +
              '<div class="node-detail">' + node.detail + '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +
    '</div>';

  // Status stamp
  var stampClass = app.status === '已通过' ? 'approved' : (app.status === '已驳回' ? 'rejected' : 'pending');
  var stampText = app.status === '已通过' ? '审批通过' : (app.status === '已驳回' ? '审核驳回' : '待审核');
  var statusStamp = '<div class="status-stamp ' + stampClass + '">' + stampText + '</div>';

  // Timeline
  var timelineHtml =
    '<div class="card">' +
      '<div class="card-header">申报履历 ' + statusStamp + '</div>' +
      '<div style="padding:20px;">' +
        '<div class="timeline">' +
          app.timeline.map(function(record) {
            var isCompleted = true;
            var isReject = record.result === '驳回';
            return '<div class="timeline-item completed">' +
              '<div class="timeline-dot" style="' + (isReject ? 'background:#EF4444;border-color:#EF4444;' : '') + '"></div>' +
              '<div class="timeline-time">' + record.time + '</div>' +
              '<div class="timeline-title" style="' + (isReject ? 'color:#EF4444;' : '') + '">' + record.action + '</div>' +
              '<div class="timeline-desc">' + record.operator + '</div>' +
              '<div class="timeline-desc" style="margin-top:4px; color:#64748B;">意见：' + record.opinion + '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +
    '</div>';

  // Unit info
  var statsRowHtml =
    '<div class="stats-row">' +
      renderStatsTable("核定编制数", s.authorizedStaff,
        { admin: s.authorizedDetail.admin, tech: s.authorizedDetail.tech, logistic: s.authorizedDetail.logistic },
        s.authorizedDetail.leadership, "其中", "领导职数") +
      renderStatsTable("现有人数", s.currentStaff,
        { admin: s.currentDetail.admin, tech: s.currentDetail.tech, logistic: s.currentDetail.logistic },
        s.currentDetail.leadership, "其中", "领导人数") +
    '</div>';
  var controlsHtml =
    '<div class="control-stats">' +
      '<div class="control-item"><div class="control-label">核定控制数</div><div class="control-number">' + s.controlQuota + '名</div></div>' +
      '<div class="control-item"><div class="control-label">现有控制数</div><div class="control-number">' + s.currentControl + '人</div></div>' +
      '<div class="control-item"><div class="control-label">本次出编人数</div><div class="control-number">' + s.exitControl + '人</div></div>' +
      '<div class="control-item"><div class="control-label">出编后控制数</div><div class="control-number">' + s.afterControl + '人</div></div>' +
    '</div>';
  var unitHtml =
    '<div class="card">' +
      '<div class="card-header">单位信息</div>' +
      '<div style="padding:20px;">' +
        '<div class="info-grid">' +
          '<div class="info-item"><div class="info-label">单位全称</div><div class="info-value">' + s.fullName + '</div></div>' +
          '<div class="info-item"><div class="info-label">统一社会信用代码</div><div class="info-value">' + s.creditCode + '</div></div>' +
          '<div class="info-item"><div class="info-label">机构级别</div><div class="info-value">' + s.institutionLevel + '</div></div>' +
          '<div class="info-item"><div class="info-label">经费来源</div><div class="info-value">' + s.fundingSource + '</div></div>' +
        '</div>' +
        statsRowHtml +
        controlsHtml +
      '</div>' +
    '</div>';

  // 附件8 detail table
  var attachment8Html =
    '<div class="card">' +
      '<div class="card-header">出编(核减)申请表（附件8）</div>' +
      '<div class="form-table">' +
        '<table>' +
          '<thead>' +
            '<tr>' +
              '<th>单位名称</th>' +
              '<th>编制类型</th>' +
              '<th colspan="7">出编人员名单</th>' +
              '<th>单位意见</th>' +
              '<th>主管部门意见</th>' +
              '<th>备注</th>' +
            '</tr>' +
            '<tr>' +
              '<th></th>' +
              '<th></th>' +
              '<th>序号</th>' +
              '<th>姓名</th>' +
              '<th>性别</th>' +
              '<th>身份证号</th>' +
              '<th>依据文号</th>' +
              '<th>出编形式</th>' +
              '<th>编制本/人员名册序号</th>' +
              '<th></th>' +
              '<th></th>' +
              '<th></th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>' +
            '<tr>' +
              '<td rowspan="1">' + app.schoolName + '</td>' +
              '<td>' + app.staffingType + '</td>' +
              '<td>1</td>' +
              '<td>' + app.teacherName + '</td>' +
              '<td>' + app.gender + '</td>' +
              '<td style="font-size:11px;">' + app.idCard + '</td>' +
              '<td>' + app.basisDoc + '</td>' +
              '<td>' + app.exitForm + '</td>' +
              '<td>' + app.staffingBook + ' / ' + app.rosterSeq + '</td>' +
              '<td class="opinion-cell">' + (app.status === '已通过' ? '同意出编（盖章）' : (app.status === '已驳回' ? '—' : '待审批')) + '</td>' +
              '<td class="opinion-cell">' + (app.status === '已通过' ? '同意（盖章）' : (app.status === '已驳回' ? '—' : '待审批')) + '</td>' +
              '<td>' + app.remark + '</td>' +
            '</tr>' +
          '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';

  // Materials list (附件7)
  var materialItemsHtml = app.materials.map(function(m, i) {
    return '<div class="material-list-item">' +
      '<div><div class="material-name">' + (i + 1) + '. ' + m + '</div></div>' +
      '<div class="material-status uploaded">✓ 已上传</div>' +
    '</div>';
  }).join('');
  var materialsHtml =
    '<div class="card">' +
      '<div class="card-header">上传材料（附件7 — ' + app.exitForm + '）</div>' +
      '<div class="material-list">' + materialItemsHtml + '</div>' +
    '</div>';

  // Review actions (only for pending)
  var actionsHtml = '';
  if (app.status === '待审批') {
    actionsHtml =
      '<div class="card">' +
        '<div class="review-actions">' +
          '<button class="btn-approve" onclick="handleApprove()">✓ 审核通过</button>' +
          '<button class="btn-reject" onclick="handleReject()">✗ 审核驳回</button>' +
        '</div>' +
      '</div>';
  } else if (app.status === '已驳回') {
    actionsHtml =
      '<div class="card">' +
        '<div style="padding:20px; text-align:center;">' +
          '<div style="font-size:14px; color:#EF4444; margin-bottom:8px;">已驳回 · 驳回理由：' + app.rejectReason + '</div>' +
          '<div style="font-size:12px; color:var(--text-secondary);">学校可重新提交申请</div>' +
        '</div>' +
      '</div>';
  } else if (app.status === '已通过') {
    actionsHtml =
      '<div class="card">' +
        '<div style="padding:20px; text-align:center; color:#10B981;">' +
          '<div style="font-size:14px;">审批已通过</div>' +
        '</div>' +
      '</div>';
  }

  var fullHtml =
    '<div class="two-columns">' +
      '<div class="main-col">' +
        progressHtml +
        unitHtml +
        attachment8Html +
        materialsHtml +
        actionsHtml +
      '</div>' +
      '<div class="side-col">' +
        timelineHtml +
      '</div>' +
    '</div>';

  mainContent.innerHTML = fullHtml;
}

// ===== Init =====
renderSidebar();
updateUserInfo();
renderPage();
</script>
</body>
</html>
