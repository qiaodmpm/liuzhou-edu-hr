<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人社结果录入 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#1E40AF;--primary-dark:#1E3A8A;--primary-light:#EFF6FF;--accent:#3B82F6;--text:#1E293B;--text-secondary:#64748B;--text-light:#94A3B8;--border:#E2E8F0;--bg:#F8FAFC;--danger:#EF4444;--success:#10B981;--warning:#F59E0B;--radius:8px;--radius-lg:12px;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow:0 4px 24px rgba(0,0,0,.08);--transition:.2s;--sidebar-w:240px}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topnav{position:fixed;top:0;left:0;right:0;height:56px;background:linear-gradient(135deg,#1E3A8A,#1E40AF);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100}.topnav-left{display:flex;align-items:center;gap:14px}.topnav-logo{width:38px;height:38px;background:rgba(255,255,255,.18);border-radius:10px;display:flex;align-items:center;justify-content:center}.topnav-logo svg{width:24px;height:24px}.topnav-title{font-size:17px;font-weight:600;color:#fff}.topnav-right{display:flex;align-items:center;gap:18px}.topnav-bell{position:relative;cursor:pointer;color:rgba(255,255,255,.85);padding:6px;border-radius:6px;transition:var(--transition)}.topnav-user{display:flex;align-items:center;gap:8px;cursor:pointer;color:rgba(255,255,255,.9);padding:6px 12px;border-radius:6px;transition:var(--transition);font-size:13px;position:relative}.topnav-user .avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}.user-dropdown{display:none;position:absolute;top:46px;right:0;background:#fff;border-radius:var(--radius);box-shadow:0 12px 48px rgba(0,0,0,.12);min-width:160px;z-index:200;overflow:hidden}.user-dropdown.show{display:block}.user-dropdown a{display:block;padding:12px 18px;font-size:13px;color:var(--text);text-decoration:none}.user-dropdown a:hover{background:var(--primary-light);color:var(--primary)}
.sidebar{position:fixed;top:56px;left:0;bottom:0;width:var(--sidebar-w);background:#1E3A8A;z-index:90;overflow-y:auto;display:flex;flex-direction:column}.sidebar-menu{flex:1;padding:8px 0}.menu-group{padding:14px 20px 4px;font-size:11px;color:rgba(255,255,255,.4)}.menu-item{display:flex;align-items:center;padding:10px 20px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.7);transition:var(--transition);border-left:3px solid transparent}.menu-item:hover{background:rgba(255,255,255,.05);color:#fff}.menu-item.active{background:rgba(255,255,255,.08);color:#fff;font-weight:500;border-left-color:var(--accent)}.menu-item .menu-icon{width:18px;height:18px;margin-right:10px;opacity:.7}
.role-switcher{padding:10px 16px 12px;border-top:1px solid rgba(255,255,255,.08)}.role-switcher-label{font-size:10px;color:rgba(255,255,255,.35);margin-bottom:8px}.role-switch-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.55);transition:var(--transition);border:1px solid transparent;background:transparent;font-family:inherit;width:100%;text-align:left}.role-switch-btn.active{background:rgba(59,130,246,.2);color:#fff;border-color:rgba(59,130,246,.4)}.role-switch-dot{width:8px;height:8px;border-radius:50%}.role-switch-dot.city{background:#3B82F6}.role-switch-dot.district{background:#F59E0B}.role-switch-dot.school{background:#10B981}
.main{margin-left:var(--sidebar-w);margin-top:56px;padding:24px;min-height:calc(100vh - 56px)}.breadcrumb{font-size:12px;color:var(--text-light);margin-bottom:16px}.breadcrumb a{color:var(--text-light);text-decoration:none}.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.page-header h1{font-size:20px;font-weight:700}
.form-card,.detail-card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:24px 28px;margin-bottom:18px}.form-card h3,.detail-card h3{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}.form-card h3::before,.detail-card h3::before{content:'';width:3px;height:14px;background:var(--primary);border-radius:2px;display:inline-block}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}.form-grid.col3{grid-template-columns:repeat(3,1fr)}.form-group{display:flex;flex-direction:column;gap:4px}.form-group .calc{font-size:13px;font-weight:600;color:var(--primary);padding:8px 10px;background:#F8FAFC;border-radius:6px}.form-group label{font-size:12px;color:var(--text-secondary);font-weight:500}.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;background:#fff}.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}.form-group textarea{resize:vertical;min-height:60px}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px}.info-item{background:#F8FAFC;padding:8px 12px;border-radius:6px}.info-label{font-size:11px;color:var(--text-light)}.info-value{font-size:13px;font-weight:500}
.checklist-container{padding:8px 0}.checklist-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}.checklist-icon{font-size:16px;width:20px;text-align:center}.checklist-upload-btn{padding:4px 10px;border:1px dashed var(--border);border-radius:4px;background:#F8FAFC;cursor:pointer;font-size:11px;color:var(--text-secondary);font-family:inherit;transition:var(--transition)}.checklist-upload-btn:hover{border-color:var(--accent);color:var(--primary)}
.checklist-file-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:var(--primary-light);border:1px solid rgba(30,64,175,.15);border-radius:4px;font-size:12px;cursor:pointer;color:var(--primary)}.checklist-file-chip:hover{border-color:var(--accent)}.file-remove{color:var(--danger);cursor:pointer;font-weight:700;font-size:14px;padding:0 2px;line-height:1}
	.upload-hint{font-size:11px;color:var(--text-light);margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;font-size:13px;font-weight:500;border-radius:6px;cursor:pointer;font-family:inherit;transition:var(--transition);border:1px solid transparent}.btn-primary{background:var(--primary);color:#fff}.btn-outline{background:#fff;color:var(--text-secondary);border:1px solid var(--border)}.btn-lg{padding:10px 28px;font-size:14px}.form-footer{display:flex;justify-content:space-between;align-items:center;padding-top:8px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;animation:toastIn .3s ease}.toast.warning{background:var(--warning);color:#1E293B}.toast.success{background:var(--success)}@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<nav class="topnav"><div class="topnav-left"><div class="topnav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="1" width="18" height="22" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="12" y2="14"/><line x1="12" y1="18" x2="16" y2="18"/><circle cx="8" cy="18" r="1.5" fill="#fff"/></svg></div><span class="topnav-title">柳州教育人事管理平台</span></div>
<div class="topnav-right"><div class="topnav-bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="badge">1</span></div>
<div class="topnav-user" onclick="toggleUserMenu()"><div class="avatar">王</div><span>王玉兰</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg><div class="user-dropdown" id="userDropdown"><a href="personal-center.html">个人中心</a></div></div></div>
</nav>
<aside class="sidebar" id="sidebar"><div class="sidebar-menu" id="sidebarMenu"></div>
<div class="role-switcher"><div class="role-switcher-label">切换演示角色</div><div class="role-switcher-options">
<button class="role-switch-btn" data-role="city" onclick="switchRole('city')"><span class="role-switch-dot city"></span>市管理员</button>
<button class="role-switch-btn" data-role="district" onclick="switchRole('district')"><span class="role-switch-dot district"></span>区管理员</button>
<button class="role-switch-btn active" data-role="school" onclick="switchRole('school')"><span class="role-switch-dot school"></span>校管理员</button>
</div></div></aside>
<main class="main" id="pageContent"></main>
<div id="rowFileInputs" style="display:none"></div><div id="toastContainer"></div>
<script src="src/menu-config.js"></script>
<script>
window.onerror=function(msg,url,line){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#FEE2E2;color:#991B1B;padding:16px 20px;font-family:monospace;font-size:13px';d.innerHTML='ERROR: '+msg+' (line '+line+')<br><button onclick="location.reload()" style="margin-top:8px;padding:6px 16px">重新加载</button>';document.body.prepend(d)};
var currentRole='school',currentId='',record=null,hrDocFile=null;
function escapeHtml(s){if(s===undefined||s===null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function formatFileSize(bytes){if(!bytes||bytes===0)return'0B';if(bytes<1024)return bytes+'B';if(bytes<1048576)return (bytes/1024).toFixed(1)+'KB';return (bytes/1048576).toFixed(1)+'MB'}
function showToast(m,t){var e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;document.getElementById('toastContainer').appendChild(e);setTimeout(function(){e.remove()},2200)}
function toggleUserMenu(){document.getElementById('userDropdown').classList.toggle('show')}
document.addEventListener('click',function(e){if(!e.target.closest('.topnav-user'))document.getElementById('userDropdown').classList.remove('show')})
function goBack(){window.location.href='retire-list-school.html'}
function switchRole(role){if(role==='school')return;if(role==='city'||role==='district'){window.location.href='retire-list-admin.html?role='+role}}
function loadRecords(){var s=localStorage.getItem('retire_records');try{return JSON.parse(s)||[]}catch(e){return[]}}
function saveRecords(r){localStorage.setItem('retire_records',JSON.stringify(r))}
function getRecord(id){var all=loadRecords();for(var i=0;i<all.length;i++)if(all[i].id===id)return all[i];return null}
function updateRecord(id,fn){var all=loadRecords();for(var i=0;i<all.length;i++)if(all[i].id===id){fn(all[i]);break}saveRecords(all)}

function renderAll(){
  if(!record){document.getElementById('pageContent').innerHTML='<div class="breadcrumb"><a href="workbench.html">首页</a> / <a href="retire-list-school.html">退休呈报</a> / <span>人社结果录入</span></div><div class="form-card" style="text-align:center;padding:40px">未找到该退休申报记录</div>';return}
  var r=record;
  var h='<div class="breadcrumb"><a href="workbench.html">首页</a> &nbsp;/&nbsp; <a href="retire-list-school.html">退休呈报</a> &nbsp;/&nbsp; <span>人社结果录入</span></div>';
  h+='<div class="page-header"><h1>录入人社结果 — '+escapeHtml(r.teacherName||'')+'</h1><div style="font-size:12px;color:var(--text-light);margin-top:4px">申请编号：'+escapeHtml(r.id)+' | 单位：'+escapeHtml(r.schoolName)+'</div></div>';

  // 教师摘要
  h+='<div class="detail-card"><h3>申报信息摘要</h3><div class="info-grid">';
  h+='<div class="info-item"><div class="info-label">姓名</div><div class="info-value">'+escapeHtml(r.teacherName||'—')+'</div></div>';
  h+='<div class="info-item"><div class="info-label">性别</div><div class="info-value">'+escapeHtml(r.gender||'—')+'</div></div>';
	  h+='<div class="info-item"><div class="info-label">身份证号</div><div class="info-value">'+escapeHtml(r.idCard||'—')+'</div></div>';
	  h+='<div class="info-item"><div class="info-label">出生日期</div><div class="info-value">'+escapeHtml(r.birthDate||'—')+'</div></div>';
	  h+='<div class="info-item"><div class="info-label">退休日期</div><div class="info-value">'+escapeHtml(r.retireDate||'—')+'</div></div>';
	  h+='<div class="info-item"><div class="info-label">单位名称</div><div class="info-value">'+escapeHtml(r.schoolName||'—')+'</div></div>';
	  h+='</div></div>';

  // 计算教龄满
  var teachFullYears='—';
  if(r.workStart&&r.retireDate){var ws=new Date(r.workStart),rd2=new Date(r.retireDate);var ty=rd2.getFullYear()-ws.getFullYear();if(rd2.getMonth()<ws.getMonth()||(rd2.getMonth()===ws.getMonth()&&rd2.getDate()<ws.getDate()))ty--;teachFullYears=ty+'年';}

  // 人社结果录入
  h+='<div class="detail-card"><h3>人社审批结果</h3><div class="form-grid col3">';
  h+='<div class="form-group"><label>批准退休等级</label><input id="hrLevel" placeholder="如：一级教师"></div>';
  h+='<div class="form-group"><label>退休文号</label><input id="hrDocNumber" placeholder="如：柳人社发〔2026〕10号"></div>';
  h+='<div class="form-group"><label>退休类型</label><select id="hrRetireType"><option value="">请选择</option><option value="正常">正常</option><option value="因病">因病</option><option value="提前">提前</option><option value="延长期满">延长期满</option></select></div>';
  h+='<div class="form-group"><label>退休日期</label><input type="date" id="hrRetireDate"></div>';
  h+='<div class="form-group"><label>教龄满</label><div class="calc">'+teachFullYears+'</div>';
  h+='<div class="form-group"><label>在职工资发放至</label><input type="month" id="hrSalaryStop" placeholder="如：2026-07"></div>';
  h+='<div class="form-group"><label>退休工资执行日</label><input type="date" id="hrRetireExecDate"></div>';
  h+='</div><div class="form-group" style="margin-top:12px"><label>备注</label><textarea id="hrRemark" placeholder="备注信息（选填）"></textarea></div>';
  // 批复文档上传
  h+='<div class="checklist-container" style="margin-top:16px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">批复文档 <span style="font-size:11px;color:var(--text-light);font-weight:400">（必填，支持 PDF/JPG/PNG，≤10MB）</span></div>';
  h+='<div class="checklist-item"><span class="checklist-icon">'+(hrDocFile?'☑':'☐')+'</span>';
  h+='<button class="checklist-upload-btn" onclick="event.preventDefault();document.getElementById(\'hrDocInput\').click()">上传批复文档</button>';
  if(hrDocFile){h+='<span class="checklist-file-chip">📄 '+escapeHtml(hrDocFile.name.length>16?hrDocFile.name.substring(0,16)+'...':hrDocFile.name)+' '+formatFileSize(hrDocFile.size)+'</span><span class="file-remove" onclick="event.stopPropagation();hrDocFile=null;renderAll()">×</span>'}
  h+='</div>';
	  if(!hrDocFile)h+='<div class="upload-hint">请上传人社部门批复文件</div>';
	  h+='</div></div>';

  // 恢复已有值
  if(r.hrResult){setTimeout(function(){setVal('hrLevel',r.hrResult.level);setVal('hrDocNumber',r.hrResult.docNumber);setVal('hrRemark',r.hrResult.remark||'');setVal('hrRetireType',r.hrResult.retireType||'');setVal('hrRetireDate',r.hrResult.retireDate||'');setVal('hrSalaryStop',r.hrResult.salaryStop||'');setVal('hrRetireExecDate',r.hrResult.retireExecDate||'')},50)}
  if(r.hrApprovalAttachment&&!hrDocFile){hrDocFile={name:r.hrApprovalAttachment.name,size:r.hrApprovalAttachment.size}}

  h+='<div class="form-footer"><button class="btn btn-outline btn-lg" onclick="goBack()">返回</button><button class="btn btn-primary btn-lg" onclick="submitHr()">提交人社结果</button></div>';
  document.getElementById('pageContent').innerHTML=h;
  if(!document.getElementById('hrDocInput')){
    var fi=document.createElement('input');fi.type='file';fi.id='hrDocInput';fi.accept='.pdf,.jpg,.jpeg,.png';fi.style.display='none';
    fi.onchange=function(){var f=this.files&&this.files[0];if(!f)return;if(!/\.(pdf|jpe?g|png)$/i.test(f.name)){showToast('批复文档仅支持 PDF/JPG/PNG','warning');return}if(f.size>10*1048576){showToast('文件不能超过10MB','warning');return}hrDocFile={name:f.name,size:f.size};renderAll()};
    document.getElementById('rowFileInputs').appendChild(fi);
  }
}
function setVal(id,v){var el=document.getElementById(id);if(el)el.value=v||''}
function submitHr(){
  var level=document.getElementById('hrLevel').value.trim(),doc=document.getElementById('hrDocNumber').value.trim();
  var retireType=document.getElementById('hrRetireType').value;
  var retireDate=document.getElementById('hrRetireDate').value;
  var salaryStop=document.getElementById('hrSalaryStop').value;
  var retireExecDate=document.getElementById('hrRetireExecDate').value;
  if(!level){showToast('请填写批准退休等级','warning');return}if(!doc){showToast('请填写退休文号','warning');return}
  if(!retireType){showToast('请选择退休类型','warning');return}
  if(!retireDate){showToast('请选择退休日期','warning');return}
  if(!salaryStop){showToast('请填写在职工资发放至','warning');return}
  if(!retireExecDate){showToast('请选择退休工资执行日','warning');return}
  if(!hrDocFile){showToast('请上传批复文档','warning');return}
  updateRecord(currentId,function(r){r.hrResult={level:level,docNumber:doc,retireType:retireType,retireDate:retireDate,salaryStop:salaryStop,retireExecDate:retireExecDate,remark:document.getElementById('hrRemark').value.trim()};r.hrApprovalAttachment={name:hrDocFile.name,size:hrDocFile.size};r.status='pending_second';r.hrEntryTime=new Date().toISOString().replace('T',' ').substring(0,19)});
  showToast('人社结果已提交，等待主管二审','success');setTimeout(function(){window.location.href='retire-list-school.html'},1200)
}

function sidebarClick(el,id){
  if(arguments.length===1){id=el;el=null;}
  if(id==='retire'){window.location.href='retire-list-school.html';return;}
  if(id==='workbench'){window.location.href='workbench.html';return;}
  if(id==='ledger'){window.location.href='org-ledger-school.html';return;}
  if(id==='staffing'){window.location.href='staffing-application.html';return;}
  if(id==='entry'){window.location.href='教师入编管理（学校管理员视角）.html';return;}
  if(id==='exit'){window.location.href='教师出编管理（学校管理员视角）.html';return;}
  if(id==='postset'){window.location.href='post-list-school.html';return;}
  if(id==='promote'){window.location.href='promote-list-school.html';return;}
  if(id==='recruit'){window.location.href='recruit-list-school.html';return;}
  if(id==='employ'){window.location.href='employ-list-school.html';return;}
  if(id==='contract-entry'){window.location.href='contract-entry-list-school.html';return;}
  if(id==='contract-exit'){window.location.href='contract-exit-list-school.html';return;}
  if(id==='ethics'){showToast('师德师风举报页面开发中');return;}
  if(id==='account'){window.location.href='account-management.html';return;}
  if(id==='org'){window.location.href='org-management.html';return;}
  if(id==='announcement'){window.location.href='announcement-management.html';return;}
  showToast('跳转至：'+(el?el.textContent:id));
}
(function init(){
  var p=new URLSearchParams(window.location.search);currentId=p.get('id')||'';
  record=getRecord(currentId);renderSidebarMenu('sidebarMenu','school','retire');renderAll()
})();
</script>
</body>
</html>
