<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 100;
  background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
}
.topnav-left { display: flex; align-items: center; gap: 12px; }
.topnav-logo { width: 36px; height: 36px; }
.topnav-logo svg { width: 100%; height: 100%; }
.topnav-title { color: #fff; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
.topnav-right { display: flex; align-items: center; gap: 20px; color: rgba(255,255,255,0.85); }
.topnav-bell { position: relative; cursor: pointer; }
.topnav-bell .badge { position: absolute; top: -6px; right: -8px; background: var(--danger); color: #fff; font-size: 10px; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 48px; right: 0; background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); min-width: 160px; overflow: hidden; z-index: 200; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 10px 18px; font-size: 13px; color: var(--text); text-decoration: none; }
.user-dropdown a:hover { background: var(--gray-bg); }
.user-dropdown .divider { border-top: 1px solid var(--border); }
.user-dropdown a.logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: linear-gradient(180deg, #0F172A 0%, #1E3A8A 100%);
  display: flex; flex-direction: column; overflow-y: auto; z-index: 90;
  color: rgba(255,255,255,0.7);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 12px 20px 4px; color: rgba(255,255,255,0.35); }
.menu-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 20px;
  font-size: 13px; font-weight: 400; cursor: pointer; transition: var(--transition);
  color: rgba(255,255,255,0.7); text-decoration: none;
}
.menu-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.9); }
.menu-item.active { background: rgba(255,255,255,0.1); color: #fff; font-weight: 500; }
.menu-item .menu-icon { width: 18px; height: 18px; flex-shrink: 0; }
.menu-badge { background: var(--danger); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: auto; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 10px; padding: 14px 20px;
  font-size: 12px; cursor: pointer; transition: var(--transition);
  color: rgba(255,255,255,0.4);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }

.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* ===== PAGE HEADER ===== */
.page-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; }
.page-header h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); }

/* ===== CONTENT CSS (from source) ===== */
.page-title-row {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
}
.page-title { font-size: 1.3rem; font-weight: 700; color: #1E293B; }
.btn-export {
  background: #F1F5F9; border: 1px solid #e2e8f0; padding: 8px 20px; border-radius: 30px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  font-size: 0.8rem; font-weight: 500; transition: all 0.2s; font-family: inherit;
}
.btn-export:hover { background: #E2E8F0; }

/* Two-column layout */
.main-content-wrapper { display: flex; gap: 24px; }
.left-content { flex: 1; min-width: 0; }
.right-timeline { width: 360px; flex-shrink: 0; }

.card {
  background: white; border-radius: 20px; border: 1px solid #edf2f7;
  overflow: hidden; margin-bottom: 24px;
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid #f0f2f5; font-weight: 600;
  font-size: 1rem; display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px; background-color: #FAFBFC;
}
.batch-info {
  background: #F8FAFC; padding: 12px 20px; border-radius: 12px;
  font-size: 0.8rem; margin: 16px 20px 20px 20px;
}

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; }
.info-item { background: #F8FAFC; padding: 12px; border-radius: 12px; }
.info-label { font-size: 0.7rem; color: #64748B; margin-bottom: 4px; }
.info-value { font-size: 0.85rem; font-weight: 500; }
.info-item.full-width { grid-column: span 2; }

/* Stats table */
.stats-row { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
.stats-card {
  flex: 1; border: 1px solid #e2e8f0; border-radius: 16px;
  overflow: hidden; background: white;
}
.stats-card-header {
  background: #F8FAFC; padding: 12px 16px; font-weight: 700;
  font-size: 0.9rem; border-bottom: 1px solid #e2e8f0;
  display: flex; justify-content: space-between; align-items: center;
}
.stats-card-header .total-number { font-size: 1.2rem; color: #1E40AF; }
.three-col-table { width: 100%; border-collapse: collapse; }
.three-col-table th, .three-col-table td {
  border-bottom: 1px solid #e2e8f0; padding: 10px 12px;
  text-align: left; vertical-align: top; font-size: 0.75rem;
}
.three-col-table th { background: #FAFBFC; font-weight: 600; width: 33%; }
.three-col-table tr:last-child td { border-bottom: none; }

/* Progress */
.progress-container { padding: 20px; }
.progress-steps { display: flex; justify-content: space-between; position: relative; }
.progress-node { flex: 1; text-align: center; position: relative; }
.progress-node .node-dot {
  width: 36px; height: 36px; background: #e2e8f0; border-radius: 50%;
  margin: 0 auto 8px; line-height: 36px; font-size: 0.8rem;
  font-weight: 600; color: #64748B;
}
.progress-node.completed .node-dot { background: #10B981; color: white; }
.progress-node.active .node-dot { background: #1E40AF; color: white; }
.progress-node .node-title { font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; }
.progress-node .node-detail { font-size: 0.65rem; color: #64748B; }

/* Timeline */
.timeline { position: relative; padding-left: 30px; }
.timeline-item {
  position: relative; padding-bottom: 20px; border-left: 2px solid #e2e8f0;
  margin-left: 12px; padding-left: 20px;
}
.timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline-dot {
  position: absolute; left: -9px; top: 0; width: 16px; height: 16px;
  border-radius: 50%; background: white; border: 2px solid #cbd5e1;
}
.timeline-item.completed .timeline-dot { background: #10B981; border-color: #10B981; }
.timeline-time { font-size: 0.7rem; color: #64748B; margin-bottom: 4px; }
.timeline-title { font-weight: 600; font-size: 0.8rem; margin-bottom: 4px; }
.timeline-desc { font-size: 0.7rem; color: #475569; }

/* Status stamp */
.status-stamp {
  display: inline-block; padding: 6px 16px; border: 2px solid;
  transform: rotate(-5deg); font-weight: 700; font-size: 0.85rem; background: white;
}
.status-stamp.approved { color: #10B981; border-color: #10B981; }
.status-stamp.rejected { color: #EF4444; border-color: #EF4444; }
.status-stamp.pending { color: #F59E0B; border-color: #F59E0B; }

/* Form elements */
.form-group { margin-bottom: 16px; padding: 0 20px; }
.form-group:last-child { padding-bottom: 20px; }
.form-group label {
  font-weight: 500; font-size: 0.8rem; display: block; margin-bottom: 6px; color: #334155;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 12px;
  font-size: 0.8rem; font-family: inherit; background-color: #F8FAFC;
}
.form-group textarea { resize: vertical; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: var(--transition); border: 1px solid transparent;
  font-family: inherit; text-decoration: none;
}
.btn-outline { background: #fff; color: var(--text-secondary); border-color: var(--border); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }

.toast-message {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: white; padding: 12px 24px; border-radius: 40px;
  z-index: 2000; animation: fadeInOut 2s;
}
@keyframes fadeInOut {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
  15% { opacity: 1; transform: translateX(-50%) translateY(0); }
  85% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
}

@media (max-width: 1024px) {
  .main-content-wrapper { flex-direction: column; }
  .right-timeline { width: 100%; }
}
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .stats-row { flex-direction: column; }
  .info-grid { grid-template-columns: 1fr; }
}
</style>
</head>

  authorizedDetail: { admin: 32, tech: 142, logistic: 12, leadership: { deptLevel: 1, divisionLevel: 4, sectionLevel: 8 } },
  currentStaff: 175,
  currentDetail: { admin: 30, tech: 138, logistic: 7, leadership: { deptLevel: 1, divisionLevel: 4, sectionLevel: 7 } }
};

var personalInfo = {
  name: "张雅琴", gender: "女", birthDate: "1990-03-15", age: 36,
  idCard: "450201199003150022", politics: "中共党员", ethnicity: "汉族",
  nativePlace: "广西柳州", education: "硕士研究生",
  graduateSchool: "广西师范大学", major: "汉语言文学",
  previousJob: "某中学语文教师", cadreOrWorker: "干部", orgType: "事业单位",
  title: "一级教师", funding: "财政全额", spouseName: "李伟", spouseWorkUnit: "柳州银行"
};

var entryData = {
  assignPosition: "语文教师", entryMethod: "统一公开招聘",
  basisDoc: "柳教人〔2026〕10号", reason: "学科教师紧缺，符合学校发展规划"
};

// ===== RENDER FUNCTIONS =====
function renderStatsTable(title, total, details, leadership, category1Name, category2Name) {
  return '<div class="stats-card">' +
    '<div class="stats-card-header"><span>' + title + '</span><span class="total-number">' + total + '</span></div>' +
    '<table class="three-col-table">' +
    '<thead><tr><th>类别</th><th>分项</th><th>数量</th></tr></thead>' +
    '<tbody>' +
    '<tr><td rowspan="3">' + category1Name + '</td><td>行政管理岗位</td><td>' + details.admin + '</td></tr>' +
    '<tr><td>专业技术岗位</td><td>' + details.tech + '</td></tr>' +
    '<tr><td>后勤服务岗位</td><td>' + details.logistic + '</td></tr>' +
    '<tr><td rowspan="3">' + category2Name + '</td><td>厅级</td><td>' + leadership.deptLevel + '</td></tr>' +
    '<tr><td>处级</td><td>' + leadership.divisionLevel + '</td></tr>' +
    '<tr><td>科级</td><td>' + leadership.sectionLevel + '</td></tr>' +
    '</tbody></table></div>';
}

function renderDetailPage() {
  var statusStamp = applicationStatus === 'approved' ? '<div class="status-stamp approved">审批通过</div>' :
    (applicationStatus === 'rejected' ? '<div class="status-stamp rejected">审批驳回</div>' :
    '<div class="status-stamp pending">待审核</div>');

  var getNodeClass = function(status) { return status === 'completed' ? 'completed' : (status === 'active' ? 'active' : ''); };
  var getNodeIcon = function(status) { return status === 'completed' ? '✓' : (status === 'active' ? '●' : '○'); };

  var progressHtml = '<div class="card"><div class="card-header">⏳ 审批进度</div>' +
    '<div class="progress-container"><div class="progress-steps">' +
    '<div class="progress-node ' + getNodeClass(progressData.submit.status) + '"><div class="node-dot">' + getNodeIcon(progressData.submit.status) + '</div><div class="node-title">提交申请</div><div class="node-detail">' + progressData.submit.user + '<br>' + progressData.submit.time + '</div></div>' +
    '<div class="progress-node ' + getNodeClass(progressData.schoolAudit.status) + '"><div class="node-dot">' + getNodeIcon(progressData.schoolAudit.status) + '</div><div class="node-title">学校审核</div><div class="node-detail">' + progressData.schoolAudit.user + '<br>' + progressData.schoolAudit.time + '</div></div>' +
    '<div class="progress-node ' + getNodeClass(progressData.eduAudit.status) + '"><div class="node-dot">' + getNodeIcon(progressData.eduAudit.status) + '</div><div class="node-title">市/区教育局审核</div><div class="node-detail">' + progressData.eduAudit.user + '<br>' + progressData.eduAudit.time + '</div></div>' +
    '<div class="progress-node ' + getNodeClass(progressData.complete.status) + '"><div class="node-dot">' + getNodeIcon(progressData.complete.status) + '</div><div class="node-title">审核完成</div><div class="node-detail">' + progressData.complete.result + (progressData.complete.reason ? '<br>驳回原因：' + progressData.complete.reason : '') + '</div></div>' +
    '</div></div></div>';

  var tlHtml = '';
  for (var i = 0; i < timelineRecords.length; i++) {
    var r = timelineRecords[i];
    tlHtml += '<div class="timeline-item completed"><div class="timeline-dot"></div><div class="timeline-time">' + r.time + '</div><div class="timeline-title">' + r.action + '</div><div class="timeline-desc">' + r.operator + '</div><div class="timeline-desc" style="margin-top:4px;color:#64748B;">意见：' + r.opinion + '</div></div>';
  }

  var timelineHtml = '<div class="card"><div class="card-header">申报履历 ' + statusStamp + '</div>' +
    '<div style="padding:20px;"><div class="timeline">' + tlHtml + '</div></div></div>';

  var statsRowHtml = '<div class="stats-row">' +
    renderStatsTable("核定编制数", unitInfo.authorizedStaff,
      { admin: unitInfo.authorizedDetail.admin, tech: unitInfo.authorizedDetail.tech, logistic: unitInfo.authorizedDetail.logistic },
      unitInfo.authorizedDetail.leadership, "其中", "领导职数") +
    renderStatsTable("现有人数", unitInfo.currentStaff,
      { admin: unitInfo.currentDetail.admin, tech: unitInfo.currentDetail.tech, logistic: unitInfo.currentDetail.logistic },
      unitInfo.currentDetail.leadership, "其中", "领导人数") +
    '</div>';

  var unitHtml = '<div class="card"><div class="card-header">🏫 单位信息</div><div style="padding:20px;">' +
    '<div class="info-grid">' +
    '<div class="info-item"><div class="info-label">单位全称</div><div class="info-value">' + unitInfo.fullName + '</div></div>' +
    '<div class="info-item"><div class="info-label">统一社会信用代码</div><div class="info-value">' + unitInfo.creditCode + '</div></div>' +
    '<div class="info-item"><div class="info-label">机构级别</div><div class="info-value">' + unitInfo.institutionLevel + '</div></div>' +
    '<div class="info-item"><div class="info-label">经费来源</div><div class="info-value">' + unitInfo.fundingSource + '</div></div>' +
    '</div>' + statsRowHtml + '</div></div>';

  var otherInfoItems = [
    { label: "性别", value: personalInfo.gender }, { label: "出生年月", value: personalInfo.birthDate },
    { label: "年龄", value: personalInfo.age }, { label: "身份证号码", value: personalInfo.idCard },
    { label: "政治面貌", value: personalInfo.politics }, { label: "民族", value: personalInfo.ethnicity },
    { label: "籍贯", value: personalInfo.nativePlace }, { label: "文化程度", value: personalInfo.education },
    { label: "毕业院校及专业", value: personalInfo.graduateSchool + ' ' + personalInfo.major }, { label: "原工作岗位", value: personalInfo.previousJob },
    { label: "干部或工人", value: personalInfo.cadreOrWorker }, { label: "单位性质", value: personalInfo.orgType },
    { label: "职务/职称", value: personalInfo.title }, { label: "经费来源", value: personalInfo.funding },
    { label: "配偶姓名", value: personalInfo.spouseName }, { label: "配偶工作单位", value: personalInfo.spouseWorkUnit }
  ];
  var otherFieldsHtml = '';
  for (var i = 0; i < otherInfoItems.length; i += 2) {
    var left = otherInfoItems[i];
    var right = otherInfoItems[i+1];
    if (right) {
      otherFieldsHtml += '<div class="info-item"><div class="info-label">' + left.label + '</div><div class="info-value">' + left.value + '</div></div>' +
        '<div class="info-item"><div class="info-label">' + right.label + '</div><div class="info-value">' + right.value + '</div></div>';
    } else {
      otherFieldsHtml += '<div class="info-item full-width"><div class="info-label">' + left.label + '</div><div class="info-value">' + left.value + '</div></div>';
    }
  }
  var personalHtml = '<div class="card"><div class="card-header">👤 个人信息</div>' +
    '<div class="info-grid"><div class="info-item full-width"><div class="info-label">姓名</div><div class="info-value">' + personalInfo.name + '</div></div>' +
    otherFieldsHtml + '</div></div>';

  var entryMethodOptions = ["统一公开招聘","单位自主实施招聘","中高级人才招聘","引进高层次人才","调动","其他"];
  var entryMethodHtml = '';
  for (var j = 0; j < entryMethodOptions.length; j++) {
    entryMethodHtml += '<option' + (entryData.entryMethod === entryMethodOptions[j] ? ' selected' : '') + '>' + entryMethodOptions[j] + '</option>';
  }

  var entryHtml = '<div class="card"><div class="card-header">📝 入编信息</div>' +
    '<div class="form-group"><label>拟分配岗位</label><input type="text" value="' + entryData.assignPosition + '" disabled></div>' +
    '<div class="form-group"><label>入编方式</label><select disabled>' + entryMethodHtml + '</select></div>' +
    '<div class="form-group"><label>依据文号</label><input type="text" value="' + entryData.basisDoc + '" disabled></div>' +
    '<div class="form-group"><label>申请理由</label><textarea rows="3" disabled>' + entryData.reason + '</textarea></div>' +
    '</div>';

  var fullHtml = '<div class="page-header">' +
    '<h1>教师入编详情 - ' + teacherName + '</h1>' +
    '<button class="btn btn-outline" onclick="history.back()">← 返回列表</button>' +
    '</div>' +
    '<div class="main-content-wrapper">' +
    '<div class="left-content">' +
    progressHtml +
    '<div class="batch-info"><strong>教师入编批次：</strong> ' + batchInfo.name + '（' + batchInfo.id + '）<br>' +
    '<span style="font-size:0.7rem;">发布时间：' + batchInfo.publishTime + ' | 发布人：' + batchInfo.publisher + '</span></div>' +
    unitHtml + personalHtml + entryHtml +
    '</div>' +
    '<div class="right-timeline">' + timelineHtml + '</div>' +
    '</div>';

  document.getElementById("mainContent").innerHTML = fullHtml;
}

// ===== UTILS =====
function toggleUserMenu() {
  document.getElementById('userDropdown').classList.toggle('show');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.topnav-user')) document.getElementById('userDropdown').classList.remove('show');
});

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function showToast(message) {
  var toast = document.createElement('div');
  toast.className = 'toast-message';
  toast.innerText = message;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 2000);
}

renderDetailPage();
</script>
</body>
</html>
