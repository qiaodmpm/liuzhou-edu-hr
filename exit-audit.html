<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>审核出编申请 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* Two-column layout */
.detail-layout { display: flex; gap: 24px; }
.detail-main { flex: 1; min-width: 0; }
.detail-sidebar { width: 360px; flex-shrink: 0; }

/* Card */
.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  margin-bottom: 20px; overflow: hidden;
}
.card-header {
  padding: 14px 20px; font-size: 14px; font-weight: 600; color: var(--text);
  background: #FAFBFC; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
}
.card-body { padding: 20px; }

/* Status stamp */
.status-stamp {
  display: inline-block; padding: 6px 16px; border: 2px solid;
  transform: rotate(-5deg); font-weight: 700; font-size: 14px; background: #fff;
}
.status-stamp.approved { color: #10B981; border-color: #10B981; }
.status-stamp.rejected { color: #EF4444; border-color: #EF4444; }
.status-stamp.pending { color: #F59E0B; border-color: #F59E0B; }

/* Progress tracker */
.progress-tracker {
  display: flex; align-items: center; justify-content: center;
  padding: 8px 0 20px;
}
.progress-step {
  display: flex; flex-direction: column; align-items: center; position: relative;
}
.progress-dot {
  width: 32px; height: 32px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
  transition: var(--transition); position: relative; z-index: 1;
}
.progress-dot.done { background: var(--success); color: #fff; }
.progress-dot.current { background: var(--primary); color: #fff; box-shadow: 0 0 0 6px rgba(30,64,175,0.12); }
.progress-dot.pending { background: var(--gray-bg); color: var(--text-light); border: 2px solid var(--border); }
.progress-dot.rejected { background: #FEE2E2; color: var(--danger); border-color: var(--danger); }
.progress-label { font-size: 11px; font-weight: 500; margin-top: 8px; text-align: center; white-space: nowrap; }
.progress-label.done { color: var(--success); }
.progress-label.current { color: var(--primary); }
.progress-label.pending { color: var(--text-light); }
.progress-line {
  width: 100px; height: 2px; margin: 0 8px; margin-bottom: 24px;
  position: relative; z-index: 0;
}
.progress-line.done { background: var(--success); }
.progress-line.pending { background: var(--border); }

/* Info grid */
.info-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
}
.info-item {
  background: #F8FAFC; padding: 10px 14px; border-radius: 8px;
}
.info-item.full { grid-column: 1 / -1; }
.info-label { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
.info-value { font-size: 13px; font-weight: 500; color: var(--text); }

/* Person section */
.person-divider { border: none; border-top: 1px dashed var(--border); margin: 16px 0; }
.person-header { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 12px; }

/* Audit checklist */
.audit-checklist { margin-top: 6px; }
.audit-checklist-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 6px; margin-bottom: 4px;
  font-size: 13px;
}
.audit-checklist-row.done { background: #F0FDF4; }
.audit-checklist-row.missing { background: #FFF7ED; }
.ac-icon { font-size: 14px; flex-shrink: 0; }
.audit-checklist-row.done .ac-icon { color: #10B981; }
.audit-checklist-row.missing .ac-icon { color: #94A3B8; }
.ac-name { flex: 1; color: var(--text); min-width: 100px; }
.ac-file { font-size: 12px; color: var(--text-secondary); word-break: break-all; }
.ac-missing { font-size: 11px; color: #F59E0B; font-weight: 500; }

/* Data table */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  padding: 8px 12px; text-align: left; font-weight: 600; font-size: 12px;
  color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border);
}
.data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }

/* Materials */
.material-item {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 10px 14px; background: #F8FAFC; border-radius: 8px; margin-bottom: 8px;
}
.material-item:last-child { margin-bottom: 0; }
.material-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.material-tag {
  font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 500;
}
.material-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.file-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; background: #fff; border: 1px solid var(--border);
  border-radius: 4px; font-size: 12px; cursor: pointer;
}
.file-chip:hover { border-color: var(--accent); color: var(--primary); }

/* Person section (merged personnel + materials) */
.person-section {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
  background: #fff;
}
.person-section:last-child { margin-bottom: 0; }
.person-section-header {
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 12px; margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.person-seq { font-size: 12px; color: var(--text-light); font-weight: 500; }
.person-name { font-size: 14px; font-weight: 600; color: var(--text); }
.person-form-badge {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: var(--primary-light); color: var(--primary); font-weight: 500;
}
.person-info-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin-bottom: 12px;
}
.person-info-item {
  background: #F8FAFC; padding: 6px 10px; border-radius: 6px;
}
.person-info-label { font-size: 10px; color: var(--text-light); margin-bottom: 1px; }
.person-info-value { font-size: 12px; font-weight: 500; color: var(--text); }
.person-materials { border-top: 1px dashed var(--border); padding-top: 12px; }
.person-materials-title {
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  margin-bottom: 8px;
}
.checklist-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 0; font-size: 12px;
}
.checklist-icon-done { color: #10B981; font-size: 13px; flex-shrink: 0; }
.checklist-icon-missing { color: #94A3B8; font-size: 13px; flex-shrink: 0; }
.checklist-item-name { color: var(--text-secondary); min-width: 120px; flex-shrink: 0; }
.checklist-file-chip {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 2px 8px; background: #fff; border: 1px solid var(--border);
  border-radius: 4px; font-size: 11px; cursor: pointer; color: var(--primary);
}
.checklist-file-chip:hover { border-color: var(--accent); }
.checklist-missing-label { font-size: 11px; color: #F59E0B; }

/* Timeline */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px;
  width: 2px; background: var(--border);
}
.timeline-item { position: relative; margin-bottom: 20px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot {
  position: absolute; left: -24px; top: 4px;
  width: 14px; height: 14px; border-radius: 50%; z-index: 1;
}
.timeline-dot.submit { background: var(--accent); }
.timeline-dot.reject { background: var(--danger); }
.timeline-dot.resubmit { background: var(--warning); }
.timeline-dot.approve { background: var(--success); }
.timeline-content .tlc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.timeline-content .tlc-title { font-size: 13px; font-weight: 600; color: var(--text); }
.timeline-content .tlc-time { font-size: 11px; color: var(--text-light); }
.timeline-content .tlc-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.timeline-content .tlc-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 500;
}
.tlc-tag.reject-reason { background: #FEE2E2; color: var(--danger); }
.tlc-tag.resubmit-tag { background: #FEF3C7; color: #D97706; }
.tlc-tag.approve-tag { background: #D1FAE5; color: #059669; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; font-size: 13px; font-weight: 500;
  border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition);
  border: 1px solid transparent; text-decoration: none;
}
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: #fff; color: var(--text-secondary); border-color: var(--border); }
.btn-outline:hover { background: var(--gray-bg); }
.btn-lg { padding: 10px 28px; font-size: 14px; }

/* Action Bar */
.action-bar { padding: 20px; display: flex; gap: 12px; justify-content: flex-end; }
.btn-approve { background: var(--success); color: #fff; border-color: var(--success); }
.btn-approve:hover { background: #059669; }
.btn-reject { background: #fff; color: var(--danger); border-color: var(--danger); }
.btn-reject:hover { background: #FEF2F2; }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.modal-container {
  background: #fff; border-radius: var(--radius-lg); padding: 28px;
  width: 480px; max-width: 90vw; box-shadow: var(--shadow-lg);
}
.modal-container h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
.form-group textarea, .form-group input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 14px; font-family: inherit; resize: vertical;
}
.form-group textarea:focus, .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel {
  padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px;
  border: 1px solid var(--border); background: #fff; color: var(--text-secondary); cursor: pointer;
}
.btn-cancel:hover { background: var(--gray-bg); }
.btn-confirm {
  padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px;
  border: none; color: #fff; cursor: pointer;
}
.btn-confirm.success { background: var(--success); }
.btn-confirm.success:hover { background: #059669; }
.btn-confirm.danger { background: var(--danger); }
.btn-confirm.danger:hover { background: #DC2626; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Type badge */
.type-badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 500;
}
.type-badge.career { background: #DBEAFE; color: #1E40AF; }
.type-badge.control { background: #E0E7FF; color: #3730A3; }

/* Back link */
.back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
.back-link:hover { color: var(--primary); }

@media (max-width: 1024px) {
  .detail-layout { flex-direction: column; }
  .detail-sidebar { width: 100%; }
  .info-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <rect x="3" y="1" width="18" height="22" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/>
        <line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="12" y2="14"/>
        <line x1="12" y1="18" x2="16" y2="18"/><circle cx="8" cy="18" r="1.5" fill="#fff"/>
      </svg>
    </div>
    <span class="topnav-title">柳州教育人事管理平台</span>
  </div>
  <div class="topnav-right">
    <div class="topnav-bell">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge">2</span>
    </div>
    <div class="topnav-user" onclick="toggleUserMenu()">
      <div class="avatar" id="userAvatar">王</div>
      <span id="userName">王玉兰</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="user-dropdown" id="userDropdown">
        <a href="personal-center.html">个人中心</a>
        <div class="divider"></div>
        <a href="index.html" class="logout">退出登录</a>
      </div>
    </div>
  </div>
</nav>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="role-switcher" id="roleSwitcher">
    <div class="role-switcher-label">切换演示角色</div>

// ===== DATA =====
function loadRecords() {
  try {
    var stored = JSON.parse(localStorage.getItem('exit_records') || '[]');
    var ids = {};
    stored.forEach(function(r) { ids[r.id] = true; });
    var merged = stored.slice();
    DEMO_RECORDS.forEach(function(r) { if (!ids[r.id]) { merged.push(r); ids[r.id] = true; } });
    return merged;
  } catch(e) {
    console.error('loadRecords error:', e);
    localStorage.removeItem('exit_records');
    return DEMO_RECORDS.slice();
  }
}

function saveRecords(records) {
  localStorage.setItem('exit_records', JSON.stringify(records));
}

function findRecord(id) {
  return loadRecords().find(function(r) { return r.id === id; }) || null;
}

function getApproverName() {
  var roleData = ROLES[currentRole];
  return roleData ? roleData.name : '';
}

function getEmployUrl() {
  if (currentRole === 'city' || currentRole === 'district') return 'employ-list-admin.html?role=' + currentRole;
  if (currentRole === 'school') return 'employ-list-school.html';
  return null;
}

// ===== PERMISSION CHECKS =====
function checkPermission() {
  if (!currentRecord) return false;
  if (currentRecord.status !== 'pending') return false;
  if (currentRole === 'district') return currentRecord.schoolType === '鱼峰区属';
  if (currentRole === 'city') return currentRecord.schoolType === '市直属';
  return false;
}

function renderProgress() {
  var r = currentRecord;
  var steps;
  if (r.status === 'approved') {
    steps = [
      { label: '提交申请', state: 'done' },
      { label: '教育局审批', state: 'done' },
      { label: '审核完成', state: 'done' }
    ];
  } else if (r.status === 'rejected') {
    steps = [
      { label: '提交申请', state: 'done' },
      { label: '教育局审批', state: 'done' },
      { label: '审核驳回', state: 'rejected' }
    ];
  } else {
    steps = [
      { label: '提交申请', state: 'done' },
      { label: '教育局审批', state: 'current' },
      { label: '审核完成', state: 'pending' }
    ];
  }

  var h = '';
  for (var i = 0; i < steps.length; i++) {
    var step = steps[i];
    var isRejected = step.state === 'rejected';
    var dotIcon = step.state === 'done' ? '✓' : (isRejected ? '✕' : (i + 1));
    var dotClass = step.state === 'done' ? 'done' : (step.state === 'current' ? 'current' : (isRejected ? 'rejected' : 'pending'));

    h += '<div class="progress-step">';
    h += '<div class="progress-dot ' + dotClass + '">' + dotIcon + '</div>';
    h += '<div class="progress-label ' + dotClass + '">' + step.label + '</div>';
    h += '</div>';
    if (i < steps.length - 1) {
      h += '<div class="progress-line ' + (step.state === 'done' ? 'done' : 'pending') + '"></div>';
    }
  }

  return '<div class="card"><div class="card-header">审批进度</div><div class="card-body">' +
    '<div class="progress-tracker">' + h + '</div></div></div>';
}

function renderApplicants() {
  var r = currentRecord;

  var html = '<div class="card"><div class="card-header">出编人员信息（共 ' + applicants.length + ' 人）</div><div class="card-body">';

  for (var i = 0; i < applicants.length; i++) {
    var a = applicants[i];
    if (i > 0) html += '<hr class="person-divider">';
    html += '<div class="person-header">人员 ' + (a.seq || i + 1) + '</div>';
    html += '<div class="info-grid">';
    html += '<div class="info-item"><div class="info-label">姓名</div><div class="info-value">' + escapeHtml(a.name) + '</div></div>';
    html += '<div class="info-item"><div class="info-label">性别</div><div class="info-value">' + (a.gender || '—') + '</div></div>';
    html += '<div class="info-item"><div class="info-label">身份证号</div><div class="info-value">' + (a.idCard || '—') + '</div></div>';
    html += '<div class="info-item"><div class="info-label">' + (isCareer ? '出编形式' : '减员形式') + '</div><div class="info-value">' + (a.exitForm || '—') + '</div></div>';

    var docLabel = '依据文号';
    var docValue = a.docNumber || '—';
    var isDocOptional = DOC_NUMBER_OPTIONAL.indexOf(a.exitForm) >= 0;
    if (isDocOptional && !a.docNumber) docValue = '（免填—亡故类）';

    html += '<div class="info-item"><div class="info-label">' + docLabel + '</div><div class="info-value">' + docValue + '</div></div>';

    if (isCareer) {
      html += '<div class="info-item"><div class="info-label">编制本人员名册序号</div><div class="info-value">' + (a.rosterBook || '—') + '</div></div>';
    } else {
      html += '<div class="info-item"><div class="info-label"></div><div class="info-value"></div></div>';
    }

    // Materials checklist
    html += '<div class="info-item full"><div class="info-label">材料清单</div>';
    html += '<div class="audit-checklist">';
    var checklist = getMaterialChecklist(a.exitForm, r.staffingType);
    var materials = a.materials || [];
    var missingCount = 0;
    checklist.forEach(function(item) {
      var uploaded = findMaterialByChecklistItem(materials, item);
      if (!uploaded) {
        for (var k = 0; k < materials.length; k++) {
          if (!materials[k].checklistItem && materials[k].name && materials[k].name.indexOf(item) === 0) {
            uploaded = materials[k]; break;
          }
        }
      }
      if (uploaded) {
        html += '<div class="audit-checklist-row done">';
        html += '<span class="ac-icon">☑</span>';
        html += '<span class="ac-name">' + escapeHtml(item) + '</span>';
        html += '<span class="ac-file">📄 ' + escapeHtml(uploaded.name) + '</span>';
        html += '</div>';
      } else {
        missingCount++;
        html += '<div class="audit-checklist-row missing">';
        html += '<span class="ac-icon">☐</span>';
        html += '<span class="ac-name">' + escapeHtml(item) + '</span>';
        html += '<span class="ac-missing">⚠ 缺失</span>';
        html += '</div>';
      }
    });
    html += '</div>';
    if (missingCount > 0) {
      html += '<div style="margin-top:6px;font-size:11px;color:#EF4444;">⚠ 缺少 ' + missingCount + ' 项材料</div>';
    }
    html += '</div>';

    html += '</div>';
  }

  html += '</div></div>';
  return html;
}

	function renderTimeline() {
	  var r = currentRecord;
	  var dotClassMap = { submit: 'submit', approve: 'approve', reject: 'reject', resubmit: 'resubmit' };
	  var items = [];

	  items.push({ time: r.submitTime || '', title: '提交申请', desc: '校管理员提交出编申请', action: 'submit' });

	  if (r.timeline && r.timeline.length > 0) {
	    for (var i = 0; i < r.timeline.length; i++) {
	      var t = r.timeline[i];
	      if (t.action === '学校提交出编申请') continue;
	      var actionType = 'submit';
	      if (t.action === '审批通过') actionType = 'approve';
	      else if (t.action === '审批驳回') actionType = 'reject';
	      else if (t.action.indexOf('修改重提') >= 0 || t.action.indexOf('重提') >= 0) actionType = 'resubmit';

	      items.push({
	        time: t.time || '',
	        title: t.action || '',
	        desc: (t.operator || '') + (t.opinion ? '，意见：' + t.opinion : ''),
	        action: actionType
	      });
	    }
	  } else {
	    if (r.status === 'approved') {
	      items.push({ time: r.approveTime || '', title: '审批通过', desc: (r.approver || '') + ' 审批通过' + (r.opinion ? '，意见：' + r.opinion : ''), action: 'approve' });
	    } else if (r.status === 'rejected') {
	      items.push({ time: r.approveTime || r.submitTime || '', title: '审批驳回', desc: (r.rejectReason || ''), action: 'reject', reason: r.rejectReason || '' });
	    }
	  }

	  var tagMap = {
	    approve: '<span class="tlc-tag approve-tag">审批通过</span>',
	    reject: '<span class="tlc-tag reject-reason">驳回</span>',
	    resubmit: '<span class="tlc-tag resubmit-tag">修改重提</span>'
	  };

	  var html = '';
	  for (var j = 0; j < items.length; j++) {
	    var item = items[j];
	    html += '<div class="timeline-item">' +
	      '<div class="timeline-dot ' + (dotClassMap[item.action] || 'submit') + '"></div>' +
	      '<div class="timeline-content">' +
	      '<div class="tlc-header">' +
	      '<span class="tlc-title">' + item.title + '</span>' +
	      '<span class="tlc-time">' + (item.time ? item.time.substring(0, 16) : '') + '</span>' +
	      (tagMap[item.action] ? tagMap[item.action] : '') +
	      '</div>' +
	      '<div class="tlc-desc">' + item.desc + '</div>' +
	      (item.reason ? '<div class="tlc-desc" style="color:var(--danger);margin-top:4px;">驳回原因：' + item.reason + '</div>' : '') +
	      '</div></div>';
	  }

	  if (!items.length) html += '<div style="color:var(--text-light);">暂无记录</div>';
	  return '<div class="card"><div class="card-header">申报履历</div><div class="card-body"><div class="timeline">' + html + '</div></div></div>';
	}

          (currentRecord.staffingType === 'career'
            ? '实有在编人数将减少，剩余编制数将相应增加。'
            : '现有控制数人员将减少，剩余可用控制数将相应增加。') +
          '审批通过后结果不可修改。' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelApprove">取消</button>' +
          '<button class="btn-confirm success" id="confirmApprove">确认通过</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('cancelApprove').onclick = function() { document.getElementById('approveModal').remove(); };
  document.getElementById('confirmApprove').onclick = doApprove;
}

function doApprove() {
  var opinion = document.getElementById('approveOpinion').value.trim();
  document.getElementById('approveModal').remove();

  var records = loadRecords();
  var idx = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx === -1) { showToast('记录不存在'); return; }

  records[idx].status = 'approved';
  records[idx].approveTime = new Date().toISOString();
  records[idx].approver = getApproverName();
  records[idx].approverRole = currentRole;
  records[idx].opinion = opinion || '同意出编';
  records[idx].timeline = records[idx].timeline || [];
  records[idx].timeline.push({
    time: new Date().toISOString(),
    action: '审批通过',
    operator: getApproverName(),
    opinion: opinion || '同意出编'
  });

  doPostApproveActions(records[idx]);

  saveRecords(records);
  showToast('审批通过 — 人员库、编制统计、台账已自动更新，教师账号已冻结', 'success');
  setTimeout(function() { goBack(); }, 1500);
}

function showRejectModal() {
  var modalHtml =
    '<div class="modal-overlay" id="rejectModal">' +
      '<div class="modal-container">' +
        '<h3>审批驳回</h3>' +
        '<div class="form-group"><label>驳回原因（必填）</label>' +
        '<textarea id="rejectReason" rows="4" placeholder="请填写驳回原因..."></textarea></div>' +
        '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:16px;">' +
          '驳回后，学校管理员可修改人员信息、材料后整体重新提交。' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelReject">取消</button>' +
          '<button class="btn-confirm danger" id="confirmReject">确认驳回</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('cancelReject').onclick = function() { document.getElementById('rejectModal').remove(); };
  document.getElementById('confirmReject').onclick = doReject;
}

function doReject() {
  var reason = document.getElementById('rejectReason').value.trim();
  if (!reason) { showToast('请填写驳回原因'); return; }
  document.getElementById('rejectModal').remove();

  var records = loadRecords();
  var idx = records.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx === -1) { showToast('记录不存在'); return; }

  records[idx].status = 'rejected';
  records[idx].rejectReason = reason;
  records[idx].timeline = records[idx].timeline || [];
  records[idx].timeline.push({
    time: new Date().toISOString(),
    action: '审批驳回',
    operator: getApproverName(),
    opinion: reason
  });

  saveRecords(records);
  showToast('已驳回');
  setTimeout(function() { goBack(); }, 1500);
}

// ===== POST-APPROVE ACTIONS =====
function doPostApproveActions(record) {
  var count = record.applicants ? record.applicants.length : 0;

  if (record.staffingType === 'career') {
    record.currentCareerStaff = (record.currentCareerStaff || 0) - count;
    record.unusedCareerPlan = (record.unusedCareerPlan || 0) + count;
  } else {
    record.currentControlStaff = (record.currentControlStaff || 0) - count;
    record.unusedControlQuota = (record.unusedControlQuota != null ? record.unusedControlQuota : ((record.authControlNo || 0) - (record.currentControlStaff || 0))) + count;
  }

  // Generate exit ledger entries
  var ledger = JSON.parse(localStorage.getItem('exit_ledger') || '[]');
  var applicants = record.applicants || [];
  for (var i = 0; i < applicants.length; i++) {
    var a = applicants[i];
    ledger.push({
      ledgerId: 'OCL' + new Date().toISOString().replace(/[-:T]/g, '').substring(0, 14) + String(i + 1).padStart(2, '0'),
      applicationId: record.id,
      schoolName: record.schoolName,
      schoolType: record.schoolType,
      staffingType: record.staffingType,
      name: a.name,
      gender: a.gender || '',
      idCard: a.idCard || '',
      exitForm: a.exitForm || '',
      docNumber: a.docNumber || '',
      rosterBook: a.rosterBook || '',
      approvedAt: new Date().toISOString(),
      approver: getApproverName()
    });
  }
  localStorage.setItem('exit_ledger', JSON.stringify(ledger));

  // Freeze teacher accounts on exit approval
  var accounts = JSON.parse(localStorage.getItem('teacher_accounts') || '[]');
  var frozenCount = 0;
  applicants.forEach(function(a) {
    if (!a.idCard) return;
    var match = accounts.filter(function(t) { return t.idCard === a.idCard && t.status === 'active'; });
    match.forEach(function(acct) {
      acct.status = 'frozen';
      acct.frozenAt = new Date().toISOString();
      acct.frozenReason = 'exit';
      if (acct.exitRecords.indexOf(record.id) === -1) {
        acct.exitRecords.push(record.id);
      }
      frozenCount++;
    });
  });
  if (frozenCount > 0) {
    localStorage.setItem('teacher_accounts', JSON.stringify(accounts));
  }
}

// ===== NAVIGATION =====
function goBack() {
  if (currentRole === 'school') {
    window.location.href = '教师出编管理（学校管理员视角）.html?role=school';
  } else {
    window.location.href = '教师出编管理（主管单位视角）.html?role=' + currentRole;
  }
}

// ===== SIDEBAR =====
function switchRole(role) {
  if (role === currentRole) return;
  if (role === 'school') {
    window.location.href = '教师出编管理（学校管理员视角）.html?role=school';
  } else if (role === 'city' || role === 'district') {
    window.location.href = '教师出编管理（主管单位视角）.html?role=' + role;
  } else {
    showToast('教师角色无操作权限');
  }
}

function updateRoleUI() {
  var roleData = ROLES[currentRole];
  document.getElementById('userAvatar').textContent = roleData.short;
  document.getElementById('userName').textContent = roleData.name;
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === currentRole);
  });
}

function renderSidebar() {
  var roleData = ROLES[currentRole];
  if (!roleData) { document.getElementById('sidebarMenu').innerHTML = ''; return; }
  var sidebar = roleData.sidebar;
  var html = '';
  (sidebar.top || []).forEach(function(item) {
    html += '<a class="menu-item" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[item.icon] || '') + '<span class="menu-label">' + item.label + '</span></a>';
  });
  (sidebar.groups || []).forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      html += '<a class="menu-item' + (item.id === 'exit' ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[MENU_ICONS[item.id] || 'file']) + '<span class="menu-label">' + item.label + '</span>' + (item.badge ? '<span class="menu-badge">' + item.badge + '</span>' : '') + '</a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') {
    if (currentRole === 'city' || currentRole === 'district') { window.location.href = '教师入编管理（主管单位视角）.html?role=' + currentRole; return; }
    if (currentRole === 'school') { window.location.href = '教师入编管理（学校管理员视角）.html?role=school'; return; }
  }
  if (id === 'exit') { goBack(); return; }
  if (id === 'promote') { window.location.href = 'promote-list-admin.html?role=' + currentRole; return; }
  if (id === 'postset') { window.location.href = 'post-list-admin.html?role=' + currentRole; return; }
  if (id === 'recruit') { window.location.href = 'recruit-list-admin.html?role=' + currentRole; return; }
  if (id === 'employ') { var url = getEmployUrl(); if (url) window.location.href = url; else showToast('跳转至：聘用手续办理'); return; }

  if (id === 'account') { window.location.href = 'account-management.html'; return; }
  if (id === 'ledger') { var lr = (typeof currentUser!=='undefined'?currentUser.role:currentRole); window.location.href = (lr === 'city' || lr === 'district') ? 'org-ledger-admin.html' : lr === 'school' ? 'org-ledger-school.html' : 'workbench.html'; return; }

  showToast('跳转至：' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ===== UTILS =====
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  type = type || '';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function() { el.remove(); }, 1500);
}

function resetDemoData() {
  localStorage.removeItem('exit_records');
  localStorage.removeItem('exit_seq');
  localStorage.removeItem('exit_ledger');
  location.reload();
}

// ===== INIT =====
(function init() {
  var params = new URLSearchParams(window.location.search);
  var urlRole = params.get('role');
  if (urlRole === 'city' || urlRole === 'district' || urlRole === 'school') {
    currentRole = urlRole;
  }
  updateRoleUI();
  renderSidebar();

  var recordId = params.get('id') || 'OC20260510001';
  currentRecord = findRecord(recordId);
  renderPage();
})();


</script>
