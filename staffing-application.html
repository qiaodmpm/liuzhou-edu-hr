<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编制使用申请 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}

/* Sidebar bottom */
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

/* Role Switcher */
.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }

.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* Page header */
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.page-header-left h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-header-left .subtitle { font-size: 12px; color: var(--text-light); }
.page-header-right { display: flex; gap: 10px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: var(--transition); border: 1px solid transparent;
  font-family: inherit; text-decoration: none;
}
.btn-primary {
  background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
  color: #fff;
}
.btn-primary:hover { box-shadow: 0 4px 12px rgba(30,64,175,0.3); transform: translateY(-1px); }
.btn-outline {
  background: #fff; color: var(--primary); border-color: var(--border);
}
.btn-outline:hover { border-color: var(--primary); background: var(--primary-light); }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* Section header */
.section-header { display: flex; align-items: center; }
.section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); }

/* Two-column side-by-side */
.two-col-row { display: flex; gap: 20px; align-items: flex-start; }
.two-col-row .col-left { flex: 0 0 360px; min-width: 0; }
.two-col-row .col-right { flex: 1; min-width: 0; }
@media (max-width: 1400px) { .two-col-row { flex-direction: column; } .two-col-row .col-left { flex: none; } }

/* Batch card */
.batch-list { display: flex; flex-direction: column; gap: 10px; }
.batch-card {
  background: #fff; border-radius: var(--radius-lg); padding: 16px 18px;
  border: 1.5px solid var(--border); cursor: pointer; transition: var(--transition);
}
.batch-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
.batch-card.selected { border-color: var(--primary); background: var(--primary-light); }
.batch-card.auto { border-left: 3px solid #10B981; }
.batch-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.batch-card-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; cursor: pointer; }
.batch-card-name:hover { color: var(--primary); }
.batch-card-status {
  display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: 500; flex-shrink: 0;
}
.batch-card-status.active { background: #EFF6FF; color: var(--primary); }
.batch-card-status.closed { background: #F1F5F9; color: #64748B; }
.batch-card-meta { font-size: 11px; color: var(--text-light); margin-bottom: 10px; display: flex; gap: 16px; }
.batch-card-progress { margin-bottom: 10px; }
.batch-card-progress .progress-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.batch-card-progress-text { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.batch-card-progress .progress-bar {
  height: 6px; background: #E2E8F0; border-radius: 3px; overflow: hidden;
}
.batch-card-progress .progress-fill { height: 100%; border-radius: 3px; transition: width var(--transition); }
.progress-fill.approved { background: var(--success); }
.progress-fill.submitted { background: var(--accent); }
.progress-fill.rejected { background: var(--danger); }
.batch-card-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.batch-card-actions .btn { font-size: 11px; padding: 4px 12px; }

/* Year filter row */
.year-filter-row { margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.year-filter-row .filter-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }

/* Batch summary checkbox */
.batch-summary-checkbox {
  width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--border);
  cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.batch-summary-checkbox.checked { background: var(--primary); border-color: var(--primary); }
.batch-summary-checkbox.checked:after {
  content: '✓'; color: #fff; font-size: 11px; font-weight: 600; line-height: 1;
}

/* Year summary bar */
.year-summary-bar {
  margin-top: 14px; display: flex; gap: 10px; align-items: center;
}

/* School batch table */
.school-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.school-table thead th {
  padding: 10px 14px; text-align: left; font-weight: 600; font-size: 11px;
  color: var(--text-secondary); background: #F8FAFC; border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.school-table tbody td {
  padding: 10px 14px; border-bottom: 1px solid #F1F5F9;
  vertical-align: middle;
}
.school-table tbody tr.row-auto td { background: #FAFBFE; }
.school-table tbody tr.row-auto td:first-child { border-left: 3px solid #DBEAFE; }
.school-table tbody tr.row-closed { color: var(--text-light); }
.school-table .batch-name { font-weight: 600; color: var(--text); }
.school-table tr.row-closed .batch-name { color: var(--text-light); }
.school-table .batch-meta { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.school-table .batch-meta span { margin-right: 12px; }
.school-table .batch-group-first td { border-top: 2px solid var(--border); }
.school-table .rowspan-cell { border-right: 1px solid var(--border); }
.school-table .type-col { font-size: 12px; font-weight: 500; white-space: nowrap; }
.school-table .type-col .type-icon { margin-right: 2px; }
.school-table .action-col { white-space: nowrap; }
.school-table .action-col .btn { font-size: 11px; padding: 3px 10px; }
.school-table .action-col a { font-size: 12px; color: var(--primary); text-decoration: none; margin-right: 8px; }
.school-table .action-col a:hover { text-decoration: underline; }
.school-table .action-col a.danger { color: #DC2626; }
.sbc-status-count { font-size: 10px; color: var(--text-secondary); white-space: nowrap; }
.sbc-status-count.clickable { cursor: pointer; color: var(--primary); }
.sbc-status-count.clickable:hover { text-decoration: underline; }
.status-summary { font-size: 10px; font-weight: 500; white-space: nowrap; }
.status-summary.approved { color: #059669; }
.status-summary.pending { color: #D97706; }
.status-summary.rejected { color: #DC2626; }

/* Status badge (shared with modal) */
.sbc-status {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 600; text-align: center; white-space: nowrap;
}
.sbc-status.approved { background: #ECFDF5; color: #059669; }
.sbc-status.reviewing { background: #FFFBEB; color: #D97706; }
.sbc-status.submitted { background: #EFF6FF; color: #1E40AF; }
.sbc-status.rejected { background: #FEF2F2; color: #DC2626; }
.sbc-status.none { background: #F8FAFC; color: #94A3B8; }

/* Batch dropdown filter */
.batch-filter-bar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  font-size: 13px;
}
.batch-filter-bar label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }

/* Status filter buttons */
.status-filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.status-fbtn {
  padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: var(--transition); border: 1px solid var(--border);
  background: #fff; color: var(--text-secondary); font-family: inherit;
}
.status-fbtn:hover { border-color: var(--accent); color: var(--primary); }
.status-fbtn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Type filter buttons (事业编 / 控制数) */
.type-filters { display: flex; gap: 8px; }
.type-fbtn {
  padding: 6px 18px; border-radius: 20px; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: var(--transition); border: 1px solid var(--border);
  background: #fff; color: var(--text-secondary); font-family: inherit;
}
.type-fbtn:hover { border-color: var(--accent); color: var(--primary); }
.type-fbtn.active-all { background: var(--text); color: #fff; border-color: var(--text); }
.type-fbtn.active-career { background: #1E40AF; color: #fff; border-color: #1E40AF; box-shadow: 0 2px 8px rgba(30,64,175,0.3); }
.type-fbtn.active-career:hover { box-shadow: 0 4px 12px rgba(30,64,175,0.4); transform: translateY(-1px); }
.type-fbtn.active-control { background: #6D28D9; color: #fff; border-color: #6D28D9; box-shadow: 0 2px 8px rgba(109,40,217,0.3); }
.type-fbtn.active-control:hover { box-shadow: 0 4px 12px rgba(109,40,217,0.4); transform: translateY(-1px); }

/* Modal overlay */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal {
  background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  width: 480px; max-width: 90vw; max-height: 80vh; overflow-y: auto;
}
.modal-wide { width: 680px; }
.modal-xwide { width: 95vw; max-width: 1200px; }
.modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { cursor: pointer; color: var(--text-light); font-size: 20px; padding: 4px; border: none; background: none; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-body .form-group { margin-bottom: 16px; }
.modal-body .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
.modal-body .form-group input, .modal-body .form-group textarea, .modal-body .form-group select {
  width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border);
  border-radius: 6px; font-family: inherit; outline: none;
}
.modal-body .form-group input:focus, .modal-body .form-group textarea:focus, .modal-body .form-group select:focus { border-color: var(--accent); }
.modal-body .form-group textarea { resize: vertical; min-height: 80px; }

/* Upload area (shared with modal) */
.upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 32px; text-align: center; cursor: pointer; transition: var(--transition);
}
.upload-area:hover { border-color: var(--accent); background: #F8FAFC; }
.upload-area.drag-over { border-color: var(--primary); background: var(--primary-light); }
.upload-area .upload-icon { font-size: 40px; margin-bottom: 8px; }
.upload-area .upload-text { font-size: 13px; color: var(--text-secondary); }
.upload-area .upload-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.upload-file {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: #F0FDF4; border-radius: 6px; margin-top: 12px; font-size: 13px;
  word-break: break-all;
}
.upload-file .remove { color: var(--danger); cursor: pointer; margin-left: auto; flex-shrink: 0; }

/* Confirm table */
.confirm-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
.confirm-table thead th {
  padding: 10px 12px; text-align: left; font-weight: 600; font-size: 11px;
  color: var(--text-secondary); background: #F8FAFC; border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.confirm-table tbody td {
  padding: 9px 12px; border-bottom: 1px solid #F1F5F9; vertical-align: middle;
}
.confirm-table .num-input {
  width: 80px; padding: 6px 10px; border: 1px solid var(--border);
  border-radius: 4px; text-align: center; font-size: 13px; font-family: inherit; outline: none;
}
.confirm-table .num-input:focus { border-color: var(--accent); }
.confirm-table .num-input.error { border-color: var(--danger); background: #FEF2F2; }
.modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.modal-footer .btn-cancel { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
.modal-footer .btn-cancel:hover { border-color: var(--text-light); }
.modal-footer .btn-danger { background: var(--danger); color: #fff; }
.modal-footer .btn-danger:hover { opacity: 0.9; }

/* Batch detail modal */
.batch-detail-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px solid #F1F5F9; }
.batch-detail-row .bdl { color: var(--text-secondary); }
.batch-detail-row .bdv { color: var(--text); font-weight: 500; }

/* Filter bar */
.filter-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 18px; background: #fff; border-radius: var(--radius);
  border: 1px solid var(--border); margin-bottom: 16px;
}
.filter-bar label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.filter-select, .filter-input {
  padding: 6px 12px; font-size: 13px; border: 1px solid var(--border);
  border-radius: 6px; background: #fff; color: var(--text);
  font-family: inherit; outline: none;
}
.filter-select:focus, .filter-input:focus { border-color: var(--accent); }
.filter-input { width: 160px; }
.filter-spacer { flex: 1; }

/* Table card */
.table-card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden;
}
.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  padding: 12px 16px; text-align: left; font-weight: 600; font-size: 12px;
  color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: 12px 16px; border-bottom: 1px solid #F1F5F9;
  color: var(--text); white-space: nowrap;
}
tbody tr:hover { background: #F8FAFC; }
tbody tr:last-child td { border-bottom: none; }
.tb-link { color: var(--primary); cursor: pointer; text-decoration: none; }
.tb-link:hover { text-decoration: underline; }

/* Status badges */
.status {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 500;
}
.status.submitted { background: #EFF6FF; color: #1E40AF; }
.status.reviewing { background: #FFFBEB; color: #D97706; }
.status.approved { background: #ECFDF5; color: #10B981; }

// ===== BATCH STATS HELPER =====
function getBatchStats(batchId) {
  var subs = SUBMISSIONS.filter(function(s) { return s.batchId === batchId; });
  var careerSubs = subs.filter(function(s) { return s.staffingType === 'career'; });
  var controlSubs = subs.filter(function(s) { return s.staffingType === 'control'; });
  function count(statuses) { return subs.filter(function(s) { return statuses.indexOf(s.status) >= 0; }).length; }
  function countC(statuses) { return careerSubs.filter(function(s) { return statuses.indexOf(s.status) >= 0; }).length; }
  function countCtrl(statuses) { return controlSubs.filter(function(s) { return statuses.indexOf(s.status) >= 0; }).length; }
  return {
    total: subs.length,
    submitted: count(['submitted','reviewing']),
    firstApproved: count(['first_approved']),
    finalSubmitted: count(['final_submitted']),
    approved: count(['approved']),
    rejected: count(['rejected']),
    career: {
      total: careerSubs.length,
      submitted: countC(['submitted','reviewing']),
      firstApproved: countC(['first_approved']),
      finalSubmitted: countC(['final_submitted']),
      approved: countC(['approved']),
      rejected: countC(['rejected'])
    },
    control: {
      total: controlSubs.length,
      submitted: countCtrl(['submitted','reviewing']),
      firstApproved: countCtrl(['first_approved']),
      finalSubmitted: countCtrl(['final_submitted']),
      approved: countCtrl(['approved']),
      rejected: countCtrl(['rejected'])
    }
  };
}

// ===== YEAR FILTER =====
function getBatchYears(batches) {
  var years = [];
  batches.forEach(function(b) {
    if (years.indexOf(b.year) === -1) years.push(b.year);
  });
  years.sort(function(a, b) { return b.localeCompare(a); });
  return years;
}

function getFilteredBatches(batches) {
  if (!currentBatchYear) return batches;
  return batches.filter(function(b) { return b.year === currentBatchYear; });
}

function renderYearFilter(batches) {
  var years = getBatchYears(batches);
  if (years.length <= 1) return '';
  var h = '<span class="filter-label">年度筛选：</span>';
  h += '<select class="filter-select" onchange="setBatchYear(this.value)">';
  h += '<option value="all">全部年度</option>';
  years.forEach(function(y) {
    h += '<option value="' + y + '"' + (currentBatchYear === y ? ' selected' : '') + '>' + y + ' 年</option>';
  });
  h += '</select>';
  return h;
}

function setBatchYear(year) {
  currentBatchYear = year === 'all' ? null : year;
  var batches = getAllBatches();
  var filtered = getFilteredBatches(batches);
  if (filtered.length > 0 && (!selectedBatchId || !filtered.some(function(b) { return b.id === selectedBatchId; }))) {
    selectedBatchId = filtered[0].id;
  }
  currentFilter = 'all';
  staffingTypeFilter = 'all';
  renderMain();
}

function renderSchoolBatchCards(batches) {
  var h = '<div class="batch-list">';

    h += '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无批次</div></div>';
    return h + '</div>';
  }
  for (var i = 0; i < batches.length; i++) {
    var b = batches[i];
    var isSelected = b.id === selectedBatchId;
    var isAuto = b.type === 'auto';
    var subs = getSchoolSubmissionsForBatch(b.id);
    var careerCount = 0, controlCount = 0;
    for (var si = 0; si < subs.length; si++) {
      if (subs[si].staffingType === 'career') careerCount++;
      else controlCount++;
    }

    h += '<div class="batch-card' + (isSelected ? ' selected' : '') + (isAuto ? ' auto' : '') + '" onclick="selectSchoolBatch(\'' + b.id + '\')">';
    h += '<div class="batch-card-header">';
    h += '<span class="batch-card-name">' + b.name + '</span>';
    h += '<span class="batch-card-status ' + (b.status === '进行中' ? 'active' : 'closed') + '">' + b.status + '</span>';
    h += '</div>';
    if (isAuto) {
      h += '<div class="batch-card-meta"><span>📅 ' + b.year + '年全年 · 系统自动生成</span></div>';
    } else {
      h += '<div class="batch-card-meta"><span>📅 ' + (b.startDate || '') + ' ~ ' + (b.deadline || '') + '</span><span>发布：' + (b.org || '') + '</span></div>';
    }
    // School-specific summary
    if (subs.length > 0) {

}

function renderSchoolSubmissionTable(batchId) {
  var subs = getSchoolSubmissionsForBatch(batchId);

  // Staffing type filter
  if (staffingTypeFilter === 'career') {
    subs = subs.filter(function(s) { return s.staffingType === 'career'; });
  } else if (staffingTypeFilter === 'control') {
    subs = subs.filter(function(s) { return s.staffingType === 'control'; });
  }

  // Status filter
  if (currentFilter === 'pending') {
    subs = subs.filter(function(s) { return s.status === 'submitted' || s.status === 'reviewing' || s.status === 'first_approved' || s.status === 'final_submitted'; });
  } else if (currentFilter === 'approved') {
    subs = subs.filter(function(s) { return s.status === 'approved'; });
  } else if (currentFilter === 'rejected') {
    subs = subs.filter(function(s) { return s.status === 'rejected'; });
  }

  var batch = getSchoolBatches().find(function(b) { return b.id === batchId; });
  var isAuto = batch && batch.type === 'auto';
  var isActive = batch && batch.status === '进行中';

  // Empty state — no submissions at all for this batch
  if (subs.length === 0 && currentFilter === 'all' && staffingTypeFilter === 'all') {
    var eh = '<div class="empty-state">';
    eh += '<div class="empty-icon">📝</div>';
    eh += '<div class="empty-text">该批次暂未申报</div>';
    if (isActive) {
      eh += '<div style="margin-top:12px;display:flex;gap:8px;justify-content:center;">';
      eh += '<button class="btn btn-primary btn-sm" onclick="window.location.href=\'staffing-form.html?batchId=' + encodeURIComponent(batchId) + '&batchName=' + encodeURIComponent(batch.name) + '&staffingType=career\'">申报事业编</button>';
      eh += '<button class="btn btn-primary btn-sm" onclick="window.location.href=\'staffing-form.html?batchId=' + encodeURIComponent(batchId) + '&batchName=' + encodeURIComponent(batch.name) + '&staffingType=control\'">申报控制数</button>';
      eh += '</div>';
    }
    eh += '</div>';
    return eh;
  }

  // Filtered empty
  if (subs.length === 0) {
    return '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">当前筛选条件下无申报记录</div></div>';
  }

  // Table
  var h = '<div class="table-card"><div class="table-wrapper"><table>';
  h += '<thead><tr>';
  h += '<th>申报编号</th>';
  h += '<th>批次</th>';
  h += '<th>编制类型</th>';
  h += '<th>申请数</th>';
  h += '<th>统一公开招聘</th>';
  h += '<th>单位自主实施招聘</th>';
  h += '<th>中高级人才招聘</th>';
  h += '<th>引进高层次人才</th>';
  h += '<th>调动</th>';
  h += '<th>其他</th>';
  h += '<th>附件</th>';
  h += '<th>编办确认材料</th>';
  h += '<th>审核状态</th>';
  h += '<th>提交时间</th>';
  h += '<th>操作</th>';
  h += '</tr></thead><tbody>';

  for (var i = 0; i < subs.length; i++) {
    var s = subs[i];
    var isCareer = s.staffingType === 'career';
    var typeLabel = STAFFING_TYPE_MAP[s.staffingType] || '控制数';
    var typeColor = isCareer ? 'color:#1456F0;' : 'color:#0E3EC0;';
    var uf = s.useForms || {};
    var useCount = Object.values(uf).reduce(function(a,b){return a+(b||0);},0);
    var hasFinalDoc = (s.schoolFinalConfirm && s.schoolFinalConfirm.document) || s.followUp;

    h += '<tr>';
    h += '<td><span class="tb-link" onclick="window.location.href=\'staffing-detail.html?id=' + s.id + '\'">' + s.id + '</span></td>';
    h += '<td>' + (s.batchName || '—') + '</td>';
    h += '<td><span style="font-size:11px;' + typeColor + 'font-weight:500;">' + typeLabel + '</span></td>';
    h += '<td>' + (useCount || '—') + '</td>';
    h += '<td>' + (uf.publicRecruit || 0) + '</td>';
    h += '<td>' + (uf.selfRecruit || 0) + '</td>';
    h += '<td>' + (uf.talentMid || 0) + '</td>';
    h += '<td>' + (uf.talentHigh || 0) + '</td>';
    h += '<td>' + (uf.transfer || 0) + '</td>';
    h += '<td>' + (uf.other || 0) + '</td>';
    h += '<td>' + (s.attachment9 ? '<a onclick="downloadMockFile(\'' + s.id + '\',\'attachment\')" style="color:var(--primary);cursor:pointer;font-size:12px;">📥 下载</a>' : '<span style="color:var(--text-light);">——</span>') + '</td>';
    h += '<td>' + (hasFinalDoc ? '<a onclick="downloadMockFile(\'' + s.id + '\',\'finalConfirm\')" style="color:var(--primary);cursor:pointer;font-size:12px;">📥 下载</a>' : '<span style="color:var(--text-light);">——</span>') + '</td>';
    h += '<td><span class="sbc-status ' + getStatusBadgeClass(s.status) + '" style="font-size:10px;">' + (STATUS_MAP[s.status] || s.status) + '</span></td>';
    h += '<td>' + (s.submitDate || '—') + '</td>';
    h += '<td><div class="action-links">';
    h += '<a href="staffing-detail.html?id=' + s.id + '">查看</a>';
    if (s.status === 'first_approved') {
      h += '<a onclick="openFinalConfirmModal(\'' + s.id + '\')" style="color:var(--primary);cursor:pointer;">提交编办确认</a>';
	      h += '<a onclick="exportSingleRecord(\'' + s.id + '\')" style="color:var(--primary);cursor:pointer;">导出数据</a>';
	    }
    if (s.status === 'rejected') {
      h += '<a href="staffing-form.html?id=' + s.id + '&staffingType=' + s.staffingType + '" class="danger">修改重提</a>';
    }
    h += '</div></td>';
    h += '</tr>';
  }

  h += '</tbody></table></div>';
  h += '<div class="pagination"><span>共 ' + subs.length + ' 条</span></div>';
  h += '</div>';

  // Missing types prompt for managed batches
  if (!isAuto && isActive) {
    var existingTypes = subs.map(function(s) { return s.staffingType; });
    // Check original unfiltered submissions for missing types
    var allSubs = getSchoolSubmissionsForBatch(batchId);
    var allTypes = allSubs.map(function(s) { return s.staffingType; });
    var missingTypes = [];
    if (allTypes.indexOf('career') === -1) missingTypes.push({key: 'career', label: '事业编'});
    if (allTypes.indexOf('control') === -1) missingTypes.push({key: 'control', label: '控制数'});
    if (missingTypes.length > 0) {
      h += '<div style="margin-top:12px;display:flex;gap:8px;align-items:center;padding:10px 16px;background:#FFFBEB;border-radius:8px;font-size:13px;">';
      h += '<span style="color:#D97706;">📌 还可申报：</span>';
      for (var m = 0; m < missingTypes.length; m++) {
        h += '<button class="btn btn-primary btn-sm" onclick="window.location.href=\'staffing-form.html?batchId=' + encodeURIComponent(batchId) + '&batchName=' + encodeURIComponent(batch.name) + '&staffingType=' + missingTypes[m].key + '\'">申报' + missingTypes[m].label + '</button>';
      }
      h += '</div>';
    }
  }

  // Auto batch: always allow new submissions
  if (isAuto && isActive) {
    h += '<div style="margin-top:12px;display:flex;gap:8px;align-items:center;padding:10px 16px;background:#EFF6FF;border-radius:8px;font-size:13px;">';
    h += '<span style="color:#1E40AF;">📝 自主申报：</span>';
    h += '<button class="btn btn-primary btn-sm" onclick="window.location.href=\'staffing-form.html?batchId=' + encodeURIComponent(batchId) + '&batchName=' + encodeURIComponent(batch.name) + '&staffingType=career\'">申报事业编</button>';
    h += '<button class="btn btn-primary btn-sm" onclick="window.location.href=\'staffing-form.html?batchId=' + encodeURIComponent(batchId) + '&batchName=' + encodeURIComponent(batch.name) + '&staffingType=control\'">申报控制数</button>';
    h += '</div>';
  }

  return h;
}

function setSchoolYearFilter(val) {
  schoolYearFilter = val;

function openModal(content, extraClass) {

  box.className = 'modal' + (extraClass ? ' ' + extraClass : '');

}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function showSubmissionHistory(batchId, staffingType) {
  var schoolName = ROLES[currentRole].org;
  var subs = getSchoolSubmissionsForBatchAndType(batchId, staffingType);
  var typeLabel = STAFFING_TYPE_MAP[staffingType] || staffingType;
  var batchName = '';
  for (var i = 0; i < AUTO_BATCHES.length; i++) {
    if (AUTO_BATCHES[i].id === batchId) { batchName = AUTO_BATCHES[i].name; break; }
  }
  if (!batchName) {
    for (var i = 0; i < BATCHES.length; i++) {
      if (BATCHES[i].id === batchId) { batchName = BATCHES[i].name; break; }

  }
  var c = '<div class="modal-header"><h3>申报记录 — ' + typeLabel + '</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  c += '<div class="modal-body">';
  c += '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:14px;">' + batchName + ' · ' + schoolName + '</p>';
  if (subs.length === 0) {
    c += '<div class="empty-state"><div class="empty-text">暂无申报记录</div></div>';
  } else {
    c += '<div style="display:flex;flex-direction:column;gap:8px;">';
    subs.forEach(function(s, idx) {
      c += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#F8FAFC;border-radius:8px;border:1px solid var(--border);">';
      c += '<div>';
      c += '<div style="font-size:13px;font-weight:500;">' + s.id + '</div>';
      c += '<div style="font-size:11px;color:var(--text-light);margin-top:2px;">' + (s.submitDate || '—') + '</div>';
      c += '</div>';
      c += '<div style="display:flex;align-items:center;gap:10px;">';
      c += '<span class="sbc-status ' + getStatusBadgeClass(s.status) + '" style="font-size:10px;">' + (STATUS_MAP[s.status] || s.status) + '</span>';
      c += '<a href="staffing-detail.html?id=' + s.id + '" style="font-size:12px;color:var(--primary);text-decoration:none;" class="tb-link">查看</a>';
      if (s.status === 'first_approved') {
        c += '<button class="btn btn-primary btn-sm" onclick="closeModal();openFinalConfirmModal(\'' + s.id + '\')" style="margin-left:6px;font-size:11px;">提交编办确认</button>';
      }
      if (s.status === 'rejected') {
        c += '<a href="staffing-form.html?id=' + s.id + '&staffingType=' + s.staffingType + '" style="font-size:12px;color:#DC2626;text-decoration:none;">修改重提</a>';
      }
      c += '</div>';
      c += '</div>';
    });
    c += '</div>';
  }
  c += '</div>';
  c += '<div class="modal-footer"><button class="btn btn-cancel" onclick="closeModal()">关闭</button></div>';
  openModal(c);
}
document.addEventListener('click', function(e) {

});

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; }
  else if (id === 'staffing') { return; }
  else if (id === 'entry') { var url = getEntryUrl(); if (url) window.location.href = url; else showToast('跳转至：入编申请'); }
  else if (id === 'exit') { var url = getExitUrl(); if (url) window.location.href = url; else showToast('跳转至：教师出编管理'); }
  else if (id === 'promote') { var url = getPromoteUrl(); if (url) window.location.href = url; else showToast('无权限访问', 'warning'); }
  else if (id === 'postset') { var url = getPostUrl(); if (url) window.location.href = url; else showToast('无权限访问', 'warning'); }
  else if (id === 'recruit') { var url = getRecruitUrl(); if (url) window.location.href = url; else showToast('无权限访问', 'warning'); }
  else if (id === 'employ') { var url = getEmployUrl(); if (url) window.location.href = url; else showToast('跳转至：聘用手续办理'); }
	  else if (id === "account") { window.location.href = 'account-management.html'; }
  else { showToast('跳转至：' + el.textContent.trim()); }
}

function renderMain() {
  var data = ROLES[currentRole];

  document.getElementById('userAvatar').textContent = data.short;

  if (currentRole === 'teacher') {
    document.getElementById('contentArea').innerHTML =
      '<div class="empty-state">' +
      '<div class="empty-icon">🔒</div>' +

    }

      html += '<span style="font-size:12px;color:var(--text-secondary);">已选 ' + selectedBatchIdsForSummary.length + ' 个批次</span>';
      html += '<button class="btn btn-primary btn-sm" onclick="generateYearSummary()" style="margin-left:auto;">📊 生成汇总</button>';
      html += '<button class="btn btn-outline btn-sm" onclick="toggleYearSummaryMode()">取消</button>';

    html += '</div></div>';

  document.getElementById('contentArea').innerHTML = html;

function getFilteredSubmissions() {
  var subs = SUBMISSIONS;
  // Role filter
  if (currentRole === 'district') {
    subs = subs.filter(function(s) { return s.schoolType === '鱼峰区属'; });
  } else if (currentRole === 'school') {
    // Reserved: school submissions table view (school view now uses renderSchoolSubmissionTable)
    subs = subs.filter(function(s) { return s.school === '柳州市第八中学'; });
  }
  // Batch filter (for admin view)
  if ((currentRole === 'city' || currentRole === 'district') && selectedBatchId) {
    subs = subs.filter(function(s) { return s.batchId === selectedBatchId; });
  }
  // Staffing type filter
  if (staffingTypeFilter === 'career') {
    subs = subs.filter(function(s) { return s.staffingType === 'career'; });
  } else if (staffingTypeFilter === 'control') {
    subs = subs.filter(function(s) { return s.staffingType === 'control'; });
  }
  // Status filter
  if (currentFilter === 'pending') {
    subs = subs.filter(function(s) { return s.status === 'submitted' || s.status === 'reviewing' || s.status === 'first_approved' || s.status === 'final_submitted'; });
  } else if (currentFilter === 'approved') {
    subs = subs.filter(function(s) { return s.status === 'approved'; });
  } else if (currentFilter === 'rejected') {
    subs = subs.filter(function(s) { return s.status === 'rejected'; });
  }
  return subs;
}

function getJurisdictionSchools() {
  if (currentRole === 'city') {
    return ALL_SCHOOLS.filter(function(s) { return s.type === '市直属'; });
  } else if (currentRole === 'district') {
    return ALL_SCHOOLS.filter(function(s) { return s.type === '鱼峰区属'; });
  }
  return [];
}

function getUnsubmittedSchools() {
  var schools = getJurisdictionSchools();
  var submittedSchools = SUBMISSIONS.filter(function(s) { return s.batchId === selectedBatchId; }).map(function(s) { return s.school; });
  return schools.filter(function(s) { return submittedSchools.indexOf(s.name) === -1; });
}

function getReminderKey(batchId, schoolName) {
  return batchId + '|' + schoolName;
}

function getEmployUrl() {
  if (currentRole === 'city' || currentRole === 'district') return 'employ-list-admin.html?role=' + currentRole;
  if (currentRole === 'school') return 'employ-list-school.html';
  return null;
}

function canRemindToday(batchId, schoolName) {
  var key = getReminderKey(batchId, schoolName);
  var lastDate = reminderLog[key];
  if (!lastDate) return true;
  var today = new Date().toISOString().slice(0, 10);
  return lastDate !== today;
}

function remindSchool(batchId, schoolName, btnEl) {
  var key = getReminderKey(batchId, schoolName);
  var today = new Date().toISOString().slice(0, 10);
  reminderLog[key] = today;
  showToast('已向「' + schoolName + '」发送申报提醒');
  btnEl.textContent = '今日已提醒';
  btnEl.className = 'btn btn-outline btn-sm';
  btnEl.disabled = true;
  btnEl.style.opacity = '0.5';
  btnEl.style.cursor = 'not-allowed';
  btnEl.onclick = null;
}

function renderUnsubmittedTable() {
  var unsubmitted = getUnsubmittedSchools();
  var h = '';
  h += '<div class="table-card"><div class="table-wrapper"><table>';

function renderBatchCards(batches) {

    var rejectedPct = stats.total > 0 ? Math.round(stats.rejected / stats.total * 100) : 0;

function handleFinalDocSelect(e) {
  var f = e.target.files[0];
  if (!f) return;
  processFinalDoc(f);
  e.target.value = '';
}

function handleFinalDocDrop(e) {
  var files = e.dataTransfer.files;
  if (files.length > 0) processFinalDoc(files[0]);
}

function processFinalDoc(f) {
  // Validate file type
  var ext = '.' + f.name.split('.').pop().toLowerCase();
  var allowedExts = ['.pdf','.jpg','.jpeg','.png','.doc','.docx','.xls','.xlsx'];
  if (allowedExts.indexOf(ext) === -1) {
    showToast('不支持的文件格式（' + ext + '），请上传 PDF、Word、Excel 或图片文件');
    return;
  }
  // Block compressed archives
  if (['.zip','.rar','.7z','.gz','.tar'].indexOf(ext) !== -1) {
    showToast('不支持压缩包格式，请解压后上传原文件');
    return;
  }
  // Validate size
  if (f.size > 10 * 1024 * 1024) {
    showToast('文件大小 ' + (f.size / 1024 / 1024).toFixed(1) + ' MB 超过 10MB 上限，请压缩后重新上传');
    return;
  }

  _finalDocFile = f;
  var area = document.getElementById('finalDocArea');
  if (area) area.style.display = 'none';
  var display = document.getElementById('finalUploadedFile');
  if (display) {
    display.innerHTML = '<div class="upload-file">📎 ' + f.name + ' (' + (f.size / 1024 / 1024).toFixed(1) + ' MB)<span class="remove" onclick="removeFinalDoc()">✕ 移除</span></div>';
  }
}

function removeFinalDoc() {
  _finalDocFile = null;
  var inp = document.getElementById('finalDocInput');
  if (inp) inp.value = '';
  var area = document.getElementById('finalDocArea');
  if (area) area.style.display = '';
  var display = document.getElementById('finalUploadedFile');
  if (display) display.innerHTML = '';
}

function submitFinalConfirm(subId) {
  var s = null;
  for (var i = 0; i < SUBMISSIONS.length; i++) {
    if (SUBMISSIONS[i].id === subId) { s = SUBMISSIONS[i]; break; }
  }
  if (!s) return;

  // Validate per-item counts
  var inputs = document.querySelectorAll('.final-num-input');
  var details = [];
  var totalCount = 0;
  var valid = true;
  inputs.forEach(function(inp) {
    var val = parseInt(inp.value);
    var max = parseInt(inp.dataset.schoolNum);
    if (isNaN(val) || val < 0 || val > max) {
      inp.classList.add('error');
      valid = false;
    } else {
      inp.classList.remove('error');
      details.push({ type: inp.dataset.type, code: inp.dataset.code, schoolNum: max, finalNum: val });
      totalCount += val;
    }
  });
  if (!valid) { showToast('请正确填写编办核定数（0 ≤ 核定数 ≤ 学校申请数）'); return; }

  // Validate validity period
  var vStart = document.getElementById('finalValidityStart').value;
  var vEnd = document.getElementById('finalValidityEnd').value;
  if (!vStart || !vEnd) { showToast('请选择编制有效期起止日期'); return; }
  if (vEnd < vStart) { showToast('有效期结束日期不能早于开始日期'); return; }

  // Validate document
  if (!_finalDocFile) { showToast('请上传编办确认文档（必填）'); return; }

  // Update submission
  s.schoolFinalConfirm = {
    details: details,
    totalFinalCount: totalCount,
    validityStart: vStart,
    validityEnd: vEnd,
    document: { name: _finalDocFile.name, size: _finalDocFile.size },
    submitTime: new Date().toISOString().slice(0, 19).replace('T', ' '),
    submitter: ROLES[currentRole].name
  };
  s.status = 'final_submitted';

  saveData();
  closeModal();
  showToast('编办确认已提交，待主管单位二审确认');
  renderMain();
}

  content += '申报单位：' + (sub ? sub.school : '—') + '\n';

  var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
  showToast('正在下载 ' + fileName);
}
function saveData() {
  // Save SUBMISSIONS to localStorage for persistence
  try { localStorage.setItem('staffing_submissions', JSON.stringify(SUBMISSIONS)); } catch(e) {}
}

function exportSingleRecord(id) {
  var s = SUBMISSIONS.find(function(x) { return x.id === id; });
  if (!s) { showToast('未找到该申报记录'); return; }
  var uf = s.useForms || {};
  var totalCount = Object.values(uf).reduce(function(a,b){return a+(b||0);},0);

  if (s.staffingType === 'career') {
    // 事业编 — 附件2 格式
    var csv = '﻿申报编号,单位名称,核定编制数,实有在编人数,未使用计划数,申请总数,调动,公开招聘,自主招聘,中高级人才招聘,引进高层次人才,其他,审核状态,提交时间\n';
    csv += [
      s.id,
      s.school,
      s.totalStaff || '',
      s.currentStaff || '',
      s.unusedPlan || '',
      totalCount,
      uf.transfer || 0,
      uf.publicRecruit || 0,
      uf.selfRecruit || 0,
      uf.talentMid || 0,
      uf.talentHigh || 0,
      uf.other || 0,
      STATUS_MAP[s.status] || s.status,
      s.submitDate || ''
    ].join(',') + '\n';
    downloadCSV(csv, s.id + '_附件2_事业编_' + (s.submitDate || '') + '.csv');
  } else {
    // 控制数 — 附件9 格式
    var csv = '﻿申报编号,单位名称,核定控制数,实有控制数人数,未使用控制数,申请总数,调动,公开招聘,自主招聘,引进人才,其他,审核状态,提交时间\n';
    csv += [
      s.id,
      s.school,
      s.controlNum || '',
      s.controlActual || '',
      s.unusedControl || '',
      totalCount,
      uf.transfer || 0,
      uf.publicRecruit || 0,
      uf.selfRecruit || 0,
      uf.talent || 0,
      uf.other || 0,
      STATUS_MAP[s.status] || s.status,
      s.submitDate || ''
    ].join(',') + '\n';
    downloadCSV(csv, s.id + '_附件9_控制数_' + (s.submitDate || '') + '.csv');
  }
}

function downloadCSV(csv, filename) {
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出：' + filename);
}

function downloadBatchSummary(batchId) {
  openExportModal(batchId, 'batch');
}
function downloadYearSummary(year) {
  openExportModal(null, 'year');
}
function openExportModal(batchId, mode) {
  // Collect submissions for this batch
  var subs = batchId
    ? SUBMISSIONS.filter(function(s) { return s.batchId === batchId; })
    : SUBMISSIONS;

  // Collect filter options
  var types = [];
  var regions = [];
  var seenType = {}, seenRegion = {};
  subs.forEach(function(s) {
    var t = STAFFING_TYPE_MAP[s.staffingType] || s.staffingType;
    if (!seenType[t]) { seenType[t] = true; types.push(t); }
    var r = s.schoolType || '未知';
    if (!seenRegion[r]) { seenRegion[r] = true; regions.push(r); }
  });

  var c = '<div class="modal-header"><h3>' + (mode === 'batch' ? '批次汇总导出' : '年度汇总导出') + ' — 共 ' + subs.length + ' 条</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  c += '<div class="modal-body" style="padding:16px 20px;">';

  // Filter row
  c += '<div style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end;">';
  c += '<div class="form-group" style="margin-bottom:0;min-width:120px;"><label style="font-size:11px;">所属区域</label><select id="expRegion" onchange="filterExportTable()" style="padding:6px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;width:100%;">';
  c += '<option value="all">全部</option>';
  regions.forEach(function(r) { c += '<option value="' + r + '">' + r + '</option>'; });
  c += '</select></div>';
  c += '<div class="form-group" style="margin-bottom:0;min-width:110px;"><label style="font-size:11px;">编制类型</label><select id="expType" onchange="filterExportTable()" style="padding:6px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;width:100%;">';
  c += '<option value="all">全部</option>';
  types.forEach(function(t) { c += '<option value="' + t + '">' + t + '</option>'; });
  c += '</select></div>';
  c += '<div class="form-group" style="margin-bottom:0;min-width:100px;"><label style="font-size:11px;">审核状态</label><select id="expStatus" onchange="filterExportTable()" style="padding:6px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;width:100%;">';
  c += '<option value="all">全部</option>';
  c += '<option value="submitted">待一审</option><option value="first_approved">一审通过</option><option value="final_submitted">待二审</option><option value="approved">已通过</option><option value="rejected">已驳回</option>';
  c += '</select></div>';
  c += '<div style="flex:1;text-align:right;"><span style="font-size:11px;color:var(--text-light);" id="expFilteredCount"></span></div>';
  c += '</div>';

  // Table
  c += '<div style="max-height:45vh;overflow:auto;border:1px solid var(--border);border-radius:6px;">';
  c += '<table style="font-size:12px;min-width:1000px;">';
  c += '<thead><tr style="background:#F8FAFC;">';
  c += '<th style="width:32px;text-align:center;"><input type="checkbox" id="expSelectAll" onchange="toggleExportSelectAll(this)" style="cursor:pointer;"></th>';
  c += '<th>申报编号</th><th>编制类型</th><th>申请单位</th><th>所属区域</th>';
  c += '<th style="text-align:right;">核定编制数</th><th style="text-align:right;">在编人数</th>';
  c += '<th style="text-align:right;">控制数</th><th style="text-align:right;">控制数实有</th>';
  c += '<th style="text-align:right;">申请数</th><th>审核状态</th><th>提交时间</th>';
  c += '</tr></thead><tbody id="expTableBody">';
  c += '</tbody></table></div>';

  c += '</div>';
  c += '<div class="modal-footer"><span style="font-size:12px;color:var(--text-secondary);margin-right:auto;" id="expSelCount">已选 0 条</span><button class="btn btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doExportChecked(\'' + (batchId || '') + '\',\'' + mode + '\')">📥 导出选中</button></div>';
  openModal(c, 'modal-xwide');

  // Store data for filtering
  window._expData = subs;
  window._expBatchId = batchId;
  window._expMode = mode;
  renderExportTable();
}

function renderExportTable() {
  var subs = window._expData || [];
  var region = document.getElementById('expRegion') ? document.getElementById('expRegion').value : 'all';
  var type = document.getElementById('expType') ? document.getElementById('expType').value : 'all';
  var status = document.getElementById('expStatus') ? document.getElementById('expStatus').value : 'all';

  var filtered = subs.filter(function(s) {
    if (region !== 'all' && s.schoolType !== region) return false;
    if (type !== 'all' && (STAFFING_TYPE_MAP[s.staffingType] || s.staffingType) !== type) return false;
    if (status !== 'all' && s.status !== status) return false;
    return true;
  });

  var tbody = document.getElementById('expTableBody');
  var h = '';
  filtered.forEach(function(s, idx) {
    var useCount = s.useForms ? Object.values(s.useForms).reduce(function(a,b){return a+(b||0);},0) : 0;
    var totalStaff = s.totalStaff || '—';
    var currentStaff = s.currentStaff || '—';
    var controlNum = s.controlNum || '—';
    var controlActual = s.controlActual || '—';
    h += '<tr style="border-bottom:1px solid #F1F5F9;">';
    h += '<td style="text-align:center;"><input type="checkbox" class="exp-row-cb" data-id="' + s.id + '" onchange="updateExportSelCount()"></td>';
    h += '<td>' + s.id + '</td>';
    h += '<td>' + (STAFFING_TYPE_MAP[s.staffingType] || s.staffingType) + '</td>';
    h += '<td>' + s.school + '</td>';
    h += '<td>' + (s.schoolType || '—') + '</td>';
    h += '<td style="text-align:right;">' + totalStaff + '</td>';
    h += '<td style="text-align:right;">' + currentStaff + '</td>';
    h += '<td style="text-align:right;">' + controlNum + '</td>';
    h += '<td style="text-align:right;">' + controlActual + '</td>';
    h += '<td style="text-align:right;">' + useCount + '</td>';
    h += '<td><span class="sbc-status ' + getStatusBadgeClass(s.status) + '" style="font-size:10px;">' + (STATUS_MAP[s.status] || s.status) + '</span></td>';
    h += '<td>' + (s.submitDate || '—') + '</td>';
    h += '</tr>';
  });
  tbody.innerHTML = h || '<tr><td colspan="12" style="text-align:center;padding:20px;color:var(--text-light);">无匹配数据</td></tr>';

  document.getElementById('expSelectAll').checked = false;
  var fc = document.getElementById('expFilteredCount');
  if (fc) fc.textContent = '显示 ' + filtered.length + ' 条';
  updateExportSelCount();
}

function filterExportTable() { renderExportTable(); }

function toggleExportSelectAll(cb) {
  var cbs = document.querySelectorAll('.exp-row-cb');
  cbs.forEach(function(c) { c.checked = cb.checked; });
  updateExportSelCount();
}

function updateExportSelCount() {
  var cbs = document.querySelectorAll('.exp-row-cb');
  var count = 0;
  var total = cbs.length;
  cbs.forEach(function(c) { if (c.checked) count++; });
  var el = document.getElementById('expSelCount');
  if (el) el.textContent = '已选 ' + count + ' 条 / 共 ' + total + ' 条';
  var sa = document.getElementById('expSelectAll');
  if (sa) sa.checked = (count > 0 && count === total);
}

function doExportChecked(batchId, mode) {
  var cbs = document.querySelectorAll('.exp-row-cb:checked');
  var ids = [];
  cbs.forEach(function(c) { ids.push(c.dataset.id); });
  if (ids.length === 0) { showToast('请至少勾选一条数据'); return; }

  var subs = SUBMISSIONS.filter(function(s) { return ids.indexOf(s.id) !== -1; });

  var csv = '﻿申报编号,编制类型,申请单位,所属区域,核定编制数,在编人数,控制数,控制数实有,申请数,审核状态,提交时间\n';
  subs.forEach(function(s) {
    var useCount = s.useForms ? Object.values(s.useForms).reduce(function(a,b){return a+(b||0);},0) : 0;
    csv += s.id + ',' + (STAFFING_TYPE_MAP[s.staffingType] || '') + ',' + s.school + ',' + (s.schoolType || '') + ',' + (s.totalStaff || '') + ',' + (s.currentStaff || '') + ',' + (s.controlNum || '') + ',' + (s.controlActual || '') + ',' + useCount + ',' + (STATUS_MAP[s.status] || '') + ',' + (s.submitDate || '') + '\n';
  });

  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (batchId || 'year_summary') + '_export_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  closeModal();
  showToast('已导出 ' + subs.length + ' 条记录');
}

// ===== YEAR SUMMARY MODE =====
function toggleYearSummaryMode() {
  isYearSummaryMode = !isYearSummaryMode;
  selectedBatchIdsForSummary = [];
  renderMain();
}

function toggleBatchForSummary(batchId, event) {
  event.stopPropagation();
  var idx = selectedBatchIdsForSummary.indexOf(batchId);
  if (idx === -1) {
    selectedBatchIdsForSummary.push(batchId);
  } else {
    selectedBatchIdsForSummary.splice(idx, 1);
  }
  renderMain();
}

function generateYearSummary() {
  if (selectedBatchIdsForSummary.length === 0) {
    showToast('请至少选择一个批次');
    return;
  }
  var allSubs = [];
  selectedBatchIdsForSummary.forEach(function(batchId) {
    var subs = SUBMISSIONS.filter(function(s) { return s.batchId === batchId && s.status === 'approved'; });
    allSubs = allSubs.concat(subs);
  });
  var yearLabel = currentBatchYear || '全部年度';
  showToast(yearLabel + ' — 已选 ' + selectedBatchIdsForSummary.length + ' 个批次，终审通过 ' + allSubs.length + ' 条记录，汇总表已生成');
  isYearSummaryMode = false;
  selectedBatchIdsForSummary = [];
  renderMain();
}

function confirmApprove(id, school) {
  var c = '<div class="modal-header"><h3>确认通过</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  c += '<div class="modal-body"><p style="font-size:14px;">确认通过「' + school + '」的申报？</p><p style="font-size:12px;color:var(--text-light);margin-top:8px;">通过后将冻结对应空编额度。</p></div>';
  c += '<div class="modal-footer"><button class="btn btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="closeModal();showToast(\'已通过 ' + school + ' 的申报\')">确认通过</button></div>';
  openModal(c);
}

function confirmReject(id, school) {
  var c = '<div class="modal-header"><h3>退回申报</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  c += '<div class="modal-body">';
  c += '<p style="font-size:14px;margin-bottom:16px;">退回「' + school + '」的申报</p>';
  c += '<div class="form-group"><label>退回理由 <span style="color:var(--danger);">*</span></label><textarea id="rejectReason" placeholder="请填写退回理由，以便申请单位修改重提..."></textarea></div>';
  c += '</div>';
  c += '<div class="modal-footer"><button class="btn btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="var r=document.getElementById(\'rejectReason\').value; if(!r.trim()){showToast(\'请填写退回理由\');return;} closeModal();showToast(\'已退回 ' + school + ' 的申报\')">确认退回</button></div>';
  openModal(c);
}

function renderSubmissionsTable(subs) {
  var isSchoolView = currentRole === 'school';
  var isCityAdmin = currentRole === 'city';
  var h = '';

  // Action bar — filters
  h += '<div class="filter-bar">';
  if (isSchoolView) {
    var allBatches = SUBMISSIONS.filter(function(s) { return s.school === '柳州市第八中学'; }).map(function(s) { return s.batchName; }).filter(function(v, i, a) { return a.indexOf(v) === i; });
    h += '<label>批次</label><select class="filter-select"><option>全部</option>';
    allBatches.forEach(function(b) { h += '<option>' + b + '</option>'; });
    h += '</select>';
  } else {
    h += '<label>申请单位</label><select class="filter-select"><option>全部</option>';
    var units = subs.map(function(s) { return s.school; }).filter(function(v, i, a) { return a.indexOf(v) === i; });
    units.forEach(function(u) { h += '<option>' + u + '</option>'; });
    h += '</select>';
    h += '<label>编制类型</label><select class="filter-select" onchange="setStaffingTypeFilter(this.value)"><option value="all"' + (staffingTypeFilter === 'all' ? ' selected' : '') + '>全部</option><option value="career"' + (staffingTypeFilter === 'career' ? ' selected' : '') + '>事业编</option><option value="control"' + (staffingTypeFilter === 'control' ? ' selected' : '') + '>控制数</option></select>'
  }
  h += '</div>';

  // Table
  h += '<div class="table-card"><div class="table-wrapper"><table>';
  h += '<thead><tr>';
  h += '<th>申报编号</th>';
  h += '<th>批次</th>';
  h += '<th>编制类型</th>';
  if (!isSchoolView) h += '<th>申请单位</th><th>所属区域</th>';
  h += '<th>核定编制数</th><th>在编人数</th><th>控制数</th><th>控制数实有</th>';
  h += '<th>申请数</th>';
  h += '<th>统一公开招聘</th><th>单位自主实施招聘</th><th>中高级人才招聘</th><th>引进高层次人才</th><th>调动</th><th>其他</th>';
  h += '<th>附件</th><th>编办确认材料</th><th>审核状态</th><th>提交时间</th><th>操作</th>';
  h += '</tr></thead><tbody>';

  subs.forEach(function(s) {
    var isCareer = s.staffingType === 'career';
    var typeLabel = STAFFING_TYPE_MAP[s.staffingType] || '控制数';
    var typeBadgeColor = isCareer ? 'color:#1456F0;' : 'color:#0E3EC0;';
    var attachmentLabel = isCareer ? '附件2' : '附件9';

    h += '<tr>';
    h += '<td><span class="tb-link">' + s.id + '</span></td>';
    h += '<td>' + s.batchName + '</td>';
    h += '<td><span style="font-size:11px;' + typeBadgeColor + 'font-weight:500;">' + typeLabel + '</span></td>';
    if (!isSchoolView) h += '<td>' + s.school + '</td><td>' + (s.schoolType || '—') + '</td>';
    h += '<td>' + (s.totalStaff || '—') + '</td>';
    h += '<td>' + (s.currentStaff || '—') + '</td>';
    h += '<td>' + (s.controlNum || '—') + '</td>';
    h += '<td>' + (s.controlActual || '—') + '</td>';
    var uf = s.useForms || {};
    var useCount = Object.values(uf).reduce(function(a,b){return a+(b||0);},0);
    h += '<td>' + (useCount || '—') + '</td>';
    h += '<td>' + (uf.publicRecruit || 0) + '</td>';
    h += '<td>' + (uf.selfRecruit || 0) + '</td>';
    h += '<td>' + (uf.talentMid || 0) + '</td>';
    h += '<td>' + (uf.talentHigh || 0) + '</td>';
    h += '<td>' + (uf.transfer || 0) + '</td>';
    h += '<td>' + (uf.other || 0) + '</td>';
    h += '<td>' + (s.attachment9 ? '<a onclick="downloadMockFile(\'' + s.id + '\',\'attachment\')" style="color:var(--primary);cursor:pointer;font-size:12px;">📥 下载</a>' : '<span style="color:var(--text-light);">——</span>') + '</td>';
    var hasFinalDoc = (s.schoolFinalConfirm && s.schoolFinalConfirm.document) || s.followUp;
    h += '<td>' + (hasFinalDoc ? '<a onclick="downloadMockFile(\'' + s.id + '\',\'finalConfirm\')" style="color:var(--primary);cursor:pointer;font-size:12px;">📥 下载</a>' : '<span style="color:var(--text-light);">——</span>') + '</td>';
    h += '<td><span class="sbc-status ' + getStatusBadgeClass(s.status) + '" style="font-size:10px;">' + STATUS_MAP[s.status] + '</span></td>';
    h += '<td>' + (s.submitDate || '—') + '</td>';
    h += '<td><div class="action-links">';
    h += '<a href="staffing-detail.html?id=' + s.id + '">查看</a>';
    if (s.status === 'submitted' || s.status === 'final_submitted') {
      var canApprove = !isCityAdmin || s.schoolType === '市直属';
      if (canApprove) {
        h += '<a href="审核编制使用申请页（主管单位视角）.html?id=' + s.id + '&role=' + currentRole + '" style="color:var(--primary);font-weight:500;">审核</a>';
      }
    }
    if (s.status === 'approved' && s.school === '柳州市第八中学' && isSchoolView) {
      h += '<a onclick="showToast(\'上传后续材料\')">上传后续材料</a>';
    }
    if (s.status === 'rejected' && isSchoolView) {
      h += '<a href="staffing-form.html?id=' + s.id + '&staffingType=' + s.staffingType + '">修改重提</a>';
    }
    h += '</div></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="pagination"><span>共 ' + subs.length + ' 条</span><div class="pagination-btns"><button class="active">1</button></div></div>';
  h += '</div>';
  return h;
}

// ===== ROLE SWITCH =====
function switchRole(role) {
  currentRole = role;
  selectedBatchId = null;
  currentFilter = 'all';
  staffingTypeFilter = 'all';
  schoolYearFilter = new Date().getFullYear().toString();
  currentBatchYear = null;
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === role);
  });
  renderSidebar();
  renderMain();
  showToast('已切换至：' + ROLES[role].role + ' — ' + ROLES[role].name);
}

// ===== SIDEBAR TOGGLE =====
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ===== POPUPS =====
function toggleUserMenu() {
  document.getElementById('userDropdown').classList.toggle('show');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.topnav-user')) document.getElementById('userDropdown').classList.remove('show');
});

function toggleMsgPopover() {
  showToast('消息通知：3条未读');
}

// ===== TOAST =====
function showToast(msg) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast success'; t.textContent = msg;
  c.appendChild(t);
  setTimeout(function() { t.remove(); }, 2200);
}

// ===== INIT =====
renderSidebar();
renderMain();
</script>
