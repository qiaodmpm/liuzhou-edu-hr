<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编制使用申请 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}

/* Sidebar bottom */
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

/* Role Switcher */
.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }

.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* Page header */
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.page-header-left h1 { font-size: 20px; font-weight: 700; color: var(--text); }
.page-header-right { display: flex; gap: 10px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: var(--transition); border: 1px solid transparent;
  font-family: inherit; text-decoration: none;
}
.btn-primary {
  background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
  color: #fff;
}
.btn-primary:hover { box-shadow: 0 4px 12px rgba(30,64,175,0.3); transform: translateY(-1px); }
.btn-outline {
  background: #fff; color: var(--primary); border-color: var(--border);
}
.btn-outline:hover { border-color: var(--primary); background: var(--primary-light); }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* Remind button */
.btn-remind { padding: 4px 12px; font-size: 12px; background: #fff; color: var(--primary); border: 1px solid var(--primary); border-radius: 4px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: var(--transition); }
.btn-remind:hover { background: var(--primary-light); }
.btn-reminded { padding: 4px 12px; font-size: 12px; background: var(--gray-bg); color: var(--text-light); border: 1px solid var(--border); border-radius: 4px; cursor: default; font-family: inherit; white-space: nowrap; }

/* Status badges */
.status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.status-badge.pending { background: #F1F5F9; color: #64748B; }

/* Section header */
.section-header { display: flex; align-items: center; }
.section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); }

/* Two-column side-by-side */
.two-col-row { display: flex; gap: 20px; align-items: flex-start; }
.two-col-row .col-left { flex: 0 0 360px; min-width: 0; }
.two-col-row .col-right { flex: 1; min-width: 0; }
@media (max-width: 1400px) { .two-col-row { flex-direction: column; } .two-col-row .col-left { flex: none; } }

/* Batch card */
.batch-list { display: flex; flex-direction: column; gap: 10px; }
.batch-card {
  background: #fff; border-radius: var(--radius-lg); padding: 16px 18px;
  border: 1.5px solid var(--border); cursor: pointer; transition: var(--transition);
}
.batch-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
.batch-card.selected { border-color: var(--primary); background: var(--primary-light); }
.batch-card.auto { border-left: 3px solid #10B981; }
.batch-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.batch-card-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; cursor: pointer; }
.batch-card-name:hover { color: var(--primary); }
.batch-card-status {
  display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: 500; flex-shrink: 0;
}
.batch-card-status.active { background: #EFF6FF; color: var(--primary); }
.batch-card-status.closed { background: #F1F5F9; color: #64748B; }
.batch-card-status.upcoming { background: #FEF3C7; color: #D97706; }
.batch-card-meta { font-size: 11px; color: var(--text-light); margin-bottom: 10px; display: flex; gap: 16px; }
.batch-card-progress { margin-bottom: 10px; }
.batch-card-progress .progress-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.batch-card-progress-text { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.batch-card-progress .progress-bar {
  height: 6px; background: #E2E8F0; border-radius: 3px; overflow: hidden;
}
.batch-card-progress .progress-fill { height: 100%; border-radius: 3px; transition: width var(--transition); }
.progress-fill.approved { background: var(--success); }
.progress-fill.submitted { background: var(--accent); }
.progress-fill.rejected { background: var(--danger); }
.batch-card-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.batch-card-actions .btn { font-size: 11px; padding: 4px 12px; }

/* Year filter row */
.year-filter-row { margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.year-filter-row .filter-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }

/* Batch summary checkbox */
.batch-summary-checkbox {
  width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--border);
  cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.batch-summary-checkbox.checked { background: var(--primary); border-color: var(--primary); }
.batch-summary-checkbox.checked:after {
  content: '✓'; color: #fff; font-size: 11px; font-weight: 600; line-height: 1;
}

/* Year summary bar */
.year-summary-bar {
  margin-top: 14px; display: flex; gap: 10px; align-items: center;
}

/* School batch table */
.school-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.school-table thead th {
  padding: 10px 14px; text-align: left; font-weight: 600; font-size: 11px;
  color: var(--text-secondary); background: #F8FAFC; border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.school-table tbody td {
  padding: 10px 14px; border-bottom: 1px solid #F1F5F9;
  vertical-align: middle;
}
.school-table tbody tr.row-auto td { background: #FAFBFE; }
.school-table tbody tr.row-auto td:first-child { border-left: 3px solid #DBEAFE; }
.school-table tbody tr.row-closed { color: var(--text-light); }
.school-table .batch-name { font-weight: 600; color: var(--text); }
.school-table tr.row-closed .batch-name { color: var(--text-light); }
.school-table .batch-meta { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.school-table .batch-meta span { margin-right: 12px; }
.school-table .batch-group-first td { border-top: 2px solid var(--border); }
.school-table .rowspan-cell { border-right: 1px solid var(--border); }
.school-table .district-col { font-size: 12px; font-weight: 500; white-space: nowrap; }
.school-table .district-col .district-icon { margin-right: 2px; }
.school-table .action-col { white-space: nowrap; }
.school-table .action-col .btn { font-size: 11px; padding: 3px 10px; }
.school-table .action-col a { font-size: 12px; color: var(--primary); text-decoration: none; margin-right: 8px; }
.school-table .action-col a:hover { text-decoration: underline; }
.school-table .action-col a.danger { color: #DC2626; }
.sbc-status-count { font-size: 10px; color: var(--text-secondary); white-space: nowrap; }
.sbc-status-count.clickable { cursor: pointer; color: var(--primary); }
.sbc-status-count.clickable:hover { text-decoration: underline; }
.status-summary { font-size: 10px; font-weight: 500; white-space: nowrap; }
.status-summary.approved { color: #059669; }
.status-summary.pending { color: #D97706; }
.status-summary.rejected { color: #DC2626; }

/* Status badge (shared with modal) */
.sbc-status {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 600; text-align: center; white-space: nowrap;
}
.sbc-status.approved { background: #ECFDF5; color: #059669; }
.sbc-status.submitted { background: #EFF6FF; color: #1E40AF; }
.sbc-status.rejected { background: #FEF2F2; color: #DC2626; }
.sbc-status.none { background: #F8FAFC; color: #94A3B8; }

/* Batch dropdown filter */
.batch-filter-bar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  font-size: 13px;
}
.batch-filter-bar label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }

/* Status filter buttons */
.status-filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.status-fbtn {
  padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: var(--transition); border: 1px solid var(--border);
  background: #fff; color: var(--text-secondary); font-family: inherit;
}
.status-fbtn:hover { border-color: var(--accent); color: var(--primary); }
.status-fbtn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Type filter buttons (事业编 / 控制数) */
.district-filters { display: flex; gap: 8px; }
.district-fbtn {
  padding: 6px 18px; border-radius: 20px; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: var(--transition); border: 1px solid var(--border);
  background: #fff; color: var(--text-secondary); font-family: inherit;
}
.district-fbtn:hover { border-color: var(--accent); color: var(--primary); }
.district-fbtn.active-all { background: var(--text); color: #fff; border-color: var(--text); }
.district-fbtn.active-career { background: #1E40AF; color: #fff; border-color: #1E40AF; box-shadow: 0 2px 8px rgba(30,64,175,0.3); }
.district-fbtn.active-career:hover { box-shadow: 0 4px 12px rgba(30,64,175,0.4); transform: translateY(-1px); }
.district-fbtn.active-control { background: #6D28D9; color: #fff; border-color: #6D28D9; box-shadow: 0 2px 8px rgba(109,40,217,0.3); }
.district-fbtn.active-control:hover { box-shadow: 0 4px 12px rgba(109,40,217,0.4); transform: translateY(-1px); }

/* Modal overlay */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-container { background: #fff; border-radius: var(--radius-lg); padding: 28px; width: 480px; max-width: 90vw; box-shadow: var(--shadow-lg); }
.modal-container h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel { padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.btn-cancel:hover { background: var(--gray-bg); }
.btn-confirm { padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px; border: none; color: #fff; cursor: pointer; font-family: inherit; }
.btn-confirm.success { background: var(--success); }
.btn-confirm.success:hover { background: #059669; }
.modal {
  background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  width: 480px; max-width: 90vw; max-height: 80vh; overflow-y: auto;
}
.modal-wide { width: 680px; }
.modal-xwide { width: 95vw; max-width: 1200px; }
.modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { cursor: pointer; color: var(--text-light); font-size: 20px; padding: 4px; border: none; background: none; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-body .form-group { margin-bottom: 16px; }
.modal-body .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
.modal-body .form-group input, .modal-body .form-group textarea, .modal-body .form-group select {
  width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border);
  border-radius: 6px; font-family: inherit; outline: none;
}
.modal-body .form-group input:focus, .modal-body .form-group textarea:focus, .modal-body .form-group select:focus { border-color: var(--accent); }
.modal-body .form-group textarea { resize: vertical; min-height: 80px; }

/* Upload area (shared with modal) */
.upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 32px; text-align: center; cursor: pointer; transition: var(--transition);
}
.upload-area:hover { border-color: var(--accent); background: #F8FAFC; }
.upload-area.drag-over { border-color: var(--primary); background: var(--primary-light); }
.upload-area .upload-icon { font-size: 40px; margin-bottom: 8px; }
.upload-area .upload-text { font-size: 13px; color: var(--text-secondary); }
.upload-area .upload-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.upload-file {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: #F0FDF4; border-radius: 6px; margin-top: 12px; font-size: 13px;
  word-break: break-all;
}
.upload-file .remove { color: var(--danger); cursor: pointer; margin-left: auto; flex-shrink: 0; }

/* Confirm table */
.confirm-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
.confirm-table thead th {
  padding: 10px 12px; text-align: left; font-weight: 600; font-size: 11px;
  color: var(--text-secondary); background: #F8FAFC; border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.confirm-table tbody td {
  padding: 9px 12px; border-bottom: 1px solid #F1F5F9; vertical-align: middle;
}
.confirm-table .num-input {
  width: 80px; padding: 6px 10px; border: 1px solid var(--border);
  border-radius: 4px; text-align: center; font-size: 13px; font-family: inherit; outline: none;
}
.confirm-table .num-input:focus { border-color: var(--accent); }
.confirm-table .num-input.error { border-color: var(--danger); background: #FEF2F2; }
.modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.modal-footer .btn-cancel { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
.modal-footer .btn-cancel:hover { border-color: var(--text-light); }
.modal-footer .btn-danger { background: var(--danger); color: #fff; }

/* Multi-select dropdown (shared pattern) */
.multi-select-wrap { position: relative; display: inline-block; vertical-align: middle; }
.multi-select-trigger { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; min-width: 130px; font-family: inherit; color: var(--text); transition: var(--transition); white-space: nowrap; }
.multi-select-trigger:hover { border-color: var(--accent); }
.multi-select-trigger .arrow { font-size: 10px; color: var(--text-light); margin-left: auto; }
.multi-select-dropdown { display: none; position: absolute; top: 100%; left: 0; min-width: 160px; background: #fff; border: 1px solid var(--border); border-radius: 8px; z-index: 25; box-shadow: var(--shadow-lg); padding: 6px 0; }
.multi-select-dropdown.show { display: block; }

.multi-select-dropdown label:hover { background: var(--primary-light); }
.multi-select-dropdown input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }

/* Batch scope cascade */
.scope-cascade { margin-top: 4px; }
.scope-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; max-height: 80px; overflow: hidden; }
.scope-tags.expanded { max-height: none; overflow: visible; }
.scope-tag { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; font-size: 11px; background: var(--primary-light); color: var(--primary); border-radius: 4px; white-space: nowrap; }
.scope-tag .scope-tag-x { cursor: pointer; font-weight: 700; opacity: 0.5; line-height: 1; }
.scope-tag .scope-tag-x:hover { opacity: 1; }
.scope-tag-more { font-size: 11px; color: var(--accent); cursor: pointer; padding: 2px 4px; white-space: nowrap; }
.scope-tag-more:hover { text-decoration: underline; }
.scope-cascade-row { display: flex; gap: 8px; align-items: flex-start; }
.modal-body .scope-cascade-row select { width: auto; min-width: 130px; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; cursor: pointer; }
.scope-cascade .multi-select-wrap { flex: 1; }
.scope-cascade .multi-select-dropdown { max-height: 200px; overflow-y: auto; width: 100%; min-width: 0; }
.scope-cascade .multi-select-trigger { width: 100%; }
.modal-body .scope-cascade .multi-select-dropdown label { display: flex; font-weight: 400; margin-bottom: 0; }
.scope-multi-search { width: 100%; padding: 7px 12px; font-size: 12px; border: none; border-bottom: 1px solid var(--border); outline: none; font-family: inherit; background: #fff; }
.scope-multi-search:focus { border-bottom-color: var(--accent); }
.modal-footer .btn-danger:hover { opacity: 0.9; }

/* Batch detail modal */
.modal-fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.modal-fieldset legend { font-size: 12px; font-weight: 600; color: var(--primary); padding: 0 8px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.detail-item { display: flex; flex-direction: column; gap: 2px; }
.detail-item.span-2 { grid-column: 1 / -1; }
.detail-label { font-size: 11px; color: var(--text-light); }
.detail-value { font-size: 13px; color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stats-col { background: var(--bg); border-radius: 8px; padding: 12px 14px; }
.stats-col-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.stats-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; color: var(--text-secondary); }
.stats-num { font-weight: 600; color: var(--text); }

/* Filter bar */
.filter-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 18px; background: #fff; border-radius: var(--radius);
  border: 1px solid var(--border); margin-bottom: 16px;
}
.filter-bar label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.filter-select, .filter-input {
  padding: 6px 12px; font-size: 13px; border: 1px solid var(--border);
  border-radius: 6px; background: #fff; color: var(--text);
  font-family: inherit; outline: none;
}
.filter-select:focus, .filter-input:focus { border-color: var(--accent); }
.filter-input { width: 160px; }
.filter-spacer { flex: 1; }

/* Searchable select dropdown */
.searchable-select { position: relative; min-width: 180px; }
.searchable-select .ss-input {
  padding: 6px 28px 6px 12px; font-size: 13px; border: 1px solid var(--border);
  border-radius: 6px; background: #fff; color: var(--text);
  font-family: inherit; outline: none; width: 100%; cursor: pointer;
}
.searchable-select .ss-input:focus { border-color: var(--accent); }
.searchable-select .ss-arrow {
  position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
  font-size: 10px; color: var(--text-light); pointer-events: none;
}
.searchable-select .ss-clear {
  position: absolute; top: 50%; right: 22px; transform: translateY(-50%);
  font-size: 14px; color: var(--text-light); cursor: pointer; display: none;
  line-height: 1; padding: 2px;
}
.searchable-select .ss-clear:hover { color: var(--danger); }
.searchable-select .ss-clear.visible { display: block; }
.searchable-select .ss-dropdown {
  display: none; position: absolute; top: 100%; left: 0; right: 0;
  max-height: 240px; overflow-y: auto; background: #fff;
  border: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius);
  box-shadow: var(--shadow); z-index: 50; margin-top: 2px;
}
.searchable-select .ss-dropdown.show { display: block; }
.searchable-select .ss-option {
  padding: 8px 12px; font-size: 13px; cursor: pointer; color: var(--text);
  transition: background var(--transition);
}
.searchable-select .ss-option:hover { background: var(--primary-light); }
.searchable-select .ss-option.selected { background: var(--primary-light); color: var(--primary); font-weight: 500; }
.searchable-select .ss-option mark { background: #FEF3C7; color: var(--text); padding: 1px 0; }
.searchable-select .ss-no-result {
  padding: 12px; font-size: 12px; color: var(--text-light); text-align: center;
}

/* Table card */
.table-card {

}
.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  padding: 12px 16px; text-align: left; font-weight: 600; font-size: 12px;
  color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: 12px 16px; border-bottom: 1px solid #F1F5F9;
  color: var(--text); white-space: nowrap;

tbody tr:hover { background: #F8FAFC; }
tbody tr:last-child td { border-bottom: none; }
.tb-link { color: var(--primary); cursor: pointer; text-decoration: none; }
.tb-link:hover { text-decoration: underline; }

/* Status badges */

.status.rejected { background: #FEF2F2; color: #EF4444; }

.pagination button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text-secondary); transition: var(--transition); }
.pagination button:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
.pagination button:disabled { opacity: 0.35; cursor: not-allowed; }
.pagination .page-info { font-size: 12px; color: var(--text-light); margin: 0 8px; }

/* Action links in table */
.action-links { display: flex; gap: 12px; }
.action-links a { font-size: 12px; color: var(--primary); text-decoration: none; cursor: pointer; }
.action-links a:hover { text-decoration: underline; }
.action-links a.danger { color: var(--danger); }

/* Empty / No-permission state */
.empty-state {

.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }

/* Toast */
.toast {

  animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;

.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

/* Responsive */
@media (max-width: 1200px) { .filter-bar { flex-wrap: wrap; } }
@media (max-width: 768px) {

function getRegionCode(district) {
  return REGION_CODE[district] || '00';
}

function generateBatchId(year, district) {
  var code = getRegionCode(district);
  // Find next sequence number for this year+region
  var allBatches = getAllBatches();
  var maxSeq = 0;
  var prefix = 'B' + year + '-' + code;
  for (var i = 0; i < allBatches.length; i++) {
    var bid = allBatches[i].id;
    if (bid.indexOf(prefix) === 0) {
      var seq = parseInt(bid.slice(prefix.length), 10);
      if (seq > maxSeq) maxSeq = seq;
    }
  }
  return prefix + String(maxSeq + 1).padStart(3, '0');
}

// ===== PAGINATION HELPER =====
function renderPaginationControls(totalItems, pageNum, goFnName) {
  var totalPages = Math.ceil(totalItems / pageSize) || 1;
  if (pageNum > totalPages) pageNum = totalPages;
  if (pageNum < 1) pageNum = 1;
  var h = '<div class="pagination">';
  h += '<button ' + (pageNum <= 1 ? 'disabled' : '') + ' onclick="' + goFnName + '(' + (pageNum - 1) + ')">◀</button>';
  for (var p = 1; p <= totalPages; p++) {
    if (totalPages <= 7 || p <= 2 || p > totalPages - 2 || Math.abs(p - pageNum) <= 1) {
      h += '<button class="' + (p === pageNum ? 'active' : '') + '" onclick="' + goFnName + '(' + p + ')">' + p + '</button>';
    } else if (p === 3 || p === totalPages - 2) {
      h += '<button disabled>…</button>';
    }
  }
  h += '<button ' + (pageNum >= totalPages ? 'disabled' : '') + ' onclick="' + goFnName + '(' + (pageNum + 1) + ')">▶</button>';
  h += '<span class="page-info">共 ' + totalPages + ' 页 / ' + totalItems + ' 条</span>';
  h += '</div>';
  return h;
}

// ===== REMINDER LOG =====
function loadReminders() {
  try { return JSON.parse(localStorage.getItem('staffing_reminders') || '{}'); } catch(e) { return {}; }
}
function saveReminders(data) { localStorage.setItem('staffing_reminders', JSON.stringify(data)); }

function getReminderKey(batchId, schoolName) {
  return batchId + '|' + schoolName;
}

function canRemind(batchId, schoolName) {
  var reminders = loadReminders();
  var r = reminders[getReminderKey(batchId, schoolName)];
  if (!r) return true;
  var today = new Date().toISOString().substring(0, 10);
  return (r.time || '').substring(0, 10) !== today;
}

function getLastReminderDisplay(batchId, schoolName) {
  var reminders = loadReminders();
  var r = reminders[getReminderKey(batchId, schoolName)];
  if (!r) return '—';
  var time = (r.time || '').substring(0, 16).replace('T', ' ');
  var cnt = r.count || 1;
  return time + ' (第' + cnt + '次)';
}

function showRemindModal(batchId, schoolName) {
  var modalHtml =
    '<div class="modal-overlay" id="remindModal">' +
      '<div class="modal-container">' +
        '<h3>提醒申报确认</h3>' +
        '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">' +
          '将向<strong>' + schoolName + '</strong>发送编制使用申请提醒通知。每个学校每日最多提醒一次。' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelRemind">取消</button>' +
          '<button class="btn-confirm success" id="confirmRemind">确认发送</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  setTimeout(function() { document.getElementById('remindModal').classList.add('show'); }, 10);
  document.getElementById('cancelRemind').onclick = function() { document.getElementById('remindModal').remove(); };
  document.getElementById('confirmRemind').onclick = function() { doRemind(batchId, schoolName); };
}

function doRemind(batchId, schoolName) {
  var modalEl = document.getElementById('remindModal');
  if (modalEl) modalEl.remove();
  var now = new Date().toISOString().replace('T', ' ').substring(0, 19);
  var reminders = loadReminders();
  var key = getReminderKey(batchId, schoolName);
  if (!reminders[key]) { reminders[key] = { time: now, count: 1, read: false }; }
  else {
    reminders[key].time = now;
    reminders[key].count = (reminders[key].count || 0) + 1;
    reminders[key].read = false;
  }
  saveReminders(reminders);
  showToast('已向「' + schoolName + '」发送申报提醒', 'success');
  renderMain();
}

// ===== BATCH STATS HELPER =====
function countSchoolsInScope(scope) {
  var orgDir = [];
  try { orgDir = JSON.parse(localStorage.getItem('org_directory') || '[]'); } catch(e) {}
  var schools = orgDir.filter(function(o) { return o.orgType === '学校'; });
  if (!scope || typeof scope === 'string') {
    // legacy string scope — fallback to all schools
    return schools.length;
  }
  if (scope.scopeType === 'all') {
    return schools.length;
  }
  if (scope.scopeType === 'districts') {
    var districts = scope.scopeDistricts || [];
    if (!districts.length) return schools.length;
    return schools.filter(function(s) { return districts.indexOf(s.district) >= 0; }).length;
  }
  if (scope.scopeType === 'schools') {
    return (scope.scopeSchools || []).length;
  }
  return schools.length;
}

function distinctSchools(subList) {
  var seen = {};
  for (var i = 0; i < subList.length; i++) {
    seen[subList[i].orgName] = true;
  }
  return Object.keys(seen).length;
}

function getBatchStats(batch) {
  var batchId = batch.id;
  var scopeSchoolCount = countSchoolsInScope(batch.scope);
  var subs = SUBMISSIONS.filter(function(s) { return s.batchId === batchId; });
  var careerSubs = subs.filter(function(s) { return s.staffingType === 'career'; });
  var controlSubs = subs.filter(function(s) { return s.staffingType === 'control'; });
  function count(statuses) { return subs.filter(function(s) { return statuses.indexOf(s.status) >= 0; }).length; }
  function countC(statuses) { return careerSubs.filter(function(s) { return statuses.indexOf(s.status) >= 0; }).length; }
  function countCtrl(statuses) { return controlSubs.filter(function(s) { return statuses.indexOf(s.status) >= 0; }).length; }
  return {
    total: subs.length,
    submitted: count(['submitted']),
    firstApproved: count(['first_approved']),
    finalSubmitted: count(['final_submitted']),
    approved: count(['approved']),
    rejected: count(['rejected']),
    career: {
      total: scopeSchoolCount,
      declared: distinctSchools(careerSubs),
      submitted: countC(['submitted']),
      firstApproved: countC(['first_approved']),
      finalSubmitted: countC(['final_submitted']),
      approved: countC(['approved']),
      rejected: countC(['rejected'])
    },
    control: {
      total: scopeSchoolCount,
      declared: distinctSchools(controlSubs),
      submitted: countCtrl(['submitted']),
      firstApproved: countCtrl(['first_approved']),
      finalSubmitted: countCtrl(['final_submitted']),
      approved: countCtrl(['approved']),
      rejected: countCtrl(['rejected'])
    }
  };
}

// ===== YEAR FILTER =====
function getBatchYears(batches) {
  var years = [];
  batches.forEach(function(b) {
    if (years.indexOf(b.year) === -1) years.push(b.year);
  });
  years.sort(function(a, b) { return b.localeCompare(a); });
  return years;
}

function getFilteredBatches(batches) {
  if (!currentBatchYear) return batches;
  return batches.filter(function(b) { return b.year === currentBatchYear; });
}

function renderYearFilter(batches) {
  var years = getBatchYears(batches);
  if (years.length <= 1) return '';
  var h = '<span class="filter-label">年度筛选：</span>';
  h += '<select class="filter-select" onchange="setBatchYear(this.value)">';
  h += '<option value="all">全部年度</option>';
  years.forEach(function(y) {
    h += '<option value="' + y + '"' + (currentBatchYear === y ? ' selected' : '') + '>' + y + ' 年</option>';
  });
  h += '</select>';
  return h;
}

function setBatchYear(year) {
  currentBatchYear = year === 'all' ? null : year;
  var batches = getAllBatches();
  var filtered = getFilteredBatches(batches);
  if (filtered.length > 0 && (!selectedBatchId || !filtered.some(function(b) { return b.id === selectedBatchId; }))) {
    selectedBatchId = filtered[0].id;
  }
  currentFilter = 'all';
  staffingTypeFilter = 'all';
  orgNameFilter = '';
  currentPage = 1;
  renderMain();
}

    if (a.publishDate > b.publishDate) return -1;
    if (a.publishDate < b.publishDate) return 1;
    return 0;
  });
  var auto = AUTO_BATCHES.slice().sort(function(a, b) {
    if (a.year > b.year) return -1;
    if (a.year < b.year) return 1;
    return 0;
  });
  return auto.concat(managed);
}

function getAllOrgUnits() {
  var subs = SUBMISSIONS;
  if (currentRole === 'district') {
    subs = subs.filter(function(s) { return s.district === '鱼峰区'; });
  } else if (currentRole === 'city') {
    // city admin sees all, but only for the selected batch year scope
  }
  if (selectedBatchId) {
    subs = subs.filter(function(s) { return s.batchId === selectedBatchId; });
  }
  var names = subs.map(function(s) { return s.orgName; });
  // Deduplicate and sort
  var seen = {};
  var result = [];
  for (var i = 0; i < names.length; i++) {
    if (!seen[names[i]]) { seen[names[i]] = true; result.push(names[i]); }
  }
  result.sort();
  return result;
}

function showOrgDropdown() {
  var input = document.getElementById('ssOrgInput');
  var dropdown = document.getElementById('ssOrgDropdown');
  if (!input || !dropdown) return;
  // Show all units if input is empty, otherwise show filtered
  if (!input.value.trim()) {
    var units = getAllOrgUnits();
    renderOrgDropdown(units, '');
  } else {
    filterOrgDropdown();
  }
  dropdown.classList.add('show');
}

function filterOrgDropdown() {
  var input = document.getElementById('ssOrgInput');
  var dropdown = document.getElementById('ssOrgDropdown');
  var clearBtn = document.getElementById('ssClear');
  if (!input || !dropdown) return;
  var query = input.value.trim();
  // Toggle clear button
  if (clearBtn) {
    clearBtn.classList.toggle('visible', query.length > 0);
  }
  var units = getAllOrgUnits();
  if (!query) {
    renderOrgDropdown(units, '');
    dropdown.classList.add('show');
    return;
  }
  // Fuzzy match: characters can match anywhere in the name
  var filtered = [];
  for (var i = 0; i < units.length; i++) {
    var name = units[i];
    var match = true;
    var q = query.toLowerCase();
    var n = name.toLowerCase();
    // Every char in query must appear in name in order (fuzzy)
    var qi = 0;
    for (var j = 0; j < n.length && qi < q.length; j++) {
      if (n[j] === q[qi]) qi++;
    }
    if (qi === q.length) filtered.push(name);
  }
  renderOrgDropdown(filtered, query);
  dropdown.classList.add('show');
}

function renderOrgDropdown(units, query) {
  var dropdown = document.getElementById('ssOrgDropdown');
  if (!dropdown) return;
  var h = '';
  // "全部" option
  var allSelected = orgNameFilter === '';
  h += '<div class="ss-option' + (allSelected ? ' selected' : '') + '" onclick="selectOrg(\'\')">全部</div>';
  if (units.length === 0 && query) {
    h += '<div class="ss-no-result">未找到匹配单位</div>';
  } else {
    for (var i = 0; i < units.length; i++) {
      var name = units[i];
      var isSelected = orgNameFilter === name;
      var display = name;
      if (query) {
        // Highlight matching characters (find which chars matched)
        display = highlightMatch(name, query);
      }
      var escapedName = name.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      h += '<div class="ss-option' + (isSelected ? ' selected' : '') + '" onclick="selectOrg(\'' + escapedName + '\')">' + display + '</div>';
    }
  }
  dropdown.innerHTML = h;
}

function highlightMatch(name, query) {
  var q = query.toLowerCase();
  var n = name.toLowerCase();
  // Find the first occurrence of each query char in order
  var matchIdx = [];
  var qi = 0;
  for (var j = 0; j < n.length && qi < q.length; j++) {
    if (n[j] === q[qi]) { matchIdx.push(j); qi++; }
  }
  if (matchIdx.length === 0) return name;
  // Build highlighted result
  var result = '';
  var mi = 0;
  for (var k = 0; k < name.length; k++) {
    if (mi < matchIdx.length && k === matchIdx[mi]) {
      result += '<mark>' + name[k] + '</mark>';
      mi++;
    } else {
      result += name[k];
    }
  }
  return result;
}

function getFilteredSubmissions() {

    // Reserved: school submissions table view (school view now uses renderSchoolSubmissionTable)

  }
  // Batch filter (for admin view)
  if ((currentRole === 'city' || currentRole === 'district') && selectedBatchId) {
    subs = subs.filter(function(s) { return s.batchId === selectedBatchId; });
  }
  // Staffing type filter
  if (staffingTypeFilter === 'career') {
    subs = subs.filter(function(s) { return s.staffingType === 'career'; });
  } else if (staffingTypeFilter === 'control') {
    subs = subs.filter(function(s) { return s.staffingType === 'control'; });
  }
  // Status filter
  if (currentFilter === 'pending') {
    subs = subs.filter(function(s) { return s.status === 'submitted' || s.status === 'final_submitted'; });
  } else if (currentFilter === 'approved') {
    subs = subs.filter(function(s) { return s.status === 'first_approved' || s.status === 'approved'; });
  } else if (currentFilter === 'rejected') {
    subs = subs.filter(function(s) { return s.status === 'rejected'; });
  }
  // Org name filter (fuzzy)
  if (orgNameFilter) {
    subs = subs.filter(function(s) { return s.orgName === orgNameFilter; });
  }
  return subs;
}

// Format scope for display (handles both legacy string and new object format)
function formatScopeText(s) {
  if (!s) return '—';
  if (typeof s === 'string') {
    // Legacy: plain string like "全市" or "鱼峰区"
    return s;
  }
  if (s.scopeType === 'all') return '全市';
  if (s.scopeType === 'districts') {
    var districts = s.scopeDistricts || [];
    if (!districts.length) return '部分区县';
    if (districts.length === 1) return districts[0];
    return '部分区县（' + districts.join('、') + '）';
  }
  if (s.scopeType === 'schools') {
    var schools = s.scopeSchools || [];
    return schools.length ? '部分学校（' + schools.length + '所）' : '部分学校';
  }
  return '—';
}

// ===== 适用范围级联数据 =====
function getScopeDistricts() {
  var orgDir = [];
  try { orgDir = JSON.parse(localStorage.getItem('org_directory') || '[]'); } catch(e) {}
  var districts = [];
  var seen = {};
  for (var i = 0; i < orgDir.length; i++) {
    var d = orgDir[i].district;
    if (d && !seen[d]) { seen[d] = true; districts.push(d); }
  }
  // Sort per known order
  var ORDER = ['市直属','柳城县','鹿寨县','融安县','融水苗族自治县','三江侗族自治县','柳北区','城中区','鱼峰区','柳南区','柳江区'];
  districts.sort(function(a, b) {
    var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    if (ia === -1) ia = 999; if (ib === -1) ib = 999;
    return ia - ib;
  });
  return districts;
}

function getScopeSchools(district) {
  var orgDir = [];
  try { orgDir = JSON.parse(localStorage.getItem('org_directory') || '[]'); } catch(e) {}
  var schools = [];
  for (var i = 0; i < orgDir.length; i++) {
    var o = orgDir[i];
    if (o.orgType === '学校' && (!district || o.district === district)) {
      schools.push(o.orgName);
    }
  }
  schools.sort(function(a, b) { return a.localeCompare(b, 'zh'); });
  return schools;
}

  // Row: type select + optional cascade

    typeOpts = '<option value="all"' + (scopeType === 'all' ? ' selected' : '') + '>全区</option><option value="schools"' + (scopeType === 'schools' ? ' selected' : '') + '>部分学校</option>';

  }
  h += '<input type="hidden" id="scopeTypeHid" value="' + scopeType + '">';
  h += '<input type="hidden" id="scopeDataHid" value="' + encodeURIComponent(JSON.stringify({ districts: _scopeSelectedDistricts, schools: _scopeSelectedSchools })) + '">';
  h += '<div class="scope-cascade-row">';
  h += '<select id="scopeTypeSelect" onchange="onScopeTypeChange()">' + typeOpts + '</select>';

    var selDistricts = _scopeSelectedDistricts.slice();
    var trigText = selDistricts.length ? '已选 ' + selDistricts.length + ' 个区县' : '选择区县...';

    h += '<div class="multi-select-trigger" onclick="toggleScopePanel(\'district\')"><span>' + trigText + '</span><span class="arrow">▼</span></div>';
    h += '<div class="multi-select-dropdown" id="scopeDistrictPanel">';

    }
    h += '</div></div>';

    var selSchools = _scopeSelectedSchools.slice();
    var isDistrictAdmin = currentRole === 'district';
    var userDistrict = (typeof currentUser !== 'undefined' && currentUser && currentUser.district) || '鱼峰区';
    // District admin: locked to own district. City admin: choose from all districts.
    var distFilter = isDistrictAdmin ? userDistrict : (document.getElementById('scopeSchoolDist') ? document.getElementById('scopeSchoolDist').value : 'all');
    var distOpts = '<option value="all"' + (isDistrictAdmin ? ' disabled' : '') + '>全部区县</option>';
    var districtsAll = getScopeDistricts();
    for (var dk = 0; dk < districtsAll.length; dk++) {
      distOpts += '<option value="' + districtsAll[dk].replace(/"/g, '&quot;') + '"' + (distFilter === districtsAll[dk] ? ' selected' : '') + '>' + districtsAll[dk] + '</option>';
    }
    h += '<select id="scopeSchoolDist" onchange="onScopeSchoolDistChange()"' + (isDistrictAdmin ? ' disabled' : '') + '>' + distOpts + '</select>';

    h += '<div id="scopeSchoolList">';

function renderScopeTags(items, type) {
  var maxShow = 5;
  var h = '';
  var showItems = items;
  var remaining = 0;
  if (items.length > maxShow && !_scopeExpanded) {
    showItems = items.slice(0, maxShow);
    remaining = items.length - maxShow;
  }
  for (var i = 0; i < showItems.length; i++) {
    h += '<span class="scope-tag">' + showItems[i] + ' <span class="scope-tag-x" onclick="removeScopeItem(\'' + type + '\',\'' + showItems[i].replace(/'/g, "\\'") + '\')">×</span></span>';
  }
  if (remaining > 0) {
    h += '<span class="scope-tag-more" onclick="toggleScopeExpand()">等 ' + remaining + ' ' + (type === 'district' ? '个区' : '所') + ' 🔽展开</span>';
  }
  if (_scopeExpanded && items.length > maxShow) {
    h += '<span class="scope-tag-more" onclick="toggleScopeExpand()">🔼收起</span>';
  }
  return h;
}

function renderScopeSchoolCheckboxes(district, selected) {
  var schools = getScopeSchools(district === 'all' ? '' : district);
  var h = '';
  for (var i = 0; i < schools.length; i++) {
    var checked = selected.indexOf(schools[i]) !== -1 ? ' checked' : '';
    h += '<label><input type="checkbox" value="' + schools[i].replace(/"/g, '&quot;') + '"' + checked + ' onchange="onScopeSchoolToggle()"> ' + schools[i] + '</label>';
  }
  if (!schools.length) h += '<div style="padding:10px;font-size:12px;color:var(--text-light);text-align:center;">该区县暂无学校</div>';
  return h;
}

function toggleScopePanel(type) {

  // Close all panels first
  var allPanels = document.querySelectorAll('.scope-cascade .multi-select-dropdown');
  for (var i = 0; i < allPanels.length; i++) allPanels[i].classList.remove('show');
  if (!isOpen) panel.classList.add('show');
}

function filterScopeSchools() {
  var searchEl = document.getElementById('scopeSchoolSearch');
  var q = (searchEl ? searchEl.value : '').toLowerCase();
  var listEl = document.getElementById('scopeSchoolList');
  if (!listEl) return;
  var labels = listEl.querySelectorAll('label');
  for (var i = 0; i < labels.length; i++) {
    var text = (labels[i].textContent || '').toLowerCase();
    labels[i].style.display = q ? (text.indexOf(q) !== -1 ? '' : 'none') : '';
  }
}

function removeScopeItem(type, value) {
  if (type === 'district') {
    _scopeSelectedDistricts = _scopeSelectedDistricts.filter(function(d) { return d !== value; });
    // Also uncheck in panel
    var cbs = document.querySelectorAll('#scopeDistrictPanel input[type="checkbox"]');
    for (var i = 0; i < cbs.length; i++) {
      if (cbs[i].value === value) { cbs[i].checked = false; break; }
    }
  } else {
    _scopeSelectedSchools = _scopeSelectedSchools.filter(function(s) { return s !== value; });
    var cbs2 = document.querySelectorAll('#scopeSchoolPanel input[type="checkbox"]');
    for (var j = 0; j < cbs2.length; j++) {
      if (cbs2[j].value === value) { cbs2[j].checked = false; break; }
    }
  }
  updateScopeHiddenData();
  refreshScopeCascadeKeepPanel(type);
}

function createBatch() {
  var name = (document.getElementById('batchName') || {}).value || '';
  var year = (document.getElementById('batchYear') || {}).value || '';
  var startDate = (document.getElementById('batchStartDate') || {}).value || '';
  var deadline = (document.getElementById('batchDeadline') || {}).value || '';
  if (!name) { showToast('请填写批次名称', 'warning'); return; }
  if (!year) { showToast('请选择年度', 'warning'); return; }
  if (!startDate) { showToast('请选择申报开始日期', 'warning'); return; }
  if (!deadline) { showToast('请选择申报截止日期', 'warning'); return; }
  // Read structured scope
  var scopeType = document.getElementById('scopeTypeHid') ? document.getElementById('scopeTypeHid').value : 'all';
  var scopeData = { districts: [], schools: [] };
  var scopeDataEl = document.getElementById('scopeDataHid');
  if (scopeDataEl) {
    try { scopeData = JSON.parse(decodeURIComponent(scopeDataEl.value)); } catch(e) {}
  }
  if (scopeType === 'schools' && !scopeData.schools.length) { showToast('请至少选择一所学校', 'warning'); return; }
  if (scopeType === 'districts' && !scopeData.districts.length) { showToast('请至少选择一个区县', 'warning'); return; }
  // District admin "全区": map to scopeType=districts with own district
  var finalScopeType = scopeType;
  var finalDistricts = scopeData.districts;
  if (currentRole === 'district' && scopeType === 'all') {
    finalScopeType = 'districts';
    var userDist = (typeof currentUser !== 'undefined' && currentUser && currentUser.district) || '鱼峰区';
    finalDistricts = [userDist];
  }
  var scopeObj = {
    scopeType: finalScopeType,
    scopeDistricts: finalDistricts,
    scopeSchools: scopeData.schools
  };
  var now = new Date();
  var today = now.toISOString().slice(0,10);
  var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  var batchStatus = startDate > today ? '未开始' : '进行中';
  var genDistrict = currentRole === 'district' ? ((typeof currentUser !== 'undefined' && currentUser && currentUser.district) || '鱼峰区') : '市直属';
  var newId = generateBatchId(year, genDistrict);
  var newBatch = { id: newId, year: year, name: name, org: (currentRole === 'district' ? (genDistrict + '教育局') : '柳州市教育局'), startDate: startDate, publishDate: nowStr, deadline: deadline, scope: scopeObj, status: batchStatus, subCount: 0, reviewedCount: 0 };
  if (currentRole === 'district') BATCHES_DISTRICT.push(newBatch);
  else BATCHES.push(newBatch);
  closeModal();
  showToast('批次创建成功');
  renderMain();
}

  c += '<div style="font-size:11px;color:var(--text-light);margin-top:2px;">申报从当天 00:00:00 开始</div>';

  c += '</div>';

  // 备注说明 — editable
  c += '<div class="form-group"><label>备注说明</label><textarea id="editBatchNotes" placeholder="批次说明..." maxlength="200">' + (b.notes || '') + '</textarea><div style="font-size:11px;color:var(--text-light);margin-top:2px;">最多200字</div></div>';

function saveEditBatch(id) {
  var b = getAllBatches().find(function(x) { return x.id === id; });
  if (!b) return;
  var nameEl = document.getElementById('editBatchName');
  var startEl = document.getElementById('editBatchStart');
  var deadlineEl = document.getElementById('editBatchDeadline');
  var notesEl = document.getElementById('editBatchNotes');
  if (!nameEl || !nameEl.value.trim()) { showToast('请输入批次名称'); return; }
  if (!deadlineEl || !deadlineEl.value) { showToast('请选择申报截止日期'); return; }
  if (startEl && startEl.value && deadlineEl.value && startEl.value > deadlineEl.value) { showToast('开始日期不能晚于截止日期'); return; }
  b.name = nameEl.value.trim();
  if (startEl && !startEl.disabled) {
    b.startDate = startEl.value;
    if (b.publishDate) b.publishDate = startEl.value + (b.publishDate.slice(10) || ' 00:00:00');
  }
  b.deadline = deadlineEl.value;
  b.notes = notesEl ? notesEl.value : '';
  // Sync to storage pool
  if (currentRole === 'district') {
    for (var i = 0; i < BATCHES_DISTRICT.length; i++) {
      if (BATCHES_DISTRICT[i].id === id) { BATCHES_DISTRICT[i] = b; break; }
    }
  } else {
    for (var i = 0; i < BATCHES.length; i++) {
      if (BATCHES[i].id === id) { BATCHES[i] = b; break; }
    }
  }
  closeModal();
  showToast('批次信息已更新');
  renderMain();
}

// ===== 编办确认提交 Modal =====
// Use form types — must match staffing-form.html USE_FORM_ROWS
var FINAL_CONFIRM_FORM_TYPES = [
  { type: '统一公开招聘', code: 'publicRecruit' },
  { type: '单位自主实施招聘', code: 'selfRecruit' },
  { type: '中高级人才招聘', code: 'talentMid' },
  { type: '引进高层次人才', code: 'talentHigh' },
  { type: '调动', code: 'transfer' },
  { type: '其他', code: 'other' }
];

var _finalDocFile = null;

function openFinalConfirmModal(subId) {
  var s = null;
  for (var i = 0; i < SUBMISSIONS.length; i++) {
    if (SUBMISSIONS[i].id === subId) { s = SUBMISSIONS[i]; break; }
  }
  if (!s) { showToast('未找到申报记录'); return; }

  _finalDocFile = null;
  var isCareer = s.staffingType === 'career';
  var typeLabel = isCareer ? '事业编' : '控制数';
  var countLabel = isCareer ? '使用事业编制（名）' : '使用控制数（名）';

  var c = '<div class="modal-header"><h3>提交编办确认</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  c += '<div class="modal-body">';
  c += '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:16px;">' + s.orgName + ' · ' + typeLabel + ' · ' + s.id + '</p>';

  // Per-item confirmation table
  c += '<table class="confirm-table"><thead><tr>';
  c += '<th>使用形式</th>';
  c += '<th style="text-align:center;width:90px;">' + countLabel + '</th>';
  c += '<th style="text-align:center;width:100px;">编办核定数 <span style="color:var(--danger);">*</span></th>';
  c += '</tr></thead><tbody>';

  for (var t = 0; t < FINAL_CONFIRM_FORM_TYPES.length; t++) {
    var ft = FINAL_CONFIRM_FORM_TYPES[t];
    var schoolNum = (s.useForms && s.useForms[ft.code]) || 0;
    c += '<tr>';
    c += '<td>' + ft.type + '</td>';
    c += '<td style="text-align:center;color:' + (schoolNum > 0 ? 'var(--text)' : 'var(--text-light)') + ';">' + (schoolNum > 0 ? schoolNum : '—') + '</td>';
    c += '<td style="text-align:center;">';
    if (schoolNum > 0) {
      c += '<input type="number" class="num-input final-num-input" data-type="' + ft.type + '" data-code="' + ft.code + '" data-school-num="' + schoolNum + '" value="' + schoolNum + '" min="0" max="' + schoolNum + '">';
    } else {
      c += '<span style="color:var(--text-light);">—</span>';
    }
    c += '</td></tr>';
  }
  c += '</tbody></table>';

  // Validity period
  var today = new Date().toISOString().slice(0, 10);
  var nextYear = (new Date().getFullYear() + 1) + today.slice(4);

  c += '<div class="form-group" style="flex:1;margin-bottom:0;"><label>编制有效期起 <span style="color:var(--danger);">*</span></label>';
  c += '<input type="date" id="finalValidityStart" value="' + today + '"></div>';
  c += '<div class="form-group" style="flex:1;margin-bottom:0;"><label>编制有效期止 <span style="color:var(--danger);">*</span></label>';
  c += '<input type="date" id="finalValidityEnd" value="' + nextYear + '"></div>';
  c += '</div>';
  c += '<p style="font-size:10px;color:var(--text-light);margin-bottom:16px;">有效期起止时间精度到日，起始日 00:00:00 至截止日 23:59:59</p>';

  // Document upload — project-standard upload pattern
  c += '<div class="form-group">';
  c += '<label>编办确认文档 <span style="color:var(--danger);">*</span></label>';
  c += '<div class="upload-area" id="finalDocArea" onclick="document.getElementById(\'finalDocInput\').click()"';
  c += ' ondragover="event.preventDefault();this.classList.add(\'drag-over\');"';
  c += ' ondragleave="this.classList.remove(\'drag-over\');"';

  openModal(c, 'modal-wide');

  window._currentFinalSubId = s.id;
}

function handleFinalDocSelect(e) {
  var f = e.target.files[0];
  if (!f) return;
  processFinalDoc(f);
  e.target.value = '';
}

function handleFinalDocDrop(e) {
  var files = e.dataTransfer.files;
  if (files.length > 0) processFinalDoc(files[0]);
}

function processFinalDoc(f) {
  // Validate file type
  var ext = '.' + f.name.split('.').pop().toLowerCase();
  var allowedExts = ['.pdf','.jpg','.jpeg','.png','.doc','.docx','.xls','.xlsx'];
  if (allowedExts.indexOf(ext) === -1) {
    showToast('不支持的文件格式（' + ext + '），请上传 PDF、Word、Excel 或图片文件');
    return;
  }
  // Block compressed archives
  if (['.zip','.rar','.7z','.gz','.tar'].indexOf(ext) !== -1) {
    showToast('不支持压缩包格式，请解压后上传原文件');
    return;
  }
  // Validate size
  if (f.size > 10 * 1024 * 1024) {
    showToast('文件大小 ' + (f.size / 1024 / 1024).toFixed(1) + ' MB 超过 10MB 上限，请压缩后重新上传');
    return;
  }

  _finalDocFile = f;
  var area = document.getElementById('finalDocArea');
  if (area) area.style.display = 'none';
  var display = document.getElementById('finalUploadedFile');
  if (display) {
    display.innerHTML = '<div class="upload-file">📎 ' + f.name + ' (' + (f.size / 1024 / 1024).toFixed(1) + ' MB)<span class="remove" onclick="removeFinalDoc()">✕ 移除</span></div>';
  }
}

function removeFinalDoc() {
  _finalDocFile = null;
  var inp = document.getElementById('finalDocInput');
  if (inp) inp.value = '';
  var area = document.getElementById('finalDocArea');
  if (area) area.style.display = '';
  var display = document.getElementById('finalUploadedFile');
  if (display) display.innerHTML = '';
}

function submitFinalConfirm(subId) {
  var s = null;
  for (var i = 0; i < SUBMISSIONS.length; i++) {
    if (SUBMISSIONS[i].id === subId) { s = SUBMISSIONS[i]; break; }
  }
  if (!s) return;

  // Validate per-item counts
  var inputs = document.querySelectorAll('.final-num-input');
  var details = [];
  var totalCount = 0;
  var valid = true;
  inputs.forEach(function(inp) {
    var val = parseInt(inp.value);
    var max = parseInt(inp.dataset.schoolNum);
    if (isNaN(val) || val < 0 || val > max) {
      inp.classList.add('error');
      valid = false;
    } else {
      inp.classList.remove('error');
      details.push({ type: inp.dataset.district, code: inp.dataset.code, schoolNum: max, finalNum: val });
      totalCount += val;
    }
  });
  if (!valid) { showToast('请正确填写编办核定数（0 ≤ 核定数 ≤ 学校申请数）'); return; }

  // Validate validity period
  var vStart = document.getElementById('finalValidityStart').value;
  var vEnd = document.getElementById('finalValidityEnd').value;
  if (!vStart || !vEnd) { showToast('请选择编制有效期起止日期'); return; }
  if (vEnd < vStart) { showToast('有效期结束日期不能早于开始日期'); return; }

  // Validate document
  if (!_finalDocFile) { showToast('请上传编办确认文档（必填）'); return; }

  // Update submission
  s.schoolFinalConfirm = {
    details: details,
    totalFinalCount: totalCount,
    validityStart: vStart,
    validityEnd: vEnd,
    document: { name: _finalDocFile.name, size: _finalDocFile.size },
    submitTime: new Date().toISOString().slice(0, 19).replace('T', ' '),
    submitter: ROLES[currentRole].name
  };
  s.status = 'final_submitted';

  saveData();
  closeModal();
  showToast('编办确认已提交，待主管单位二审确认');
  renderMain();
}

function exportSingleRecord(id) {
  var s = SUBMISSIONS.find(function(x) { return x.id === id; });
  if (!s) { showToast('未找到该申报记录'); return; }
  var uf = s.useForms || {};
  var totalCount = Object.values(uf).reduce(function(a,b){return a+(b||0);},0);

  if (s.staffingType === 'career') {
    // 事业编 — 附件2 格式
    var csv = '﻿申报编号,单位名称,核定编制数,实有在编人数,未使用计划数,申请总数,调动,公开招聘,自主招聘,中高级人才招聘,引进高层次人才,其他,状态,提交时间\n';
    csv += [
      s.id,
      s.orgName,
      s.totalStaff || '',
      s.currentStaff || '',
      s.unusedPlan || '',
      totalCount,
      uf.transfer || 0,
      uf.publicRecruit || 0,
      uf.selfRecruit || 0,
      uf.talentMid || 0,
      uf.talentHigh || 0,
      uf.other || 0,
      STATUS_MAP[s.status] || s.status,
      s.submitDate || ''
    ].join(',') + '\n';
    downloadCSV(csv, s.id + '_附件2_事业编_' + (s.submitDate || '') + '.csv');
  } else {
    // 控制数 — 附件9 格式
    var csv = '﻿申报编号,单位名称,核定控制数,实有控制数人数,未使用控制数,申请总数,调动,公开招聘,自主招聘,引进人才,其他,状态,提交时间\n';
    csv += [
      s.id,
      s.orgName,
      s.controlNum || '',
      s.controlActual || '',
      s.unusedControl || '',
      totalCount,
      uf.transfer || 0,
      uf.publicRecruit || 0,
      uf.selfRecruit || 0,
      uf.talent || 0,
      uf.other || 0,
      STATUS_MAP[s.status] || s.status,
      s.submitDate || ''
    ].join(',') + '\n';
    downloadCSV(csv, s.id + '_附件9_控制数_' + (s.submitDate || '') + '.csv');
  }
}

function downloadCSV(csv, filename) {
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出：' + filename);
}

function downloadBatchSummary(batchId) {
  openExportModal(batchId, 'batch');
}
function downloadYearSummary(year) {
  openExportModal(null, 'year');
}
function openExportModal(batchId, mode) {
  // Collect submissions for this batch
  var subs = batchId
    ? SUBMISSIONS.filter(function(s) { return s.batchId === batchId; })
    : SUBMISSIONS;

  // Collect filter options
  var types = [];
  var regions = [];
  var seenType = {}, seenRegion = {};
  subs.forEach(function(s) {
    var t = STAFFING_TYPE_MAP[s.staffingType] || s.staffingType;
    if (!seenType[t]) { seenType[t] = true; types.push(t); }
    var r = s.district || '未知';
    if (!seenRegion[r]) { seenRegion[r] = true; regions.push(r); }
  });

  var c = '<div class="modal-header"><h3>' + (mode === 'batch' ? '批次汇总导出' : '年度汇总导出') + ' — 共 ' + subs.length + ' 条</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  c += '<div class="modal-body" style="padding:16px 20px;">';

  // Filter row
  c += '<div style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end;">';
  c += '<div class="form-group" style="margin-bottom:0;min-width:120px;"><label style="font-size:11px;">所属区域</label><select id="expRegion" onchange="filterExportTable()" style="padding:6px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;width:100%;">';
  c += '<option value="all">全部</option>';
  regions.forEach(function(r) { c += '<option value="' + r + '">' + r + '</option>'; });
  c += '</select></div>';
  c += '<div class="form-group" style="margin-bottom:0;min-width:110px;"><label style="font-size:11px;">编制类型</label><select id="expType" onchange="filterExportTable()" style="padding:6px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;width:100%;">';
  c += '<option value="all">全部</option>';
  types.forEach(function(t) { c += '<option value="' + t + '">' + t + '</option>'; });
  c += '</select></div>';
  c += '<div class="form-group" style="margin-bottom:0;min-width:100px;"><label style="font-size:11px;">状态</label><select id="expStatus" onchange="filterExportTable()" style="padding:6px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;width:100%;">';
  c += '<option value="all">全部</option>';
  c += '<option value="submitted">待一审</option><option value="first_approved">一审通过</option><option value="final_submitted">待二审</option><option value="approved">已完成</option><option value="rejected">一审驳回</option>';
  c += '</select></div>';
  c += '<div style="flex:1;text-align:right;"><span style="font-size:11px;color:var(--text-light);" id="expFilteredCount"></span></div>';
  c += '</div>';

  // Table
  c += '<div style="max-height:45vh;overflow:auto;border:1px solid var(--border);border-radius:6px;">';
  c += '<table style="font-size:12px;min-width:1000px;">';
  c += '<thead><tr style="background:#F8FAFC;">';
  c += '<th style="width:32px;text-align:center;"><input type="checkbox" id="expSelectAll" onchange="toggleExportSelectAll(this)" style="cursor:pointer;"></th>';
  c += '<th>申报编号</th><th>编制类型</th><th>申请单位</th><th>所属区域</th>';
  c += '<th style="text-align:right;">核定编制数</th><th style="text-align:right;">在编人数</th>';
  c += '<th style="text-align:right;">控制数</th><th style="text-align:right;">控制数实有</th>';
  c += '<th style="text-align:right;">申请数</th><th>状态</th><th>提交时间</th>';
  c += '</tr></thead><tbody id="expTableBody">';
  c += '</tbody></table></div>';

  c += '</div>';
  c += '<div class="modal-footer"><span style="font-size:12px;color:var(--text-secondary);margin-right:auto;" id="expSelCount">已选 0 条</span><button class="btn btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doExportChecked(\'' + (batchId || '') + '\',\'' + mode + '\')">📥 导出选中</button></div>';
  openModal(c, 'modal-xwide');

  // Store data for filtering
  window._expData = subs;
  window._expBatchId = batchId;
  window._expMode = mode;
  renderExportTable();
}

function renderExportTable() {
  var subs = window._expData || [];
  var region = document.getElementById('expRegion') ? document.getElementById('expRegion').value : 'all';
  var type = document.getElementById('expType') ? document.getElementById('expType').value : 'all';
  var status = document.getElementById('expStatus') ? document.getElementById('expStatus').value : 'all';

  var filtered = subs.filter(function(s) {
    if (region !== 'all' && s.district !== region) return false;
    if (type !== 'all' && (STAFFING_TYPE_MAP[s.staffingType] || s.staffingType) !== type) return false;
    if (status !== 'all' && s.status !== status) return false;
    return true;
  });

  var tbody = document.getElementById('expTableBody');
  var h = '';
  filtered.forEach(function(s, idx) {
    var useCount = s.useForms ? Object.values(s.useForms).reduce(function(a,b){return a+(b||0);},0) : 0;
    var totalStaff = s.totalStaff || '—';
    var currentStaff = s.currentStaff || '—';
    var controlNum = s.controlNum || '—';
    var controlActual = s.controlActual || '—';
    h += '<tr style="border-bottom:1px solid #F1F5F9;">';
    h += '<td style="text-align:center;"><input type="checkbox" class="exp-row-cb" data-id="' + s.id + '" onchange="updateExportSelCount()"></td>';
    h += '<td>' + s.id + '</td>';
    h += '<td>' + (STAFFING_TYPE_MAP[s.staffingType] || s.staffingType) + '</td>';
    h += '<td>' + s.orgName + '</td>';
    h += '<td>' + (s.district || '—') + '</td>';
    h += '<td style="text-align:right;">' + totalStaff + '</td>';
    h += '<td style="text-align:right;">' + currentStaff + '</td>';
    h += '<td style="text-align:right;">' + controlNum + '</td>';
    h += '<td style="text-align:right;">' + controlActual + '</td>';
    h += '<td style="text-align:right;">' + useCount + '</td>';
    h += '<td><span class="sbc-status ' + getStatusBadgeClass(s.status) + '" style="font-size:10px;">' + (STATUS_MAP[s.status] || s.status) + '</span></td>';
    h += '<td>' + (s.submitDate || '—') + '</td>';
    h += '</tr>';
  });
  tbody.innerHTML = h || '<tr><td colspan="12" style="text-align:center;padding:20px;color:var(--text-light);">无匹配数据</td></tr>';

  document.getElementById('expSelectAll').checked = false;
  var fc = document.getElementById('expFilteredCount');
  if (fc) fc.textContent = '显示 ' + filtered.length + ' 条';
  updateExportSelCount();
}

function filterExportTable() { renderExportTable(); }

function toggleExportSelectAll(cb) {
  var cbs = document.querySelectorAll('.exp-row-cb');
  cbs.forEach(function(c) { c.checked = cb.checked; });
  updateExportSelCount();
}

function updateExportSelCount() {
  var cbs = document.querySelectorAll('.exp-row-cb');
  var count = 0;
  var total = cbs.length;
  cbs.forEach(function(c) { if (c.checked) count++; });
  var el = document.getElementById('expSelCount');
  if (el) el.textContent = '已选 ' + count + ' 条 / 共 ' + total + ' 条';
  var sa = document.getElementById('expSelectAll');
  if (sa) sa.checked = (count > 0 && count === total);
}

function doExportChecked(batchId, mode) {
  var cbs = document.querySelectorAll('.exp-row-cb:checked');
  var ids = [];
  cbs.forEach(function(c) { ids.push(c.dataset.id); });
  if (ids.length === 0) { showToast('请至少勾选一条数据'); return; }

  var subs = SUBMISSIONS.filter(function(s) { return ids.indexOf(s.id) !== -1; });

  var csv = '﻿申报编号,编制类型,申请单位,所属区域,核定编制数,在编人数,控制数,控制数实有,申请数,状态,提交时间\n';
  subs.forEach(function(s) {
    var useCount = s.useForms ? Object.values(s.useForms).reduce(function(a,b){return a+(b||0);},0) : 0;
    csv += s.id + ',' + (STAFFING_TYPE_MAP[s.staffingType] || '') + ',' + s.orgName + ',' + (s.district || '') + ',' + (s.totalStaff || '') + ',' + (s.currentStaff || '') + ',' + (s.controlNum || '') + ',' + (s.controlActual || '') + ',' + useCount + ',' + (STATUS_MAP[s.status] || '') + ',' + (s.submitDate || '') + '\n';
  });

  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (batchId || 'year_summary') + '_export_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  closeModal();
  showToast('已导出 ' + subs.length + ' 条记录');
}

// ===== YEAR SUMMARY MODE =====
function toggleYearSummaryMode() {
  isYearSummaryMode = !isYearSummaryMode;
  selectedBatchIdsForSummary = [];
  renderMain();
}

function toggleBatchForSummary(batchId, event) {
  event.stopPropagation();
  var idx = selectedBatchIdsForSummary.indexOf(batchId);
  if (idx === -1) {
    selectedBatchIdsForSummary.push(batchId);
  } else {
    selectedBatchIdsForSummary.splice(idx, 1);
  }
  renderMain();
}

function generateYearSummary() {
  if (selectedBatchIdsForSummary.length === 0) {
    showToast('请至少选择一个批次');
    return;
  }
  var allSubs = [];
  selectedBatchIdsForSummary.forEach(function(batchId) {
    var subs = SUBMISSIONS.filter(function(s) { return s.batchId === batchId && s.status === 'approved'; });
    allSubs = allSubs.concat(subs);
  });
  var yearLabel = currentBatchYear || '全部年度';
  showToast(yearLabel + ' — 已选 ' + selectedBatchIdsForSummary.length + ' 个批次，终审通过 ' + allSubs.length + ' 条记录，汇总表已生成');
  isYearSummaryMode = false;
  selectedBatchIdsForSummary = [];
  renderMain();
}

function renderSubmissionsTable(subs) {
  var isSchoolView = currentRole === 'school';
  var isCityAdmin = currentRole === 'city';
  var h = '';

  // Action bar — filters
  h += '<div class="filter-bar">';
  if (isSchoolView) {
    var allBatches = SUBMISSIONS.filter(function(s) { return s.orgName === '柳州市第八中学'; }).map(function(s) { return s.batchName; }).filter(function(v, i, a) { return a.indexOf(v) === i; });
    h += '<label>批次</label><select class="filter-select"><option>全部</option>';
    allBatches.forEach(function(b) { h += '<option>' + b + '</option>'; });
    h += '</select>';
  } else {
    h += '<label>申请单位</label>';
    h += '<div class="searchable-select" id="orgSearchableSelect">';
    h += '<input class="ss-input" id="ssOrgInput" placeholder="搜索单位..." autocomplete="off" value="' + (orgNameFilter || '').replace(/"/g, '&quot;') + '" onfocus="showOrgDropdown()" oninput="filterOrgDropdown()" onkeydown="handleOrgKeydown(event)">';
    h += '<span class="ss-clear' + (orgNameFilter ? ' visible' : '') + '" id="ssClear" onclick="event.stopPropagation();clearOrgFilter()">×</span>';
    h += '<span class="ss-arrow">▼</span>';
    h += '<div class="ss-dropdown" id="ssOrgDropdown"></div>';
    h += '</div>';
    h += '<label>编制类型</label><select class="filter-select" onchange="setStaffingTypeFilter(this.value)"><option value="all"' + (staffingTypeFilter === 'all' ? ' selected' : '') + '>全部</option><option value="career"' + (staffingTypeFilter === 'career' ? ' selected' : '') + '>事业编</option><option value="control"' + (staffingTypeFilter === 'control' ? ' selected' : '') + '>控制数</option></select>'
  }
  h += '</div>';

  // Table
  h += '<div class="table-card"><div class="table-wrapper"><table>';
  h += '<thead><tr>';
  h += '<th>申报编号</th>';
  h += '<th>批次</th>';
  h += '<th>编制类型</th>';
  if (!isSchoolView) h += '<th>申请单位</th><th>所属区域</th>';
  h += '<th>核定编制数</th><th>在编人数</th><th>控制数</th><th>控制数实有</th>';
  h += '<th>申请数</th>';
  h += '<th>统一公开招聘</th><th>单位自主实施招聘</th><th>中高级人才招聘</th><th>引进高层次人才</th><th>调动</th><th>其他</th>';
  h += '<th>状态</th><th>提交时间</th><th>操作</th>';
  // Show "未开始" notice
  if (selectedBatchId) {
    var selBatch = getAllBatches().find(function(b) { return b.id === selectedBatchId; });
    if (selBatch && selBatch.status === '未开始') {
      h += '</tr></thead></table></div>';
      h += '<div class="empty-state" style="padding:60px 20px;">';
      h += '<div class="empty-icon">⏳</div>';
      h += '<div class="empty-text">该批次尚未到申报期</div>';
      h += '<div class="empty-sub" style="font-size:12px;color:var(--text-light);">申报时间：' + (selBatch.startDate || '') + ' ~ ' + (selBatch.deadline || '') + '</div>';
      h += '</div>';
      return h;
    }
  }

  // Pagination
  var totalItems2 = subs.length;
  var totalPages2 = Math.ceil(totalItems2 / pageSize);
  if (currentPage > totalPages2) currentPage = totalPages2 || 1;
  if (currentPage < 1) currentPage = 1;
  var startIdx2 = (currentPage - 1) * pageSize;
  var pageData2 = subs.slice(startIdx2, startIdx2 + pageSize);

  h += '</tr></thead><tbody>';

  pageData2.forEach(function(s) {
    var isCareer = s.staffingType === 'career';
    var typeLabel = STAFFING_TYPE_MAP[s.staffingType] || '控制数';
    var typeBadgeColor = isCareer ? 'color:#1456F0;' : 'color:#0E3EC0;';
    var attachmentLabel = isCareer ? '附件2' : '附件9';

    h += '<tr>';

    h += '<td>' + (s.totalStaff || '—') + '</td>';
    h += '<td>' + (s.currentStaff || '—') + '</td>';
    h += '<td>' + (s.controlNum || '—') + '</td>';
    h += '<td>' + (s.controlActual || '—') + '</td>';
    var uf = s.useForms || {};
    var useCount = Object.values(uf).reduce(function(a,b){return a+(b||0);},0);

    h += '<td>' + (uf.publicRecruit || 0) + '</td>';
    h += '<td>' + (uf.selfRecruit || 0) + '</td>';
    h += '<td>' + (uf.talentMid || 0) + '</td>';
    h += '<td>' + (uf.talentHigh || 0) + '</td>';
    h += '<td>' + (uf.transfer || 0) + '</td>';
    h += '<td>' + (uf.other || 0) + '</td>';
    h += '<td><span class="sbc-status ' + getStatusBadgeClass(s.status) + '" style="font-size:10px;">' + STATUS_MAP[s.status] + '</span></td>';
    h += '<td>' + (s.submitDate || '—') + '</td>';
    h += '<td><div class="action-links">';
    h += '<a href="staffing-detail.html?id=' + s.id + '">查看</a>';
    if (s.status === 'submitted' || s.status === 'final_submitted') {
      var canApprove = !isCityAdmin || s.district === '市直属';
      if (canApprove) {
        h += '<a href="审核编制使用申请页（主管单位视角）.html?id=' + s.id + '&role=' + currentRole + '" style="color:var(--primary);font-weight:500;">审核</a>';

    }
    if (s.status === 'rejected' && isSchoolView) {
      h += '<a href="staffing-form.html?id=' + s.id + '&staffingType=' + s.staffingType + '">修改重提</a>';
    }
    h += '</div></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += renderPaginationControls(totalItems2, currentPage, 'goAdminPage');
  h += '</div>';
  return h;
}

function switchRole(role) {
  currentRole = role;
  selectedBatchId = null;
  currentFilter = 'all';
  staffingTypeFilter = 'all';
  orgNameFilter = '';
  schoolYearFilter = new Date().getFullYear().toString();
  currentBatchYear = null;
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === role);
  });
  renderSidebar();
  renderMain();
  showToast('已切换至：' + ROLES[role].role + ' — ' + ROLES[role].name);
}
