<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>柳州教育人事管理平台 — 审核编制使用申请</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 12px; }
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}

.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column;
}
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
  margin-top: auto;
}
.role-switcher-label {
  font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;
  margin-bottom: 8px; padding: 0 4px;
}
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px);
}
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

.two-columns { display: flex; gap: 24px; align-items: flex-start; }
.main-col { flex: 1; min-width: 0; }
.side-col { width: 360px; flex-shrink: 0; }

/* Basic info card (right sidebar) */
.form-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
.form-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.bi-grid { display: flex; flex-direction: column; gap: 12px; }
.bi-item { font-size: 12px; }
.bi-item .bi-lbl { color: var(--text-light); font-size: 11px; }
.bi-item .bi-val { font-weight: 500; margin-top: 1px; font-size: 13px; color: var(--text); }

.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid #f0f2f5;
  font-weight: 600; font-size: 14px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px; background-color: #FAFBFC;
}

/* Progress bar */
.progress-container { padding: 20px; }
.progress-steps { display: flex; justify-content: space-between; align-items: center; }
.progress-node { flex: 1; text-align: center; }
.progress-node .node-dot {
  width: 36px; height: 36px; background: #e2e8f0; border-radius: 50%;
  margin: 0 auto 8px; line-height: 36px; font-size: 14px;
  font-weight: 600; color: #64748B;
}
.progress-node.completed .node-dot { background: #10B981; color: white; }
.progress-node.active .node-dot { background: var(--primary); color: white; }
.progress-node.rejected .node-dot { background: #EF4444; color: white; }
.progress-node .node-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.progress-node .node-detail { font-size: 10px; color: var(--text-secondary); }

/* New 5-step progress styles */
.progress-step { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.progress-dot {
  width: 36px; height: 36px; border-radius: 50%;
  line-height: 36px; font-size: 14px; font-weight: 600; text-align: center;
}
.progress-dot.done { background: #10B981; color: white; }
.progress-dot.current { background: var(--primary); color: white; }
.progress-dot.pending { background: #e2e8f0; color: #64748B; }
.progress-dot.rejected { background: #EF4444; color: white; }
.progress-label { font-size: 12px; font-weight: 500; margin-top: 6px; white-space: nowrap; }
.progress-label.done { color: #10B981; }
.progress-label.current { color: var(--primary); }
.progress-label.pending { color: #94A3B8; }
.progress-label.rejected { color: #EF4444; }
.progress-line { height: 2px; flex: 1; min-width: 16px; max-width: 80px; margin: 0 4px; margin-bottom: 26px; }
.progress-line.done { background: #10B981; }
.progress-line.pending { background: #e2e8f0; }

.school-final-doc {
  display: flex; align-items: center; gap: 6px; font-size: 12px;
  padding: 6px 10px; background: #fff; border-radius: 4px; border: 1px solid #e2e8f0;
}
.school-final-doc a { color: var(--primary); text-decoration: none; }
.school-final-doc a:hover { text-decoration: underline; }
.bf-tip-icon { display: inline-block; width: 14px; height: 14px; line-height: 14px; text-align: center; border-radius: 50%; background: #DBEAFE; color: #1E40AF; font-size: 9px; cursor: pointer; margin-left: 2px; font-style: normal; vertical-align: middle; }
.bf-tip-icon:hover { background: #BFDBFE; }
.bf-tooltip-popup { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 16px; width: 300px; font-size: 12px; line-height: 1.7; color: var(--text); }
.bf-tooltip-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.bf-tooltip-body { color: var(--text-secondary); }

#bf-tooltip-popup strong { color: #FBBF24; }
.file-link { font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: none; white-space: nowrap; }
.file-link:hover { text-decoration: underline; }

/* Timeline */
.timeline { position: relative; padding-left: 30px; }
.timeline-item {
  position: relative; padding-bottom: 20px;
  border-left: 2px solid #e2e8f0; margin-left: 12px; padding-left: 20px;
}
.timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline-dot {
  position: absolute; left: -9px; top: 0;
  width: 16px; height: 16px; border-radius: 50%;
  background: white; border: 2px solid #cbd5e1;
}
.timeline-item.completed .timeline-dot { background: #10B981; border-color: #10B981; }
.timeline-item.rejected .timeline-dot { background: #EF4444; border-color: #EF4444; }
.timeline-item.rejected .timeline-title { color: #EF4444; }
.timeline-time { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.timeline-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.timeline-desc { font-size: 11px; color: #475569; }

/* ===== STATUS SEAL STAMP ===== */
.page-seal {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0;
  border: 3px solid; font-weight: 700; text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
  transform: rotate(-8deg); position: relative;
  margin-left: auto;
}
.page-seal::before {
  content: ''; position: absolute; inset: 5px; border-radius: 50%;
  border: 1.5px dashed currentColor; opacity: 0.5;
}
.page-seal .seal-label { font-size: 9px; letter-spacing: 1px; opacity: 0.8; line-height: 1; }
.page-seal .seal-text { font-size: 14px; line-height: 1.1; margin-top: 1px; }
.page-seal.approved { color: #059669; border-color: #059669; background: rgba(209,250,229,0.25); }
.page-seal.rejected { color: #DC2626; border-color: #DC2626; background: rgba(254,226,226,0.25); }
.page-seal.submitted { color: #1E40AF; border-color: #1E40AF; background: rgba(239,246,255,0.25); }
.page-seal.first_approved { color: #2563EB; border-color: #2563EB; background: rgba(219,234,254,0.25); }
.page-seal.final_submitted { color: #EA580C; border-color: #EA580C; background: rgba(255,247,237,0.25); }

/* Unit info */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.info-item { background: #F8FAFC; padding: 12px; border-radius: var(--radius); }
.info-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.info-value { font-size: 13px; font-weight: 500; }

/* Step1 fields grid — 3-column, matching form/detail page */
.step1-fields-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 20px;
}
.step1-fields-grid .info-item {
  padding: 10px 14px; background: #F8FAFC; border-radius: 8px;
  border: 1px solid var(--border);
}
.step1-fields-grid .info-label {
  font-size: 11px; color: var(--text-light); margin-bottom: 4px; font-weight: 500;
}
.step1-fields-grid .info-value {
  font-size: 14px; font-weight: 600; color: var(--text);
}
.step1-fields-grid .info-item.full-width {
  grid-column: 1 / -1;
}
.step1-fields-grid .info-item-placeholder {
  visibility: hidden; padding: 10px 14px;
}

/* Attachment table */
.form-table { padding: 0 20px 20px 20px; overflow-x: auto; }
.form-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
.form-table th, .form-table td {
  text-align: center; padding: 10px 6px; border: 1px solid var(--border);
}
.form-table th { color: var(--text-secondary); font-weight: 600; background-color: #FAFBFC; white-space: nowrap; }
/* Materials list */
.material-list { padding: 0 20px 20px 20px; }
.material-list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid #edf2f7;
}
.material-list-item:last-child { border-bottom: none; }
.material-name { font-size: 13px; font-weight: 500; }
.material-req { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.material-status { font-size: 11px; }
.material-status.uploaded { color: #10B981; }

.review-actions {
  display: flex; gap: 16px; padding: 20px; border-top: 1px solid #f0f2f5;
  justify-content: center;
}
.btn-approve {
  background: #10B981; color: #fff; border: none;
  padding: 10px 32px; border-radius: 30px; font-size: 14px;
  cursor: pointer; font-family: inherit; font-weight: 500;
}
.btn-approve:hover { background: #059669; }
.btn-reject {
  background: #fff; color: #EF4444; border: 1px solid #EF4444;
  padding: 10px 32px; border-radius: 30px; font-size: 14px;
  cursor: pointer; font-family: inherit; font-weight: 500;
}
.btn-reject:hover { background: #FEF2F2; }
/* Final confirm */

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: none; align-items: center;
  justify-content: center; z-index: 1000;
}
.modal-overlay.show { display: flex; }
.modal-container {
  background: #fff; border-radius: var(--radius-lg); width: 500px;
  max-width: 90%; padding: 24px; box-shadow: var(--shadow-lg);
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 16px; font-weight: 600; margin: 0; }
.modal-close {
  cursor: pointer; color: var(--text-light); font-size: 22px;
  padding: 2px 6px; border: none; background: none; line-height: 1;
  border-radius: 4px; transition: color var(--transition), background var(--transition);
}
.modal-close:hover { color: var(--text); background: var(--gray-bg); }
.modal-body { }
.modal-body .form-group { margin-bottom: 14px; }
.modal-body .form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.modal-body .form-group textarea {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-family: inherit; resize: vertical;
}
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.form-group textarea {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-family: inherit; resize: vertical;
}
.modal-buttons { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
.btn-cancel {
  background: var(--gray-bg); border: none; padding: 8px 20px;
  border-radius: 30px; font-size: 13px; cursor: pointer; font-family: inherit;
}
.btn-confirm-danger {
  background: #EF4444; color: #fff; border: none;
  padding: 8px 24px; border-radius: 30px; cursor: pointer; font-size: 13px; font-family: inherit;
}
.btn-confirm-danger:hover { background: #DC2626; }
.view-detail-link { font-size:12px;color:var(--text-light);cursor:pointer;margin-left:6px;text-decoration:none; }
.view-detail-link:hover { color:var(--primary);text-decoration:underline; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* Toast */
.toast-msg {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px;
  border-radius: 40px; z-index: 2000; font-size: 13px;
  animation: toastAnim 1.8s ease forwards;
}
@keyframes toastAnim {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
  15% { opacity: 1; transform: translateX(-50%) translateY(0); }
  85% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 48 48" fill="none"><rect x="4" y="20" width="8" height="22" rx="2" fill="rgba(255,255,255,0.95)"/><rect x="14" y="14" width="8" height="28" rx="2" fill="rgba(255,255,255,0.85)"/><rect x="24" y="6" width="8" height="36" rx="2" fill="rgba(255,255,255,0.95)"/><rect x="34" y="10" width="8" height="32" rx="2" fill="rgba(255,255,255,0.75)"/><circle cx="38" cy="10" r="6" fill="#fff" opacity="0.5"/><path d="M36.5 8.5L39.5 11.5L42 8" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

<aside class="sidebar" id="sidebar">

      </button>
      <button class="role-switch-btn" data-role="school" onclick="switchRole('school')">
        <span class="role-switch-dot school"></span>校管理员

      </button>
      <button class="role-switch-btn" data-role="teacher" onclick="switchRole('teacher')">
        <span class="role-switch-dot teacher"></span>教 师

      </button>

</aside>

<main class="main">
  <div class="breadcrumb">
    <a onclick="window.location.href='workbench.html'">工作台</a> &nbsp;/&nbsp;
    <a onclick="window.location.href='staffing-application.html?role=' + encodeURIComponent(currentRole)">编制管理</a> &nbsp;/&nbsp;
    <span id="breadcrumbStage">审核编制使用申请</span>
  </div>
  <div id="mainContent"></div>
</main>

<!-- Plan Detail Modal -->
<div class="modal-overlay" id="planDetailModal">
  <div class="modal-container" style="width:800px;max-height:80vh">
    <div class="modal-header">
      <h3 id="planDetailTitle">计划明细</h3>
      <button class="modal-close" onclick="document.getElementById('planDetailModal').classList.remove('show')">×</button>
    </div>
    <div class="modal-body" id="planDetailBody" style="max-height:55vh;overflow-y:auto"></div>
  </div>
</div>

<script src="src/menu-config.js"></script>
<script>
function tipIconHtml(field) { return '<span class="bf-tip-icon" onclick="event.stopPropagation();showAggTooltip(event,\'' + field + '\')" style="cursor:pointer">ⓘ</span>'; }
window.onerror = function(msg, url, line, col, err) {
  var el = document.getElementById('mainContent');
  if (el) {
    el.innerHTML =
      '<div class="card" style="text-align:center;padding:60px;">' +
        '<div style="font-size:20px;font-weight:700;color:var(--danger);margin-bottom:12px;">页面脚本错误</div>' +
        '<div style="font-size:13px;color:var(--text-secondary);line-height:1.8;">' + (msg || '') + '</div>' +
        '<div style="font-size:11px;color:var(--text-light);margin-top:8px;">行 ' + line + ' · 列 ' + col + '</div>' +
      '</div>';
  }
  return true;
};

// ==================== ROLE UI ====================
function updateRoleUI() {
  document.querySelectorAll('.role-switch-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.role === currentRole); });
  var roleData = ROLES[currentRole]; if (!roleData) return;
  var n = document.querySelector('.topnav-user span'); if (n) n.textContent = roleData.name;
  var a = document.querySelector('.topnav-user .avatar'); if (a) a.textContent = roleData.short;
}
function switchRole(role) {
  currentRole = role;
  updateRoleUI();
  if (role === 'teacher') { window.location.href = 'workbench.html'; return; }
  if (role === 'school') { window.location.href = 'staffing-form.html'; return; }
  window.location.href = 'staffing-application.html?role=' + role;
}

function showToast(message, callback) {
  var toast = document.createElement('div');
  toast.className = 'toast-msg';
  toast.innerText = message;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); if (callback) callback(); }, 1500);
}

function handleFinalConfirm() {
  // Build detail items from schoolFinalConfirm data (school's submitted编办确认)
  var sc = app.schoolFinalConfirm;
  var confirmDetails = sc && sc.details ? sc.details : [];
  var schoolTotalApply = 0;

  // Build a map of schoolFinalConfirm details for quick lookup
  var schoolDetailMap = {};
  confirmDetails.forEach(function(d) {
    schoolDetailMap[d.type] = d;
    schoolTotalApply += d.finalNum;
  });

  var activeForms = [];
  app.useForms.forEach(function(f) {
    if (f.num > 0) activeForms.push(f);
  });
  var totalApply = 0;
  activeForms.forEach(function(f) { totalApply += f.num; });

  // Pre-fill from schoolFinalConfirm: use finalNum as initial value, fallback to schoolNum
  var itemsHtml = '';
  activeForms.forEach(function(f, i) {
    var sd = schoolDetailMap[f.type];
    var initialVal = sd ? sd.finalNum : f.num;
    itemsHtml +=
      '<div style="display:flex;align-items:center;gap:12px;padding:12px;background:#F8FAFC;border-radius:8px;margin-bottom:8px;">' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:13px;font-weight:600;">' + f.type + '</div>' +
          '<div style="font-size:11px;color:var(--text-secondary);">学校申请 <b>' + f.num + '</b> 名' +
            (sd ? ' · 编办提交确认 <b>' + sd.finalNum + '</b> 名' : '') +
          '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">' +
          '<span style="font-size:12px;color:var(--text-secondary);">确认通过</span>' +
          '<input type="number" id="finalItem_' + i + '" value="' + initialVal + '" min="0" max="' + f.num + '" style="width:80px;padding:8px 10px;font-size:16px;font-weight:700;text-align:center;border:2px solid var(--border);border-radius:8px;font-family:inherit;outline:none;" onchange="updateFinalTotal()" onfocus="this.select()">' +
          '<span style="font-size:12px;color:var(--text-secondary);">名</span>' +
        '</div>' +
      '</div>';
  });

  var initialTotal = schoolTotalApply || totalApply;
  var prefillValidityStart = sc && sc.validityStart ? sc.validityStart : '';
  var prefillValidityEnd = sc && sc.validityEnd ? sc.validityEnd : '';
  var schoolDocHtml = '';
  if (sc && sc.document && sc.document.name) {
    schoolDocHtml =
      '<div style="margin-bottom:12px;">' +
        '<div style="font-size:12px;font-weight:500;color:var(--text);margin-bottom:4px;">📎 学校已上传编办批复文件（只读）</div>' +
        '<div class="school-final-doc">' +
          '<span>' + sc.document.name + '</span>' +
          '<span style="font-size:10px;color:var(--text-light);">(' + (sc.document.size / 1024).toFixed(0) + ' KB)</span>' +
          '<a href="#" style="margin-left:auto;" onclick="previewSchoolDoc(\'' + (sc.document.name || '') + '\');return false;">👁 预览</a>' +
        '</div>' +
      '</div>';
  }

  var modalHtml =
    '<div class="modal-overlay" id="finalModal">' +
      '<div class="modal-container" style="width:640px;">' +
        '<h3>二审：编办确认 — 审核确认</h3>' +
        '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:16px;">学校已提交编办确认数据，请审核并逐项确认最终通过人数（≤学校申请数）。</div>' +
        schoolDocHtml +
        '<div style="margin-bottom:16px;">' + itemsHtml + '</div>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#EFF6FF;border-radius:8px;margin-bottom:16px;">' +
          '<div style="font-size:13px;color:var(--text-secondary);">确认通过合计</div>' +
          '<div style="display:flex;align-items:baseline;gap:4px;">' +
            '<span id="finalTotalDisplay" style="font-size:22px;font-weight:700;color:var(--primary);">' + initialTotal + '</span>' +
            '<span style="font-size:13px;color:var(--text-secondary);">/ ' + totalApply + ' 名（申请）</span>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:16px;margin-bottom:12px;">' +
          '<div class="form-group" style="flex:1;">' +
            '<label>编制额度生效起始日期</label>' +
            '<input type="date" id="finalValidityStart" value="' + prefillValidityStart + '" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;">' +
          '</div>' +
          '<div class="form-group" style="flex:1;">' +
            '<label>编制额度生效截止日期</label>' +
            '<input type="date" id="finalValidityEnd" value="' + prefillValidityEnd + '" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;">' +
          '</div>' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelFinal">取消</button>' +
          '<button class="btn-approve" id="confirmFinal" style="border-radius:30px;font-size:13px;">确认通过</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('finalModal').classList.add('show');

  document.getElementById('cancelFinal').onclick = function() { document.getElementById('finalModal').remove(); };

  window.updateFinalTotal = function() {
    var total = 0;
    activeForms.forEach(function(f, i) {
      var el = document.getElementById('finalItem_' + i);
      if (el) {
        var v = parseInt(el.value) || 0;
        if (v < 0) { v = 0; el.value = 0; }
        if (v > f.num) { v = f.num; el.value = f.num; }
        total += v;
      }
    });
    document.getElementById('finalTotalDisplay').textContent = total;
  };

  document.getElementById('confirmFinal').onclick = function() {
    var details = [];
    var totalFinal = 0;
    for (var i = 0; i < activeForms.length; i++) {
      var el = document.getElementById('finalItem_' + i);
      var v = el ? (parseInt(el.value) || 0) : 0;
      if (v < 0) v = 0;
      if (v > activeForms[i].num) v = activeForms[i].num;
      details.push({ type: activeForms[i].type, schoolNum: activeForms[i].num, finalNum: v });
      totalFinal += v;
    }
    if (totalFinal === 0) { showToast('请至少确认通过 1 名'); return; }

    var vStart = document.getElementById('finalValidityStart').value;
    var vEnd = document.getElementById('finalValidityEnd').value;

    app.status = 'approved';
    app.finalApprovedCount = totalFinal;
    app.finalApprovedDetails = details;
    app.finalValidityStart = vStart;
    app.finalValidityEnd = vEnd;
    var now = new Date().toISOString().slice(0, 19).replace('T', ' ');
    var operatorName = ROLES[currentRole].name;
    app.finalConfirmTime = now;

    var detailTexts = [];
    details.forEach(function(d) {
      if (d.finalNum > 0) {
        detailTexts.push(d.type + ' ' + d.schoolNum + '→' + d.finalNum + ' 名');
      }
    });
    var opinionText = '二审编办确认：' + detailTexts.join('，') + '，合计通过 ' + totalFinal + ' 名（申请 ' + totalApply + ' 名）';
    if (vStart || vEnd) {
      opinionText += '，额度有效期：' + (vStart || '—') + ' 至 ' + (vEnd || '—');
    }

    app.timeline.push({
      time: now, operator: operatorName, action: '二审：编办确认',
      opinion: opinionText,
      result: '通过'
    });
    document.getElementById('finalModal').remove();
    showToast('编办确认已完成，编制额度已生效', function() {
      renderPage();
    });
  };
}

function handleReject() {
  var modalHtml =
    '<div class="modal-overlay" id="rejectModal">' +
      '<div class="modal-container">' +
        '<h3>退回编制使用申请</h3>' +
        '<div class="form-group">' +
          '<label>退回理由 <span style="color:red;">*</span></label>' +
          '<textarea id="rejectReason" rows="4" maxlength="500" placeholder="请填写退回理由，以便学校重新申报时参考..."></textarea>' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelReject">取消</button>' +
          '<button class="btn-confirm-danger" id="confirmReject">确认退回</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('rejectModal').classList.add('show');
  document.getElementById('cancelReject').onclick = function() { document.getElementById('rejectModal').remove(); };
  document.getElementById('confirmReject').onclick = function() {
    var reason = document.getElementById('rejectReason').value.trim();
    if (!reason) { showToast('请填写退回理由'); return; }
    app.status = 'rejected';
    app.rejectReason = reason;
    var now = new Date().toISOString().slice(0, 19).replace('T', ' ');
    var operatorName = ROLES[currentRole].name;
    app.timeline.push({
      time: now, operator: operatorName, action: '主管单位审核退回',
      opinion: reason, result: '驳回'
    });
    document.getElementById('rejectModal').remove();
    showToast('已退回', function() {
      renderPage();
    });
  };
}

function renderProgress() {

  var isFirstApproved = s.status === 'first_approved';

  if (isApproved) {
    steps = [
      { label: '学校提交', state: 'done' },
      { label: '一审：材料审核', state: 'done' },
      { label: '学校提交编办确认', state: 'done' },
      { label: '二审：编办确认', state: 'done' },
      { label: '审核完成', state: 'done' }
    ];
  } else if (isRejected) {
    steps = [
      { label: '学校提交', state: 'done' },
      { label: '一审：材料审核', state: 'done' },
      { label: '审核退回', state: 'rejected' },
      { label: '二审：编办确认', state: 'pending' },
      { label: '审核完成', state: 'pending' }
    ];
  } else if (isFinalSubmitted) {
    steps = [
      { label: '学校提交', state: 'done' },
      { label: '一审：材料审核', state: 'done' },
      { label: '学校提交编办确认', state: 'done' },
      { label: '二审：编办确认', state: 'current' },
      { label: '审核完成', state: 'pending' }
    ];
  } else if (isFirstApproved) {
    steps = [
      { label: '学校提交', state: 'done' },
      { label: '一审：材料审核', state: 'done' },
      { label: '学校提交编办确认', state: 'current' },
      { label: '二审：编办确认', state: 'pending' },
      { label: '审核完成', state: 'pending' }
    ];
  } else {
    steps = [
      { label: '学校提交', state: 'done' },
      { label: '一审：材料审核', state: 'current' },
      { label: '学校提交编办确认', state: 'pending' },
      { label: '二审：编办确认', state: 'pending' },
      { label: '审核完成', state: 'pending' }
    ];
  }
  var html = '';
  steps.forEach(function(step, i) {
    var isRejectedStep = step.state === 'rejected';
    var dotIcon = step.state === 'done' ? '✓' : (isRejectedStep ? '✕' : (i + 1));
    var dotClass = step.state === 'done' ? 'done' : (step.state === 'current' ? 'current' : (isRejectedStep ? 'rejected' : 'pending'));
    html += '<div class="progress-step">';
    html += '<div class="progress-dot ' + dotClass + '">' + dotIcon + '</div>';
    html += '<div class="progress-label ' + dotClass + '">' + step.label + '</div>';
    html += '</div>';
    if (i < steps.length - 1) {
      html += '<div class="progress-line ' + (step.state === 'done' ? 'done' : 'pending') + '"></div>';
    }
  });
  document.getElementById('progressTrack').innerHTML = html;
}

var _planDetailFilter = {};
var _planDetailPage = {};
var _PLAN_PAGE_SIZE = 8;

function resetPlanDetailFilter(track) {
  _planDetailFilter[track] = { source: '', status: '', keyword: '' };
  _planDetailPage[track] = 1;
}

function getPlanStatus(p) {
  var now = new Date().toISOString().slice(0,10);
  var remain = p.approvedCount - (p.occupiedCount||0) - (p.usedCount||0);
  if (remain <= 0 && p.approvedCount > 0) return 'exhausted';
  if (p.validEnd && p.validEnd < now && (p.occupiedCount||0) > 0) return 'expiring_occupied';
  if (p.validEnd && p.validEnd < now) return 'expired';
  return 'active';
}

var PLAN_STATUS_LABEL = { active:'有效', exhausted:'已用完', expiring_occupied:'过期·有占用', expired:'已到期' };
var PLAN_STATUS_CLASS = { active:'active', exhausted:'exhausted', expiring_occupied:'warn', expired:'expired' };

function openPlanDetailModal(track) {
  if (typeof track === 'object' || !track) {
    track = (this && this.dataset) ? this.dataset.track : (track && track.target ? track.target.dataset.track : track);
  }

  var label = track === 'career' ? '事业编' : '控制数';
  resetPlanDetailFilter(track);
  document.getElementById('planDetailTitle').textContent = label + ' — 已批复计划明细';
  renderPlanDetailBody(track);
  document.getElementById('planDetailModal').classList.add('show');
}

function renderPlanDetailBody(track) {
  var plans = _demoPlans[track] || [];
  var f = _planDetailFilter[track] || { source: '', status: '', keyword: '' };

  // Compute aggregates
  var agg = { approvedPlan:0, occupiedPlan:0, usedPlan:0, unusedPlan:0, expiredOccupiedPlan:0 };
  plans.forEach(function(p) {
    agg.approvedPlan += p.approvedCount;
    agg.occupiedPlan += (p.occupiedCount||0);
    agg.usedPlan += (p.usedCount||0);
  });

  // Filter
  var filtered = plans.filter(function(p) {
    if (f.source && p.source !== f.source) return false;
    if (f.status && getPlanStatus(p) !== f.status) return false;
    if (f.keyword) {
      var kw = f.keyword.toLowerCase();
      var doc = (p.offlineDocNo || p.sourceBatchId || '').toLowerCase();
      if (doc.indexOf(kw) === -1) return false;
    }
    return true;
  });

  // Split active vs expired
  var activePlans = [], expiredPlans = [];
  filtered.forEach(function(p) {
    if (getPlanStatus(p) === 'expired') expiredPlans.push(p);
    else activePlans.push(p);
  });

  // Calculate expired occupied
  filtered.forEach(function(p) {
    var st = getPlanStatus(p);
    if (st === 'expiring_occupied' || st === 'expired') {
      agg.expiredOccupiedPlan += (p.occupiedCount||0);
    }
  });
  agg.unusedPlan = agg.approvedPlan - agg.occupiedPlan - agg.usedPlan;

  // Pagination
  var page = _planDetailPage[track] || 1;
  var totalPages = Math.max(1, Math.ceil(activePlans.length / _PLAN_PAGE_SIZE));
  if (page > totalPages) { page = totalPages; _planDetailPage[track] = page; }
  var start = (page - 1) * _PLAN_PAGE_SIZE;
  var pagePlans = activePlans.slice(start, start + _PLAN_PAGE_SIZE);

  var h = '';
  // Filter bar
  h += '<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;">';
  h += '<select onchange="_planDetailFilter[\'' + track + '\'].source=this.value;_planDetailPage[\'' + track + '\']=1;renderPlanDetailBody(\'' + track + '\')" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px;">';
  h += '<option value="">全部来源</option><option value="online">线上</option><option value="offline">线下</option></select>';
  h += '<select onchange="_planDetailFilter[\'' + track + '\'].status=this.value;_planDetailPage[\'' + track + '\']=1;renderPlanDetailBody(\'' + track + '\')" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px;">';
  h += '<option value="">全部状态</option><option value="active">有效</option><option value="exhausted">已用完</option><option value="expiring_occupied">过期·有占用</option><option value="expired">已到期</option></select>';
  h += '<input type="text" placeholder="搜索批复文号/批次..." oninput="_planDetailFilter[\'' + track + '\'].keyword=this.value;_planDetailPage[\'' + track + '\']=1;renderPlanDetailBody(\'' + track + '\')" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px;width:160px;" value="' + escapeHtml(f.keyword || '') + '">';
  h += '</div>';

  // Summary
  h += '<div style="display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;font-size:12px;padding:10px 14px;background:#F8FAFC;border-radius:6px;">';
  h += '<span>已批复 <strong>' + agg.approvedPlan + '</strong> 人</span>';
  h += '<span>占用 <strong>' + (agg.occupiedPlan||0) + '</strong> 人</span>';
  h += '<span>已入编 <strong>' + Math.max(0, agg.usedPlan - (agg.occupiedPlan||0)) + '</strong> 人</span>';
  h += '<span>未使用 <strong>' + agg.unusedPlan + '</strong> 人</span>';
  if ((agg.expiredOccupiedPlan||0) > 0) h += '<span style="color:#C2410C;">到期占用中 ' + agg.expiredOccupiedPlan + ' 人</span>';
  h += '</div>';

  if (filtered.length === 0) {
    h += '<div style="text-align:center;padding:40px;color:var(--text-light);">无匹配记录</div>';
  } else {
    h += '<table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">序号</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">来源</th>';
    h += '<th style="padding:8px;text-align:left;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">批复文号/批次</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">批复</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">已占用</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">已入编</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">未使用</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">有效期</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">状态</th>';
    h += '</tr></thead><tbody>';

    function renderRow(p, idx) {
      var st = getPlanStatus(p);
      var stLabel = PLAN_STATUS_LABEL[st] || st;
      var stClass = PLAN_STATUS_CLASS[st] || '';
      var remain = p.approvedCount - (p.occupiedCount||0) - (p.usedCount||0);
      var isExpired = st === 'expired';
      var sourceLabel = p.source === 'online' ? '线上' : '线下';
      var sourceColor = p.source === 'online' ? '#2563EB' : '#9333EA';
      var docLabel = p.source === 'online' ? (p.sourceBatchId||'') : (p.offlineDocNo||'');
      var trStyle = isExpired ? 'opacity:0.5;' : '';
      var r = '<tr style="' + trStyle + '">';
      r += '<td style="padding:6px 8px;text-align:center;font-size:11px;color:var(--text-light);border-bottom:1px solid var(--border);">' + idx + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);"><span style="font-size:11px;padding:2px 6px;border-radius:4px;background:' + (p.source==='online'?'#EFF6FF':'#FAF5FF') + ';color:' + sourceColor + ';">' + sourceLabel + '</span></td>';
      r += '<td style="padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);">' + escapeHtml(docLabel) + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);">' + p.approvedCount + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);' + ((p.occupiedCount||0)>0?'color:var(--warning);font-weight:500;':'') + '">' + (p.occupiedCount||0) + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);">' + (p.usedCount||0) + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);font-weight:600;">' + remain + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);">' + (p.validEnd||'—') + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);"><span style="font-size:10px;padding:2px 6px;border-radius:10px;' + (stClass==='active'?'background:#D1FAE5;color:#059669;':stClass==='exhausted'?'background:#FEE2E2;color:#DC2626;':stClass==='warn'?'background:#FFF7ED;color:#C2410C;':'background:#F1F5F9;color:#64748B;') + '">' + stLabel + '</span></td>';
      r += '</tr>';
      return r;
    }

    var idx = start + 1;
    pagePlans.forEach(function(p) { h += renderRow(p, idx); idx++; });
    h += '</tbody></table>';

    // Expired plans section
    if (expiredPlans.length > 0) {
      h += '<div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-top:16px;margin-bottom:8px;">已到期计划</div>';
      h += '<table style="width:100%;border-collapse:collapse;font-size:12px;opacity:0.6;"><thead><tr>';
      h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">序号</th>';
      h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">来源</th>';
      h += '<th style="padding:8px;text-align:left;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">批复文号/批次</th>';
      h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">批复</th>';
      h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">有效期</th>';
      h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">状态</th>';
      h += '</tr></thead><tbody>';
      var eIdx = 1;
      expiredPlans.forEach(function(p) {
        h += renderRow(p, '🔒 ' + eIdx);
        eIdx++;
      });
      h += '</tbody></table>';
    }

    // Pagination
    if (totalPages > 1) {
      h += '<div style="text-align:center;margin-top:12px;font-size:12px;color:var(--text-secondary);">';
      h += '<button onclick="_planDetailPage[\'' + track + '\']=1;renderPlanDetailBody(\'' + track + '\')" ' + (page<=1?'disabled':'') + ' style="padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;margin-right:4px;">«</button>';
      h += '<span style="margin:0 8px;">' + page + ' / ' + totalPages + '</span>';
      h += '<button onclick="_planDetailPage[\'' + track + '\']=' + (page+1) + ';renderPlanDetailBody(\'' + track + '\')" ' + (page>=totalPages?'disabled':'') + ' style="padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;margin-left:4px;">»</button>';
      h += '</div>';
    }
  }

  document.getElementById('planDetailBody').innerHTML = h;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

</script>
</body>
</html>
