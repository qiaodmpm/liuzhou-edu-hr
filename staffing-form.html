<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建申报 — 编制使用申请 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}

.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }

.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); }

/* Form card */
.form-card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  padding: 28px 32px; margin-bottom: 20px;
}
.form-card-title {
  font-size: 15px; font-weight: 600; color: var(--text);
  padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.form-card-title .step-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--primary); color: #fff; font-size: 12px; font-weight: 700;
}
.form-row { display: flex; gap: 16px; margin-bottom: 16px; }
.form-row .form-group { flex: 1; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 13px; font-weight: 500;
  color: var(--text); margin-bottom: 6px;
}
.form-group label .required { color: var(--danger); margin-left: 2px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 12px; font-size: 13px;
  border: 1px solid var(--border); border-radius: 6px;
  font-family: inherit; outline: none; transition: var(--transition);
  background: #fff; color: var(--text);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}
.form-group textarea { resize: vertical; min-height: 60px; }

/* Step1 readonly fields grid */
.step1-fields-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
}
.step1-fields-grid .info-item {
  padding: 10px 14px; background: #F8FAFC; border-radius: 8px;
  border: 1px solid var(--border);
}
.step1-fields-grid .info-label {
  font-size: 11px; color: var(--text-light); margin-bottom: 4px; font-weight: 500;
}
.step1-fields-grid .info-value {
  font-size: 14px; font-weight: 600; color: var(--text);
}
.step1-fields-grid .info-item-placeholder {
  background: transparent; border: none; padding: 0;
}
.info-value {
  font-size: 14px; font-weight: 600; color: var(--text); padding: 8px 0;
}
.form-group .input-unit { position: relative; }
.form-group .input-unit input { padding-right: 50px; }
.form-group .input-unit .unit-label {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 12px; color: var(--text-light);
}
.form-group .help-text { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.form-group input[type="file"] { padding: 6px; }
.form-group .calculated {
  background: #F8FAFC; color: var(--primary); font-weight: 600;
}

/* Use forms table */
.use-form-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.use-form-table th {
  padding: 10px 12px; text-align: center; font-weight: 600; font-size: 12px;
  color: var(--text-secondary); background: #F8FAFC; border: 1px solid var(--border);
}
.use-form-table td {
  padding: 8px; border: 1px solid var(--border); text-align: center;
}
.use-form-table td input {
  width: 100%; padding: 6px 8px; font-size: 12px; border: 1px solid var(--border);
  border-radius: 4px; text-align: center; font-family: inherit; outline: none;
}
.use-form-table td input:focus { border-color: var(--accent); }
.use-form-table .row-label {
  text-align: left; font-weight: 500; color: var(--text-secondary);
  background: #F8FAFC;
}
.use-form-table tr.summary-row td {
  font-weight: 600; background: #FAFBFC;
}

/* Upload area */
.upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 32px; text-align: center; cursor: pointer; transition: var(--transition);
}
.upload-area:hover { border-color: var(--accent); background: #F8FAFC; }
.upload-area.drag-over { border-color: var(--primary); background: var(--primary-light); }
.upload-area .upload-icon { font-size: 40px; margin-bottom: 8px; }
.upload-area .upload-text { font-size: 13px; color: var(--text-secondary); }
.upload-area .upload-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.upload-file {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: #F0FDF4; border-radius: 6px; margin-top: 12px; font-size: 13px;
}
.upload-file .remove { color: var(--danger); cursor: pointer; margin-left: auto; }

/* Type selector */
.type-selector {
  display: flex; gap: 12px; margin-bottom: 20px;
}
.type-option {
  flex: 1; padding: 16px; border: 2px solid var(--border); border-radius: var(--radius-lg);
  cursor: pointer; text-align: center; transition: var(--transition); background: #fff;
}
.type-option:hover { border-color: var(--accent); }
.type-option.locked { cursor: not-allowed; opacity: 0.65; }
.type-option.locked:hover { border-color: var(--border); }
.type-option.selected {
  border-color: var(--primary); background: var(--primary-light);
}
.type-option .type-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.type-option .type-form { font-size: 12px; color: var(--text-secondary); }
.type-option .type-badge {
  display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 500;
}
.type-badge.career { background: #DBEAFE; color: #1E40AF; }
.type-badge.control { background: #E0E7FF; color: #3730A3; }

/* Footer actions */
.two-columns { display: flex; gap: 24px; align-items: flex-start; }
.form-col { flex: 1; min-width: 0; }
.history-col { width: 340px; flex-shrink: 0; position: sticky; top: 80px; }
.history-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 24px; }
.history-card-title { font-size: 14px; font-weight: 600; color: var(--text); padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.timeline-item { position: relative; margin-bottom: 16px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot { position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); z-index: 1; }
.timeline-time { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
.timeline-action { font-size: 13px; font-weight: 500; color: var(--text); }
.timeline-detail { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.file-link { font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: none; white-space: nowrap; }
.file-link:hover { text-decoration: underline; }
.modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px; border-top: 1px solid var(--border); }

.form-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 0;
}
.form-footer-right { display: flex; gap: 12px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: var(--transition); border: 1px solid transparent;
  font-family: inherit; text-decoration: none;
}
.btn-primary {
  background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
  color: #fff;
}
.btn-primary:hover { box-shadow: 0 4px 12px rgba(30,64,175,0.3); transform: translateY(-1px); }
.btn-outline { background: #fff; color: var(--text-secondary); border-color: var(--border); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-lg { padding: 12px 32px; font-size: 15px; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: 0.9; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 12px 28px; border-radius: var(--radius); color: #fff;
  font-size: 14px; font-weight: 500; z-index: 9999;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
  box-shadow: var(--shadow-lg);
}
.toast.success { background: var(--success); }
.toast.warning { background: var(--warning); color: #1E293B; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
.bf-tip-icon { display: inline-block; width: 14px; height: 14px; line-height: 14px; text-align: center; border-radius: 50%; background: #DBEAFE; color: #1E40AF; font-size: 9px; cursor: pointer; margin-left: 2px; font-style: normal; vertical-align: middle; }
.bf-tip-icon:hover { background: #BFDBFE; }
.bf-tooltip-popup { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 16px; width: 300px; font-size: 12px; line-height: 1.7; color: var(--text); }
.bf-tooltip-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.bf-tooltip-body { color: var(--text-secondary); }

/* Quota summary bar */
.quota-summary {
  display: flex; gap: 16px; padding: 12px 16px; background: #F8FAFC;
  border-radius: var(--radius); margin-top: 16px;
}
.quota-item {
  flex: 1; text-align: center;
}
.quota-item .q-label { font-size: 11px; color: var(--text-secondary); }
.quota-item .q-value { font-size: 18px; font-weight: 700; }
.quota-item .q-value.ok { color: var(--success); }
.quota-item .q-value.warn { color: var(--warning); }
.quota-item .q-value.error { color: var(--danger); }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .form-row { flex-direction: column; }
}

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
.modal-overlay.show { display: flex; }
.modal-container { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 24px; color: var(--text-light); cursor: pointer; }
.modal-close:hover { color: var(--text); }
.modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px; border-top: 1px solid var(--border); }

.modal-buttons{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.btn-cancel{background:var(--gray-bg);border:none;padding:8px 20px;border-radius:30px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-confirm-danger{background:#EF4444;color:#fff;border:none;padding:8px 24px;border-radius:30px;cursor:pointer;font-size:13px;font-family:inherit}
.btn-confirm-danger:hover{background:#DC2626}
</style>
</head>
<body>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 48 48" fill="none"><rect x="4" y="20" width="8" height="22" rx="2" fill="rgba(255,255,255,0.95)"/><rect x="14" y="14" width="8" height="28" rx="2" fill="rgba(255,255,255,0.85)"/><rect x="24" y="6" width="8" height="36" rx="2" fill="rgba(255,255,255,0.95)"/><rect x="34" y="10" width="8" height="32" rx="2" fill="rgba(255,255,255,0.75)"/><circle cx="38" cy="10" r="6" fill="#fff" opacity="0.5"/><path d="M36.5 8.5L39.5 11.5L42 8" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

</nav>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-menu" id="sidebarMenu"></div>

  <div class="role-switcher" id="roleSwitcher">
    <div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options">
      <button class="role-switch-btn" data-role="city" onclick="switchRole('city')">
        <span class="role-switch-dot city"></span><span class="role-switcher-name">市管理员</span>
      </button>
      <button class="role-switch-btn" data-role="district" onclick="switchRole('district')">
        <span class="role-switch-dot district"></span><span class="role-switcher-name">区管理员</span>
      </button>
      <button class="role-switch-btn active" data-role="school" onclick="switchRole('school')">
        <span class="role-switch-dot school"></span><span class="role-switcher-name">校管理员</span>
      </button>
      <button class="role-switch-btn" data-role="teacher" onclick="switchRole('teacher')">
        <span class="role-switch-dot teacher"></span><span class="role-switcher-name">教 师</span>
      </button>
    </div>

function buildTimelineHtml(hist, formData) {
  // Auto-generate timeline from status if history is sparse
  var items = [];
  var fd = formData || {};
  var schoolOp = fd.submitter || ROLES[currentRole].name;

  // If we have rich history data, use it; otherwise auto-generate
  if (hist && hist.length > 0) {
    for (var hi = 0; hi < hist.length; hi++) {
      var h = hist[hi];
      items.push({ time: h.time || '', action: h.action || '', detail: h.detail || '' });
    }
  } else {
    // Auto-generate from status
    items.push({ time: fd.submitDate || '', action: '提交申报', detail: '提交了编制使用申报' });
    if (fd.rejectReason) {
      items.push({ time: fd.rejectTime || '', action: '一审驳回', detail: '原因：' + fd.rejectReason });
    }
  }

  if (items.length === 0) return '<div style="text-align:center;padding:20px;color:var(--text-light);font-size:12px;">暂无履历记录</div>';
  // Color map
  var dotColorMap = { '提交申报': '#3B82F6', '一审驳回': '#EF4444', '修改重提': '#F59E0B', '一审通过': '#3B82F6', '提交编办确认': '#8B5CF6', '二审通过': '#10B981' };
  var hh = '';
  for (var hi = 0; hi < items.length; hi++) {
    var item = items[hi];
    var color = dotColorMap[item.action] || '#3B82F6';
    hh += '<div class="timeline-item"><div class="timeline-dot" style="background:' + color + ';"></div>';
    hh += '<div class="timeline-time">' + (item.time || '') + '</div>';
    hh += '<div class="timeline-action">' + (item.action || '') + '</div>';
    hh += '<div class="timeline-detail">' + schoolOp + ' · ' + (item.detail || '') + '</div>';
    hh += '</div>';
  }
  hh += '<div class="timeline-item"><div class="timeline-dot" style="background:#F59E0B;"></div>';
  hh += '<div class="timeline-action" style="color:#F59E0B;font-weight:600;">当前：修改重提中</div></div>';
  return hh;
}

// ===== FILE UPLOAD =====
var ALLOWED_EXTS = ['.pdf','.jpg','.jpeg','.png','.doc','.docx','.xls','.xlsx'];
var BLOCKED_EXTS = ['.zip','.rar','.7z','.tar','.gz','.bz2','.xz','.tgz'];
var MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB

function validateFile(file) {
  var ext = '.' + file.name.split('.').pop().toLowerCase();
  if (BLOCKED_EXTS.indexOf(ext) !== -1) {
    return '不支持压缩包格式（' + ext + '），请上传 PDF、Word、Excel 或图片文件';
  }
  if (ALLOWED_EXTS.indexOf(ext) === -1) {
    return '不支持的文件格式（' + ext + '），仅支持 PDF、Word、Excel、图片';
  }
  if (file.size > MAX_FILE_SIZE) {
    return '文件大小 ' + (file.size / 1024 / 1024).toFixed(1) + ' MB 超过 10MB 上限，请压缩后重新上传';
  }
  return null;
}

function handleFile(e) {
  var f = e.target.files[0];
  if (!f) return;
  processUploadFile(f);
  e.target.value = '';
}

function handleDrop(e) {
  var files = e.dataTransfer.files;
  if (files.length > 0) processUploadFile(files[0]);
}

function processUploadFile(f) {
  var err = validateFile(f);
  if (err) { showToast(err, 'warning'); return; }
  uploadedFile = f;
  document.getElementById('uploadArea').style.display = 'none';
  document.getElementById('uploadedFile').innerHTML =
    '<div class="upload-file">📎 ' + f.name + ' (' + (f.size / 1024 / 1024).toFixed(1) + ' MB)<span class="remove" onclick="removeFile()">✕ 移除</span></div>';
}

function removeFile() {
  uploadedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('uploadArea').style.display = '';
  document.getElementById('uploadedFile').innerHTML = '';
  window._editFile = null;
}

function confirmDeleteFile(fileName) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay show';
  overlay.id = 'deleteConfirmModal';
  overlay.innerHTML = '<div class="modal-container" style="width:440px;padding:24px;border-radius:16px;">' +
    '<h3 style="font-size:16px;font-weight:600;margin-bottom:16px;">确认删除</h3>' +
    '<p style="font-size:14px;color:var(--text);">确定要删除附件「' + fileName + '」吗？</p>' +
    '<p style="font-size:12px;color:var(--text-light);margin-top:8px;">删除后可重新上传新文件。</p>' +
    '<div class="modal-buttons">' +
      '<button class="btn-cancel" onclick="this.closest(\'.modal-overlay\').remove()">取消</button>' +
      '<button class="btn-confirm-danger" onclick="doDeleteFile();this.closest(\'.modal-overlay\').remove()">确认删除</button>' +
    '</div></div>';
  document.body.appendChild(overlay);
}

function doDeleteFile() {
  uploadedFile = null;
  window._editFile = null;
  if (formId) localStorage.removeItem('attach_' + formId);
  document.getElementById('fileInput').value = '';
  document.getElementById('uploadArea').style.display = '';
  document.getElementById('uploadedFile').innerHTML = '';
  showToast('附件已删除，可重新上传');
}

// ===== SUBMIT =====
function submitForm() {
  var cfg = TYPE_CONFIG[staffingType];

  // Check unit name
  var unitName = document.getElementById('fUnitName').value.trim();
  if (!unitName) { showToast('单位信息未加载，请刷新页面', 'warning'); return; }

  var totalApply = getApplyTotal();
  if (totalApply <= 0) { showToast('请填写使用形式及数量（合计必须大于0）', 'warning'); return; }

  // Quota validation per type
  var valid = cfg.validation();
  if (!valid.ok) {
    showToast('申请数量(' + valid.apply + ')超过' + valid.label + '(' + valid.quota + ')，请调整', 'warning');
    return;
  }

  // Completeness: each positive row must have education filled
  for (var i = 0; i < USE_FORM_ROWS.length; i++) {
    var row = USE_FORM_ROWS[i];
    if (row.num > 0 && !row.edu.trim()) {
      showToast('"' + row.type + '" 人数 > 0，请填写学历、专业、资格要求', 'warning');
      return;
    }
  }

  // Build submission payload — generate ID: S{B/A}{YYYY}-{region2}{batch3}-{school3}{J/K}{seq2}
  var submissionId = formId;
  if (!submissionId) {
    // Lookup school orgId from org_directory
    var schoolCode = '000';
    try {
      var orgDir = JSON.parse(localStorage.getItem('org_directory') || '[]');
      for (var oi = 0; oi < orgDir.length; oi++) {
        if (orgDir[oi].orgName === currentSchoolName) {
          var parts = orgDir[oi].orgId.split('-');
          schoolCode = (parts[parts.length - 1] || '000').slice(-3).padStart(3, '0');
          break;
        }
      }
    } catch(e) {}
    var typeCode = staffingType === 'career' ? 'J' : 'K';
    // Count existing submissions for batch+school+type to get seq
    var seq = 1;
    var existingSubs = JSON.parse(localStorage.getItem('staffing_submissions') || '[]');
    for (var si = 0; si < existingSubs.length; si++) {
      var s = existingSubs[si];
      if (s.batchId === formBatchId && s.orgName === currentSchoolName && s.staffingType === staffingType) {
        seq++;
      }
    }
    submissionId = 'S' + formBatchId + '-' + schoolCode + typeCode + String(seq).padStart(2, '0');
  }
  // Capture unit info snapshot at submission time
  var profile = SCHOOL_PROFILE[currentSchoolName] || {};
  var unitInfoSnapshot = {
    orgName: profile.orgName || currentSchoolName,
    orgLevel: profile.orgLevel || '',
    orgNature: profile.orgNature || '',
    totalStaff: profile.totalStaff || 0,
    currentStaff: profile.currentStaff || 0,
    approvedPlan: profile.approvedPlan || 0,
    usedPlan: profile.usedPlan || 0,
    unusedPlan: profile.unusedPlan || 0,
    availablePlan: profile.availablePlan || 0,
    expiredOccupiedPlan: profile.expiredOccupiedPlan || 0,
    controlNum: profile.controlNum || 0,
    controlActual: profile.controlActual || 0,
    controlApprovedPlan: profile.controlApprovedPlan || 0,
    controlUsedPlan: profile.controlUsedPlan || 0,
    controlUnusedPlan: profile.controlUnusedPlan || 0,
    controlAvailablePlan: profile.controlAvailablePlan || 0,
    expiredOccupiedControlPlan: profile.expiredOccupiedControlPlan || 0,
    capturedAt: new Date().toISOString().replace('T', ' ').substring(0, 19)
  };
  var payload = {
    id: submissionId,
    batchId: formBatchId,
    batchName: formBatchName, orgName: currentSchoolName,
    staffingType: staffingType,
    useForms: {},
    status: 'submitted',
    submitDate: new Date().toISOString().replace('T', ' ').substring(0, 19),
    unitInfoSnapshot: unitInfoSnapshot
  };
  USE_FORM_ROWS.forEach(function(row) {
    payload.useForms[row.code] = row.num;
  });

  // Track submission for duplicate check
  saveSubmissionRecord(formBatchId, staffingType, submissionId);
  // Track in submissions list for ID sequencing
  try {
    var subsList = JSON.parse(localStorage.getItem('staffing_submissions') || '[]');
    subsList.push({ id: submissionId, batchId: formBatchId, orgName: currentSchoolName, staffingType: staffingType, submitDate: payload.submitDate, submitter: ROLES[currentRole].name });
    localStorage.setItem('staffing_submissions', JSON.stringify(subsList));
  } catch(e) {}

  // Save form data to localStorage for edit/reload
  var historyEntry = { time: payload.submitDate, action: isEditMode ? '修改重提' : '学校提交申报', detail: '使用' + (staffingType === 'career' ? '事业编制' : '控制数') + '合计' + totalApply + '名' };
  var key = 'form_' + submissionId;
  var prev = JSON.parse(localStorage.getItem(key) || '{}');
  var hist = prev.history || [];
  hist.push(historyEntry);
  localStorage.setItem(key, JSON.stringify({ useForms: USE_FORM_ROWS, submitDate: payload.submitDate, batchId: formBatchId, batchName: formBatchName, staffingType: staffingType, submitter: ROLES[currentRole].name, history: hist }));

  // Save attachment info to localStorage
  if (uploadedFile) {
    localStorage.setItem('attach_' + submissionId, JSON.stringify({ name: uploadedFile.name, size: uploadedFile.size }));
  }

  var msg = isEditMode ? '修改重提已提交，待主管单位审核' : '申报已提交，待主管单位审核';
  showToast(msg);
  setTimeout(function() { window.location.href = 'staffing-application.html'; }, 1500);
}

function tipIconHtml(field) { return '<span class="bf-tip-icon" onclick="event.stopPropagation();showAggTooltip(event,\'' + field + '\')" style="cursor:pointer">ⓘ</span>'; }
var AGG_TOOLTIPS = {
  approved: { title:'已批复计划数', body:'仅统计<strong>有效期内</strong>的编制批复计划。<br>已到期的批复名额不计入此数字。<br><br>数据来源：计划明细自动汇总，不可手动修改。' },
  used:     { title:'已使用计划数', body:'<strong>= 已占用 + 已入编</strong><br><br>有效期内计划中已占用和已入编的人数之和。<br>已到期计划中的使用数不计入。' },
  unused:   { title:'未使用计划数', body:'<strong>= 已批复 − 已使用</strong><br><br>已到期的剩余名额不计入此数字。' },
  available:{ title:'可申请数', body:'<strong>= 核定数 − 实有数 − 已批复计划数 − 到期占用中人数</strong><br><br>编制余额。还可向编办申请的编制名额数量。<br>结果 ≤ 0 表示编制已满或超额。<br><br>⚠️ 已过期但仍有占用的计划，其占用人数会扣减可申请数。' },
  expiredOccupied:{ title:'到期占用中', body:'<strong>已过期但仍有人员占用的计划中，尚未入编的人数。</strong><br><br>占用名额仍有效，应尽快为占用人员办理入编手续。<br>入编完成后相关计划将自动标记为"已用完"。' }
};
function showAggTooltip(event, field) {
  var existing = document.getElementById('bf-tooltip-popup');
  if (existing) existing.remove();
  var info = AGG_TOOLTIPS[field];
  if (!info) return;
  var popup = document.createElement('div');
  popup.id = 'bf-tooltip-popup';
  popup.className = 'bf-tooltip-popup';
  popup.innerHTML = '<div class="bf-tooltip-title">' + info.title + ' ⓘ</div><div class="bf-tooltip-body">' + info.body + '</div><button class="btn btn-sm btn-primary" onclick="document.getElementById(\'bf-tooltip-popup\').remove()" style="margin-top:8px">知道了</button>';
  popup.style.position = 'fixed';
  popup.style.top = Math.min(event.clientY, window.innerHeight - 280) + 'px';
  popup.style.left = Math.min(event.clientX, window.innerWidth - 320) + 'px';
  popup.style.zIndex = '9999';
  document.body.appendChild(popup);
  setTimeout(function() {
    document.addEventListener('click', function closeAgg(e) {
      if (!popup.contains(e.target) && e.target.className.indexOf('bf-tip-icon') === -1) {
        popup.remove();
        document.removeEventListener('click', closeAgg);
      }
    });
  }, 100);
}
</script>
