<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>岗位晋升详情 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* Two-column detail layout */
.detail-layout { display: flex; gap: 24px; }
.detail-main { flex: 1; min-width: 0; }
.detail-sidebar { width: 360px; flex-shrink: 0; }

/* Page header */
.page-header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header .header-right { display: flex; align-items: center; gap: 12px; }

/* Status stamp */
.status-stamp {
  display: inline-block; padding: 6px 16px; border: 2px solid;
  transform: rotate(-5deg); font-weight: 700; font-size: 14px; background: #fff;
}
.status-stamp.pending { color: #F59E0B; border-color: #F59E0B; }
.status-stamp.approved { color: #10B981; border-color: #10B981; }
.status-stamp.rejected { color: #EF4444; border-color: #EF4444; }
.status-stamp.completed { color: #8B5CF6; border-color: #8B5CF6; }

/* Status hint */
.status-hint { padding: 10px 16px; background: var(--primary-light); border-radius: 6px; font-size: 12px; color: var(--primary); margin-bottom: 16px; border-left: 3px solid var(--primary); }
.status-hint.rejected { background: #FEF2F2; color: #991B1B; border-left-color: var(--danger); }
.status-hint.success { background: #F0FDF4; color: #065F46; border-left-color: var(--success); }

/* Progress bar */
.progress-bar { display: flex; align-items: center; padding: 16px 20px; background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 20px; }
.step { display: flex; align-items: center; gap: 6px; }
.step-dot { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; border: 2px solid var(--border); color: var(--text-light); flex-shrink: 0; }
.step.done .step-dot { background: var(--success); color: #fff; border-color: var(--success); }
.step.current .step-dot { background: var(--primary); color: #fff; border-color: var(--primary); }
.step.rejected .step-dot { background: var(--danger); color: #fff; border-color: var(--danger); }
.step-text { font-size: 11px; color: var(--text-light); white-space: nowrap; }
.step.current .step-text { color: var(--primary); font-weight: 500; }
.step.done .step-text { color: var(--success); }
.step.rejected .step-text { color: var(--danger); }
.step-line { flex: 1; height: 2px; background: var(--border); margin: 0 8px; min-width: 20px; }
.step-line.done { background: var(--success); }
.step-line.rejected { background: #FECACA; }

/* Form cards (read-only) */
.form-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
.form-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.info-grid-2col { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.info-item { font-size: 12px; }
.info-item.full { grid-column: 1 / -1; }
.info-item .lbl { color: var(--text-light); font-size: 11px; display: block; }
.info-item .val { font-weight: 500; margin-top: 2px; display: block; font-size: 13px; }

/* Attachments */
.attachments-section h4 { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin: 12px 0 8px; }
.att-item { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--gray-bg); border-radius: 6px; font-size: 12px; margin-right: 8px; margin-bottom: 6px; }
.att-item a { color: var(--primary); text-decoration: none; cursor: pointer; }
.att-item a:hover { text-decoration: underline; }
.att-item-block { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--gray-bg); border-radius: 4px; margin-bottom: 4px; font-size: 12px; }
.att-item-block a { color: var(--primary); text-decoration: none; font-size: 11px; cursor: pointer; }
.att-item-block a:hover { text-decoration: underline; }

/* HR result */
.hr-attachment { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--gray-bg); border-radius: 6px; margin-top: 12px; font-size: 12px; }
.hr-attachment .file-name { flex: 1; font-weight: 500; }
.hr-attachment a { color: var(--primary); cursor: pointer; text-decoration: none; }

/* Modification history */
.mod-list { border: 1px solid #FED7AA; border-radius: 6px; overflow: hidden; }
.mod-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 11px; border-bottom: 1px solid #FED7AA; background: #FFFBF5; }
.mod-item:last-child { border-bottom: none; }
.mod-item .mod-field { font-weight: 600; min-width: 70px; }
.mod-item .mod-old { color: var(--danger); text-decoration: line-through; }
.mod-item .mod-new { color: var(--success); font-weight: 500; }
.mod-item .mod-operator { color: var(--text-secondary); margin-left: auto; }
.mod-item .mod-time { color: var(--text-light); white-space: nowrap; }

/* Sidebar */
.sidebar-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
.sidebar-card h4 { font-size: 13px; font-weight: 600; margin-bottom: 14px; }
.sidebar-info { font-size: 12px; }
.sidebar-info .si-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
.sidebar-info .si-row:last-child { border-bottom: none; }
.sidebar-info .si-label { color: var(--text-light); }
.sidebar-info .si-value { font-weight: 500; }

/* Timeline */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px;
  width: 2px; background: var(--border);
}
.timeline-item { position: relative; margin-bottom: 20px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot {
  position: absolute; left: -24px; top: 4px;
  width: 14px; height: 14px; border-radius: 50%; z-index: 1;
}
.timeline-dot.submit { background: var(--accent); }
.timeline-dot.reject { background: var(--danger); }
.timeline-dot.resubmit { background: var(--warning); }
.timeline-dot.approve { background: var(--success); }
.timeline-content .tlc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.timeline-content .tlc-title { font-size: 13px; font-weight: 600; color: var(--text); }
.timeline-content .tlc-time { font-size: 11px; color: var(--text-light); }
.timeline-content .tlc-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.timeline-content .tlc-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 500;
}
.tlc-tag.reject-reason { background: #FEE2E2; color: var(--danger); }
.tlc-tag.resubmit-tag { background: #FEF3C7; color: #D97706; }
.tlc-tag.approve-tag { background: #D1FAE5; color: #059669; }

/* Action bar */
.action-bar { margin-top: 20px; padding: 16px 20px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; gap: 12px; justify-content: flex-end; }
.action-bar .btn { padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.action-bar .btn-primary { background: var(--primary); color: #fff; border: none; }
.action-bar .btn-primary:hover { background: var(--primary-dark); }
.action-bar .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
.action-bar .btn-outline:hover { background: var(--gray-bg); }

/* Back link */
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); cursor: pointer; text-decoration: none; }
.back-link:hover { color: var(--primary); }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

@media (max-width: 1024px) {
  .detail-layout { flex-direction: column; }
  .detail-sidebar { width: 100%; }
  .info-grid { grid-template-columns: repeat(2, 1fr); }
  .info-grid-2col { grid-template-columns: 1fr; }
}
</style>
</head>

function loadRecords() {
  try {
    var stored = JSON.parse(localStorage.getItem('promote_records') || '[]');
    if (stored.length === 0) return JSON.parse(JSON.stringify(DEMO_RECORDS));
    var demoMap = {};
    DEMO_RECORDS.forEach(function(r) { demoMap[r.id] = r; });
    var merged = [];
    var seenIds = {};
    stored.forEach(function(sr) {
      var dr = demoMap[sr.id];
      if (dr) {
        NEW_RECORD_FIELDS.forEach(function(k) {
          if (!(k in sr)) { sr[k] = dr[k]; }
        });
      }
      // Migrate old senior3Form field names to new ones
      if (sr.senior3Form && sr.senior3Form.graduateSchool && !sr.senior3Form.schoolMajor) {
        var old = sr.senior3Form;
        sr.senior3Form = {
          schoolMajor: old.graduateSchool || '',
          graduateTime: old.graduateTime || '',
          workStartTime: old.workStartTime || '',
          profYears: old.profYears || '',
          qualName: old.techQualName || '',
          qualTime: old.techQualTime || '',
          employStart: old.currentPostPeriod ? old.currentPostPeriod.from : (old.employStart || ''),
          employEnd: old.currentPostPeriod ? old.currentPostPeriod.to : (old.employEnd || ''),
          targetPostName: old.targetPostName || '',
          targetStart: old.targetPostPeriod ? old.targetPostPeriod.from : (old.targetStart || ''),
          targetEnd: old.targetPostPeriod ? old.targetPostPeriod.to : (old.targetEnd || ''),
          publicMethod: old.publicityMethod || old.publicMethod || '',
          publicStart: old.publicityPeriod ? old.publicityPeriod.from : (old.publicStart || ''),
          publicEnd: old.publicityPeriod ? old.publicityPeriod.to : (old.publicEnd || '')
        };
      }
      merged.push(sr);
      seenIds[sr.id] = true;
    });
    DEMO_RECORDS.forEach(function(dr) {
      if (!seenIds[dr.id]) { merged.push(dr); seenIds[dr.id] = true; }
    });
    return merged;
  } catch(e) {
    localStorage.removeItem('promote_records');
    return JSON.parse(JSON.stringify(DEMO_RECORDS));
  }
}

function saveRecords(records) {
  localStorage.setItem('promote_records', JSON.stringify(records));
}

function findRecord(id) {
  return loadRecords().find(function(r) { return r.id === id; }) || null;
}

function resetDemoData() {
  localStorage.removeItem('promote_records');
  location.reload();
}

// ===== HELPERS =====
function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
  return (bytes / 1048576).toFixed(1) + 'MB';
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatTime(t) {
  if (!t) return '—';
  return t.substring(0, 16);
}

// ===== PROGRESS STATE =====
function getProgressState(status) {
  // Returns array of states for 6 steps: 'done', 'current', 'rejected', 'pending'
  var steps = ['pending', 'pending', 'pending', 'pending', 'pending', 'pending'];

  function markDone(n) { for (var i = 0; i < n; i++) steps[i] = 'done'; }

  switch(status) {
    case 'pending_first':
      steps[0] = 'current';
      break;
    case 'first_approved':
      markDone(2); // 教师提交 + 学校一审 = done
      steps[1] = 'current'; // 当前在"学校一审"完成
      break;
    case 'first_rejected':
      steps[0] = 'done';
      steps[1] = 'rejected';
      break;
    case 'pending_second':
      markDone(2); // 教师提交 + 学校一审 done
      steps[2] = 'current'; // 主管部门二审
      break;
    case 'second_approved':
      markDone(3); // 教师提交 + 学校一审 + 主管部门二审 done
      steps[3] = 'current'; // 录入人社结果
      break;
    case 'second_rejected':
    case 'hr_rejected':
      markDone(2);
      steps[2] = 'rejected';
      break;
    case 'pending_third':
      markDone(4); // 教师提交 + 学校一审 + 主管部门二审 + 录入人社结果 done
      steps[4] = 'current'; // 主管部门三审
      break;
    case 'completed':
      markDone(6); // all done
      break;
  }

  return steps;
}

function getStatusBadgeClass(status) {
	if (status === 'pending_first' || status === 'pending_second' || status === 'pending_third') return 'pending';
	if (status === 'first_approved' || status === 'second_approved') return 'approved';
	if (status === 'first_rejected' || status === 'second_rejected' || status === 'hr_rejected' ) return 'rejected';
	if (status === 'completed') return 'completed';
	return 'pending';
}

// ===== RENDER PROGRESS =====
function renderProgress() {
  var states = getProgressState(record.status);
  var html = '<div class="progress-bar">';

  for (var i = 0; i < PROGRESS_STEPS.length; i++) {
    var s = states[i];
    var icon = '';
    if (s === 'done') icon = '✓';
    else if (s === 'rejected') icon = '✗';
    else icon = (i + 1);

    html += '<div class="step ' + s + '">';
    html += '<div class="step-dot">' + icon + '</div>';
    html += '<span class="step-text">' + PROGRESS_STEPS[i] + '</span>';
    html += '</div>';

    if (i < PROGRESS_STEPS.length - 1) {
      var lineClass = 'step-line';
      if (s === 'done') lineClass += ' done';
      else if (s === 'rejected') lineClass += ' rejected';
      html += '<div class="' + lineClass + '"></div>';
    }
  }

  html += '</div>';
  return html;
}

function getActions() {
  var s = record.status;
  var actions = [];

  function isMyJurisdiction() {
    var cat = record.district || '';
    if (currentRole === 'district') return cat === '鱼峰区属';
    if (currentRole === 'city') return cat === '市直属';
    return false;
  }

  // Teacher role actions
  if (currentRole === 'teacher') {
    if (s === 'first_rejected') {
      actions.push({ type: 'primary', label: '编辑重提', href: 'promote-form.html?id=' + record.id + '&mode=edit' });
    }
    if (s === 'completed') {
      actions.push({ type: 'outline', label: '下载PDF', onclick: 'showToast(\'下载功能演示\')' });
    }
    return actions;
  }

  // School role actions
  if (currentRole === 'school') {
    if (s === 'pending_first') {
      actions.push({ type: 'primary', label: '审核', href: 'promote-audit-school.html?id=' + record.id });
    }
    if (s === 'second_approved') {
      actions.push({ type: 'primary', label: '录入人社结果', href: 'promote-hr-entry.html?id=' + record.id });
    }
    if (s === 'second_rejected') {
      actions.push({ type: 'primary', label: '修改资料', href: 'promote-audit-school.html?id=' + record.id + '&mode=modify' });
    }
    if (s === 'completed') {
      actions.push({ type: 'outline', label: '下载PDF', onclick: 'showToast(\'下载功能演示\')' });
    }
    return actions;
  }

  // Admin role actions (city/district)
  if (currentRole === 'city' || currentRole === 'district') {
    if (!isMyJurisdiction() && s !== 'completed') {
      return [];
    }
    if (s === 'pending_third') {
      actions.push({ type: 'primary', label: '确认', href: 'promote-audit-third.html?id=' + record.id + '&role=' + currentRole });
    }
    if (s === 'completed') {
      actions.push({ type: 'outline', label: '下载PDF', onclick: 'showToast(\'下载功能演示\')' });
    }
    return actions;
  }

  // Fallback: completed action for any role
  if (s === 'completed') {
    actions.push({ type: 'outline', label: '下载PDF', onclick: 'showToast(\'下载功能演示\')' });
  }

  return actions;
}

// ===== RENDER TIMELINE =====
function renderTimeline() {
  var items = record.timeline || [];

  var html = '<div class="sidebar-card"><h4>申报履历</h4>';
  if (!items.length) {
    html += '<div style="color:var(--text-light);font-size:12px;">暂无记录</div>';
    html += '</div>';
    return html;
  }

  html += '<div class="timeline">';

  items.forEach(function(item) {
    var action = item.action || '';
    var actionType = 'submit';
    var tagHtml = '';

    if (action.indexOf('驳回') >= 0) {
      actionType = 'reject';
      tagHtml = '<span class="tlc-tag reject-reason">驳回</span>';
    } else if (action.indexOf('通过') >= 0 || action.indexOf('确认') >= 0) {
      actionType = 'approve';
      tagHtml = '<span class="tlc-tag approve-tag">通过</span>';
    } else if (action.indexOf('修改') >= 0 || action.indexOf('重提') >= 0) {
      actionType = 'resubmit';
      tagHtml = '<span class="tlc-tag resubmit-tag">修改</span>';
    }

    var desc = (item.operator || '');
    if (item.opinion) {
      desc += (desc ? '，意见：' : '意见：') + item.opinion;
    }
    if (record.firstRejectReason && action.indexOf('驳回') >= 0 && action.indexOf('学校') >= 0) {
      desc += (desc ? '，' : '') + '驳回原因：' + record.firstRejectReason;
    }
    if (record.secondRejectReason && action.indexOf('驳回') >= 0 && action.indexOf('主管') >= 0) {
      desc += (desc ? '，' : '') + '驳回原因：' + record.secondRejectReason;
    }

    html += '<div class="timeline-item">';
    html += '<div class="timeline-dot ' + actionType + '"></div>';
    html += '<div class="timeline-content">';
    html += '<div class="tlc-header">';
    html += '<span class="tlc-title">' + escapeHtml(action) + '</span>';
    html += '<span class="tlc-time">' + formatTime(item.time) + '</span>';
    if (tagHtml) html += tagHtml;
    html += '</div>';
    if (desc) html += '<div class="tlc-desc">' + escapeHtml(desc) + '</div>';
    html += '</div></div>';
  });

  html += '</div></div>';
  return html;
}

    return;
  }
  if (id === 'ledger') { var lr = (typeof currentUser!=='undefined'?currentUser.role:currentRole); window.location.href = (lr === 'city' || lr === 'district') ? 'org-ledger-admin.html' : lr === 'school' ? 'org-ledger-school.html' : 'workbench.html'; return; }


  else if (id === 'account') { window.location.href = 'account-management.html'; }

  else if (id === 'org') { window.location.href = 'org-management.html'; }
  showToast('跳转至：' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}

// ===== INIT =====
(function init() {
  var params = new URLSearchParams(window.location.search);
  recordId = params.get('id') || 'PR20260420001';
  var urlRole = params.get('role');

  if (urlRole === 'city' || urlRole === 'district' || urlRole === 'school' || urlRole === 'teacher') {
    currentRole = urlRole;
  }

  if (recordId) {
    record = findRecord(recordId);
  }

  renderSidebar();
  renderAll();
})();
</script>
