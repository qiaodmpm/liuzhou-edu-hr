<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>柳州教育人事管理平台 — 教师入编管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 12px; }
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column;
}
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }

/* Role Switcher */
.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
  margin-top: auto;
}
.role-switcher-label {
  font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;
  margin-bottom: 8px; padding: 0 4px;
}
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px);
}
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* ===== CONTENT STYLES ===== */
.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid #f0f2f5;
  font-weight: 600; font-size: 14px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px;
}
.filter-bar { padding: 14px 20px; border-bottom: 1px solid #f0f2f5; }
.filter-bar select {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-family: inherit;
}
.tab-bar {
  display: flex; gap: 8px; padding: 12px 20px 0 20px;
  flex-wrap: wrap; border-bottom: 1px solid var(--border);
}
.tab-btn {
  padding: 6px 16px; border-radius: 30px; font-size: 12px;
  cursor: pointer; background: var(--gray-bg); color: var(--text-secondary);
  border: none; font-family: inherit; transition: all 0.2s;
}
.tab-btn.active { background: var(--primary); color: #fff; }
.tab-count { margin-left: 6px; font-size: 11px; }

.data-table { padding: 0 20px 20px 20px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: center; padding: 10px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--text-secondary); font-weight: 600; background-color: #FAFBFC; }

.status-badge {
  padding: 4px 10px; border-radius: 30px; font-size: 11px; display: inline-block;
}
.status-submitted { background: #DBEAFE; color: #1E40AF; }
.status-pending { background: #FEF3C7; color: #B45309; }

.action-link {
  color: var(--accent); cursor: pointer; margin: 0 6px;
  font-size: 12px; display: inline-block;
}
.action-link:hover { text-decoration: underline; }

.batch-name-link {
  color: var(--primary); cursor: pointer; font-weight: 500;
}
.batch-name-link:hover { text-decoration: underline; }

.pagination {
  display: flex; justify-content: flex-end; gap: 6px; align-items: center;
  padding: 16px 20px; border-top: 1px solid #f0f2f5;
}
.page-btn {
  padding: 6px 12px; border: 1px solid var(--border);
  background: #fff; border-radius: 6px; cursor: pointer;
  font-size: 12px; font-family: inherit;
}
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center;
  justify-content: center; z-index: 1000;
}
.modal-container {
  background: #fff; border-radius: 16px; width: 500px;
  max-width: 90%; padding: 24px; box-shadow: var(--shadow-lg);
}
.modal-container h3 { margin-bottom: 16px; font-size: 16px; }
.modal-info { margin-top: 16px; }
.modal-info div { margin-bottom: 8px; font-size: 13px; }
.modal-buttons { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
.btn-cancel {
  background: var(--gray-bg); border: none; padding: 8px 20px;
  border-radius: 30px; font-size: 13px; cursor: pointer; font-family: inherit;
}

/* Toast */
.toast-msg {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px;
  border-radius: 40px; z-index: 2000; font-size: 13px;
  animation: toastAnim 1.8s ease forwards;
}
@keyframes toastAnim {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
  15% { opacity: 1; transform: translateX(-50%) translateY(0); }
  85% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
}
</style>
</head>

function renderSidebar() {
  var data = ROLES[currentRole].sidebar;
  var html = '';
  data.top.forEach(function(item) {
    html += '<a class="menu-item" onclick="sidebarClick(\'' + item.id + '\')">';
    html += ICONS[item.icon];
    html += '<span>' + item.label + '</span></a>';
  });
  data.groups.forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      var isActive = item.id === 'entry';
      html += '<a class="menu-item' + (isActive ? ' active' : '') + '" onclick="sidebarClick(\'' + item.id + '\')">';
      html += ICONS[MENU_ICONS[item.id] || 'home'];
      html += '<span>' + item.label + '</span></a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
}

function updateUserInfo() {
  var role = ROLES[currentRole];
  var roleLabel = currentRole === 'city' ? '市管理员' : currentRole === 'district' ? '区管理员' : currentRole === 'school' ? '校管理员' : '教师';
  var avatarEl = document.querySelector('.topnav-user .avatar');
  var nameEl = document.querySelector('.topnav-user span');
  if (avatarEl) avatarEl.textContent = role.short;
  if (nameEl) nameEl.textContent = role.name + ' · ' + roleLabel;
}

function switchRole(role) {
  if (role === 'city' || role === 'district') { window.location.href = '教师入编管理（主管单位视角）.html'; return; }
  if (role === 'school') { window.location.href = '教师入编管理（学校管理员视角）.html'; return; }
  if (role === 'teacher') { window.location.href = '教师入编管理（教师视角）.html'; return; }
}

function sidebarClick(id) {
  if (id === 'workbench') { window.location.href = 'workbench.html'; }
  else if (id === 'entry') { return; }
  else if (id === 'postset') { showToast('无权限访问', 'warning'); }
  else { showToast('跳转至：' + id); }
}

function showToast(message) {
  var toast = document.createElement('div');
  toast.className = 'toast-msg';
  toast.innerText = message;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 1800);
}

var currentPage = 1;

function getStatusCounts(year) {
  var filtered = entryBatches.filter(function(b) { return b.year === year; });
  return {
    全部: filtered.length,
    待申报: filtered.filter(function(b) { return b.userStatus === "待申报"; }).length,

    已申报: filtered.filter(function(b) { return b.userStatus === "已申报"; }).length
  };
}

function getFilteredBatches() {
  var filtered = entryBatches.filter(function(b) { return b.year === currentYear; });
  if (currentTab !== "全部") {
    filtered = filtered.filter(function(b) { return b.userStatus === currentTab; });
  }
  return filtered;
}

function showBatchDetailModal(batchId) {
  var batch = entryBatches.find(function(b) { return b.id === batchId; });
  if (!batch) return;
  var modalHtml =
    '<div class="modal-overlay" id="batchModal">' +
      '<div class="modal-container">' +
        '<h3>批次详情</h3>' +
        '<div class="modal-info">' +
          '<div><strong>批次名称：</strong> ' + batch.name + '</div>' +
          '<div><strong>批次编号：</strong> ' + batch.id + '</div>' +
          '<div><strong>发布时间：</strong> ' + batch.publishTime + '</div>' +
          '<div><strong>发布人：</strong> ' + batch.publisher + '</div>' +
          '<div><strong>申报开始时间：</strong> ' + batch.applyStart + '</div>' +
          '<div><strong>申报结束时间：</strong> ' + batch.applyEnd + '</div>' +
          '<div><strong>状态：</strong> ' + batch.status + '</div>' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="closeModalBtn">关闭</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById("closeModalBtn").onclick = function() { document.getElementById("batchModal").remove(); };
}

function renderPage() {
  var mainContent = document.getElementById("mainContent");
  var filtered = getFilteredBatches();
  var totalPages = Math.ceil(filtered.length / pageSize);
  var start = (currentPage - 1) * pageSize;
  var pageBatches = filtered.slice(start, start + pageSize);
  var counts = getStatusCounts(currentYear);

  var tableRows = pageBatches.map(function(batch, idx) {
    var statusClass = "";
    if (batch.userStatus === "已申报") statusClass = "status-submitted";
    else statusClass = "status-pending";
    var progressHtml = "";
    var actionsHtml = '<span class="action-link" onclick="handleView(\'' + batch.id + '\')">查看</span>';
    if (batch.userStatus !== "已申报") {
      actionsHtml += '<span class="action-link" onclick="handleApply(\'' + batch.id + '\')">申报</span>';
    }
    return '<tr>' +
      '<td>' + (start + idx + 1) + '</td>' +
      '<td><span class="batch-name-link" onclick="showBatchDetailModal(\'' + batch.id + '\')">' + batch.name + '</span></td>' +
      '<td>' + batch.id + '</td>' +
      '<td>' + batch.publishTime + '</td>' +
      '<td>' + batch.publisher + '</td>' +
      '<td>' + batch.applyStart + '</td>' +
      '<td>' + batch.applyEnd + '</td>' +
      '<td><span class="status-badge ' + statusClass + '">' + batch.userStatus + '</span>' + progressHtml + '</td>' +
      '<td>' + actionsHtml + '</td>' +
    '</tr>';
  }).join('');

  var tabs = ["全部", "待申报", "已申报"];
  var tabsHtml = tabs.map(function(tab) {
    return '<button class="tab-btn' + (currentTab === tab ? ' active' : '') + '" data-tab="' + tab + '">' +
      tab + '<span class="tab-count">(' + (counts[tab] || 0) + ')</span></button>';
  }).join('');

  var paginationHtml = '';
  if (totalPages > 1) {
    var pagesHtml = '';
    for (var i = 1; i <= totalPages; i++) {
      pagesHtml += '<button class="page-btn' + (currentPage === i ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
    }
    paginationHtml =
      '<div class="pagination">' +
        '<button class="page-btn" ' + (currentPage === 1 ? 'disabled' : '') + ' id="prevPage">上一页</button>' +
        pagesHtml +
        '<button class="page-btn" ' + (currentPage === totalPages ? 'disabled' : '') + ' id="nextPage">下一页</button>' +
      '</div>';
  }

  var fullHtml =
    '<div class="card">' +
      '<div class="card-header">教师入编批次</div>' +
      '<div class="filter-bar">' +
        '<select id="yearFilter">' +
          '<option value="2026"' + (currentYear === '2026' ? ' selected' : '') + '>2026年</option>' +
          '<option value="2025"' + (currentYear === '2025' ? ' selected' : '') + '>2025年</option>' +
        '</select>' +
      '</div>' +
      '<div class="tab-bar">' + tabsHtml + '</div>' +
      '<div class="data-table">' +
        '<table>' +
          '<thead><tr>' +
            '<th>序号</th><th>批次名称</th><th>批次编号</th><th>发布时间</th><th>发布人</th>' +
            '<th>申报开始时间</th><th>申报结束时间</th><th>申报状态</th><th>操作</th>' +
          '</tr></thead>' +
          '<tbody>' + (tableRows || '<tr><td colspan="9" style="text-align:center;">暂无数据</td></tr>') + '</tbody>' +
        '</table>' +
      '</div>' +
      paginationHtml +
    '</div>';

  mainContent.innerHTML = fullHtml;

  // Year filter
  document.getElementById("yearFilter").addEventListener('change', function(e) {
    currentYear = e.target.value;
    currentTab = "全部";
    currentPage = 1;
    renderPage();
  });

  // Tab clicks
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      currentTab = btn.dataset.tab;
      currentPage = 1;
      renderPage();
    });
  });

  // Pagination
  document.querySelectorAll('[data-page]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      currentPage = parseInt(e.target.dataset.page);
      renderPage();
    });
  });
  var prevBtn = document.getElementById("prevPage");
  if (prevBtn) prevBtn.addEventListener('click', function() { if (currentPage > 1) { currentPage--; renderPage(); } });
  var nextBtn = document.getElementById("nextPage");
  if (nextBtn) nextBtn.addEventListener('click', function() { if (currentPage < totalPages) { currentPage++; renderPage(); } });
}

window.handleView = function(batchId) {
  window.location.href = '教师入编详情-查看个人.html?batchId=' + batchId;
};
window.handleApply = function(batchId) {
  window.location.href = '教师申报入编.html?batchId=' + batchId;
};

// ===== Init =====
renderSidebar();
renderPage();
</script>
</body>
</html>
