<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top:0; left:0; right:0; height:56px; background:linear-gradient(135deg,#1E3A8A,#1E40AF); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display:flex; align-items:center; gap:14px; }
.topnav-logo { width:38px; height:38px; background:rgba(255,255,255,0.18); border-radius:10px; display:flex; align-items:center; justify-content:center; }
.topnav-logo svg { width:24px; height:24px; }
.topnav-title { font-size:17px; font-weight:600; color:#fff; letter-spacing:1px; }
.topnav-right { display:flex; align-items:center; gap:18px; }
.topnav-bell { position:relative; cursor:pointer; color:rgba(255,255,255,0.85); padding:6px; border-radius:6px; transition:var(--transition); }
.topnav-bell:hover { background:rgba(255,255,255,0.1); color:#fff; }
.topnav-bell .badge { position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.topnav-user { display:flex; align-items:center; gap:8px; cursor:pointer; color:rgba(255,255,255,0.9); padding:6px 12px; border-radius:6px; transition:var(--transition); font-size:13px; position:relative; }
.topnav-user:hover { background:rgba(255,255,255,0.1); }
.topnav-user .avatar { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
.user-dropdown { display:none; position:absolute; top:46px; right:0; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-lg); min-width:160px; z-index:200; overflow:hidden; }
.user-dropdown.show { display:block; }
.user-dropdown a { display:block; padding:12px 18px; font-size:13px; color:var(--text); text-decoration:none; transition:var(--transition); }
.user-dropdown a:hover { background:var(--primary-light); color:var(--primary); }
.user-dropdown .divider { height:1px; background:var(--border); margin:4px 0; }
.user-dropdown .logout { color:var(--danger); }
.sidebar { position:fixed; top:56px; left:0; bottom:0; width:var(--sidebar-w); background:#1E3A8A; z-index:90; overflow-y:auto; display:flex; flex-direction:column; transition:width var(--transition); }
.sidebar.collapsed { width:64px; }
.sidebar.collapsed .menu-label,.sidebar.collapsed .menu-group,.sidebar.collapsed .menu-badge,.sidebar.collapsed .role-switcher-label,.sidebar.collapsed .role-switcher-name { display:none; }
.sidebar.collapsed .menu-item { justify-content:center; padding:12px 0; }
.sidebar.collapsed .menu-icon { margin-right:0; }
.sidebar-menu { flex:1; padding:8px 0; }
.menu-group { padding:14px 20px 4px; font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; }
.menu-item { display:flex; align-items:center; padding:10px 20px; cursor:pointer; font-size:13px; font-weight:400; color:rgba(255,255,255,0.7); transition:var(--transition); position:relative; text-decoration:none; border-left:3px solid transparent; }
.menu-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
.menu-item.active { background:rgba(255,255,255,0.08); color:#fff; font-weight:500; border-left-color:var(--accent); }
.menu-item .menu-icon { width:18px; height:18px; margin-right:10px; flex-shrink:0; opacity:0.7; }
.menu-item.active .menu-icon { opacity:1; }
.menu-item .menu-badge { margin-left:auto; background:var(--danger); color:#fff; font-size:10px; padding:2px 7px; border-radius:10px; font-weight:600; }
.sidebar-bottom { border-top:1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display:flex; align-items:center; gap:8px; padding:10px 20px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.5); transition:var(--transition); }
.sidebar-toggle:hover { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.8); }
.sidebar-toggle svg { width:16px; height:16px; transition:transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform:rotate(180deg); }
.role-switcher { padding:10px 16px 12px; border-top:1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:1px; margin-bottom:8px; padding:0 4px; }
.role-switcher-options { display:flex; flex-direction:column; gap:4px; }
.role-switch-btn { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.55); transition:var(--transition); border:1px solid transparent; background:transparent; font-family:inherit; width:100%; text-align:left; }
.role-switch-btn:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.8); }
.role-switch-btn.active { background:rgba(59,130,246,0.2); color:#fff; border-color:rgba(59,130,246,0.4); font-weight:500; }
.role-switch-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.role-switch-dot.city { background:#3B82F6; }
.role-switch-dot.district { background:#F59E0B; }
.role-switch-dot.school { background:#10B981; }
.role-switch-dot.teacher { background:#A78BFA; }
.main { margin-left:var(--sidebar-w); margin-top:56px; padding:24px; min-height:calc(100vh - 56px); transition:margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left:64px; }
.breadcrumb { font-size:12px; color:var(--text-light); margin-bottom:16px; }
.breadcrumb a { color:var(--text-light); text-decoration:none; }
.breadcrumb a:hover { color:var(--primary); }
.breadcrumb span { color:var(--text-secondary); }
.page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.page-header h1 { font-size:20px; font-weight:700; }
.page-header .subtitle { font-size:12px; color:var(--text-light); margin-top:2px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; font-size:13px; font-weight:500; border-radius:6px; cursor:pointer; font-family:inherit; transition:var(--transition); border:1px solid transparent; text-decoration:none; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { background:var(--primary-dark); }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-outline { background:#fff; color:var(--text-secondary); border:1px solid var(--border); }
.btn-outline:hover { background:var(--gray-bg); }
.filter-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.filter-pill { padding:6px 16px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--border); background:#fff; color:var(--text-secondary); transition:var(--transition); font-family:inherit; }
.filter-pill:hover { border-color:var(--accent); color:var(--primary); }
.filter-pill.active { background:var(--primary); color:#fff; border-color:var(--primary); }
/* Table list */
.list-card { background:#fff; border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow-sm); overflow:hidden; }
.table-scroll { overflow-x:auto; }
.list-table { width:100%; border-collapse:collapse; font-size:13px; white-space:nowrap; }
.list-table th { padding:10px 12px; text-align:center; font-weight:600; font-size:11px; color:var(--text-secondary); background:#F8FAFC; border-bottom:1px solid var(--border); }
.list-table td { padding:8px 12px; border-bottom:1px solid var(--border); vertical-align:middle; text-align:center; }
.list-table tr:last-child td { border-bottom:none; }
.list-table tr:hover { background:#FAFBFC; }
.list-table .col-id { color:var(--primary); font-weight:500; cursor:pointer; }
.list-table .col-id:hover { text-decoration:underline; }
.list-table .col-name { text-align:left; font-weight:500; }
.list-table .col-left { text-align:left; }
.list-table .col-action { white-space:nowrap; }
.list-table .batch-line { font-size:12px; color:var(--text-secondary); line-height:1.6; text-align:left; }
.list-table .batch-line+.batch-line { border-top:1px dotted var(--border); padding-top:2px; margin-top:2px; }
.status-badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:500; }
.status-badge.pending { background:#FEF3C7; color:#92400E; }
.status-badge.approved { background:#D1FAE5; color:#065F46; }
.status-badge.completed { background:#E0E7FF; color:#3730A3; }
.status-badge.rejected { background:#FEE2E2; color:#991B1B; }
.type-tag { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:500; }
.type-tag.recruitment { background:#EFF6FF; color:var(--primary); }
.type-tag.transfer { background:#F3E8FF; color:#6B21A8; }
.action-links { display:flex; gap:8px; justify-content:center; }
.action-link { font-size:12px; color:var(--primary); cursor:pointer; text-decoration:none; white-space:nowrap; }
.action-link:hover { text-decoration:underline; }
.action-link.warn { color:var(--danger); }
.action-link.success { color:var(--success); }
.action-link.success:hover { text-decoration:underline; }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-light); }
.empty-state .empty-icon { font-size:40px; margin-bottom:12px; }
.empty-state .empty-text { font-size:14px; margin-bottom:16px; }
.school-filter { margin-bottom:16px; }
.school-filter select { padding:6px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; }
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#1E293B; color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:9999; animation:toastIn .3s ease; box-shadow:var(--shadow-lg); }
.toast.warning { background:var(--warning); color:#1E293B; }
.toast.success { background:var(--success); }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
</style>
</head>

function getStatusBadgeClass(status) {
  if (status==='pending_first'||status==='pending_second') return 'pending';
  if (status==='first_approved'||status==='completed') return 'approved';
  if (status==='first_rejected'||status==='second_rejected') return 'rejected';
  return '';
}

function getBatchNames(r) {
  if (r.businessType && r.businessType !== 'recruitment') return ['—'];
  var names = [], seen = {};
  // 从 formData.batchSummaries 提取（新格式）
  if (r.formData && r.formData.batchSummaries) {
    Object.keys(r.formData.batchSummaries).forEach(function(bid) {
      var n = r.formData.batchSummaries[bid].batchName;
      if (n && !seen[n]) { seen[n] = true; names.push(n); }
    });
  }
  // 从 positions 提取
  if (r.formData && r.formData.positions) {
    r.formData.positions.forEach(function(p) {
      if (p.batchName && !seen[p.batchName]) {
        seen[p.batchName] = true; names.push(p.batchName);
      }
    });
  }
  // 兼容旧数据：单批次字段
  if (names.length === 0 && r.recruitBatchName) {
    names.push(r.recruitBatchName);
  }
  return names.length > 0 ? names : ['—'];
}

function renderList(){
  var records = loadEmployRecords().filter(function(r){return r.schoolName===currentSchool;});
  var counts = { all:records.length, pending:0, approved:0, rejected:0 };
  records.forEach(function(r){
    if (r.status==='pending_first'||r.status==='pending_second') counts.pending++;
    else if (r.status==='first_approved'||r.status==='completed') counts.approved++;
    else if (r.status==='first_rejected'||r.status==='second_rejected') counts.rejected++;
  });

  var filters = [
    {key:'all',label:'全部('+counts.all+')'},
    {key:'pending',label:'待审核('+counts.pending+')'},
    {key:'approved',label:'已通过('+counts.approved+')'},
    {key:'rejected',label:'已驳回('+counts.rejected+')'}
  ];

  var fb = document.getElementById('filterBar');
  fb.innerHTML = '';
  filters.forEach(function(f){
    var b = document.createElement('button');
    b.className = 'filter-pill'+(currentFilter===f.key?' active':'');
    b.textContent = f.label;
    b.onclick = function(){currentFilter=f.key;renderList();};
    fb.appendChild(b);
  });

  var statusMap = {
    pending: ['pending_first','pending_second'],
    approved: ['first_approved','completed'],
    rejected: ['first_rejected','second_rejected']
  };
  var filtered = records;
  if (currentFilter!=='all' && statusMap[currentFilter]) {
    filtered = records.filter(function(r){ return statusMap[currentFilter].indexOf(r.status) >= 0; });
  }

  var list = document.getElementById('recordList');
  var empty = document.getElementById('emptyState');
  if(filtered.length===0){
    list.innerHTML='<div class="list-card"><div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无申报记录</div></div></div>';
    empty.style.display='none';
    return;
  }
  empty.style.display='none';

  var h = '<div class="list-card"><div class="table-scroll"><table class="list-table"><thead><tr>';
  h += '<th>申请编号</th>';
  h += '<th>业务类型</th>';
  h += '<th>关联批次</th>';
  h += '<th>岗位数</th>';
  h += '<th>人数</th>';
  h += '<th>提交时间</th>';
  h += '<th>状态</th>';
  h += '<th>操作</th>';
  h += '</tr></thead><tbody>';

  filtered.forEach(function(r){
    var typeLabel = r.businessType==='recruitment'?'招聘':(r.businessType==='transfer'?'调动':(r.persons?'招聘':'调动'));
    var typeCls = r.businessType||(r.persons?'recruitment':'');
    var statusLabel = STATUS_MAP[r.status]||r.status;
    var badgeCls = getStatusBadgeClass(r.status);
    var batchNames = getBatchNames(r);
    var posCount = (r.businessType==='recruitment'&&r.formData&&r.formData.positions) ? r.formData.positions.length : (r.persons?r.persons.length:'—');
    var personCount = '—';
    if(r.formData){
      if(r.businessType==='recruitment'&&r.formData.positions){
        personCount = r.formData.positions.reduce(function(s,p){return s+(p.rosterRows||[]).length;},0);
      } else if(r.businessType==='transfer'&&r.formData.transferRows){
        personCount = r.formData.transferRows.length;
      }
    }
    if(personCount==='—'&&r.persons){personCount=r.persons.length;}
    var timeStr = r.submitTime ? r.submitTime.substring(5,16) : '—';

    h += '<tr>';
    h += '<td class="col-id" onclick="viewDetail(\''+r.id+'\')">'+escapeHtml(r.id)+'</td>';
    h += '<td><span class="type-tag '+typeCls+'">'+typeLabel+'</span></td>';
    h += '<td class="col-left">';
    batchNames.forEach(function(n, i) {
      h += '<div class="batch-line">'+escapeHtml(n)+'</div>';
    });
    h += '</td>';
    h += '<td>'+posCount+'</td>';
    h += '<td>'+personCount+'</td>';
    h += '<td style="font-size:12px;">'+timeStr+'</td>';
    h += '<td><span class="status-badge '+badgeCls+'">'+statusLabel+'</span></td>';
    h += '<td class="col-action"><div class="action-links">';
    h += '<a class="action-link" onclick="viewDetail(\''+r.id+'\')">查看</a>';
    if(r.status==='first_approved'){h+='<a class="action-link success" onclick="gotoHREntry(\''+r.id+'\')">录入</a>';}
    if(r.status==='first_rejected'||r.status==='second_rejected'){h+='<a class="action-link warn" onclick="editResubmit(\''+r.id+'\')">修改</a>';}
    h += '</div></td>';
    h += '</tr>';
  });

  h += '</tbody></table></div></div>';
  list.innerHTML = h;
}
