<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>柳州教育人事管理平台 — 教师入编管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 12px; }
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column;
}
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }

/* Role Switcher */
.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
  margin-top: auto;
}
.role-switcher-label {
  font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;
  margin-bottom: 8px; padding: 0 4px;
}
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px);
}

.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* ===== CONTENT: Two-Column Layout ===== */
.two-column-layout { display: flex; gap: 24px; }
.left-panel { width: 320px; flex-shrink: 0; }
.right-panel { flex: 1; min-width: 0; }

.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid #f0f2f5;
  font-weight: 600; font-size: 14px;
  display: flex; justify-content: space-between; align-items: center;
}
.batch-filter { padding: 14px 20px; border-bottom: 1px solid #f0f2f5; }
.batch-filter select {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-family: inherit;
}
.batch-list { max-height: 460px; overflow-y: auto; }
.batch-item {
  padding: 14px 20px; border-bottom: 1px solid #f0f2f5;
  cursor: pointer; transition: 0.15s;
}
.batch-item:hover { background-color: #F8FAFC; }
.batch-item.active {
  background-color: #EFF6FF; border-left: 3px solid var(--primary);
}
.batch-name {
  font-weight: 600; font-size: 13px; margin-bottom: 6px;
  cursor: pointer; color: var(--primary);
}
.batch-name:hover { text-decoration: underline; }
.batch-meta { font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; }
.batch-progress { font-size: 11px; color: var(--primary); }

/* Tab bar */
.tab-bar {
  display: flex; gap: 8px; padding: 12px 20px 0 20px;
  flex-wrap: wrap; border-bottom: 1px solid var(--border);
}
.tab-btn {
  padding: 6px 16px; border-radius: 30px; font-size: 12px;
  cursor: pointer; background: var(--gray-bg); color: var(--text-secondary);
  border: none; font-family: inherit; transition: all 0.2s;
}
.tab-btn.active { background: var(--primary); color: #fff; }
.tab-count { margin-left: 6px; font-size: 11px; }

/* Data table */
.data-table { padding: 0 20px 20px 20px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: center; padding: 10px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--text-secondary); font-weight: 600; background-color: #FAFBFC; }

.status-badge {
  padding: 4px 10px; border-radius: 30px; font-size: 11px; display: inline-block;
}
.status-pending { background: #FEF3C7; color: #B45309; }
.status-approved { background: #D1FAE5; color: #065F46; }
.status-rejected { background: #FEE2E2; color: #991B1B; }
.action-link {
  color: var(--accent); cursor: pointer; margin: 0 4px;
  font-size: 12px; display: inline-block;
}
.action-link:hover { text-decoration: underline; }

/* Footer bar */
.list-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-top: 1px solid #f0f2f5;
}
.btn-export {
  background: var(--gray-bg); border: 1px solid var(--border);
  padding: 6px 16px; border-radius: 30px; font-size: 12px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  font-family: inherit;
}
.btn-export:hover { background: #E2E8F0; }
.btn-batch {
  background: var(--primary); color: #fff; border: none;
  padding: 6px 16px; border-radius: 30px; font-size: 12px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  font-family: inherit;
}
.btn-batch:hover { background: var(--primary-dark); }

/* Pagination */
.pagination { display: flex; gap: 6px; align-items: center; }
.page-btn {
  padding: 6px 12px; border: 1px solid var(--border);
  background: #fff; border-radius: 6px; cursor: pointer;
  font-size: 12px; font-family: inherit;
}
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center;
  justify-content: center; z-index: 1000;
}
.modal-container {
  background: #fff; border-radius: 16px; width: 500px;
  max-width: 90%; padding: 24px; box-shadow: var(--shadow-lg);
}
.modal-container h3 { margin-bottom: 16px; font-size: 16px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 500;
  margin-bottom: 4px; color: var(--text);
}
.form-group select {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-family: inherit;
}
.readonly-field {
  background: #F8FAFC; padding: 8px 12px; border-radius: var(--radius);
  font-size: 13px; color: var(--text-secondary);
}
.batch-check-list {
  max-height: 300px; overflow-y: auto; margin: 16px 0;
  border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;
}
.check-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px; border-bottom: 1px solid #edf2f7;
}
.check-item:last-child { border-bottom: none; }
.modal-buttons {
  display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;
}
.btn-cancel {
  background: var(--gray-bg); border: none; padding: 8px 20px;
  border-radius: 30px; font-size: 13px; cursor: pointer; font-family: inherit;
}
.btn-primary-sm {
  background: var(--primary); color: #fff; border: none;
  padding: 8px 20px; border-radius: 30px; font-size: 13px; cursor: pointer;
  font-family: inherit;
}

/* Toast */
.toast-msg {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px;
  border-radius: 40px; z-index: 2000; font-size: 13px;
  animation: toastAnim 1.8s ease forwards;
}
@keyframes toastAnim {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
  15% { opacity: 1; transform: translateX(-50%) translateY(0); }
  85% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
}
</style>
</head>

function renderSidebar() {
  var data = ROLES[currentRole].sidebar;
  var html = '';
  data.top.forEach(function(item) {
    html += '<a class="menu-item" onclick="sidebarClick(\'' + item.id + '\')">';
    html += ICONS[item.icon];
    html += '<span>' + item.label + '</span></a>';
  });
  data.groups.forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      var isActive = item.id === 'entry';
      html += '<a class="menu-item' + (isActive ? ' active' : '') + '" onclick="sidebarClick(\'' + item.id + '\')">';
      html += ICONS[MENU_ICONS[item.id] || 'file'];
      html += '<span>' + item.label + '</span></a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
}

function updateUserInfo() {
  var role = ROLES[currentRole];
  var roleLabel = currentRole === 'city' ? '市管理员' : currentRole === 'district' ? '区管理员' : currentRole === 'school' ? '校管理员' : '教师';
  var avatarEl = document.querySelector('.topnav-user .avatar');
  var nameEl = document.querySelector('.topnav-user span');
  if (avatarEl) avatarEl.textContent = role.short;
  if (nameEl) nameEl.textContent = role.name + ' · ' + roleLabel;
}

function switchRole(role) {
  currentRole = role;
  renderSidebar();
  updateUserInfo();
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === role);
  });
}

function sidebarClick(id) {
  if (id === 'workbench') { window.location.href = 'workbench.html'; }
  else if (id === 'staffing') { window.location.href = 'staffing-application.html'; }
  else if (id === 'entry') { return; } // current page
  else { showToast('跳转至：' + id); }
}

function showToast(message) {
  var toast = document.createElement('div');
  toast.className = 'toast-msg';
  toast.innerText = message;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 1800);
}

var currentBatchId = "EB2026-001";

function getCurrentApplicants() {
  var apps = applicantsData[currentBatchId] || [];
  if (currentTab !== "全部") {
    apps = apps.filter(function(a) { return a.status === currentTab; });
  }
  return apps;
}

function getStatusCounts() {
  var apps = applicantsData[currentBatchId] || [];
  return {
    全部: apps.length,
    待审批: apps.filter(function(a) { return a.status === "待审批"; }).length,
    已通过: apps.filter(function(a) { return a.status === "已通过"; }).length,
    已驳回: apps.filter(function(a) { return a.status === "已驳回"; }).length
  };
}

function showBatchDetailModal(batchId) {
  var batch = batches.find(function(b) { return b.id === batchId; });
  if (!batch) return;
  var modalHtml =
    '<div class="modal-overlay" id="batchDetailModal">' +
      '<div class="modal-container">' +
        '<h3>批次详情</h3>' +
        '<div class="form-group"><label>批次名称</label><div class="readonly-field">' + batch.name + '</div></div>' +
        '<div class="form-group"><label>批次编号</label><div class="readonly-field">' + batch.id + '</div></div>' +
        '<div class="form-group"><label>发布时间</label><div class="readonly-field">' + batch.createdAt + '</div></div>' +
        '<div class="form-group"><label>申报开始时间</label><div class="readonly-field">' + batch.applyStart + '</div></div>' +
        '<div class="form-group"><label>申报结束时间</label><div class="readonly-field">' + batch.applyEnd + '</div></div>' +
        '<div class="form-group"><label>审核开始时间</label><div class="readonly-field">' + batch.reviewStart + '</div></div>' +
        '<div class="form-group"><label>审核结束时间</label><div class="readonly-field">' + batch.reviewEnd + '</div></div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="closeModalBtn">关闭</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById("closeModalBtn").onclick = function() { document.getElementById("batchDetailModal").remove(); };
}

function renderPage() {
  var mainContent = document.getElementById("mainContent");
  var year = document.getElementById("batchYearFilter") ? document.getElementById("batchYearFilter").value : "2026";
  var filteredBatches = batches.filter(function(b) { return b.year === year; });
  var counts = getStatusCounts();

  var batchListHtml = filteredBatches.map(function(b) {
    var progress = b.submitted + "/" + b.total;
    var isActive = currentBatchId === b.id ? " active" : "";
    return '<div class="batch-item' + isActive + '" data-id="' + b.id + '">' +
      '<div class="batch-name" onclick="event.stopPropagation(); showBatchDetailModal(\'' + b.id + '\')">' + b.name + '</div>' +
      '<div class="batch-meta">' + b.id + ' | ' + b.createdAt.split(' ')[0] + '</div>' +
      '<div class="batch-progress">申报进度：' + progress + '</div>' +
    '</div>';
  }).join('');

  var tabs = ["全部", "待审批", "已通过", "已驳回"];
  var tabsHtml = tabs.map(function(tab) {
    return '<button class="tab-btn' + (currentTab === tab ? ' active' : '') + '" data-tab="' + tab + '">' +
      tab + '<span class="tab-count">(' + (counts[tab] || 0) + ')</span></button>';
  }).join('');

  var applicants = getCurrentApplicants();
  var start = (currentPage - 1) * pageSize;
  var pageApps = applicants.slice(start, start + pageSize);
  var totalPages = Math.ceil(applicants.length / pageSize);

  var tableRows = pageApps.map(function(app, idx) {
    var statusClass = "";
    if (app.status === "待审批") statusClass = "status-pending";
    else if (app.status === "已通过") statusClass = "status-approved";
    else statusClass = "status-rejected";
    var actionHtml = app.status === "待审批"
      ? '<span class="action-link" onclick="handleApprove(' + app.id + ')">审批</span><span class="action-link" onclick="handleView(' + app.id + ')">查看</span>'
      : '<span class="action-link" onclick="handleView(' + app.id + ')">查看</span>';
    return '<tr>' +
      '<td>' + (start + idx + 1) + '</td>' +
      '<td>' + app.name + '</td>' +
      '<td>' + app.gender + '</td>' +
      '<td>' + app.idCard + '</td>' +
      '<td>' + app.position + '</td>' +
      '<td>' + app.method + '</td>' +
      '<td>' + app.docNumber + '</td>' +
      '<td>' + app.reason + '</td>' +
      '<td><span class="status-badge ' + statusClass + '">' + app.status + '</span></td>' +
      '<td>' + app.applyTime + '</td>' +
      '<td>' + actionHtml + '</td>' +
    '</tr>';
  }).join('');

  var paginationHtml = '';
  if (totalPages > 1) {
    var pagesHtml = '';
    for (var i = 1; i <= totalPages; i++) {
      pagesHtml += '<button class="page-btn' + (currentPage === i ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
    }
    paginationHtml =
      '<div class="pagination">' +
        '<button class="page-btn" ' + (currentPage === 1 ? 'disabled' : '') + ' id="prevPage">上一页</button>' +
        pagesHtml +
        '<button class="page-btn" ' + (currentPage === totalPages ? 'disabled' : '') + ' id="nextPage">下一页</button>' +
      '</div>';
  }

  var fullHtml =
    '<div class="two-column-layout">' +
      '<div class="left-panel">' +
        '<div class="card">' +
          '<div class="card-header">入编批次</div>' +
          '<div class="batch-filter">' +
            '<select id="batchYearFilter">' +
              '<option value="2026"' + (year === '2026' ? ' selected' : '') + '>2026年</option>' +
              '<option value="2025"' + (year === '2025' ? ' selected' : '') + '>2025年</option>' +
            '</select>' +
          '</div>' +
          '<div class="batch-list" id="batchList">' + batchListHtml + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="right-panel">' +
        '<div class="card">' +
          '<div class="card-header">申请列表</div>' +
          '<div class="tab-bar">' + tabsHtml + '</div>' +
          '<div class="data-table">' +
            '<table>' +
              '<thead><tr>' +
                '<th>序号</th><th>申请人</th><th>性别</th><th>身份证号</th><th>拟入编岗位</th>' +
                '<th>入编方式</th><th>依据文号</th><th>申请理由</th><th>状态</th><th>申请时间</th><th>操作</th>' +
              '</tr></thead>' +
              '<tbody>' + (tableRows || '<tr><td colspan="11" style="text-align:center;">暂无数据</td></tr>') + '</tbody>' +
            '</table>' +
          '</div>' +
          '<div class="list-footer">' +
            '<button class="btn-export" id="exportBtn">导出增人备案表</button>' +
            '<div style="display:flex;align-items:center;gap:16px;">' +
              paginationHtml +
              '<button class="btn-batch" id="batchSubmitBtn">批量提交</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  mainContent.innerHTML = fullHtml;

  // Bind batch item clicks
  document.querySelectorAll('.batch-item').forEach(function(el) {
    el.addEventListener('click', function(e) {
      if (e.target.classList.contains('batch-name')) return;
      currentBatchId = el.dataset.id;
      currentTab = "全部";
      currentPage = 1;
      renderPage();
    });
  });

  // Year filter
  var yearSelect = document.getElementById("batchYearFilter");
  yearSelect.addEventListener('change', function() {
    var newYear = yearSelect.value;
    var firstBatch = batches.find(function(b) { return b.year === newYear; });
    if (firstBatch) currentBatchId = firstBatch.id;
    currentTab = "全部";
    currentPage = 1;
    renderPage();
  });

  // Tab clicks
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      currentTab = btn.dataset.tab;
      currentPage = 1;
      renderPage();
    });
  });

  // Page clicks
  document.querySelectorAll('[data-page]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      currentPage = parseInt(e.target.dataset.page);
      renderPage();
    });
  });

  var prevBtn = document.getElementById("prevPage");
  if (prevBtn) prevBtn.addEventListener('click', function() { if (currentPage > 1) { currentPage--; renderPage(); } });
  var nextBtn = document.getElementById("nextPage");
  if (nextBtn) nextBtn.addEventListener('click', function() { if (currentPage < totalPages) { currentPage++; renderPage(); } });

  // Export
  document.getElementById("exportBtn").addEventListener('click', exportToExcel);
  // Batch submit
  document.getElementById("batchSubmitBtn").addEventListener('click', showBatchSubmitModal);
}

function exportToExcel() {
  var applicants = getCurrentApplicants();
  if (applicants.length === 0) {
    showToast("暂无数据可导出");
    return;
  }
  var wsData = [
    ["序号", "申请人", "性别", "身份证号", "拟入编岗位", "入编方式", "依据文号", "申请理由", "状态", "申请时间"]
  ];
  applicants.forEach(function(app, idx) {
    wsData.push([idx + 1, app.name, app.gender, app.idCard, app.position, app.method, app.docNumber, app.reason, app.status, app.applyTime]);
  });
  var ws = XLSX.utils.aoa_to_sheet(wsData);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "教师入编申请");
  XLSX.writeFile(wb, "教师入编申请_" + currentBatchId + ".xlsx");
  showToast("导出成功");
}

function showBatchSubmitModal() {
  var pendingApps = getCurrentApplicants().filter(function(app) { return app.status === "待审批"; });
  if (pendingApps.length === 0) {
    showToast("当前批次没有待审批的申请");
    return;
  }
  var modalHtml =
    '<div class="modal-overlay" id="batchModal">' +
      '<div class="modal-container">' +
        '<h3>批量提交审核</h3>' +
        '<div class="batch-check-list" id="batchCheckList">' +
          pendingApps.map(function(app) {
            return '<div class="check-item"><input type="checkbox" class="batch-checkbox" data-id="' + app.id + '" checked> <span>' + app.name + ' - ' + app.position + '</span></div>';
          }).join('') +
        '</div>' +
        '<div class="form-group">' +
          '<label>控制数类型 <span style="color:red;">*</span></label>' +
          '<select id="controlType">' +
            '<option value="">请选择</option>' +
            '<option value="中小学校聘用教师控制数">中小学校聘用教师控制数</option>' +
            '<option value="中职中专学校教职人员控制数">中职中专学校教职人员控制数</option>' +
            '<option value="高等职业学校教职人员控制数">高等职业学校教职人员控制数</option>' +
            '<option value="公立医院聘用人员控制数">公立医院聘用人员控制数</option>' +
          '</select>' +
        '</div>' +
        '<div class="modal-buttons">' +
          '<button class="btn-cancel" id="cancelBatch">取消</button>' +
          '<button class="btn-primary-sm" id="confirmBatch">确定提交</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById("cancelBatch").onclick = function() { document.getElementById("batchModal").remove(); };
  document.getElementById("confirmBatch").onclick = function() {
    var controlType = document.getElementById("controlType").value;
    if (!controlType) { showToast("请选择控制数类型"); return; }
    var selectedIds = [];
    document.querySelectorAll('.batch-checkbox:checked').forEach(function(cb) {
      selectedIds.push(parseInt(cb.dataset.id));
    });
    if (selectedIds.length === 0) { showToast("请至少选择一项"); return; }
    var allApps = applicantsData[currentBatchId] || [];
    selectedIds.forEach(function(id) {
      var app = allApps.find(function(a) { return a.id === id; });
      if (app) app.status = "已通过";
    });
    document.getElementById("batchModal").remove();
    showToast("已提交" + selectedIds.length + "条数据");
    renderPage();
  };
}

window.handleView = function(appId) {
  showToast("查看教师入编个人详情，申请ID：" + appId);
};
window.handleApprove = function(appId) {
  showToast("审核教师入编申请，申请ID：" + appId);
};

// ===== Init =====
renderSidebar();
renderPage();
