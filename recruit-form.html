<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招聘岗位申报 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; transition: var(--transition); font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }
.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; display: flex; flex-direction: column; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label, .sidebar.collapsed .menu-group, .sidebar.collapsed .menu-badge, .sidebar.collapsed .role-switcher-label, .sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7); transition: var(--transition); position: relative; text-decoration: none; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }
.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px; min-height: calc(100vh - 56px); transition: margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }
.page-header { margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-outline { padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 6px; background: #fff; color: var(--text-secondary); border: 1px solid var(--border); cursor: pointer; font-family: inherit; }
.btn-outline:hover { background: var(--gray-bg); }
.btn-danger { background: var(--danger); color: #fff; border: none; }
.btn-danger:hover { background: #DC2626; }

/* Form card */
.form-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 28px 32px; margin-bottom: 20px; }
.form-card h2, .form-card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.form-card h2 .card-icon { width: 28px; height: 28px; background: var(--primary-light); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
.form-group label .req { color: var(--danger); }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
.form-group textarea { resize: vertical; min-height: 50px; }
.form-group input[readonly] { background: var(--bg); color: var(--text-secondary); cursor: not-allowed; }
.form-row { display: flex; gap: 16px; }
.form-row .form-group { flex: 1; }
.form-row-3 { display: flex; gap: 12px; }
.form-row-3 .form-group { flex: 1; }

/* Batch select */
.batch-select-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 24px; margin-bottom: 20px; }
.batch-select-card label { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-right: 12px; }
.batch-select-card select { padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; min-width: 320px; font-family: inherit; }
.batch-info { margin-top: 10px; padding: 10px 14px; background: var(--primary-light); border-radius: 6px; font-size: 12px; color: var(--primary); display: none; }
.batch-info.show { display: block; }

/* Position card */
.position-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; background: #FAFBFC; position: relative; }
.position-card .pos-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.position-card .pos-title { font-size: 14px; font-weight: 600; }
.position-card .pos-remove { font-size: 12px; color: var(--danger); cursor: pointer; padding: 4px 10px; border: 1px solid var(--danger); border-radius: 4px; background: #fff; }
.position-card .pos-remove:hover { background: #FEF2F2; }
.position-card .field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 16px; }
.position-card .field-grid.cols2 { grid-template-columns: repeat(2, 1fr); }
.position-card .field-grid.cols4 { grid-template-columns: repeat(4, 1fr); }
.position-card .field-grid .full-width { grid-column: 1 / -1; }
.position-card .field-grid .col-span2 { grid-column: span 2; }

.add-position-bar { text-align: center; padding: 12px; border: 1px dashed var(--border); border-radius: var(--radius); cursor: pointer; color: var(--primary); font-size: 13px; margin-bottom: 20px; transition: var(--transition); }
.add-position-bar:hover { background: var(--primary-light); border-color: var(--primary); }

/* Quota warning */
.quota-banner { padding: 12px 16px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
.quota-banner.warn { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
.quota-banner.ok { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
.quota-banner.error { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }

/* File upload */
.upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 28px; text-align: center; cursor: pointer; margin-bottom: 12px; transition: var(--transition); }
.upload-area:hover { border-color: var(--accent); background: var(--primary-light); }
.upload-area .upload-icon { font-size: 28px; margin-bottom: 8px; }
.upload-area .upload-text { font-size: 13px; color: var(--text-secondary); }
.upload-area .upload-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.file-list { margin-bottom: 12px; }
.file-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 6px; font-size: 12px; background: #fff; }
.file-item .file-name { color: var(--text); flex: 1; }
.file-item .file-size { color: var(--text-light); margin: 0 16px; }
.file-item .file-remove { color: var(--danger); cursor: pointer; font-size: 11px; }

/* Submit bar */
.submit-bar { display: flex; justify-content: flex-end; gap: 12px; padding-top: 8px; }
.quota-summary { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 16px; }

.card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 28px 32px; margin-bottom: 20px; }
.card-title { font-size: 15px; font-weight: 600; color: var(--text); padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease; box-shadow: var(--shadow-lg); }
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Staffing batch widget */
.sbw-trigger { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; background: #fff; min-height: 38px; }
.sbw-trigger:hover { border-color: var(--accent); }
.sbw-trigger .placeholder { color: var(--text-light); }
.sbw-trigger .arrow { transition: transform var(--transition); }
.sbw-trigger .arrow.open { transform: rotate(180deg); }
.sbw-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.sbw-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--primary-light); border: 1px solid var(--primary); border-radius: 4px; font-size: 11px; color: var(--primary); }
.sbw-tag .tag-close { cursor: pointer; font-size: 14px; line-height: 1; color: var(--primary); opacity: 0.6; }
.sbw-tag .tag-close:hover { opacity: 1; }
.sbw-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow-lg); z-index: 100; max-height: 220px; overflow-y: auto; margin-top: 4px; }
.sbw-dropdown.show { display: block; }
.sbw-option { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 12px; border-bottom: 1px solid var(--border); transition: var(--transition); }
.sbw-option:last-child { border-bottom: none; }
.sbw-option:hover { background: var(--primary-light); }
.sbw-option .sbw-cb { width: 16px; height: 16px; accent-color: var(--primary); }
.sbw-option .sbw-name { font-weight: 500; color: var(--text); }
.sbw-option .sbw-type-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 500; }
.sbw-option .sbw-type-tag.career { background: #DBEAFE; color: #1E40AF; }
.sbw-option .sbw-type-tag.control { background: #FEF3C7; color: #92400E; }
.sbw-option .sbw-meta { color: var(--text-light); font-size: 11px; margin-left: auto; white-space: nowrap; }
.sbw-stats { display: flex; gap: 16px; padding: 6px 10px; background: #F8FAFC; border-radius: 4px; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; flex-wrap: wrap; }
.sbw-stats span { white-space: nowrap; }
.sbw-stats b { color: var(--text); }
.sbw-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 6px; }
.sbw-table th { background: var(--gray-bg); color: var(--text-secondary); text-align: left; padding: 4px 6px; border: 1px solid var(--border); font-weight: 600; white-space: nowrap; }
.sbw-table td { padding: 4px 6px; border: 1px solid var(--border); color: var(--text); white-space: nowrap; }
.sbw-table input[type="number"] { width: 84px; }
.sbw-dd-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.sbw-dd-table th { position: sticky; top: 0; z-index: 1; background: var(--gray-bg); color: var(--text-secondary); text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); font-weight: 600; white-space: nowrap; }
.sbw-dd-table td { padding: 5px 6px; border-bottom: 1px solid var(--border); color: var(--text); white-space: nowrap; }
.sbw-dd-table td.num, .sbw-dd-table th.num { text-align: right; }
.sbw-dd-row { cursor: pointer; transition: var(--transition); }
.sbw-dd-row:hover { background: var(--primary-light); }
.sbw-dd-row:last-child td { border-bottom: none; }

/* Access denied */
.access-denied { text-align: center; padding: 80px 20px; }
.access-denied .denied-icon { font-size: 64px; margin-bottom: 20px; color: var(--text-light); }
.access-denied h2 { font-size: 20px; margin-bottom: 8px; color: var(--text-secondary); }
.access-denied p { font-size: 14px; color: var(--text-light); margin-bottom: 24px; }

/* Edit mode two-column layout */
.edit-layout { display: flex; gap: 24px; align-items: flex-start; }
.edit-main { flex: 1; min-width: 0; }
.edit-side { width: 320px; flex-shrink: 0; }
.side-history {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px;
  position: sticky; top: 76px;
}
.side-history h4 { font-size: 13px; font-weight: 600; margin-bottom: 14px; }
.timeline { position: relative; padding-left: 20px; }
.timeline::before {
  content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px;
  width: 2px; background: var(--border);
}
.timeline-item { position: relative; padding-bottom: 16px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before {
  content: ''; position: absolute; left: -17px; top: 4px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--border);
}
.timeline-item.reject::before { background: var(--danger); }
.timeline-item .tl-time { font-size: 11px; color: var(--text-light); }
.timeline-item .tl-action { font-size: 12px; font-weight: 500; margin-top: 2px; }
.timeline-item .tl-operator { font-size: 11px; color: var(--text-secondary); }
.timeline-item .tl-opinion {
  font-size: 12px; color: var(--danger); margin-top: 4px;
  padding: 6px 10px; background: #FEF2F2; border-radius: 4px;
  line-height: 1.5;
}
@media (max-width: 900px) {
  .edit-layout { flex-direction: column; }
  .edit-side { width: 100%; }
}
</style>
</head>

  </div>

<main class="main" id="mainContent">
  <div class="breadcrumb">
    <a href="workbench.html">首页</a> &nbsp;/&nbsp; <span>招聘岗位申报</span>
    <span id="schoolSwitcher" style="margin-left:16px;"></span>
  </div>

  <div class="page-header">

// 只展示「未用完且有效」的计划，并展示使用形式（不同批次类型只能使用同一类型的编制）
// 列表字段：来源、批复文号/批次、使用形式、未使用、有效期、状态
var LEDGER_STATUS_LABEL = { active: '有效', exhausted: '已用完', expiring_occupied: '过期·有占用', expired: '已到期' };
var LEDGER_STATUS_COLOR = { active: '#10B981', exhausted: '#94A3B8', expiring_occupied: '#F59E0B', expired: '#EF4444' };

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function getLedgerForSchool(schoolName) {
  var s = localStorage.getItem('org_ledger');
  if (!s) return null;
  try { return (JSON.parse(s) || {})[schoolName] || null; } catch (e) { return null; }
}

function getLedgerPlans(schoolName, type) {
  var d = getLedgerForSchool(schoolName);
  if (!d) return [];
  if (type === 'control') return d.controlPlans || [];
  return d.careerPlans || [];
}

function ledgerRemaining(plan) {
  return Math.max(0, (plan.approvedCount || 0) - (plan.occupiedCount || 0) - (plan.usedCount || 0));
}

function ledgerPlanStatus(plan) {
  var adj = plan.approvedCount || 0;
  var occupied = plan.occupiedCount || 0;
  var used = plan.usedCount || 0;
  var remain = adj - occupied - used;
  var ref = todayStr();
  if (remain <= 0 && adj > 0) return 'exhausted';
  if (plan.validEnd && plan.validEnd < ref && occupied > 0) return 'expiring_occupied';
  if (plan.validEnd && plan.validEnd < ref) return 'expired';
  return 'active';
}

function planDocLabel(plan) {
  if (plan.source === 'online') return plan.sourceBatchId || plan.sourceSubmissionId || plan.id;
  return plan.offlineDocNo || plan.id;
}

// 使用形式（编制批次使用类型）— 与编制岗位台账 useTypes 对齐（6 种）
// 不同批次类型的岗位只能使用同一类型的编制，故下拉列表需展示并过滤使用形式
var LEDGER_USE_TYPE_KEYS = ['publicRecruit', 'selfRecruit', 'talentMid', 'talentHigh', 'transfer', 'other'];
var LEDGER_USE_TYPE_LABELS = {
  publicRecruit: '统一公开招聘',
  selfRecruit: '自主实施招聘',

  talentHigh: '引进高层次人才',
  transfer: '调动',

};

var RECRUIT_TO_LEDGER_USE_KEYS = {
  independent: ['selfRecruit'],
  public: ['publicRecruit'],
  senior: ['talentMid', 'talentHigh']
};

function getLedgerUseTypeKeysForRecruitment(recruitmentType) {
  return RECRUIT_TO_LEDGER_USE_KEYS[recruitmentType] || [];
}

// 计划的使用形式标签（useTypes 中批复 > 0 的类型）
// 传入 useTypeKeys 时，只显示与当前批次类型一致的使用形式（如统一公招只显示「统一公开招聘」）
function planUsageFormLabels(plan, useTypeKeys) {
  var ut = (plan && plan.useTypes) || {};
  var labels = [];
  LEDGER_USE_TYPE_KEYS.forEach(function (k) {
    var row = ut[k];
    if (!row || (row.approved || 0) <= 0) return;
    if (useTypeKeys && useTypeKeys.length > 0 && useTypeKeys.indexOf(k) < 0) return;
    labels.push(LEDGER_USE_TYPE_LABELS[k]);
  });
  return labels;
}

// 计划是否匹配指定使用形式（为空或台账未标注使用形式时不过滤）
function planMatchesUsageForms(plan, useTypeKeys) {
  if (!useTypeKeys || useTypeKeys.length === 0) return true;
  var ut = (plan && plan.useTypes) || {};
  var hasAny = false;
  var matched = false;
  LEDGER_USE_TYPE_KEYS.forEach(function (k) {
    var row = ut[k];
    if (row && (row.approved || 0) > 0) {
      hasAny = true;
      if (useTypeKeys.indexOf(k) >= 0) matched = true;
    }
  });
  if (!hasAny) return true; // 台账未标注使用形式，不按使用形式过滤（显示为「—」）
  return matched;
}

function findLedgerPlanById(id) {
  var plans = getLedgerPlans(currentSchool, 'career').concat(getLedgerPlans(currentSchool, 'control'));
  for (var i = 0; i < plans.length; i++) { if (plans[i].id === id) return plans[i]; }
  return null;
}

// 编制类型：事业编 / 控制数（依据台账数组归属判断）
function getPlanEmploymentType(plan) {
  if (!plan) return '';
  return getPlanEmploymentTypeById(plan.id);
}
function getPlanEmploymentTypeById(id) {
  var d = getLedgerForSchool(currentSchool);
  if (!d || !id) return '';
  var cp = d.careerPlans || [], kp = d.controlPlans || [];
  for (var i = 0; i < cp.length; i++) { if (cp[i].id === id) return 'career'; }
  for (var j = 0; j < kp.length; j++) { if (kp[j].id === id) return 'control'; }
  return '';
}

// 从台账读取可用的编制计划（事业编 / 控制数）
function getSchoolUnusedPlan(schoolName, type, usageTypes) {
  var plans = [];
  if (!type || type === 'all') {
    plans = getLedgerPlans(schoolName, 'career').concat(getLedgerPlans(schoolName, 'control'));
  } else {
    plans = getLedgerPlans(schoolName, type);
  }
  var total = 0;
  plans.forEach(function (p) {
    if (ledgerPlanStatus(p) === 'expired') return; // 已到期不计入
    total += ledgerRemaining(p);
  });
  return total;
}

function getCurrentUsageTypes() {
  return selectedBatch ? getLedgerUseTypeKeysForRecruitment(selectedBatch.recruitmentType) : [];
}

// （不同批次类型的岗位只能使用同一类型的编制）
function getAvailableStaffingBatches(schoolName, type, usageTypes) {
  var plans = getLedgerPlans(schoolName, type);
  return plans.filter(function (p) {
    if (ledgerPlanStatus(p) !== 'active') return false; // 已用完 / 已过期不展示
    return planMatchesUsageForms(p, usageTypes);
  });

function hasSubmittedForBatch(batchId) {
  var records = loadRecords();
  return records.some(function(r) {
    return r.batchId === batchId && r.schoolName === currentSchool;
  });
}

function generateRecordId() {
  var now = new Date();
  var ds = now.toISOString().substring(0, 10).replace(/-/g, '');
  var seq = parseInt(localStorage.getItem('recruit_seq') || '0') + 1;
  localStorage.setItem('recruit_seq', String(seq));
  return 'RCA' + ds + String(seq).padStart(3, '0');
}

function onEmploymentMethodChange(idx) {
  var el = document.getElementById('employmentMethod_' + idx);
  if (!el) return;
  var method = el.value;
  var widget = document.getElementById('staffingBatchWidget_' + idx);
  if (!widget) return;
  if (!method) {
    widget.innerHTML = '<span style="font-size:12px;color:var(--text-light);">请先选择用人方式</span>';
    return;
  }
  var typeLabel = method === 'career' ? '事业编' : '控制数';
  var batches = getAvailableStaffingBatches(currentSchool, method, getCurrentUsageTypes());
  if (batches.length === 0) {
    widget.innerHTML = '<span style="font-size:12px;color:var(--text-light);">无可用的' + typeLabel + '编制批次</span>';
    return;
  }
  var currentPos = positionRows[idx] || {};
  var selected = currentPos.staffingBatchIds || [];
  widget.innerHTML = renderStaffingBatchWidget(idx, batches, selected, method);
  // Update bottom bar stats when employment method changes
  updateSubmitBarStats();
}

function onCategoryChange(idx) {
  var catEl = document.getElementById('positionCategory_' + idx);
  var levelEl = document.getElementById('positionLevel_' + idx);
  if (!catEl || !levelEl) return;
  var cat = catEl.value;
  var levels = CATEGORY_LEVELS[cat] || [];
  var h = '<option value="">— 请选择等级 —</option>';
  levels.forEach(function(l) {
    h += '<option value="' + l + '">' + l + '</option>';
  });
  levelEl.innerHTML = h;
}

function onLevelChange(idx) {
  var catEl = document.getElementById('positionCategory_' + idx);
  var levelEl = document.getElementById('positionLevel_' + idx);
  if (!catEl || !levelEl) return;
  var cat = catEl.value;
  var level = levelEl.value;
  // Update the hidden combined field
  var combinedEl = document.getElementById('categoryLevel_' + idx);
  if (combinedEl) combinedEl.value = cat && level ? cat + '-' + level : '';
}

function renderSBWTrigger(idx, batches, selectedIds, method) {
  var selectedBatches = batches.filter(function(b) { return selectedIds.indexOf(b.id) >= 0; });
  var currentPos = positionRows[idx] || {};
  var applyCounts = currentPos.staffingApplyCounts || {};
  var h = '';
  if (selectedBatches.length === 0) {
    h += '<div class="sbw-tags"><span style="font-size:12px;color:var(--text-light);">尚未选择批次</span></div>';
  } else {
    // 字段与下拉列表一致，另增一列「本岗位本次申请」可编辑
    h += '<table class="sbw-table"><thead><tr>';
    h += '<th>编制类型</th><th>来源</th><th>批复文号/批次</th><th>使用形式</th><th>编办确认数(名)</th><th>学历、专业(大类)、从业资格等</th><th>相关条件</th><th>未使用</th><th>有效期</th><th>状态</th><th>本岗位本次申请</th><th></th>';
    h += '</tr></thead><tbody>';
    selectedBatches.forEach(function(b) {
      var st = ledgerPlanStatus(b);
      var stLabel = LEDGER_STATUS_LABEL[st] || st;
      var stColor = LEDGER_STATUS_COLOR[st] || '#94A3B8';
      var remain = ledgerRemaining(b);
      var doc = planDocLabel(b);
      var srcLabel = b.source === 'online' ? '线上' : '线下';
      var usageLabels = planUsageFormLabels(b, getCurrentUsageTypes());
      var usageText = usageLabels.length > 0 ? usageLabels.join('、') : '—';
      var applyVal = (applyCounts[b.id] !== undefined && applyCounts[b.id] !== null) ? applyCounts[b.id] : '';
      var bType = getPlanEmploymentType(b);
      var bTypeLabel = bType === 'control' ? '控制数' : '事业编';
      var bTypeStyle = bType === 'control' ? 'background:#FEF3C7;color:#92400E;' : 'background:#E0E7FF;color:#3730A3;';
      h += '<tr>';
      h += '<td><span class="sbw-type-tag" style="' + bTypeStyle + '">' + bTypeLabel + '</span></td>';
      h += '<td><span class="sbw-type-tag" style="background:' + (b.source === 'online' ? '#E0E7FF' : '#F1F5F9') + ';color:' + (b.source === 'online' ? '#3730A3' : '#475569') + ';">' + srcLabel + '</span></td>';
      h += '<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;" title="' + escapeHtml(doc) + '">' + escapeHtml(doc) + '</td>';
      h += '<td>' + escapeHtml(usageText) + '</td>';
      var eduReq = '', cond = '';
      var utRows = b.useTypes || {};
      getCurrentUsageTypes().forEach(function(tk) {
        var ur = utRows[tk];
        if (ur && (ur.approved || 0) > 0) {
          if (!eduReq && ur.eduRequirement) eduReq = ur.eduRequirement;
          if (!cond && ur.conditions) cond = ur.conditions;
        }
      });
      h += '<td><strong>' + (b.approvedCount || 0) + '</strong></td>';
      h += '<td title="' + escapeHtml(eduReq) + '" style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(eduReq || '—') + '</td>';
      h += '<td title="' + escapeHtml(cond) + '" style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(cond || '—') + '</td>';
      h += '<td><strong>' + remain + '</strong></td>';
      h += '<td>' + (b.validEnd || '—') + '</td>';
      h += '<td><span class="sbw-type-tag" style="background:' + stColor + '1A;color:' + stColor + ';">' + stLabel + '</span></td>';
      h += '<td><input type="number" min="1" max="' + remain + '" value="' + applyVal + '" oninput="onSBWApplyCount(' + idx + ',\'' + b.id + '\',this.value)" placeholder="填申请数" style="padding:4px 6px;font-size:12px;border:1px solid var(--border);border-radius:4px;"></td>';
      h += '<td><span class="tag-close" style="cursor:pointer;font-size:14px;color:var(--text-light);" onclick="removeStaffingBatch(' + idx + ',\'' + b.id + '\')">&times;</span></td>';
      h += '</tr>';
    });
    h += '</tbody></table>';
    var totalRemain = 0;
    selectedBatches.forEach(function(b) {
      totalRemain += ledgerRemaining(b);
    });
    h += '<div class="sbw-stats">';
    h += '<span>已选 <b>' + selectedBatches.length + '</b> 个批次</span>';
    h += '<span>未使用 <b>' + totalRemain + '</b></span>';
    h += '</div>';
  }
  h += '<div class="sbw-trigger" onclick="toggleSBWDropdown(' + idx + ')">';
  h += '<span style="font-size:12px;color:var(--text-secondary);">' + (selectedBatches.length > 0 ? '点击重新选择' : '点击选择编制批次') + '</span>';
  h += '<span class="arrow" id="sbwArrow_' + idx + '">&#9660;</span>';
  h += '</div>';
  return h;
}

function renderSBWDropdown(idx, batches, selectedIds, method) {
  var typeLabel = method === 'career' ? '事业编' : '控制数';
  var h = '<div class="sbw-dropdown" id="sbwDropdown_' + idx + '">';
  if (batches.length === 0) {
    h += '<div style="padding:10px 12px;font-size:12px;color:var(--text-light);">无可用的' + typeLabel + '编制批次</div>';
  } else {
    h += '<table class="sbw-dd-table"><thead><tr>';
    h += '<th></th><th>编制类型</th><th>来源</th><th>批复文号/批次</th><th>使用形式</th><th class="num">未使用</th><th>有效期</th><th>状态</th>';
    h += '</tr></thead><tbody>';
    batches.forEach(function(b) {
      var checked = selectedIds.indexOf(b.id) >= 0;
      var st = ledgerPlanStatus(b);
      var stLabel = LEDGER_STATUS_LABEL[st] || st;
      var stColor = LEDGER_STATUS_COLOR[st] || '#94A3B8';
      var remain = ledgerRemaining(b);
      var doc = planDocLabel(b);
      var srcLabel = b.source === 'online' ? '线上' : '线下';
      var usageLabels = planUsageFormLabels(b, getCurrentUsageTypes());
      var usageText = usageLabels.length > 0 ? usageLabels.join('、') : '—';
      h += '<tr class="sbw-dd-row" onclick="onSBWCheck(' + idx + ',\'' + b.id + '\')">';
      h += '<td style="width:28px;text-align:center;"><input type="checkbox" class="sbw-cb" value="' + b.id + '"' + (checked ? ' checked' : '') + ' style="pointer-events:none;"></td>';
      var dType = getPlanEmploymentType(b);
      var dTypeLabel = dType === 'control' ? '控制数' : '事业编';
      var dTypeStyle = dType === 'control' ? 'background:#FEF3C7;color:#92400E;' : 'background:#E0E7FF;color:#3730A3;';
      h += '<td><span class="sbw-type-tag" style="' + dTypeStyle + '">' + dTypeLabel + '</span></td>';
      h += '<td><span class="sbw-type-tag" style="background:' + (b.source === 'online' ? '#E0E7FF' : '#F1F5F9') + ';color:' + (b.source === 'online' ? '#3730A3' : '#475569') + ';">' + srcLabel + '</span></td>';
      h += '<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;" title="' + escapeHtml(doc) + '">' + escapeHtml(doc) + '</td>';
      h += '<td>' + escapeHtml(usageText) + '</td>';
      h += '<td class="num"><strong>' + remain + '</strong></td>';
      h += '<td>' + (b.validEnd || '—') + '</td>';
      h += '<td><span class="sbw-type-tag" style="background:' + stColor + '1A;color:' + stColor + ';">' + stLabel + '</span></td>';
      h += '</tr>';
    });
    h += '</tbody></table>';
  }
  h += '</div>';
  return h;
}

function renderStaffingBatchWidget(idx, batches, selectedIds, method) {
  return '<div id="sbwTriggerArea_' + idx + '">' + renderSBWTrigger(idx, batches, selectedIds, method) + '</div>' +

var SBW_OPEN_IDX = -1;
function toggleSBWDropdown(idx) {
  var dd = document.getElementById('sbwDropdown_' + idx);
  var arrow = document.getElementById('sbwArrow_' + idx);
  if (!dd) return;
  var isOpen = dd.classList.contains('show');
  document.querySelectorAll('.sbw-dropdown.show').forEach(function(el) { el.classList.remove('show'); });
  document.querySelectorAll('.arrow.open').forEach(function(el) { el.classList.remove('open'); });
  if (!isOpen) {
    dd.classList.add('show');
    if (arrow) arrow.classList.add('open');
    SBW_OPEN_IDX = idx;
  } else {
    SBW_OPEN_IDX = -1;
  }
}

function onSBWCheck(idx, batchId) {
  var currentPos = positionRows[idx] || {};
  if (!currentPos.staffingBatchIds) currentPos.staffingBatchIds = [];
  if (!currentPos.staffingApplyCounts) currentPos.staffingApplyCounts = {};
  var ids = currentPos.staffingBatchIds;
  var p = ids.indexOf(batchId);
  if (p >= 0) { ids.splice(p, 1); delete currentPos.staffingApplyCounts[batchId]; }
  else { ids.push(batchId); if (currentPos.staffingApplyCounts[batchId] === undefined) currentPos.staffingApplyCounts[batchId] = ''; }
  var methodEl = document.getElementById('employmentMethod_' + idx);
  var method = methodEl ? methodEl.value : 'career';
  var batches = getAvailableStaffingBatches(currentSchool, method, getCurrentUsageTypes());
  // 记住下拉是否展开，重渲染后保持展开状态，同时让勾选框状态与数据同步
  var dd = document.getElementById('sbwDropdown_' + idx);
  var wasOpen = dd && dd.classList.contains('show');
  var widget = document.getElementById('staffingBatchWidget_' + idx);
  if (widget) widget.innerHTML = renderStaffingBatchWidget(idx, batches, currentPos.staffingBatchIds, method);
  if (wasOpen) {
    var ndd = document.getElementById('sbwDropdown_' + idx);
    if (ndd) ndd.classList.add('show');
    var narr = document.getElementById('sbwArrow_' + idx);
    if (narr) narr.classList.add('open');
    SBW_OPEN_IDX = idx;
  }
  updateSubmitBarStats();
}

function onSBWApplyCount(idx, batchId, value) {
  var currentPos = positionRows[idx] || {};
  if (!currentPos.staffingApplyCounts) currentPos.staffingApplyCounts = {};
  currentPos.staffingApplyCounts[batchId] = value === '' ? '' : (parseInt(value) || 0);
  updateSubmitBarStats();
}

function removeStaffingBatch(idx, batchId) {
  var currentPos = positionRows[idx] || {};
  if (!currentPos.staffingBatchIds) return;
  var p = currentPos.staffingBatchIds.indexOf(batchId);
  if (p >= 0) currentPos.staffingBatchIds.splice(p, 1);
  if (currentPos.staffingApplyCounts) delete currentPos.staffingApplyCounts[batchId];
  var methodEl = document.getElementById('employmentMethod_' + idx);
  var method = methodEl ? methodEl.value : 'career';
  var batches = getAvailableStaffingBatches(currentSchool, method, getCurrentUsageTypes());
  var trigger = document.getElementById('sbwTriggerArea_' + idx);
  if (trigger) trigger.innerHTML = renderSBWTrigger(idx, batches, currentPos.staffingBatchIds, method);
  updateSubmitBarStats();
}

function updateSBWStats(idx) {
  var countEl = document.getElementById('count_' + idx);
  if (!countEl) return;
  // Update positionRows count
  if (positionRows[idx]) positionRows[idx].count = parseInt(countEl.value) || 0;
  // Re-render trigger stats
  var methodEl = document.getElementById('employmentMethod_' + idx);
  var method = methodEl ? methodEl.value : '';
  if (!method) return;
  var currentPos = positionRows[idx] || {};
  var batches = getAvailableStaffingBatches(currentSchool, method, getCurrentUsageTypes());
  var trigger = document.getElementById('sbwTriggerArea_' + idx);
  if (trigger) trigger.innerHTML = renderSBWTrigger(idx, batches, currentPos.staffingBatchIds || [], method);
  // Update bottom bar
  updateSubmitBarStats();
}

// ===== FORM HELPERS =====
function formField(label, id, value, type, width, required, options, placeholder) {
  type = type || 'text';
  var h = '<div class="form-group">';
  h += '<label>' + label + (required?' <span class="req">*</span>':'') + '</label>';
  if (type === 'select' && options) {
    h += '<select id="' + id + '">';
    options.forEach(function(o) { h += '<option value="' + o + '"' + (value===o?' selected':'') + '>' + o + '</option>'; });
    h += '</select>';
  } else if (type === 'textarea') {
    h += '<textarea id="' + id + '" placeholder="' + (placeholder||'') + '" style="min-height:50px;">' + (value||'') + '</textarea>';
  } else if (type === 'date') {
    h += '<input type="date" id="' + id + '" value="' + (value||'') + '">';
  } else {
    h += '<input type="' + type + '" id="' + id + '" value="' + (value||'') + '"' + (placeholder?' placeholder="'+placeholder+'"':'') + (width?' style="max-width:'+width+'"':'') + '>';
  }
  h += '</div>';
  return h;
}

function boolField(label, id, value, required) {
  var h = '<div class="form-group">';
  h += '<label>' + label + (required ? ' <span class="req">*</span>' : '') + '</label>';
  h += '<select id="' + id + '">';
  h += '<option value="false"' + (!value?' selected':'') + '>否</option>';
  h += '<option value="true"' + (value?' selected':'') + '>是</option>';
  h += '</select></div>';
  return h;
}

// ===== POSITION MANAGEMENT =====
function addPosition() {
  var newPos = createEmptyPosition();
  newPos.seq = positionRows.length + 1;
  positionRows.push(newPos);
  refreshPositionCards();
}

function removePosition(idx) {
  if (positionRows.length <= 1) { showToast('至少保留一个岗位','warning'); return; }
  positionRows.splice(idx, 1);
  positionRows.forEach(function(p, i) { p.seq = i + 1; });
  refreshPositionCards();
  setTimeout(function() { updateSubmitBarStats(); }, 50);
}

function collectPositionData(idx) {
  if (!selectedBatch) return;
  var pos = positionRows[idx];
  var type = selectedBatch.recruitmentType;
  var fields = getFieldsForType(type);
  fields.forEach(function(f) {
    var el = document.getElementById(f + '_' + idx);
    if (!el) return;
    if (el.type === 'checkbox') {
      pos[f] = el.checked;
    } else if (f === 'count' || f === 'seq' || f === 'thresholdCount') {
      pos[f] = parseInt(el.value) || 0;
    } else if (f === 'staffingBatchIds') {
      // Already updated in real-time by onSBWCheck
      if (!pos[f]) pos[f] = [];
    } else if (f === 'positionCategory') {
      var catEl = document.getElementById('positionCategory_' + idx);
      if (catEl) pos[f] = catEl.value;
    } else if (f === 'positionLevel') {
      var levelEl = document.getElementById('positionLevel_' + idx);
      if (levelEl) pos[f] = levelEl.value;
    } else if (f === 'age') {
      // Age uses select+custom input combo
      var ageSel = document.getElementById('ageSelect_' + idx);
      if (ageSel && ageSel.value === '__custom__') {
        var ageCust = document.getElementById('ageCustom_' + idx);
        pos[f] = ageCust ? ageCust.value : '';
      } else if (ageSel) {
        pos[f] = ageSel.value;
      }
    } else if (f === 'openingRatio') {
      // OpeningRatio uses select+custom input combo
      var ratioSel = document.getElementById('openingRatioSelect_' + idx);
      if (ratioSel && ratioSel.value === '__custom__') {
        var ratioCust = document.getElementById('openingRatioCustom_' + idx);
        pos[f] = ratioCust ? ratioCust.value : '';
      } else if (ratioSel) {
        pos[f] = ratioSel.value;
      }
    } else if (f.indexOf('is') === 0 || f === 'needPublicExamThreshold') {
      pos[f] = el.value === 'true';
    } else {
      pos[f] = el.value;
    }
  });
}

function getFieldsForType(type) {
  if (type === 'independent') return ['city','schoolName','fundType','positionName','count','positionCategory','positionLevel','categoryLevel','employmentMethod','major','education','degree','age','titleOrQualification','otherConditions','examMethod','contactName','contactPhone','contactEmail','remark','staffingBatchIds'];
  if (type === 'public') return ['authority','unit','positionName','count','positionCategory','positionLevel','categoryLevel','employmentMethod','positionDescription','major','education','degree','age','titleOrQualification','isServiceGrassroots','isGraduateRecruitment','isRetiredSoldier','otherConditions','examCategory','examCategoryName','examCategoryCode','examMethod','needPublicExamThreshold','thresholdCount','interviewMethod','contactAddress','contactPhone','supervisionPhone','fax','staffingBatchIds'];
  if (type === 'senior') return ['authority','unit','unitNature','positionName','positionCategory','positionLevel','categoryLevel','employmentMethod','positionDescription','count','major','education','degree','age','titleOrQualification','otherConditions','examMethod','openingRatio','onlineApplyStart','onlineApplyEnd','contactPhone','staffingBatchIds'];
  return [];
}

function getEmployUrl() {
  if (currentRole === 'city' || currentRole === 'district') return 'employ-list-admin.html?role=' + currentRole;
  if (currentRole === 'school') return 'employ-list-school.html';
  return null;
}

function refreshPositionCards() {
  var container = document.getElementById('positionCards');
  if (!container || !selectedBatch) return;
  var h = '';
  var type = selectedBatch.recruitmentType;
  positionRows.forEach(function(pos, i) {
    if (type === 'independent') h += renderIndependentPosition(pos, i);
    else if (type === 'public') h += renderPublicPosition(pos, i);
    else if (type === 'senior') h += renderSeniorPosition(pos, i);
  });
  container.innerHTML = h;
  // Initialize senior position dropdowns
  if (type === 'senior' || type === 'independent' || type === 'public') {
    positionRows.forEach(function(pos, i) {
      // Restore category and level
      if (pos.positionCategory) {
        var catEl = document.getElementById('positionCategory_' + i);
        if (catEl) { catEl.value = pos.positionCategory; onCategoryChange(i); }
        if (pos.positionLevel) {
          var levelEl = document.getElementById('positionLevel_' + i);
          if (levelEl) { levelEl.value = pos.positionLevel; }
        }
      }
      // Restore staffing batch selections
      onEmploymentMethodChange(i);
      // Rebuild SBW trigger if staffingBatchIds exists
      if (pos.staffingBatchIds && pos.staffingBatchIds.length > 0) {
        var methodEl = document.getElementById('employmentMethod_' + i);
        var m = methodEl ? methodEl.value : 'career';
        var bs = getAvailableStaffingBatches(currentSchool, m, getCurrentUsageTypes());
        var trig = document.getElementById('sbwTriggerArea_' + i);
        if (trig) trig.innerHTML = renderSBWTrigger(i, bs, pos.staffingBatchIds, m);
      }
      // Restore textareas counts
      updatePosDescCount(i);
      updateOtherCondCount(i);
    });
  }
    updateSubmitBarStats();
}

function updateSubmitBarStats() {
  if (!selectedBatch) return;
  var type = selectedBatch.recruitmentType;
  // Update position count
  var posCountEl = document.getElementById('positionCountDisplay');
  if (posCountEl) posCountEl.textContent = positionRows.length;
  // Update total count
  var total = 0;
  var careerTotal = 0, controlTotal = 0;
  positionRows.forEach(function(p, i) {
    var el = document.getElementById('count_' + i);
    if (el) {
      var cnt = parseInt(el.value) || 0;
      total += cnt;
      if ((type === 'senior' || type === 'independent' || type === 'public') || type === 'independent') {
        var methodEl = document.getElementById('employmentMethod_' + i);
        var method = methodEl ? methodEl.value : (p.employmentMethod || 'career');
        if (method === 'control') controlTotal += cnt;
        else careerTotal += cnt;
      }
    }
  });
  totalCount = total;
  var totalDisplay = document.getElementById('totalCountDisplay');
  if (totalDisplay) {
    if ((type === 'senior' || type === 'independent' || type === 'public') || type === 'independent') {
      totalDisplay.innerHTML = total + '（事业编' + careerTotal + ' / 控制数' + controlTotal + '）';
    } else {
      totalDisplay.textContent = total;
    }
  }
  // Update quota display for senior
  if ((type === 'senior' || type === 'independent' || type === 'public') || type === 'independent') {
    var allIds = [];
    positionRows.forEach(function(p) {
      (p.staffingBatchIds || []).forEach(function(id) {
        if (allIds.indexOf(id) < 0) allIds.push(id);
      });
    });
    var careerPlans = getLedgerPlans(currentSchool, 'career');
    var controlPlans = getLedgerPlans(currentSchool, 'control');
    var careerAvail = 0, controlAvail = 0;
    careerPlans.forEach(function(b) {
      if (allIds.indexOf(b.id) >= 0 && ledgerPlanStatus(b) !== 'expired') careerAvail += ledgerRemaining(b);
    });
    controlPlans.forEach(function(b) {
      if (allIds.indexOf(b.id) >= 0 && ledgerPlanStatus(b) !== 'expired') controlAvail += ledgerRemaining(b);
    });
    var careerEl = document.getElementById("careerAvailDisplay");
    var controlEl = document.getElementById("controlAvailDisplay");
    if (careerEl) careerEl.textContent = careerAvail;
    if (controlEl) controlEl.textContent = controlAvail;
  }
}

// ===== ATTACHMENT HANDLING =====
function handleFileUpload(input) {
  var files = input.files;
  var allowed = ['pdf','doc','docx','jpg','jpeg','png','xls','xlsx'];
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    var ext = f.name.split('.').pop().toLowerCase();
    if (allowed.indexOf(ext) === -1) { showToast('不支持的文件格式：' + f.name, 'warning'); continue; }
    if (f.size > 10 * 1024 * 1024) { showToast('文件超过10MB限制：' + f.name, 'warning'); continue; }
    uploadedFiles.push({ name: f.name, size: f.size });
  }
  input.value = '';
  refreshFileList();
}

function removeFile(idx) { uploadedFiles.splice(idx, 1); refreshFileList(); }

function refreshFileList() {
  var fl = document.getElementById('fileList');
  if (!fl) return;
  var h = '';
  uploadedFiles.forEach(function(f, i) {
    h += '<div class="file-item"><span class="file-name">' + f.name + '</span><span class="file-size">' + formatSize(f.size) + '</span><span class="file-remove" onclick="removeFile(' + i + ')">移除</span></div>';
  });
  fl.innerHTML = h;
}

// ===== SUBMIT =====
function submitForm() {
  if (!selectedBatch) { showToast('请先选择招聘批次', 'warning'); return; }

  // Collect all position data
  positionRows.forEach(function(p, i) { collectPositionData(i); });

  // Validate
  var totalCnt = 0;
  var hasError = false;
  var type = selectedBatch.recruitmentType;
  positionRows.forEach(function(p, i) {
    totalCnt += (parseInt(p.count) || 0);
    if (!p.positionName) { showToast('岗位 ' + (i+1) + '：请填写岗位名称', 'warning'); hasError = true; }
    if (type === 'independent') {
      if (!p.categoryLevel) { showToast('岗位 ' + (i+1) + '：请填写岗位类别等级', 'warning'); hasError = true; }
      if (!p.staffingBatchIds || p.staffingBatchIds.length === 0) { showToast('岗位 ' + (i+1) + '：请选择关联编制使用申请批次', 'warning'); hasError = true; }
      if (!p.positionCategory || !p.positionLevel) { showToast('岗位 ' + (i+1) + '：请选择岗位类别和等级', 'warning'); hasError = true; }
      if (!p.education) { showToast('岗位 ' + (i+1) + '：请选择学历要求', 'warning'); hasError = true; }
      if (!p.degree) { showToast('岗位 ' + (i+1) + '：请选择学位要求', 'warning'); hasError = true; }
      if (!p.age) { showToast('岗位 ' + (i+1) + '：请选择年龄', 'warning'); hasError = true; }
      if (!p.titleOrQualification) { showToast('岗位 ' + (i+1) + '：请填写职称或职业资格', 'warning'); hasError = true; }
      if (!p.examMethod) { showToast('岗位 ' + (i+1) + '：请选择考试方式', 'warning'); hasError = true; }
      if (!p.contactName) { showToast('岗位 ' + (i+1) + '：请填写负责人姓名', 'warning'); hasError = true; }
      if (!p.contactPhone) { showToast('岗位 ' + (i+1) + '：请填写联系电话', 'warning'); hasError = true; }
      if (!p.contactEmail) { showToast('岗位 ' + (i+1) + '：请填写电子邮箱', 'warning'); hasError = true; }
    }
    if (type === 'public') {
      if (!p.authority) { showToast('岗位 ' + (i+1) + '：请填写主管部门', 'warning'); hasError = true; }
      if (!p.positionCategory || !p.positionLevel) { showToast('岗位 ' + (i+1) + '：请选择岗位类别和等级', 'warning'); hasError = true; }
      if (!p.staffingBatchIds || p.staffingBatchIds.length === 0) { showToast('岗位 ' + (i+1) + '：请选择关联编制使用申请批次', 'warning'); hasError = true; }
      if (!p.positionDescription) { showToast('岗位 ' + (i+1) + '：请填写岗位说明', 'warning'); hasError = true; }
      if (!p.major) { showToast('岗位 ' + (i+1) + '：请填写所学专业', 'warning'); hasError = true; }
      if (!p.education) { showToast('岗位 ' + (i+1) + '：请选择学历要求', 'warning'); hasError = true; }
      if (!p.degree) { showToast('岗位 ' + (i+1) + '：请选择学位要求', 'warning'); hasError = true; }
      if (!p.age) { showToast('岗位 ' + (i+1) + '：请选择年龄', 'warning'); hasError = true; }
      if (!p.titleOrQualification) { showToast('岗位 ' + (i+1) + '：请填写职称或职业资格', 'warning'); hasError = true; }
      if (!p.examCategory) { showToast('岗位 ' + (i+1) + '：请选择考试类别', 'warning'); hasError = true; }
      if (!p.examCategoryName) { showToast('岗位 ' + (i+1) + '：请填写考试类别名称', 'warning'); hasError = true; }
      if (!p.examCategoryCode) { showToast('岗位 ' + (i+1) + '：请填写考试类别代码', 'warning'); hasError = true; }
      if (!p.examMethod) { showToast('岗位 ' + (i+1) + '：请选择考试方式', 'warning'); hasError = true; }
      if (!p.interviewMethod) { showToast('岗位 ' + (i+1) + '：请选择面试方式', 'warning'); hasError = true; }
      if (!p.contactAddress) { showToast('岗位 ' + (i+1) + '：请填写邮寄材料地址及邮编', 'warning'); hasError = true; }
      if (!p.contactPhone) { showToast('岗位 ' + (i+1) + '：请填写咨询电话', 'warning'); hasError = true; }
      if (!p.supervisionPhone) { showToast('岗位 ' + (i+1) + '：请填写监督电话', 'warning'); hasError = true; }
      if (p.isServiceGrassroots === undefined || p.isServiceGrassroots === null) { showToast('岗位 ' + (i+1) + '：请选择是否定向招聘服务基层项目人员', 'warning'); hasError = true; }
      if (p.isGraduateRecruitment === undefined || p.isGraduateRecruitment === null) { showToast('岗位 ' + (i+1) + '：请选择是否专项招聘高校毕业生', 'warning'); hasError = true; }
      if (p.isRetiredSoldier === undefined || p.isRetiredSoldier === null) { showToast('岗位 ' + (i+1) + '：请选择是否定向招聘退役士官士兵', 'warning'); hasError = true; }
      if (p.needPublicExamThreshold === undefined || p.needPublicExamThreshold === null) { showToast('岗位 ' + (i+1) + '：请选择是否需参加公共科目笔试', 'warning'); hasError = true; }
      if (p.needPublicExamThreshold && !p.thresholdCount) { showToast('岗位 ' + (i+1) + '：请填写需参加公共科目笔试的数量', 'warning'); hasError = true; }
    }
    if (type === 'senior') {
      if (!p.education) { showToast('岗位 ' + (i+1) + '：请选择学历', 'warning'); hasError = true; }
      if (!p.degree) { showToast('岗位 ' + (i+1) + '：请选择学位', 'warning'); hasError = true; }
      if (!p.age) { showToast('岗位 ' + (i+1) + '：请选择年龄', 'warning'); hasError = true; }
      if (!p.titleOrQualification) { showToast('岗位 ' + (i+1) + '：请填写职称或职业资格', 'warning'); hasError = true; }
      if (!p.examMethod) { showToast('岗位 ' + (i+1) + '：请选择考试（考核）方式', 'warning'); hasError = true; }
      if (!p.contactPhone) { showToast('岗位 ' + (i+1) + '：请填写咨询电话', 'warning'); hasError = true; }
    }
    if (type === 'senior' || type === 'independent' || type === 'public') {
      if (!p.positionCategory || !p.positionLevel) { showToast('岗位 ' + (i+1) + '：请选择岗位类别和等级', 'warning'); hasError = true; }
      if (!p.staffingBatchIds || p.staffingBatchIds.length === 0) { showToast('岗位 ' + (i+1) + '：请选择关联编制使用申请批次', 'warning'); hasError = true; }
      if (!p.authority) { showToast('岗位 ' + (i+1) + '：请填写主管部门', 'warning'); hasError = true; }
      // 校验每个已选批次的「本岗位本次申请」数值
      (p.staffingBatchIds || []).forEach(function(bid) {
        var ac = (p.staffingApplyCounts || {})[bid];
        var acNum = parseInt(ac);
        if (ac === undefined || ac === null || ac === '' || isNaN(acNum) || acNum <= 0) {
          showToast('岗位 ' + (i+1) + '：请填写所选批次的「本岗位本次申请」数值', 'warning'); hasError = true;
          return;
        }
        var plan = findLedgerPlanById(bid);
        if (plan && acNum > ledgerRemaining(plan)) {
          showToast('岗位 ' + (i+1) + '：「本岗位本次申请」超出批次未使用名额（' + ledgerRemaining(plan) + '）', 'warning'); hasError = true;
        }
        // 关联批次的编制类型须与用人方式一致（事业编岗位关联事业编批次，控制数岗位关联控制数批次）
        var batchType = getPlanEmploymentTypeById(bid);
        if (batchType && batchType !== p.employmentMethod) {
          showToast('岗位 ' + (i+1) + '：关联编制批次须为' + (p.employmentMethod === 'control' ? '控制数' : '事业编') + '编制', 'warning'); hasError = true;
        }
      });
    }
  });
  if (hasError) return;

  if (totalCnt <= 0) { showToast('请至少填写一个岗位的招聘人数', 'warning'); return; }

  if (type === 'senior' || type === 'independent' || type === 'public') {
    // Check senior-specific quotas
    var careerTotal = 0, controlTotal = 0;
    positionRows.forEach(function(p) {
      if (p.employmentMethod === 'control') controlTotal += (parseInt(p.count) || 0);
      else careerTotal += (parseInt(p.count) || 0);
    });
    var careerPlan = getSchoolUnusedPlan(currentSchool, 'career', getCurrentUsageTypes());
    var controlPlan = getSchoolUnusedPlan(currentSchool, 'control', getCurrentUsageTypes());
    if (careerTotal > careerPlan) { showToast('事业编岗位超出可用计划数，无法提交', 'warning'); return; }
    if (controlTotal > controlPlan) { showToast('控制数岗位超出可用计划数，无法提交', 'warning'); return; }
  } else {
    var unusedPlan = getSchoolUnusedPlan(currentSchool);
    if (totalCnt > unusedPlan) { showToast('招聘总人数超出可用编制计划数，无法提交', 'warning'); return; }
  }

  if (type !== 'public' && uploadedFiles.length === 0) { showToast('请至少上传一个附件', 'warning'); return; }

  // Build record
  var sd = SCHOOL_DATA[currentSchool] || {};
  var now = new Date();
  var ts = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0');

  var record = {
    id: generateRecordId(),
    batchId: selectedBatch.id,
    batchName: selectedBatch.name,
    recruitmentType: selectedBatch.recruitmentType,
    schoolName: currentSchool,
    schoolCategory: sd.district || '',
    status: 'pending_first',
    formData: { positions: JSON.parse(JSON.stringify(positionRows)) },
    submitTime: ts,
    firstReviewResult: null, firstReviewOpinion: '', firstReviewer: null, firstReviewTime: null, firstRejectReason: '', firstModifiableUntil: null,
    secondReviewResult: null, secondReviewOpinion: '', secondReviewer: null, secondReviewTime: null, secondRejectReason: '', secondModifiableUntil: null,
    modifications: [],
    attachments: uploadedFiles.slice(),
    timeline: [{ time: ts, action: '学校提交申报', operator: ROLES[currentRole].name }]
  };

  // Handle edit / modify mode
  var records = loadRecords();
  if (pageMode === 'modify' && editRecordId) {
    var idx = records.findIndex(function(r){ return r.id === editRecordId; });
    if (idx >= 0) {
      record.id = editRecordId;
      record.status = records[idx].status; // Keep existing status (completed)
      record.secondModifiableUntil = null; // Close modification window
      record.timeline = (records[idx].timeline || []).concat([{ time: ts, action: '管理员30天编辑修改', operator: ROLES[currentRole].name }]);
      record.modifications = (records[idx].modifications || []).concat([{ time: ts, description: '管理员30天编辑修改', operator: ROLES[currentRole].name }]);
      records[idx] = record;
    }
  } else if (pageMode === 'edit' && editRecordId) {
    var idx = records.findIndex(function(r){ return r.id === editRecordId; });
    if (idx >= 0) {
      record.id = editRecordId;
      record.timeline = (records[idx].timeline || []).concat([{ time: ts, action: '学校修改后重新提交', operator: ROLES[currentRole].name }]);
      records[idx] = record;
    }
  } else {
    records.push(record);
  }
  saveRecords(records);
  showToast('保存成功', 'success');
  setTimeout(function() { window.location.href = currentRole === 'school' ? 'recruit-list-school.html' : 'recruit-list-admin.html?role=' + currentRole; }, 1000);
}

// ===== MAIN RENDER =====
function renderPage() {
  var h = '';
  // Edit mode: wrap in two-column layout
  if (pageMode === 'edit') {
    h += '<div class="edit-layout">';
    h += '<div class="edit-main">';
  }
  // School switcher (rendered into breadcrumb, not in edit mode)
  renderSchoolSwitcher();
  // Batch selection (not in edit mode)
  if (pageMode !== 'edit') {
    h += directBatch ? renderDirectBatchInfo() : renderBatchSelect();
  }
  // Form
  if (selectedBatch) {
    h += '<div class="form-card">';
    h += '<h2><span class="card-icon">&#128221;</span>填写招聘岗位计划</h2>';
        h += '<div id="positionCards"></div>';
    h += '<div class="add-position-bar" onclick="addPosition()">+ 添加岗位</div>';
    h += '</div>';

    // Attachments
    h += '<div class="form-card">';
    h += '<h2><span class="card-icon">&#128206;</span>上传附件' + (selectedBatch && selectedBatch.recruitmentType === 'public' ? '（选填）' : '') + '</h2>';
    h += '<div class="upload-area" onclick="document.getElementById(\'fileInput\').click()">';
    h += '<div class="upload-icon">&#128194;</div>';
    h += '<div class="upload-text">点击上传或拖拽文件到此处</div>';
    h += '<div class="upload-hint">支持 PDF、Word、Excel、JPG、PNG 格式，单文件不超过10MB</div>';
    h += '</div>';
    h += '<input type="file" id="fileInput" multiple onchange="handleFileUpload(this)" style="display:none">';
    h += '<div class="file-list" id="fileList"></div>';
    h += '</div>';

    // Submit
    h += '<div class="submit-bar">';
    h += '<span class="quota-summary" style="flex:1;white-space:nowrap;">';
    h += '岗位数：<b id="positionCountDisplay">' + positionRows.length + '</b> &nbsp;|&nbsp; ';
    h += '招聘总人数：<b id="totalCountDisplay">0</b> &nbsp;|&nbsp; ';
    if (selectedBatch.recruitmentType === 'senior' || selectedBatch.recruitmentType === 'independent' || selectedBatch.recruitmentType === 'public') {
      h += '事业编可用：<b id="careerAvailDisplay">0</b> &nbsp;|&nbsp; ';
      h += '控制数可用：<b id="controlAvailDisplay">0</b>';
    } else {
      h += '可用编制计划数：<b>' + getSchoolUnusedPlan(currentSchool) + '</b>';
    }
    h += '</span>';
    h += '<button class="btn btn-outline" onclick="window.location.href=\'recruit-list-school.html\'">取消</button>';
    h += '<button class="btn btn-primary" onclick="submitForm()">' + (pageMode === 'edit' || pageMode === 'modify' ? '保存信息' : '提交申报') + '</button>';
    h += '</div>';
  }

  // Edit mode: close main column and add timeline sidebar
  if (pageMode === 'edit') {
    h += '</div>'; // .edit-main
    h += '<div class="edit-side">';
    if (editRecordRef) {
      h += renderEditTimeline(editRecordRef);
    }
    h += '</div>'; // .edit-side
    h += '</div>'; // .edit-layout
  }

  document.getElementById('formArea').innerHTML = h;

  if (selectedBatch) {
    refreshPositionCards();
    refreshFileList();
  }
}

// ===== EDIT TIMELINE (for rejected resubmit) =====
function renderEditTimeline(record) {
  var items = [];
  (record.timeline || []).forEach(function(t) { items.push(t); });
  // Supplement first audit info if timeline doesn't already have it
  if (record.firstReviewer) {
    var hasFirst = items.some(function(t) {
      return t.action && (t.action.indexOf('审') >= 0 || t.action.indexOf('驳回') >= 0);
    });
    if (!hasFirst) {
      items.push({
        time: record.firstReviewTime || '',
        action: record.firstReviewResult === 'rejected' ? '主管审核驳回' : '主管审核通过',
        operator: record.firstReviewer,
        opinion: record.firstRejectReason || record.firstReviewOpinion || ''
      });
    }
  }
  // Supplement second audit info if timeline doesn't already have it
  if (record.secondReviewer) {
    var hasSecond = items.some(function(t) {
      return t.action && (t.action.indexOf('审') >= 0 || t.action.indexOf('驳回') >= 0 || t.action.indexOf('终审') >= 0);
    });
    if (!hasSecond) {
      items.push({
        time: record.secondReviewTime || '',
        action: record.secondReviewResult === 'rejected' ? '终审审核驳回' : '终审审核通过',
        operator: record.secondReviewer,
        opinion: record.secondRejectReason || record.secondReviewOpinion || ''
      });
    }
  }
  items.sort(function(a, b) { return (a.time||'').localeCompare(b.time||''); });
  var h = '<div class="side-history"><h4>申报履历</h4><div class="timeline">';
  if (items.length === 0) {
    h += '<div style="font-size:12px;color:var(--text-light);">暂无记录</div>';
  } else {
    items.forEach(function(item) {
      var isReject = item.action && item.action.indexOf('驳回') >= 0;
      h += '<div class="timeline-item' + (isReject ? ' reject' : '') + '">';
      h += '<div class="tl-time">' + (item.time ? item.time.substring(0, 16) : '') + '</div>';
      h += '<div class="tl-action">' + escapeHtml(item.action) + '</div>';
      h += '<div class="tl-operator">操作人：' + escapeHtml(item.operator || '') + '</div>';
      if (item.opinion) {
        h += '<div class="tl-opinion">' + escapeHtml(item.opinion) + '</div>';
      }
      h += '</div>';
    });
  }
  h += '</div></div>';
  return h;
}

// ===== LOAD FOR EDIT =====
function loadForEdit(id) {
  var records = loadRecords();
  var rec = records.find(function(r){ return r.id === id; });
  if (!rec) { showToast('未找到申报记录', 'warning'); return; }

  editRecordId = id;
  var isModify = (arguments.length > 1 && arguments[1] === 'modify');
  pageMode = isModify ? 'modify' : 'edit';
  currentSchool = rec.schoolName;

  // Load batch
  var batches = loadBatches();
  selectedBatch = batches.find(function(b){ return b.id === rec.batchId; }) || null;

  // Load positions
  if (rec.formData && rec.formData.positions) {
    positionRows = JSON.parse(JSON.stringify(rec.formData.positions));
  } else {
    positionRows = [createEmptyPosition()];
  }

  // Load attachments
  uploadedFiles = rec.attachments ? JSON.parse(JSON.stringify(rec.attachments)) : [];

  var isModifyMode = (arguments.length > 1 && arguments[1] === 'modify');
  if (isModifyMode) {
    document.getElementById('pageTitle').textContent = '修改招聘申报（30天编辑）';
    document.getElementById('pageSubtitle').textContent = '该申报已终审通过，在30天内可编辑修改。修改后30天修改窗口将关闭。';
  } else {
    document.getElementById('pageTitle').textContent = '修改招聘申报';
    document.getElementById('pageSubtitle').textContent = '已驳回申报的重新提交，请修改后再次申报';
  }

  editRecordRef = rec;
  renderPage();
}

// ===== INIT =====
function init() {
  seedLedgerDemoPlans();
  var id = getUrlParam('id');
  var mode = getUrlParam('mode');
  var schoolParam = getUrlParam('school');

  if (schoolParam) { currentSchool = decodeURIComponent(schoolParam); }

  renderSidebar();

  if (id && (mode === 'edit' || mode === 'modify')) {
    loadForEdit(id, mode);
  } else {
    // Check if a specific batch is requested
    var batchParam = getUrlParam('batchId');
    if (batchParam) {
      var batches = loadBatches();
      selectedBatch = batches.find(function(b){ return b.id === batchParam; }) || null;
      if (selectedBatch) {
        if (hasSubmittedForBatch(selectedBatch.id)) {
          showToast('该批次已申报过，每个批次只能申报一次', 'warning');
          selectedBatch = null;
        }
      }
    }
    directBatch = !!selectedBatch;
    if (selectedBatch) {
      positionRows = [createEmptyPosition()];
    }
    renderPage();
  }

  // School role only
  if (currentRole !== 'school') {
    document.getElementById('formArea').innerHTML =
      '<div class="access-denied">' +
      '<div class="denied-icon">&#128274;</div>' +
      '<h2>无权访问</h2><p>只有校管理员角色可以填写招聘岗位申报表。</p>' +
      '<button class="btn btn-primary" onclick="switchRole(\'school\')">切换到校管理员</button></div>';
  }
}
init();
