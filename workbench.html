<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柳州教育人事管理平台 — 工作台</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
    --accent: #3B82F6; --primary-bright: #2563EB;
    --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
    --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
    --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
    --radius: 8px; --radius-lg: 12px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --sidebar-w: 240px;
  }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }

  /* ===== TOP NAVBAR ===== */
  .topnav {
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .topnav-left { display: flex; align-items: center; gap: 14px; }
  .topnav-logo {
    width: 38px; height: 38px; background: rgba(255,255,255,0.18);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
  }
  .topnav-logo svg { width: 24px; height: 24px; }
  .topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
  .topnav-right { display: flex; align-items: center; gap: 18px; }
  .topnav-bell {
    position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
    padding: 6px; border-radius: 6px; transition: var(--transition);
  }
  .topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .topnav-bell .badge {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--danger); color: #fff;
    font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .topnav-user {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
    transition: var(--transition); font-size: 13px; position: relative;
  }
  .topnav-user:hover { background: rgba(255,255,255,0.1); }
  .topnav-user .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
  }
  .user-dropdown {
    display: none; position: absolute; top: 46px; right: 0;
    background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
    min-width: 160px; z-index: 200; overflow: hidden;
  }
  .user-dropdown.show { display: block; }
  .user-dropdown a {
    display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
    text-decoration: none; transition: var(--transition);
  }
  .user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
  .user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
  .user-dropdown .logout { color: var(--danger); }

  /* ===== MESSAGE POPOVER ===== */
  .msg-popover {
    display: none; position: absolute; top: 50px; right: 60px;
    width: 340px; background: #fff; border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); z-index: 200; overflow: hidden;
  }
  .msg-popover.show { display: block; }
  .msg-popover-header {
    padding: 14px 18px; font-size: 14px; font-weight: 600;
    border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
  }
  .msg-list { max-height: 300px; overflow-y: auto; }
  .msg-item {
    display: flex; gap: 10px; padding: 14px 18px; cursor: pointer;
    border-bottom: 1px solid #F1F5F9; transition: var(--transition);
  }
  .msg-item:hover { background: #F8FAFC; }
  .msg-item.unread .msg-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 4px; }
  .msg-item.read .msg-dot { width: 8px; flex-shrink: 0; }
  .msg-item-title { font-size: 13px; color: var(--text); margin-bottom: 2px; }
  .msg-item-time { font-size: 11px; color: var(--text-light); }
  .msg-popover-footer { padding: 10px 18px; text-align: center; border-top: 1px solid var(--border); }
  .msg-popover-footer a { font-size: 12px; color: var(--primary); text-decoration: none; }

  /* ===== SIDEBAR ===== */
  .sidebar {
    position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
    background: #1E3A8A; z-index: 90; overflow-y: auto;
    display: flex; flex-direction: column; transition: width var(--transition);
  }
  .sidebar.collapsed { width: 64px; }
  .sidebar.collapsed .menu-label,
  .sidebar.collapsed .menu-group,
  .sidebar.collapsed .menu-badge,
  .sidebar.collapsed .role-switcher-label,
  .sidebar.collapsed .role-switcher-name { display: none; }
  .sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
  .sidebar.collapsed .menu-icon { margin-right: 0; }
  .sidebar-menu { flex: 1; padding: 8px 0; }
  .menu-group {
    padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .menu-item {
    display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
    font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
    transition: var(--transition); position: relative; text-decoration: none;
    border-left: 3px solid transparent;
  }
  .menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .menu-item.active {
    background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
    border-left-color: var(--accent);
  }
  .menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
  .menu-item.active .menu-icon { opacity: 1; }
  .menu-item .menu-badge {
    margin-left: auto; background: var(--danger); color: #fff;
    font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
  }

  /* Sidebar bottom area */
  .sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
  .sidebar-toggle {
    display: flex; align-items: center; gap: 8px; padding: 10px 20px;
    cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
    transition: var(--transition);
  }
  .sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
  .sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
  .sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

  /* Role Switcher */
  .role-switcher {
    padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
  }
  .role-switcher-label {
    font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;
    margin-bottom: 8px; padding: 0 4px;
  }
  .role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
  .role-switch-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 6px; cursor: pointer;
    font-size: 12px; color: rgba(255,255,255,0.55);
    transition: var(--transition); border: 1px solid transparent;
    background: transparent; font-family: inherit; width: 100%; text-align: left;
  }
  .role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
  .role-switch-btn.active {
    background: rgba(59,130,246,0.2); color: #fff;
    border-color: rgba(59,130,246,0.4); font-weight: 500;
  }
  .role-switch-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .role-switch-dot.city { background: #3B82F6; }
  .role-switch-dot.district { background: #F59E0B; }
  .role-switch-dot.school { background: #10B981; }
  .role-switch-dot.teacher { background: #A78BFA; }

  /* ===== MAIN CONTENT ===== */
  .main {
    margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
    min-height: calc(100vh - 56px); transition: margin-left var(--transition);
  }
  .sidebar.collapsed ~ .main { margin-left: 64px; }

  .breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
  .breadcrumb a { color: var(--text-light); text-decoration: none; }
  .breadcrumb a:hover { color: var(--primary); }
  .breadcrumb span { color: var(--text-secondary); }

  .welcome {
    display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px;
  }
  .welcome-left h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .welcome-left .role-tag { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
  .welcome-right { font-size: 13px; color: var(--text-light); text-align: right; }

  .section { margin-bottom: 24px; }
  .section-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
  }
  .section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
  .section-link { font-size: 12px; color: var(--primary); text-decoration: none; }
  .section-link:hover { text-decoration: underline; }

  /* ===== TODO + QUICK SIDE-BY-SIDE ===== */
  .todo-quick-row { display: flex; gap: 20px; margin-bottom: 24px; align-items: stretch; }
  .todo-quick-row .section { flex: 1; margin-bottom: 0; display: flex; flex-direction: column; }
  .todo-quick-row .section-header { flex-shrink: 0; }
  #todoArea { flex: 1; display: flex; flex-direction: column; }
  #todoArea .todo-module-list { flex: 1; }
  #quickArea { flex: 1; }
  #quickArea.quick-grid { grid-template-rows: 1fr 1fr; }

  /* Todo Module List */
  .todo-module-list {
    background: #fff; border-radius: var(--radius-lg);
    border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .todo-module-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; cursor: pointer; transition: var(--transition);
    border-bottom: 1px solid #F1F5F9; text-decoration: none; color: inherit;
  }
  .todo-module-item:last-child { border-bottom: none; }
  .todo-module-item:hover { background: #F8FAFC; }
  .todo-module-icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
  }
  .todo-module-icon.blue { background: #EFF6FF; color: var(--primary); }
  .todo-module-icon.green { background: #ECFDF5; color: var(--success); }
  .todo-module-icon.amber { background: #FFFBEB; color: #D97706; }
  .todo-module-icon.purple { background: #F5F3FF; color: #7C3AED; }
  .todo-module-icon.teal { background: #F0FDFA; color: #0D9488; }
  .todo-module-name { font-size: 12px; font-weight: 500; color: var(--text); flex: 1; min-width: 0; }
  .todo-module-name small { font-weight: 400; color: var(--text-light); display: block; }
  .todo-module-item:hover .todo-module-name { color: var(--primary); }
  .todo-counts { display: flex; gap: 10px; flex-shrink: 0; }
  .todo-count-item { text-align: center; min-width: 36px; }
  .todo-count-item .count-num { font-size: 14px; font-weight: 700; }
  .todo-count-item .count-label { font-size: 9px; color: var(--text-light); }
  .count-pending .count-num { color: var(--primary); }
  .count-review .count-num { color: #D97706; }
  .count-reject .count-num { color: var(--danger); }
  .todo-module-arrow { color: var(--text-light); font-size: 12px; flex-shrink: 0; }
  .todo-module-item:hover .todo-module-arrow { color: var(--primary); }

  #todoArea .todo-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-light); font-size: 13px;
    background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .lock-alert {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px; padding: 10px 14px;
    background: #FEF2F2; border: 1px solid #FECACA;
    border-radius: var(--radius); font-size: 12px; cursor: pointer; transition: var(--transition);
  }
  .lock-alert:hover { background: #FEE2E2; }
  .lock-alert .lock-count { font-weight: 700; color: var(--danger); }
  .lock-alert .lock-text { color: #991B1B; flex: 1; }

  /* Quick Actions */
  .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .quick-card {
    background: #fff; border-radius: var(--radius-lg); padding: 16px 12px;
    text-align: center; cursor: pointer; transition: var(--transition);
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .quick-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
  .quick-card .qc-icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .quick-card .qc-icon.blue { background: #EFF6FF; color: var(--primary); }
  .quick-card .qc-icon.green { background: #ECFDF5; color: var(--success); }
  .quick-card .qc-icon.amber { background: #FFFBEB; color: #D97706; }
  .quick-card .qc-icon.purple { background: #F5F3FF; color: #7C3AED; }
  .quick-card .qc-icon.teal { background: #F0FDFA; color: #0D9488; }
  .quick-card .qc-icon.rose { background: #FFF1F2; color: #E11D48; }
  .quick-card .qc-title { font-size: 12px; font-weight: 600; color: var(--text); }
  .quick-card .qc-desc { font-size: 10px; color: var(--text-light); }

  /* Ethics */
  .ethics-box {
    background: #fff; border-radius: var(--radius-lg); padding: 24px;
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .ethics-notice {
    font-size: 13px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 20px;
    display: flex; gap: 8px;
  }
  .ethics-notice .warn-icon { color: var(--warning); font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .ethics-actions { display: flex; gap: 16px; }
  .ethics-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 24px; border-radius: var(--radius); cursor: pointer;
    transition: var(--transition); text-decoration: none; gap: 8px; border: 1.5px solid transparent;
  }
  .ethics-btn.primary {
    background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
    color: #fff; border-color: transparent;
  }
  .ethics-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(30,64,175,0.3); }
  .ethics-btn.secondary {
    background: #fff; color: var(--text); border-color: var(--border);
  }
  .ethics-btn.secondary:hover { border-color: var(--accent); color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
  .ethics-btn .eb-icon { font-size: 28px; }
  .ethics-btn .eb-title { font-size: 14px; font-weight: 600; }
  .ethics-btn .eb-desc { font-size: 12px; opacity: 0.8; }

  /* Announcements */
  .announce-list {
    background: #fff; border-radius: var(--radius-lg);
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .announce-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    cursor: pointer; transition: var(--transition);
    border-bottom: 1px solid #F1F5F9; text-decoration: none; color: inherit;
  }
  .announce-item:last-child { border-bottom: none; }
  .announce-item:hover { background: #F8FAFC; }
  .announce-item .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .announce-item .read-dot { width: 8px; flex-shrink: 0; }
  .announce-title { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); }
  .announce-item:hover .announce-title { color: var(--primary); }
  .announce-meta { font-size: 11px; color: var(--text-light); display: flex; gap: 12px; white-space: nowrap; }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    padding: 12px 28px; border-radius: var(--radius); color: #fff;
    font-size: 14px; font-weight: 500; z-index: 9999;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
    box-shadow: var(--shadow-lg);
  }
  .toast.success { background: var(--success); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

  /* Responsive */
  @media (max-width: 1200px) {
    .todo-quick-row { flex-direction: column; }
    .quick-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { margin-left: 0; }
    .quick-grid { grid-template-columns: repeat(2, 1fr); }
    .ethics-actions { flex-direction: column; }
    .topnav-title { font-size: 14px; }
  }
</style>
</head>
<body>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 48 48" fill="none"><rect x="4" y="20" width="8" height="22" rx="2" fill="rgba(255,255,255,0.95)"/><rect x="14" y="14" width="8" height="28" rx="2" fill="rgba(255,255,255,0.85)"/><rect x="24" y="6" width="8" height="36" rx="2" fill="rgba(255,255,255,0.95)"/><rect x="34" y="10" width="8" height="32" rx="2" fill="rgba(255,255,255,0.75)"/><circle cx="38" cy="10" r="6" fill="#fff" opacity="0.5"/><path d="M36.5 8.5L39.5 11.5L42 8" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <span class="topnav-title">柳州教育人事管理平台</span>
  </div>
  <div class="topnav-right">
    <div class="topnav-bell" id="bellBtn" onclick="toggleMsgPopover()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge" id="bellBadge">3</span>

    <div class="topnav-user" onclick="toggleUserMenu()">
      <div class="avatar" id="userAvatar">张</div>
      <span id="userName">张建国</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="user-dropdown" id="userDropdown">
        <a href="#">👤 个人中心</a>
        <a href="#">🔑 修改密码</a>
        <div class="divider"></div>
        <a href="login-demo.html" class="logout">退出登录</a>
      </div>
    </div>
  </div>
</nav>

<!-- ===== MESSAGE POPOVER ===== -->
<div class="msg-popover" id="msgPopover">
  <div class="msg-popover-header"><span>消息通知</span><span style="font-size:11px;color:var(--text-light);">共5条</span></div>
  <div class="msg-list">
    <div class="msg-item unread"><span class="msg-dot"></span><div><div class="msg-item-title">入编申请（张三）待您审批</div><div class="msg-item-time">5分钟前</div></div></div>
    <div class="msg-item unread"><span class="msg-dot"></span><div><div class="msg-item-title">岗位晋升（李四）待您审批</div><div class="msg-item-time">1小时前</div></div></div>
    <div class="msg-item unread"><span class="msg-dot"></span><div><div class="msg-item-title">招聘计划审批已退回</div><div class="msg-item-time">3小时前</div></div></div>
    <div class="msg-item read"><span class="msg-dot"></span><div><div class="msg-item-title">退休呈报（王五）已通过</div><div class="msg-item-time">昨天</div></div></div>
    <div class="msg-item read"><span class="msg-dot"></span><div><div class="msg-item-title">系统将于本周六升级维护</div><div class="msg-item-time">2天前</div></div></div>
  </div>
  <div class="msg-popover-footer"><a href="#">查看全部消息 →</a></div>
</div>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-menu" id="sidebarMenu">
    <!-- Filled by JS based on role -->
  </div>

  <!-- Role Switcher -->
  <div class="role-switcher" id="roleSwitcher">
    <div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options">
      <button class="role-switch-btn active" data-role="city" onclick="switchRole('city')">

  account: 'users', org: 'building', perm: 'key', log: 'list'
};

let currentRole = 'city';

// ===== RENDER =====
function renderSidebar() {
  var data = ROLES[currentRole].sidebar;
  var html = '';

  // Top items
  data.top.forEach(function(item) {
    html += '<a class="menu-item' + (item.active ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">';
    html += ICONS[item.icon];
    html += '<span class="menu-label">' + item.label + '</span>';
    html += '</a>';
  });

  // Groups
  data.groups.forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      html += '<a class="menu-item" onclick="sidebarClick(this,\'' + item.id + '\')">';
      html += ICONS[MENU_ICONS[item.id] || 'file'];
      html += '<span class="menu-label">' + item.label + '</span>';
      if (item.badge) html += '<span class="menu-badge">' + item.badge + '</span>';
      html += '</a>';
    });
  });

  document.getElementById('sidebarMenu').innerHTML = html;
}

function renderMain() {
  var data = ROLES[currentRole];

  // Welcome
  document.getElementById('welcomeGreeting').textContent = '👋 ' + data.greeting;
  document.getElementById('welcomeOrg').textContent = data.org + ' · ' + data.role;
  document.getElementById('userName').textContent = data.name;
  document.getElementById('userAvatar').textContent = data.short;

  // Todo area
  var todoHtml = '';
  var reminderTodo = getReminderTodo();
  var allTodos = reminderTodo ? [reminderTodo].concat(data.todos) : data.todos;
  if (allTodos.length === 0) {
    todoHtml = '<div class="todo-empty">暂无待办事项</div>';
  } else {
    todoHtml = '<div class="todo-module-list">';
    allTodos.forEach(function(t) {
      var targetUrl = '#';
      if (t.reminder) { targetUrl = 'post-list-school.html'; }
      else if (t.mod === '编制使用申请') targetUrl = 'staffing-application.html';
      else if (t.mod === '入编申请') targetUrl = getEntryUrl();
      var nameHtml = t.reminder ? '<div class="todo-module-name" style="color:var(--danger);">' + t.mod + '<small>' + t.group + ' · 主管单位提醒您尽快提交岗位设置申请</small></div>' : '<div class="todo-module-name">' + t.mod + '<small>' + t.group + '</small></div>';
      todoHtml += '<a class="todo-module-item" href="' + targetUrl + '" onclick="' + (targetUrl !== '#' ? '' : 'event.preventDefault();showToast(\'跳转至' + t.mod + ' — 待审批列表\')') + '">';
      todoHtml += '<div class="todo-module-icon ' + t.iclass + '">' + t.icon + '</div>';
      todoHtml += nameHtml;
      var totalPending = (t.pending || 0) + (t.review || 0) + (t.reject || 0);
      todoHtml += '<div class="todo-counts">';
      todoHtml += '<div class="todo-count-item count-pending"><div class="count-num">' + totalPending + '</div><div class="count-label">待处理</div></div>';
      todoHtml += '</div><span class="todo-module-arrow">→</span></a>';
    });
    todoHtml += '</div>';
  }
  if (data.lockCount > 0) {
    todoHtml += '<div class="lock-alert" onclick="showToast(\'跳转至账号管理\')"><span>🔒</span><span class="lock-count">' + data.lockCount + '</span><span class="lock-text">个账号因异常被锁定，请及时处理</span><span style="color:var(--danger);font-size:12px;">立即处理 →</span></div>';
  }
  document.getElementById('todoArea').innerHTML = todoHtml;

  // Quick actions
  var quickHtml = '';
  data.quickActs.forEach(function(q) {
    var qUrl = getQuickActionUrl(q.label);
    quickHtml += '<div class="quick-card" onclick="' + (qUrl ? "window.location.href='" + qUrl + "'" : "showToast('跳转至" + q.label + "')") + '">';
    quickHtml += '<div class="qc-icon ' + q.clr + '">' + q.icon + '</div>';
    quickHtml += '<div class="qc-title">' + q.label + '</div>';
    quickHtml += '<div class="qc-desc">' + q.desc + '</div>';
    quickHtml += '</div>';
  });
  document.getElementById('quickArea').innerHTML = quickHtml;

  // Ethics
  var eb = data.ethicsBtn;
  document.getElementById('ethicsArea').innerHTML =
    '<div class="ethics-notice"><span class="warn-icon">⚠️</span><span>如发现教师存在违反师德师风的行为，请通过此通道进行举报。举报信息将严格保密，仅处理该举报的管理员可见。支持实名举报和匿名举报，匿名举报需提供充分证据。</span></div>' +
    '<div class="ethics-actions">' +
    '<a class="ethics-btn primary" href="#" onclick="event.preventDefault();showToast(\'跳转至师德师风举报新建页\')"><span class="eb-icon">📝</span><span class="eb-title">' + eb.primary + '</span><span class="eb-desc">' + eb.pdesc + '</span></a>' +
    '<a class="ethics-btn secondary" href="#" onclick="event.preventDefault();showToast(\'跳转至举报记录列表\')"><span class="eb-icon">📋</span><span class="eb-title">' + eb.secondary + '</span><span class="eb-desc">' + eb.sdesc + '</span></a>' +
    '</div>';

  // Announcements
  var annHtml = '';
  data.announcements.forEach(function(a) {
    annHtml += '<a class="announce-item" href="#" onclick="event.preventDefault();showToast(\'打开公告详情\')">';
    annHtml += '<span class="' + (a.unread ? 'unread-dot' : 'read-dot') + '"></span>';
    annHtml += '<span class="announce-title">' + a.title + '</span>';
    annHtml += '<span class="announce-meta"><span>' + a.date + '</span><span>' + a.source + '</span></span>';
    annHtml += '</a>';
  });
  document.getElementById('announceArea').innerHTML = annHtml;
}

// ===== ROLE SWITCH =====
function switchRole(role) {
  currentRole = role;
  renderSidebar();
  renderMain();
  // Update role switcher active state
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === role);
  });
  showToast('已切换至：' + ROLES[role].role + ' — ' + ROLES[role].name);
}

// ===== Sidebar menu click =====
function getEntryUrl() {
  if (currentRole === 'city' || currentRole === 'district') return '教师入编管理（主管单位视角）.html';
  if (currentRole === 'school') return '教师入编管理（学校管理员视角）.html';
  return null;
}

function getExitUrl() {
  if (currentRole === 'city' || currentRole === 'district') return '教师出编管理（主管单位视角）.html';
  if (currentRole === 'school') return '教师出编管理（学校管理员视角）.html';
  return null;
}

function getPostUrl() {
  if (currentRole === 'city' || currentRole === 'district') return 'post-list-admin.html?role=' + currentRole;
  if (currentRole === 'school') return 'post-list-school.html';
  return null;
}

function loadReminders() { try { return JSON.parse(localStorage.getItem('post_reminders') || '{}'); } catch(e) { return {}; } }

function getReminderTodo() {
  if (currentRole !== 'school') return null;
  var data = ROLES[currentRole];
  var reminders = loadReminders();
  var r = reminders[data.org];
  if (r && r.read === false) {
    return { mod: '岗位设置申请提醒', group: '岗位管理', icon: '📋', iclass: 'blue', pending: 1, review: 0, reject: 0, reminder: true };
  }
  return null;
}

function getQuickActionUrl(label) {
  if (label === '入编申请') return getEntryUrl();
  return null;
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; }
  else if (id === 'staffing') { window.location.href = 'staffing-application.html'; }
  else if (id === 'entry') { var url = getEntryUrl(); if (url) window.location.href = url; else showToast('跳转至：入编申请'); }
  else if (id === 'exit') { var url = getExitUrl(); if (url) window.location.href = url; else showToast('跳转至：教师出编管理'); }
  else if (id === 'postset') { var url = getPostUrl(); if (url) window.location.href = url; else showToast('跳转至：岗位设置申请'); }
  else { showToast('跳转至：' + el.textContent.trim()); }
}

// ===== Sidebar toggle =====
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ===== Popups =====
function toggleUserMenu() {
  document.getElementById('userDropdown').classList.toggle('show');
  document.getElementById('msgPopover').classList.remove('show');
}
function toggleMsgPopover() {
  document.getElementById('msgPopover').classList.toggle('show');
  document.getElementById('userDropdown').classList.remove('show');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.topnav-user')) document.getElementById('userDropdown').classList.remove('show');
  if (!e.target.closest('.topnav-bell')) document.getElementById('msgPopover').classList.remove('show');
});

// ===== Toast =====
function showToast(msg) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast success'; t.textContent = msg;
  c.appendChild(t);
  setTimeout(function() { t.remove(); }, 2200);
}

// ===== Init =====
renderSidebar();
renderMain();
</script>

</body>
</html>
