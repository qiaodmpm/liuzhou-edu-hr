<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退休呈报 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topnav { position: fixed; top:0; left:0; right:0; height:56px; background:linear-gradient(135deg,#1E3A8A,#1E40AF); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display:flex; align-items:center; gap:14px; }
.topnav-logo { width:38px; height:38px; background:rgba(255,255,255,0.18); border-radius:10px; display:flex; align-items:center; justify-content:center; }
.topnav-logo svg { width:24px; height:24px; }
.topnav-title { font-size:17px; font-weight:600; color:#fff; letter-spacing:1px; }
.topnav-right { display:flex; align-items:center; gap:18px; }
.topnav-bell { position:relative; cursor:pointer; color:rgba(255,255,255,0.85); padding:6px; border-radius:6px; transition:var(--transition); }
.topnav-bell:hover { background:rgba(255,255,255,0.1); color:#fff; }
.topnav-bell .badge { position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.topnav-user { display:flex; align-items:center; gap:8px; cursor:pointer; color:rgba(255,255,255,0.9); padding:6px 12px; border-radius:6px; transition:var(--transition); font-size:13px; position:relative; }
.topnav-user:hover { background:rgba(255,255,255,0.1); }
.topnav-user .avatar { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
.user-dropdown { display:none; position:absolute; top:46px; right:0; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-lg); min-width:160px; z-index:200; overflow:hidden; }
.user-dropdown.show { display:block; }
.user-dropdown a { display:block; padding:12px 18px; font-size:13px; color:var(--text); text-decoration:none; transition:var(--transition); }
.user-dropdown a:hover { background:var(--primary-light); color:var(--primary); }
.sidebar { position:fixed; top:56px; left:0; bottom:0; width:var(--sidebar-w); background:#1E3A8A; z-index:90; overflow-y:auto; display:flex; flex-direction:column; }
.sidebar-menu { flex:1; padding:8px 0; }
.menu-group { padding:14px 20px 4px; font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1px; }
.menu-item { display:flex; align-items:center; padding:10px 20px; cursor:pointer; font-size:13px; color:rgba(255,255,255,0.7); transition:var(--transition); text-decoration:none; border-left:3px solid transparent; }
.menu-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
.menu-item.active { background:rgba(255,255,255,0.08); color:#fff; font-weight:500; border-left-color:var(--accent); }
.menu-item .menu-icon { width:18px; height:18px; margin-right:10px; flex-shrink:0; opacity:0.7; }
.menu-item.active .menu-icon { opacity:1; }
.role-switcher { padding:10px 16px 12px; border-top:1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:1px; margin-bottom:8px; }
.role-switcher-options { display:flex; flex-direction:column; gap:4px; }
.role-switch-btn { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:12px; color:rgba(255,255,255,0.55); transition:var(--transition); border:1px solid transparent; background:transparent; font-family:inherit; width:100%; text-align:left; }
.role-switch-btn:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.8); }
.role-switch-btn.active { background:rgba(59,130,246,0.2); color:#fff; border-color:rgba(59,130,246,0.4); font-weight:500; }
.role-switch-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.role-switch-dot.city { background:#3B82F6; } .role-switch-dot.district { background:#F59E0B; } .role-switch-dot.school { background:#10B981; }
.main { margin-left:var(--sidebar-w); margin-top:56px; padding:24px; min-height:calc(100vh - 56px); }
.breadcrumb { font-size:12px; color:var(--text-light); margin-bottom:16px; }
.breadcrumb a { color:var(--text-light); text-decoration:none; }
.breadcrumb a:hover { color:var(--primary); }
.page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.page-header h1 { font-size:20px; font-weight:700; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; font-size:13px; font-weight:500; border-radius:6px; cursor:pointer; font-family:inherit; transition:var(--transition); border:1px solid transparent; text-decoration:none; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { background:var(--primary-dark); }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-outline { background:#fff; color:var(--text-secondary); border:1px solid var(--border); }
.btn-outline:hover { background:var(--gray-bg); }
.btn-success { background:var(--success); color:#fff; }
.filter-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.filter-pill { padding:6px 16px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--border); background:#fff; color:var(--text-secondary); transition:var(--transition); font-family:inherit; }
.filter-pill:hover { border-color:var(--accent); color:var(--primary); }
.filter-pill.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.list-card { background:#fff; border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow-sm); overflow:hidden; }
.list-table { width:100%; border-collapse:collapse; font-size:13px; }
.list-table th { padding:11px 14px; text-align:center; font-weight:600; font-size:11px; color:var(--text-secondary); background:#F8FAFC; border-bottom:1px solid var(--border); }
.list-table td { padding:11px 14px; border-bottom:1px solid var(--border); text-align:center; }
.status-badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:500; }
.status-badge.pending_first { background:#FEF3C7; color:#92400E; }
.status-badge.approved_first { background:#DBEAFE; color:#1E40AF; }
.status-badge.rejected { background:#FEE2E2; color:#991B1B; }
.status-badge.pending_hr { background:#FEF3C7; color:#92400E; }
.status-badge.pending_second { background:#FEF3C7; color:#92400E; }
.status-badge.approved { background:#D1FAE5; color:#065F46; }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-light); }
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#1E293B; color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:9999; animation:toastIn .3s ease; box-shadow:var(--shadow-lg); }
.toast.warning { background:var(--warning); color:#1E293B; }
.toast.success { background:var(--success); }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
</style>
</head>
<body>
<nav class="topnav">
  <div class="topnav-left"><div class="topnav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="1" width="18" height="22" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="12" y2="14"/><line x1="12" y1="18" x2="16" y2="18"/><circle cx="8" cy="18" r="1.5" fill="#fff"/></svg></div><span class="topnav-title">柳州教育人事管理平台</span></div>
  <div class="topnav-right">
    <div class="topnav-bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="badge">1</span></div>
    <div class="topnav-user" onclick="toggleUserMenu()"><div class="avatar" id="userAvatar">王</div><span id="userName">王玉兰</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="user-dropdown" id="userDropdown"><a href="personal-center.html">个人中心</a><div class="divider"></div><a href="index.html" class="logout">退出登录</a></div></div>
  </div>
</nav>
<aside class="sidebar" id="sidebar"><div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="role-switcher"><div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options">
      <button class="role-switch-btn" data-role="city" onclick="switchRole('city')"><span class="role-switch-dot city"></span>市管理员</button>
      <button class="role-switch-btn" data-role="district" onclick="switchRole('district')"><span class="role-switch-dot district"></span>区管理员</button>
      <button class="role-switch-btn active" data-role="school" onclick="switchRole('school')"><span class="role-switch-dot school"></span>校管理员</button>
    </div></div>
</aside>
<main class="main">
  <div class="breadcrumb"><a href="workbench.html">首页</a> &nbsp;/&nbsp; <span>退休呈报</span></div>
  <div class="page-header"><div><h1>退休呈报</h1></div><button class="btn btn-primary" onclick="location.href='retire-form.html'">+ 新建申报</button></div>
  <div class="filter-bar" id="filterBar"></div>
  <div id="recordList"></div>
</main>
<div id="toastContainer"></div>
<script src="src/menu-config.js"></script>
<script>
window.onerror = function(msg,url,line){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#FEE2E2;color:#991B1B;padding:16px 20px;font-family:monospace;font-size:13px;';d.innerHTML='ERROR: '+msg+' (line '+line+')<br><button onclick="location.reload()" style="margin-top:8px;padding:6px 16px;cursor:pointer;">重新加载</button>';document.body.prepend(d);};
var currentRole='school',currentSchool='柳州市第八中学',currentDistrict='鱼峰区',currentFilter='all';
var STATUS_MAP={pending_first:'待初审',approved_first:'初审通过',rejected:'已驳回',pending_hr:'待人社会结果录入',pending_second:'待二审',approved:'已完成'};
function escapeHtml(s){if(s===undefined||s===null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(m,t){var e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;document.getElementById('toastContainer').appendChild(e);setTimeout(function(){e.remove();},2200);}
function toggleUserMenu(){document.getElementById('userDropdown').classList.toggle('show');}
document.addEventListener('click',function(e){if(!e.target.closest('.topnav-user'))document.getElementById('userDropdown').classList.remove('show');});
function switchRole(role){if(role==='school')return;if(role==='city'||role==='district'){window.location.href='retire-list-admin.html?role='+role;return;}}
function loadRecords(){var s=localStorage.getItem('retire_records');try{return JSON.parse(s)||[];}catch(e){return[];}}
function saveRecords(r){localStorage.setItem('retire_records',JSON.stringify(r));}
function seedDemo(){
  return [{id:'RT20260701001',schoolName:'柳州市第八中学',district:'鱼峰区',status:'pending_first',submitTime:'2026-07-10 09:20:00',teacherName:'张美华',gender:'女',birthDate:'1971-05-15',idCard:'450203197105152345'},
    {id:'RT20260701002',schoolName:'柳州市第八中学',district:'鱼峰区',status:'approved_first',submitTime:'2026-07-05 10:30:00',teacherName:'刘国强',gender:'男',birthDate:'1966-03-20',idCard:'450203196603202345'},
    {id:'RT20260601001',schoolName:'柳州市第八中学',district:'鱼峰区',status:'rejected',submitTime:'2026-06-15 14:00:00',teacherName:'陈秀兰',gender:'女',birthDate:'1971-08-22',idCard:'450203197108223456',rejectReason:'档案年龄材料不清晰，请重新上传'},
    {id:'RT20260620001',schoolName:'柳州市第八中学',district:'鱼峰区',status:'approved',submitTime:'2026-06-20 08:45:00',teacherName:'赵志远',gender:'男',birthDate:'1966-01-10',idCard:'450203196601101234'}];
}
function renderList(){
  var records=loadRecords();
  if(records.length===0){records=seedDemo();saveRecords(records);}
  records=records.filter(function(r){return r.schoolName===currentSchool;});
  var counts={all:records.length,pending_first:0,approved_first:0,rejected:0,pending_hr:0,pending_second:0,approved:0};
  records.forEach(function(r){if(counts[r.status]!==undefined)counts[r.status]++;});
  var filters=[{key:'all',label:'全部('+counts.all+')'},{key:'pending_first',label:'待初审('+counts.pending_first+')'},{key:'approved_first',label:'初审通过('+counts.approved_first+')'},{key:'rejected',label:'已驳回('+counts.rejected+')'},{key:'pending_hr',label:'待人社会结果录入('+counts.pending_hr+')'},{key:'pending_second',label:'待二审('+counts.pending_second+')'},{key:'approved',label:'已完成('+counts.approved+')'}];
  var fb=document.getElementById('filterBar');fb.innerHTML='';
  filters.forEach(function(f){var b=document.createElement('button');b.className='filter-pill'+(currentFilter===f.key?' active':'');b.textContent=f.label;b.onclick=function(){currentFilter=f.key;renderList();};fb.appendChild(b);});
  if(currentFilter!=='all')records=records.filter(function(r){return r.status===currentFilter;});
  var list=document.getElementById('recordList');
  if(records.length===0){list.innerHTML='<div class="list-card"><div class="empty-state"><div class="empty-icon">&#128196;</div><div class="empty-text">暂无退休申报记录</div></div></div>';return;}
  var h='<div class="list-card"><div class="table-scroll"><table class="list-table"><thead><tr><th>申请编号</th><th>教师姓名</th><th>性别</th><th>出生日期</th><th>提交时间</th><th>状态</th><th style="width:160px;">操作</th></tr></thead><tbody>';
  records.forEach(function(r){
    h+='<tr><td style="color:var(--primary);font-weight:600;">'+escapeHtml(r.id)+'</td><td>'+escapeHtml(r.teacherName||'—')+'</td><td>'+escapeHtml(r.gender||'—')+'</td><td>'+escapeHtml(r.birthDate||'—')+'</td><td style="font-size:12px;">'+escapeHtml(r.submitTime||'—')+'</td><td><span class="status-badge '+r.status+'">'+(STATUS_MAP[r.status]||r.status)+'</span></td><td style="white-space:nowrap;">';
    if(r.status==='rejected')h+='<button class="btn btn-primary btn-sm" onclick="location.href=\'retire-form.html?id='+r.id+'\'">修改重提</button> ';
    if(r.status==='approved_first')h+='<button class="btn btn-success btn-sm" onclick="location.href=\'retire-hr-entry.html?id='+r.id+'\'">录入人社结果</button> ';
    h+='<button class="btn btn-outline btn-sm" onclick="location.href=\'retire-detail.html?id='+r.id+'&role=school\'">查看</button></td></tr>';
  });
  h+='</tbody></table></div></div>';list.innerHTML=h;
}
renderSidebarMenu('sidebarMenu',currentRole,'retire');
renderList();
</script>
</body>
</html>
