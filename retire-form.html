function fg(label,type,id,defVal,options,placeholder,maxlen,extra){defVal=defVal||'';options=options||'';placeholder=placeholder||'';maxlen=maxlen||'';extra=extra||'';
  var h='<div class="form-group"><label>'+label+'</label>';
  if(type==='select')h+='<select id="'+id+'" '+extra+'>'+options+'</select>';
  else if(type==='calc')h+='<div class="calc" id="'+id+'">'+defVal+'</div>';
  else h+='<input type="'+type+'" id="'+id+'" value="'+escapeHtml(defVal)+'" placeholder="'+placeholder+'" '+(maxlen?'maxlength="'+maxlen+'"':'')+' '+extra+'>';
  h+='</div>';return h}
function setVal(id,v){var el=document.getElementById(id);if(el)el.value=v||''}
function getVal(id){var el=document.getElementById(id);return el?el.value.trim():''}

function updateCalculations(){
  var ps=parseFloat(getVal('f_postSalary'))||0,ls=parseFloat(getVal('f_levelSalary'))||0,ts=parseFloat(getVal('f_teachSubsidy'))||0;
  var subEl=document.getElementById('f_subtotal');if(subEl)subEl.textContent=(ps+ls+ts).toFixed(2);
  var bd=getVal('f_birthDate'),rd=getVal('f_retireDate');
  if(bd&&rd){var b=new Date(bd),r=new Date(rd);var age=r.getFullYear()-b.getFullYear();if(r.getMonth()<b.getMonth()||(r.getMonth()===b.getMonth()&&r.getDate()<b.getDate()))age--;var ageEl=document.getElementById('f_age');if(ageEl)ageEl.textContent=age+' 岁'}
  var ws=getVal('f_workStart');if(ws&&rd){var w=new Date(ws),r=new Date(rd);var yy=r.getFullYear()-w.getFullYear(),mm=r.getMonth()-w.getMonth();if(mm<0){yy--;mm+=12}var wyEl=document.getElementById('f_workYears');if(wyEl)wyEl.textContent=yy+'年'+mm+'个月'}
  var rr=parseFloat(getVal('f_retireRatio'))||0,lif=parseFloat(getVal('f_lifeSubsidy'))||0,ex=parseFloat(getVal('f_extraRetire'))||0,ta=parseFloat(getVal('f_teachAllowance'))||0,ot=parseFloat(getVal('f_other'))||0;
  var baseSal=ps+ls+ts;var mr=baseSal*(rr/100)+lif+ex+ta+ot;
  var mrEl=document.getElementById('f_monthRetire');if(mrEl)mrEl.textContent=mr.toFixed(2)
}

function submitForm(){
  var data={teacherName:getVal('f_name'),gender:getVal('f_gender'),birthDate:getVal('f_birthDate'),idCard:getVal('f_idCard'),education:getVal('f_education'),politics:getVal('f_politics'),nativeProvince:getVal('f_nativeProvince'),nativeCity:getVal('f_nativeCity'),nativeDistrict:getVal('f_nativeDistrict'),schoolName:getVal('f_schoolName')||currentSchool,retireType:getVal('f_retireType'),retireDate:getVal('f_retireDate'),personType:getVal('f_personType'),post:getVal('f_post'),salaryLevel:getVal('f_salaryLevel'),postSalary:getVal('f_postSalary'),levelSalary:getVal('f_levelSalary'),teachSubsidy:getVal('f_teachSubsidy'),workStart:getVal('f_workStart'),teachYears:getVal('f_teachYears'),lastChangeTime:getVal('f_lastChangeTime'),retireRatio:getVal('f_retireRatio'),lifeSubsidy:getVal('f_lifeSubsidy'),extraRetire:getVal('f_extraRetire'),teachAllowance:getVal('f_teachAllowance'),other:getVal('f_other'),retirePersonType:getVal('f_retirePersonType'),retirePostSalary:getVal('f_retirePostSalary'),retireLevelSalary:getVal('f_retireLevelSalary'),retireLastChange:getVal('f_retireLastChange'),retirePostLevel:getVal('f_retirePostLevel'),politicalIssue:getVal('f_politicalIssue'),resumeRows:JSON.parse(JSON.stringify(resumeRows)),spouseRows:JSON.parse(JSON.stringify(spouseRows))};
  if(!data.teacherName){showToast('请填写姓名','warning');return}if(!data.gender){showToast('请选择性别','warning');return}
  if(!data.birthDate){showToast('请选择出生日期','warning');return}if(!data.retireDate){showToast('请选择退休日期','warning');return}
  if(!data.idCard||!/^\d{17}[\dXx]$/.test(data.idCard)){showToast('身份证号格式不正确','warning');return}

  // serialize materials
  var mats={};ATTACH_MATERIALS.forEach(function(item){
    var v=materialFiles[item];if(item===MULTI_FILE_MATERIAL){if(Array.isArray(v)&&v.length>0)mats[item]=v.map(function(f){return{name:f.name,size:f.size}})}
    else{if(v)mats[item]={name:v.name,size:v.size}}
  });data.materials=mats;

  var all=loadRecords(),now=new Date(),ts=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());

  if(editRecordId){

  }
  var datePart=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate());
  var stored=JSON.parse(localStorage.getItem('retire_seq')||'{"date":"","seq":0}');
  if(stored.date!==datePart){stored.date=datePart;stored.seq=0}stored.seq++;localStorage.setItem('retire_seq',JSON.stringify(stored));
  var newId='RT'+datePart+pad3(stored.seq);
  var rec=Object.assign({id:newId,schoolName:currentSchool,district:currentDistrict,status:'pending_first',submitTime:ts,rejectReason:''},data);
  all.unshift(rec);saveRecords(all);
  showToast('退休呈报已提交，等待审核','success');setTimeout(function(){window.location.href='retire-list-school.html'},1500)
}

/* ---------- edit mode ---------- */
function loadForEdit(id){var all=loadRecords();for(var i=0;i<all.length;i++){if(all[i].id===id){editRecordId=id;window._editData=all[i];if(all[i].resumeRows)resumeRows=all[i].resumeRows;if(all[i].spouseRows)spouseRows=all[i].spouseRows;if(all[i].materials){var mats=all[i].materials;ATTACH_MATERIALS.forEach(function(item){var v=mats[item];if(item===MULTI_FILE_MATERIAL&&Array.isArray(v)){materialFiles[item]=v.map(function(f){return{name:f.name,size:f.size}})}else if(v&&!Array.isArray(v)){materialFiles[item]={name:v.name,size:v.size}}})}break}}}

function sidebarClick(el,id){
  if(arguments.length===1){id=el;el=null;}
  if(id==='retire'){window.location.href='retire-list-school.html';return;}
  if(id==='workbench'){window.location.href='workbench.html';return;}
  if(id==='ledger'){window.location.href='org-ledger-school.html';return;}
  if(id==='staffing'){window.location.href='staffing-application.html';return;}
  if(id==='entry'){window.location.href='教师入编管理（学校管理员视角）.html';return;}
  if(id==='exit'){window.location.href='教师出编管理（学校管理员视角）.html';return;}
  if(id==='postset'){window.location.href='post-list-school.html';return;}
  if(id==='promote'){window.location.href='promote-list-school.html';return;}
  if(id==='recruit'){window.location.href='recruit-list-school.html';return;}
  if(id==='employ'){window.location.href='employ-list-school.html';return;}
  if(id==='contract-entry'){window.location.href='contract-entry-list-school.html';return;}
  if(id==='contract-exit'){window.location.href='contract-exit-list-school.html';return;}
  if(id==='ethics'){showToast('师德师风举报页面开发中');return;}
  if(id==='account'){window.location.href='account-management.html';return;}
  if(id==='org'){window.location.href='org-management.html';return;}
  if(id==='announcement'){window.location.href='announcement-management.html';return;}
  showToast('跳转至：'+(el?el.textContent:id));
}
(function init(){
  renderSidebarMenu('sidebarMenu',currentRole,'retire');
  var p=new URLSearchParams(window.location.search);var id=p.get('id');
  if(id)loadForEdit(id);
  renderForm();
})();
</script>
