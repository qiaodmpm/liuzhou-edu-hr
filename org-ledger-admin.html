function backfillAllChangeLogs() {
  var changed = false;
  Object.keys(allLedgers).forEach(function(k) {
    var d = allLedgers[k];
    if (!d.changeLog) d.changeLog = [];
    if (d.changeLog.length > 0) return;
    if (d.submittedAt) {
      d.changeLog.push({ type:'submit', time:d.submittedAt+' 00:00:00', operator:d.schoolName||'', action:'学校提交申报' });
    }
    if (d.returnReason) {
      d.changeLog.push({ type:'return', time:(d.updatedAt||d.submittedAt||'')+' 00:00:00', operator:d.updatedBy||d.reviewedBy||'', action:'退回修改', reason:d.returnReason });
    }
    if (d.status==='active' && d.reviewedAt) {
      d.changeLog.push({ type:'approve', time:d.reviewedAt+' 00:00:00', operator:d.reviewedBy||'', action:'审核通过' });
    }
    if (d.changeLog.length > 0) changed = true;
  });
  if (changed) saveLedgers();
}

var REGION_CODE = { '柳城县':'01','鹿寨县':'02','融安县':'03','融水县':'04','三江县':'05','柳北区':'06','城中区':'07','鱼峰区':'08','柳南区':'09','柳江区':'10','市直属':'00' };

function ensureSchoolIds() {
  // Group schools by district, assign sequential IDs within each region
  var regionCounters = {};
  var schools = Object.keys(allLedgers).sort();
  var changed = false;
  schools.forEach(function(k) {
    var d = allLedgers[k];
    var prefix = 'gxlj-' + (REGION_CODE[d.district] || '00');
    if (!regionCounters[prefix]) regionCounters[prefix] = 0;

    // Only assign if schoolId is old format or missing
    var needsNew = !d.schoolId || d.schoolId.indexOf('SCH-') === 0 || d.schoolId.indexOf('gxlj-') !== 0;
    if (needsNew) {
      regionCounters[prefix]++;
      d.schoolId = prefix + '-' + String(regionCounters[prefix]).padStart(3, '0');
      changed = true;
    } else {
      // Track max existing number for this region
      var parts = d.schoolId.split('-');
      if (parts.length === 3) {
        var seq = parseInt(parts[2]);
        if (seq >= regionCounters[prefix]) regionCounters[prefix] = seq;
      }
    }
  });
  if (changed) saveLedgers();
}

// ===== SIDEBAR =====
function renderSidebar() {
  var role = currentUser.role || 'city';
  var cfg = ROLES[role];
  if (!cfg) cfg = ROLES.city;
  var h = '';
  (cfg.sidebar.top||[]).forEach(function(item) {
    var icon = ICONS[item.icon] || '';
    var active = item.id === 'ledger';
    h += '<a class="menu-item' + (active ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + icon + item.label + '</a>';
  });
  (cfg.sidebar.groups||[]).forEach(function(group) {
    h += '<div class="menu-group">' + group.name + '</div>';
    (group.items||[]).forEach(function(item) {
      var icon = ICONS[MENU_ICONS[item.id]] || '';
      var badge = item.badge ? '<span class="menu-badge">' + item.badge + '</span>' : '';
      h += '<a class="menu-item" onclick="sidebarClick(this,\'' + item.id + '\')">' + icon + item.label + badge + '</a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = h;
  document.getElementById('userName').textContent = cfg.name;
  document.getElementById('userAvatar').textContent = cfg.short;
  document.querySelectorAll('.role-switch-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.role === role); });
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; }
  else if (id === 'ledger') { window.location.href = currentUser.role === 'city' || currentUser.role === 'district' ? 'org-ledger-admin.html' : 'org-ledger-school.html'; }
  else if (id === 'staffing') { window.location.href = 'staffing-application.html'; }
  else if (id === 'entry') { window.location.href = '教师入编管理（主管单位视角）.html'; }
  else if (id === 'exit') { window.location.href = '教师出编管理（主管单位视角）.html'; }
  else if (id === 'postset') { window.location.href = 'post-list-admin.html'; }
  else if (id === 'promote') { window.location.href = 'promote-list-admin.html'; }
  else if (id === 'recruit') { window.location.href = 'recruit-list-admin.html'; }
  else if (id === 'employ') { window.location.href = 'employ-list-admin.html'; }
  else if (id === 'retire') { showToast('跳转至：退休呈报'); }
  else if (id === 'salary') { showToast('跳转至：工资核定申请'); }
  else if (id === 'ethics') { showToast('跳转至：师德师风举报'); }
  else if (id === 'honor') { showToast('跳转至：荣誉申请'); }
  else if (id === 'account') { window.location.href = 'account-management.html'; }
  else { showToast('跳转至：' + el.textContent.trim()); }
}

function switchRole(role) {
  var cfg = ROLES[role];
  currentUser = { role: role, name: cfg.name, id: role === 'city' ? 'C001' : role === 'district' ? 'D001' : role === 'school' ? 'S001' : 'T001', district: cfg.district || '', schoolName: role === 'school' ? '柳州市第八中学' : '' };
  localStorage.setItem('currentUser', JSON.stringify(currentUser));
  if (role === 'school') { window.location.href = 'org-ledger-school.html'; return; }
  if (role === 'teacher') { window.location.href = 'workbench.html'; return; }
  // city/district role: reload current page with new user
  allLedgers = JSON.parse(localStorage.getItem('org_ledger') || '{}');
  mergeDemoData();
  renderSidebar();
  renderList();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ===== COMPUTED =====
function getComputed(d) {
  var careerUnusedPlan = d.careerApprovedPlan - d.careerUsedPlan;
  var careerAvailable = d.careerQuota - d.careerActual - d.careerApprovedPlan;
  var controlUnusedPlan = d.controlApprovedPlan - d.controlUsedPlan;
  var controlAvailable = d.controlQuota - d.controlActual - d.controlApprovedPlan;
  var totalControlQuota = d.careerQuota + d.controlQuota;
  var totalPosts = totalControlQuota - (d.highlandPosts || 0);
  return {
    careerUnusedPlan: careerUnusedPlan, careerAvailable: careerAvailable,
    controlUnusedPlan: controlUnusedPlan, controlAvailable: controlAvailable,
    totalControlQuota: totalControlQuota, totalPosts: totalPosts
  };
}

// ===== RENDER LIST =====
function renderList() {
  var schools = Object.keys(allLedgers).sort();
  // Calculate summary
  var totalCareer = 0, totalControl = 0, totalActual = 0, pendingCount = 0, noLedgerCount = 0;
  schools.forEach(function(k) {
    var d = allLedgers[k];
    totalCareer += d.careerQuota || 0;
    totalControl += d.controlQuota || 0;
    totalActual += d.careerActual || 0;
    if (d.status === 'pending') pendingCount++;
  });
  // Add known schools without ledgers
  var knownSchools = ['柳州市第一中学','柳州市第二中学','柳州高级中学','柳州市民族高中','柳州市第八中学','柳州铁一中学','柳州市第十三中学','柳州市第二十五中学','鱼峰区实验小学','柳州市特色实验高中','鱼峰区机关幼儿园'];
  knownSchools.forEach(function(s) { if (!allLedgers[s]) noLedgerCount++; });

  document.getElementById('pageSubtitle').textContent = '';

  var userDistrict = currentUser.district || '';
  if (currentUser.role === 'district' && userDistrict) { filterDistrict = userDistrict; }

  var REGISTERED_SCHOOLS = ['柳州市第一中学','柳州市第二中学','柳州高级中学','柳州市民族高中','柳州市第八中学','柳州铁一中学','柳州市第十三中学','柳州市第二十五中学','鱼峰区实验小学','柳州市特色实验高中','鱼峰区机关幼儿园','柳州市第三中学','柳州市第六中学','城中区实验小学','柳江区实验中学'];

  // Filter
  filteredLedgers = schools.map(function(k) { return allLedgers[k]; });
  if (currentUser.role === 'district' && userDistrict) {
    filteredLedgers = filteredLedgers.filter(function(d) { return d.district === userDistrict; });
  }
  if (filterStatus === 'pending') {
    filteredLedgers = filteredLedgers.filter(function(d) { return d.status === 'pending' && d.submittedAt; });
  } else if (filterStatus === 'active') {
    filteredLedgers = filteredLedgers.filter(function(d) { return d.status === 'active'; });
  } else if (filterStatus === 'draft') {
    // Include schools without ledger data
    var existingNames = {};
    filteredLedgers = filteredLedgers.filter(function(d) { existingNames[d.schoolName]=true; return !d.submittedAt; });
    if (filterDistrict === 'all' || filterDistrict === '') {
      REGISTERED_SCHOOLS.forEach(function(s) {
        if (!existingNames[s]) {
          var region = '';
          // Infer district from demo data or school name
          if (s.indexOf('鱼峰区')>=0) region='鱼峰区';
          else if (s.indexOf('城中区')>=0) region='城中区';
          else if (s.indexOf('柳江区')>=0) region='柳江区';
          else if (s.indexOf('柳州市')>=0) region='市直属';
          else if (s.indexOf('柳州')>=0) region='市直属';
          if (filterDistrict==='all' || filterDistrict===region || filterDistrict==='') {
            filteredLedgers.push({ schoolName:s, district:region, schoolId:'', submittedAt:'', lastRemindDate:'', status:'none', careerQuota:0,careerActual:0,controlQuota:0,controlActual:0,careerApprovedPlan:0,careerUsedPlan:0,controlApprovedPlan:0,controlUsedPlan:0,schoolType:'',orgLevel:'',authLeader:0,actualLeader:0,actualOtherLeader:0 });
          }
        }
      });
    }
  }
  if (filterDistrict !== 'all') {
    filteredLedgers = filteredLedgers.filter(function(d) { return d.district === filterDistrict; });
  }
  if (searchText) {
    var st = searchText.toLowerCase();
    filteredLedgers = filteredLedgers.filter(function(d) { return d.schoolName.toLowerCase().indexOf(st) >= 0; });
  }

  var h = '';

  // Status filter tabs (top)
  h += '<div class="filter-bar">';
  h += '<div class="filter-tabs">';
  h += '<button class="filter-tab' + (filterStatus==='all'?' active':'') + '" onclick="filterStatus=\'all\';currentPage=1;renderList()">全部</button>';
  h += '<button class="filter-tab' + (filterStatus==='pending'?' active':'') + '" onclick="filterStatus=\'pending\';currentPage=1;renderList()">待审核</button>';
  h += '<button class="filter-tab' + (filterStatus==='active'?' active':'') + '" onclick="filterStatus=\'active\';currentPage=1;renderList()">已生效</button>';
  h += '<button class="filter-tab' + (filterStatus==='draft'?' active':'') + '" onclick="filterStatus=\'draft\';currentPage=1;renderList()">待提交</button>';
  h += '</div>';
  h += '</div>';

  // Table with pagination
  var totalItems = filteredLedgers.length;
  var totalPages = Math.ceil(totalItems / pageSize);
  if (currentPage > totalPages) currentPage = totalPages || 1;
  var startIdxI = (currentPage - 1) * pageSize;
  var pageData = filteredLedgers.slice(startIdxI, startIdxI + pageSize);

  h += '<div class="list-card">';
  h += '<div style="display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);">';
  if (currentUser.role !== 'district') {
    h += '<div class="school-filter"><span>区域：</span><select onchange="filterDistrict=this.value;currentPage=1;renderList()"><option value="all"' + (filterDistrict==='all'?' selected':'') + '>全部区域</option><option value="市直属"' + (filterDistrict==='市直属'?' selected':'') + '>市直属</option><option value="鱼峰区"' + (filterDistrict==='鱼峰区'?' selected':'') + '>鱼峰区</option><option value="城中区"' + (filterDistrict==='城中区'?' selected':'') + '>城中区</option></select></div>';
  }
  h += '<input placeholder="搜索学校..." value="' + escapeHtml(searchText) + '" oninput="searchText=this.value;currentPage=1;renderList()">';
  h += '</div>';
  h += '<div class="table-scroll">';
  h += '<table class="list-table">';

  if (filterStatus === 'draft') {
    // Draft view: simplified 5-column table
    h += '<thead><tr>';
    h += '<th style="width:100px;">学校编号</th><th style="width:160px;text-align:left;">学校名称</th><th style="width:80px;">所属区域</th><th style="width:80px;">最近提醒</th><th style="width:90px;">操作</th>';
    h += '</tr></thead><tbody>';
    var today = new Date().toISOString().split('T')[0];
    pageData.forEach(function(d) {
      var isNew = d.status === 'none';
      var remindedToday = d.lastRemindDate === today;
      h += '<tr>';
      h += '<td class="col-id">' + (d.schoolId || '—') + '</td>';
      h += '<td class="col-name">' + escapeHtml(d.schoolName) + '</td>';
      h += '<td style="text-align:center;">' + escapeHtml(d.district) + '</td>';
      h += '<td style="text-align:center;font-size:12px;color:var(--text-secondary);">' + (d.lastRemindDate ? d.lastRemindDate.substring(5) : '—') + '</td>';
      h += '<td class="col-action"><div class="action-links">';
      if (isNew) {
        h += '<a class="action-link" onclick="remindSchool(\'' + d.schoolName + '\')">提醒建立</a>';
      } else if (remindedToday) {
        h += '<span class="action-link" style="color:var(--text-light);cursor:default;text-decoration:none;">已提醒</span>';
      } else {
        h += '<a class="action-link" onclick="remindSchool(\'' + d.schoolName + '\')">提醒提交</a>';
      }
      h += '</div></td>';
      h += '</tr>';
    });
  } else {
    // Standard 13-column table
    h += '<thead><tr>';
    h += '<th>学校编号</th><th>学校名称</th><th>所属区域</th><th>学校类型</th><th>机构级别</th>';
    h += '<th>核定编制数</th><th>实有在编人数</th><th>核定控制数</th><th>实有控制数</th><th>岗位总量</th>';
    h += '<th>提交时间</th><th>状态</th><th>操作</th>';
    h += '</tr></thead><tbody>';

    pageData.forEach(function(d) {
      var comp = getComputed(d);
      var isDraft = !d.submittedAt;
      var status = d.status || 'active';
      var statusLabel, statusCls;
      if (isDraft) { statusLabel = '待提交'; statusCls = 'none'; }
      else if (status === 'pending') { statusLabel = '待审核'; statusCls = 'pending'; }
      else { statusLabel = '已生效'; statusCls = 'active'; }

    h += '<tr>';
    h += '<td class="col-id">' + escapeHtml(d.schoolId||'—') + '</td>';
    h += '<td class="col-name">' + escapeHtml(d.schoolName) + '</td>';
    h += '<td>' + escapeHtml(d.district) + '</td>';
    h += '<td>' + escapeHtml(d.schoolType) + '</td>';
    h += '<td>' + escapeHtml(d.orgLevel) + '</td>';
    h += '<td class="col-num">' + d.careerQuota + '</td>';
    h += '<td class="col-num">' + d.careerActual + '</td>';
    h += '<td class="col-num">' + d.controlQuota + '</td>';
    h += '<td class="col-num">' + d.controlActual + '</td>';
    h += '<td class="col-num">' + comp.totalPosts + '</td>';
    h += '<td>' + (d.submittedAt ? (d.submittedAt + ' 00:00:00') : '—') + '</td>';
    h += '<td><span class="status-badge ' + statusCls + '">' + statusLabel + '</span></td>';
    h += '<td class="col-action"><div class="action-links">';
    if (isDraft) {
      h += '<a class="action-link" href="org-ledger-detail.html?school=' + encodeURIComponent(d.schoolName) + '&mode=view">查看</a>';
    } else if (status === 'pending') {
      h += '<a class="action-link" href="org-ledger-detail.html?school=' + encodeURIComponent(d.schoolName) + '&mode=review">审核</a>';
    } else {
      h += '<a class="action-link" href="org-ledger-detail.html?school=' + encodeURIComponent(d.schoolName) + '&mode=edit">编辑</a>';
      h += '<a class="action-link" href="org-ledger-detail.html?school=' + encodeURIComponent(d.schoolName) + '&mode=view">查看</a>';
    }
    h += '</div></td>';
    h += '</tr>';
  });
  } // end else (standard view)

  h += '</tbody></table>';
  h += '</div>';

  // Pagination
  h += '<div class="pagination">';
  h += '<span>共 ' + totalItems + ' 条</span>';
  h += '<div class="pagination-btns">';
  h += '<button onclick="goPage(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '>◀</button>';
  for (var p = 1; p <= totalPages; p++) {
    h += '<button onclick="goPage(' + p + ')"' + (p === currentPage ? ' class="active"' : '') + '>' + p + '</button>';
  }
  h += '<button onclick="goPage(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>▶</button>';
  h += '</div>';
  h += '<span>' + pageSize + ' 条/页</span>';
  h += '</div>';

  if (totalItems === 0) {
    h += '<div style="text-align:center;padding:48px 20px;">';
    h += '<div style="font-size:36px;margin-bottom:8px;">📋</div>';
    h += '<div style="font-size:14px;color:var(--text-secondary);">暂无匹配的学校台账</div>';
    h += '</div>';
  }

  h += '</div>';

  document.getElementById('mainContent').innerHTML = h;
}

// ===== REMIND =====
function remindSchool(schoolName) {
  var today = new Date().toISOString().split('T')[0];
  var d = allLedgers[schoolName];
  if (!d) {
    showToast('已提醒 ' + schoolName + ' 建立台账', 'success');
    return;
  }
  if (d.lastRemindDate === today) {
    showToast('今日已提醒过该学校，请明天再试', 'warning');
    return;
  }
  d.lastRemindDate = today;
  saveLedgers();
  showToast('已提醒 ' + schoolName + ' 提交台账', 'success');
  renderList();
}

// ===== PAGINATION =====
function goPage(p) {
  var totalPages = Math.ceil(filteredLedgers.length / pageSize);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  renderList();
}

// ===== UTILS =====
function saveLedgers() {
  localStorage.setItem('org_ledger', JSON.stringify(allLedgers));
}

function selOptions(current, list) {
  var h = '<option value="">—</option>';
  list.forEach(function(v) {
    h += '<option value="' + v + '"' + (current === v ? ' selected' : '') + '>' + v + '</option>';
  });
  return h;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success') + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function logout() {
  localStorage.removeItem('currentUser');
  window.location.href = 'index.html';
}

// ===== INIT =====
init();
</script>
