<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>柳州教育人事管理平台 — 申报入编</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 12px; }
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column;
}
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }

/* Role Switcher */
.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
  margin-top: auto;
}
.role-switcher-label {
  font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;
  margin-bottom: 8px; padding: 0 4px;
}
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px);
}
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* ===== CONTENT STYLES ===== */
.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid #f0f2f5;
  font-weight: 600; font-size: 14px;
  display: flex; justify-content: space-between; align-items: center;
}
.batch-info {
  background: #F8FAFC; padding: 12px 16px; border-radius: var(--radius);
  font-size: 13px; margin-bottom: 20px; border: 1px solid var(--border);
}
.stats-summary { display: flex; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-card {
  background: #F8FAFC; border-radius: var(--radius-lg); padding: 16px 24px;
  flex: 1; min-width: 160px; text-align: center; border: 1px solid var(--border);
}
.stat-number { font-size: 28px; font-weight: 700; color: var(--primary); margin-top: 8px; }
.stat-label { font-size: 13px; color: var(--text-secondary); }

.two-column-layout { display: flex; gap: 24px; flex-wrap: wrap; }
.detail-column { flex: 1; min-width: 260px; }
.detail-column h4 { font-size: 14px; margin-bottom: 12px; }
.three-col-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.three-col-table th, .three-col-table td {
  border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top;
}
.three-col-table th { background: #F8FAFC; font-weight: 600; width: 30%; }

.info-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px 20px;
}
.info-item {
  background: #F8FAFC; padding: 12px; border-radius: var(--radius);
}
.info-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.info-value { font-size: 13px; font-weight: 500; }
.full-width { grid-column: span 2; }

.form-group { margin-bottom: 14px; padding: 0 20px; }
.form-group label {
  font-weight: 500; font-size: 12px; display: block; margin-bottom: 6px; color: var(--text);
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-family: inherit;
}
.form-group textarea { resize: vertical; }

/* Materials checklist */
.materials-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 0 20px 16px; }
.materials-table th, .materials-table td {
  border: 1px solid var(--border); padding: 10px 12px; text-align: left; vertical-align: top;
}
.materials-table th { background: #F8FAFC; font-weight: 600; font-size: 11px; }
.materials-table .mat-num { width: 40px; text-align: center; }
.materials-table .mat-name { width: 35%; }
.materials-table .mat-require { width: 30%; font-size: 11px; color: var(--text-secondary); }
.materials-table .mat-upload { width: 20%; text-align: center; }
.materials-table .mat-status { width: 10%; text-align: center; }
.material-upload-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px; border: 1px dashed var(--accent); border-radius: 6px;
  font-size: 11px; color: var(--accent); cursor: pointer; background: #fff;
  font-family: inherit; transition: 0.15s;
}
.material-upload-btn:hover { background: var(--primary-light); border-style: solid; }
.material-upload-btn.uploaded { border-color: var(--success); color: var(--success); border-style: solid; background: #F0FDF4; }
.material-file-name { font-size: 10px; color: var(--text-secondary); margin-top: 2px; word-break: break-all; }
.material-status-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
}
.material-status-dot.ok { background: var(--success); }
.material-status-dot.wait { background: #CBD5E1; }

.btn-edit {
  background: none; border: none; color: var(--accent); cursor: pointer;
  font-size: 12px; font-family: inherit;
}
.btn-edit:hover { text-decoration: underline; }

.form-actions {
  display: flex; justify-content: flex-end; gap: 12px;
  padding: 16px 20px; border-top: 1px solid var(--border); margin-top: 8px;
}
.btn-cancel {
  background: var(--gray-bg); border: none; padding: 8px 20px;
  border-radius: 30px; cursor: pointer; font-size: 13px; font-family: inherit;
}
.btn-cancel:hover { background: #E2E8F0; }
.btn-submit {
  background: var(--primary); color: #fff; border: none;
  padding: 8px 24px; border-radius: 30px; cursor: pointer; font-size: 13px;
  font-family: inherit;
}
.btn-submit:hover { background: var(--primary-dark); }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center;
  justify-content: center; z-index: 1000;
}
.modal-container {
  background: #fff; border-radius: 16px; width: 400px; padding: 24px;
  text-align: center; box-shadow: var(--shadow-lg);
}
.modal-container p { font-size: 14px; margin-bottom: 8px; }
.modal-buttons { display: flex; justify-content: center; gap: 16px; margin-top: 24px; }

/* Toast */
.toast-msg {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px;
  border-radius: 40px; z-index: 2000; font-size: 13px;
  animation: toastAnim 1.8s ease forwards;
}
@keyframes toastAnim {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
  15% { opacity: 1; transform: translateX(-50%) translateY(0); }
  85% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
}
</style>
</head>
<body>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 48 48" fill="none"><rect x="4" y="20" width="8" height="22" rx="2" fill="rgba(255,255,255,0.95)"/><rect x="14" y="14" width="8" height="28" rx="2" fill="rgba(255,255,255,0.85)"/><rect x="24" y="6" width="8" height="36" rx="2" fill="rgba(255,255,255,0.95)"/><rect x="34" y="10" width="8" height="32" rx="2" fill="rgba(255,255,255,0.75)"/><circle cx="38" cy="10" r="6" fill="#fff" opacity="0.5"/><path d="M36.5 8.5L39.5 11.5L42 8" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">

      <button class="role-switch-btn" data-role="district" onclick="switchRole('district')">
        <span class="role-switch-dot district"></span>区管理员
        <span style="font-size:10px;color:rgba(255,255,255,0.3);margin-left:auto;">李振华</span>
      </button>
      <button class="role-switch-btn" data-role="school" onclick="switchRole('school')">
        <span class="role-switch-dot school"></span>校管理员
        <span style="font-size:10px;color:rgba(255,255,255,0.3);margin-left:auto;">王玉兰</span>
      </button>
      <button class="role-switch-btn active" data-role="teacher" onclick="switchRole('teacher')">

</aside>

<!-- ===== MAIN CONTENT ===== -->
<main class="main">
  <div class="breadcrumb">
    <a onclick="window.location.href='workbench.html'">工作台</a> &nbsp;/&nbsp; <span>编制管理</span> &nbsp;/&nbsp; <span>教师入编管理</span> &nbsp;/&nbsp; <span>申报入编</span>
  </div>
  <div id="mainContent"></div>
</main>

<script>
// ===== SVG Icons =====
var ICONS = {
  home: '<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  chart: '<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  userp: '<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>',
  arrowup: '<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>',
  warn: '<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  star: '<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
};
var MENU_ICONS = {
  workbench: 'home',
  entry: 'userp',
  promote: 'arrowup',
  ethics: 'warn',
  honor: 'star'
};

var currentRole = 'teacher';

var ROLES = {
  city: {
    name: '张建国', short: '张',
    sidebar: {
      top: [{ id: 'workbench', icon: 'home', label: '工作台' }, { id: 'dashboard', icon: 'chart', label: '数据概览' }],
      groups: [
        { name: '编制管理', items: [{ id: 'staffing', label: '编制使用申请' }, { id: 'entry', label: '入编申请' }, { id: 'exit', label: '教师出编管理' }] },
        { name: '岗位管理', items: [{ id: 'postset', label: '岗位设置申请' }, { id: 'promote', label: '岗位晋升申请' }, { id: 'recruit', label: '招聘岗位申请' }] },
        { name: '聘用管理', items: [{ id: 'employ', label: '聘用手续办理' }] },
        { name: '人事管理', items: [{ id: 'retire', label: '退休呈报' }, { id: 'salary', label: '工资核定申请' }, { id: 'ethics', label: '师德师风举报' }, { id: 'honor', label: '荣誉申请' }] },
        { name: '系统设置', items: [{ id: 'account', label: '账号管理' }, { id: 'org', label: '机构管理' }, { id: 'perm', label: '角色权限' }, { id: 'log', label: '操作日志' }] }
      ]
    }
  },
  district: {
    name: '李振华', short: '李',
    sidebar: {
      top: [{ id: 'workbench', icon: 'home', label: '工作台' }, { id: 'dashboard', icon: 'chart', label: '数据概览' }],
      groups: [
        { name: '编制管理', items: [{ id: 'staffing', label: '编制使用申请' }, { id: 'entry', label: '入编申请' }, { id: 'exit', label: '教师出编管理' }] },
        { name: '岗位管理', items: [{ id: 'postset', label: '岗位设置申请' }, { id: 'promote', label: '岗位晋升申请' }, { id: 'recruit', label: '招聘岗位申请' }] },
        { name: '聘用管理', items: [{ id: 'employ', label: '聘用手续办理' }] },
        { name: '人事管理', items: [{ id: 'retire', label: '退休呈报' }, { id: 'salary', label: '工资核定申请' }, { id: 'ethics', label: '师德师风举报' }, { id: 'honor', label: '荣誉申请' }] },
        { name: '系统设置', items: [{ id: 'account', label: '账号管理' }] }
      ]
    }
  },
  school: {
    name: '王玉兰', short: '王',
    sidebar: {
      top: [{ id: 'workbench', icon: 'home', label: '工作台' }, { id: 'dashboard', icon: 'chart', label: '数据概览' }],
      groups: [
        { name: '编制管理', items: [{ id: 'staffing', label: '编制使用申请' }, { id: 'entry', label: '入编申请' }, { id: 'exit', label: '教师出编管理' }] },
        { name: '岗位管理', items: [{ id: 'postset', label: '岗位设置申请' }, { id: 'promote', label: '岗位晋升申请' }, { id: 'recruit', label: '招聘岗位申请' }] },
        { name: '聘用管理', items: [{ id: 'employ', label: '聘用手续办理' }] },
        { name: '人事管理', items: [{ id: 'retire', label: '退休呈报' }, { id: 'salary', label: '工资核定申请' }, { id: 'ethics', label: '师德师风举报' }, { id: 'honor', label: '荣誉申请' }] },
        { name: '系统设置', items: [{ id: 'account', label: '账号管理' }] }
      ]
    }
  },
  teacher: {
    name: '陈明辉', short: '陈',
    sidebar: {
      top: [{ id: 'workbench', icon: 'home', label: '工作台' }],
      groups: [
        { name: '业务申请', items: [{ id: 'promote', label: '岗位晋升申请' }, { id: 'ethics', label: '师德师风举报' }, { id: 'honor', label: '荣誉申请' }] }
      ]
    }
  }
};

function renderSidebar() {
  var data = ROLES[currentRole].sidebar;
  var html = '';
  data.top.forEach(function(item) {
    html += '<a class="menu-item" onclick="sidebarClick(\'' + item.id + '\')">';
    html += ICONS[item.icon];
    html += '<span>' + item.label + '</span></a>';
  });
  data.groups.forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      var isActive = item.id === 'entry';
      html += '<a class="menu-item' + (isActive ? ' active' : '') + '" onclick="sidebarClick(\'' + item.id + '\')">';
      html += ICONS[MENU_ICONS[item.id] || 'home'];
      html += '<span>' + item.label + '</span></a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
}

function updateUserInfo() {
  var role = ROLES[currentRole];
  var roleLabel = currentRole === 'city' ? '市管理员' : currentRole === 'district' ? '区管理员' : currentRole === 'school' ? '校管理员' : '教师';
  document.getElementById('topAvatar').textContent = role.short;
  document.getElementById('topName').textContent = role.name + ' · ' + roleLabel;
}

function switchRole(role) {
  if (role === 'teacher') { return; }
  if (role === 'city' || role === 'district') { window.location.href = '教师入编管理（主管单位视角）.html'; return; }
  if (role === 'school') { window.location.href = '教师入编管理（学校管理员视角）.html'; return; }
}

function sidebarClick(id) {
  if (id === 'workbench') { window.location.href = 'workbench.html'; }
  else if (id === 'entry') { return; }
  else { showToast('跳转至：' + id); }
}

function showToast(message, callback) {
  var toast = document.createElement('div');
  toast.className = 'toast-msg';
  toast.innerText = message;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); if (callback) callback(); }, 1500);
}

function renderMaterialsCard() {
  var rows = materialsChecklist.map(function(item, idx) {
    var uploaded = item.file !== null;
    var btnClass = uploaded ? 'material-upload-btn uploaded' : 'material-upload-btn';
    var btnIcon = uploaded ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-upload"></i>';
    var btnText = uploaded ? '重新上传' : '点击上传';
    var fileNameHtml = uploaded ? '<div class="material-file-name">' + item.file + '</div>' : '';
    var dotClass = uploaded ? 'material-status-dot ok' : 'material-status-dot wait';
    return '<tr>' +
      '<td class="mat-num">' + item.num + '</td>' +
      '<td class="mat-name">' + item.name.replace(/\n/g, '<br>') + '</td>' +
      '<td class="mat-require">' + item.require + '</td>' +
      '<td class="mat-upload">' +
        '<label class="' + btnClass + '" id="matUploadBtn' + idx + '">' +
          btnIcon + ' ' + btnText +
          '<input type="file" style="display:none;" id="matFile' + idx + '" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx" onchange="handleMaterialUpload(' + idx + ', this)">' +
        '</label>' +
        fileNameHtml +
      '</td>' +
      '<td class="mat-status"><span class="' + dotClass + '"></span> ' + (uploaded ? '已上传' : '待上传') + '</td>' +
    '</tr>';
  }).join('');

  return '<div class="card">' +
    '<div class="card-header">附件12-3 事业单位控制数人员增人材料清单</div>' +
    '<div style="padding: 16px 20px 4px;">' +
      '<table class="materials-table">' +
        '<thead><tr><th class="mat-num">序号</th><th class="mat-name">所需材料</th><th class="mat-require">材料要求</th><th class="mat-upload">上传</th><th class="mat-status">状态</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
      '<div style="font-size:11px;color:var(--text-light);padding:8px 0 0;">支持 PDF、Word、Excel、图片格式，单个文件不超过 10MB，不支持压缩包</div>' +
    '</div>' +
    '</div>';
}

var MAT_ALLOWED_EXTS = ['.pdf','.jpg','.jpeg','.png','.doc','.docx','.xls','.xlsx'];
var MAT_BLOCKED_EXTS = ['.zip','.rar','.7z','.tar','.gz','.bz2','.xz','.tgz'];
var MAT_MAX_SIZE = 10 * 1024 * 1024;

function validateMaterialFile(file) {
  var ext = '.' + file.name.split('.').pop().toLowerCase();
  if (MAT_BLOCKED_EXTS.indexOf(ext) !== -1) {
    return '不支持压缩包格式（' + ext + '），请上传 PDF、Word、Excel 或图片文件';
  }
  if (MAT_ALLOWED_EXTS.indexOf(ext) === -1) {
    return '不支持的文件格式（' + ext + '），仅支持 PDF、Word、Excel、图片';
  }
  if (file.size > MAT_MAX_SIZE) {
    return '文件大小 ' + (file.size / 1024 / 1024).toFixed(1) + ' MB 超过 10MB 上限';
  }
  return null;
}

function handleMaterialUpload(idx, input) {
  if (input.files && input.files[0]) {
    var f = input.files[0];
    var err = validateMaterialFile(f);
    if (err) { showToast(err); input.value = ''; return; }
    materialsChecklist[idx].file = f.name;
    renderPage();
    showToast('材料 "' + materialsChecklist[idx].name.split('\n')[0] + '" 上传成功');
  }
}

function showConfirm(message, onConfirm) {
  var modalHtml =
    '<div class="modal-overlay" id="confirmModal">' +

        '<p>' + message + '</p>' +
        '<div class="modal-buttons">' +

          '<button class="btn-submit" id="modalConfirm">确定</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById("modalCancel").onclick = function() { document.getElementById("confirmModal").remove(); };
  document.getElementById("modalConfirm").onclick = function() {
    document.getElementById("confirmModal").remove();
    onConfirm();
  };
}
