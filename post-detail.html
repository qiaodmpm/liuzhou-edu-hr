<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>岗位设置详情 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge,
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); position: relative; text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.role-switcher {
  padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08);
}
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; color: rgba(255,255,255,0.55);
  transition: var(--transition); border: 1px solid transparent;
  background: transparent; font-family: inherit; width: 100%; text-align: left;
}
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active {
  background: rgba(59,130,246,0.2); color: #fff;
  border-color: rgba(59,130,246,0.4); font-weight: 500;
}
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

/* Two-column layout */
.detail-layout { display: flex; gap: 24px; }
.detail-main { flex: 1; min-width: 0; }
.detail-sidebar { width: 360px; flex-shrink: 0; }

/* Card */
.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  margin-bottom: 20px; overflow: hidden;
}
.card-header {
  padding: 14px 20px; font-size: 14px; font-weight: 600; color: var(--text);
  background: #FAFBFC; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
}
.card-body { padding: 20px; }

/* Status stamp */
.status-stamp {
  display: inline-block; padding: 6px 16px; border: 2px solid;
  transform: rotate(-5deg); font-weight: 700; font-size: 14px; background: #fff;
}
.status-stamp.first_approved { color: #10B981; border-color: #10B981; }
.status-stamp.first_rejected { color: #EF4444; border-color: #EF4444; }
.status-stamp.first_review { color: #F59E0B; border-color: #F59E0B; }
.status-stamp.second_review { color: #3B82F6; border-color: #3B82F6; }
.status-stamp.completed { color: #8B5CF6; border-color: #8B5CF6; }

/* Progress tracker */
.progress-tracker {
  display: flex; align-items: flex-start; justify-content: center;
  padding: 8px 0 12px;
}
.progress-step {
  display: flex; flex-direction: column; align-items: center; position: relative;
}
.progress-dot {
  width: 32px; height: 32px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
  transition: var(--transition); position: relative; z-index: 1;
}
.progress-dot.done { background: var(--success); color: #fff; }
.progress-dot.current { background: var(--primary); color: #fff; box-shadow: 0 0 0 6px rgba(30,64,175,0.12); }
.progress-dot.pending { background: var(--gray-bg); color: var(--text-light); border: 2px solid var(--border); }
.progress-dot.rejected { background: #FEE2E2; color: var(--danger); border: 2px solid var(--danger); }
.progress-label { font-size: 11px; font-weight: 500; margin-top: 8px; text-align: center; white-space: nowrap; max-width: 80px; }
.progress-label.done { color: var(--success); }
.progress-label.current { color: var(--primary); }
.progress-label.pending { color: var(--text-light); }
.progress-label.rejected { color: var(--danger); }
.progress-line {
  width: 72px; height: 2px; margin: 0 6px; margin-bottom: 24px;
  position: relative; z-index: 0;
}
.progress-line.done { background: var(--success); }
.progress-line.pending { background: var(--border); }
.progress-line.rejected { background: #FECACA; }

.status-hint-box {
  text-align: center; padding: 10px 20px; font-size: 13px; color: var(--text-secondary);
  border-top: 1px solid var(--border); background: #FAFBFC;
}
.status-hint-box.warn { color: var(--warning); }
.status-hint-box.error { color: var(--danger); }
.status-hint-box.success { color: var(--success); }

/* Info grid */
.info-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
}
.info-item {
  background: #F8FAFC; padding: 10px 14px; border-radius: 8px;
}
.info-item.full { grid-column: 1 / -1; }
.info-label { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
.info-value { font-size: 13px; font-weight: 500; color: var(--text); }

/* Data table */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  padding: 8px 12px; text-align: center; font-weight: 600; font-size: 12px;
  color: var(--text-secondary); background: #F8FAFC; border: 1px solid var(--border);
}
.data-table td { padding: 8px 12px; border: 1px solid var(--border); text-align: center; }
.data-table .layer-header { background: #EFF6FF; color: var(--primary); font-weight: 600; }
.data-table .ratio-cell { background: #F8FAFC; color: var(--text-secondary); font-size: 12px; font-weight: 500; }
.data-table .sub-label { text-align: left; font-weight: 500; color: var(--text-secondary); background: #F8FAFC; }
.data-table .sub-total { font-weight: 600; color: var(--primary); }
.data-table .total-row { font-weight: 600; background: #F8FAFC; }

/* Attachment section */
.material-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: #F8FAFC; border-radius: 8px; margin-bottom: 8px;
}
.material-item:last-child { margin-bottom: 0; }
.material-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.file-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; background: #fff; border: 1px solid var(--border);
  border-radius: 4px; font-size: 12px; cursor: pointer;
}
.file-chip:hover { border-color: var(--accent); color: var(--primary); }

/* HR comparison */
.hr-comparison { margin-top: 8px; }
.hr-comparison .cmp-section { margin-bottom: 20px; }
.hr-comparison .cmp-section:last-child { margin-bottom: 0; }
.hr-comparison .cmp-title {
  font-size: 13px; font-weight: 600; color: var(--text);
  margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--border);
}
.hr-comparison .cmp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.hr-comparison .cmp-table th {
  padding: 6px 10px; text-align: center; font-weight: 600; font-size: 11px;
  color: var(--text-secondary); background: #F8FAFC; border: 1px solid var(--border);
}
.hr-comparison .cmp-table td { padding: 6px 10px; border: 1px solid var(--border); text-align: center; }
.hr-comparison .cmp-table .diff { background: #FFF7ED; color: #C2410C; font-weight: 600; }
.hr-comparison .cmp-table .orig { color: var(--text-secondary); }
.hr-comparison .cmp-table .hrval { color: var(--primary); font-weight: 500; }

/* Timeline */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px;
  width: 2px; background: var(--border);
}
.timeline-item { position: relative; margin-bottom: 20px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot {
  position: absolute; left: -24px; top: 4px;
  width: 14px; height: 14px; border-radius: 50%; z-index: 1;
}
.timeline-dot.submit { background: var(--accent); }
.timeline-dot.reject { background: var(--danger); }
.timeline-dot.resubmit { background: var(--warning); }
.timeline-dot.approve { background: var(--success); }
.timeline-content .tlc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.timeline-content .tlc-title { font-size: 13px; font-weight: 600; color: var(--text); }
.timeline-content .tlc-time { font-size: 11px; color: var(--text-light); }
.timeline-content .tlc-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.timeline-content .tlc-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 500;
}
.tlc-tag.reject-reason { background: #FEE2E2; color: var(--danger); }
.tlc-tag.resubmit-tag { background: #FEF3C7; color: #D97706; }
.tlc-tag.approve-tag { background: #D1FAE5; color: #059669; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; font-size: 13px; font-weight: 500;
  border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition);
  border: 1px solid transparent; text-decoration: none;
}
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: #fff; color: var(--text-secondary); border-color: var(--border); }
.btn-outline:hover { background: var(--gray-bg); }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-lg { padding: 10px 28px; font-size: 14px; }

.action-bar { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); }
.action-bar .btn { flex: 1; justify-content: center; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Back link */
.back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
.back-link:hover { color: var(--primary); }

@media (max-width: 1024px) {
  .detail-layout { flex-direction: column; }
  .detail-sidebar { width: 100%; }
  .info-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <rect x="3" y="1" width="18" height="22" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="role-switcher" id="roleSwitcher">
    <div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options">
      <button class="role-switch-btn" data-role="city" onclick="switchRole('city')"><span class="role-switch-dot city"></span><span class="role-switcher-name">市管理员</span></button>
      <button class="role-switch-btn" data-role="district" onclick="switchRole('district')"><span class="role-switch-dot district"></span><span class="role-switcher-name">区管理员</span></button>

  <div class="sidebar-bottom">
    <div class="sidebar-toggle" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      <span class="menu-label">收起菜单</span>
    </div>
  </div>
</aside>

<!-- ===== MAIN ===== -->
<main class="main">
  <div class="breadcrumb">
    <a href="workbench.html">首页</a> &nbsp;/&nbsp;
    <a href="#" id="breadcrumbList">岗位设置申请</a> &nbsp;/&nbsp;

  <div class="back-link" onclick="goBack()">&#8592; 返回列表</div>

  <div class="detail-layout">
    <div class="detail-main">
      <!-- Page Title -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <div>
          <h1 style="font-size:20px;font-weight:700;" id="pageTitle">岗位设置审核表</h1>
          <div style="font-size:12px;color:var(--text-light);margin-top:4px;" id="pageMeta"></div>

      <div class="card">
        <div class="card-header">管理岗位明细</div>
        <div class="card-body" id="mgmtDetails"></div>
      </div>

      <!-- Professional Technical Position Details -->
      <div class="card">
        <div class="card-header">专业技术岗位明细</div>
        <div class="card-body" id="profDetails"></div>
      </div>

      <!-- Labor Skill Position Details -->
      <div class="card">
        <div class="card-header">工勤技能岗位明细</div>
        <div class="card-body" id="laborDetails"></div>
      </div>

      <!-- Attachments -->
      <div class="card" id="attachmentCard" style="display:none;">
        <div class="card-header">附件材料</div>
        <div class="card-body" id="attachmentList"></div>
      </div>

      <!-- HR Comparison (for second_review / completed) -->
      <div class="card" id="hrComparisonCard" style="display:none;">
        <div class="card-header">人社核准结果对比</div>
        <div class="card-body" id="hrComparison"></div>
      </div>
    </div>

    <!-- Sidebar -->

// ===== PERSISTENCE =====
function loadRecords() {
  try {
    var stored = JSON.parse(localStorage.getItem('post_records') || 'null');
    if (stored && stored.length) {
      var ids = {};
      stored.forEach(function(r) { ids[r.id] = true; });
      var merged = stored.slice();
      DEMO_RECORDS.forEach(function(r) { if (!ids[r.id]) { merged.push(r); ids[r.id] = true; } });
      return merged;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEMO_RECORDS));
}

function findRecord(id) {
  return loadRecords().find(function(r) { return r.id === id; }) || null;
}

function resetDemoData() {
  localStorage.removeItem('post_records');
  localStorage.removeItem('post_seq');
  location.reload();
}

// ===== HELPERS =====
function sumObj(obj) { var s = 0; for (var k in obj) { if (obj.hasOwnProperty(k)) s += (parseInt(obj[k]) || 0); } return s; }
function pct(n, total) { return total > 0 ? (n / total * 100).toFixed(1) : '0.0'; }
function formatSize(bytes) { if (!bytes) return '—'; if (bytes < 1024) return bytes + 'B'; if (bytes < 1048576) return (bytes/1024).toFixed(1) + 'KB'; return (bytes/1048576).toFixed(1) + 'MB'; }
function escapeHtml(str) { if (!str) return ''; return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ===== PROGRESS STATE =====
function getProgressStates(status) {
  if (status === 'first_review') return ['done', 'current', 'pending', 'pending', 'pending', 'pending'];
  if (status === 'first_approved') return ['done', 'done', 'current', 'pending', 'pending', 'pending'];
  if (status === 'first_rejected') return ['done', 'rejected', 'pending', 'pending', 'pending', 'pending'];
  if (status === 'second_review') return ['done', 'done', 'done', 'done', 'current', 'pending'];
  if (status === 'completed') return ['done', 'done', 'done', 'done', 'done', 'done'];
  return ['pending', 'pending', 'pending', 'pending', 'pending', 'pending'];
}

// ===== PROGRESS CARD =====
function renderProgress() {
  var states = getProgressStates(record.status);
  var html = '<div class="card-body"><div class="progress-tracker">';

  for (var i = 0; i < PROGRESS_STEPS.length; i++) {
    var s = states[i];
    var isRejected = s === 'rejected';
    var icon;
    if (s === 'done') icon = '&#10003;';
    else if (isRejected) icon = '&#10007;';
    else icon = (i + 1);

    html += '<div class="progress-step">';
    html += '<div class="progress-dot ' + s + '">' + icon + '</div>';
    html += '<div class="progress-label ' + s + '">' + PROGRESS_STEPS[i].label + '</div>';
    html += '</div>';

    if (i < PROGRESS_STEPS.length - 1) {
      if (isRejected) {
        html += '<div class="progress-line rejected"></div>';
      } else {
        html += '<div class="progress-line ' + (s === 'done' ? 'done' : 'pending') + '"></div>';
      }
    }
  }

  html += '</div>';

  var hintClass = 'status-hint-box';
  if (record.status === 'first_rejected') hintClass += ' error';
  else if (record.status === 'first_approved') hintClass += ' warn';
  else if (record.status === 'completed') hintClass += ' success';

  html += '<div class="' + hintClass + '">' + (STATUS_HINTS[record.status] || '') + '</div>';
  html += '</div>';

  document.getElementById('progressCard').innerHTML = html;
}

// ===== TIMELINE =====
function renderTimeline() {
  var r = record;
  var items = [];

  items.push({ time: r.submitTime || '', title: '学校提交一审', desc: (r.timeline && r.timeline.length > 0 && r.timeline[0].operator ? r.timeline[0].operator : '') + ' 提交岗位设置审核表', action: 'submit' });

  if (r.timeline && r.timeline.length > 0) {
    for (var i = 0; i < r.timeline.length; i++) {
      var t = r.timeline[i];
      if (t.action === '学校提交一审') continue;

      var actionType = 'submit';
      if (t.action.indexOf('通过') >= 0 || t.action.indexOf('确认') >= 0) actionType = 'approve';
      else if (t.action.indexOf('驳回') >= 0) actionType = 'reject';
      else if (t.action.indexOf('修改') >= 0 || t.action.indexOf('重提') >= 0) actionType = 'resubmit';

      items.push({
        time: t.time || '',
        title: t.action || '',
        desc: (t.operator || '') + (t.opinion ? '，意见：' + t.opinion : ''),
        action: actionType
      });
    }
  }

  if (r.status === 'first_rejected' && !r.timelineHasReject) {
    items.push({
      time: r.firstReviewTime || r.submitTime || '',
      title: '一审驳回',
      desc: (r.firstReviewer || '') + (r.firstRejectReason ? '，驳回原因：' + r.firstRejectReason : ''),
      action: 'reject',
      reason: r.firstRejectReason || ''
    });
  }

  var tagMap = {
    approve: '<span class="tlc-tag approve-tag">通过</span>',
    reject: '<span class="tlc-tag reject-reason">驳回</span>',
    resubmit: '<span class="tlc-tag resubmit-tag">修改重提</span>'
  };

  var dotClassMap = { submit: 'submit', approve: 'approve', reject: 'reject', resubmit: 'resubmit' };

  var html = '';
  for (var j = 0; j < items.length; j++) {
    var item = items[j];
    html += '<div class="timeline-item">' +
      '<div class="timeline-dot ' + (dotClassMap[item.action] || 'submit') + '"></div>' +
      '<div class="timeline-content">' +
      '<div class="tlc-header">' +
      '<span class="tlc-title">' + escapeHtml(item.title) + '</span>' +
      '<span class="tlc-time">' + (item.time ? item.time.substring(0, 16) : '') + '</span>' +
      (tagMap[item.action] ? tagMap[item.action] : '') +
      '</div>' +
      '<div class="tlc-desc">' + escapeHtml(item.desc) + '</div>' +
      (item.reason ? '<div class="tlc-desc" style="color:var(--danger);margin-top:4px;">驳回原因：' + escapeHtml(item.reason) + '</div>' : '') +
      '</div></div>';
  }

  if (!items.length) html += '<div style="color:var(--text-light);">暂无记录</div>';
  document.getElementById('timeline').innerHTML = html;
}

    window.location.href = 'post-list-school.html';
  } else {
    showToast('教师角色无此功能权限', 'warning');
  }
}

function renderSidebar() {
  var roleData = ROLES[currentRole];
  if (!roleData) { document.getElementById('sidebarMenu').innerHTML = ''; return; }
  var sidebar = roleData.sidebar;
  var html = '';
  (sidebar.top || []).forEach(function(item) {
    html += '<a class="menu-item' + (item.id === 'postset' ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[item.icon] || '') + '<span class="menu-label">' + item.label + '</span></a>';
  });
  (sidebar.groups || []).forEach(function(group) {
    html += '<div class="menu-group">' + group.name + '</div>';
    group.items.forEach(function(item) {
      html += '<a class="menu-item' + (item.id === 'postset' ? ' active' : '') + '" onclick="sidebarClick(this,\'' + item.id + '\')">' + (ICONS[MENU_ICONS[item.id] || 'file']) + '<span class="menu-label">' + item.label + '</span>' + (item.badge ? '<span class="menu-badge">' + item.badge + '</span>' : '') + '</a>';
    });
  });
  document.getElementById('sidebarMenu').innerHTML = html;
  var btns = document.querySelectorAll('.role-switch-btn');
  btns.forEach(function(b) { b.classList.toggle('active', b.dataset.role === currentRole); });
  document.getElementById('userAvatar').textContent = roleData.short;
  document.getElementById('userName').textContent = roleData.name;
}

function sidebarClick(el, id) {
  document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') {
    if (currentRole === 'school') { window.location.href = '教师入编管理（学校管理员视角）.html'; }
    else { window.location.href = '教师入编管理（主管单位视角）.html'; }
    return;
  }
  if (id === 'exit') {
    if (currentRole === 'school') { window.location.href = '教师出编管理（学校管理员视角）.html'; }
    else { window.location.href = '教师出编管理（主管单位视角）.html'; }
    return;
  }
  if (id === 'postset') return;
  showToast('跳转至：' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}

// ===== INIT =====
(function init() {
  var params = new URLSearchParams(window.location.search);
  recordId = params.get('id');
  var urlRole = params.get('role');
  if (urlRole === 'city' || urlRole === 'district' || urlRole === 'school') {
    currentRole = urlRole;
  }

  if (recordId) record = findRecord(recordId);

  var breadcrumbList = document.getElementById('breadcrumbList');
  if (currentRole === 'school') {
    breadcrumbList.href = 'post-list-school.html';
  } else {
    breadcrumbList.href = 'post-list-admin.html?role=' + currentRole;
  }

  renderSidebar();
  renderAll();
})();
</script>

</body>
