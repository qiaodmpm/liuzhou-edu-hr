<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageMetaTitle">申报详情 — 编制使用申请 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ===== TOP NAVBAR ===== */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  width: 38px; height: 38px; background: rgba(255,255,255,0.18);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell {
  position: relative; cursor: pointer; color: rgba(255,255,255,0.85);
  padding: 6px; border-radius: 6px; transition: var(--transition);
}
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.topnav-user {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px;
  transition: var(--transition); font-size: 13px; position: relative;
}
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-dropdown {
  display: none; position: absolute; top: 46px; right: 0;
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-dropdown.show { display: block; }
.user-dropdown a {
  display: block; padding: 12px 18px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: #1E3A8A; z-index: 90; overflow-y: auto;
  display: flex; flex-direction: column; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label,
.sidebar.collapsed .menu-group,
.sidebar.collapsed .menu-badge { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group {
  padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 1px;
}
.menu-item {
  display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7);
  transition: var(--transition); text-decoration: none;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 500;
  border-left-color: var(--accent);
}
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5);
  transition: var(--transition);
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

/* Role switcher */
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }
.sidebar.collapsed .role-switcher-label,
.sidebar.collapsed .role-switcher-name { display: none; }

/* ===== MAIN CONTENT ===== */
.main {
  margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px;
  min-height: calc(100vh - 56px); transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main { margin-left: 64px; }

.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }

.page-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; }
.page-header h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); }
.page-header .status-badge {
  padding: 3px 12px; border-radius: 12px; font-size: 12px; font-weight: 500;
}
.status-badge.submitted { background: #EFF6FF; color: var(--primary); }
.status-badge.reviewing { background: #FEF3C7; color: #D97706; }
.status-badge.approved { background: #D1FAE5; color: #059669; }
.status-badge.rejected { background: #FEE2E2; color: var(--danger); }
	.status-badge.final_submitted { background: #FFF7ED; color: #EA580C; }
	.status-badge.first_approved { background: #DBEAFE; color: #2563EB; }

/* ===== STATUS SEAL STAMP ===== */
.status-seal {
  width: 80px; height: 80px; border-radius: 50%; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0;
  border: 3px solid; font-weight: 700; text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  transform: rotate(-8deg);
}
.status-seal::before {
  content: ''; position: absolute; inset: 5px; border-radius: 50%;
  border: 1.5px dashed currentColor; opacity: 0.5;
}
.status-seal .seal-label { font-size: 9px; letter-spacing: 1px; opacity: 0.8; }
.status-seal .seal-text { font-size: 15px; line-height: 1.1; }
.status-seal.approved {
  color: #059669; border-color: #059669; background: rgba(209,250,229,0.3);
}
.status-seal.rejected {
  color: #DC2626; border-color: #DC2626; background: rgba(254,226,226,0.3);
}
.status-seal.reviewing {
  color: #D97706; border-color: #D97706; background: rgba(254,243,199,0.3);
}
.status-seal.submitted {
  color: #1E40AF; border-color: #1E40AF; background: rgba(239,246,255,0.3);
}
.status-seal.first_approved {
  color: #2563EB; border-color: #2563EB; background: rgba(219,234,254,0.3);
}
.status-seal.final_submitted {
  color: #EA580C; border-color: #EA580C; background: rgba(255,247,237,0.3);
}
/* ===== TWO-COLUMN LAYOUT ===== */
.detail-layout {
  display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start;
}
.detail-col-left { min-width: 0; }
.detail-col-right { position: sticky; top: 80px; }
.detail-col-right .card { padding: 24px 24px; }
.detail-col-right .card-title { font-size: 14px; padding-bottom: 12px; margin-bottom: 16px; }

/* Card */
.card {
  background: #fff; border-radius: var(--radius-lg);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  padding: 28px 32px; margin-bottom: 20px;
}
.card-title {
  font-size: 15px; font-weight: 600; color: var(--text);
  padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.card-title .step-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--primary); color: #fff; font-size: 12px; font-weight: 700;
}

/* Info rows */
.info-row { display: flex; gap: 24px; margin-bottom: 14px; }
.info-item { flex: 1; }
.info-item .info-label { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
.info-item .info-value { font-size: 14px; font-weight: 500; color: var(--text); }

/* Unit info grid */
.step1-fields-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
}
.step1-fields-grid .info-item {
  padding: 10px 14px; background: #F8FAFC; border-radius: 8px;
  border: 1px solid var(--border);
}
.step1-fields-grid .info-label {
  font-size: 11px; color: var(--text-light); margin-bottom: 4px; font-weight: 500;
}
.step1-fields-grid .info-value {
  font-size: 14px; font-weight: 600; color: var(--text);
}
.step1-fields-grid .info-item.full-width {
grid-column: 1 / -1;
}
	.step1-fields-grid .info-item-placeholder {
  visibility: hidden; padding: 10px 14px;
	}

	/* Detail table */
.detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.detail-table th {
  padding: 10px 12px; text-align: center; font-weight: 600; font-size: 12px;
  color: var(--text-secondary); background: #F8FAFC; border: 1px solid var(--border);
}
.detail-table td {
  padding: 10px 12px; border: 1px solid var(--border); text-align: center;
  color: var(--text); font-size: 13px;
}
.detail-table .row-label {
  text-align: left; font-weight: 500; color: var(--text-secondary);
  background: #F8FAFC;
}
.detail-table .total-row td { font-weight: 600; color: var(--primary); background: #F8FAFC; }

/* Attachment */
.attachment-item {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
  background: #EFF6FF; border-radius: 6px; font-size: 13px; color: var(--primary);
  cursor: pointer; text-decoration: none; transition: var(--transition);
}
.attachment-item:hover { background: #DBEAFE; }
	.bf-tip-icon { display: inline-block; width: 14px; height: 14px; line-height: 14px; text-align: center; border-radius: 50%; background: #DBEAFE; color: #1E40AF; font-size: 9px; cursor: pointer; margin-left: 2px; font-style: normal; vertical-align: middle; }
	.bf-tip-icon:hover { background: #BFDBFE; }
.bf-tooltip-popup { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 16px; width: 300px; font-size: 12px; line-height: 1.7; color: var(--text); }
.bf-tooltip-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.bf-tooltip-body { color: var(--text-secondary); }
	
	#bf-tooltip-popup strong { color: #FBBF24; }
.attachment-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
.attachment-name { font-size: 13px; color: var(--text); font-weight: 500; }
.file-links { display: inline-flex; gap: 10px; }
.file-link { font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: none; white-space: nowrap; }
.file-link:hover { text-decoration: underline; }

/* ===== PROGRESS TRACKER ===== */
.progress-tracker {
  display: flex; align-items: center; justify-content: center;
  padding: 8px 0 20px;
}
.progress-step {
  display: flex; flex-direction: column; align-items: center; position: relative;
}
.progress-dot {
  width: 32px; height: 32px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
  transition: var(--transition); position: relative; z-index: 1;
}
.progress-dot.done { background: var(--success); color: #fff; }
.progress-dot.current { background: var(--primary); color: #fff; box-shadow: 0 0 0 6px rgba(30,64,175,0.12); }
.progress-dot.pending { background: var(--gray-bg); color: var(--text-light); border: 2px solid var(--border); }
.progress-dot.rejected { background: #FEE2E2; color: var(--danger); border-color: var(--danger); }
.progress-label { font-size: 11px; font-weight: 500; margin-top: 8px; text-align: center; white-space: nowrap; }
.progress-label.done { color: var(--success); }
.progress-label.current { color: var(--primary); }
.progress-label.pending { color: var(--text-light); }
.progress-line {
  width: 100px; height: 2px; margin: 0 8px; margin-bottom: 24px;
  position: relative; z-index: 0;
}
.progress-line.done { background: var(--success); }
.progress-line.pending { background: var(--border); }

/* ===== TIMELINE ===== */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px;
  width: 2px; background: var(--border);
}
.timeline-item { position: relative; margin-bottom: 20px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot {
  position: absolute; left: -24px; top: 4px;
  width: 14px; height: 14px; border-radius: 50%; z-index: 1;
}
.timeline-dot.submit { background: var(--accent); }
.timeline-dot.reject { background: var(--danger); }
.timeline-dot.resubmit { background: var(--warning); }
.timeline-dot.approve { background: var(--success); }
.timeline-dot.first_approve { background: #3B82F6; }
.timeline-dot.upload { background: var(--primary); }
.timeline-content .tlc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.timeline-content .tlc-title { font-size: 13px; font-weight: 600; color: var(--text); }
.timeline-content .tlc-time { font-size: 11px; color: var(--text-light); }
.timeline-content .tlc-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.timeline-content .tlc-op { margin-top: 6px; display: flex; gap: 8px; }
.timeline-content .tlc-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 500;
}
.tlc-tag.reject-reason { background: #FEE2E2; color: var(--danger); }
.tlc-tag.resubmit-tag { background: #FEF3C7; color: #D97706; }
.tlc-tag.approve-tag { background: #D1FAE5; color: #059669; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: var(--transition); border: 1px solid transparent;
  font-family: inherit; text-decoration: none;
}
.btn-primary {
  background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
  color: #fff;
}
.btn-primary:hover { box-shadow: 0 4px 12px rgba(30,64,175,0.3); transform: translateY(-1px); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-outline { background: #fff; color: var(--text-secondary); border-color: var(--border); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }

/* Summary bar */
.summary-bar {
  display: flex; gap: 16px; margin-bottom: 20px;
}
.summary-item {
  flex: 1; background: #fff; border-radius: var(--radius); border: 1px solid var(--border);
  padding: 16px 20px; display: flex; align-items: center; gap: 12px;
}
.summary-item .s-icon {
  width: 40px; height: 40px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 18px;
}
.s-icon.blue { background: #EFF6FF; }
.s-icon.green { background: #D1FAE5; }
.s-icon.amber { background: #FEF3C7; }
.summary-item .s-label { font-size: 11px; color: var(--text-light); }
.summary-item .s-value { font-size: 16px; font-weight: 700; color: var(--text); }

/* ===== MODAL ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 999; justify-content: center; align-items: center;
}
.modal-overlay.show { display: flex; }
.modal-container {
  background: #fff; border-radius: var(--radius-lg); width: 680px; max-width: 90vw;
  max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow-lg);
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 24px; border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close {
  background: none; border: none; font-size: 24px; color: var(--text-light);
  cursor: pointer; line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-footer {
  display: flex; justify-content: flex-end; gap: 12px;
  padding: 16px 24px; border-top: 1px solid var(--border);
}
.final-confirm-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.final-confirm-table th {
  text-align: left; padding: 10px 12px; background: #F8FAFC;
  border-bottom: 2px solid var(--border); font-weight: 600; color: var(--text-secondary);
}
.final-confirm-table td {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
}
.final-confirm-table .count-input {
  width: 72px; padding: 6px 10px; border: 1px solid var(--border);
  border-radius: 6px; text-align: center; font-size: 14px; font-weight: 500;
  font-family: inherit;
}
.final-confirm-table .count-input:focus { outline: none; border-color: var(--primary); }

@media (max-width: 1024px) {
  .detail-layout { grid-template-columns: 1fr; }
  .detail-col-right { position: static; }
}
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .info-row { flex-direction: column; gap: 12px; }
  .progress-line { width: 40px; }
}
</style>
</head>

function findById(id) {
  for (var i = 0; i < submissions.length; i++) {
    if (submissions[i].id === id) return submissions[i];
  }
  // Generate fallback for demo IDs not in the main submissions array
  return generateFallback(id);
}

function generateFallback(id) {
  if (!id) return null;
  // Determine school from ID pattern
  var school, batchName, staffingType, status, submitDate;
  // S2026-Cxx → career, S20xx-Dxx → district batch, S20xx-Axx → auto batch, others → control
  if (id.indexOf('-C') >= 0) {
    staffingType = 'career';
    // Map C01→柳州市第一中学, C02→柳州高级中学, C03→柳州市第八中学, C04→柳州市民族高中, C05→柳州市第八中学, C06→柳州市第八中学
    var careerSchools = ['柳州市第一中学','柳州高级中学','柳州市第八中学','柳州市民族高中','柳州市第八中学','柳州市第八中学'];
    var idx = parseInt(id.split('-C')[1]) - 1;
    school = careerSchools[idx] || '柳州市第八中学';
    batchName = id.indexOf('D01') >= 0 ? '2026年度鱼峰区计划' : (id.indexOf('B2026-002') >= 0 ? '2026年度第二批' : '2026年度第一批');
  } else if (id.indexOf('-D') >= 0) {
    staffingType = 'control';
    var dSchools = { 'D01':'柳州市第八中学','D02':'鱼峰区实验小学','D03':'柳州市第十三中学','D04':'柳州市第二十五中学','D05':'鱼峰区实验小学','D06':'柳州市第十三中学' };
    school = dSchools[id.split('-D')[1]] || '柳州市第八中学';
    batchName = id.indexOf('2025') >= 0 ? '2025年度鱼峰区计划' : (id.indexOf('D03') >= 0 && id.indexOf('2026') >= 0 && id > 'S2026-D04' ? '2026年度鱼峰区第二批' : '2026年度鱼峰区计划');
  } else if (id.indexOf('-A') >= 0) {
    staffingType = 'control';
    school = '柳州市第八中学';
    batchName = '2026年度自主申报';
  } else if (id.indexOf('2025') >= 0) {
    staffingType = 'control';
    var s2025 = { 'S2025-001':'柳州市第一中学','S2025-002':'柳州市第二中学','S2025-003':'柳州高级中学','S2025-004':'鱼峰区实验小学' };
    school = s2025[id] || '柳州市第八中学';
    batchName = '2025年度补充批';
  } else {
    staffingType = 'control';
    school = '柳州市第八中学';
    batchName = '2026年度第一批';
  }

  // Determine status and dates based on ID
  var statusMap = {
    'S2026-C01':'submitted','S2026-C02':'reviewing','S2026-C03':'first_approved','S2026-C04':'approved','S2026-C05':'rejected','S2026-C06':'submitted',
    'S2025-001':'approved','S2025-002':'approved','S2025-003':'approved','S2025-004':'rejected',
    'S2025-D01':'approved','S2025-D02':'approved',
    'S2026-D01':'submitted','S2026-D02':'reviewing','S2026-D03':'first_approved','S2026-D04':'submitted','S2026-D05':'submitted','S2026-D06':'submitted',
    'S2026-A01':'submitted','S2026-A02':'final_submitted','S2026-A03':'approved','S2026-A04':'rejected'
  };
  status = statusMap[id] || 'submitted';

  if (id.indexOf('2025') >= 0) {
    submitDate = '2025-11-' + (10 + Math.floor(Math.random() * 20));
  } else {
    submitDate = '2026-0' + (3 + Math.floor(Math.random() * 5)) + '-' + (10 + Math.floor(Math.random() * 20));
  }

  var sd = SCHOOL_DATA[school] || SCHOOL_DATA['柳州市第八中学'];
  var isCareer = staffingType === 'career';

  // Generate useForms array
  var useFormTypes = ['统一公开招聘','单位自主实施招聘','中高级人才招聘','引进高层次人才','调动','其他'];
  var useForms = [];
  var totalNums = 0;
  for (var u = 0; u < useFormTypes.length; u++) {
    var n = (u < 3 && totalNums < 4) ? Math.floor(Math.random() * 3) : 0;
    if (n > 0) totalNums += n;
    useForms.push({ type: useFormTypes[u], num: n, edu: n > 0 ? '本科及以上，相关专业，教师资格证' : '', cond: n > 0 ? '35周岁以下' : '', note: '' });

    history.push({ action:'review', title:'进入审核', time:submitDate + ' 10:30:00', desc:'主管单位已接收申报，进入审核流程。' });
  } else if (status === 'first_approved') {
    history.push({ action:'first_approve', title:'一审通过', time:submitDate + ' 10:00:00', desc:'主管单位一审通过，待编办终审确认。' });
  } else if (status === 'final_submitted') {
    history.push({ action:'first_approve', title:'一审通过', time:submitDate + ' 10:00:00', desc:'主管单位一审通过。' });
    history.push({ action:'final_submit', title:'提交编办确认', time:submitDate + ' 14:00:00', desc:'学校已提交编办确认材料，待主管单位二审确认。' });
  } else if (status === 'approved') {
    history.push({ action:'first_approve', title:'一审通过', time:submitDate + ' 10:00:00', desc:'主管单位一审通过。' });
    history.push({ action:'approve', title:'终审通过', time:submitDate + ' 15:00:00', desc:'编办终审确认通过。' });
  } else if (status === 'rejected') {
    history.push({ action:'reject', title:'审核退回', time:submitDate + ' 11:00:00', desc:'主管单位审核退回，原因：材料不完整，请补充后重新提交。' });
  }

  var formName = isCareer ? '附件2' : '附件9';
  var attName = isCareer ? (formName + '_' + school + '_2026.pdf') : (formName + '_' + school + '_2026.pdf');

  var obj = {
    id: id, batchName: batchName, orgName: school, district: sd.district,
    staffingType: staffingType, formName: formName,
    status: status, submitDate: submitDate,
    totalStaff: sd.totalStaff, currentStaff: sd.currentStaff,
    approvedPlan: sd.approvedPlan, usedPlan: sd.usedPlan,
    unusedPlan: sd.unusedPlan, availablePlan: sd.availablePlan,
    controlNum: sd.controlNum, controlActual: sd.controlActual, unusedControl: sd.unusedControl,
    controlApprovedPlan: sd.controlApprovedPlan, controlUsedPlan: sd.controlUsedPlan,
    controlUnusedPlan: sd.controlUnusedPlan, controlAvailablePlan: sd.controlAvailablePlan,
    orgLevel: sd.orgLevel, orgNature: sd.orgNature,
    authLeader: sd.authLeader, actualLeader: sd.actualLeader, actualOtherLeader: sd.actualOtherLeader,
    useForms: useForms,
    attachment9Name: isCareer ? '' : attName, attachment2Name: isCareer ? attName : '',
    attachment9: !isCareer, attachment2: isCareer,
    followUp: status === 'approved', followUpName: status === 'approved' ? '后续材料_' + school + '.pdf' : '',
    firstApproveTime: (status === 'first_approved' || status === 'approved' || status === 'final_submitted') ? submitDate + ' 10:00:00' : null,
    finalConfirmTime: status === 'approved' ? submitDate + ' 15:00:00' : null,
    finalApprovedDetails: status === 'approved' ? useForms.filter(function(f){return f.num>0;}).map(function(f){return {type:f.type, schoolNum:f.num, finalNum:f.num};}) : null,
    history: history
  };
  if (status === 'final_submitted') {
    obj.schoolFinalConfirm = {
      details: [
        { type: '单位自主实施招聘', schoolNum: 1, finalNum: 1 },

      validityStart: '2026-04-01',

      document: { name: '编办批复文件2026-03号.pdf', size: 234000 },
      submitTime: '2026-03-26 10:00:00',
      submitter: '王玉兰'
    };
  }
  return obj;
}

    ];

    steps = [

      { label: '一审：材料审核', state: 'done' },
      { label: '学校提交编办确认', state: 'current' },
      { label: '二审：编办确认', state: 'pending' },
      { label: '审核完成', state: 'pending' }
    ];
  } else {
    steps = [
      { label: '学校提交', state: 'done' },
      { label: '一审：材料审核', state: 'current' },
      { label: '学校提交编办确认', state: 'pending' },
      { label: '二审：编办确认', state: 'pending' },

var _planDetailFilter = {};
var _planDetailPage = {};
var _PLAN_PAGE_SIZE = 8;

function resetPlanDetailFilter(track) {
  _planDetailFilter[track] = { source: '', status: '', keyword: '' };
  _planDetailPage[track] = 1;
}

function getPlanStatus(p) {
  var now = new Date().toISOString().slice(0,10);
  var remain = p.approvedCount - (p.occupiedCount||0) - (p.usedCount||0);
  if (remain <= 0 && p.approvedCount > 0) return 'exhausted';
  if (p.validEnd && p.validEnd < now && (p.occupiedCount||0) > 0) return 'expiring_occupied';
  if (p.validEnd && p.validEnd < now) return 'expired';
  return 'active';
}

var PLAN_STATUS_LABEL = { active:'有效', exhausted:'已用完', expiring_occupied:'过期·有占用', expired:'已到期' };
var PLAN_STATUS_CLASS = { active:'active', exhausted:'exhausted', expiring_occupied:'warn', expired:'expired' };

function openPlanDetailModal(track) {
  var plans = _demoPlans[track] || [];
  var label = track === 'career' ? '事业编' : '控制数';
  resetPlanDetailFilter(track);
  document.getElementById('planDetailTitle').textContent = label + ' — 已批复计划明细';
  renderPlanDetailBody(track);
  document.getElementById('planDetailModal').classList.add('show');
}

function renderPlanDetailBody(track) {
  var plans = _demoPlans[track] || [];
  var f = _planDetailFilter[track] || { source: '', status: '', keyword: '' };

  // Compute aggregates
  var agg = { approvedPlan:0, occupiedPlan:0, usedPlan:0, unusedPlan:0, expiredOccupiedPlan:0 };
  plans.forEach(function(p) {
    agg.approvedPlan += p.approvedCount;
    agg.occupiedPlan += (p.occupiedCount||0);
    agg.usedPlan += (p.usedCount||0);
  });

  // Filter
  var filtered = plans.filter(function(p) {
    if (f.source && p.source !== f.source) return false;
    if (f.status && getPlanStatus(p) !== f.status) return false;
    if (f.keyword) {
      var kw = f.keyword.toLowerCase();
      var doc = (p.offlineDocNo || p.sourceBatchId || '').toLowerCase();
      if (doc.indexOf(kw) === -1) return false;
    }
    return true;
  });

  // Split active vs expired
  var activePlans = [], expiredPlans = [];
  filtered.forEach(function(p) {
    if (getPlanStatus(p) === 'expired') expiredPlans.push(p);
    else activePlans.push(p);
  });

  // Calculate expired occupied
  filtered.forEach(function(p) {
    var st = getPlanStatus(p);
    if (st === 'expiring_occupied' || st === 'expired') {
      agg.expiredOccupiedPlan += (p.occupiedCount||0);
    }
  });
  agg.unusedPlan = agg.approvedPlan - agg.occupiedPlan - agg.usedPlan;

  // Pagination
  var page = _planDetailPage[track] || 1;
  var totalPages = Math.max(1, Math.ceil(activePlans.length / _PLAN_PAGE_SIZE));
  if (page > totalPages) { page = totalPages; _planDetailPage[track] = page; }
  var start = (page - 1) * _PLAN_PAGE_SIZE;
  var pagePlans = activePlans.slice(start, start + _PLAN_PAGE_SIZE);

  var h = '';
  // Filter bar
  h += '<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;">';
  h += '<select onchange="_planDetailFilter[\'' + track + '\'].source=this.value;_planDetailPage[\'' + track + '\']=1;renderPlanDetailBody(\'' + track + '\')" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px;">';
  h += '<option value="">全部来源</option><option value="online">线上</option><option value="offline">线下</option></select>';
  h += '<select onchange="_planDetailFilter[\'' + track + '\'].status=this.value;_planDetailPage[\'' + track + '\']=1;renderPlanDetailBody(\'' + track + '\')" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px;">';
  h += '<option value="">全部状态</option><option value="active">有效</option><option value="exhausted">已用完</option><option value="expiring_occupied">过期·有占用</option><option value="expired">已到期</option></select>';
  h += '<input type="text" placeholder="搜索批复文号/批次..." oninput="_planDetailFilter[\'' + track + '\'].keyword=this.value;_planDetailPage[\'' + track + '\']=1;renderPlanDetailBody(\'' + track + '\')" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px;width:160px;" value="' + escapeHtml(f.keyword || '') + '">';
  h += '</div>';

  // Summary
  h += '<div style="display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;font-size:12px;padding:10px 14px;background:#F8FAFC;border-radius:6px;">';
  h += '<span>已批复 <strong>' + agg.approvedPlan + '</strong> 人</span>';
  h += '<span>占用 <strong>' + (agg.occupiedPlan||0) + '</strong> 人</span>';
  h += '<span>已入编 <strong>' + Math.max(0, agg.usedPlan - (agg.occupiedPlan||0)) + '</strong> 人</span>';
  h += '<span>未使用 <strong>' + agg.unusedPlan + '</strong> 人</span>';
  if ((agg.expiredOccupiedPlan||0) > 0) h += '<span style="color:#C2410C;">到期占用中 ' + agg.expiredOccupiedPlan + ' 人</span>';
  h += '</div>';

  if (filtered.length === 0) {
    h += '<div style="text-align:center;padding:40px;color:var(--text-light);">无匹配记录</div>';
  } else {
    h += '<table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">序号</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">来源</th>';
    h += '<th style="padding:8px;text-align:left;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">批复文号/批次</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">批复</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">已占用</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">已入编</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">未使用</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">有效期</th>';
    h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">状态</th>';
    h += '</tr></thead><tbody>';

    function renderRow(p, idx) {
      var st = getPlanStatus(p);
      var stLabel = PLAN_STATUS_LABEL[st] || st;
      var stClass = PLAN_STATUS_CLASS[st] || '';
      var remain = p.approvedCount - (p.occupiedCount||0) - (p.usedCount||0);
      var isExpired = st === 'expired';
      var sourceLabel = p.source === 'online' ? '线上' : '线下';
      var sourceColor = p.source === 'online' ? '#2563EB' : '#9333EA';
      var docLabel = p.source === 'online' ? (p.sourceBatchId||'') : (p.offlineDocNo||'');
      var trStyle = isExpired ? 'opacity:0.5;' : '';
      var r = '<tr style="' + trStyle + '">';
      r += '<td style="padding:6px 8px;text-align:center;font-size:11px;color:var(--text-light);border-bottom:1px solid var(--border);">' + idx + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);"><span style="font-size:11px;padding:2px 6px;border-radius:4px;background:' + (p.source==='online'?'#EFF6FF':'#FAF5FF') + ';color:' + sourceColor + ';">' + sourceLabel + '</span></td>';
      r += '<td style="padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);">' + escapeHtml(docLabel) + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);">' + p.approvedCount + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);' + ((p.occupiedCount||0)>0?'color:var(--warning);font-weight:500;':'') + '">' + (p.occupiedCount||0) + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);">' + (p.usedCount||0) + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);font-weight:600;">' + remain + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);">' + (p.validEnd||'—') + '</td>';
      r += '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);"><span style="font-size:10px;padding:2px 6px;border-radius:10px;' + (stClass==='active'?'background:#D1FAE5;color:#059669;':stClass==='exhausted'?'background:#FEE2E2;color:#DC2626;':stClass==='warn'?'background:#FFF7ED;color:#C2410C;':'background:#F1F5F9;color:#64748B;') + '">' + stLabel + '</span></td>';
      r += '</tr>';
      return r;
    }

    var idx = start + 1;
    pagePlans.forEach(function(p) { h += renderRow(p, idx); idx++; });
    h += '</tbody></table>';

    // Expired plans section
    if (expiredPlans.length > 0) {
      h += '<div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-top:16px;margin-bottom:8px;">已到期计划</div>';
      h += '<table style="width:100%;border-collapse:collapse;font-size:12px;opacity:0.6;"><thead><tr>';
      h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">序号</th>';
      h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">来源</th>';
      h += '<th style="padding:8px;text-align:left;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">批复文号/批次</th>';
      h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">批复</th>';
      h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">有效期</th>';
      h += '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border);background:#F8FAFC;font-size:11px;">状态</th>';
      h += '</tr></thead><tbody>';
      var eIdx = 1;
      expiredPlans.forEach(function(p) {
        h += renderRow(p, '🔒 ' + eIdx);
        eIdx++;
      });
      h += '</tbody></table>';
    }

    // Pagination
    if (totalPages > 1) {
      h += '<div style="text-align:center;margin-top:12px;font-size:12px;color:var(--text-secondary);">';
      h += '<button onclick="_planDetailPage[\'' + track + '\']=1;renderPlanDetailBody(\'' + track + '\')" ' + (page<=1?'disabled':'') + ' style="padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;margin-right:4px;">«</button>';
      h += '<span style="margin:0 8px;">' + page + ' / ' + totalPages + '</span>';
      h += '<button onclick="_planDetailPage[\'' + track + '\']=' + (page+1) + ';renderPlanDetailBody(\'' + track + '\')" ' + (page>=totalPages?'disabled':'') + ' style="padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;margin-left:4px;">»</button>';
      h += '</div>';
    }
  }

  document.getElementById('planDetailBody').innerHTML = h;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

</script>

<div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px;"></div>

<style>
@keyframes slideIn { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }

function getEmployUrl() {
  if (currentRole === 'city' || currentRole === 'district') return 'employ-list-admin.html?role=' + currentRole;
  if (currentRole === 'school') return 'employ-list-school.html';
  return null;
}
</style>
</body>
