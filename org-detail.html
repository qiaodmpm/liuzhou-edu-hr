function renderPlanDetailBody2(track) {
  var plans = track === 'career' ? (ledger.careerPlans || []) : (ledger.controlPlans || []);
  var f = planDetailFilter2[track] || { source: '', status: '', keyword: '' };
  var filtered = plans.filter(function(p) {
    if (f.source && p.source !== f.source) return false;
    if (f.status && LPU.computePlanStatus(p) !== f.status) return false;
    if (f.keyword && (p.offlineDocNo || p.sourceBatchId || '').toLowerCase().indexOf(f.keyword.toLowerCase()) === -1) return false;
    return true;
  });
  var activePlans = [], expiredPlans = [];
  for (var i = 0; i < filtered.length; i++) {
    if (LPU.computePlanStatus(filtered[i]) === 'expired') expiredPlans.push(filtered[i]);
    else activePlans.push(filtered[i]);
  }
  var page = planDetailPage2[track] || 1;
  var totalPages = Math.max(1, Math.ceil(activePlans.length / PLAN_PAGE_SIZE));
  if (page > totalPages) { page = totalPages; planDetailPage2[track] = page; }
  var start = (page - 1) * PLAN_PAGE_SIZE;
  var pagePlans = activePlans.slice(start, start + PLAN_PAGE_SIZE);

  function renderRow(p, idx) {
    var st = LPU.computePlanStatus(p);
    var stLabel = LPU.STATUS_LABEL[st] || st;
    var stClass = LPU.STATUS_CLASS[st] || 'gray';
    var remain = LPU.remainingCount(p);
    var isExpired = st === 'expired';
    var sourceLabel = p.source === 'online' ? '线上' : '线下';
    var sourceTagClass = p.source === 'online' ? 'online' : 'offline';
    var docLabel = p.source === 'online' ? escapeHtml(p.sourceBatchId || p.sourceSubmissionId) : escapeHtml(p.offlineDocNo);
    var hl = getHighlightFields();
    var isNewPlan = hl._addedPlans && hl._addedPlans[p.offlineDocNo];
    var r = '<tr class="' + (isExpired ? 'plan-expired-row' : '') + (isNewPlan ? ' plan-new-row' : '') + '">';
    r += '<td style="text-align:center;font-size:11px;color:var(--text-light);">' + idx + (isNewPlan ? ' <span style="color:#D97706;font-weight:600;">🆕</span>' : '') + '</td>';
    r += '<td><span class="plan-tag ' + sourceTagClass + '">' + sourceLabel + '</span>' + (isNewPlan ? ' <span style="font-size:9px;background:#FFF3CD;color:#92400E;padding:1px 4px;border-radius:2px;">新增</span>' : '') + '</td>';
    r += '<td>' + docLabel + '</td>';
    r += '<td>' + (p.approvedCount || 0) + '</td>';
    r += '<td>' + ((p.occupiedCount || 0) > 0 ? '<span style="color:var(--warning);font-weight:500">' + (p.occupiedCount || 0) + '</span>' : '0') + '</td>';
    r += '<td>' + (p.usedCount || 0) + '</td>';
    r += '<td><strong>' + remain + '</strong></td>';
    r += '<td>' + (p.validEnd || '—') + '</td>';
    r += '<td><span class="plan-badge ' + stClass + '">' + stLabel + '</span></td>';
    r += '</tr>';
    return r;
  }

  var h = '';
  h += '<div style="display:flex;gap:8px;margin-bottom:10px;align-items:center;">';
  h += '<select onchange="planDetailFilter2[\'' + track + '\'].source=this.value;planDetailPage2[\'' + track + '\']=1;renderPlanDetailBody2(\'' + track + '\')" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px;"><option value="">全部来源</option><option value="online">线上</option><option value="offline">线下</option></select>';
  h += '<select onchange="planDetailFilter2[\'' + track + '\'].status=this.value;planDetailPage2[\'' + track + '\']=1;renderPlanDetailBody2(\'' + track + '\')" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px;"><option value="">全部状态</option><option value="active">有效</option><option value="exhausted">已用完</option><option value="expiring_occupied">过期·有占用</option><option value="expired">已到期</option></select>';
  h += '<input type="text" placeholder="搜索批复文号/批次..." oninput="planDetailFilter2[\'' + track + '\'].keyword=this.value;planDetailPage2[\'' + track + '\']=1;renderPlanDetailBody2(\'' + track + '\')" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px;width:160px;">';
  h += '</div>';

  if (filtered.length === 0) {
    h += '<div class="plan-empty">无匹配记录</div>';
  } else {
    var colSpan = 9;
    h += '<table class="plan-table"><thead><tr>';
    h += '<th style="width:36px">序号</th><th>来源</th><th>批复文号/批次</th><th>批复</th><th>已占用</th><th>已入编</th><th>未使用</th><th>有效期</th><th>状态</th>';
    h += '</tr></thead><tbody>';
    for (var ai = 0; ai < pagePlans.length; ai++) h += renderRow(pagePlans[ai], start + ai + 1);
    if (expiredPlans.length > 0) {
      var toggleId = 'expired-toggle-d2-' + track;
      h += '<tr class="plan-expired-toggle" onclick="toggleExpiredPlans2(\'' + toggleId + '\',this)" style="cursor:pointer;background:var(--gray-bg)">';
      h += '<td colspan="' + colSpan + '" style="text-align:center;padding:8px;font-size:11px;color:var(--text-secondary)">🔒 <span id="' + toggleId + '-label">含已到期 ' + expiredPlans.length + ' 条 ▸</span></td></tr>';
      h += '<tbody id="' + toggleId + '" style="display:none">';
      h += '<tr><td colspan="' + colSpan + '" style="padding:4px 8px;font-size:10px;color:var(--text-light);background:#FEF2F2">已到期计划，未使用名额不计入上方统计</td></tr>';
      for (var ei = 0; ei < expiredPlans.length; ei++) h += renderRow(expiredPlans[ei], activePlans.length + ei + 1);
      h += '</tbody>';
    }
    h += '</tbody></table>';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:11px;color:var(--text-secondary);">';
    h += '<span>共 ' + filtered.length + ' 条</span>';
    h += '<div style="display:flex;align-items:center;gap:4px;">';
    h += '<button class="btn btn-sm btn-outline" onclick="planDetailPage2[\'' + track + '\']=1;renderPlanDetailBody2(\'' + track + '\')" ' + (page <= 1 ? 'disabled' : '') + ' style="padding:2px 8px;">«</button>';
    h += '<button class="btn btn-sm btn-outline" onclick="planDetailPage2[\'' + track + '\']=Math.max(1,' + (page - 1) + ');renderPlanDetailBody2(\'' + track + '\')" ' + (page <= 1 ? 'disabled' : '') + ' style="padding:2px 8px;">‹</button>';
    h += '<span style="padding:0 8px;">第 ' + page + ' / ' + totalPages + ' 页</span>';
    h += '<button class="btn btn-sm btn-outline" onclick="planDetailPage2[\'' + track + '\']=' + (page + 1) + ';renderPlanDetailBody2(\'' + track + '\')" ' + (page >= totalPages ? 'disabled' : '') + ' style="padding:2px 8px;">›</button>';
    h += '<button class="btn btn-sm btn-outline" onclick="planDetailPage2[\'' + track + '\']=' + totalPages + ';renderPlanDetailBody2(\'' + track + '\')" ' + (page >= totalPages ? 'disabled' : '') + ' style="padding:2px 8px;">»</button>';
    h += '</div></div>';
  }
  document.getElementById('planDetailBody2').innerHTML = h;
}

function closePlanDetailModal2() {
  document.getElementById('planDetailModal2').classList.remove('show');
}

function toggleExpiredPlans2(toggleId, row) {
  var tbody = document.getElementById(toggleId);
  var label = document.getElementById(toggleId + '-label');
  if (!tbody || !label) return;
  if (tbody.style.display === 'none') { tbody.style.display = ''; label.textContent = label.textContent.replace('▸', '▾'); }
  else { tbody.style.display = 'none'; label.textContent = label.textContent.replace('▾', '▸'); }
}

function formatFileSize2(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

  // 管理岗/工勤岗 等级表 — 实聘数（无小高地）
  actualTotal:{ title:'实聘数', body:'<strong>= 实名编 + 控制数</strong><br><br>本岗位类别当前实际在岗人数之和。含事业编实名制人员和聘用控制数人员。<br><br>不含超岗聘用数（超岗聘用是计算结果，不参与自身求和）。<br><br>本类别不包含小高地岗位。' },

  overQuotaPost:{ title:'超岗聘用数', body:'<strong>= max(0, 实名编 + 控制数 − 核定岗位数)</strong><br><br>实际在岗人数超出核定岗位数的部分。系统根据核定岗位数和实聘数自动计算，不可手动修改。<br><br>超岗聘用不计入核定岗位数，但计入实聘数合计。' }
};

function showAggTooltip(event, field) {
  var existing = document.getElementById('bf-tooltip-popup');
  if (existing) existing.remove();
  var info = AGG_TOOLTIPS[field];
  if (!info) return;
  var popup = document.createElement('div');
  popup.id = 'bf-tooltip-popup';
  popup.className = 'bf-tooltip-popup';
  popup.innerHTML = '<div class="bf-tooltip-title">' + info.title + ' ⓘ</div><div class="bf-tooltip-body">' + info.body + '</div><button class="btn btn-sm btn-primary" onclick="document.getElementById(\'bf-tooltip-popup\').remove()" style="margin-top:8px">知道了</button>';
  popup.style.position = 'fixed';
  popup.style.top = Math.min(event.clientY, window.innerHeight - 280) + 'px';
  popup.style.left = Math.min(event.clientX, window.innerWidth - 320) + 'px';
  popup.style.zIndex = '9999';
  document.body.appendChild(popup);
  setTimeout(function() {
    document.addEventListener('click', function closeAgg(e) {
      if (!popup.contains(e.target) && e.target.className.indexOf('bf-tip-icon') === -1) {
        popup.remove();
        document.removeEventListener('click', closeAgg);
      }
    });
  }, 100);
}
