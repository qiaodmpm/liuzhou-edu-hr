@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 240px;
}

body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.topnav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; transition: var(--transition); font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }

.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; display: flex; flex-direction: column; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label, .sidebar.collapsed .menu-group, .sidebar.collapsed .menu-badge, .sidebar.collapsed .role-switcher-label, .sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7); transition: var(--transition); position: relative; text-decoration: none; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }

.type-tag.public { background: #FEF3C7; color: #92400E; }

.section-title { font-size: 13px; font-weight: 600; color: var(--primary); margin: 0 0 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.form-row { display: flex; gap: 16px 20px; flex-wrap: wrap; margin-bottom: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; min-width: 150px; flex: 1; }
.form-group.wide { flex-basis: 420px; }
.form-group.narrow { flex: 0 1 480px; min-width: 220px; }
.form-group label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
.req { color: var(--danger); margin-right: 3px; font-weight: 700; }
.form-group input[type="text"], .form-group input[type="number"], .form-group select, .form-group textarea { padding: 8px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; color: var(--text); background: #fff; width: 100%; transition: var(--transition); }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }

.checkbox-group { display: flex; flex-wrap: wrap; gap: 12px 22px; padding: 0; margin-bottom: 16px; }
.checkbox-group label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); cursor: pointer; }
.checkbox-group label:disabled { cursor: not-allowed; }
.checkbox-group input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--primary); }
.checkbox-group input[type="checkbox"]:disabled { accent-color: var(--text-light); }

.auto-fill-tag { font-size: 11px; background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 10px; }

.readonly-banner { background: #FEF3C7; border: 1px solid #FDE68A; color: #92400E; padding: 10px 14px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--gray-bg); }

.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease; box-shadow: var(--shadow-lg); }
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

@media (max-width: 768px) { .form-row { flex-direction: column; } .form-group { min-width: 0; } .form-group.narrow { flex: 1; } }
</style>
</head>

function showToast(msg, type) { var el = document.createElement('div'); el.className = 'toast ' + (type||''); el.textContent = msg; document.getElementById('toastContainer').appendChild(el); setTimeout(function(){el.remove();}, 2000); }
function toggleUserMenu() { var el = document.getElementById('userDropdown'); if (el) el.classList.toggle('show'); }
document.addEventListener('click', function(e) { var ud = document.getElementById('userDropdown'); if (ud && !e.target.closest('.topnav-user')) ud.classList.remove('show'); });
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

function loadRecords() { var s = localStorage.getItem('recruit_records'); if (s) { try { return JSON.parse(s); } catch(e) {} } return []; }
function findRecord(id) { return loadRecords().find(function(r) { return r.id === id; }) || null; }
function getTotalCount(formData) { if (!formData || !formData.positions) return 0; var total = 0; formData.positions.forEach(function(p) { total += (parseInt(p.count) || 0); }); return total; }

// ===== RECRUIT STATS STORAGE（独立 key，避免 admin 页 seedDemoData 整体覆盖 recruit_records 时丢失）=====
function loadRecruitStats() { var s = localStorage.getItem('recruit_stats'); if (s) { try { return JSON.parse(s) || {}; } catch(e) {} } return {}; }
function saveRecruitStatsObj(obj) {
  var all = loadRecruitStats();
  all[recordId] = obj;
  localStorage.setItem('recruit_stats', JSON.stringify(all));
}

// ===== FORM HELPERS =====
function isEditable() { return currentRole === 'school' && currentRecord && currentRecord.status === 'completed'; }
function disAttr() { return isEditable() ? '' : ' disabled'; }

function g(id) { return document.getElementById(id); }

function numVal(id) { var el = g(id); if (!el) return 0; var v = parseInt(el.value); return isNaN(v) ? 0 : v; }

function chkVal(id) { var el = g(id); return !!(el && el.checked); }
function chk(key, label, checked, req) { return '<label>' + (req ? '<span class="req">*</span>' : '') + '<input type="checkbox" id="st_' + key + '"' + (checked ? ' checked' : '') + disAttr() + '> ' + label + '</label>'; }
// normYesNo：兼容旧布尔值/字符串，统一归一到 'yes'/'no'，默认 'yes'
function normYesNo(v) { if (v === 'no' || v === false) return 'no'; return 'yes'; }
function sel(id, options, selected, extra) {
  var h = '<select id="st_' + id + '"' + (extra ? ' ' + extra : '') + disAttr() + '>';
  options.forEach(function(o) { h += '<option value="' + o[0] + '"' + (String(selected) === String(o[0]) ? ' selected' : '') + '>' + o[1] + '</option>'; });
  h += '</select>';
  return h;
}
function input(id, val, opts) { opts = opts || {}; var w = opts.wide ? ' wide' : ''; return '<input type="' + (opts.number ? 'number' : 'text') + '" id="st_' + id + '" value="' + (val === null || val === undefined ? '' : escapeHtml(val)) + '" min="0"' + disAttr() + '>'; }
function textarea(id, val, maxLen) { return '<textarea id="st_' + id + '" rows="3"' + (maxLen ? ' maxlength="' + maxLen + '"' : '') + disAttr() + '>' + escapeHtml(val) + '</textarea>'; }

function fg(id, label, controlHtml, opts) {
  opts = opts || {};
  var note = opts.note ? '<div class="field-note">' + opts.note + '</div>' : '';
  // 除显式 required:false 外，默认全部为必填（自动计算字段 / 允许留空的字段显式排除）
  var isReq = opts.required !== false;
  var req = isReq ? ' required' : '';
  var reqMark = isReq ? '<span class="req">*</span>' : '';
  var cls = (opts.wide ? ' wide' : '') + (opts.narrow ? ' narrow' : '');
  return '<div class="form-group' + cls + '"><label class="' + req + '">' + reqMark + label + '</label>' + controlHtml + note + '</div>';
}

// 还需暂缓办理手续 = 实际招聘计划 − 已办理 − 本次办理（自动计算，不手动填写）
function calcDefer() {
  var pa = Math.max(0, (stats.planTotal || 0) - (stats.planCut || 0));
  return Math.max(0, pa - (stats.employDone || 0) - (stats.employThis || 0));
}

// ===== COLLECT / APPLY =====
function collectStats() {
  var pt = numVal('st_planTotal'); var pc = numVal('st_planCut');
  var pa = Math.max(0, pt - pc);
  var eDone = numVal('st_employDone'); var eThis = numVal('st_employThis');
  var eDefer = Math.max(0, pa - eDone - eThis);
  var s = {
    planTotal: pt, planCut: pc, planActual: pa,
    employDone: eDone, employThis: eThis, employDefer: eDefer,
    deptApproved: chkVal('st_deptApproved'), rsApproved: chkVal('st_rsApproved'),
    pubChannel: { rs: chkVal('st_pubRs'), dept: chkVal('st_pubDept'), own: chkVal('st_pubOwn') },
    pubName: g('st_pubName') ? g('st_pubName').value : '', pub7Days: g('st_pub7Days') ? g('st_pub7Days').value === 'true' : false,
    adjust: g('st_adjust') ? g('st_adjust').value : 'none', adjustContent: g('st_adjustContent') ? g('st_adjustContent').value : '',
    adjustChannel: { rs: chkVal('st_adjRs'), dept: chkVal('st_adjDept'), own: chkVal('st_adjOwn') },
    gongshiChannel: { rs: chkVal('st_gsRs'), dept: chkVal('st_gsDept'), own: chkVal('st_gsOwn') },
    verifyOriginals: g('st_verify') ? g('st_verify').value : 'yes', ratioAdjust: g('st_ratio') ? g('st_ratio').value : 'no',
    writtenExam: g('st_writtenExam') ? g('st_writtenExam').value : '无异常情况',
    writtenExamDetail: g('st_writtenExamDetail') ? g('st_writtenExamDetail').value : '',
    interviewImpl: g('st_interviewImpl') ? g('st_interviewImpl').value : '无异常情况',
    interviewImplDetail: g('st_interviewImplDetail') ? g('st_interviewImplDetail').value : '',
    interviewerTotal: numVal('st_iOwn') + numVal('st_iDept') + numVal('st_iRs') + numVal('st_iOther'),
    interviewerOwn: numVal('st_iOwn'), interviewerDept: numVal('st_iDept'), interviewerRs: numVal('st_iRs'), interviewerOther: numVal('st_iOther'),
    assessMaterials: g('st_assess') ? g('st_assess').value : 'yes',
    physicalExam: g('st_physical') ? g('st_physical').value : 'yes',
    meetingMinutes: g('st_meeting') ? g('st_meeting').value : 'yes',
    resultReviewed: g('st_resultReviewed') ? g('st_resultReviewed').value : 'yes',
    negativeSentiment: g('st_sentiment') ? g('st_sentiment').value : 'no', reportComplaint: g('st_complaint') ? g('st_complaint').value : 'no',
    archive: { a: g('st_archA') ? g('st_archA').value : 'yes', b: g('st_archB') ? g('st_archB').value : 'yes', c: g('st_archC') ? g('st_archC').value : 'yes', d: g('st_archD') ? g('st_archD').value : 'yes', e: g('st_archE') ? g('st_archE').value : 'yes', f: g('st_archF') ? g('st_archF').value : 'yes' },
    archiveOther: g('st_archOther') ? g('st_archOther').value : '',
    otherNotes: g('st_otherNotes') ? g('st_otherNotes').value : '',
    updateTime: stats && stats.updateTime ? stats.updateTime : '', updateOperator: stats && stats.updateOperator ? stats.updateOperator : ''
  };
  return s;
}

function recalcPlan() {
  var t = numVal('st_planTotal'); var c = numVal('st_planCut');
  var actual = Math.max(0, t - c);
  var el = g('st_planActual');
  if (el) el.textContent = actual;
  return actual;
}

function recalcAll() {
  var a = recalcPlan();
  var d = numVal('st_employDone') + numVal('st_employThis');
  var defEl = g('st_employDefer');
  if (defEl) defEl.textContent = Math.max(0, a - d);
  var done = d + Math.max(0, a - d);
  var cel = g('st_planActual');
  if (cel) cel.classList.toggle('warn', a !== done);
}

// 面试考官总数 = 本单位 + 主管部门 + 人社部门选派 + 其他单位考官（自动计算，不手动输入）
function calcITotal() {
  return (stats.interviewerOwn || 0) + (stats.interviewerDept || 0) + (stats.interviewerRs || 0) + (stats.interviewerOther || 0);
}
function recalcITotal() {
  var t = numVal('st_iOwn') + numVal('st_iDept') + numVal('st_iRs') + numVal('st_iOther');
  var el = g('st_iTotal');
  if (el) el.textContent = t;
  return t;
}

function bindEvents() {
  if (!isEditable()) return;
  ['st_planTotal', 'st_planCut', 'st_employDone', 'st_employThis'].forEach(function(id) {
    var el = g(id);
    if (el) el.addEventListener('input', recalcAll);
  });
  ['st_iOwn', 'st_iDept', 'st_iRs', 'st_iOther'].forEach(function(id) {
    var el = g(id);
    if (el) el.addEventListener('input', recalcITotal);
  });
}

function renderPage() {
  var html = '<div class="back-link" onclick="goBack()">&#8592; 返回</div>';

  if (!currentRecord) {

      '<div style="font-size:48px;margin-bottom:16px;">&#x1F4CB;</div>' +

      '<div style="color:var(--text-light);">请检查申请编号是否正确</div></div>';
    document.getElementById('mainContent').innerHTML = html;
    return;
  }

  var r = currentRecord;
  var typeLabel = RECRUITMENT_TYPE_MAP[r.recruitmentType] || r.recruitmentType;
  var typeCls = r.recruitmentType;
  var statusLabel = STATUS_MAP[r.status] || r.status;
  var stampCls = r.status === 'completed' ? 'completed' : 'pending';

  html += '<div class="page-header"><div>';
  html += '<h1>招聘情况统计表</h1>';
  html += '<div class="subtitle">申请编号：' + r.id + ' | 单位：' + escapeHtml(r.schoolName) + ' | 批次：' + escapeHtml(r.batchName) + ' | 招聘类型：<span class="type-tag ' + typeCls + '">' + typeLabel + '</span></div>';
  html += '</div>';
  html += '<div style="display:flex;align-items:center;gap:12px;">';
  if (stats && stats.updateTime) html += '<span class="stats-meta">录入：' + escapeHtml(stats.updateOperator || '') + ' · ' + escapeHtml(stats.updateTime) + '</span>';
  html += '<span class="status-stamp ' + stampCls + '">' + statusLabel + '</span>';
  html += '</div></div>';

  if (r.status !== 'completed') {
    html += '<div class="not-completed-banner">该申请尚未完成审核，无需录入招聘情况统计表。审核完成后（状态为「已完成」）方可录入。</div>';
    document.getElementById('mainContent').innerHTML = html;
    return;
  }

  if (!isEditable()) {
    html += '<div class="readonly-banner">当前为只读查看模式（区/市管理员）。如需修改，请以学校管理员身份进入。可点击「下载统计表」保存归档。</div>';
  }

  html += renderSection1();
  html += renderSection2();
  html += renderSection3();
  html += renderSection4();
  html += renderSection5();

  html += '<div class="action-bar">';
  html += '<button type="button" class="btn btn-outline" onclick="downloadDoc()">&#11015; 下载统计表</button>';
  if (isEditable()) {
    html += '<button type="button" class="btn btn-primary" onclick="saveStats()">保存统计表</button>';
  }
  html += '</div>';

  document.getElementById('mainContent').innerHTML = html;
  bindEvents();
}

// ===== SAVE =====
function saveStats() {
  var s = collectStats();
  if (s.planTotal <= 0) { showToast('请填写原计划招聘人数', 'warning'); return; }
  var planCutEl = g('st_planCut');
  if (!planCutEl || planCutEl.value === '') { showToast('请填写核减或取消计划人数', 'warning'); return; }
  var actual = s.planActual;
  var done = s.employDone + s.employThis + s.employDefer;
  if (done !== actual) { showToast('已办理 + 本次办理 + 暂缓办理（' + done + '）须等于实际招聘计划（' + actual + '）', 'warning'); return; }
  if (!s.pubName || !String(s.pubName).trim()) { showToast('请填写公告名称', 'warning'); return; }
  if (!s.pubChannel.rs && !s.pubChannel.dept && !s.pubChannel.own) { showToast('请至少勾选一个公告发布地址', 'warning'); return; }
  if (!s.gongshiChannel.rs && !s.gongshiChannel.dept && !s.gongshiChannel.own) { showToast('请至少勾选一个公示地址', 'warning'); return; }
  if (s.adjust === 'adjust') {
    if (!s.adjustContent || !String(s.adjustContent).trim()) { showToast('请填写主要调整内容', 'warning'); return; }
    if (!s.adjustChannel.rs && !s.adjustChannel.dept && !s.adjustChannel.own) { showToast('请至少勾选一个公告调整发布地址', 'warning'); return; }
  }

  var now = new Date();
  var ts = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  s.updateTime = ts;
  s.updateOperator = ROLES[currentRole].name;
  saveRecruitStatsObj(s);
  stats = s;
  showToast('招聘情况统计表已保存', 'success');
  setTimeout(function() { window.location.href = 'recruit-list-school.html'; }, 900);
}

// ===== DOWNLOAD（生成 Word 兼容 .doc，无第三方依赖）=====
function yn(v) { return v === true ? '是' : '否'; }
function ynStr(v) { return v === 'yes' ? '是' : (v === 'dept' ? '经主管部门批准调整' : '否'); }
function ch(v) { return v ? '✓' : ''; }

function buildDocHtml() {
  var s = stats;
  var rows = [];
  function row(label, val, colspan) { rows.push('<tr><td style="width:220px;">' + label + '</td><td' + (colspan ? ' colspan="' + colspan + '"' : '') + '>' + (val === '' || val === null || val === undefined ? '' : val) + '</td></tr>'); }

  row('申请编号', recordId);
  row('招聘单位', currentRecord.schoolName);
  row('招聘批次', currentRecord.batchName);
  row('招聘类型', RECRUITMENT_TYPE_MAP[currentRecord.recruitmentType] || currentRecord.recruitmentType);

  rows.push('<tr><td colspan="2" style="font-weight:700;background:#F1F5F9;text-align:center;">一、基本情况</td></tr>');
  row('原计划招聘（人）', s.planTotal);
  row('核减或取消计划（个）', s.planCut);
  row('实际招聘计划（人）', s.planActual);
  row('已办理聘用手续（人）', s.employDone);
  row('本次办理手续（人）', s.employThis);
  row('还需暂缓办理手续（人）', s.employDefer);
  row('主管部门审核情况', (s.deptApproved ? '主管部门已审核✓' : '主管部门已审核') + '；' + (s.rsApproved ? '人社部门已核准✓' : '人社部门已核准'));

  rows.push('<tr><td colspan="2" style="font-weight:700;background:#F1F5F9;text-align:center;">二、信息发布情况</td></tr>');
  var chTxt = function(obj) { var parts = []; if (obj.rs) parts.push('人社部门指定网站'); if (obj.dept) parts.push('主管部门网站'); if (obj.own) parts.push('本单位网站'); return parts.length ? parts.join('、') : '（ 未勾选  ）'; };
  row('公告名称', s.pubName);
  row('公告发布地址', chTxt(s.pubChannel));
  row('公告发布满7个工作日', yn(s.pub7Days));
  row('调整公告情况', s.adjust === 'adjust' ? '有调整' : '无调整');
  row('主要调整内容', s.adjustContent);
  row('公告调整发布地址', chTxt(s.adjustChannel));
  row('公示地址', chTxt(s.gongshiChannel));

  rows.push('<tr><td colspan="2" style="font-weight:700;background:#F1F5F9;text-align:center;">三、招聘过程</td></tr>');
  row('审核相关证件原件', s.verifyOriginals === 'yes' ? '是' : '否');
  row('调整开考比例情况', s.ratioAdjust === 'dept' ? '经主管部门批准调整' : '未调整');
  row('笔试组织实施情况', s.writtenExam === '具体异常说明' ? '具体异常说明' + (s.writtenExamDetail ? '：' + s.writtenExamDetail : '') : (s.writtenExam || ''));
  row('面试（实操）组织实施情况', s.interviewImpl === '具体异常说明' ? '具体异常说明' + (s.interviewImplDetail ? '：' + s.interviewImplDetail : '') : (s.interviewImpl || ''));
  row('面试考官组成', '共' + s.interviewerTotal + '人，其中本单位' + s.interviewerOwn + '人、主管部门' + s.interviewerDept + '人、人社部门选派' + s.interviewerRs + '人、其他单位考官' + s.interviewerOther + '人');
  row('对考核人选逐一出具考核材料', s.assessMaterials === 'yes' ? '是' : '否');
  row('按规定组织体检', s.physicalExam === 'yes' ? '是' : '否');
  row('领导班子集体研究确定拟聘人员的会议纪要', s.meetingMinutes === 'yes' ? '有' : '无');
  row('招聘结果审核情况', s.resultReviewed === 'yes' ? '主管部门已审核' : '未审核');
  row('是否有负面舆情', s.negativeSentiment === 'yes' ? '是' : '否');
  row('是否有举报投诉', s.reportComplaint === 'yes' ? '是' : '否');

  rows.push('<tr><td colspan="2" style="font-weight:700;background:#F1F5F9;text-align:center;">四、材料存档备查情况</td></tr>');
  var archLabels = [['a','面向社会发布招聘公告、调整公告信息、公示等的证明材料'],['b','笔试面试成绩汇总表、评分原始材料及相关音像资料、面试考官签到表'],['c','调整招聘公告、降低开考比例的批复材料'],['d','拟聘人员体检表'],['e','拟聘人员考察材料'],['f','拟聘人员与招聘条件相符的相关证件复印件']];
  archLabels.forEach(function(it) { row(it[1], s.archive[it[0]] === 'yes' ? '已存档' : '未存档'); });
  row('其他已存档材料', s.archiveOther);

  rows.push('<tr><td colspan="2" style="font-weight:700;background:#F1F5F9;text-align:center;">五、其他需说明的情况</td></tr>');
  row('说明', s.otherNotes, 1);

  var sHtml = rows.join('');
  return '<table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:12pt;font-family:\'SimSun\',serif;">' +
    '<tr><td colspan="2" style="text-align:center;font-size:16pt;font-weight:700;padding:12px;">招聘情况统计表</td></tr>' +
    sHtml +
    '<tr><td colspan="2" style="text-align:right;padding:10px;">填报单位（盖章）：____________&nbsp;&nbsp;填报日期：____________</td></tr>' +
    '</table>';
}

function downloadDoc() {
  if (!stats || !stats.updateTime) { showToast('请先填写并保存统计表后再下载', 'warning'); return; }
  var body = buildDocHtml();
  var docHtml = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>招聘情况统计表_' + recordId + '</title></head><body>' + body + '</body></html>';
  var blob = new Blob(['﻿' + docHtml], { type: 'application/msword' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '招聘情况统计表_' + recordId + '.doc';
  document.body.appendChild(a);
  a.click();
  setTimeout(function() { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

// ===== NAVIGATION =====
function goBack() {
  if (currentRole === 'school') { window.location.href = 'recruit-list-school.html'; return; }
  window.location.href = 'recruit-list-admin.html?role=' + currentRole;
}
function getBackUrl() {
  if (currentRole === 'school') return 'recruit-list-school.html';
  return 'recruit-list-admin.html?role=' + currentRole;
}
function getEmployUrl() {
  if (currentRole === 'city' || currentRole === 'district') return 'employ-list-admin.html?role=' + currentRole;
  if (currentRole === 'school') return 'employ-list-school.html';
  return null;
}

function renderSidebar() { renderSidebarMenu('sidebarMenu', currentRole, 'recruit'); }

function sidebarClick(el, id) {
  if (arguments.length === 1) { id = el; el = null; }
  if (el) { document.querySelectorAll('.sidebar-menu .menu-item').forEach(function(i) { i.classList.remove('active'); }); el.classList.add('active'); }
  if (id === 'workbench') { window.location.href = 'workbench.html'; return; }
  if (id === 'recruit') { window.location.href = getBackUrl(); return; }
  if (id === 'employ') { var url = getEmployUrl(); if (url) window.location.href = url; else showToast('跳转至：聘用手续办理'); return; }
  if (id === 'contract-entry') { var cr = currentRole; window.location.href = (cr === 'city' || cr === 'district') ? 'contract-entry-list-admin.html' : 'contract-entry-list-school.html'; return; }
  if (id === 'contract-exit') { var cr2 = currentRole; window.location.href = (cr2 === 'city' || cr2 === 'district') ? 'contract-exit-list-admin.html' : 'contract-exit-list-school.html'; return; }
  if (id === 'postset') { window.location.href = 'post-list-school.html'; return; }
  if (id === 'promote') { window.location.href = 'promote-list-school.html'; return; }
  if (id === 'staffing') { window.location.href = 'staffing-application.html'; return; }
  if (id === 'entry') { window.location.href = '教师入编管理（学校管理员视角）.html'; return; }
  if (id === 'exit') { window.location.href = '教师出编管理（学校管理员视角）.html'; return; }
  if (id === 'ledger') { var lr = currentRole; window.location.href = (lr === 'city' || lr === 'district') ? 'org-ledger-admin.html' : lr === 'school' ? 'org-ledger-school.html' : 'workbench.html'; return; }
  else if (id === 'account') { window.location.href = 'account-management.html'; }
  else if (id === 'org') { window.location.href = 'org-management.html'; }
  if (id === 'announcement') { window.location.href = 'announcement-management.html'; return; }
  showToast('跳转至：' + (el.querySelector('.menu-label') ? el.querySelector('.menu-label').textContent : id));
}

function switchRole(role) {
  if (role === 'school') { window.location.href = 'recruit-list-school.html'; return; }
  if (role === 'teacher') { showToast('教师角色无法访问招聘模块', 'warning'); return; }
  if (role === 'city' || role === 'district') {
    window.location.href = 'recruit-list-admin.html?role=' + role; return;
  }
}

function updateRoleUI() {
  var roleData = ROLES[currentRole];
  if (!roleData) return;
  document.getElementById('userAvatar').textContent = roleData.short;
  document.getElementById('userName').textContent = roleData.name;
  document.querySelectorAll('.role-switch-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.role === currentRole);
  });
  document.getElementById('bcList').href = getBackUrl();
}

// ===== INIT =====
(function init() {
  var params = new URLSearchParams(window.location.search);
  var urlRole = params.get('role');
  if (urlRole === 'city' || urlRole === 'district' || urlRole === 'school') {
    currentRole = urlRole;
  }
  updateRoleUI();
  renderSidebar();

  recordId = params.get('id');
  if (recordId) {
    currentRecord = findRecord(recordId);
    var all = loadRecruitStats();
    if (all[recordId]) {
      stats = Object.assign(emptyStats(), all[recordId]);
    } else {
      stats = emptyStats();
      stats.planTotal = getTotalCount(currentRecord ? currentRecord.formData : null);
      stats.planActual = stats.planTotal;
    }
  }
  renderPage();
})();
</script>
