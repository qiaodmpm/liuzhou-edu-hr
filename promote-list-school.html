<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岗位晋升管理（学校） — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ===== TOP NAVBAR ===== */
.topnav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; transition: var(--transition); font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }

/* ===== SIDEBAR ===== */
.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; display: flex; flex-direction: column; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label, .sidebar.collapsed .menu-group, .sidebar.collapsed .menu-badge, .sidebar.collapsed .role-switcher-label, .sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7); transition: var(--transition); position: relative; text-decoration: none; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }

/* ===== MAIN ===== */
.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px; min-height: calc(100vh - 56px); transition: margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.page-header-left h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-header-left .subtitle { font-size: 12px; color: var(--text-light); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--transition); border: 1px solid transparent; font-family: inherit; text-decoration: none; }
.btn-primary { background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); color: #fff; }
.btn-primary:hover { box-shadow: 0 4px 12px rgba(30,64,175,0.3); transform: translateY(-1px); }
.btn-outline { background: #fff; color: var(--primary); border-color: var(--border); }
.btn-outline:hover { border-color: var(--primary); background: var(--primary-light); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-outline-sm { padding: 4px 12px; font-size: 12px; background: #fff; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: inherit; }
.btn-outline-sm:hover { background: var(--gray-bg); }

/* ===== TWO-COLUMN LAYOUT ===== */
.two-col-row { display: flex; gap: 20px; align-items: flex-start; }
.two-col-row .col-left { flex: 0 0 360px; min-width: 0; }
.two-col-row .col-right { flex: 1; min-width: 0; }
@media (max-width: 1400px) { .two-col-row { flex-direction: column; } .two-col-row .col-left { flex: none; width: 100%; } }

/* ===== BATCH CARDS ===== */
.batch-list { display: flex; flex-direction: column; gap: 10px; }
.batch-card { background: #fff; border-radius: var(--radius-lg); padding: 16px 18px; border: 1.5px solid var(--border); cursor: pointer; transition: var(--transition); }
.batch-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
.batch-card.selected { border-color: var(--primary); background: var(--primary-light); }
.batch-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.batch-card-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; cursor: pointer; }
.batch-card-name:hover { color: var(--primary); }
.batch-card-status { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: 500; flex-shrink: 0; }
.batch-card-status.open { background: #EFF6FF; color: var(--primary); }
.batch-card-status.closed { background: #F1F5F9; color: #64748B; }
.batch-card-meta { font-size: 11px; color: var(--text-light); margin-bottom: 10px; display: flex; gap: 16px; flex-wrap: wrap; }
.batch-card-progress { margin-bottom: 6px; }
.batch-card-progress-text { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.batch-card-progress .progress-bar { height: 6px; background: #E2E8F0; border-radius: 3px; overflow: hidden; display: flex; }
.batch-card-progress .progress-fill { height: 100%; border-radius: 3px; transition: width var(--transition); }
.progress-fill.completed { background: var(--success); }
.progress-fill.reviewing { background: var(--accent); }
.progress-fill.warning { background: var(--warning); }
.col-left-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.col-left-header .section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); }

/* ===== RIGHT COLUMN ===== */
.col-right-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.col-right-header .section-title { font-size: 14px; font-weight: 600; color: var(--text); }

/* Status filter buttons */
.status-filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.status-fbtn { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition); border: 1px solid var(--border); background: #fff; color: var(--text-secondary); font-family: inherit; }
.status-fbtn:hover { border-color: var(--accent); color: var(--primary); }
.status-fbtn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Search bar */
.filter-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.filter-bar input { padding: 6px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; outline: none; width: 180px; }
.filter-bar input:focus { border-color: var(--accent); }

/* Table */
.table-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.list-table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
.list-table th { padding: 8px 10px; text-align: center; font-weight: 600; font-size: 11px; color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2; }
.list-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: center; font-size: 12px; }
.list-table tr:last-child td { border-bottom: none; }
.list-table tr:hover td { background: #FAFBFC; }
.list-table .col-cb { width: 36px; }
.list-table .col-seq { width: 44px; }

/* Sticky columns - left */
.list-table .sticky-left { position: sticky; left: 0; z-index: 1; background: #fff; }
.list-table thead .sticky-left { z-index: 3; background: #F8FAFC; }
.list-table .sticky-left-2 { position: sticky; left: 36px; z-index: 1; background: #fff; }
.list-table thead .sticky-left-2 { z-index: 3; background: #F8FAFC; }

/* Sticky columns - right */
.list-table .sticky-right { position: sticky; right: 0; z-index: 1; background: #fff; }
.list-table thead .sticky-right { z-index: 3; background: #F8FAFC; }
.list-table .sticky-right-2 { position: sticky; right: 84px; z-index: 1; background: #fff; }
.list-table thead .sticky-right-2 { z-index: 3; background: #F8FAFC; }

/* Grouped header */


/* Compact cell widths */
.cell-name { min-width: 64px; }
.cell-gender { min-width: 36px; }
.cell-ethnicity { min-width: 48px; }
.cell-birth { min-width: 80px; }
.cell-work-start { min-width: 84px; }
.cell-edu { min-width: 60px; }
.cell-grad-time { min-width: 78px; }
.cell-current-post { min-width: 130px; }
.cell-appoint-time { min-width: 84px; }
.cell-target-post { min-width: 148px; }
.cell-remark { min-width: 90px; max-width: 130px; white-space: normal; word-break: break-all; }
.cell-status { min-width: 72px; }
.cell-action { min-width: 80px; }

/* Status badges */
.status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.status-badge.pending { background: #FEF3C7; color: #92400E; }
.status-badge.approved { background: #D1FAE5; color: #065F46; }
.status-badge.rejected { background: #FEE2E2; color: #991B1B; }
.status-badge.review { background: #DBEAFE; color: #1E40AF; }
.status-badge.completed { background: #E0E7FF; color: #3730A3; }

/* Action links */
.action-links { display: flex; gap: 8px; justify-content: center; }
.action-link { font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: none; white-space: nowrap; }
.action-link:hover { text-decoration: underline; }
.action-link.warn { color: var(--warning); }

/* Batch bar */
.batch-bar { position: sticky; bottom: 0; background: #F8FAFC; border-top: 2px solid var(--primary); padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 -2px 8px rgba(0,0,0,0.06); z-index: 10; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.batch-bar .batch-count { font-size: 13px; color: var(--text-secondary); }
.batch-bar .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.batch-bar .btn-primary:disabled:hover { box-shadow: none; transform: none; }

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state .empty-text { font-size: 14px; margin-bottom: 16px; }

/* Detail table (batch detail modal) */
.detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.detail-table td { padding: 8px 12px; border-bottom: 1px solid var(--gray-bg); vertical-align: top; }
.detail-table .dt-label { color: var(--text-secondary); width: 100px; font-size: 12px; white-space: nowrap; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 520px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
.modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { cursor: pointer; color: var(--text-light); font-size: 20px; padding: 4px; border: none; background: none; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-body .selected-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; margin: 12px 0; }
.modal-body .selected-item { padding: 6px 0; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--gray-bg); }
.modal-body .selected-item:last-child { border-bottom: none; }
.modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.modal-footer .btn-cancel { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); padding: 8px 18px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; }
.modal-footer .btn-cancel:hover { border-color: var(--text-light); }
.modal-wide { width: 960px; max-width: 95vw; }

/* Submit person table */
.submit-person-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 16px; }
.submit-person-table th { padding: 6px 8px; background: #F8FAFC; font-weight: 600; font-size: 11px; text-align: center; border: 1px solid var(--border); }
.submit-person-table td { padding: 6px 8px; text-align: center; border: 1px solid var(--border); font-size: 12px; }
.type-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.type-tag.promote { background: #DBEAFE; color: #1E40AF; }
.type-tag.transfer { background: #FEF3C7; color: #D97706; }

/* Summary table in modal */
.modal-summary-section { margin-top: 16px; }
.modal-summary-section .section-subtitle { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
.modal-summary-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 12px; }
.modal-summary-table th { padding: 5px 6px; border: 1px solid var(--border); text-align: center; font-weight: 600; font-size: 10px; background: #F8FAFC; }
.modal-summary-table td { padding: 4px 6px; border: 1px solid var(--border); text-align: center; font-size: 11px; }
.modal-summary-table .cat-title { background: #F8FAFC; font-weight: 600; font-size: 11px; text-align: center; vertical-align: middle; width: 56px; }
.modal-summary-table .row-label { background: #F8FAFC; font-weight: 500; color: var(--text-secondary); font-size: 10px; text-align: left; padding-left: 8px; }
.modal-summary-table .note-col { min-width: 60px; font-size: 10px; }
.modal-summary-table .data-zero { color: var(--text-light); }
.modal-summary-table .change-up { color: #16A34A; font-weight: 700; }
.modal-summary-table .change-down { color: #DC2626; font-weight: 700; }
.modal-summary-table .after-row td { background: #FFFBEB; }
.modal-summary-table .cv { color: var(--text-secondary); }
.modal-summary-table .ar { font-weight: 600; margin: 0 1px; }
.modal-summary-table .dt { font-size: 10px; white-space: nowrap; }
.modal-summary-table .dt.cell-up { color: #16A34A; }
.modal-summary-table .dt.cell-down { color: #DC2626; }
.modal-summary-table .cell-over { background: #FEF2F2; color: #991B1B; font-weight: 700; }
.modal-summary-table td.cell-changed { position: relative; }
.modal-summary-table td.cell-changed::after {
  content: ''; position: absolute; bottom: 0; left: 3px; right: 3px; height: 3px;
  border-radius: 0 0 2px 2px;
}
.modal-summary-table td.cell-up::after   { background: #16A34A; }
.modal-summary-table td.cell-down::after { background: #DC2626; }

/* Note items */
.note-item { font-size: 11px; line-height: 1.6; padding: 2px 6px; text-align: left; white-space: nowrap; }

/* Over-quota warning */
.over-quota-warning { margin-top: 12px; padding: 12px 16px; background: #FEF2F2; border-left: 3px solid var(--danger); border-radius: 6px; font-size: 12px; }
.over-quota-warning .warn-title { font-weight: 600; color: var(--danger); margin-bottom: 6px; }
.over-quota-warning .warn-item { color: #991B1B; padding: 2px 0; font-size: 11px; }

/* Public notice upload */
.public-upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px; text-align: center; cursor: pointer; transition: var(--transition); }
.public-upload-area:hover { border-color: var(--accent); background: var(--primary-light); }
.public-upload-area .upload-icon { font-size: 24px; margin-bottom: 4px; color: var(--text-light); }
.public-upload-area .upload-text { font-size: 12px; color: var(--text-secondary); }
.public-file-list { margin-top: 8px; }
.public-file-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: var(--gray-bg); border-radius: 4px; margin-bottom: 4px; font-size: 11px; }
.public-file-item .file-remove { color: var(--danger); cursor: pointer; font-size: 11px; }
.public-file-item .file-remove:hover { text-decoration: underline; }
/* Summary remark textarea */
.summary-remark-ta { width: 100%; min-height: 60px; font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; resize: vertical; font-family: inherit; line-height: 1.5; }
.summary-remark-ta:focus { outline: none; border-color: var(--accent); }

/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease; box-shadow: var(--shadow-lg); }
.toast.warning { background: var(--warning); color: #1E293B; }
.toast.success { background: var(--success); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ===== BATCH FORM ===== */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
.form-group input[type="text"], .form-group input[type="date"], .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; outline: none; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 60px; }
.checkbox-group { display: flex; gap: 16px; flex-wrap: wrap; }
.checkbox-group .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.checkbox-group .checkbox-item input[type="checkbox"] { cursor: pointer; }
.form-group .required-star { color: var(--danger); margin-left: 2px; }

/* Batch card actions */
.batch-card-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--gray-bg); }
.batch-card-action-btn { padding: 3px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; font-family: inherit; border: 1px solid var(--border); background: #fff; color: var(--text-secondary); transition: var(--transition); }
.batch-card-action-btn:hover { border-color: var(--accent); color: var(--primary); background: var(--primary-light); }
.batch-card-action-btn.danger:hover { border-color: var(--danger); color: var(--danger); background: #FEF2F2; }

/* Year filter */
.year-filter-select { padding: 5px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; color: var(--text-secondary); cursor: pointer; outline: none; }
.year-filter-select:focus { border-color: var(--accent); }

function getEmployedVal(schoolName, category, grade, subType) {
  var school = POST_EMPLOYED_DATA[schoolName];
  if (!school) return 0;
  var cat = school[category];
  if (!cat) return 0;
  var gd = cat[grade];
  if (!gd) return 0;
  if (subType === 'total') return (gd.career || 0) + (gd.control || 0) + (gd.over || 0);
  return gd[subType] || 0;
}

// ===== DATA LAYER =====
function loadBatches() {
  var s = localStorage.getItem('promote_batches');
  if (s) {
    try {
      var data = JSON.parse(s);
      DEMO_BATCHES.forEach(function(db) {
        var existing = data.filter(function(b) { return b.id === db.id; });
        if (existing.length > 0) {
          existing.forEach(function(eb) { eb.status = db.status; });
        } else {
          data.push(JSON.parse(JSON.stringify(db)));
        }
      });
      return data;
    } catch(e) {}
  }
  localStorage.setItem('promote_batches', JSON.stringify(DEMO_BATCHES));
  return JSON.parse(JSON.stringify(DEMO_BATCHES));
}
function saveBatches(batches) { localStorage.setItem('promote_batches', JSON.stringify(batches)); }

function loadRecords() {
  var s = localStorage.getItem('promote_records');
  if (s) { try { return JSON.parse(s); } catch(e) {} }
  localStorage.setItem('promote_records', JSON.stringify(DEMO_RECORDS));
  return JSON.parse(JSON.stringify(DEMO_RECORDS));
}
function saveRecords(r) { localStorage.setItem('promote_records', JSON.stringify(r)); }

function resetDemoData() {
  localStorage.removeItem('promote_records');
  localStorage.removeItem('promote_batches');
  location.reload();
}

function getSchoolBatches() {
  return loadBatches().filter(function(b) {
    return b.schoolName === CURRENT_SCHOOL;
  });
}

function getSchoolRecords() {
  var records = loadRecords();
  return records.filter(function(r) { return r.schoolName === CURRENT_SCHOOL; });
}

function getBatchStats(batchId) {
  var records = getSchoolRecords().filter(function(r) { return r.batchId === batchId; });
  return {
    total: records.length,
    pending: records.filter(function(r) { return r.status === 'pending_first' || r.status === 'pending_second' || r.status === 'pending_third'; }).length,
    approved: records.filter(function(r) { return r.status === 'first_approved' || r.status === 'second_approved' || r.status === 'completed'; }).length,
    rejected: records.filter(function(r) { return r.status === 'first_rejected' || r.status === 'second_rejected' || r.status === 'hr_rejected'; }).length
  };
}

function getFilteredRecords() {
  var records = getSchoolRecords();
  if (selectedBatchId) {
    records = records.filter(function(r) { return r.batchId === selectedBatchId; });
  }
  if (currentStatusFilter === 'pending') records = records.filter(function(r) { return r.status === 'pending_first' || r.status === 'pending_second' || r.status === 'pending_third'; });
  else if (currentStatusFilter === 'approved') records = records.filter(function(r) { return r.status === 'first_approved' || r.status === 'second_approved' || r.status === 'completed'; });
  else if (currentStatusFilter === 'rejected') records = records.filter(function(r) { return r.status === 'first_rejected' || r.status === 'second_rejected' ; });
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    records = records.filter(function(r) { return (r.teacherName||'').toLowerCase().indexOf(q) >= 0 || (r.currentPost||'').toLowerCase().indexOf(q) >= 0; });
  }
  return records;
}

function getStatusBadgeClass(status) {
  if (status === 'pending_first' || status === 'pending_second' || status === 'pending_third') return 'review';
  if (status === 'first_approved') return 'pending';
  if (status === 'second_approved') return 'approved';
  if (status === 'first_rejected' || status === 'second_rejected' ) return 'rejected';
  if (status === 'completed') return 'completed';
  return 'pending';
}

// ===== RENDER BATCH CARDS =====
function renderBatchCards() {
  var batches = getSchoolBatches();
  if (currentYearFilter !== 'all') {
    batches = batches.filter(function(b) { return b.year === currentYearFilter; });
  }
  if (batches.length === 0) {
    return '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无可用的晋升批次</div></div>';
  }
  var h = '<div class="batch-list">';
  batches.forEach(function(b) {
    var stats = getBatchStats(b.id);
    var isSelected = b.id === selectedBatchId;
    var pendingPct = stats.total > 0 ? Math.round(stats.pending / stats.total * 100) : 0;
    var approvedPct = stats.total > 0 ? Math.round(stats.approved / stats.total * 100) : 0;
    var rejectedPct = stats.total > 0 ? Math.round(stats.rejected / stats.total * 100) : 0;

    h += '<div class="batch-card' + (isSelected ? ' selected' : '') + '" onclick="selectBatch(\'' + b.id + '\')">';
    h += '<div class="batch-card-header">';
    h += '<span class="batch-card-name" onclick="event.stopPropagation();showBatchDetail(\'' + b.id + '\')" title="点击查看批次详情">' + b.name + '</span>';
    h += '<span class="batch-card-status ' + b.status + '">' + ({ pending: '未开始', open: '进行中', closed: '已关闭' })[b.status] || b.status + '</span>';
    h += '</div>';
    h += '<div class="batch-card-meta">';
    h += '<span>📅 ' + b.startTime + ' ~ ' + b.endTime + '</span>';
    h += '</div>';
    h += '<div class="batch-card-progress">';
    h += '<div class="batch-card-progress-text">待审核 ' + stats.pending + ' | 已通过 ' + stats.approved + ' | 已驳回 ' + stats.rejected + '</div>';
    h += '<div class="progress-bar">';
    if (approvedPct > 0) h += '<div class="progress-fill completed" style="width:' + approvedPct + '%"></div>';
    if (pendingPct > 0) h += '<div class="progress-fill reviewing" style="width:' + pendingPct + '%"></div>';
    if (rejectedPct > 0) h += '<div class="progress-fill warning" style="width:' + rejectedPct + '%"></div>';
    h += '</div></div>';
        if (b.status === 'pending') {
      h += '<div class="batch-card-actions">';
      h += '<button class="batch-card-action-btn" onclick="event.stopPropagation();showEditModal(\'' + b.id + '\')">编辑</button>';
      h += '<button class="batch-card-action-btn danger" onclick="event.stopPropagation();deleteBatch(\'' + b.id + '\')">删除</button>';
      h += '</div>';
    } else if (b.status === 'open') {
      h += '<div class="batch-card-actions">';
      h += '<button class="batch-card-action-btn" onclick="event.stopPropagation();showEditModal(\'' + b.id + '\')">编辑</button>';
      h += '<button class="batch-card-action-btn danger" onclick="event.stopPropagation();closeBatch(\'' + b.id + '\')">关闭</button>';
      h += '</div>';
    } else if (b.status === 'closed') {
      h += '<div class="batch-card-actions">';
      h += '<button class="batch-card-action-btn" onclick="event.stopPropagation();showEditModal(\'' + b.id + '\')">编辑</button>';
      h += '</div>';
    }    h += '</div>';
  });
  h += '</div>';
  return h;
}

    }

}

function getActionLinks(record) {

function getAvailableSchools() {
  var records = loadRecords();
  var schools = [];
  var seen = {};
  records.forEach(function(r) {
    var name = r.schoolName || '';
    if (name && !seen[name]) { seen[name] = true; schools.push(name); }
  });
  return schools;
}

function initSchoolSelect() {
  var sel = document.getElementById('schoolSelect');
  if (!sel) return;
  var schools = getAvailableSchools();
  sel.innerHTML = '';
  schools.forEach(function(s) {
    var opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    if (s === CURRENT_SCHOOL) opt.selected = true;
    sel.appendChild(opt);
  });
  if (schools.length === 0) {
    var opt = document.createElement('option');
    opt.value = CURRENT_SCHOOL; opt.textContent = CURRENT_SCHOOL; opt.selected = true;
    sel.appendChild(opt);
  }
}

function getCategoryLabelFromRaw(catStr) {
  if (!catStr) return '专业技术岗位';
  if (catStr === 'mgmt' || catStr.indexOf('管理') >= 0) return '管理岗位';
  if (catStr === 'labor' || catStr.indexOf('工勤') >= 0) return '工勤技能岗位';
  return '专业技术岗位';
}

function computeSubmitChanges(schoolName, selected) {
  var deltas = { mgmt: {}, prof: {}, labor: {} };
  var notes = { mgmt: {}, prof: {}, labor: {} };
  var allGrades = { mgmt: MGMT_GRADES_SUMMARY, prof: PROF_SUMMARY, labor: LABOR_SUMMARY };
  ['mgmt', 'prof', 'labor'].forEach(function(cat) {
    allGrades[cat].forEach(function(g) {
      deltas[cat][g] = { total: 0, career: 0, control: 0, over: 0 };
      notes[cat][g] = [];
    });
  });
  selected.forEach(function(r) {
    var src = parseCategoryFromPost(r.currentPost);
    var srcGrade = levelToKey(r.fromLevel);
    var tgtCat = src.category;
    if (r.transferType === 'transfer' && r._targetCategory) {
      if (r._targetCategory === 'mgmt' || r._targetCategory.indexOf('管理') >= 0) tgtCat = 'mgmt';
      else if (r._targetCategory === 'labor' || r._targetCategory.indexOf('工勤') >= 0) tgtCat = 'labor';
      else tgtCat = 'prof';
    }
    var tgtGrade = levelToKey(r.targetLevel);
    var promoType = r.transferType === 'transfer' ? '转岗' : '晋升';
    var staffType = r._staffType || 'career';
    var srcCatLabel = getCategoryLabel(src.category);
    var tgtCatLabel = getCategoryLabel(tgtCat);
    if (srcGrade && deltas[src.category] && deltas[src.category][srcGrade]) {
      deltas[src.category][srcGrade].total -= 1;
      deltas[src.category][srcGrade][staffType] -= 1;
      notes[src.category][srcGrade].push({ name: r.teacherName, type: 'down', promoType: promoType, detail: '→ ' + tgtCatLabel + (r.targetLevel || '') });
    }
    if (tgtGrade && deltas[tgtCat] && deltas[tgtCat][tgtGrade]) {
      deltas[tgtCat][tgtGrade].total += 1;
      deltas[tgtCat][tgtGrade][staffType] += 1;
      notes[tgtCat][tgtGrade].push({ name: r.teacherName, type: 'up', promoType: promoType, detail: '← ' + srcCatLabel + (r.fromLevel || '') });
    }
  });
  return { deltas: deltas, notes: notes };
}

function getQuotaForSchool(schoolName) {
  var postRecords = [];
  try { postRecords = JSON.parse(localStorage.getItem('post_records') || 'null') || []; } catch(e) {}
  var quota = null;
  postRecords.forEach(function(r) {
    if (r.schoolName === schoolName && (r.status === 'completed' || r.status === 'second_review' || r.status === 'first_approved')) {
      quota = r;
    }
  });
  return quota;
}

function renderSubmitSummary(schoolName, selected) {
  var employed = POST_EMPLOYED_DATA[schoolName];
  if (!employed) {
    return '<div class="modal-summary-section"><div class="section-subtitle">岗位聘用汇总表 — ' + escapeHtml(schoolName) + '</div><div style="text-align:center;color:var(--text-light);padding:16px;font-size:12px;">暂无该学校的聘用数据</div></div>';
  }
  var changes = computeSubmitChanges(schoolName, selected);
  var deltas = changes.deltas;
  var noteData = changes.notes;
  var quota = getQuotaForSchool(schoolName);
  var sections = [
    { cat: 'mgmt', title: '管理岗位', grades: MGMT_GRADES_SUMMARY, labels: MGMT_GRADE_LABELS_FULL, hasHighland: false },
    { cat: 'prof', title: '专业技术岗位', grades: PROF_SUMMARY, labels: PROF_LABELS_FLAT, hasHighland: true },
    { cat: 'labor', title: '工勤技能岗位', grades: LABOR_SUMMARY, labels: LABOR_GRADE_LABELS, hasHighland: false }
  ];

  function getQuotaVal(cat, g) {
    if (!quota) return 0;
    if (cat === 'mgmt') return (quota.mgmtLevels && quota.mgmtLevels[g]) || 0;
    if (cat === 'labor') return (quota.laborLevels && quota.laborLevels[g]) || 0;
    if (cat === 'prof' && quota.profLevels) {
      var v = 0;
      ['senior','vice','middle','junior'].forEach(function(layer) {
        if (quota.profLevels[layer] && quota.profLevels[layer].levels && quota.profLevels[layer].levels[g]) {
          v = quota.profLevels[layer].levels[g];
        }
      });
      return v;
    }
    return 0;
  }

  function cellWithDelta(cat, g, subKey) {
    var current = getEmployedVal(schoolName, cat, g, subKey);
    var d = deltas[cat] && deltas[cat][g] ? (deltas[cat][g][subKey] || 0) : 0;
    var after = current + d;
    if (d === 0) {
      var zc = current === 0 ? ' data-zero' : '';
      return '<td class="' + zc + '">' + current + '</td>';
    }
    var dc = d > 0 ? ' cell-up' : ' cell-down';
    return '<td class="cell-changed' + dc + '"><span class="cv">' + current + '</span><span class="ar">→' + after + '</span><span class="dt' + dc + '">' + (d > 0 ? '+' : '') + d + '</span></td>';
  }

  function cellOverQuota(cat, g) {
    var currentTotal = getEmployedVal(schoolName, cat, g, 'total');
    var dTotal = deltas[cat] && deltas[cat][g] ? (deltas[cat][g].total || 0) : 0;
    var afterTotal = currentTotal + dTotal;
    var quotaVal = getQuotaVal(cat, g);
    var excess = (quotaVal > 0 && afterTotal > quotaVal) ? (afterTotal - quotaVal) : 0;
    if (excess > 0) {
      return '<td class="cell-over">' + excess + '</td>';
    }
    return '<td style="color:var(--text-light);">0</td>';
  }

  function cellHighland(cat, g) {
    var val = getEmployedVal(schoolName, cat, g, 'over');
    if (val > 0) {
      return '<td>' + val + '</td>';
    }
    return '<td style="color:var(--text-light);">0</td>';
  }

  function renderNoteCell(cat, selected) {
    var catLabel = getCategoryLabel(cat);
    var pathCounts = {};
    selected.forEach(function(r) {
      var src = parseCategoryFromPost(r.currentPost);
      if (src.category !== cat) return;
      var promoType = r.transferType === 'transfer' ? '转岗' : '晋升';
      var srcFull = getCategoryLabel(src.category) + (r.fromLevel || '');
      var tgtCatLabel = getCategoryLabel(src.category);
      if (r.transferType === 'transfer' && r._targetCategory) {
        tgtCatLabel = getCategoryLabelFromRaw(r._targetCategory);
      }
      var tgtFull = tgtCatLabel + (r.targetLevel || '');
      var path = srcFull + ' ' + promoType + ' → ' + tgtFull;
      pathCounts[path] = (pathCounts[path] || 0) + 1;
    });
    var lines = [];
    for (var path in pathCounts) {
      lines.push(path + '：' + pathCounts[path] + '人');
    }
    if (lines.length === 0) return '<div style="color:var(--text-light);font-size:10px;text-align:center;">—</div>';
    var h = '';
    lines.forEach(function(line) {
      h += '<div class="note-item">' + escapeHtml(line) + '</div>';
    });
    return h;
  }

  var h = '<div class="modal-summary-section">';
  h += '<div class="section-subtitle">岗位聘用汇总表 — ' + escapeHtml(schoolName) + '</div>';

  // Top summary row
  var careerTotal = 0, controlTotal = 0;
  ['mgmt','prof','labor'].forEach(function(c) {
    var gs = c === 'mgmt' ? MGMT_GRADES_SUMMARY : (c === 'labor' ? LABOR_SUMMARY : PROF_SUMMARY);
    gs.forEach(function(g) { careerTotal += getEmployedVal(schoolName, c, g, 'career'); controlTotal += getEmployedVal(schoolName, c, g, 'control'); });
  });
  var realTotal = careerTotal + controlTotal;
  h += '<table class="summary-top-table" style="width:100%;margin-bottom:12px;"><tr>';
  h += '<th>定编人数</th><td>实名编<b>' + (quota ? (quota.careerStaffQuota || 0) : '—') + '</b>+控制数<b>' + (quota ? (quota.authControlNo || 0) : '—') + '</b>（合计<b>' + (quota ? (quota.totalControlQuota || 0) : '—') + '</b>）</td>';
  h += '<th>实有人数</th><td>实名编<b>' + careerTotal + '</b>+控制数<b>' + controlTotal + '</b>（合计<b>' + realTotal + '</b>）</td>';
  h += '<th>小高地岗位</th><td><b>' + (quota ? (quota.highlandPosts || 0) : '—') + '</b></td>';
  h += '</tr></table>';

  function shortGrade(label) { return (label || '').replace('级', ''); }

  sections.forEach(function(sec) {
    var grades = sec.grades;
    var subRows = [
      { sub: '合计', key: 'total' },
      { sub: '实名编', key: 'career' },
      { sub: '控制数', key: 'control' },
      { sub: '超岗聘用数', key: 'over' }
    ];
    if (sec.cat === 'prof') {
      subRows.push({ sub: '小高地岗位', key: 'highland' });
    }
    var nRows = 2 + subRows.length;
    h += '<table class="modal-summary-table"><tbody>';
    // Header row
    h += '<tr><td class="cat-title" rowspan="' + nRows + '">' + sec.title + '</td>';
    h += '<th>等级</th><th></th>';
    grades.forEach(function(g) { h += '<th>' + shortGrade(sec.labels[g] || g) + '</th>'; });
    h += '<th class="note-col">备注（可编辑）</th></tr>';
    // 核准岗位数 row
    h += '<tr><td class="row-label">核准岗位数</td><td></td>';
    grades.forEach(function(g) {
      var qv = getQuotaVal(sec.cat, g);
      h += '<td' + (qv === 0 ? ' class="data-zero"' : '') + '>' + (qv != null ? qv : '—') + '</td>';
    });
    h += '<td></td></tr>';
    // 实聘数 sub-rows
    var noteHtml = renderNoteCell(sec.cat, selected);
    var noteText = noteHtml.replace(/<[^>]*>/g, '\n').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\n+/g, '\n').trim();
    subRows.forEach(function(sr, idx) {
      h += '<tr>';
      if (idx === 0) {
        h += '<td class="row-label" rowspan="' + subRows.length + '">实聘数</td>';
      }
      h += '<td class="row-label" style="font-weight:400;color:var(--text-light);">' + sr.sub + '</td>';
      grades.forEach(function(g) {
        if (sr.key === 'over') {
          h += cellOverQuota(sec.cat, g);
        } else if (sr.key === 'highland') {
          h += cellHighland(sec.cat, g);
        } else {
          h += cellWithDelta(sec.cat, g, sr.key);
        }
      });
      if (idx === 0) {
        h += '<td class="note-col" rowspan="' + subRows.length + '"><textarea class="summary-remark-ta" id="remark_' + sec.cat + '" placeholder="可补充备注">' + escapeHtml(noteText) + '</textarea></td>';
      }
      h += '</tr>';
    });
    h += '</tbody></table>';
  });
  h += '</div>';
  return h;
}

function renderSubmitWarning(schoolName, selected) {
  var quota = getQuotaForSchool(schoolName);
  if (!quota) return '';
  var changes = computeSubmitChanges(schoolName, selected);
  var deltas = changes.deltas;
  var warnings = [];
  var checkCat = function(cat, grades, getQuotaVal) {
    grades.forEach(function(g) {
      var current = getEmployedVal(schoolName, cat, g, 'total');
      var delta = deltas[cat] && deltas[cat][g] ? (deltas[cat][g].total || 0) : 0;
      var after = current + delta;
      var quotaVal = getQuotaVal(g);
      if (quotaVal > 0 && after > quotaVal) {
        var label = getCategoryLabel(cat);
        var gradeLabel = KEY_TO_CN_LEVEL[g] || g;
        warnings.push(label + gradeLabel + '：核准 ' + quotaVal + ' 人，提交后实聘 ' + after + ' 人，超岗 ' + (after - quotaVal) + ' 人');
      }
    });
  };
  checkCat('mgmt', MGMT_GRADES_SUMMARY, function(g) { return (quota.mgmtLevels && quota.mgmtLevels[g]) || 0; });
  checkCat('prof', PROF_SUMMARY, function(g) {
    var v = 0;
    if (!quota.profLevels) return 0;
    ['senior','vice','middle','junior'].forEach(function(layer) {
      if (quota.profLevels[layer] && quota.profLevels[layer].levels && quota.profLevels[layer].levels[g]) {
        v = quota.profLevels[layer].levels[g];
      }
    });
    return v;
  });
  checkCat('labor', LABOR_SUMMARY, function(g) { return (quota.laborLevels && quota.laborLevels[g]) || 0; });
  if (warnings.length === 0) return '';
  var h = '<div class="over-quota-warning"><div class="warn-title">⚠ 超岗警告</div>';
  warnings.forEach(function(w) { h += '<div class="warn-item">· ' + w + '</div>'; });
  h += '</div>';
  return h;
}

  for (var i = 0; i < input.files.length; i++) {
    var f = input.files[i];
    var ext = f.name.split('.').pop().toLowerCase();
    if (allowed.indexOf(ext) === -1) { showToast('不支持的文件格式：' + f.name, 'warning'); continue; }
    if (f.size > 10 * 1024 * 1024) { showToast('文件超过10MB：' + f.name, 'warning'); continue; }
    publicFiles.push({ name: f.name, size: f.size });
  }
  input.value = '';
  refreshPublicFileList();
}

function refreshPublicFileList() {
  var el = document.getElementById('publicFileList');
  if (!el) return;
  var h = '';
  publicFiles.forEach(function(f, i) {
    h += '<div class="public-file-item"><span>' + escapeHtml(f.name) + '（' + formatFileSize(f.size) + '）</span><span class="file-remove" onclick="publicFiles.splice(' + i + ',1);refreshPublicFileList();">移除</span></div>';
  });
  el.innerHTML = h;
}

function formatFileSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
  return (bytes / 1048576).toFixed(1) + 'MB';
}

function doBatchSubmit() {
  // Validate public notice fields
  var publicMethod = document.getElementById('publicMethod').value;
  var publicStartTime = document.getElementById('publicStartTime').value;
  var publicEndTime = document.getElementById('publicEndTime').value;

  if (!publicMethod) { showToast('请选择公示方式', 'warning'); return; }
  if (!publicStartTime) { showToast('请选择公示开始时间', 'warning'); return; }
  if (!publicEndTime) { showToast('请选择公示截止时间', 'warning'); return; }
  if (publicStartTime >= publicEndTime) { showToast('公示截止时间必须晚于开始时间', 'warning'); return; }
  if (publicFiles.length === 0) { showToast('请上传公示证明材料', 'warning'); return; }

  // Collect remarks from editable textareas
  var remarks = {};
  ['mgmt', 'prof', 'labor'].forEach(function(cat) {
    var el = document.getElementById('remark_' + cat);
    remarks[cat] = el ? el.value.trim() : '';
  });

  var cbs = document.querySelectorAll('.record-cb:checked');
  var ids = [];
  cbs.forEach(function(cb) { ids.push(cb.value); });
  var records = loadRecords();
  var now = new Date().toISOString().replace('T',' ').substring(0,19);
  records.forEach(function(r) {
    if (ids.indexOf(r.id) >= 0 && r.status === 'first_approved') {
      r.status = 'pending_second';
      r.publicMethod = publicMethod;
      r.publicStartTime = publicStartTime;
      r.publicEndTime = publicEndTime;
      r.publicAttachments = JSON.parse(JSON.stringify(publicFiles));
      r.schoolRemarks = JSON.parse(JSON.stringify(remarks));
      if (!r.timeline) r.timeline = [];
      r.timeline.push({ time: now, action: '学校批量提交至主管部门', operator: '王玉兰', detail: '公示方式：' + publicMethod + '，公示期：' + publicStartTime + ' ~ ' + publicEndTime });
    }
  });
  saveRecords(records);
  closeModal();
  showToast('已成功提交 ' + ids.length + ' 条记录', 'success');
  renderMain();
}

// ===== BATCH CRUD =====
function generateBatchId() {
  var now = new Date();
  var y = now.getFullYear();
  var m = ('0' + (now.getMonth() + 1)).slice(-2);
  var d = ('0' + now.getDate()).slice(-2);
  var rand = ('000' + Math.floor(Math.random() * 1000)).slice(-3);
  return 'PB' + y + m + d + rand;
}

function showCreateModal() {
  var h = '<div class="modal-header"><h3>创建晋升批次</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
  h += '<div class="modal-body">';
  h += '<div class="form-group"><label>批次名称<span class="required-star">*</span></label><input type="text" id="batchName" placeholder="请输入批次名称"></div>';
  h += '<div class="form-group"><label>年度<span class="required-star">*</span></label><select id="batchYear"><option value="2024">2024</option><option value="2025">2025</option><option value="2026" selected>2026</option><option value="2027">2027</option></select></div>';
  h += '<div class="form-group"><label>晋升类别<span class="required-star">*</span></label><div class="checkbox-group"><label class="checkbox-item"><input type="checkbox" value="manage" class="batch-category-cb"> 管理岗位</label><label class="checkbox-item"><input type="checkbox" value="professional" class="batch-category-cb" checked> 专业技术岗位</label><label class="checkbox-item"><input type="checkbox" value="skill" class="batch-category-cb"> 工勤技能岗位</label></div></div>';

  h += '<div class="form-group"><label>申报截止时间<span class="required-star">*</span></label><input type="date" id="batchEndTime"></div>';
  h += '<div class="form-group"><label>备注说明</label><textarea id="batchRemark" placeholder="选填"></textarea></div>';
  h += '</div>';
  h += '<div class="modal-footer"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveBatch(null)">确认创建</button></div>';
  openModal(h);
}

function showEditModal(batchId) {
  var batches = loadBatches();
  var b = null;
  for (var i = 0; i < batches.length; i++) { if (batches[i].id === batchId) { b = batches[i]; break; } }
  if (!b) return;
  var cats = b.categories || [b.category] || [];
  var h = '<div class="modal-header"><h3>编辑晋升批次</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
  h += '<div class="modal-body">';
  h += '<div class="form-group"><label>批次名称<span class="required-star">*</span></label><input type="text" id="batchName" value="' + (b.name || '').replace(/"/g, '&quot;') + '"></div>';
  h += '<div class="form-group"><label>年度<span class="required-star">*</span></label><select id="batchYear"><option value="2024"' + (b.year==='2024'?' selected':'') + '>2024</option><option value="2025"' + (b.year==='2025'?' selected':'') + '>2025</option><option value="2026"' + (b.year==='2026'?' selected':'') + '>2026</option><option value="2027"' + (b.year==='2027'?' selected':'') + '>2027</option></select></div>';
  var isPending = b.status === 'pending';
  h += '<div class="form-group"><label>晋升类别<span class="required-star">*</span></label>';
  if (isPending) {
    h += '<div class="checkbox-group"><label class="checkbox-item"><input type="checkbox" value="manage" class="batch-category-cb"' + (cats.indexOf('manage')>=0?' checked':'') + '> 管理岗位</label><label class="checkbox-item"><input type="checkbox" value="professional" class="batch-category-cb"' + (cats.indexOf('professional')>=0?' checked':'') + '> 专业技术岗位</label><label class="checkbox-item"><input type="checkbox" value="skill" class="batch-category-cb"' + (cats.indexOf('skill')>=0?' checked':'') + '> 工勤技能岗位</label></div>';
  } else {
    var catLabels = cats.map(function(c) { return getCategoryLabel(c); });
    h += '<div style="padding:8px 12px;background:#F8FAFC;border:1px solid var(--border);border-radius:6px;font-size:13px;">' + (catLabels.length > 0 ? catLabels.join('、') : '—') + '</div>';
    h += '<div style="font-size:11px;color:var(--text-light);margin-top:4px;">批次已' + (b.status==='open'?'开启':'关闭') + '，晋升类别不可修改</div>';
  }
  h += '</div>';
  h += '<div class="form-group"><label>申报开始时间<span class="required-star">*</span></label><input type="date" id="batchStartTime" value="' + (b.startTime||'') + '"></div>';
  h += '<div class="form-group"><label>申报截止时间<span class="required-star">*</span></label><input type="date" id="batchEndTime" value="' + (b.endTime||'') + '"></div>';
  h += '<div class="form-group"><label>备注说明</label><textarea id="batchRemark">' + (b.remark||'') + '</textarea></div>';
  h += '</div>';
  h += '<div class="modal-footer"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveBatch(\'' + batchId + '\')">保存修改</button></div>';
  openModal(h);
}

function saveBatch(editId) {
  var nameEl = document.getElementById('batchName');
  var yearEl = document.getElementById('batchYear');
  var startEl = document.getElementById('batchStartTime');
  var endEl = document.getElementById('batchEndTime');
  var remarkEl = document.getElementById('batchRemark');

  // Find the batch being edited to check its status
  var batches = loadBatches();
  var editBatch = null;
  if (editId) {
    for (var i = 0; i < batches.length; i++) { if (batches[i].id === editId) { editBatch = batches[i]; break; } }
  }
  var isPending = editBatch && editBatch.status === 'pending';

  if (!nameEl.value.trim()) { showToast('请输入批次名称', 'warning'); return; }
  if (isPending) {
    var cbs = document.querySelectorAll('.batch-category-cb:checked');
    if (cbs.length === 0) { showToast('请至少选择一个晋升类别', 'warning'); return; }
  }
  if (!startEl.value) { showToast('请选择申报开始时间', 'warning'); return; }
  if (!endEl.value) { showToast('请选择申报截止时间', 'warning'); return; }
  if (startEl.value > endEl.value) { showToast('截止时间不能早于开始时间', 'warning'); return; }

  if (editId) {
    // Update existing
    for (var i = 0; i < batches.length; i++) {
      if (batches[i].id === editId) {
        batches[i].name = nameEl.value.trim();
        batches[i].year = yearEl.value;
        if (isPending) {
          var cbs2 = document.querySelectorAll('.batch-category-cb:checked');
          var categories = [];
          cbs2.forEach(function(cb) { categories.push(cb.value); });
          batches[i].category = categories[0];
          batches[i].categories = categories;
        }
        batches[i].startTime = startEl.value;
        batches[i].endTime = endEl.value;
        batches[i].remark = remarkEl ? remarkEl.value.trim() : '';
        break;
      }
    }
    saveBatches(batches);
    closeModal();
    showToast('批次已更新', 'success');
  } else {
    // Create new
    var newBatch = {
      id: generateBatchId(),
      name: nameEl.value.trim(),
      category: categories[0],
      categories: categories,
      year: yearEl.value,
      status: 'open',
      allowedLevels: [],
      startTime: startEl.value,
      endTime: endEl.value,
      scope: 'school',
      scopeAreas: [],
      schoolName: CURRENT_SCHOOL,
      createdBy: 'school',
      remark: remarkEl ? remarkEl.value.trim() : ''
    };
    batches.push(newBatch);
    saveBatches(batches);
    closeModal();
    showToast('批次已创建', 'success');
  }
  renderMain();
}

function closeBatch(id) {
  if (!confirm('确认关闭该批次？关闭后教师将无法继续提交申报。')) return;
  var batches = loadBatches();
  for (var i = 0; i < batches.length; i++) {
    if (batches[i].id === id) {
      batches[i].status = 'closed';
      break;
    }
  }
  saveBatches(batches);
  showToast('批次已关闭', 'success');
  renderCards();
  renderMain();
}

function deleteBatch(id) {
  var batches = loadBatches();
  var idx = batches.findIndex(function(b) { return b.id === id; });
  if (idx === -1 || batches[idx].status !== 'pending') { showToast('只能删除未开始的批次', 'warning'); return; }

  var h = '<div class="modal-header"><h3>确认删除</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
  h += '<div class="modal-body">';
  h += '<p style="font-size:14px;color:var(--text);line-height:1.8;">确定要删除批次「' + escapeHtml(batches[idx].name) + '」吗？<br>删除后不可恢复，该批次下的所有申报记录也将被删除。</p>';
  h += '</div>';
  h += '<div class="modal-footer">';
  h += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
  h += '<button class="btn btn-primary" style="background:var(--danger);border-color:var(--danger);" onclick="doDeleteBatch(\'' + id + '\')">确认删除</button>';
  h += '</div>';

  openModal(h);
}

function doDeleteBatch(id) {
  var batches = loadBatches();
  var idx = batches.findIndex(function(b) { return b.id === id; });
  if (idx === -1 || batches[idx].status !== 'pending') { showToast('只能删除未开始的批次', 'warning'); closeModal(); return; }
  batches.splice(idx, 1);
  saveBatches(batches);
  closeModal();
  renderCards();
  showToast('批次已删除', 'success');
}

  renderSidebar();
