<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机构管理 — 柳州教育人事管理平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #EFF6FF;
  --accent: #3B82F6; --primary-bright: #2563EB;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8;
  --border: #E2E8F0; --bg: #F8FAFC; --white: #FFFFFF; --gray-bg: #F1F5F9;
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
  --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow: 0 4px 24px rgba(0,0,0,0.08); --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 240px;
}
body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
/* Top Nav */
.topnav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.topnav-left { display: flex; align-items: center; gap: 14px; }
.topnav-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.topnav-logo svg { width: 24px; height: 24px; }
.topnav-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.topnav-right { display: flex; align-items: center; gap: 18px; }
.topnav-bell { position: relative; cursor: pointer; color: rgba(255,255,255,0.85); padding: 6px; border-radius: 6px; transition: var(--transition); }
.topnav-bell:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topnav-bell .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topnav-user { display: flex; align-items: center; gap: 8px; cursor: pointer; color: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; transition: var(--transition); font-size: 13px; position: relative; }
.topnav-user:hover { background: rgba(255,255,255,0.1); }
.topnav-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.user-dropdown { display: none; position: absolute; top: 46px; right: 0; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 200; overflow: hidden; }
.user-dropdown.show { display: block; }
.user-dropdown a { display: block; padding: 12px 18px; font-size: 13px; color: var(--text); text-decoration: none; transition: var(--transition); }
.user-dropdown a:hover { background: var(--primary-light); color: var(--primary); }
.user-dropdown .divider { height: 1px; background: var(--border); margin: 4px 0; }
.user-dropdown .logout { color: var(--danger); }
/* Sidebar */
.sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: var(--sidebar-w); background: #1E3A8A; z-index: 90; overflow-y: auto; display: flex; flex-direction: column; transition: width var(--transition); }
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .menu-label, .sidebar.collapsed .menu-group, .sidebar.collapsed .menu-badge, .sidebar.collapsed .role-switcher-label, .sidebar.collapsed .role-switcher-name { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .menu-icon { margin-right: 0; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.menu-group { padding: 14px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
.menu-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.7); transition: var(--transition); position: relative; text-decoration: none; border-left: 3px solid transparent; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; border-left-color: var(--accent); }
.menu-item .menu-icon { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; opacity: 0.7; }
.menu-item.active .menu-icon { opacity: 1; }
.menu-item .menu-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.5); transition: var(--transition); }
.sidebar-toggle:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--transition); }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
.role-switcher { padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.role-switcher-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.role-switcher-options { display: flex; flex-direction: column; gap: 4px; }
.role-switch-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.55); transition: var(--transition); border: 1px solid transparent; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.role-switch-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.role-switch-btn.active { background: rgba(59,130,246,0.2); color: #fff; border-color: rgba(59,130,246,0.4); font-weight: 500; }
.role-switch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.role-switch-dot.system { background: #EF4444; }
.role-switch-dot.city { background: #3B82F6; }
.role-switch-dot.district { background: #F59E0B; }
.role-switch-dot.school { background: #10B981; }
.role-switch-dot.teacher { background: #A78BFA; }
/* Main */
.main { margin-left: var(--sidebar-w); margin-top: 56px; padding: 24px; min-height: calc(100vh - 56px); transition: margin-left var(--transition); }
.sidebar.collapsed ~ .main { margin-left: 64px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.breadcrumb a { color: var(--text-light); text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb span { color: var(--text-secondary); }
.page-header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header .subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }
/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { opacity: 0.9; }
.btn-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
.btn-danger:hover { background: #FEF2F2; }
.btn-outline { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--gray-bg); }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-xs { padding: 3px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; font-family: inherit; transition: var(--transition); border: 1px solid transparent; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.btn-xs-primary { background: var(--primary); color: #fff; }
.btn-xs-primary:hover { background: var(--primary-dark); }
.btn-xs-outline { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-xs-outline:hover { background: var(--gray-bg); }
.btn-xs-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
.btn-xs-danger:hover { background: #FEF2F2; }
/* Filter */
.filter-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-bar select, .filter-bar input { padding: 7px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; }
.filter-bar input { width: 220px; }
.filter-tabs { display: flex; gap: 4px; background: var(--gray-bg); border-radius: 8px; padding: 3px; margin-bottom: 16px; }
.filter-tab { padding: 6px 16px; font-size: 12px; font-weight: 500; border-radius: 6px; cursor: pointer; transition: var(--transition); color: var(--text-secondary); background: transparent; border: none; font-family: inherit; }
.filter-tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); }
.filter-tab .count { font-size: 10px; margin-left: 4px; opacity: 0.7; }
/* Table */
.list-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.list-table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
.list-table th { padding: 10px 12px; text-align: center; font-weight: 600; font-size: 11px; color: var(--text-secondary); background: #F8FAFC; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
.list-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: center; }
.list-table tr:last-child td { border-bottom: none; }
.list-table tr:hover { background: #FAFBFC; }
.list-table .col-id { color: var(--text-secondary); font-size: 11px; font-family: 'SF Mono', 'Consolas', monospace; }
.list-table .col-name { text-align: left; font-weight: 500; }
.list-table .col-action { white-space: nowrap; text-align: center; }
.action-links { display: flex; gap: 6px; justify-content: center; }
.status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.status-badge.active { background: #D1FAE5; color: #065F46; }
.status-badge.inactive { background: #FEE2E2; color: #991B1B; }
.status-badge.pending { background: #FEF3C7; color: #92400E; }
/* Pagination */
.pagination { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 16px 0; }
.pagination button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text-secondary); transition: var(--transition); }
.pagination button:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
.pagination button:disabled { opacity: 0.35; cursor: not-allowed; }
.pagination .page-info { font-size: 12px; color: var(--text-light); margin: 0 8px; }
/* Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 90%; animation: modalIn 0.2s ease; }
@keyframes modalIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 0; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { width: 32px; height: 32px; border-radius: 6px; border: none; background: transparent; font-size: 18px; cursor: pointer; color: var(--text-light); transition: var(--transition); display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(--gray-bg); color: var(--text); }
.modal-body { padding: 16px 24px; max-height: 60vh; overflow-y: auto; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; padding: 0 24px 20px; }
/* Form */
.form-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 24px; margin-bottom: 20px; }
.form-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.form-card h2 .card-icon { width: 28px; height: 28px; background: var(--primary-light); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
fieldset legend { font-size: 12px; font-weight: 600; color: var(--primary); padding: 0 8px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
.form-group label .required { color: var(--danger); margin-left: 2px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; background: #fff; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
.form-group input:read-only, .form-group select:disabled { background: #F8FAFC; color: var(--text-secondary); }
.form-row { display: flex; gap: 16px; }
.form-row .form-group { flex: 1; }
/* Toast */
.toast { position: fixed; top: 20px; right: 20px; z-index: 9999; padding: 12px 20px; border-radius: 8px; font-size: 13px; color: #fff; font-weight: 500; opacity: 0; transform: translateY(-10px); transition: var(--transition); pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--success); }
.toast.warning { background: var(--warning); }
.toast.error { background: var(--danger); }
/* Empty state */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-light); }
.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-state p { font-size: 13px; }
/* Inline tag */
.district-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.district-tag.direct { background: #DBEAFE; color: #1E40AF; }
.district-tag.district { background: #FEF3C7; color: #92400E; }
/* Responsive modal form */
.modal-body .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.form-group.span-full { grid-column: 1 / -1; }
@media (max-width: 640px) {
  .modal-body .form-grid { grid-template-columns: 1fr; }
  .modal { width: 96%; }
}
/* Two-column layout */
.content-layout { display: flex; gap: 0; min-height: calc(100vh - 56px - 200px); }
/* Tree panel */
.tree-panel { width: 220px; flex-shrink: 0; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow-y: auto; padding: 4px 0; align-self: flex-start; position: sticky; top: 80px; max-height: calc(100vh - 56px - 120px); }
.tree-panel-title { padding: 12px 16px 10px; font-size: 12px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.5px; }
.tree-node { padding: 8px 16px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; transition: var(--transition); color: var(--text); }
.tree-node:hover { background: var(--gray-bg); }
.tree-node.active { background: #DBEAFE; color: var(--primary); font-weight: 500; }
.tree-node.root { font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--border); margin-bottom: 4px; padding: 10px 16px 12px; }
.tree-node.root .tree-dot { width: 8px; height: 8px; background: var(--primary); }
.tree-icon { width: 16px; height: 16px; opacity: 0.4; flex-shrink: 0; color: var(--text-secondary); }
.tree-count { font-size: 10px; color: var(--text-light); margin-left: auto; }
.tree-count.zero { opacity: 0.4; }
.tree-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
/* List panel */
.list-panel { flex: 1; min-width: 0; padding-left: 20px; }
@media (max-width: 900px) {
  .content-layout { flex-direction: column; }
  .tree-panel { width: 100%; max-height: none; position: static; margin-bottom: 16px; padding: 4px 0; }
  .list-panel { padding-left: 0; }
}
</style>
</head>
<body>

<!-- Top Nav -->
<nav class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
    </div>
    <span class="topnav-title">柳州教育人事管理平台</span>
  </div>
  <div class="topnav-right">
    <div class="topnav-bell" onclick="showToast('暂无新消息','warning')">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge">3</span>
    </div>
    <div class="topnav-user" onclick="toggleUserMenu()">
      <div class="avatar" id="userAvatar">张</div>
      <span id="userName">张建国</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="user-dropdown" id="userDropdown">
        <a href="personal-center.html">个人中心</a>
        <div class="divider"></div>
        <a class="logout" href="index.html" onclick="localStorage.clear()">退出登录</a>
      </div>
    </div>
  </div>
</nav>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-menu" id="sidebarMenu"></div>
  <div class="sidebar-bottom">
    <div class="sidebar-toggle" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      <span>收起菜单</span>
    </div>
  </div>
  <div class="role-switcher">
    <div class="role-switcher-label">切换演示角色</div>
    <div class="role-switcher-options" id="roleBtns"></div>
  </div>
</aside>

<!-- Main -->
<div class="main" id="mainContent">
  <div class="breadcrumb"><a href="workbench.html">首页</a> &nbsp;/&nbsp; 系统设置 &nbsp;/&nbsp; <span>机构管理</span></div>
  <div class="page-header">
    <div>
      <h1>机构管理</h1>
      <div class="subtitle" id="pageSubtitle">管理柳州市教育系统所有机构信息</div>
    </div>
    <button class="btn btn-primary" id="addBtn" onclick="openAddModal()">+ 新增机构</button>
  </div>

  <!-- Two-column layout: tree + list -->
  <div class="content-layout">
    <!-- Left: Region Tree -->
    <div class="tree-panel" id="treePanel">
      <div class="tree-panel-title">区域目录</div>
    </div>

    <!-- Right: School List -->
    <div class="list-panel">
      <!-- Filter tabs -->
      <div class="filter-tabs" id="filterTabs"></div>

      <!-- Filter bar -->
      <div class="filter-bar" id="filterBar">
        <input type="text" id="searchInput" placeholder="搜索单位名称或编号..." oninput="renderList()">
        <select id="typeFilter" onchange="renderList()"><option value="all">全部类型</option></select>
      </div>

      <!-- List -->
      <div class="list-card">
        <div class="table-scroll">
          <table class="list-table" id="orgTable"></table>
        </div>
        <div class="empty-state" id="emptyState" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          <p id="emptyText">暂无匹配的机构数据</p>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal" style="max-width:700px;">
    <div class="modal-header">
      <h3 id="formModalTitle">新增机构</h3>
      <button class="modal-close" onclick="closeFormModal()">✕</button>
    </div>
    <div class="modal-body">
      <fieldset>
        <legend>基本信息</legend>
        <div class="form-grid">
          <div class="form-group">
            <label>单位名称 <span class="required">*</span></label>
            <input type="text" id="fOrgName" placeholder="单位全称">
          </div>
          <div class="form-group">
            <label>单位简称</label>
            <input type="text" id="fOrgShortName" placeholder="单位简称">
          </div>
          <div class="form-group">
            <label>所属区域 <span class="required">*</span></label>
            <select id="fDistrict"></select>
          </div>
          <div class="form-group">
            <label>单位级别 <span class="required">*</span></label>
            <select id="fOrgLevel">
              <option value="副厅级">副厅级</option><option value="正处级">正处级</option><option value="副处级">副处级</option>

function mergeMissingDemoOrgs() {
  var demos = getDemoOrgs();
  var existingIds = {};
  for (var i = 0; i < orgDirectory.length; i++) {
    existingIds[orgDirectory[i].orgId] = true;
  }
  var added = false;

      demos[j].changeLog = [{
        type: 'create',
        time: (demos[j].createdAt || '2025-01-01') + ' 10:00:00',
        operator: demos[j].districtAdminName || '管理员',
        operatorRole: '市管理员'

var orgDirectory = [];
var currentUser = {};
var editingOrgId = null;
var deletingOrgId = null;

var pageSize = 10;

// Tree state

// ========== INIT ==========

function init() {
  var raw = localStorage.getItem('currentUser');
  if (raw) {
    try { currentUser = JSON.parse(raw); } catch(e) {}
  }
  if (!currentUser || !currentUser.role) {
    currentUser = { role: 'city', name: '张建国', id: 'C001', district: '', schoolName: '' };
  }

  // Load org directory
  var stored = localStorage.getItem('org_directory');
  if (stored) {
    try { orgDirectory = JSON.parse(stored); } catch(e) { orgDirectory = getDemoOrgs(); }
    if (!orgDirectory.length) orgDirectory = getDemoOrgs();
  } else {
    orgDirectory = getDemoOrgs();
    localStorage.setItem('org_directory', JSON.stringify(orgDirectory));
  }

  var needsSave = false;

  // Migrate: fix legacy schoolAdminId format (phone number → admin account ID)
  var ID_MIGRATIONS = { '13807720003': 'S001' };
  for (var mi = 0; mi < orgDirectory.length; mi++) {
    var newId = ID_MIGRATIONS[orgDirectory[mi].schoolAdminId];
    if (newId) { orgDirectory[mi].schoolAdminId = newId; needsSave = true; }
  }

  // Backfill change logs for orgs without one
  for (var ci = 0; ci < orgDirectory.length; ci++) {
    if (!orgDirectory[ci].changeLog || !orgDirectory[ci].changeLog.length) {
      orgDirectory[ci].changeLog = [{
        type: 'create',
        time: (orgDirectory[ci].createdAt || '2025-01-01') + ' 10:00:00',
        operator: orgDirectory[ci].districtAdminName || orgDirectory[ci].schoolAdminName || '管理员',
        operatorRole: '市管理员'
      }];
      needsSave = true;
    }
  }
  // Backfill reviewStatus for orgs without one
  for (var ci = 0; ci < orgDirectory.length; ci++) {
    if (orgDirectory[ci].reviewStatus === undefined) {
      orgDirectory[ci].reviewStatus = null;
      needsSave = true;
    }
  }
  if (needsSave) { localStorage.setItem('org_directory', JSON.stringify(orgDirectory)); }

  // Merge missing demo orgs (e.g.教育局, 二层机构 added later)
  if (mergeMissingDemoOrgs()) {
    localStorage.setItem('org_directory', JSON.stringify(orgDirectory));
  }

  // Backfill role_permissions to ensure all expected menus are present
  var FULL_MENU_IDS = ['workbench','ledger','staffing','entry','exit','postset','promote','recruit','employ','contract-entry','contract-exit','retire','ethics','account','org','menuMgr','perm','log','announcement'];
  try {
    var rp = JSON.parse(localStorage.getItem('role_permissions') || 'null');
    if (rp) {
      var rpChanged = false;
      ['system','city','district','school'].forEach(function(role) {
        if (rp[role] && rp[role].permissions) {
          FULL_MENU_IDS.forEach(function(mid) {
            if (rp[role].permissions.indexOf(mid) === -1) {
              rp[role].permissions.push(mid);
              rpChanged = true;
            }
          });
        }
      });
      if (rpChanged) { localStorage.setItem('role_permissions', JSON.stringify(rp)); }
    }
  } catch(e) {}

  renderSidebar();
  renderRoleSwitcher();
  updateUserDisplay();
  renderPage();
}

function renderPage() {
  // Permission check: teacher cannot access
  if (currentUser.role === 'teacher') {
    document.getElementById('mainContent').innerHTML =
      '<div class="breadcrumb"><a href="workbench.html">首页</a> &nbsp;/&nbsp; <span>机构管理</span></div>' +
      '<div class="form-card"><div style="text-align:center;padding:40px;color:var(--text-light);">' +

    return;
  }

  // Show add button for city and district admin only
  var addBtn = document.getElementById('addBtn');
  if (currentUser.role === 'system' || currentUser.role === 'city' || currentUser.role === 'district') {
    addBtn.style.display = '';
  } else {
    addBtn.style.display = 'none';
  }

  // Init tree state for district/school admin
  if (currentUser.role === 'district') {
    treeState.selectedDistrict = currentUser.district || '';
  }

  // School admin: redirect to own school detail page
  if (currentUser.role === 'school') {
    var schoolOrgId = null;
    for (var si = 0; si < orgDirectory.length; si++) {
      if (orgDirectory[si].schoolAdminId === currentUser.id) {
        schoolOrgId = orgDirectory[si].orgId;
        break;
      }
    }
    if (schoolOrgId) {
      window.location.href = 'org-detail.html?orgId=' + encodeURIComponent(schoolOrgId);
      return;
    }
    // School admin but no matching org found — show empty state
    document.getElementById('mainContent').innerHTML =
      '<div class="breadcrumb"><a href="workbench.html">首页</a> &nbsp;/&nbsp; <span>机构管理</span></div>' +
      '<div class="form-card"><div style="text-align:center;padding:40px;color:var(--text-light);">' +
      '<p style="font-size:16px;">未找到您的学校信息</p>' +
      '<p style="font-size:13px;margin-top:8px;">请联系管理员配置机构信息</p></div></div>';
    return;
  }

  // Update subtitle
  updateSubtitle();

  renderTree();
  renderFilterTabs();
  renderFilterBar();
  renderList();
}

function updateSubtitle() {
  var sub = document.getElementById('pageSubtitle');
  if (currentUser.role === 'district') {
    var d = currentUser.district || '';
    var cnt = orgDirectory.filter(function(o){return o.district===d && o.status==='active';}).length;
    sub.textContent = d + ' · 共 ' + cnt + ' 所机构';
  } else if (treeState.selectedDistrict === 'all') {
    sub.textContent = '柳州市 · 共 ' + orgDirectory.filter(function(o){return o.status==='active';}).length + ' 所机构';
  } else {
    var cnt = orgDirectory.filter(function(o){return o.district===treeState.selectedDistrict && o.status==='active';}).length;
    sub.textContent = treeState.selectedDistrict + ' · 共 ' + cnt + ' 所机构';
  }
}

// ========== TREE ==========

function buildTreeData() {
  var groups = {};
  for (var i = 0; i < orgDirectory.length; i++) {
    var d = orgDirectory[i].district;
    if (!groups[d]) groups[d] = [];
    groups[d].push(orgDirectory[i]);
  }
  return groups;
}

function renderTree() {
  var groups = buildTreeData();
  var userDistrict = currentUser.district || '';
  var isDistrictAdmin = currentUser.role === 'district';

  // SVG folder icon
  var folderSvg = '<svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';

  var h = '';

  // Root node: 柳州市
  var totalActive = orgDirectory.filter(function(o) { return o.status === 'active'; }).length;
  h += '<div class="tree-node root' + (treeState.selectedDistrict === 'all' ? ' active' : '') + '" onclick="selectDistrict(\'all\')">';
  h += '<span class="tree-dot"></span> 柳州市';
  h += '<span class="tree-count">' + totalActive + '</span>';
  h += '</div>';

  // District nodes — show all districts
  var districts = DISTRICTS;

  for (var i = 0; i < districts.length; i++) {
    var d = districts[i];
    var schools = groups[d] || [];
    var activeCount = schools.filter(function(o) { return o.status === 'active'; }).length;
    var isSelected = treeState.selectedDistrict === d;

    h += '<div class="tree-node' + (isSelected ? ' active' : '') + '" onclick="selectDistrict(\'' + escAttr(d) + '\')">';
    h += folderSvg;
    h += escHtml(d);
    h += '<span class="tree-count' + (activeCount === 0 ? ' zero' : '') + '">' + activeCount + '</span>';
    h += '</div>';
  }

  document.getElementById('treePanel').innerHTML = '<div class="tree-panel-title">区域目录</div>' + h;
}

function selectDistrict(district) {
  treeState.selectedDistrict = district;
  currentPage = 1;
  updateSubtitle();
  renderTree();
  renderFilterTabs();
  renderFilterBar();
  renderList();
}

// ========== FILTER ==========

function renderFilterTabs() {
  var filtered = getFilteredOrgs();
  var counts = { all: 0, pending: 0, active: 0, inactive: 0 };
  for (var i = 0; i < filtered.length; i++) {
    counts.all++;
    if (filtered[i].reviewStatus === 'pending') counts.pending++;
    if ((!filtered[i].reviewStatus || filtered[i].reviewStatus === null) && filtered[i].status === 'active') counts.active++;
    if (filtered[i].status === 'inactive') counts.inactive++;
  }
  var tabs = [
    { value: 'all', label: '全部', count: counts.all },
    { value: 'pending', label: '待审核', count: counts.pending },
    { value: 'active', label: '正常', count: counts.active },
    { value: 'inactive', label: '已停用', count: counts.inactive }
  ];
  var html = '';
  for (var j = 0; j < tabs.length; j++) {
    var t = tabs[j];
    var cls = (filterStatus === t.value) ? ' active' : '';
    html += '<button class="filter-tab' + cls + '" onclick="setFilterStatus(\'' + t.value + '\')">';
    html += escHtml(t.label) + '<span class="count">' + t.count + '</span></button>';
  }
  document.getElementById('filterTabs').innerHTML = html;
}

function setFilterStatus(s) {
  filterStatus = s;
  currentPage = 1;
  renderFilterTabs();
  renderList();
}

function renderFilterBar() {
  var h = '<input type="text" id="searchInput" placeholder="搜索单位名称或编号..." oninput="renderList()">';
  h += '<select id="typeFilter" onchange="renderList()"><option value="all">全部类型</option>';
  for (var j = 0; j < ORG_TYPES.length; j++) {
    h += '<option value="' + escHtml(ORG_TYPES[j]) + '">' + escHtml(ORG_TYPES[j]) + '</option>';
  }
  h += '</select>';
  document.getElementById('filterBar').innerHTML = h;
}

// ========== LIST ==========

function getFilteredOrgs() {
  var dir = orgDirectory.slice();

  // Role-based: school admin only sees own school
  if (currentUser.role === 'school') {
    dir = dir.filter(function(d) { return d.schoolAdminId === currentUser.id; });
  }

  // Role-based: district admin only sees own district
  var userDistrict = currentUser.district || '';
  if (currentUser.role === 'district' && userDistrict) {
    dir = dir.filter(function(d) { return d.district === userDistrict; });
  }

  // Tree-based: filter by selected district
  if (currentUser.role !== 'district' && currentUser.role !== 'school' && treeState.selectedDistrict !== 'all') {
    dir = dir.filter(function(d) { return d.district === treeState.selectedDistrict; });
  }

  return dir;
}

function renderList() {
  // District admin: deny access to non-own districts
  if (currentUser.role === 'district') {
    var userDist = currentUser.district || '';
    if (treeState.selectedDistrict !== userDist && treeState.selectedDistrict !== 'all') {
      document.getElementById('orgTable').innerHTML =
        '<div style="text-align:center;padding:60px 20px;color:var(--text-light);">' +
        '<p style="font-size:16px;margin-bottom:8px;">🔒 无权限查看</p>' +
        '<p style="font-size:13px;">您仅可查看「' + escHtml(userDist) + '」的机构信息，无法查看「' + escHtml(treeState.selectedDistrict) + '」的数据</p>' +
        '</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }
  }

  var dir = getFilteredOrgs();

  // Tab filter
  if (filterStatus === 'pending') {
    dir = dir.filter(function(d) { return d.reviewStatus === 'pending'; });
  } else if (filterStatus === 'active') {
    dir = dir.filter(function(d) { return (!d.reviewStatus || d.reviewStatus === null) && d.status === 'active'; });
  } else if (filterStatus === 'inactive') {
    dir = dir.filter(function(d) { return d.status === 'inactive'; });
  }

  // Type filter
  var typeEl = document.getElementById('typeFilter');
  if (typeEl && typeEl.value !== 'all') {
    dir = dir.filter(function(d) { return d.orgType === typeEl.value; });
  }

  // Search
  var searchEl = document.getElementById('searchInput');
  if (searchEl) {
    var q = searchEl.value.trim().toLowerCase();
    if (q) {
      dir = dir.filter(function(d) {
        return d.orgName.toLowerCase().indexOf(q) >= 0 || d.orgId.toLowerCase().indexOf(q) >= 0 || (d.orgShortName || '').toLowerCase().indexOf(q) >= 0;
      });
    }
  }

  // Pagination
  var total = dir.length;
  var totalPages = Math.ceil(total / pageSize);
  if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
  var start = (currentPage - 1) * pageSize;
  var page = dir.slice(start, start + pageSize);

  var h = '';

  // Single table with paginated data
  h += renderOrgTable(page, '');

  // Pagination controls
  var ph = '';
  if (totalPages > 1) {
    ph += '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="goPage(' + (currentPage - 1) + ')">‹</button>';
    for (var p = 1; p <= totalPages; p++) {
      if (p <= 3 || p > totalPages - 3 || Math.abs(p - currentPage) <= 1) {
        ph += '<button class="' + (p === currentPage ? 'active' : '') + '" onclick="goPage(' + p + ')">' + p + '</button>';
      } else if (p === 4 || p === totalPages - 3) {
        ph += '<button disabled>…</button>';
      }
    }
    ph += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="goPage(' + (currentPage + 1) + ')">›</button>';
    ph += '<span class="page-info">共 ' + totalPages + ' 页 / ' + total + ' 条</span>';
  }
  document.getElementById('pagination').innerHTML = ph;

  document.getElementById('orgTable').innerHTML = h;
}

function renderOrgTable(orgs, title, isPending) {
  var h = title ? '<div style="font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text);">' + title + '</div>' : '';
  h += '<table class="list-table"><thead><tr>';
  h += '<th style="width:50px;">序号</th>';
  h += '<th style="width:120px;">单位编号</th>';
  h += '<th style="width:150px;">统一社会信用代码</th>';
  h += '<th style="width:150px;">单位名称</th>';
  h += '<th style="width:80px;">所属区域</th>';
  h += '<th style="width:90px;">组织类型</th>';
  h += '<th style="width:90px;">单位管理员</th>';
  h += '<th style="width:90px;">更新时间</th>';
  h += '<th style="width:60px;">状态</th>';
  h += '<th style="width:160px;">操作</th>';
  h += '</tr></thead><tbody>';

  if (orgs.length === 0) {
    h += '<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--text-light);">暂无数据</td></tr>';
  }

  for (var i = 0; i < orgs.length; i++) {
    var o = orgs[i];
    var adminText = o.schoolAdminName || o.districtAdminName || '<span style="color:var(--text-light);">未配置</span>';

    // Status display
    var statusCls, statusText;
    if (o.reviewStatus === 'pending') {
      statusCls = 'pending'; statusText = '🟡 待审核';
    } else if (o.status === 'inactive') {
      statusCls = 'inactive'; statusText = '已停用';
    } else {
      statusCls = 'active'; statusText = '🟢 正常';
    }

    h += '<tr>';
    h += '<td>' + (i + 1) + '</td>';
    h += '<td class="col-id">' + escHtml(o.orgId) + '</td>';
    h += '<td style="font-size:12px;font-family:monospace;">' + escHtml(o.creditCode || '-') + '</td>';
    h += '<td class="col-name">' + escHtml(o.orgName) + '</td>';
    h += '<td>' + escHtml(o.district) + '</td>';
    h += '<td>' + escHtml(o.orgType) + '</td>';
    h += '<td>' + adminText + '</td>';
    var updateTime = o.updatedAt || '-';
    if (updateTime !== '-' && updateTime.length === 10) updateTime += ' 00:00:00';
    h += '<td style="font-size:12px;color:var(--text-secondary);">' + escHtml(updateTime) + '</td>';
    h += '<td><span class="status-badge ' + statusCls + '">' + statusText + '</span></td>';
    h += '<td class="col-action"><div class="action-links">';

    var isAdmin = currentUser.role === 'system' || currentUser.role === 'city' || currentUser.role === 'district';
    var isSchool = currentUser.role === 'school';
    var isPending = o.reviewStatus === 'pending';

    // View button: everyone
    h += '<a class="btn-xs btn-xs-outline" href="org-detail.html?orgId=' + encodeURIComponent(o.orgId) + '&mode=view">查看</a>';

    if (isPending) {
      // Pending: admin can review, school can only view
      if (isAdmin) {
        // Check jurisdiction for review
        var canReview = true;
        if (currentUser.role === 'district' && o.district !== (currentUser.district || '')) canReview = false;
        if (currentUser.role === 'city' && o.district !== '市直属') canReview = false;
        // 系统管理员可审核全平台所有待审核机构，不做 district 限制
        if (canReview) {
          h += '<a class="btn-xs btn-xs-primary" href="org-detail.html?orgId=' + encodeURIComponent(o.orgId) + '&action=review">审核</a>';
        }
      }
    } else {
      // Normal state
      if (isAdmin) {
        h += '<a class="btn-xs btn-xs-outline" href="org-ledger-detail.html?school=' + encodeURIComponent(o.orgName) + '&mode=view">台账</a>';
        // Jurisdiction check for edit/disable
        var canEdit = true;
        if (currentUser.role === 'district' && o.district !== (currentUser.district || '')) canEdit = false;
        // 已停用的机构不允许编辑
        if (o.status === 'inactive') canEdit = false;
        if (canEdit) {
          h += '<button class="btn-xs btn-xs-primary" onclick="openEditModal(\'' + escAttr(o.orgId) + '\')">编辑</button>';
          if (o.status === 'active') {
            h += '<button class="btn-xs btn-xs-danger" onclick="openDeleteModal(\'' + escAttr(o.orgId) + '\')">停用</button>';
          } else {
            h += '<button class="btn-xs btn-xs-primary" onclick="confirmReactivate(\'' + escAttr(o.orgId) + '\')">启用</button>';
          }
        } else if (o.status === 'inactive') {
          // 已停用机构仅显示启用按钮
          h += '<button class="btn-xs btn-xs-primary" onclick="confirmReactivate(\'' + escAttr(o.orgId) + '\')">启用</button>';
        }
      } else if (isSchool) {
        // School: can only edit their own active school
        if (o.status === 'active') {
          h += '<a class="btn-xs btn-xs-primary" href="org-detail.html?orgId=' + encodeURIComponent(o.orgId) + '&action=edit">编辑</a>';
        }
      }
    }

    h += '</div></td>';
    h += '</tr>';
  }
  h += '</tbody></table>';
  return h;
}

function goPage(p) {
  currentPage = p;
  renderList();
}

// ========== ADD / EDIT MODAL ==========

function openAddModal() {
  editingOrgId = null;
  document.getElementById('formModalTitle').textContent = '新增机构';
  document.getElementById('formSaveBtn').textContent = '确认保存';

  // Clear form
  var fields = ['fOrgName','fOrgShortName','fCreditCode','fAddress','fPhone','fPostcode'];
  for (var i = 0; i < fields.length; i++) { document.getElementById(fields[i]).value = ''; }
  document.getElementById('fOrgType').value = '学校';
  document.getElementById('fSchoolType').value = '初中';
  document.getElementById('fSchoolCategory').value = '普通高中';
  document.getElementById('fOrgLevel').value = '正科级';
  document.getElementById('fOrgNature').value = '事业单位';
  document.getElementById('fFundType').value = '全额拨款';
  document.getElementById('fUnitType').value = '公益一类';

  // Populate district dropdown, default to current tree selection
  // District admin: lock to own district
  if (currentUser.role === 'district') {
    populateDistrictSelect(currentUser.district || '');
    document.getElementById('fDistrict').disabled = true;
  } else {
    var defaultDistrict = (treeState.selectedDistrict !== 'all') ? treeState.selectedDistrict : '';
    populateDistrictSelect(defaultDistrict);
    document.getElementById('fDistrict').disabled = false;
  }
  populateAdminSelects('');

  onOrgTypeChange();
  document.getElementById('formModal').classList.add('show');
}

function openEditModal(orgId) {
  var o = null;
  for (var i = 0; i < orgDirectory.length; i++) {
    if (orgDirectory[i].orgId === orgId) { o = orgDirectory[i]; break; }
  }
  if (!o) return;
  // 已停用的机构不允许编辑
  if (o.status === 'inactive') { showToast('已停用的机构不可编辑，请先启用', 'warning'); return; }

  editingOrgId = orgId;
  document.getElementById('formModalTitle').textContent = '编辑机构';
  document.getElementById('formSaveBtn').textContent = '保存修改';

  // Fill form
  document.getElementById('fOrgName').value = o.orgName || '';
  document.getElementById('fOrgShortName').value = o.orgShortName || '';
  document.getElementById('fOrgType').value = o.orgType || '学校';
  document.getElementById('fSchoolType').value = o.schoolType || '初中';
  document.getElementById('fSchoolCategory').value = o.schoolCategory || '普通高中';
  document.getElementById('fOrgLevel').value = o.orgLevel || '正科级';
  document.getElementById('fOrgNature').value = o.orgNature || '事业单位';
  document.getElementById('fFundType').value = o.fundType || '全额拨款';
  document.getElementById('fCreditCode').value = o.creditCode || '';
  document.getElementById('fUnitType').value = o.unitType || '公益一类';
  document.getElementById('fAddress').value = o.address || '';
  document.getElementById('fPhone').value = o.phone || '';
  document.getElementById('fPostcode').value = o.postcode || '';

  populateDistrictSelect(o.district || '');
  // District admin: lock district field
  if (currentUser.role === 'district') {
    document.getElementById('fDistrict').disabled = true;
  } else {
    document.getElementById('fDistrict').disabled = false;
  }
  populateAdminSelects(o);
  onOrgTypeChange();

  document.getElementById('formModal').classList.add('show');
}

function closeFormModal() {
  document.getElementById('formModal').classList.remove('show');
  editingOrgId = null;
}

function populateDistrictSelect(selected) {
  var sel = document.getElementById('fDistrict');
  sel.innerHTML = '';
  for (var i = 0; i < DISTRICTS.length; i++) {
    var s = (DISTRICTS[i] === selected) ? ' selected' : '';
    sel.innerHTML += '<option value="' + escHtml(DISTRICTS[i]) + '"' + s + '>' + escHtml(DISTRICTS[i]) + '</option>';
  }
}

function getDistrictCategory(district) {
  if (district === '市直属') return '市直属';
  if (district.indexOf('区') >= 0) return '区属';
  if (district.indexOf('县') >= 0) return '县属';
  return '其他';
}

function onOrgTypeChange() {
  var t = document.getElementById('fOrgType').value;

  // 学校类型：学校和局属二层机构显示
  document.getElementById('fgSchoolType').style.display = (t === '学校' || t === '局属二层机构') ? '' : 'none';

  // 单位性质默认值（仅新增时自动设置，编辑时保留已有值）
  if (!editingOrgId) {
    var natureEl = document.getElementById('fOrgNature');
    if (t === '行政管理部门') {
      natureEl.value = '机关单位';
    } else {
      natureEl.value = '事业单位';
    }
  }

  // 经费形式：行政管理部门锁定全额拨款
  var fundEl = document.getElementById('fFundType');
  if (t === '行政管理部门') {
    fundEl.value = '全额拨款';
    fundEl.disabled = true;
  } else {
    fundEl.disabled = false;
    onUnitTypeChange();
  }
}

function onUnitTypeChange() {
  var ut = document.getElementById('fUnitType').value;
  var ft = document.getElementById('fFundType');
  if (ft.disabled) return;
  switch (ut) {
    case '公益一类': ft.value = '全额拨款'; break;
    case '公益二类': ft.value = '差额拨款'; break;
    case '行政部门': ft.value = '全额拨款'; break;
  }
}

function populateAdminSelects(orgData) {
  var schoolSel = document.getElementById('fSchoolAdmin');

  schoolSel.innerHTML = '<option value="">未分配</option>';

  for (var i = 0; i < ADMIN_ACCOUNTS.length; i++) {
    var a = ADMIN_ACCOUNTS[i];
    if (a.role === 'school') {
      var s = (orgData && orgData.schoolAdminId === a.id) ? ' selected' : '';
      schoolSel.innerHTML += '<option value="' + a.id + '"' + s + '>' + escHtml(a.name) + '</option>';
    }
  }
}

function saveOrg() {
  var name = document.getElementById('fOrgName').value.trim();
  if (!name) { showToast('请输入单位名称', 'warning'); return; }

  var district = document.getElementById('fDistrict').value;
  if (!district) { showToast('请选择所属区域', 'warning'); return; }

  // District admin: forbid cross-district operation
  if (currentUser.role === 'district' && district !== (currentUser.district || '')) {
    showToast('无权操作其他区的学校', 'warning'); return;
  }

  var creditCode = document.getElementById('fCreditCode').value.trim();
  if (!creditCode) { showToast('请输入统一社会信用代码', 'warning'); return; }
  if (creditCode.length !== 18) { showToast('统一社会信用代码须为18位', 'warning'); return; }

  var schoolAdminId = document.getElementById('fSchoolAdmin').value;
  if (!schoolAdminId) { showToast('请选择单位管理员', 'warning'); return; }

  if (!document.getElementById('fSchoolCategory').value) { showToast('请选择岗位设置分类', 'warning'); return; }
  if (!document.getElementById('fAddress').value.trim()) { showToast('请输入单位地址', 'warning'); return; }
  if (!document.getElementById('fPhone').value.trim()) { showToast('请输入联系电话', 'warning'); return; }
  if (!document.getElementById('fPostcode').value.trim()) { showToast('请输入邮编', 'warning'); return; }

  var orgType = document.getElementById('fOrgType').value;
  var schoolType = document.getElementById('fSchoolType').value;
  var unitType = document.getElementById('fUnitType').value;
  var schoolAdminName = '';

  // Resolve admin name
  for (var i = 0; i < ADMIN_ACCOUNTS.length; i++) {
    if (ADMIN_ACCOUNTS[i].id === schoolAdminId) schoolAdminName = ADMIN_ACCOUNTS[i].name;
  }

  var now = new Date();
  var dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

  if (editingOrgId) {
    // Edit existing — capture old data for change log
    var oldOrg = null;
    for (var j = 0; j < orgDirectory.length; j++) {
      if (orgDirectory[j].orgId === editingOrgId) { oldOrg = JSON.parse(JSON.stringify(orgDirectory[j])); break; }
    }
    for (var j = 0; j < orgDirectory.length; j++) {
      if (orgDirectory[j].orgId === editingOrgId) {
        orgDirectory[j].orgName = name;
        orgDirectory[j].orgShortName = document.getElementById('fOrgShortName').value.trim();
        orgDirectory[j].district = district;
        orgDirectory[j].orgType = orgType;
        orgDirectory[j].schoolType = schoolType;
        orgDirectory[j].schoolCategory = document.getElementById('fSchoolCategory').value;
        orgDirectory[j].unitType = unitType;
        orgDirectory[j].orgLevel = document.getElementById('fOrgLevel').value;
        orgDirectory[j].orgNature = document.getElementById('fOrgNature').value;
        orgDirectory[j].fundType = document.getElementById('fFundType').value;
        orgDirectory[j].creditCode = document.getElementById('fCreditCode').value.trim();
        orgDirectory[j].address = document.getElementById('fAddress').value.trim();
        orgDirectory[j].phone = document.getElementById('fPhone').value.trim();
        orgDirectory[j].postcode = document.getElementById('fPostcode').value.trim();
        orgDirectory[j].schoolAdminId = schoolAdminId;
        orgDirectory[j].schoolAdminName = schoolAdminName;
        orgDirectory[j].updatedAt = dateStr;
        // Record change log — school submits for review, admin edits directly
        if (currentUser.role === 'school') {
          orgDirectory[j].reviewStatus = 'pending';
          var newOrg2 = JSON.parse(JSON.stringify(orgDirectory[j]));
          var changes2 = buildChangeLog(oldOrg, newOrg2);
          addChangeLog(orgDirectory[j], 'submit_review', changes2);
          showToast('已提交审核，请等待主管单位审核', 'success');
        } else {
          orgDirectory[j].reviewStatus = null;
          var newOrg2 = JSON.parse(JSON.stringify(orgDirectory[j]));
          var changes2 = buildChangeLog(oldOrg, newOrg2);
          if (changes2.length > 0) { addChangeLog(orgDirectory[j], 'edit', changes2); }
          showToast('机构「' + name + '」已更新', 'success');
          if (typeof writeLog === 'function') writeLog({ module: 'org', actionType: 'update', targetType: 'org', targetId: editingOrgId, targetName: name, detail: '修改机构信息', result: 'success' });
        }
        break;
      }
    }
  } else {
    // Add new
    var regionCode = REGION_CODE[district] || '99';
    var seq = 1;
    for (var k = 0; k < orgDirectory.length; k++) {
      if (orgDirectory[k].district === district) {
        var parts = orgDirectory[k].orgId.split('-');
        var n = parseInt(parts[2]) || 0;
        if (n >= seq) seq = n + 1;
      }
    }
    var newId = 'gxlzh-' + regionCode + '-' + String(seq).padStart(3,'0');

    var newOrg = {
      orgId: newId,
      orgName: name,
      orgShortName: document.getElementById('fOrgShortName').value.trim(),
      district: district,
      orgType: orgType,
      schoolType: schoolType,
      schoolCategory: document.getElementById('fSchoolCategory').value,
      unitType: unitType,
      orgLevel: document.getElementById('fOrgLevel').value,
      orgNature: document.getElementById('fOrgNature').value,
      fundType: document.getElementById('fFundType').value,
      creditCode: document.getElementById('fCreditCode').value.trim(),
      status: 'active',
      schoolAdminId: schoolAdminId,
      schoolAdminName: schoolAdminName,
      address: document.getElementById('fAddress').value.trim(),
      phone: document.getElementById('fPhone').value.trim(),
      postcode: document.getElementById('fPostcode').value.trim(),
      createdAt: dateStr,
      updatedAt: dateStr,
      reviewStatus: null
    };
    // Record create log
    addChangeLog(newOrg, 'create', null);
    orgDirectory.push(newOrg);
    showToast('机构「' + name + '」已创建', 'success');
    if (typeof writeLog === 'function') writeLog({ module: 'org', actionType: 'create', targetType: 'org', targetId: newId, targetName: name, detail: '新增机构', result: 'success' });
  }

  localStorage.setItem('org_directory', JSON.stringify(orgDirectory));
  closeFormModal();
  currentPage = 1;
  updateSubtitle();
  renderTree();
  renderFilterTabs();
  renderList();
}

// ========== DELETE ==========

function openDeleteModal(orgId) {
  deletingOrgId = orgId;
  for (var i = 0; i < orgDirectory.length; i++) {
    if (orgDirectory[i].orgId === orgId) {
      document.getElementById('confirmTitle').textContent = '确认停用';
      document.getElementById('confirmMsg').textContent = '确定要停用机构「' + orgDirectory[i].orgName + '」吗？';
      document.getElementById('confirmSubMsg').textContent = '停用后该机构将从活动列表中隐藏，但数据保留。';
      document.getElementById('confirmBtn').className = 'btn btn-danger';
      document.getElementById('confirmBtn').textContent = '确认停用';
      document.getElementById('confirmBtn').onclick = confirmDelete;
      break;
    }
  }
  document.getElementById('confirmModal').classList.add('show');
}

function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('show');
  deletingOrgId = null;
}

function confirmDelete() {
  if (!deletingOrgId) return;
  for (var i = 0; i < orgDirectory.length; i++) {
    if (orgDirectory[i].orgId === deletingOrgId) {
      // District admin: verify ownership
      if (currentUser.role === 'district' && orgDirectory[i].district !== (currentUser.district || '')) {
        showToast('无权操作其他区的学校', 'warning'); closeConfirm(); return;
      }
      // Check for active accounts associated with this org
      var orgName = orgDirectory[i].orgName;
      var activeAccountCount = 0;
      try {
        var teachers = JSON.parse(localStorage.getItem('teacher_accounts') || '[]');
        for (var ta = 0; ta < teachers.length; ta++) {
          if (teachers[ta].school === orgName && teachers[ta].status === 'active') activeAccountCount++;
        }
        var admins = JSON.parse(localStorage.getItem('admin_accounts') || '[]');
        for (var aa = 0; aa < admins.length; aa++) {
          if (admins[aa].school === orgName && admins[aa].status !== 'disabled') activeAccountCount++;
        }
      } catch(e) {}
      if (activeAccountCount > 0) {
        showToast('该机构下还有 ' + activeAccountCount + ' 个正常账号，请先处理后再停用', 'warning'); closeConfirm(); return;
      }
      orgDirectory[i].status = 'inactive';
      var now = new Date();
      orgDirectory[i].updatedAt = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
      addChangeLog(orgDirectory[i], 'disable', null);
      showToast('机构「' + orgDirectory[i].orgName + '」已停用', 'success');
      if (typeof writeLog === 'function') writeLog({ module: 'org', actionType: 'disable', targetType: 'org', targetId: deletingOrgId, targetName: orgDirectory[i].orgName, detail: '停用机构', result: 'success' });
      break;
    }
  }
  localStorage.setItem('org_directory', JSON.stringify(orgDirectory));
  closeConfirm();
  updateSubtitle();
  renderTree();
  renderFilterTabs();
  renderList();
}

function confirmReactivate(orgId) {
  var o = null;
  for (var i = 0; i < orgDirectory.length; i++) {
    if (orgDirectory[i].orgId === orgId) { o = orgDirectory[i]; break; }
  }
  if (!o) return;
  document.getElementById('confirmTitle').textContent = '确认启用';
  document.getElementById('confirmMsg').textContent = '确定要启用机构「' + o.orgName + '」吗？';
  document.getElementById('confirmSubMsg').textContent = '启用后该机构将恢复在活动列表中显示。';
  document.getElementById('confirmBtn').className = 'btn btn-primary';
  document.getElementById('confirmBtn').textContent = '确认启用';
  document.getElementById('confirmBtn').onclick = function() { reactivateOrg(orgId); closeConfirm(); };
  document.getElementById('confirmModal').classList.add('show');
}

function reactivateOrg(orgId) {
  for (var i = 0; i < orgDirectory.length; i++) {
    if (orgDirectory[i].orgId === orgId) {
      // District admin: verify ownership
      if (currentUser.role === 'district' && orgDirectory[i].district !== (currentUser.district || '')) {
        showToast('无权操作其他区的学校', 'warning'); return;
      }
      orgDirectory[i].status = 'active';
      var now = new Date();
      orgDirectory[i].updatedAt = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
      addChangeLog(orgDirectory[i], 'enable', null);
      showToast('机构「' + orgDirectory[i].orgName + '」已启用', 'success');
      if (typeof writeLog === 'function') writeLog({ module: 'org', actionType: 'enable', targetType: 'org', targetId: orgId, targetName: orgDirectory[i].orgName, detail: '启用机构', result: 'success' });
      break;
    }
  }
  localStorage.setItem('org_directory', JSON.stringify(orgDirectory));
  updateSubtitle();
  renderTree();
  renderFilterTabs();
  renderList();
}

// ========== UTILS ==========

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success') + ' show';
  clearTimeout(t._timeout);
  t._timeout = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function buildChangeLog(oldOrg, newOrg, operator) {
  var changes = [];
  var fields = [
    { key: 'orgName', label: '单位名称' },
    { key: 'orgShortName', label: '单位简称' },
    { key: 'district', label: '所属区域' },
    { key: 'orgLevel', label: '单位级别' },
    { key: 'orgType', label: '组织类型' },
    { key: 'schoolType', label: '学校类型' },
    { key: 'schoolCategory', label: '岗位设置分类' },
    { key: 'orgNature', label: '单位性质' },
    { key: 'unitType', label: '单位类型' },
    { key: 'fundType', label: '经费类型' },
    { key: 'creditCode', label: '统一社会信用代码' },
    { key: 'schoolAdminName', label: '单位管理员' },
    { key: 'address', label: '单位地址' },
    { key: 'phone', label: '联系电话' },
    { key: 'postcode', label: '邮编' }
  ];
  fields.forEach(function(f) {
    var oldVal = (oldOrg[f.key] !== undefined ? oldOrg[f.key] : '');
    var newVal = (newOrg[f.key] !== undefined ? newOrg[f.key] : '');
    if (String(oldVal) !== String(newVal)) {
      changes.push({ field: f.label, from: String(oldVal) || '(空)', to: String(newVal) || '(空)' });
    }
  });
  return changes;
}

function addChangeLog(org, type, changes, operator) {
  if (!org.changeLog) org.changeLog = [];
  var now = new Date();
  var ts = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' +
           String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  var entry = { type: type, time: ts, operator: operator || currentUser.name || '管理员', operatorRole: getRoleLabel(currentUser.role) };
  if (changes && changes.length > 0) entry.changes = changes;
  org.changeLog.push(entry);
}

function getRoleLabel(role) {
  switch (role) {
    case 'city': return '市管理员';
    case 'district': return '区管理员';
    case 'school': return '校管理员';
    default: return role || '';
  }
}

function escHtml(s) {
  if (!s && s !== 0) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  if (!s && s !== 0) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

window.onerror = function(msg, url, line, col, err) {
  var el = document.getElementById('mainContent');
  if (el) el.innerHTML = '<div class="form-card"><div style="padding:20px;color:var(--danger);"><strong>页面错误</strong><p style="font-size:12px;margin-top:8px;word-break:break-all;">' + escHtml(String(msg)) + '<br>行: ' + line + ' 列: ' + col + '</p></div></div>';
  return true;
};
